": 10, "text": "A 40-year-old man presents to the clinic requesting an HIV test. He had unprotected sexual\ncontact with another man 3 weeks ago. Antibodies against which of the following will be\ndetected first by ELISA or Western blot?", "options": [{"id": "A", "text": "gp120"}, {"id": "B", "text": "gp 41"}, {"id": "C", "text": "p24"}, {"id": "D", "text": "p55"}], "correctIndex": 1, "correctLetter": "B", "solution": "Antibodies against gp41 will be detected first by ELISA or Western blot.\nAntibodies to HIV usually appear within 3-6 weeks of primary infection. The appearance of\nHIV-binding antibodies occurs prior to the appearance of neutralizing antibodies. The only viral\nproteins that elicit neutralizing antibodies are the envelope proteins gp120 and gp41.\nThe order of appearance of antibodies is as follows:\nAntibody to envelope gp41 > Antibodies to gag protein (p24 and p55) > Antibodies to\nenvelope gp120 > Antibodies to gag protein p17 > Antibodies to pol gene products (p31 and\np66).\nNote: The earliest antigen to appear in the blood following HIV infection is p24.", "questionPages": [392], "solutionPages": [397], "questionFigures": [], "solutionFigures": []}, {"id": "ch24-q11", "chapterId": 24, "chapter": "HIV", "number": 11, "text": "You are an officer with the Center for Disease Control and are screening a high-risk\npopulation for HIV. Which of the following methods will you use as a screening tool?", "options": [{"id": "A", "text": "Western blot"}, {"id": "B", "text": "ELISA"}, {"id": "C", "text": "DNA PCR"}, {"id": "D", "text": "p24 antigen assay"}], "correctIndex": 1, "correctLetter": "B", "solution": "ELISA is most commonly used as a screening test for HIV.\n\n\n\nScreening tests possess high sensitivity but are not highly specific. ELISA is a simple, relatively\ninexpensive screening test.\nThe most commonly used confirmatory test is Western blot. Western blot demonstrating\nantibodies to products of all three of the major genes of HIV (gag, pol, and env) is conclusive\nevidence of infection with HIV. It is considered positive if it shows antibodies against at least two\nof the following gene products: p24, gp41, gp120/160.", "questionPages": [392, 393], "solutionPages": [397, 398], "questionFigures": [], "solutionFigures": []}, {"id": "ch25-q1", "chapterId": 25, "chapter": "Myxoviruses and Rhabdoviruses", "number": 1, "text": "Which of the following RNA viruses has an 8 segmented genome with its site of replication\nbeing the nucleus?", "options": [{"id": "A", "text": "Influenza virus"}, {"id": "B", "text": "Measles virus"}, {"id": "C", "text": "Rubella virus"}, {"id": "D", "text": "Mumps virus"}], "correctIndex": 0, "correctLetter": "A", "solution": "Influenza virus has an 8 segmented genome. Its site of replication is the nucleus, unlike other\nRNA viruses. Influenza virus belongs to the Orthomyxoviridae family.\nMost DNA viruses replicate in the nucleus, except pox. Most RNA viruses replicate in the\ncytoplasm, except retroviruses and orthomyxoviruses.\nExamples of segmented viruses (ARBO):\n+ Arenavirus (2 segments)\n* Rotavirus (11 segments)\n« Bunyavirus (3 segments)\n* Orthomyxovirus (8 segments)\nThe image below shows the segmented genome seen in the influenza virus (Orthomyxoviridae)", "questionPages": [399], "solutionPages": [], "questionFigures": [], "solutionFigures": ["crop-solution-ch25-q1-1"]}, {"id": "ch25-q2", "chapterId": 25, "chapter": "Myxoviruses and Rhabdoviruses", "number": 2, "text": "A microbiologist working on influenza virus in a lab, observes reversal of hemagglutination.\nWhat is this phenomenon known as?", "options": [{"id": "A", "text": "Hemolysis"}, {"id": "B", "text": "Precipitation"}, {"id": "C", "text": "Elution"}, {"id": "D", "text": "Complement fixation"}], "correctIndex": 2, "correctLetter": "C", "solution": "Elution is the process of reversal of hemagglutination and the release of the virus from the red cell\nsurface.\nInfluenza virus contains two surface antigens:\n+ Hemagglutinin (HA) - causes RBC agglutination; facilitates viral entry into cells\n+ Neuraminidase (NA) - an enzyme that destroys the receptor HA uses to bind to RBCs causing\nelution/reversal of hemagglutination. Hence, it is also called a receptor destroying enzyme (RDE).", "questionPages": [399], "solutionPages": [407], "questionFigures": [], "solutionFigures": ["crop-solution-ch25-q2-1"]}, {"id": "ch25-q3", "chapterId": 25, "chapter": "Myxoviruses and Rhabdoviruses", "number": 3, "text": "Which of the following statements is true regarding antigenic drift?", "options": [{"id": "A", "text": "There is a gradual sequential change in antigenic structure"}, {"id": "B", "text": "It doesn’t account for the periodic epidemics of influenza"}, {"id": "C", "text": "The new antigens thus formed are totally unrelated to the previous antigens"}, {"id": "D", "text": "Antibodies to the predecessor viruses do not neutralise the new variants"}], "correctIndex": 0, "correctLetter": "A", "solution": "Antigenic drift causes a gradual sequential change in antigenic structure.\nIt accounts for periodic epidemics. This property forms the basis for the development of annual\ninfluenza vaccines.\nAntigenic variation is a property of influenza viruses by which it alters the antigenic structure on\nits surface and thus avoids a host immune response. It is of two types - Antigenic shift and\nantigenic drift.", "questionPages": [399], "solutionPages": [407, 408], "questionFigures": [], "solutionFigures": ["crop-solution-ch25-q3-1", "crop-solution-ch25-q3-2"]}, {"id": "ch25-q4", "chapterId": 25, "chapter": "Myxoviruses and Rhabdoviruses", "number": 4, "text": "Which of the following organisms is represented by the given form of replication?", "options": [{"id": "A", "text": "Hepatitis virus"}, {"id": "B", "text": "Influenza virus"}, {"id": "C", "text": "HIV"}, {"id": "D", "text": "Herpes virus"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given image shows the replication of influenza virus.\nStages of replication:\n+ Attachment, penetration, uncoating- the virus is internalized by receptor-mediated endocytosis\n¢ Transcription and translation- Viral transcription occurs in the nucleus. The mRNAs are\nproduced from viral nucleocapsids.\n+ Viral RNA replication- Viral genome replication is accomplished by the same virus-encoded\npolymerase proteins involved in transcription.\n* Maturation- The virus matures by budding from the surface of the cell.", "questionPages": [399, 400], "solutionPages": [408], "questionFigures": ["crop-question-ch25-q4-1"], "solutionFigures": []}, {"id": "ch25-q5", "chapterId": 25, "chapter": "Myxoviruses and Rhabdoviruses", "number": 5, "text": "You receive multiple patients from a poultry farm presenting with fever, dyspnea, cold, and\ncough. You suspect an outbreak of Avian flu. Which of the following virus strains causes the\nsame?", "options": [{"id": "A", "text": "HiN1"}, {"id": "B", "text": "H5N1"}, {"id": "C", "text": "H3N2"}, {"id": "D", "text": "H2N2"}], "correctIndex": 1, "correctLetter": "B", "solution": "H5N1 is a strain of avian influenza.\nTransmission occurs only from birds (e.g. poultry). Recombination occurs\nin pigs. Human-to-human transmission is very rare.\nIt causes flu-like symptoms and can cause severe respiratory illness.\nOption A: H1iNi causes swine flu\nOption C: H3N2 causes Hong Kong flu\nOption D: H2N2 caused a pandemic in 1957", "questionPages": [400], "solutionPages": [408], "questionFigures": [], "solutionFigures": []}, {"id": "ch25-q6", "chapterId": 25, "chapter": "Myxoviruses and Rhabdoviruses", "number": 6, "text": "A 4-year-old girl with a history of fever, rhinorrhea, sore throat, and myalgia presented with\nmultiple episodes of vomiting and seizures. She was diagnosed with Reye's syndrome. Which\nof the following is incorrect about the most likely etiological agent?", "options": [{"id": "A", "text": "Virus shedding is present before symptoms begins"}, {"id": "B", "text": "5-12 years is a high risk group"}, {"id": "C", "text": "Aquatic birds act as reservoir"}, {"id": "D", "text": "Secondary attack rate is 5-15%"}], "correctIndex": 1, "correctLetter": "B", "solution": "The most likely etiological agent in the given case of Reye's syndrome is the influenza virus.\nChildren <5-years, especially those <2-years of age are at the highest risk of serious\ncomplications related to influenza infection. Other high-risk groups for influenza include\nadults >60 years of age, persons with chronic diseases, persons who are immunocompromised.\nOption A: The virus is shed in respiratory secretions a day before the onset of illness and for 3-4\ndays thereafter.\nOption C: Birds, especially aquatic birds act as reservoirs of influenza viruses.\nOption D: Secondary attack rate is 5-15%.\n\n\n\nNote: Reye's syndrome is precipitated by the interaction of a viral infection (such as\ninfluenza) with salicylates. Therefore, aspirin is not given to pediatric patients with influenza and\ninfluenza-like illness.", "questionPages": [400, 401], "solutionPages": [408, 409], "questionFigures": [], "solutionFigures": []}, {"id": "ch25-q7", "chapterId": 25, "chapter": "Myxoviruses and Rhabdoviruses", "number": 7, "text": "A 12-year-old boy is brought to the OPD with complaints of headache and drowsiness since 2\ndays. He had a history of fever, ear pain, and difficulty in swallowing for 1 week. On\nexamination, you see the following. Brudzinki's sign is positive. What is the most likely\ndiagnosis?", "options": [{"id": "A", "text": "Croup"}, {"id": "B", "text": "Mumps"}, {"id": "C", "text": "Infectious mononucleosis"}, {"id": "D", "text": "Herpangina"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given clinical scenario with fever, parotitis, headache, drowsiness, and positive Brudzinki's\nsign is suggestive of meningitis secondary to mumps.\nMumps is caused by the mumps virus and is characterized by fever, bilateral or unilateral parotid\nswelling which may be tender. Parotitis can present with ear pain and difficulty in swallowing. It\nusually resolves in a week.\nMeningoencephalitis/aseptic meningitis can occur before, along with, or after parotitis. Most\ncommonly, it manifests 5 days after parotitis. It can present with headache, neck stiffness, and\ndrowsiness.\nComplications of mumps:\n+ Aseptic meningitis or meningoencephalitis\n+ Epididymo-orchitis- Usually unilateral. Seen in post-pubertal males\n* Oophoritis\n* Other complications include pancreatitis and myocarditis\nNote: Non-mumps parotitis can be caused by:\n+ Epstein-Barr virus - causes infectious mononucleosis\n* Coxsackievirus - causes herpangina\n+ Parainfluenza virus - causes croup", "questionPages": [401], "solutionPages": [409], "questionFigures": ["crop-question-ch25-q7-1"], "solutionFigures": []}, {"id": "ch25-q8", "chapterId": 25, "chapter": "Myxoviruses and Rhabdoviruses", "number": 8, "text": "A 9-month-old child is brought to the OPD for MMR vaccine. Which strain of mumps virus is\nused in the same?", "options": [{"id": "A", "text": "Edmonston-Zagreb strain"}, {"id": "B", "text": "Nakayama strain"}, {"id": "C", "text": "Jeryl-Lynn strain"}, {"id": "D", "text": "RA 27/3"}], "correctIndex": 2, "correctLetter": "C", "solution": "The strain of mumps virus used in the MMR vaccine (Measles, Mumps, Rubella) is the Jeryl-Lynn\nstrain.\nThe virus is attenuated by serial passage in embryonated eggs and grown in chick embryo\nfibroblast culture.\nNote: The schedule of MMR vaccine as per the National Immunisation Schedule is from 9\ncompleted months to 12 months. (can be given till 5 years of age).", "questionPages": [401, 402], "solutionPages": [409], "questionFigures": [], "solutionFigures": []}, {"id": "ch25-q9", "chapterId": 25, "chapter": "Myxoviruses and Rhabdoviruses", "number": 9, "text": "A mother brings her 5-month-old baby to the casualty with complaints of fast breathing and\npoor feeding. She also gives a history of fever, cold, and cough for 3 days. On examination,\nnasal flaring and expiratory wheeze are present. Which of the following statements is false\nabout the viral etiology of the same?", "options": [{"id": "A", "text": "The cytopathic effect is syncytium formation"}, {"id": "B", "text": "Ribavirin is the drug of choice"}, {"id": "C", "text": "Omalizumab is given for prophylaxis"}, {"id": "D", "text": "It is the most important cause of bronchiolitis"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given clinical scenario is suggestive of bronchiolitis caused by the respiratory syncytial virus\n(RSV). Palivizumab is given for RSV prophylaxis in high-risk infants such as premature babies,\n\n\n\nimmunocompromised infants, etc.\nOption A - The characteristic cytopathic effect is syncytium formation (multinucleated giant cell).\nOption B - Inhaled ribavirin is the drug of choice.\nOption D - RSV causes upper and lower respiratory tract infections in infants, and is the most\ncommon cause of bronchiolitis from ages 6 weeks to 6 months. It can cause pneumonia and\ntracheobronchitis and is common during winters and monsoon.", "questionPages": [402], "solutionPages": [409, 410], "questionFigures": [], "solutionFigures": []}, {"id": "ch25-q10", "chapterId": 25, "chapter": "Myxoviruses and Rhabdoviruses", "number": 10, "text": "An unimmunized man presents with fever, malaise, and an erythematous rash starting from\nbehind the ears and progressing to the face and trunk. Given below is an image of lymphoid\ntissue taken from this patient. What pathological finding do you see here?", "options": [{"id": "A", "text": "Warthin-Finkeldey giant cells"}, {"id": "B", "text": "Warthin-Starry stain"}, {"id": "C", "text": "Langhans giant cells"}, {"id": "D", "text": "Aschoff giant cells"}], "correctIndex": 0, "correctLetter": "A", "solution": "Warthin-Finkeldey cells are seen here. These are multinucleate giant cells, which are found in the\nlymphoid tissues of patients with measles.\nThe cytopathic effect of measles consists of multinucleate syncytium formation with numerous\nacidophilic nuclear and cytoplasmic inclusions, as shown in the image below.\nOption B: Warthin-Starry stain is used to detect spirochetes and to stain H. pylori and B. henselae\nOption C: Langhans giant cells are seen in tuberculosis\nOption D: Aschoff giant cells are seen in rheumatic fever", "questionPages": [402], "solutionPages": [410], "questionFigures": ["crop-question-ch25-q10-1"], "solutionFigures": ["crop-solution-ch25-q10-1"]}, {"id": "ch25-q11", "chapterId": 25, "chapter": "Myxoviruses and Rhabdoviruses", "number": 11, "text": "A 3-year-old boy with no prior immunization history presents with fever, cough, and coryza.\nOn examination of the buccal mucosa, you see the following. Which stage of the disease is\nthis finding seen in?", "options": [{"id": "A", "text": "Prodromal stage"}, {"id": "B", "text": "Post measles stage"}, {"id": "C", "text": "Eruptive stage"}, {"id": "D", "text": "All the stages"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given image shows Koplik’s spots present in measles. They are seen during the prodromal\nphase of the illness.\nKoplik's spots are small bluish-white ulcerations on the buccal mucosa opposite to the first and\nsecond lower molars and are pathognomonic of measles. They contain giant cells, cytoplasmic and\nintranuclear inclusions, and virion components. They can involve the entire buccal mucosa and\nfade as the maculopapular rash develops.\n\n\n\nStages of measles:\nThe natural history of measles has 3 stages as follows:\n+ Prodromal stage - It begins 10 days after infection and lasts until day 14. It consists of cough,\ncoryza, redness of eyes, lacrimation, photophobia, vomiting, and diarrhea. Koplik's spots appear\nin this stage.\n+ Eruptive stage - A dusky, red maculopapular rash appears. It starts behind the ears spreads\ndownwards to the trunk and lower extremities. Antibodies appear in this stage and are detectable\nby IgM ELISA. The symptoms such as fever and rash usually resolve spontaneously or go on to\ndevelop complications.\n+ Post-measles stage - Weakness and weight loss may persist. The infection may become chronic\nand cause secondary infections such as cancrum oris, candidiasis etc.\nThe image below shows Koplik's spots\nThe image below shows the characteristic maculopapular rash in measles", "questionPages": [402, 403], "solutionPages": [410, 411, 412], "questionFigures": ["crop-question-ch25-q11-1"], "solutionFigures": ["crop-solution-ch25-q11-1"]}, {"id": "ch25-q12", "chapterId": 25, "chapter": "Myxoviruses and Rhabdoviruses", "number": 12, "text": "Which of the following disease has the highest mortality once clinically manifested?", "options": [{"id": "A", "text": "Nipah"}, {"id": "B", "text": "Rabies"}, {"id": "C", "text": "Ebola"}, {"id": "D", "text": "Zika"}], "correctIndex": 1, "correctLetter": "B", "solution": "Rabies is a vaccine-preventable, zoonotic, viral disease. Once clinical symptoms appear, rabies is\nvirtually 100% fatal.\nSpread of rabies:\n* Centripetal spread -\n+ The virus enters the peripheral neurons, it moves via retrograde fast axonal transport towards\nthe spinal cord or brainstem a.k.a the central nervous system (CNS) at a speed of up to 250\nmm/day.\n* Once within CNS, it spreads quickly to other regions in the CNS through fast axonal transport. It\ninfects neurons primarily, but may rarely infect astrocytes.\n* Centrifugal spread - After CNS infection is established, it spreads along the sensory and\nautonomic nerves to:\n+ Salivary glands\n¢ Adrenal glands\n+ Skin\nRabies virus replicates in acinar cells of the salivary glands and is secreted in the saliva of rabid\nanimals that serve as vectors.", "questionPages": [403], "solutionPages": [412], "questionFigures": [], "solutionFigures": []}, {"id": "ch25-q13", "chapterId": 25, "chapter": "Myxoviruses and Rhabdoviruses", "number": 13, "text": "A 26-year-old pet-groomer was brought to the casualty with a history of breathlessness,\nexcessive agitation, and restlessness. His bystanders give a history of progressive behavioral\nchange and he had a fever, sore throat, and generalized weakness 1 month back. On\nexamination, pulse was 100 bpm, SpO2 was 98% on room air. Which of the following\nsamples will not be preferred to detect the etiological agent?", "options": [{"id": "A", "text": "Corneal impression"}, {"id": "B", "text": "Cerebrospinal fluid"}, {"id": "C", "text": "Saliva"}, {"id": "D", "text": "Skin biopsies including hair follicles"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given case scenario is highly suggestive of rabies. Corneal impression smears are not\nperformed, as they are of low diagnostic yield.\nLaboratory diagnosis of rabies is performed by the following methods:\n+ Antigen detection - Direct immunofluorescence (IF) from specimens of :\n+ Skin biopsy from the nape of the neck including hair follicles. Rabies antigen is present in\ncutaneous nerves at the base of hair follicles. It is the most sensitive and specific test.\n* Corneal smears were previously used. They are not used anymore as they are of low diagnostic\nyield.\n* Viral isolation- Intracerebral inoculation in mice can be attempted from the brain, CSF, and\nsaliva.\n+ Antibody demonstration from serum and CSF.\n+ Viral RNA detection by RT-PCR .\n+ Postmortem examination of brain tissue samples- demonstration of Negri bodies.", "questionPages": [403, 404], "solutionPages": [412, 413], "questionFigures": [], "solutionFigures": []}, {"id": "ch25-q14", "chapterId": 25, "chapter": "Myxoviruses and Rhabdoviruses", "number": 14, "text": "An officer of the Indian Forest Services is bitten by a rabid fox while on duty. Which of the\nfollowing statements is true about the etiological agent?", "options": [{"id": "A", "text": "The incubation period is 4 to 5 days"}, {"id": "B", "text": "It doesn't produce Negri bodies"}, {"id": "C", "text": "It causes disease"}, {"id": "D", "text": "It doesn't affect salivary gland"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given scenario is suggestive of infection with the street form of rabies virus. Street rabies\ncauses disease.\nAll mammals are susceptible to rabies. Cattle, cats and foxes are highly susceptible, whereas dogs\nand humans have intermediate susceptibility.\nDifferences between street rabies and fixed rabies:", "questionPages": [404], "solutionPages": [413], "questionFigures": [], "solutionFigures": ["crop-solution-ch25-q14-1"]}, {"id": "ch25-q15", "chapterId": 25, "chapter": "Myxoviruses and Rhabdoviruses", "number": 15, "text": "A 23-year-old man was brought to you with a history of fever, behavioral changes, and\nseizures. He is foaming at the mouth and is unable to ingest liquids. The patient was admitted\nto the ICU, however he died soon after. Post mortem brain samples showed the following\nfinding. What is the diagnosis?", "options": [{"id": "A", "text": "Yellow fever virus"}, {"id": "B", "text": "Rabies virus"}, {"id": "C", "text": "CMV"}, {"id": "D", "text": "Molluscum contagiosum"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given image showing Negri bodies and the case scenario of fever, neurological symptoms\nlike seizures and altered sensorium, hydrophobia (due to painful muscle contractions during\nswallowing liquids), and hypersalivation are suggestive of encephalitic rabies.\nNegri bodies are eosinophilic cytoplasmic inclusions in neurons that are composed of rabies virus\nproteins and viral RNA. These are commonly observed in Purkinje cells of the cerebellum and in\npyramidal neurons of the hippocampus. Their presence is a characteristic pathologic finding in\nrabies.\nThe image below shows Negri bodies:", "questionPages": [404, 405], "solutionPages": [413, 414], "questionFigures": ["crop-question-ch25-q15-1"], "solutionFigures": ["crop-solution-ch25-q15-1"]}, {"id": "ch25-q16", "chapterId": 25, "chapter": "Myxoviruses and Rhabdoviruses", "number": 16, "text": "Babes nodules are seen in which of the following conditions?", "options": [{"id": "A", "text": "Polio"}, {"id": "B", "text": "Rabies"}, {"id": "C", "text": "Diphtheria"}, {"id": "D", "text": "Herpes"}], "correctIndex": 1, "correctLetter": "B", "solution": "Babes nodules are seen in rabies. Mononuclear inflammatory infiltration in the leptomeninges,\nincluding microglial nodules are called Babes nodules.\nThe most characteristic pathologic finding in rabies is the Negri body. These are eosinophilic\ncytoplasmic inclusions in brain neurons that are composed of rabies virus proteins and viral RNA.\nThe image given below shows Negri bodies.", "questionPages": [405], "solutionPages": [414], "questionFigures": [], "solutionFigures": ["crop-solution-ch25-q16-1"]}, {"id": "ch25-q17", "chapterId": 25, "chapter": "Myxoviruses and Rhabdoviruses", "number": 17, "text": "Which of the following statements is false regarding rabies vaccination?", "options": [{"id": "A", "text": "Bitten dog should be observed for a minimum of 10 days."}, {"id": "B", "text": "Four-dose regimen is given as 0.1ml intramuscularly on days 0, 3, 7 and 28."}, {"id": "C", "text": "Pre-exposure prophylaxis regimen consists of 3 doses."}, {"id": "D", "text": "The dose of human anti rabies immunoglobulin is 20 IU/kg."}], "correctIndex": 1, "correctLetter": "B", "solution": "According to the Updated Thai Red Cross Regimen (2-2-2-0-2) for post exposure prophylaxis,\nreconstituted rabies vaccine is given as follows:\n* 0.1 ml intradermally\n* Sites - two sites at the same visit. It is given in both the deltoids\n* Schedule - Days 0, 3, 7, and 28\nHealthy dogs, cats, or ferrets may be confined and observed for 10 days.\nThe dosage of equine rabies immunoglobulin (eRIG) is 40 IU/kg while that of human anti-rabies\nimmunoglobulin (hRIG) is 20 IU/kg body weight.\nPrEP regimens for individuals of all ages are as follows:\n¢ Three intramuscular or intradermal vaccine doses on days 0, 7, and 21 or 28.", "questionPages": [405, 406], "solutionPages": [414, 415], "questionFigures": [], "solutionFigures": []}, {"id": "ch26-q1", "chapterId": 26, "chapter": "Arboviruses and Picorna Viruses", "number": 1, "text": "Which family does yellow fever virus belong to?", "options": [{"id": "A", "text": "Arboviridae"}, {"id": "B", "text": "Flaviviridae"}, {"id": "C", "text": "Bunyaviridae"}, {"id": "D", "text": "Picornaviridae"}], "correctIndex": 1, "correctLetter": "B", "solution": "Yellow fever virus belongs to the family flaviviridae, which contains the genus Flavivirus.\nThe important species under genus Flavivirus include:\n+ Yellow fever virus\n+ Dengue virus\n+ Japanese encephalitis virus\n* Kyasanur forest disease virus\n* West Nile encephalitis\n+ Zikavirus\nNote: Arbovirus is a term used to refer to any viruses that are transmitted by arthropod vectors.\nThere is no family or order by the name arbovirus. The word arbovirus stands\nfor ARthropod-BOrne virus.", "questionPages": [416], "solutionPages": [], "questionFigures": [], "solutionFigures": []}, {"id": "ch26-q2", "chapterId": 26, "chapter": "Arboviruses and Picorna Viruses", "number": 2, "text": "A 10-year-old boy from Uttar Pradesh was rushed to the emergency department with a\nheadache, fever, and blurred vision followed shortly by unresponsiveness to verbal\ncommands. He is suspected to have viral encephalitis. Which of the following transmits this\nendemic disease?", "options": [{"id": "A", "text": "Aedes aegypti mosquito"}, {"id": "B", "text": "Culex mosquito"}, {"id": "C", "text": "Anopheles mosquito"}, {"id": "D", "text": "Mansonia mosquito"}], "correctIndex": 1, "correctLetter": "B", "solution": "Endemic viral encephalitis is suggestive of Japanese encephalitis. It is transmitted\nby Culex tritaeniorhynchus and Culex vishnuii.\nIt is the leading cause of childhood neurological viral infection in India. In endemic areas such as\nNorth India, it typically affects children <15 years of age as by early adulthood, the majority of\nthe population has protective immunity following natural exposure to the virus.\nArdeid birds like herons and egrets are reservoir hosts, while the amplifier hosts are pigs. It is\ntransmitted by Culex mosquitoes, and human infection is a tangential dead end.", "questionPages": [416], "solutionPages": [], "questionFigures": [], "solutionFigures": []}, {"id": "ch26-q3", "chapterId": 26, "chapter": "Arboviruses and Picorna Viruses", "number": 3, "text": "Which of the following is not true about Japanese encephalitis?", "options": [{"id": "A", "text": "Transmitted by Culex vishnui"}, {"id": "B", "text": "Pig is the amplifier host"}, {"id": "C", "text": "Man acts as the reservoir"}, {"id": "D", "text": "Vaccinating pigs is helpful in disease control"}], "correctIndex": 2, "correctLetter": "C", "solution": "Humans are the dead-end hosts for the Japanese encephalitis virus.\n\n\n\nOption A: The disease is transmitted by Culex tritaeniorhynchus and Culex vishnui (common in\nIndia) species.\nOption B: Herons act as reservoir hosts and pigs as amplifier hosts.\nOption D: The control measures include mosquito control, locating piggeries away from the\nhuman dwellings and vaccinating pigs.\nThe image below shows the life cycle of the Japanese B encephalitis virus.", "questionPages": [416], "solutionPages": [426], "questionFigures": [], "solutionFigures": ["crop-solution-ch26-q3-1"]}, {"id": "ch26-q4", "chapterId": 26, "chapter": "Arboviruses and Picorna Viruses", "number": 4, "text": "A mother brings her 9-month-old child for vaccination against Japanese encephalitis. Which\nof the following statements is false regarding this vaccine?", "options": [{"id": "A", "text": "Two doses are recommended at age 9 months and 18 months"}, {"id": "B", "text": "Inactivated vero cell culture is given 4 weeks apart"}, {"id": "C", "text": "Live vaccine SA 14-14-2 is administered intramuscularly"}, {"id": "D", "text": "The live attenuated vaccine can be given to adolescents"}], "correctIndex": 2, "correctLetter": "C", "solution": "Live SA 14-14-2 strain of Japanese encephalitis (JE) vaccine is administered subcutaneously.\nTypes of JE Vaccines:", "questionPages": [416, 417], "solutionPages": [426, 427], "questionFigures": [], "solutionFigures": ["crop-solution-ch26-q4-1"]}, {"id": "ch26-q5", "chapterId": 26, "chapter": "Arboviruses and Picorna Viruses", "number": 5, "text": "A patient presents with fever, arthralgia, and pain behind the eyes for 3 days. On\nexamination, she has the following rash. Lab reports show thrombocytopenia and leucopenia.\nWhat is the most likely diagnosis?", "options": [{"id": "A", "text": "Dengue fever"}, {"id": "B", "text": "Malaria"}, {"id": "C", "text": "Typhoid"}, {"id": "D", "text": "Yellow fever"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given clinical scenario with the symptoms and the rash suggests dengue fever.\nIt presents with sudden-onset fever, retro-orbital pain, myalgia, arthralgia, and a rash. The rash in\ndengue appears as white islands on a red sea due to erythema with petechiae. The alternative\nname for dengue, breakbone fever, comes from the associated muscle and joint pains.\nSuspected cases of dengue are confirmed by the presence of NS1 antigen or IgM antibodies.\nThe treatment of dengue is supportive with hydration taking top priority.", "questionPages": [417], "solutionPages": [427], "questionFigures": ["crop-question-ch26-q5-1"], "solutionFigures": []}, {"id": "ch26-q6", "chapterId": 26, "chapter": "Arboviruses and Picorna Viruses", "number": 6, "text": "A 35-year-old wildlife photographer presents with sudden onset of fever, headache, and\nmyalgia. On examination, you notice gingival bleeds and conjunctival hemorrhages. He\nrecently visited a forest in Karnataka that has a large population of monkeys. Which of these\nis the vector for the suspected disease?", "options": [{"id": "A", "text": "Fleas"}, {"id": "B", "text": "Mite"}, {"id": "C", "text": "Ticks"}, {"id": "D", "text": "Mosquito"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given case scenario with exposure to monkeys, fever, myalgia, headache, conjunctival\nhemorrhage and gingival bleeds is suggestive of Kyasanur forest disease (KFD), which is\ntransmitted by ticks (Haemophysalis spinigera). It is endemic to the forests\nof Karnataka and Kerala.\nThe clinical features include:\n¢ Fever\n* Headache\n* Conjunctivitis\n+ Myalgia\n* Meningoencephalitis\n+ Hemorrhagic symptoms- hemorrhages in skin, mucosa and gastrointestinal bleeds.\nThe case fatality rate is about 5 percent.\nMonkeys are amplifier hosts, rodents are reservoirs and humans are incidental hosts.\nA killed KFD virus vaccine was used in a small field trial and appeared to provide some degree of\nprotection.", "questionPages": [417, 418], "solutionPages": [427], "questionFigures": [], "solutionFigures": []}, {"id": "ch26-q7", "chapterId": 26, "chapter": "Arboviruses and Picorna Viruses", "number": 7, "text": "A middle-aged man presents with delirium, fever, jaundice, and a hemorrhagic diathesis. The\npatient is agitated and has had no urine output in the last 6 hours. On investigation, there is\nazotemia and elevated liver enzymes. A viral disease with the vector shown below is\nsuspected. Which of the following inclusion bodies may be seen?", "options": [{"id": "A", "text": "Henderson-Patterson bodies"}, {"id": "B", "text": "Torres bodies"}, {"id": "C", "text": "Levinthal Cole Lille bodies"}, {"id": "D", "text": "Paschen bodies"}], "correctIndex": 1, "correctLetter": "B", "solution": "The image shows the Aedes aegypti mosquito and the clinical scenario with hepatic and renal\ndysfunction with delirium points towards a diagnosis of yellow fever. Torres bodies are\namorphous eosinophilic nuclear inclusions associated with yellow fever, a disease caused by the\nFlavivirus.\nInclusion bodies are structures with distinct sizes and shapes that are seen in virus-infected cells\nunder light microscopy.\nNote: Dengue hemorrhagic fever can be a differential diagnosis, but there are no inclusion bodies\nseen in dengue.", "questionPages": [418], "solutionPages": [427, 428], "questionFigures": ["crop-question-ch26-q7-1"], "solutionFigures": []}, {"id": "ch26-q8", "chapterId": 26, "chapter": "Arboviruses and Picorna Viruses", "number": 8, "text": "What is the duration of validity of 17D vaccination?", "options": [{"id": "A", "text": "1 year"}, {"id": "B", "text": "5 years"}, {"id": "C", "text": "Lifetime"}, {"id": "D", "text": "10 years"}], "correctIndex": 2, "correctLetter": "C", "solution": "17D vaccine (yellow fever vaccine) is valid for a lifetime, beginning 10 days after\nvaccination. According to the amendment in 2016 to International Health Regulations 2005, the\nvalidity of the related international certificate of vaccination against yellow fever has been\nchanged from ten (10) years to the lifespan of the person (traveler) vaccinated.\nIt is a live-attenuated vaccine derived from the 'Asibi strain’, administered\nsubcutaneously. Immunity after a single dose is long-lasting and provides lifetime protection. It is\nthermolabile.\nVaccination is compulsory for travel to and from endemic areas.\nIn India, 17D is manufactured at the Central Research Institute, Kasauli.", "questionPages": [418, 419], "solutionPages": [428], "questionFigures": [], "solutionFigures": []}, {"id": "ch26-q9", "chapterId": 26, "chapter": "Arboviruses and Picorna Viruses", "number": 9, "text": "A pest control technician with a history of fever, vomiting, hematuria, and decreased urine\noutput was diagnosed with hemorrhagic fever with renal syndrome. Which of the following\nstatements is false about the causative virus?", "options": [{"id": "A", "text": "Hantaviruses are the natural pathogens of rodents"}, {"id": "B", "text": "Transmission primarily occurs by Culex mosquitoes"}, {"id": "C", "text": "Hantavirus pulmonary syndrome presents with pulmonary edema"}, {"id": "D", "text": "Hantaviruses cause epidemic hemorrhagic fever"}], "correctIndex": 1, "correctLetter": "B", "solution": "Hemorrhagic fever with renal syndrome (HFRS) is caused by Hantaviruses. They are rodent-borne\nviruses that are transmitted by inhalation of the virus contained in dried excreta of rodents. They\nare the natural pathogens of rodents like mice, rats, and voles.\nHERS presents with acute kidney injury, hemorrhages, fever, and circulatory\ncollapse. Hantaviruses can also cause Hantavirus pulmonary syndrome.\nNote: In Aug 2016, The International Committee on Taxonomy of Viruses (ICTV), has renamed\nand moved the genus Hantavirus to Orthohantavirus.", "questionPages": [419], "solutionPages": [428], "questionFigures": [], "solutionFigures": []}, {"id": "ch26-q10", "chapterId": 26, "chapter": "Arboviruses and Picorna Viruses", "number": 10, "text": "An epidemic of paralytic poliomyelitis occurs in a non-immune population. Which among the\nfollowing strains of poliovirus is the most common cause of this?", "options": [{"id": "A", "text": "Type 1"}, {"id": "B", "text": "Type 2"}, {"id": "C", "text": "Type 3"}, {"id": "D", "text": "Type 4"}], "correctIndex": 0, "correctLetter": "A", "solution": "Type 1 poliovirus is the most common cause of epidemics in populations.\nPoliovirus strains have been classified into 3 types:\n* Type 1- most common and causes most of the epidemics.\n* Type 2- endemic infections.\n* Type 3- epidemics but rarer than type 1.\nImmunity is type-specific.\nNote :- Type 2 is declared eradicated in September, 2015 and Type 3 is declared eradicated in\nOctober, 2019", "questionPages": [419], "solutionPages": [428], "questionFigures": [], "solutionFigures": []}, {"id": "ch26-q11", "chapterId": 26, "chapter": "Arboviruses and Picorna Viruses", "number": 11, "text": "A5-year-old girl is brought to the pediatrics OPD with a history of lower-limb paralysis and\nthe following deformity. Which of the following will be the most common form of\npresentation of this illness?", "options": [{"id": "A", "text": "Inapparent infection"}, {"id": "B", "text": "Abortive form"}, {"id": "C", "text": "Paralytic form"}, {"id": "D", "text": "Nonparalytic form"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given case scenario with a history of lower limb paralysis and deformity is suggestive of\npoliomyelitis. The given image shows deformity of the right lower limb, namely hyperextension at\nthe knee joint and muscle wasting.\nInapparent infection is the most common (90-95%) presentation of polio. Only seroconversion\noccurs without any clinical manifestations.\nOption B: Abortive poliomyelitis is associated with primary viremia and presents as fever,\nheadache, sore throat, and malaise lasting for 1-5 days.\nOption C: Paralytic poliomyelitis occurs following minor illness, characterized by biphasic fever\nwith headache, stiff neck, and flaccid paralysis.\nOption D: In non-paralytic poliomyelitis, the disease does not progress beyond the stage of aseptic\nmeningitis.", "questionPages": [419, 420], "solutionPages": [428, 429], "questionFigures": ["crop-question-ch26-q11-1"], "solutionFigures": []}, {"id": "ch26-q12", "chapterId": 26, "chapter": "Arboviruses and Picorna Viruses", "number": 12, "text": "A 20-year-old unimmunized patient presents to you with complaints of weakness of lower\nlimbs, inability to pass urine, and fever, for 3 days. His stool samples were sent to the district\nlab to confirm the diagnosis. Which region of the spinal cord will primarily be affected in\nthese cases?", "options": [{"id": "A", "text": "Anterior horn cells"}, {"id": "B", "text": "Posterior horn cells"}, {"id": "C", "text": "Lateral horn cells"}, {"id": "D", "text": "Intermediate column"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given case scenario of fever, lower limb paralysis, urinary retention, and stool samples being\nsent for diagnosis, is suggestive of paralytic polio. The anterior horn cells of the spinal cord are\nprimarily affected, causing acute flaccid paralysis. Posterior horns and intermediate\ncolumns/lateral horns may also be involved to some extent.\nIn the central nervous system, the virus multiplies selectively in the neurons and destroys them.\nThe earliest change is the degeneration of Nissl bodies (chromatolysis). Nuclear changes follow.\nNote: Fecal samples of all cases of acute flaccid paralysis are obtained (2 samples) and\ntransported to the laboratory within 72 hours of collection at 4—8°C or frozen at -20°C. This is\nknown as the reverse cold chain and is done as a part of gold standard polio surveillance/acute\nflaccid paralysis surveillance (AFP surveillance).", "questionPages": [420], "solutionPages": [429], "questionFigures": [], "solutionFigures": []}, {"id": "ch26-q13", "chapterId": 26, "chapter": "Arboviruses and Picorna Viruses", "number": 13, "text": "Which of the following statements is false regarding vaccination against polio?", "options": [{"id": "A", "text": "Sabin type has the live attenuated virus"}, {"id": "B", "text": "OPV should not be administered to immunocompromised persons"}, {"id": "C", "text": "Salk vaccine is associated with mutations that lead to reversal of virulence"}, {"id": "D", "text": "Both OPV and IPV induce humoral IgG"}], "correctIndex": 2, "correctLetter": "C", "solution": "Salk type is the killed vaccine, hence there is no risk of mutation that can lead to a reversal of\nvirulence.\nThere are two types of vaccines for polio - IPV (inactivated poliovirus vaccine) and OPV (oral\npoliovirus vaccine).", "questionPages": [420, 421], "solutionPages": [429], "questionFigures": [], "solutionFigures": []}, {"id": "ch26-q14", "chapterId": 26, "chapter": "Arboviruses and Picorna Viruses", "number": 14, "text": "Which of the following strains of poliovirus have been eradicated worldwide?", "options": [{"id": "A", "text": "Type 2"}, {"id": "B", "text": "Types 2 and 3"}, {"id": "C", "text": "Types 1 and 3"}, {"id": "D", "text": "Type 3"}], "correctIndex": 1, "correctLetter": "B", "solution": "Type 2 and 3 have been eradicated worldwide.\nType 2: In September 2015, WHO declared the eradication of the wild type 2 poliovirus strain. In\nIndia, the last type 2 infection was detected in 1999.\nType 3: It has not been detected anywhere in the world since November 2012. On World Polio\nDay in October 2019, the type 3 virus was declared to be eradicated worldwide.\n\n\n\nThe only circulating strain is type 1.", "questionPages": [421], "solutionPages": [429, 430], "questionFigures": [], "solutionFigures": []}, {"id": "ch26-q15", "chapterId": 26, "chapter": "Arboviruses and Picorna Viruses", "number": 15, "text": "A 68-year-old woman presented with acute chest pain which was stabbing type in nature. The\npain is spasmodic and associated with fever spikes. There's an outbreak of coxsackievirus B in\nher community. What is the most likely diagnosis?", "options": [{"id": "A", "text": "Intercostal neuralgia"}, {"id": "B", "text": "Bornholm disease"}, {"id": "C", "text": "Herpangina"}, {"id": "D", "text": "Pericarditis"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given case scenario with stabbing type chest pain which is spasmodic in nature, associated\nwith fever spikes, and history of an outbreak of coxsackievirus B is suggestive of Bornholm disease\nor epidemic pleurodynia.\nSymptoms include paroxysms of acute pleuritic chest pain associated with fever spikes. Involved\nmuscles are tender. Chest X-ray is usually normal. Most cases occur during epidemics\nof coxsackievirus B. The disease is named after the Danish island of Bornholm where early cases\noccurred.\nThe treatment is non-steroidal anti-inflammatory agents or hot fomentation of the involved\nmuscles.\nOther diseases associated with coxsackievirus B:\n* Neonatal myocarditis and pericarditis\n+ Juvenile diabetes mellitus\n* Orchitis\n* Severe disseminated congenital infection- hepatitis, meningoencephalitis, adrenocortical\ninvolvement", "questionPages": [421], "solutionPages": [430], "questionFigures": [], "solutionFigures": []}, {"id": "ch26-q16", "chapterId": 26, "chapter": "Arboviruses and Picorna Viruses", "number": 16, "text": "A 5-year-old boy presents with headache, fever, and vomiting. On examination, you observe\nthe following. He is diagnosed with herpangina. Which group of viruses causes the same?", "options": [{"id": "A", "text": "Enteroviruses"}, {"id": "B", "text": "Rhinoviruses"}, {"id": "C", "text": "Myxoviruses"}, {"id": "D", "text": "Rhabdoviruses"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given image shows palatal ulcers in herpangina. It is caused by the coxsackievirus A, a large\nsubgroup of the enteroviruses.\nHerpangina or vesicular pharyngitis is characterized by grayish- white papulovesicular lesions on\nan erythematous base that ulcerate. These are present on:\n+ Soft palate\n+ Anterior pillars of tonsils\n* Uvula\n+ Posterior oropharynx\nIt is a common clinical manifestation of coxsackievirus A infection in children, but it can also be\ncaused by coxsackievirus B, echoviruses, or enterovirus 71.\nTreatment is usually only supportive, as the disease is self-limiting and usually runs its course in\nless than a week.", "questionPages": [421, 422], "solutionPages": [430], "questionFigures": ["crop-question-ch26-q16-1"], "solutionFigures": []}, {"id": "ch26-q17", "chapterId": 26, "chapter": "Arboviruses and Picorna Viruses", "number": 17, "text": "Which of the following organisms causes the following disease?", "options": [{"id": "A", "text": "Coxsackievirus"}, {"id": "B", "text": "Human herpes virus 7"}, {"id": "C", "text": "Pox virus"}, {"id": "D", "text": "Molluscum contagiosum"}], "correctIndex": 0, "correctLetter": "A", "solution": "The image shows vesicles on the palms, soles, and oral mucosa, consistent with\nhand-foot-and-mouth disease. It is caused by coxsackievirus.\nHand-foot-and-mouth disease (HFMD) is an exanthematous fever affecting mainly young\nchildren, characterized by oral and pharyngeal ulcerations and a vesicular rash of the palms and\nsoles that may spread to the arms and legs. Vesicles heal without crusting, which clinically\ndifferentiates them from the vesicles of herpesviruses and poxviruses. It is usually a benign illness\nresolving in 1-2 weeks.\nCoxsackie A16, Ag, and B 1-3 are common causative agents.\nOther diseases caused by Coxsackie A virus:\n+ Aseptic meningitis associated with a maculopapular rash.\n+ Herpangina\n* Minor respiratory infections", "questionPages": [422, 423], "solutionPages": [430, 431], "questionFigures": ["crop-question-ch26-q17-1"], "solutionFigures": []}, {"id": "ch26-q18", "chapterId": 26, "chapter": "Arboviruses and Picorna Viruses", "number": 18, "text": "A 60-year-old presented with eye pain, watering of eyes, and increased sensitivity to light. On\nexamination, you see the following. Which of the following viruses can cause this condition?", "options": [{"id": "A", "text": "Rhinovirus and Coxsackie A24"}, {"id": "B", "text": "Rhinovirus and Enterovirus-70"}, {"id": "C", "text": "Enterovirus 70 and Adenovirus 3"}, {"id": "D", "text": "Enterovirus-70 and Coxsackie A24"}], "correctIndex": 3, "correctLetter": "D", "solution": "The given case scenario is suggestive of acute hemorrhagic conjunctivitis (AHC) caused mainly by\nEnterovirus 70 and Coxsackievirus A24 variant (CA24v).\nIt is characterized by sudden swelling, congestion, and watering of the eyes. Subconjunctival\nhemorrhages are a characteristic feature and corneal involvement may occur transiently.\nThere is no treatment currently available. The disease is self limiting, and resolves within a five to\nseven-day period.\nNote: Acute follicular conjunctivitis is caused by Adenovirus serotypes 3, 4, 7 and 11.", "questionPages": [423], "solutionPages": [431], "questionFigures": ["crop-question-ch26-q18-1"], "solutionFigures": []}, {"id": "ch26-q19", "chapterId": 26, "chapter": "Arboviruses and Picorna Viruses", "number": 19, "text": "A 42-year-old woman presented with fever, joint pains, and headache. Chik sign (image given\nbelow) is present on the patient's nose. Which of the following vectors transmits the\netiological agent?", "options": [{"id": "A", "text": "Culex tritaeniorhynchus"}, {"id": "B", "text": "Anopheles culicifacies"}, {"id": "C", "text": "Aedes aegypti"}, {"id": "D", "text": "Aedes albopictus"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given case scenario with fever, joint pain, headache, and Chik sign is suggestive of\nchikungunya which is transmitted by Aedes aegypti mosquitoes.\nChikungunya presents with sudden onset of fever, crippling joint pain, lymphadenopathy, and\nconjunctivitis. The fever is typically biphasic with a period of remission after 1-6 days. Nose\npigmentation is striking in cases of Chikungunya fever and is termed as Chik sign\nNo animal reservoir has been identified.\nNote: Although Chikungunya is transmitted by both Aedes aegypti and Aedes albopictus,\nA.Aegypti is considered primary vector of transmission for Chikungunya.", "questionPages": [423, 424, 425], "solutionPages": [431], "questionFigures": ["crop-question-ch26-q19-1"], "solutionFigures": []}, {"id": "ch27-q1", "chapterId": 27, "chapter": "Miscellaneous Viruses - Rubella, Coronaviruses, Prions, Rotavirus, Filovirus, Zika Virus and Nipah Virus", "number": 1, "text": "A newborn baby has a characteristic rash as shown below. On examination, bilateral pearly\nwhite nuclear cataracts are noted, and a continuous murmur is auscultated. What family does\nthe virus implicated in this syndrome belong to?", "options": [{"id": "A", "text": "Rhabdoviridae"}, {"id": "B", "text": "Filoviridae"}, {"id": "C", "text": "Matonaviridae"}, {"id": "D", "text": "Calciviridae"}], "correctIndex": 2, "correctLetter": "C", "solution": "The clinical scenario of bilateral nuclear cataracts, blueberry muffin rash (image), and patent\nductus arteriosus(murmur) suggest congenital rubella syndrome. Rubella virus belongs to the\nfamily Matonaviridae.\nRubella virus previously belonged to family Togaviridae, but has been recently changed to family\nMatonaviridae by the International Committee on the Taxonomy of viruses (ICTV), making it the\nsole genus under the family Matonaviridae.\nOption A: Rhabdoviridae includes Rabies virus.\n\n\n\nOption B: Filoviridae includes Marburg virus and Ebola virus.\nOption D: Calciviridae includes Norwalk agent.", "questionPages": [432], "solutionPages": [439], "questionFigures": ["crop-question-ch27-q1-1"], "solutionFigures": []}, {"id": "ch27-q2", "chapterId": 27, "chapter": "Miscellaneous Viruses - Rubella, Coronaviruses, Prions, Rotavirus, Filovirus, Zika Virus and Nipah Virus", "number": 2, "text": "A brain biopsy done at the time of autopsy shows spongiform encephalopathy. Which of the\nfollowing is unlikely to be the diagnosis?", "options": [{"id": "A", "text": "Creutzfeldt Jakob Disease"}, {"id": "B", "text": "Kuru"}, {"id": "C", "text": "Mad cow disease"}, {"id": "D", "text": "Sub acute sclerosing pan-encephalitis"}], "correctIndex": 3, "correctLetter": "D", "solution": "Spongiform encephalopathy is a feature of prion disease. Subacute sclerosing panencephalitis\n(SSPE) is not a prion disease.\nSSPE is a rare and chronic form of progressive brain inflammation caused by a persistent\ninfection with the measles virus.\nSlow virus diseases are characterized by a long asymptomatic period, often months or years in\nduration, between the introduction of the infectious agent and the appearance of clinical illness.\nExamples: AIDS, Kuru, CJD, SSPE, PML\nCJD, Kuru, and mad cow disease are classified under slow virus diseases which are caused by\nprions.", "questionPages": [432, 433], "solutionPages": [439], "questionFigures": ["crop-question-ch27-q2-1"], "solutionFigures": ["crop-solution-ch27-q2-1"]}, {"id": "ch27-q3", "chapterId": 27, "chapter": "Miscellaneous Viruses - Rubella, Coronaviruses, Prions, Rotavirus, Filovirus, Zika Virus and Nipah Virus", "number": 3, "text": "Which strain of the Ebola virus has the highest case fatality rate?", "options": [{"id": "A", "text": "Zaire strain"}, {"id": "B", "text": "Sudan strain"}, {"id": "C", "text": "Reston strain"}, {"id": "D", "text": "Tai Forest strain"}], "correctIndex": 0, "correctLetter": "A", "solution": "The Zaire strain has a case fatality rate of 90%\nThere are five identified Ebola virus strains, four of which are known to cause disease in humans:\n+ Ebola virus (Zaire ebolavirus)\n+ Sudan virus (Sudan ebolavirus)\n+ Tai Forest virus (Tai Forest ebolavirus)\n* Bundibugyo virus (Bundibugyo ebolavirus).\n\n\n\nThe fifth, Reston virus (Reston ebolavirus), has caused disease in nonhuman primates, but not in\nhumans.\nThe Bundibugyo ebolavirus, Zaire ebolavirus, and Sudan ebolavirus have been associated with\nlarge outbreaks in Africa. The strain that caused the 2014-2016 West African outbreak belongs to\nthe Zaire ebolavirus species.", "questionPages": [433], "solutionPages": [439, 440], "questionFigures": [], "solutionFigures": []}, {"id": "ch27-q4", "chapterId": 27, "chapter": "Miscellaneous Viruses - Rubella, Coronaviruses, Prions, Rotavirus, Filovirus, Zika Virus and Nipah Virus", "number": 4, "text": "Which of the following is a leading cause of diarrheal death in children?", "options": [{"id": "A", "text": "Calcivirus"}, {"id": "B", "text": "Adenovirus"}, {"id": "C", "text": "Rotavirus"}, {"id": "D", "text": "Norwalk virus"}], "correctIndex": 2, "correctLetter": "C", "solution": "Rotavirus is a leading cause of diarrheal death among children in the developing world.\nRotavirus infections occur in most children below the age of 5 years and are most frequent\nbetween 6-24 months of age. Neonatal infections are common but are often asymptomatic or\nmild.\nVaccines for rotavirus: RotaTeq and Rotarix, given orally.\nNote: Viruses that can cause diarrhoea in children include:\n* Rotavirus (most common)\n* Norwalk virus\n+ Adenovirus- types 40 and 41\n+ Astrovirus\n* Coronavirus\n+ Sapovirus\nThe image below shows an electron micrograph image of the Rotavirus.", "questionPages": [433, 434], "solutionPages": [440], "questionFigures": [], "solutionFigures": ["crop-solution-ch27-q4-1"]}, {"id": "ch27-q5", "chapterId": 27, "chapter": "Miscellaneous Viruses - Rubella, Coronaviruses, Prions, Rotavirus, Filovirus, Zika Virus and Nipah Virus", "number": 5, "text": "An 18-year-old went on an exchange program to Singapore. An adventurous eater, she tried\nclams and oysters on a cruise ship. 2 days later, she developed fever, nausea, vomiting, and\ndiarrhea. What is the causative agent?", "options": [{"id": "A", "text": "Adenovirus"}, {"id": "B", "text": "Rotavirus"}, {"id": "C", "text": "Norwalk virus"}, {"id": "D", "text": "Enterovirus"}], "correctIndex": 2, "correctLetter": "C", "solution": "The clinical scenario describes a case of Norwalk infection. It is the most common cause of\ndiarrhea in older children and adults.\nThey occur in group settings such as banquet halls, cruise ships, dormitories, and campgrounds,\nwhere outbreak sources are usually contaminated food and/or water. Potential sources of\ncontaminated food include shellfish such as clams and oysters, which are contaminated by water.\nClinical features are nausea, vomiting, watery diarrhea, abdominal pain. Symptoms of\ngastroenteritis develop 12 to 48 hours after being exposed to norovirus.\nThe image below is an electron micrograph of Norovirus (Norwalk virus).", "questionPages": [434], "solutionPages": [440, 441], "questionFigures": [], "solutionFigures": ["crop-solution-ch27-q5-1"]}, {"id": "ch27-q6", "chapterId": 27, "chapter": "Miscellaneous Viruses - Rubella, Coronaviruses, Prions, Rotavirus, Filovirus, Zika Virus and Nipah Virus", "number": 6, "text": "A 70-year-old lady with recent onset, progressive dementia comes with myoclonus. The brain\nimaging is shown below. What biochemical component is responsible for this disease?", "options": [{"id": "A", "text": "DNA"}, {"id": "B", "text": "RNA"}, {"id": "C", "text": "Protein"}, {"id": "D", "text": "Polysaccharide"}], "correctIndex": 2, "correctLetter": "C", "solution": "The clinical features and imaging suggest a diagnosis of Creutzfeldt-Jakob disease(CJD), caused\nby prions. Prions are composed of protein.\nThese are infectious protein particles that lack any nucleic acid. They are filterable like viruses but\nare resistant to agents of sterilization.\nPrion proteins have two isoforms:\n* PrPSc is the prion protein that causes disease.\n+ PrPc is the normal prion protein, found in human cells.\nPrions cause diseases such as CJD, Kuru, Alzheimer's, Parkinson's.\nLaboratory diagnosis of prion diseases:\n+ Measurement of PrPSc by immunoassay\n* Brain MRI\n+ Brain biopsy\n+ Stress protein 14-3-3\n\n\n\n+ Sequencing PRNP gene\n+ Abnormal EEG", "questionPages": [434], "solutionPages": [441, 442], "questionFigures": ["crop-question-ch27-q6-1"], "solutionFigures": ["crop-solution-ch27-q6-1"]}, {"id": "ch27-q7", "chapterId": 27, "chapter": "Miscellaneous Viruses - Rubella, Coronaviruses, Prions, Rotavirus, Filovirus, Zika Virus and Nipah Virus", "number": 7, "text": "A 32-year-old lady is admitted to the ICU with COVID-19. Which of the following statements\nis false regarding the organism causing it?", "options": [{"id": "A", "text": "These viruses have club-shaped peplomers on their surface"}, {"id": "B", "text": "It spreads by direct contact"}, {"id": "C", "text": "SARS virus is highly mutable"}, {"id": "D", "text": "It acts by binding to ACE1 and TMPRSS4 receptors"}], "correctIndex": 3, "correctLetter": "D", "solution": "The coronavirus spike protein binds to the ACE2 and TMPRSS2 receptors to enter the human\ncells.\nCoronaviruses are a group of spherical or pleomorphic enveloped RNA viruses having club or\npetal-shaped peplomers. Coronaviruses are named for the crown-like spikes on their surface.\nIt spreads through coughing, sneezing, and close personal contact such as touching the mouth,\nnose.\nThe virus is highly mutable and so vaccine prophylaxis for all strains is difficult.\nCoronaviruses cause upper respiratory tract infections, severe acute respiratory syndrome (SARS),\nand Middle Eastern respiratory syndrome (MERS). They spread by inhalation of the virus present\nin droplets or aerosols of respiratory secretions of the patients.\nBasic protective measures against the new coronavirus: (SARS-CoV-2)\n* Wash your hands frequently for at least 20 seconds.\n* Maintain social distancing- Maintain at least 1 meter distance between yourself and anyone who\nis coughing or sneezing\n- Avoid touching eyes, nose, and mouth\n+ Practice respiratory hygiene- cover your mouth and nose with your bent elbow or tissue when\nyou cough or sneeze, then dispose of the used tissue immediately.\n+ If you have fever, cough, and difficulty breathing, seek medical care early\n+ Stay informed and follow the advice given by your healthcare provider", "questionPages": [434, 435], "solutionPages": [442, 443], "questionFigures": [], "solutionFigures": []}, {"id": "ch27-q8", "chapterId": 27, "chapter": "Miscellaneous Viruses - Rubella, Coronaviruses, Prions, Rotavirus, Filovirus, Zika Virus and Nipah Virus", "number": 8, "text": "A person who comes in contact with a case of coronavirus (COVID- 19) needs to be followed\nup for .", "options": [{"id": "A", "text": "7 days"}, {"id": "B", "text": "21 days"}, {"id": "C", "text": "14 days"}, {"id": "D", "text": "42 days"}], "correctIndex": 2, "correctLetter": "C", "solution": "A person who comes in contact with a coronavirus(COVID-19) case (confirmed or probable) needs\nto be followed up for apperance of symptoms of coronavirus for the maximum incubation period\nof 14 days.\nTreatment: There is no specific antiviral treatment recommended for COVID-19. People with\nCOVID-19 should receive supportive care to help relieve symptoms. For severe cases, treatment\nshould include care to support vital organ functions.\nBasic protective measures against the new coronavirus: (SARS CoV 2)\n* Wash your hands frequently for atleast 20 seconds.\n* Maintain social distancing- Maintain at least 1 metre distance between yourself and anyone who\nis coughing or sneezing\n+ Avoid touching eyes, nose and mouth\n+ Practice respiratory hygiene- cover your mouth and nose with your bent elbow or tissue when\nyou cough or sneeze, then dispose of the used tissue immediately.\n+ If you have fever, cough and difficulty breathing, seek medical care early\n+ Stay informed and follow advice given by your healthcare provider", "questionPages": [435], "solutionPages": [443], "questionFigures": [], "solutionFigures": []}, {"id": "ch27-q9", "chapterId": 27, "chapter": "Miscellaneous Viruses - Rubella, Coronaviruses, Prions, Rotavirus, Filovirus, Zika Virus and Nipah Virus", "number": 9, "text": "In a patient undergoing testing for SARS-CoV, a FELUDA test is done. Which of the following\nstatements is false about this technology?", "options": [{"id": "A", "text": "It is the acronym for FNCASg Editor Linked Uniform Detection Assay"}, {"id": "B", "text": "Based on CRISPR gene editing technology"}, {"id": "C", "text": "It is slower than RT PCR in detecting SARS-CoV2"}, {"id": "D", "text": "It uses CAS-9 protein to bind to the viral signature"}], "correctIndex": 2, "correctLetter": "C", "solution": "FELUDA is faster than RT-PCR in detecting SARS-CoV2.\nFELUDA (FNCASg9 Editor Linked Uniform Detection Assay) is a newly approved method based on\nCRISPR gene-editing technology to identify and target the genetic material of SARS-CoV2.\nThe CRISPR technology uses a highly specific CASg protein to find and bind to the target Covid\nsignature. This is then coupled with paper-strip chemistry to elicit a visual readout on a paper\nstrip.\nIt is a very affordable, sensitive (96%), and specific (98%) strip test which can detect viral genetic\nmaterial within 45 minutes.", "questionPages": [435], "solutionPages": [443], "questionFigures": [], "solutionFigures": []}, {"id": "ch27-q10", "chapterId": 27, "chapter": "Miscellaneous Viruses - Rubella, Coronaviruses, Prions, Rotavirus, Filovirus, Zika Virus and Nipah Virus", "number": 10, "text": "A confirmed case of which of the following viral haemorrhagic fevers was found in India?", "options": [{"id": "A", "text": "Ebola"}, {"id": "B", "text": "Yellow fever"}, {"id": "C", "text": "Crimean congo hemorrhagic fever"}, {"id": "D", "text": "Marburg"}], "correctIndex": 2, "correctLetter": "C", "solution": "Crimean Congo hemorrhagic fever is a severe form of viral hemorrhagic fever, is caused by\nNairovirus species.\nIt is zoonotic in origin with ticks as vectors. The outbreak was caused due to person-to-person\ntransmission in hospitals.", "questionPages": [435], "solutionPages": [443, 444], "questionFigures": [], "solutionFigures": []}, {"id": "ch27-q11", "chapterId": 27, "chapter": "Miscellaneous Viruses - Rubella, Coronaviruses, Prions, Rotavirus, Filovirus, Zika Virus and Nipah Virus", "number": 11, "text": "A woman presents with a positive urine pregnancy test, 1 month after taking the MMR\nvaccine. At the time of receiving the vaccine, she had been advised to avoid conception. What\nadvice do you give her now?", "options": [{"id": "A", "text": "Wait and watch"}, {"id": "B", "text": "Termination of pregnancy mandatory"}, {"id": "C", "text": "Low risk; termination of pregnancy may be considered"}, {"id": "D", "text": "High risk of anomalies; serious consideration for termination"}], "correctIndex": 0, "correctLetter": "A", "solution": "In this case scenario, the doctor should advise the patient to wait and watch.\nThe vaccine should not be administered during pregnancy. If pregnancy occurs within 28 days of\nimmunization, the patient should be counseled on the theoretical risks for the fetus.\nStudies of over 200 women who had been inadvertently immunized with rubella vaccine during\npregnancy showed that none of their offspring developed congenital rubella syndrome. Therefore,\ntermination of pregnancy is probably not warranted.", "questionPages": [435, 436], "solutionPages": [444], "questionFigures": [], "solutionFigures": []}, {"id": "ch27-q12", "chapterId": 27, "chapter": "Miscellaneous Viruses - Rubella, Coronaviruses, Prions, Rotavirus, Filovirus, Zika Virus and Nipah Virus", "number": 12, "text": "While working at a WHO outreach post in Africa, you conduct an educational program about\nthe Zika virus. What family does this virus belong to?", "options": [{"id": "A", "text": "Togaviridae"}, {"id": "B", "text": "Flaviviridae"}, {"id": "C", "text": "Bunyaviridae"}, {"id": "D", "text": "Reoviridae"}], "correctIndex": 1, "correctLetter": "B", "solution": "Zika virus belongs to the family Flaviviridae.\nIt is classified by the International Committee on Taxonomy of Viruses (ICTV):\n+ Family: Flaviviridae\n* Genus: Flavivirus\n+ Species: Zika virus\nZika virus is an RNA virus that is transmitted by Aedes aegypti mosquito bite and by sexual\ncontact. It causes microcephaly and is associated with Guillain-Barré syndrome.", "questionPages": [436], "solutionPages": [444], "questionFigures": [], "solutionFigures": []}, {"id": "ch27-q13", "chapterId": 27, "chapter": "Miscellaneous Viruses - Rubella, Coronaviruses, Prions, Rotavirus, Filovirus, Zika Virus and Nipah Virus", "number": 13, "text": "Zika virus is transmitted by:", "options": [{"id": "A", "text": "Aedes aegypti"}, {"id": "B", "text": "Culex"}, {"id": "C", "text": "Anopheles"}, {"id": "D", "text": "Phlebotomus papatasii"}], "correctIndex": 0, "correctLetter": "A", "solution": "Zika virus may be transmitted by the bite of infected Aedes aegypti and Aedes albopictus.\nThe symptoms of Zika virus disease include fever, rash, conjunctivitis, muscle and joint pain,\nmalaise, or headache. These symptoms are mild and usually last for 2-7 days.\nZika virus infection during pregnancy may cause lead to microcephaly or congenital Zika\nsyndrome.\nThe complications of Zika virus infection include Guillain-Barré syndrome, neuropathy, and\nmyelitis.", "questionPages": [436], "solutionPages": [444], "questionFigures": [], "solutionFigures": []}, {"id": "ch27-q14", "chapterId": 27, "chapter": "Miscellaneous Viruses - Rubella, Coronaviruses, Prions, Rotavirus, Filovirus, Zika Virus and Nipah Virus", "number": 14, "text": "Which of the following features do not support a diagnosis of Zika fever?", "options": [{"id": "A", "text": "Petechial rash"}, {"id": "B", "text": "Guillan barre syndrome"}, {"id": "C", "text": "Fever with arthralgia"}, {"id": "D", "text": "Conjunctivitis"}], "correctIndex": 0, "correctLetter": "A", "solution": "A petechial rash is not a primary feature of Zika virus infection.\nThough petechiae may rarely appear in Zika virus disease it is however not included in the CDC\ncase definition of Zika virus disease. Petechial rash points towards a diagnosis of dengue fever\nwhile a maculopapular rash suggests a Zika virus disease.\nZika virus infection is characterized by influenza-like clinical signs including fever, headache, and\nmalaise. A maculopapular rash, conjunctivitis, myalgia, and arthralgia usually accompany or\nfollow those manifestations.\n\n\n\nThe complications of Zika virus are:\n* Guillain-Barre syndrome\n+ Fetal microcephaly in pregnant women.", "questionPages": [436, 437], "solutionPages": [444, 445], "questionFigures": [], "solutionFigures": []}, {"id": "ch27-q15", "chapterId": 27, "chapter": "Miscellaneous Viruses - Rubella, Coronaviruses, Prions, Rotavirus, Filovirus, Zika Virus and Nipah Virus", "number": 15, "text": "The transplacental transmission of the organism given in the image which causes\nmicrocephaly is-", "options": [{"id": "A", "text": "Nipah"}, {"id": "B", "text": "Zika virus"}, {"id": "C", "text": "CMV"}, {"id": "D", "text": "Rubella"}], "correctIndex": 1, "correctLetter": "B", "solution": "The transplacental transmission of Zika virus given in the image causes microcephaly.\nThe condition shown in the image is microcephaly. It is caused by Zika virus transmission from an\ninfected pregnant mother to her child. Zika virus is a mosquito-borne Flavivirus mainly\ntransmitted through Aedes aegypti.\nSymptoms are mild and usually last for 2-7 days.\n° Fever\n+ Rash\n* Conjunctivitis\n* Muscle and joint pain\n* Malaise\n+ Headache\n+ In pregnancy- congenital Zika syndrome or microcephaly\nThe complications of Zika virus infection include Guillain-Barré syndrome, neuropathy, and\nmyelitis.\nNCDC Delhi and the National Institute of Virology Pune, are the only institutes that have the\ncapacity to provide the diagnosis in an acute febrile stage. RT-PCR is the standard test available\nfor the diagnosis of Zika virus infection.", "questionPages": [437], "solutionPages": [445], "questionFigures": ["crop-question-ch27-q15-1"], "solutionFigures": []}, {"id": "ch27-q16", "chapterId": 27, "chapter": "Miscellaneous Viruses - Rubella, Coronaviruses, Prions, Rotavirus, Filovirus, Zika Virus and Nipah Virus", "number": 16, "text": "Tropical spastic paraparesis is caused by:", "options": [{"id": "A", "text": "Polyomavirus SV40"}, {"id": "B", "text": "Epstein-Barr virus"}, {"id": "C", "text": "Human immunodeficiency virus"}, {"id": "D", "text": "Human T-lymphotropic virus"}], "correctIndex": 3, "correctLetter": "D", "solution": "is the causative agent of the neurodegenerative disorder HTLV-1-associated myelopathy or\ntropical spastic paraparesis (HAM/TSP).\nThe condition resembles multiple sclerosis and is associated with progressive weakness of legs\nand lower body. The patients develop spastic paraparesis or paraplegia, hyperreflexia, ankle\nclonus, and extensor plantar response. The disease progresses slowly and takes the form of\nthoracic myelopathy.\nOther conditions caused by HTLV-1 include:\n* Adult T-cell leukemias and lymphomas (ATL)\n+ Uveitis\n+ Infective dermatitis\n\n\n\n+ Arthritis\n* Sjolligren’s syndrome", "questionPages": [437], "solutionPages": [445, 446], "questionFigures": [], "solutionFigures": []}, {"id": "ch27-q17", "chapterId": 27, "chapter": "Miscellaneous Viruses - Rubella, Coronaviruses, Prions, Rotavirus, Filovirus, Zika Virus and Nipah Virus", "number": 17, "text": "What family does the Nipah virus belong to?", "options": [{"id": "A", "text": "Paramyxoviridae"}, {"id": "B", "text": "Togaviridae"}, {"id": "C", "text": "Flaviviridae"}, {"id": "D", "text": "Bunyaviridae"}], "correctIndex": 0, "correctLetter": "A", "solution": "Nipah virus belongs to the family Paramyxoviridae.\nTogaviridae contains chikungunya virus.\nFlaviviridae contains yellow fever virus, dengue virus, Japanese encephalitis virus, hepatitis C\nvirus, Zika virus\nBunyaviridae contains sandfly fever virus, hantaviruses.", "questionPages": [437, 438], "solutionPages": [446], "questionFigures": [], "solutionFigures": []}, {"id": "ch28-q1", "chapterId": 28, "chapter": "Superficial and Systemic Mycoses", "number": 1, "text": "Which of the following is a component of the fungal cell wall?", "options": [{"id": "A", "text": "Ergosterol"}, {"id": "B", "text": "Lipoteichoic acid"}, {"id": "C", "text": "Mycolic acid"}, {"id": "D", "text": "Chitin"}], "correctIndex": 3, "correctLetter": "D", "solution": "Chitin is a component of the fungal cell wall.\nGeneral characteristics of Fungi:\n* They are unicellular/multicellular eukaryotes.\n+ The cell wall contains chitin, glucan, mannan and other polysaccharides.\n+ The cytoplasmic membrane contains ergosterol.\n+ They possess true nuclei with the nuclear membrane and paired chromosomes.\n+ They divide sexually, asexually or by both.\nRaymond Sabouraud is known as the Father of Mycology.", "questionPages": [447], "solutionPages": [], "questionFigures": [], "solutionFigures": ["crop-solution-ch28-q1-1"]}, {"id": "ch28-q2", "chapterId": 28, "chapter": "Superficial and Systemic Mycoses", "number": 2, "text": "Which of the following is a yeast?", "options": [{"id": "A", "text": "Candida"}, {"id": "B", "text": "Cryptococcus"}, {"id": "C", "text": "Fusarium"}, {"id": "D", "text": "Talaromyces"}], "correctIndex": 1, "correctLetter": "B", "solution": "Cryptococcus is a yeast.\n\n\n\nOption A: Candida is a yeast-like fungus.\nOption C: Fusarium is a mold/filamentous fungus.\nOption D: Talaromyces is a dimorphic fungus.", "questionPages": [447], "solutionPages": [459], "questionFigures": [], "solutionFigures": []}, {"id": "ch28-q3", "chapterId": 28, "chapter": "Superficial and Systemic Mycoses", "number": 3, "text": "Which among the following is not a sexual spore?", "options": [{"id": "A", "text": "Zygospore"}, {"id": "B", "text": "Sporangiospore"}, {"id": "C", "text": "Basidiospore"}, {"id": "D", "text": "Ascospore"}], "correctIndex": 1, "correctLetter": "B", "solution": "Sporangiospore is not a sexual spore. It is an asexual spore.\nFungi can be classified into 4 classes based on sexual spore formation:\nFungi imperfecti (Deuteromycetes): These are the fungi whose sexual phases are yet to be\nidentified. Most of the fungi of medical importance belong to this group.\nNote: The earlier classification of Phycomycetes, under which Zygomycetes, Oomycetes, and other\nsub-phyla were present, is now obsolete. Phylum Glomerulomycota has replaced it.", "questionPages": [447], "solutionPages": [459], "questionFigures": [], "solutionFigures": ["crop-solution-ch28-q3-1"]}, {"id": "ch28-q4", "chapterId": 28, "chapter": "Superficial and Systemic Mycoses", "number": 4, "text": "Which of the following fungal spores are formed by condensation of the hyphal elements?", "options": [{"id": "A", "text": "Arthrospores"}, {"id": "B", "text": "Conidiospore"}, {"id": "C", "text": "Basidiospores"}, {"id": "D", "text": "Ascospores"}], "correctIndex": 0, "correctLetter": "A", "solution": "Arthrospores are asexual spores that are formed along the mycelium/hyphae by segmentation and\ncondensation of hyphae.\nArthrospores are commonly formed by dermatophytes, especially those belonging to the genus\nTrichophyton. They are also formed by dimorphic fungi like Coccidiodes sp.", "questionPages": [447, 448], "solutionPages": [459, 460], "questionFigures": [], "solutionFigures": ["crop-solution-ch28-q4-1"]}, {"id": "ch28-q5", "chapterId": 28, "chapter": "Superficial and Systemic Mycoses", "number": 5, "text": "A young patient presents to the dermatology OPD with a history of itchy hypopigmented\npatches over her chest for 6 months. A KOH mount is prepared with the skin scraping\nsample, which on microscopy reveals a characteristic appearance as shown in the image.\nWhat is the most probable diagnosis?", "options": [{"id": "A", "text": "Pityriasis alba"}, {"id": "B", "text": "Candidiasis"}, {"id": "C", "text": "Tinea corporis"}, {"id": "D", "text": "Pityriasis versicolor"}], "correctIndex": 3, "correctLetter": "D", "solution": "The given clinical picture and the KOH mount preparation showing the spaghetti and meatball\nappearance suggest pityriasis versicolor.\nPityriasis versicolor is a chronic superficial infection of the stratum corneum caused by Malassezia\nglobosa and Malassezia furfur. The most common site involves the neck, chest, back, and upper\narms. The lesions often appear as hypopigmented areas.\nThe KOH mount reveals fungal hyphae that are short and thick (like spaghetti or banana) and\nmany variously sized spores (like meatballs or grapes) referred to as spaghetti and meatballs or\nbananas and grapes appearance.\nTreatment includes topical azoles or terbinafine for 2 weeks.\nThe image below shows the hypopigmented lesions of P. versicolour over the chest.\n\n\n\nElectron microscopic image of Malassezia furfur", "questionPages": [448], "solutionPages": [460, 461], "questionFigures": ["crop-question-ch28-q5-1"], "solutionFigures": ["crop-solution-ch28-q5-1", "crop-solution-ch28-q5-2"]}, {"id": "ch28-q6", "chapterId": 28, "chapter": "Superficial and Systemic Mycoses", "number": 6, "text": "Which of the following statements about dermatophytes is true?", "options": [{"id": "A", "text": "Epidermophyton infects skin and hair"}, {"id": "B", "text": "Microsporum infects skin and hair"}, {"id": "C", "text": "Epidermophyton infects nails and hair"}, {"id": "D", "text": "Microsporum infects nails and hair"}], "correctIndex": 1, "correctLetter": "B", "solution": "Microsporum infects only skin and hair, not nails.\nDermatophytes include 3 genera:\n* Microsporum: It infects only hair and skin (not nails). The species included in this genus are-\n+ M. gypseum\n*M. canis\n¢M. nanum.\n+ Epidermophyton: It infects only skin and nails (not hair). E. floccosum is the only species in this\ngenus.\n+ Trichophyton: It infects skin, hair, and nails. The species falling under this genus are-\n*T. rubrum\n* T. mentagrophytes\n- T. tonsurans\n+ T. schoenleinii\n+ T. violaceum", "questionPages": [448], "solutionPages": [461], "questionFigures": [], "solutionFigures": []}, {"id": "ch28-q7", "chapterId": 28, "chapter": "Superficial and Systemic Mycoses", "number": 7, "text": "A 23-year-old-lady came to the dermatology clinic with complaints of hair loss and the\npresence of firmly adherent, black, gritty, hard nodules along the hair shaft as shown. There\nis no associated pruritis of the scalp. Which of the following could be the most probable\ncausative agent?", "options": [{"id": "A", "text": "Piedraia hortae"}, {"id": "B", "text": "Trichosporon beigelii"}, {"id": "C", "text": "Hortaea werneckii"}, {"id": "D", "text": "Malassezia furfur"}], "correctIndex": 0, "correctLetter": "A", "solution": "The presence firmly adherent, black, gritty, hard nodules along the hair shaft is suggestive\nof black piedra. The causative agent of this condition is Piedraia hortae.\nPiedra is a superficial fungal infection of the hair shaft. It is of two types:\n+ Black piedra: It is characterized by firmly adherent, black, gritty, hard nodules along the hair\nshaft. Scalp hair is most often affected. Hair becomes brittle and breaks easily leading to\ncomplains of hair loss. It is caused by Piedraia hortae.\n* White piedra: It is characterized by soft, white or light brown transparent nodules that are easily\ndetached from the hair. It affects pubic, axillary, facial hair more commonly than scalp hair. It\nis caused by Trichosporon beigelii.\nManagement involves shaving or cutting off the affected hair along with topical antifungals.", "questionPages": [448, 449], "solutionPages": [461, 462], "questionFigures": ["crop-question-ch28-q7-1"], "solutionFigures": ["crop-solution-ch28-q7-1"]}, {"id": "ch28-q8", "chapterId": 28, "chapter": "Superficial and Systemic Mycoses", "number": 8, "text": "A 45-year-old diabetic patient presented with complaints of discoloration of his toenail for the\npast 4 months as shown in the image below. Which pathogen most commonly causes this\ncondition?", "options": [{"id": "A", "text": "Trichophyton rubrum"}, {"id": "B", "text": "Trichophyton schonleinii"}, {"id": "C", "text": "Epidermophyton floccosum"}, {"id": "D", "text": "Trichophyton mentagrophytes"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given clinical scenario points to a diagnosis of onychomycosis and the pathogen most\ncommonly causing this condition is Trichophyton rubrum. Diabetes increases the risk of\nonychomycosis.\nOnychomycosis refers to nail infections caused by fungi. It can be due to dermatophytes,\nnon-dermatophytic moulds, and candida. Tinea unguium refers to nail infections caused by\ndermatophytes. This condition may affect toenails or fingernails, but toenail infections are\nparticularly common.\nThe following photomicrograph of the nail segment in KOH shows T. rubrum fungal hyphae\ninvading nail cells.\nThe following image is of a lactophenol cotton blue(LPCB) mount showing pyriform shaped\nmicroconidia on the hyphae of T. rubrum.", "questionPages": [449, 450], "solutionPages": [462, 463, 464], "questionFigures": ["crop-question-ch28-q8-1"], "solutionFigures": ["crop-solution-ch28-q8-1"]}, {"id": "ch28-q9", "chapterId": 28, "chapter": "Superficial and Systemic Mycoses", "number": 9, "text": "Which of the following organisms causes disease following traumatic inoculation into the\nskin?", "options": [{"id": "A", "text": "Sporothrix schenckii"}, {"id": "B", "text": "Blastomyces dermatitidis"}, {"id": "C", "text": "Coccidioides immitis"}, {"id": "D", "text": "Paracoccidioides brasiliensis"}], "correctIndex": 0, "correctLetter": "A", "solution": "Sporothrix schenckii causes infection followed by traumatic inoculation into the skin.\nIt is a dimorphic fungus that lives on vegetation such as grasses, trees, rose bushes, etc. Following\ntraumatic inoculation into the skin as in thorn prick, S schenckii causes sporotrichosis, a chronic\ngranulomatous infection. This is usually further followed by spread along the draining lymphatics\nand lymph nodes as shown in the image below.\nee\nmt :\nSubcutaneous mycoses are usually caused by traumatic inoculation of the causative fungus. These\ninclude:", "questionPages": [450], "solutionPages": [464, 465], "questionFigures": [], "solutionFigures": ["crop-solution-ch28-q9-1", "crop-solution-ch28-q9-2"]}, {"id": "ch28-q10", "chapterId": 28, "chapter": "Superficial and Systemic Mycoses", "number": 10, "text": "Which of the following is false about the most commonly used culture media for growing\nfungi?", "options": [{"id": "A", "text": "Contains taurocholate"}, {"id": "B", "text": "Is a specific media"}, {"id": "C", "text": "Contains cycloheximide"}, {"id": "D", "text": "Has an acidic pH"}], "correctIndex": 0, "correctLetter": "A", "solution": "Sabouraud dextrose agar (SDA) is the most commonly used culture media for growing fungi. It\ndoes not contain taurocholate.\nIt consists of antibiotics like gentamicin or chloramphenicol to inhibit the contaminant bacteria\nand also cycloheximide to inhibit the growth of saprophytic fungi. It has an acidic pH of 5.4.

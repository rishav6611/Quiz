": ["crop-solution-ch34-q17-1"]}, {"id": "ch34-q18", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 18, "text": "A 54-year-old farmer from Assam presented with the finding shown in the image. He had also\ndeveloped a painless swelling in his elbow 2 years back which has gradually been increasing\nin size. Which of the following is the drug of choice to treat this condition?", "options": [{"id": "A", "text": "Eflornithine"}, {"id": "B", "text": "Suramin"}, {"id": "C", "text": "Ivermectin"}, {"id": "D", "text": "Diethylcarbamazine"}], "correctIndex": 2, "correctLetter": "C", "solution": "The clinical scenario and image showing sclerosing keratitis are suggestive of onchocerchiasis\n(river blindness). The drug of choice is ivermectin.\nIt is caused by Onchocerca volvulus. It is also known as convoluted filaria or blinding filaria.\nThe vector is blackfly (Simulium species) which breed in fast-flowing rivers, and therefore the\ndisease is most common along the course of rivers. Hence, it is also called river blindness.\nThe usual presentation is formation of a subcutaneous nodule or onchocercoma. It is a firm\nnon-tender nodule arising from bony sites like scalp, elbow, ribs, and iliac crest. It is associated\nwith pruritus and rashes.\n\n\n\nThe microfilaria in the eyes cause photophobia and gradual loss of vision. The most severe\nmanifestation is sclerosing keratitis and chorioretinitis which causes blindness. It is the 2nd major\ninfective cause of blindness in the world after trachoma.\nSuramin and diethylcarbamazine (DEC) were used earlier but are not used nowadays. DEC\ndestroys microfilariae but usually causes Mazzotti reaction consisting of pruritus,\nrash, lymphadenopathy, fever, hypotension, and occasionally, eye damage.\nNote: Onchocerciasis is not endemic in India but sporadic cases have been reported from\nNorth-Eastern India.", "questionPages": [584, 585], "solutionPages": [598, 599], "questionFigures": ["crop-question-ch34-q18-1"], "solutionFigures": []}, {"id": "ch34-q19", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 19, "text": "A middle-aged woman presents to your clinic with photosensitivity, redness, and watering of\nthe eyes for the last 2 days. She shows you this photo of a swelling in her hand that had arisen\n2 weeks back but disappeared in just 3 days. What is the most likely diagnosis?", "options": [{"id": "A", "text": "Loiasis"}, {"id": "B", "text": "River blindness"}, {"id": "C", "text": "Tropical pulmonary eosinophilia"}, {"id": "D", "text": "Occult filariasis"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given clinical scenario and the image showing Calabar swelling is suggestive of loiasis caused\nby Loa loa.\nCalabar swellings are temporary foci of inflammation that appear as Loa loa wanders through the\nsubcutaneous tissues. They are up to 3 cm in size and are also called fugitive swellings because\nthey disappear in a few days only to reappear elsewhere.\nLoa loa is transmitted by the bite of Chrysops species (deerflies). The infective form is the third\nstage microfilaria. After entry into human skin, it grows into an adult worm.\nThe ocular manifestations occur when the worm reaches the subconjunctival tissue during its\nwanderings. They include:\n+ Granuloma in bulbar conjunctiva\n+ Painless edema of the eyelids\n+ Proptosis.\nThe image below shows Calabar swelling.\nThe image below shows a live, adult Loa loa in the anterior chamber of the eye.", "questionPages": [585, 586], "solutionPages": [599, 600], "questionFigures": ["crop-question-ch34-q19-1"], "solutionFigures": ["crop-solution-ch34-q19-1", "crop-solution-ch34-q19-2"]}, {"id": "ch34-q20", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 20, "text": "Which of the following is also known as Weingarten syndrome?", "options": [{"id": "A", "text": "Tropical pulmonary eosinophilia"}, {"id": "B", "text": "Loasis"}, {"id": "C", "text": "Onchocerciasis"}, {"id": "D", "text": "Tropical basophilia"}], "correctIndex": 0, "correctLetter": "A", "solution": "Tropical pulmonary eosinophilia is also known as Weingarten syndrome.\nTropical eosinophilia occurs as a result of hypersensitivity reaction to microfilarial antigens and\nnot directly due to lymphatic involvement. It is a manifestation of occult filariasis\n(Meyer's-Kouwenaar syndrome).\nClinical features of occult filariasis include massive eosinophilia and hepatosplenomegaly.\nSynonyms of tropical pulmonary eosinophilia include -\n+ Weingarten syndrome\n+ Pseudo-tuberculosis of the lung\n+ Eosinophilic pseudo-leukemia\n+ Tropical eosinophilic asthma\n+ Frimodt-Moller and Barton's syndrome", "questionPages": [586], "solutionPages": [600], "questionFigures": [], "solutionFigures": []}, {"id": "ch34-q21", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 21, "text": "Which of the following is known as serpent worm?", "options": [{"id": "A", "text": "Gnathostoma spinigerum"}, {"id": "B", "text": "Angiostrongylus cantonensis"}, {"id": "C", "text": "Dracunculus medinensis"}, {"id": "D", "text": "Capillaria philippinensis"}], "correctIndex": 2, "correctLetter": "C", "solution": "Dracunculus medinensis is known as serpent worm.\nIt is a viviparous nematode.\nThis has been eradicated from India and all of the southeast Asian region in the year 2000.", "questionPages": [586], "solutionPages": [600], "questionFigures": [], "solutionFigures": []}, {"id": "ch34-q22", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 22, "text": "Match the following parasites with their respective hosts:", "options": [{"id": "A", "text": "A-3, B-2, C-4, D-1"}, {"id": "B", "text": "A-2, B-1 ,C-4 ,D-3"}, {"id": "C", "text": "A-1, B-2, C-3, D-4"}, {"id": "D", "text": "A-4, B-3, C-1, D-2"}], "correctIndex": 0, "correctLetter": "A", "solution": "The explanation is provided in the related table/image below.", "questionPages": [586, 587], "solutionPages": [600, 601], "questionFigures": [], "solutionFigures": ["crop-solution-ch34-q22-1"]}, {"id": "ch35-q1", "chapterId": 35, "chapter": "Applied Microbiology", "number": 1, "text": "While assessing the quality of drinking water in a village, you detect the presence of coliform\nbacilli by the multiple tube technique. Following this, you decide to perform the Eijkman test.\nWhat is this test also known as?", "options": [{"id": "A", "text": "Presumptive coliform count"}, {"id": "B", "text": "Differential coliform test"}, {"id": "C", "text": "Colony plate count"}, {"id": "D", "text": "Methylene blue reduction test"}], "correctIndex": 1, "correctLetter": "B", "solution": "Eijkman test is also known as differential coliform test.\nDrinking water should be free of any pathogenic microorganisms. The presence of coliform\nbacteria in the water may indicate faecal pollution, while the detection of E.coli confirms it.\nThe presumptive coliform test is done by the multiple tube technique. Following this, the Eijkman\ntest is done to confirm the presence of E. coli. They can grow at 44°C (faecal thermotolerant\nbacilli), ferment lactose and cause indole and gas production.\nOption A: Presumptive coliform count detects the probable number of coliform bacilli in water. It\ncan be positive due to the presence of organisms other than E.coli also.\nOption C: Colony counts provide an estimate of the general bacterial purity of water.\nOption D: Methylene blue reduction test is used to assess the bacterial contamination of milk.", "questionPages": [602], "solutionPages": [], "questionFigures": [], "solutionFigures": []}, {"id": "ch35-q2", "chapterId": 35, "chapter": "Applied Microbiology", "number": 2, "text": "Faecal contamination of a water source is suspected by the mayor of a municipal corporation.\nHe asks you to test the water for evidence of recent contamination. The presence of which of\nthe following organisms would suggest this?", "options": [{"id": "A", "text": "Shigella"}, {"id": "B", "text": "Enterococcus"}, {"id": "C", "text": "Clostridium"}, {"id": "D", "text": "Staphylococcus"}], "correctIndex": 1, "correctLetter": "B", "solution": "Recent fecal contamination of water is suggested by the presence of enterococcus (fecal\nstreptococci).\nClostridium perfringens may be present for a long duration. If it is present in water, it suggests\nthat contamination is not recent.\nIf Escherichia coli is detected, it is definitive proof of fecal contamination. However, it is\nnon-specific for suggesting the duration of the contamination.", "questionPages": [602], "solutionPages": [], "questionFigures": [], "solutionFigures": []}, {"id": "ch35-q3", "chapterId": 35, "chapter": "Applied Microbiology", "number": 3, "text": "Which of the following tests is not used for bacteriological examination of milk?", "options": [{"id": "A", "text": "Methylene blue reduction test"}, {"id": "B", "text": "Phosphatase test"}, {"id": "C", "text": "Resazurin test"}, {"id": "D", "text": "Pasteurisation"}], "correctIndex": 3, "correctLetter": "D", "solution": "Pasteurization is not used for the bacteriological examination of milk.\nPasteurization is the process of applying heat, to milk, for a specified period for the purpose of\nkilling pathogenic bacteria. There are two methods: holder method and flash method.\nOption A: Methylene blue reduction test depends on the reduction of methylene blue by bacteria\nin milk when incubated at 37 °C in complete darkness.\nOption B: Resazurin test is similar to methylene blue reduction test, but the dye resazurin on\nreduction passes through a series of colour changes from blue to pink to colourless. The shade of\ncolour after incubation with milk for a particular period of time depends on the degree of\ncontamination.\n\n\n\nOption C: Phosphatase test is used to check whether milk has been pasteurised. Positive test after\npasteurisation of milk shows contamination after pasteurisation.", "questionPages": [602], "solutionPages": [609], "questionFigures": [], "solutionFigures": []}, {"id": "ch35-q4", "chapterId": 35, "chapter": "Applied Microbiology", "number": 4, "text": "The following image depicts:", "options": [{"id": "A", "text": "Production of monoclonal antibodies"}, {"id": "B", "text": "Cell lines for viral culture"}, {"id": "C", "text": "Vaccine synthesis"}, {"id": "D", "text": "Process of genetic engineering"}], "correctIndex": 0, "correctLetter": "A", "solution": "The image depicts the production of monoclonal antibodies by hybridoma technology.\nThe following are the steps involved in hybridoma technology:\n* Mice are immunized with an antigen. After several weeks of immunization, blood samples are\nobtained from mice for measurement of serum antibodies.\n+ When the antibody titer is high enough, mice are commonly boosted by injecting antigen\nwithout adjuvant intraperitoneally or intravenously. Then the mice are euthanized and their\nspleens removed for in vitro hybridoma cell production.\n+ Fusing antibody-producing spleen cells, which have a limited life span with myeloma cells\n(derived from an immortal tumor of lymphocytes) results in a hybridoma that is capable of\nunlimited growth.\n* The cells are cultured in a medium containing hypoxanthine, aminopterin, and thymidine (HAT\nmedium) which allows only the fused cells to survive in culture.\n* Monoclonal antibodies are then harvested.", "questionPages": [602, 603], "solutionPages": [609], "questionFigures": ["crop-question-ch35-q4-1"], "solutionFigures": ["crop-solution-ch35-q4-1"]}, {"id": "ch35-q5", "chapterId": 35, "chapter": "Applied Microbiology", "number": 5, "text": "Which of the following statements about hybridoma is false?", "options": [{"id": "A", "text": "Specific antibody-producing cells are integrated with myeloma cells."}, {"id": "B", "text": "Myeloma cells using salvage pathway grow well in HAT medium."}, {"id": "C", "text": "Aminopterin, a folate antagonist, inhibits de novo pathway."}, {"id": "D", "text": "HGPRTase and thymidylate synthetase are required for salvage pathway."}], "correctIndex": 1, "correctLetter": "B", "solution": "Aminopterin is a folate antagonist present in the HAT medium that inhibits the de novo pathway\nof nucleotide synthesis. Since myeloma cells cannot use the salvage pathway for nucleotide\nsynthesis due to the lack of HGPRTase enzyme, they cannot survive in the HAT medium.\n\n\n\nHybridoma technology is a method for producing large numbers of identical antibodies\n(monoclonal antibodies).\nHybridomas are somatic cell hybrids produced by fusing the antibody-forming spleen cells with\nmyeloma cells. The resultant hybrid thus has both the antibody-producing ability of the B-cell and\nthe ability to multiply indefinitely of the myeloma.\nThe following are the steps involved in hybridoma technology:\n* Mice are immunized with an antigen. After several weeks of immunization, blood samples are\nobtained from mice for measurement of serum antibodies.\n+ When the antibody titer is high enough, mice are commonly boosted by injecting antigen\nwithout adjuvant intraperitoneally or intravenously. Then the mice are euthanized and\ntheir spleens removed for in vitro hybridoma cell production.\n+ Fusing antibody-producing spleen cells, which have a limited life span with myeloma\ncells (derived from an immortal tumor of lymphocytes) results in a hybridoma that is capable of\nunlimited growth.\n* The cells are cultured in a medium containing hypoxanthine, aminopterin, and thymidine (HAT\nmedium) which allows only the fused cells to survive in culture.\n* Monoclonal antibodies are then harvested.", "questionPages": [603], "solutionPages": [609, 610], "questionFigures": [], "solutionFigures": ["crop-solution-ch35-q5-1"]}, {"id": "ch35-q6", "chapterId": 35, "chapter": "Applied Microbiology", "number": 6, "text": "Which of the following is both a diffusion and a dilution method of testing antibiotic\nsensitivity?", "options": [{"id": "A", "text": "Kirby-Bauer method"}, {"id": "B", "text": "Stokes method"}, {"id": "C", "text": "Epsilometer method"}, {"id": "D", "text": "Tube dilution method"}], "correctIndex": 2, "correctLetter": "C", "solution": "Epsilometer (E-test) is both a diffusion and a dilution method of testing antibiotic sensitivity.\nIt is a quantitative technique for determining the antimicrobial susceptibility (AST) and minimum\ninhibitory concentration (MIC) in ug/mL of gram-negative and gram-positive aerobic bacteria.\n\n\n\nThe antibiotic sensitivity tests are classified as follows:\n+ Diffusion methods: Kirby—Bauer method, Stokes method\n* Dilution methods: Tube dilution method, Agar dilution method\n+ Diffusion and dilution method: E-test (Epsilometer)", "questionPages": [603, 604], "solutionPages": [610, 611], "questionFigures": [], "solutionFigures": ["crop-solution-ch35-q6-1"]}, {"id": "ch35-q7", "chapterId": 35, "chapter": "Applied Microbiology", "number": 7, "text": "In which of the following is the disc diffusion method for antibiotic susceptibility testing\napplied?", "options": [{"id": "A", "text": "Agar dilution method"}, {"id": "B", "text": "Kirby-Bauer method"}, {"id": "C", "text": "Broth dilution method"}, {"id": "D", "text": "PCR based assay"}], "correctIndex": 1, "correctLetter": "B", "solution": "The disc diffusion method for antibiotic susceptibility testing is applied in the Kirby-Bauer\nmethod.\nTo perform Kirby-Bauer’s disc diffusion method, a suitable standard dilution of a broth culture of\nthe test bacterium is inoculated on the surface of a solid medium (Cation-adjusted Mueller-Hinton\nagar) as a lawn culture. After drying, various antibiotic discs are placed on its surface. Zones of\ninhibition around the disc are recorded and interpreted according to the zone diameters available\nin the tables of the Clinical and Laboratory Standards Institute (CLSI) guidelines. The results\nobtained are qualitative (resistant, sensitive, or partially sensitive).\nLaboratory testing for antibiotic sensitivity can be done by:\n+ Diffusion method- Kirby-Bauer disc diffusion method, Stokes disc diffusion method\n+ Dilution method- broth dilution method, agar dilution method\n* Combination of diffusion and dilution method- E-test (Epsilometer)\nThe image below shows Kirby-Bauer disc diffusion method.", "questionPages": [604], "solutionPages": [611, 612], "questionFigures": [], "solutionFigures": ["crop-solution-ch35-q7-1"]}, {"id": "ch35-q8", "chapterId": 35, "chapter": "Applied Microbiology", "number": 8, "text": "Which of the following methods of antibiotic susceptibility testing cannot be used to calculate\nthe minimum inhibitory concentration of an antimicrobial drug?", "options": [{"id": "A", "text": "Kirby-Bauer method"}, {"id": "B", "text": "Tube dilution method"}, {"id": "C", "text": "Agar dilution method"}, {"id": "D", "text": "Epsilometer method"}], "correctIndex": 0, "correctLetter": "A", "solution": "Minimum inhibitory concentration (MIC) cannot be calculated using Kirby-Bauer's disk diffusion\nmethod and Stokes disk diffusion method as they are semi-quantitative methods.\nMIC is the lowest concentration of an antimicrobial agent that will inhibit the visible growth of a\nmicroorganism.\nMethods to determine MIC include:\n* Tube dilution method\n+ Agar dilution method\n+ E-test method", "questionPages": [604], "solutionPages": [612], "questionFigures": [], "solutionFigures": []}, {"id": "ch35-q9", "chapterId": 35, "chapter": "Applied Microbiology", "number": 9, "text": "A microbiologist is about to run a polymerase chain reaction assay on the serum of a patient\nsuspected to have Q fever. He wishes to quantify the PCR by monitoring the amplification\nprocess while the PCR is ongoing. Which of the following types of PCR should he perform?", "options": [{"id": "A", "text": "Multiplex PCR"}, {"id": "B", "text": "Nested PCR"}, {"id": "C", "text": "Reverse transcriptase PCR"}, {"id": "D", "text": "Real time PCR"}], "correctIndex": 3, "correctLetter": "D", "solution": "Real-time polymerase chain reaction (PCR) can be used to quantify the PCR by monitoring the\namplification process while the PCR is ongoing.\nTypes of PCR:\n+ Reverse transcriptase PCR- The enzyme reverse transcriptase (RT) is used to synthesize a\ncomplementary copy of DNA (cDNA) from RNA and this cDNA is then used as a template for\nPCR.\n+ Real-time PCR- This helps quantify the PCR and gives an estimate of the pathogen DNA load in\nthe specimen. It uses fluorescent dyes or specific DNA probes. It is also known as qPCR\n(Quantitative PCR)\n* Multiplex PCR- Primers to more than one pathogen are used simultaneously and hence multiple\nproducts are obtained.\n\n\n\n+ Nested PCR- It involves the sequential use of two primer sets. The first primer set is used for\namplification and the amplicon obtained is then used as a target sequence for second\namplification. This ensures specificity.", "questionPages": [604], "solutionPages": [612, 613], "questionFigures": [], "solutionFigures": []}, {"id": "ch35-q10", "chapterId": 35, "chapter": "Applied Microbiology", "number": 10, "text": "Which of the following investigations does not use antibody marking?", "options": [{"id": "A", "text": "ELISA"}, {"id": "B", "text": "Radioimmunoassay"}, {"id": "C", "text": "Immunofluorescence"}, {"id": "D", "text": "Hemagglutination Test"}], "correctIndex": 3, "correctLetter": "D", "solution": "The hemagglutination test is not based on the principle of antibody marking.\nWhen antibodies bind to antigens on the surface of red blood cells, the resultant clumping\nreaction is referred to as hemagglutination. It is routinely performed to type red blood cells in\nABO blood-typing.\nThe image below shows hemagglutination.\nIn ELISA, radioimmunoassay and immunofluorescence, the antigens or antibodies are labeled or\nmarked with enzymes, fluorescent dyes, etc.\nNote: If no hemagglutination occurs it means the patient’s serum has anti-haemagglutinin\nantibodies that bind to hemagglutinin and prevent the clumping reaction. This hemagglutination\ninhibition reaction is a method of detection of viruses and antiviral-antibodies and is used to\nmake a diagnosis of influenza.", "questionPages": [604, 605], "solutionPages": [613], "questionFigures": [], "solutionFigures": ["crop-solution-ch35-q10-1"]}, {"id": "ch35-q11", "chapterId": 35, "chapter": "Applied Microbiology", "number": 11, "text": "Which of the following is not used as an immediate test in the screening of urinary tract\ninfections?", "options": [{"id": "A", "text": "Pour plate culture"}, {"id": "B", "text": "Griess Nitrite test"}, {"id": "C", "text": "Leukocyte esterase test"}, {"id": "D", "text": "Wet mount examination"}], "correctIndex": 0, "correctLetter": "A", "solution": "Pour plate culture (quantitative test) is not used as an immediate test for screening of\nUTI. However, it is considered the best diagnostic test for confirmation of UTI due it’s high\nsensitivity and specificity.\nThe screening tests for UTI are as follows:\n+ Wet mount examination- It is done to demonstrate pus cells in urine.\n\n\n\n* Leukocyte esterase test- It is a rapid and cheaper method and detects leukocyte esterases\nsecreted by pus cells present in urine.\n+ Nitrate reduction test (Griess test)- Nitrate reducing bacteria like E. coli gives a positive result.\n+ Catalase test- E. coli and other bacteria that produce the enzyme catalase give a positive result.\nQuantitative Culture:\n* Standardized loop technique\n* Pour plate method", "questionPages": [605], "solutionPages": [613, 614], "questionFigures": [], "solutionFigures": []}, {"id": "ch35-q12", "chapterId": 35, "chapter": "Applied Microbiology", "number": 12, "text": "The CLED medium is preferred over MacConkey agar for the culture of organisms in case of\nUTI because:", "options": [{"id": "A", "text": "It inhibits proteus swarming"}, {"id": "B", "text": "It promotes the growth of candida, streptococcus and staphylococcus"}, {"id": "C", "text": "It differentiates between lactose-fermenting and non-lactose fermenting bacteria"}, {"id": "D", "text": "It promotes the growth of pseudomonas"}], "correctIndex": 1, "correctLetter": "B", "solution": "CLED (Cysteine lactose electrolyte-deficient) medium is preferred over MacConkey agar for the\nculture of organisms involved in urinary tract infections because it is less inhibitory and promotes\nthe growth of gram-positive bacteria (except B hemolytic streptococcus) and candida.\nIt is used as an alternative to the combination of blood agar and MacConkey agar, for the\nprocessing of urine specimens.\nCLED medium is not similar to blood agar in the fact that it can prevent swarming of proteus. It is\nsimilar to MacConkey agar in that it differentiates between lactose fermenters and\nnon-fermenters.", "questionPages": [605], "solutionPages": [614], "questionFigures": [], "solutionFigures": ["crop-solution-ch35-q12-1"]}, {"id": "ch35-q13", "chapterId": 35, "chapter": "Applied Microbiology", "number": 13, "text": "A patient who had been receiving ceftazidime and amikacin via central venous line for a week\nsuddenly spiked a fever. Blood culture is positive for a vancomycin-resistant,\ncatalase-negative organism whose Gram-stained image is given below. Identify the organism.", "options": [{"id": "A", "text": "Staphylococcus aureus"}, {"id": "B", "text": "Viridans streptococci"}, {"id": "C", "text": "Enterococcus faecalis"}, {"id": "D", "text": "Coagulase-negative staphylococcus"}], "correctIndex": 2, "correctLetter": "C", "solution": "From the given case scenario and image we can deduce that the most likely organism involved is\nEnterococcus faecalis.\nThe image shows gram-positive cocci in chains, that are described as catalase negative. This helps\nrule out Staphylocococcus aureus and coagulase-negative staphylococcus.\n\n\n\nStreptococcus viridans is usually sensitive to penicillin and vancomycin hence it is ruled out.\nThe mechanism of vancomycin resistance seen in E. faecalis is the alteration of the\nD-alanyl—D-alanine chain in the cell wall.", "questionPages": [605, 606], "solutionPages": [614, 615], "questionFigures": ["crop-question-ch35-q13-1"], "solutionFigures": []}, {"id": "ch35-q14", "chapterId": 35, "chapter": "Applied Microbiology", "number": 14, "text": "Which of the following is a bioterrorism category A agent?", "options": [{"id": "A", "text": "Nipah virus"}, {"id": "B", "text": "Anthrax"}, {"id": "C", "text": "Coxiella"}, {"id": "D", "text": "Brucella"}], "correctIndex": 1, "correctLetter": "B", "solution": "Bacillus anthracis which causes anthrax is categorized under category A bioterrorism agent.", "questionPages": [606], "solutionPages": [615], "questionFigures": [], "solutionFigures": []}, {"id": "ch35-q15", "chapterId": 35, "chapter": "Applied Microbiology", "number": 15, "text": "The test kit shown in the image below works on the principle of:", "options": [{"id": "A", "text": "ELISA"}, {"id": "B", "text": "Immunochromatography"}, {"id": "C", "text": "Immunofluroscence"}, {"id": "D", "text": "Chemiluminiscence"}], "correctIndex": 1, "correctLetter": "B", "solution": "The above image shows a HbsAg card test kit which works on the principle\nof immunochromatography.\nThe immunochromatographic membrane is used for antigen detection, while a nitrocellulose\nmembrane is used to absorb the antigen from a specimen. A coloured reaction appears directly on\nthe membrane with the sequential addition of conjugate followed by the substrate. In some cases,\nthe antigen is captured by a bound antibody directed against the antigen. These assays have the\nadvantage of being rapid and also frequently include a built-in internal control.", "questionPages": [606, 607, 608], "solutionPages": [615], "questionFigures": ["crop-question-ch35-q15-1"], "solutionFigures": []}], "pageImages": {}, "figureImages": {"crop-question-ch1-q1-1": "assets/image_0001.webp", "crop-solution-ch1-q1-1": "assets/image_0002.webp", "crop-question-ch1-q2-1": "assets/image_0003.webp", let currentChapter = null;
let questions = [];
let index = 0;
let selectedChapterId = null;
const state = {};
const $ = id => document.getElementById(id);

function init() {
  selectedChapterId = DATA.chapters[0]?.id || null;
  $('summary').textContent = `Practice with ${DATA.questions.length} questions across ${DATA.chapters.length} chapters`;
  $('totalQuestions').textContent = DATA.questions.length;
  $('totalChapters').textContent = DATA.chapters.length;
  $('chapterSelect').innerHTML = DATA.chapters.map(ch => `<option value="${ch.id}">${ch.id}. ${escapeHtml(ch.title)} (${ch.count} questions)</option>`).join('');
  $('chapterSelect').onchange = e => selectChapter(Number(e.target.value));
  $('startBtn').onclick = () => startChapter(selectedChapterId);
  $('homeBtn').onclick = showHome;
  $('prevBtn').onclick = () => loadQuestion(index - 1);
  $('nextBtn').onclick = () => loadQuestion(index + 1);
  $('submitBtn').onclick = submitAnswer;
  buildChapterList();
  selectChapter(selectedChapterId);
}
function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function buildChapterList() {
  $('chapterList').innerHTML = DATA.chapters.map(ch => `<button class="category-card" id="chapter-card-${ch.id}" onclick="selectChapter(${ch.id})" type="button"><div class="chapter-number">Chapter ${ch.id}</div><div class="category-name">${escapeHtml(ch.title)}</div><div class="category-count">${ch.count} Qs</div></button>`).join('');
}
function selectChapter(id) {
  selectedChapterId = id;
  $('chapterSelect').value = String(id);
  document.querySelectorAll('.category-card').forEach(card => card.classList.remove('active'));
  const card = $('chapter-card-' + id);
  if (card) card.classList.add('active');
}
function showHome() {
  $('chapterScreen').classList.remove('hidden');
  $('quizScreen').classList.add('hidden');
  $('quizScreen').classList.remove('active');
}
function startChapter(id) {
  currentChapter = DATA.chapters.find(c => c.id === id);
  if (!currentChapter) return;
  questions = DATA.questions.filter(q => q.chapterId === id);
  index = 0;
  $('chapterScreen').classList.add('hidden');
  $('quizScreen').classList.remove('hidden');
  $('quizScreen').classList.add('active');
  $('chapterName').textContent = currentChapter.title;
  buildNav();
  loadQuestion(0);
}
function buildNav() {
  $('qnav').innerHTML = questions.map((q,i) => `<button class="quick-nav-item" id="nav-${i}" onclick="loadQuestion(${i})" type="button">${i+1}</button>`).join('');
}
function loadQuestion(i) {
  if (i < 0 || i >= questions.length) return;
  index = i;
  const q = questions[i], s = state[q.id] || {};
  const answered = questions.filter(item => state[item.id]?.submitted).length;
  $('progress').textContent = `Question ${i+1} of ${questions.length}`;
  $('progressFill').style.width = `${((i + 1) / questions.length) * 100}%`;
  $('qmeta').textContent = `Source question ${q.number}`;
  $('sourceTag').textContent = `Source ${q.number}`;
  $('answeredMeta').textContent = `${answered} answered`;
  $('qtitle').textContent = `Question ${q.number}`;
  $('qtext').textContent = q.text || '[Question text not detected by OCR.]';
  renderQuestionImages(q);
  $('options').innerHTML = q.options.map((opt, oi) => `<button type="button" class="option ${s.selected===oi?'selected':''} ${s.submitted && q.correctIndex===oi?'correct':''} ${s.submitted && s.selected===oi && q.correctIndex!==oi?'wrong':''}" onclick="selectOption(${oi})"><div class="option-letter">${escapeHtml(opt.id)}</div><div class="option-text">${escapeHtml(opt.text)}</div></button>`).join('');
  $('submitBtn').style.display = s.submitted ? 'none' : 'flex';
  $('solutionBox').classList.toggle('show', !!s.submitted);
  renderSolution(q, s);
  document.querySelectorAll('.quick-nav-item').forEach((b, bi) => {
    const qb = questions[bi], st = state[qb.id] || {};
    b.className = 'quick-nav-item' + (bi===index?' current':'') + (st.submitted?' answered':'') + (st.submitted && qb.correctIndex !== null && st.selected === qb.correctIndex?' correct':'') + (st.submitted && qb.correctIndex !== null && st.selected !== qb.correctIndex?' wrong':'');
  });
  $('prevBtn').disabled = i === 0;
  $('nextBtn').textContent = i === questions.length - 1 ? 'Finish' : 'Next';
}
function selectOption(oi) {
  const q = questions[index], s = state[q.id] || (state[q.id] = {});
  if (s.submitted) return;
  s.selected = oi;
  loadQuestion(index);
}
function submitAnswer() {
  const q = questions[index], s = state[q.id] || (state[q.id] = {});
  if (s.selected === undefined) { alert('Please select an answer first.'); return; }
  s.submitted = true;
  loadQuestion(index);
}
function renderSolution(q, s) {
  if (!s.submitted) return;
  const selected = q.options[s.selected]?.id || '';
  let status = '';
  if (q.correctIndex === null || q.correctIndex === undefined) {
    status = `<div class="status warn">Answer not verified from OCR. Your selected answer: ${selected}. Please confirm using the solution below.</div>`;
  } else if (s.selected === q.correctIndex) {
    status = `<div class="status ok">Correct. Answer: ${q.options[q.correctIndex].id} - ${escapeHtml(q.options[q.correctIndex].text)}</div>`;
  } else {
    status = `<div class="status bad">Incorrect. Correct answer: ${q.options[q.correctIndex].id} - ${escapeHtml(q.options[q.correctIndex].text)}</div>`;
  }
  $('answerStatus').innerHTML = status;
  $('solutionText').innerHTML = formatSolutionText(q.solution || 'Solution text was not detected by OCR.');
  renderSolutionImages(q);
}
function formatSolutionText(raw) {
  const cleaned = String(raw || '')
    .replace(/\r/g, '')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
  if (!cleaned) return '<p>Solution text was not detected by OCR.</p>';
  const lines = cleaned.split('\n').map(line => line.trim()).filter(Boolean);
  let html = '';
  let bullets = [];
  const flushBullets = () => {
    if (!bullets.length) return;
    html += '<ul>' + bullets.map(item => `<li>${escapeHtml(item)}</li>`).join('') + '</ul>';
    bullets = [];
  };
  const junk = /^(MARROW|©MARROW|a A dex final|nS Sc =|pot|\|)$/i;
  for (const line of lines) {
    if (junk.test(line)) continue;
    const bullet = line.match(/^[+*•\-]\s*(.+)$/);
    if (bullet) {
      bullets.push(bullet[1].trim());
      continue;
    }
    flushBullets();
    const isShortLabel = line.length < 42 && /:$/.test(line);
    const cls = /^note\s*:/i.test(line) ? ' class="ocr-muted"' : '';
    html += `<p${cls}>${isShortLabel ? '<strong>' + escapeHtml(line) + '</strong>' : escapeHtml(line)}</p>`;
  }
  flushBullets();
  return html;
}
function renderSolutionImages(q) {
  const figures = [...new Set(q.solutionFigures || [])];
  const imgs = figures
    .filter(id => DATA.figureImages[id])
    .map((id, i) => `<img class="solution-figure-img" src="${DATA.figureImages[id]}" alt="Related solution figure ${i + 1}">`)
    .join('');
  $('solutionImages').innerHTML = imgs
    ? `<h3>Related diagram/image</h3><div class="solution-figure-grid">${imgs}</div>`
    : '';
}
function renderQuestionImages(q) {
  const figures = [...new Set(q.questionFigures || [])];
  const imgs = figures
    .filter(id => DATA.figureImages[id])
    .map((id, i) => `<img class="question-figure-img" src="${DATA.figureImages[id]}" alt="Question figure ${i + 1}">`)
    .join('');
  $('questionImages').innerHTML = imgs
    ? `<div class="question-figure-grid">${imgs}</div>`
    : '';
}
init();
</script>

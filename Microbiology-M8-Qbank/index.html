t": "Listeria"}], "correctIndex": 0, "correctLetter": "A", "solution": "The above clinical scenario suggests a diagnosis of Weil's disease which is caused by leptospira.\nLong hours of working in a field with water (paddy field), is a high-risk factor for the development\nof leptospirosis.\nWeil’s syndrome is the severe form of leptospirosis that encompasses the triad of hemorrhage,\njaundice, and acute kidney injury.\nThe treatment of choice is IV penicillin or IV ceftriaxone.", "questionPages": [322], "solutionPages": [332], "questionFigures": [], "solutionFigures": []}, {"id": "ch20-q18", "chapterId": 20, "chapter": "Spirochetes", "number": 18, "text": "At a relief camp in Karnataka, a few people developed fever, myalgia, and conjunctival\nsuffusion. Rapid diagnostic IgM ELISA tests performed in the field showed leptospirosis.\nWhich of the following culture media can be used to confirm this diagnosis?", "options": [{"id": "A", "text": "EMJH"}, {"id": "B", "text": "BCYE"}, {"id": "C", "text": "TCBS"}, {"id": "D", "text": "CCFA"}], "correctIndex": 0, "correctLetter": "A", "solution": "Ellinghausen, McCullough, Johnson, Harris (EMJH) media is the culture medium used for\nleptospira.\n\n\n\nOther culture media that can be used are Korthof's, Stuart's, and Fletcher's media.\nThe image below shows EMJH medium, with Dinger's ring/zone. The growth of the leptospires is\nat a maximum density at this zone. It is identified as an area of increased turbidity, beneath the\nsurface of the semi-solid medium. It is the zone of optimum oxygen tension for the growth of the\nbacteria.", "questionPages": [322, 323], "solutionPages": [332, 333], "questionFigures": [], "solutionFigures": ["crop-solution-ch20-q18-1"]}, {"id": "ch20-q19", "chapterId": 20, "chapter": "Spirochetes", "number": 19, "text": "A 16-year-old boy is admitted with fever, icterus, conjunctival suffusion, and hematuria for 15\ndays. Which serological test should be done for diagnosis?", "options": [{"id": "A", "text": "Widal test"}, {"id": "B", "text": "Microscopic agglutination test"}, {"id": "C", "text": "Weil felix reaction"}, {"id": "D", "text": "Paul Bunnell test"}], "correctIndex": 1, "correctLetter": "B", "solution": "History of fever with liver and kidney involvement should arouse suspicion for leptospirosis\n(Weil's disease). A microscopic agglutination test is used for the diagnosis of leptospirosis.\nSerotype-specific tests:\n* Microscopic agglutination test\n* Macroscopic agglutination test\nOption A: Widal test is used to screen for typhoid fever\nOption C: Weil-Felix reaction is used to diagnose rickettsial fevers\nOption D: Paul-Bunnell test is the investigation of choice for infectious mononucleosis.", "questionPages": [323], "solutionPages": [333], "questionFigures": [], "solutionFigures": []}, {"id": "ch20-q20", "chapterId": 20, "chapter": "Spirochetes", "number": 20, "text": "A 12-year-old boy presents with right upper quadrant pain, calf pain, conjunctival suffusion,\nicterus, and fever. Examination shows tender hepatomegaly. What is the most likely\ndiagnosis?", "options": [{"id": "A", "text": "Chikungunya"}, {"id": "B", "text": "Leptospirosis"}, {"id": "C", "text": "Dengue hemorrhagic fever"}, {"id": "D", "text": "Encephalopathy caused by hepatitis A"}], "correctIndex": 1, "correctLetter": "B", "solution": "The most likely diagnosis based on the clinical vignette is leptospirosis.\nLeptospirosis is a zoonosis caused by spirochetes of the genus Leptospira. Patients with mild\ndisease may present with flu-like symptoms of sudden onset, fever with chills, headache,\nabdominal pain, conjunctival suffusion, and myalgia. The muscle pain usually affects the calves,\nabdomen, and back. Mild cases can be treated with oral doxycycline, ampicillin, or amoxicillin.\n\n\n\nSevere leptospirosis is rapidly progressive and is associated with high fatality. The classic\npresentation of the severe disease called Weil’s syndrome includes the triad of hemorrhage,\njaundice, and acute kidney injury. Jaundice when present can be profound and physical\nexamination may reveal an enlarged, tender liver. Temperature-pulse dissociation /relative\nbradycardia can be seen. Moderate to severe cases are treated with intravenous penicillin,\nampicillin, or ceftriaxone.\nThe image below shows icterus and conjunctival suffusion in a patient with leptospirosis.\nLeptospira are actively motile organisms and are best seen using a dark-field microscope. They are\nthin, tightly coiled, and flexible spirochetes with one end forming a hook. Diagnosis is by\nmicroscopic agglutination test.\nTransmission occurs through cuts or breaks in the skin and mucous membranes (conjunctival and\noral mucosa). Several outbreaks have been reported that resulted from exposure to floodwaters\ncontaminated by urine from infected animals. The organism enters the bloodstream and lodges in\nthe parenchymatous organs (liver and kidneys) leading to hemorrhage and necrosis of the tissue\n\n\n\ncausing dysfunction of the organs.\nThe lifecycle of Leptospira is shown below.\nIllness is classically biphasic after an incubation period of up to 1 month. The stages are:\n+ Acute leptospiremic phase- the organism can be cultured from blood.\n+ Resolving immune phase- the organism can be cultured from urine.\nThe stages may not be clinically distinguishable.\nOther options:\nOption A - Chikungunya is a viral disease that presents with saddle-back fever, conjunctival\nsuffusion, and photophobia. Migratory arthralgia, especially involving small joints may also be\nseen. A maculopapular or petechial rash is frequently seen on the trunk.\nOption C - Dengue hemorrhagic fever is a form of severe dengue with bleeding manifestations.\nEvidence of plasma leakage and thrombocytopenia is also generally seen.\nOption D - Encephalitis due to Hepatitis A is seen in fulminant hepatitis, a rare complication.\nPatients present with confusion, disorientation, ascites, and edema.", "questionPages": [323, 324], "solutionPages": [333, 334, 335], "questionFigures": [], "solutionFigures": ["crop-solution-ch20-q20-1", "crop-solution-ch20-q20-2"]}, {"id": "ch21-q1", "chapterId": 21, "chapter": "General Properties of Viruses", "number": 1, "text": "What is the protein coat covering the nucleic acid in a virion known as?", "options": [{"id": "A", "text": "Capsid"}, {"id": "B", "text": "Peplomer"}, {"id": "C", "text": "Envelope"}, {"id": "D", "text": "Tegument"}], "correctIndex": 0, "correctLetter": "A", "solution": "The protein coat covering the nucleic acid in a virion is called capsid.\nThe parts of a virus include:\n* Nucleocapsid- capsid with enclosed nucleic acid\n* Tegument- proteinaceous structure present between the envelope and capsid.\n+ Envelope- lipid-containing membrane that surrounds some virus particles. It is acquired during\nviral maturation by a budding process through a cellular membrane.\n* Peplomers- virus-encoded glycoproteins, on the outer surface of the envelope as projections.\nCharacteristics of viruses:\n* Do not have a cellular organization\n+ Have either DNA or RNA but never both\n+ Obligate intracellular parasites\n* Lack enzymes necessary for protein and nucleic acid synthesis\n+ Filterable\n* Cannot be grown on artificial media\n* Unaffected by antibiotics.\nNote : Martinus beijerinck proposed the theory of contagium vivum fluidum (living infectious\nfluid) while studying the cause of mosaic disease of tobacco plant. He is known as the father of\nvirology.", "questionPages": [336], "solutionPages": [343], "questionFigures": [], "solutionFigures": ["crop-solution-ch21-q1-1"]}, {"id": "ch21-q2", "chapterId": 21, "chapter": "General Properties of Viruses", "number": 2, "text": "Which of the following viruses has a single-stranded DNA?", "options": [{"id": "A", "text": "Poxvirus"}, {"id": "B", "text": "Parvovirus"}, {"id": "C", "text": "Picornavirus"}, {"id": "D", "text": "Reovirus"}], "correctIndex": 1, "correctLetter": "B", "solution": "Parvovirus has single-stranded DNA.\nAll DNA viruses are double-stranded, except parvovirus. (only single-stranded DNA virus)\nAll RNA viruses have only one copy of single-stranded RNA except:\n* Reovirus- double-stranded RNA virus.\n* Retroviruses- Two copies of single-stranded RNA.\nParvovirus is the smallest DNA virus that infect human beings.", "questionPages": [336], "solutionPages": [343], "questionFigures": [], "solutionFigures": ["crop-solution-ch21-q2-1"]}, {"id": "ch21-q3", "chapterId": 21, "chapter": "General Properties of Viruses", "number": 3, "text": "Which of the following is false regarding enveloped viruses?", "options": [{"id": "A", "text": "Ether sensitive"}, {"id": "B", "text": "Heat labile"}, {"id": "C", "text": "Susceptible to bile salts"}, {"id": "D", "text": "Lipid is viral coded"}], "correctIndex": 3, "correctLetter": "D", "solution": "The lipid of enveloped viruses is largely of host-cell origin, whereas protein is virus coded.\nThe following are the differences between enveloped and non-enveloped viruses.", "questionPages": [336], "solutionPages": [343], "questionFigures": [], "solutionFigures": ["crop-solution-ch21-q3-1"]}, {"id": "ch21-q4", "chapterId": 21, "chapter": "General Properties of Viruses", "number": 4, "text": "Which of the following is an enveloped virus?", "options": [{"id": "A", "text": "Reovirus"}, {"id": "B", "text": "Hepatitis A virus"}, {"id": "C", "text": "Hepatitis C virus"}, {"id": "D", "text": "Adenovirus"}], "correctIndex": 2, "correctLetter": "C", "solution": "Hepatitis C virus is an enveloped virus.\nIt has a linear, single-stranded RNA genome, enclosed within a core and surrounded by an\nenvelope.", "questionPages": [336, 337], "solutionPages": [343], "questionFigures": [], "solutionFigures": []}, {"id": "ch21-q5", "chapterId": 21, "chapter": "General Properties of Viruses", "number": 5, "text": "A patient in the ICU requires fresh frozen plasma (FFP). The FFP that arrives from the blood\nbank is labeled as Solvent/Detergent plasma, which destroys lipid-enveloped viruses. Which\nof the following viral infections is the patient still susceptible to?", "options": [{"id": "A", "text": "Human immunodeficiency virus"}, {"id": "B", "text": "Hepatitis A virus"}, {"id": "C", "text": "Hepatitis B virus"}, {"id": "D", "text": "Hepatitis C virus"}], "correctIndex": 1, "correctLetter": "B", "solution": "The patient is still susceptible to hepatitis A infection. It is a non-enveloped virus, and hence it’s\nnot affected by SD plasma.\n\n\n\nSolvent/Detergent plasma (SD plasma) is a form of blood plasma made from plasma collected\nfrom many people which is then processed with solvents in an attempt to remove viruses.\nOnly the viruses with an envelope are susceptible to SD plasma destruction. Hepatitis B, C, and\nHuman immunodeficiency virus (HIV) are enveloped.", "questionPages": [337], "solutionPages": [343, 344], "questionFigures": [], "solutionFigures": []}, {"id": "ch21-q6", "chapterId": 21, "chapter": "General Properties of Viruses", "number": 6, "text": "In which of the following viruses is a segmented genome found?", "options": [{"id": "A", "text": "Filovirus"}, {"id": "B", "text": "Orthomyxovirus"}, {"id": "C", "text": "Retrovirus"}, {"id": "D", "text": "Poliovirus"}], "correctIndex": 1, "correctLetter": "B", "solution": "Segmented genome is found in orthomyxovirus.\nSegmentation of viral genomes allows for the exchange of intact genes between related viruses\nduring coinfection. This recombination is known as reassortment. There is a rearrangement and\njoining of nucleic acid sequences to form a unique chimeric genome. The new genome is usually\nless fit than the parent viruses, but occasionally, it results in an evolved virus with increased\nfitness.\nExamples of segmented viruses (ARBO):\n+ Arenavirus (2 segments)\n* Rotavirus (11 segments)\n« Bunyavirus (3 segments)\n* Orthomyxovirus (8 segments)\nThe image below shows the segmented genome seen in the influenza virus (Orthomyxoviridae)", "questionPages": [337], "solutionPages": [344], "questionFigures": [], "solutionFigures": ["crop-solution-ch21-q6-1"]}, {"id": "ch21-q7", "chapterId": 21, "chapter": "General Properties of Viruses", "number": 7, "text": "A 6-year-old with HIV is brought with complaints of the rash shown below. Where does DNA\nreplication occur in the viruses falling in the same family as the microbe causing this rash?", "options": [{"id": "A", "text": "Host cytoplasm"}, {"id": "B", "text": "Host nucleus"}, {"id": "C", "text": "Viral cytoplasm"}, {"id": "D", "text": "Viral nucleus"}], "correctIndex": 0, "correctLetter": "A", "solution": "The image shows pink, fleshy umbilicated papules suggesting molluscum contagiosum. It is\ncaused by the Molluscum contagiosum virus belonging to Poxviridae. DNA replication in these\nviruses occurs in the host cytoplasm.", "questionPages": [337, 338], "solutionPages": [344, 345], "questionFigures": ["crop-question-ch21-q7-1"], "solutionFigures": ["crop-solution-ch21-q7-1"]}, {"id": "ch21-q8", "chapterId": 21, "chapter": "General Properties of Viruses", "number": 8, "text": "An epidemic involving an ss-RNA virus with 3'-5' RNA has broken out in West Africa. Which\nof the following enzymes do such viruses use in genome replication?", "options": [{"id": "A", "text": "DNA-dependent RNA polymerase"}, {"id": "B", "text": "RNA replicase"}, {"id": "C", "text": "Reverse transcriptase"}, {"id": "D", "text": "Taq polymerase"}], "correctIndex": 1, "correctLetter": "B", "solution": "An ss-RNA with a 3'-5' strand is a negative-stranded RNA. These viruses use RNA replicase\nor RNA-dependent RNA polymerase during genome replication.\nIn positive-stranded RNA viruses, the viral RNA itself acts as mRNA.\nIn negative-stranded RNA viruses, the polarity is opposite that of mRNA. So the genome requires\nRNA-dependent RNA polymerase to synthesize their mRNA.\nExamples of negative-stranded RNA viruses (Mnemonic: Always bring da polymerase or fail to\nreplicate):\n+ Arenaviruses\n+ Bunyaviruses\n+ Deltaviruses\n+ Paramyxoviruses\n* Orthomyxoviruses\n+ Filoviruses\n+ Rhabdoviruses", "questionPages": [338], "solutionPages": [345], "questionFigures": [], "solutionFigures": []}, {"id": "ch21-q9", "chapterId": 21, "chapter": "General Properties of Viruses", "number": 9, "text": "The virus shown below was suspected to be the cause of a deadly hemorrhagic fever outbreak\nin Guinea in March 2021. How is it transmitted?", "options": [{"id": "A", "text": "Direct contact with infected body fluids"}, {"id": "B", "text": "Mosquito-borne"}, {"id": "C", "text": "Food-borne"}, {"id": "D", "text": "Air-borne"}], "correctIndex": 0, "correctLetter": "A", "solution": "The image shown above is the Ebola virus. It is spread by direct contact with infected body fluids.\nEbola is a filamentous virus with a single-stranded RNA genome.\nThe shapes of some viruses are shown below.\n\n\n\nRotavirus: Wheel-shaped virus", "questionPages": [338, 339], "solutionPages": [345, 346, 347], "questionFigures": ["crop-question-ch21-q9-1"], "solutionFigures": ["crop-solution-ch21-q9-1", "crop-solution-ch21-q9-2"]}, {"id": "ch21-q10", "chapterId": 21, "chapter": "General Properties of Viruses", "number": 10, "text": "An elderly diabetic man presents with a complaints of fever, cough and difficulty in breathing\nfor the past 3 days. He gives a history of international travel 10 days back. Laboratory reports\nshow positive for COVID-19. What is the symmetry of the causative virus?", "options": [{"id": "A", "text": "Naked helical symmetry"}, {"id": "B", "text": "Icosahedral symmetry"}, {"id": "C", "text": "Enveloped helical symmetry"}, {"id": "D", "text": "Complex symmetry"}], "correctIndex": 2, "correctLetter": "C", "solution": "The patient is suffering from coronavirus disease 2019 (COVID-19). The coronavirus implicated\nshows an enveloped helical symmetry.\nProperties of Coronaviridae family:\n* They are enveloped RNA viruses.\n+ They contain a genome of unsegmented single-stranded and positive-sense RNA\n* They have helical nucleocapsid", "questionPages": [339], "solutionPages": [347], "questionFigures": [], "solutionFigures": []}, {"id": "ch21-q11", "chapterId": 21, "chapter": "General Properties of Viruses", "number": 11, "text": "Which of the following statements is false regarding symmetry of viruses ?", "options": [{"id": "A", "text": "Viral symmetry is studied by heavy metals stains."}, {"id": "B", "text": "The most efficient closed shell sub-unit arrangement is icosahedral."}, {"id": "C", "text": "Icosahedral symmetry involves 12 faces and 20 vertices ."}, {"id": "D", "text": "It is not possible for ‘empty’ helical particles to form"}], "correctIndex": 2, "correctLetter": "C", "solution": "Icosahedron has 20 faces (each an equilateral triangle) and 12 vertices.\nOption A: Study of viral symmetry by standard electron microscopy requires the use of heavy\nmetal stains (e.g., potassium phosphotungstate) to emphasize surface structure. It is a form of\nnegative staining.\nOption B: Symmetry observed with animal viruses is of the icosahedral pattern. It is the most\nefficient arrangement for subunits in a closed shell.\nOption D: A regular, periodic interaction between capsid protein and nucleic acid is required to\nmaintain a stable helical symmetry. Therefore, it is not possible for empty helical particles to\nform.\nGiven below is Icosahedron:", "questionPages": [339, 340], "solutionPages": [347, 348], "questionFigures": [], "solutionFigures": []}, {"id": "ch21-q12", "chapterId": 21, "chapter": "General Properties of Viruses", "number": 12, "text": "Which of the following viruses shows an enveloped icosahedral symmetry?", "options": [{"id": "A", "text": "Rubella virus"}, {"id": "B", "text": "Influenza virus"}, {"id": "C", "text": "Measles virus"}, {"id": "D", "text": "Poxvirus"}], "correctIndex": 0, "correctLetter": "A", "solution": "Enveloped icosahedral symmetry is seen in the rubella virus.", "questionPages": [340], "solutionPages": [348], "questionFigures": [], "solutionFigures": []}, {"id": "ch21-q13", "chapterId": 21, "chapter": "General Properties of Viruses", "number": 13, "text": "An immunologist is working on growing the influenza virus for vaccine production at the\nNational Institute of Virology, Pune. Which of the following sites is used for the given\npurpose in a fertilized egg?", "options": [{"id": "A", "text": "4"}, {"id": "B", "text": "1"}, {"id": "C", "text": "2"}, {"id": "D", "text": "3"}], "correctIndex": 1, "correctLetter": "B", "solution": "Allantoic cavity inoculation (1) is used for the growth and replication of the influenza virus for\nvaccine production.\nEmbryonated eggs are used for the cultivation of viruses.\n\n\n\nNote: Both allantoic and amniotic cavity inoculation are reeommended for initial isolation of the\ninfluenza virus. However, it is simpler to inoculate the virus into the allantoic cavity, as compared\nto the amniotic cavity, thus allantoic inoculation is the best answer.", "questionPages": [340], "solutionPages": [348, 349], "questionFigures": ["crop-question-ch21-q13-1"], "solutionFigures": ["crop-solution-ch21-q13-1"]}, {"id": "ch21-q14", "chapterId": 21, "chapter": "General Properties of Viruses", "number": 14, "text": "Quantitative infectivity assay of viruses is done by .", "options": [{"id": "A", "text": "Egg inoculation"}, {"id": "B", "text": "Hemadsorption"}, {"id": "C", "text": "Plaque assay"}, {"id": "D", "text": "Electron microscopy"}], "correctIndex": 2, "correctLetter": "C", "solution": "Quantitative infectivity assay of viruses is done by plaque assay.\nAssay of infectivity of viruses\nThe image below shows a plaque assay.\nThe image below shows pock assay.", "questionPages": [340, 341], "solutionPages": [349, 350], "questionFigures": [], "solutionFigures": ["crop-solution-ch21-q14-1", "crop-solution-ch21-q14-2"]}, {"id": "ch21-q15", "chapterId": 21, "chapter": "General Properties of Viruses", "number": 15, "text": "Which virus causes the cytopathic effect of syncytium formation?", "options": [{"id": "A", "text": "SV 40"}, {"id": "B", "text": "Enteroviruses"}, {"id": "C", "text": "Measles virus"}, {"id": "D", "text": "Adeno virus"}], "correctIndex": 2, "correctLetter": "C", "solution": "The cytopathic effect of syncytium formation is caused by the measles virus.", "questionPages": [341, 342], "solutionPages": [350], "questionFigures": [], "solutionFigures": []}, {"id": "ch22-q1", "chapterId": 22, "chapter": "DNA Viruses", "number": 1, "text": "A 23-year-old lady presents with the lesions shown below. What is the causative organism?", "options": [{"id": "A", "text": "Herpes simplex virus type 1"}, {"id": "B", "text": "Epstein-Barr virus"}, {"id": "C", "text": "Cytomegalovirus"}, {"id": "D", "text": "Herpes simplex virus type 2"}], "correctIndex": 0, "correctLetter": "A", "solution": "The lesions shown are cold sores, also known as herpes labialis caused by Herpes simplex virus\ntype 1 (HSV-1). Herpes labialis primarily affects the lip and typically present as thin-walled,\numbilicated vesicles, the roof of which breaks down with superficial ulcers. They generally heal\nwithout scarring.\nHSV-1 can be isolated from lesions in and around the mouth and is transmitted by direct contact\nor droplet spread from cases or carriers. HSV-2 is responsible for the majority of genital herpes\ninfections and is commonly transmitted venereally.\nThe images below show lesions of herpes labialis.", "questionPages": [351], "solutionPages": [361], "questionFigures": ["crop-question-ch22-q1-1"], "solutionFigures": ["crop-solution-ch22-q1-1"]}, {"id": "ch22-q2", "chapterId": 22, "chapter": "DNA Viruses", "number": 2, "text": "Cowdry Type A inclusions are seen in:", "options": [{"id": "A", "text": "Herpes simplex"}, {"id": "B", "text": "Rabies"}, {"id": "C", "text": "Molluscum contagiosum"}, {"id": "D", "text": "Adenovirus"}], "correctIndex": 0, "correctLetter": "A", "solution": "Cowdry type A inclusions are seen in the vesicles of Herpes Simplex infection\nThe classic Cowdry type A inclusion appears as a light purple, homogeneous intranuclear\nstructure surrounded by a clear halo. The inclusions stain with antibodies to HSV, permitting a\nrapid, specific diagnosis of HSV infection.", "questionPages": [351], "solutionPages": [361, 362], "questionFigures": [], "solutionFigures": ["crop-solution-ch22-q2-1"]}, {"id": "ch22-q3", "chapterId": 22, "chapter": "DNA Viruses", "number": 3, "text": "A 13-year-old girl has had 4 episodes of meningitis over the last 4 years, with the disease\nlasting a few days at a time, leaving slowly resolving neurological symptoms such as visual\nand memory loss. A CSF cytology shows lymphocytic pleocytosis and a diagnosis of Mollaret’s\nmeningitis is made. Which organism is implicated here?", "options": [{"id": "A", "text": "Measles virus"}, {"id": "B", "text": "Mumps virus"}, {"id": "C", "text": "Herpes simplex virus"}, {"id": "D", "text": "Rubella virus"}], "correctIndex": 2, "correctLetter": "C", "solution": "Mollaret’s meningitis or benign recurrent lymphocytic meningitis is most commonly caused by\nthe herpes simplex virus (HSV). Demonstration of HSV antibodies in CSF or persistence of HSV\nDNA in CSF can establish the diagnosis.", "questionPages": [351, 352], "solutionPages": [362], "questionFigures": [], "solutionFigures": []}, {"id": "ch22-q4", "chapterId": 22, "chapter": "DNA Viruses", "number": 4, "text": "A dentist presents to the surgery OPD with the findings shown below. He is febrile.\nMicroscopic examination of the tissue reveals Tzanck cells. What is the causative agent?", "options": [{"id": "A", "text": "Pox virus"}, {"id": "B", "text": "Adenovirus"}, {"id": "C", "text": "Picornavirus"}, {"id": "D", "text": "Herpes simplex virus"}], "correctIndex": 3, "correctLetter": "D", "solution": "The image suggests herpetic whitlow, confirmed by the presence of Tzanck cells on microscopy. It\nis caused by HSV-1.\nIt is often contracted by health care workers that come in contact with the virus when exposed to\noral secretions.\nOn Tzanck smear, which is a rapid, diagnostic method, Tzanck cells are seen. These are\nmultinucleated giant cells with faceted nuclei and homogenously stained ground-glass\nchromatin. Tzanck smear is also used in the diagnosis of Hailey-Hailey disease, Darier’s disease,\nhand-foot-and-mouth disease, etc.\n\n\n\nDiagnosis of herpes simplex virus:\n* Most sensitive test- HSV DNA- PCR (can differentiate between HSV 1 and 2)\n* Most definitive test- virus isolation using human diploid fibroblast in which cytopathic changes\ncan be observed as early as 24 - 48 hours.\n* Microscopy - Tzanck smear is prepared by Wright or Giemsa stain. Intranuclear type A inclusion\nbodies may be seen in Giemsa-stained smears.", "questionPages": [352], "solutionPages": [362, 363], "questionFigures": ["crop-question-ch22-q4-1"], "solutionFigures": ["crop-solution-ch22-q4-1"]}, {"id": "ch22-q5", "chapterId": 22, "chapter": "DNA Viruses", "number": 5, "text": "A young male presents to the STD clinic with painful lesions as shown in the image. What is\nthe most likely microscopic finding of the lesion?", "options": [{"id": "A", "text": "Tzank cells"}, {"id": "B", "text": "Pund cells"}, {"id": "C", "text": "Henderson-Patterson bodies"}, {"id": "D", "text": "Guarnieri bodies"}], "correctIndex": 0, "correctLetter": "A", "solution": "Clusters of vesicles are seen on an erythematous base along with painful and pruritic\nlymphadenopathy suggest a diagnosis of genital herpes. Tzanck cells or multinucleated giant cells\nare present on microscopy.\nThe Tzanck smear is a rapid, sensitive, and inexpensive diagnostic method. Smears are prepared\nfrom the lesions, from the base of vesicles, and stained with a 1% aqueous solution of O-toluidine\nblue for 15 seconds. Multinucleated giant cells with faceted nuclei and homogeneously\nstained ground glass chromatin - Tzanck cells are seen.\nThe typical herpes lesions are thin-walled, umbilicated vesicles, the roof of which breaks down,\nleaving tiny superficial ulcers. They heal without scarring. The most common site of cutaneous\nlesions in the face - on the cheeks, chin, around the mouth, or on the forehead.", "questionPages": [352, 353], "solutionPages": [363, 364], "questionFigures": ["crop-question-ch22-q5-1"], "solutionFigures": ["crop-solution-ch22-q5-1"]}, {"id": "ch22-q6", "chapterId": 22, "chapter": "DNA Viruses", "number": 6, "text": "Your neighbor's child complains of fever and develops a rash. On examination, the rashes are\npresent all over the body, and look like ‘dewdrops lying on the skin’. The child says that his\nfriend in school had similar complaints a few days ago. Which of the given statements is true\nabout this rash?", "options": [{"id": "A", "text": "It is centripetal in distribution"}, {"id": "B", "text": "The rash usually starts on the distal parts of limbs"}, {"id": "C", "text": "All the lesions are of same age"}, {"id": "D", "text": "Scabs are also infectious in chicken pox"}], "correctIndex": 0, "correctLetter": "A", "solution": "The condition described here is chickenpox. It is caused by the varicella-zoster virus. The\nfollowing are the characteristics of rash seen in chicken pox :\n+ The rash is centripetal in distribution.\n+ It evolves rapidly, progressing through macule, papule, vesicle, pustule, and finally scab.\n+ It is a pleomorphic rash and appears in crops, hence varying stages of lesions can be noticed at a\ngiven time.\n* The lesions resemble a dewdrop lying on the skin, as they are superficial and do not involve the\ndeeper layers of the skin.", "questionPages": [353], "solutionPages": [364, 365], "questionFigures": [], "solutionFigures": ["crop-solution-ch22-q6-1"]}, {"id": "ch22-q7", "chapterId": 22, "chapter": "DNA Viruses", "number": 7, "text": "While on rounds in the NICU, you notice a newborn baby with a zig-zag dermatomal cicatrix\non the forehead and left side of the face. The limbs are small and atrophied. Microcephaly is\nnoted. Which maternal infection are these findings characteristically associated with?", "options": [{"id": "A", "text": "Toxoplasma"}, {"id": "B", "text": "Cytomegalovirus"}, {"id": "C", "text": "Varicella zoster virus"}, {"id": "D", "text": "Herpes simplex virus type - 1"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given clinical scenario is suggestive of congenital varicella syndrome. Hence, an antenatal\nhistory of varicella zoster virus (VZV) infection would be significant in the mother of this baby.\nFetal varicella infection occurs if the mother gets infected during the first half of pregnancy.\nClinical features include:\n+ Cicatrix, a zigzag scarring in a dermatomal distribution\n* Microphthalmia\n* Cataracts\n* Optic atrophy\n+ Chorioretinitis\n* Microcephaly\n+ Limb hypoplasia\n* Motor and sensory deficits", "questionPages": [353, 354], "solutionPages": [365], "questionFigures": [], "solutionFigures": []}, {"id": "ch22-q8", "chapterId": 22, "chapter": "DNA Viruses", "number": 8, "text": "Which of the following is the predominant pathogen to infect renal transplant recipients one\nto four months following transplantation?", "options": [{"id": "A", "text": "Cytomegalovirus"}, {"id": "B", "text": "JC virus"}, {"id": "C", "text": "BK virus"}, {"id": "D", "text": "Epstein-Barr virus"}], "correctIndex": 0, "correctLetter": "A", "solution": "The predominant pathogen to infect renal transplant recipients in the period around 1 to 4\nmonths following the transplantation is cytomegalovirus (CMV).\nThe most common CMV presentation in kidney transplant patients are fever (common),\nleukopenia, hepatosplenomegaly, myalgia, and arthralgia.\nJC virus and BK virus are common infections after solid organ transplantation based on the site of\ninfection. This means BK and JC viruses are the most common organisms to infect the kidney\nafter any solid organ transplant. But CMV is the predominant organism to cause infection in a\nperson who has undergone a renal transplant. (Not the most common organism to affect the\nkidney after any solid organ transplant).\nBecause of the frequency and severity of CMV disease, antiviral prophylaxis with ganciclovir or\nvalganciclovir is being used in renal transplant recipients whenever indicated to prevent CMV\ndisease.", "questionPages": [354], "solutionPages": [365], "questionFigures": [], "solutionFigures": []}, {"id": "ch22-q9", "chapterId": 22, "chapter": "DNA Viruses", "number": 9, "text": "An infant is brought by his worried parents with a rash and yellowish discoloration of the\nskin. On examination, the baby has petechiae, jaundice, hepatosplenomegaly, and\nmicrocephaly. The developmental assessment shows global developmental delay. An axial cut\nof the non-contrast CT of the brain is given below. What is the causative organism?", "options": [{"id": "A", "text": "Rubella"}, {"id": "B", "text": "Herpes simplex virus"}, {"id": "C", "text": "Cytomegalovirus"}, {"id": "D", "text": "Varicella"}], "correctIndex": 2, "correctLetter": "C", "solution": "The clinical features and imaging suggest a diagnosis of congenital CMV infection. The\nnon-contrast CT head shows periventricular calcifications and ventriculomegaly.\nFeatures of congenital CMV infection:\n+ Petechial rash\n+ Jaundice\n\n\n\n* Hepatosplenomegaly\n* Microcephaly\n+ Deafness\n+ Chorioretinitis\n«IUGR\n+ Periventricular calcification and ventriculomegaly\nOption A: Congenital rubella syndrome is a triad of cardiac defects, cataracts, and\ncongenital hearing loss.\nOption B: Neonatal herpes presents as skin lesions with eye involvement, encephalitis, and\ndisseminated disease.\nOption D: Fetal varicella syndrome is manifested as cicatrizing/scarring skin lesions,\nchorioretinitis, hypoplastic limbs, low birth weight, and CNS defects due to cerebral atrophy.\nNote: In 15-20% of infants with congenital CMV infection, microcephaly is not detected at birth. It\nmay develop as the child grows and is detected at follow-up visits for other complaints.", "questionPages": [354, 355], "solutionPages": [365, 366], "questionFigures": ["crop-question-ch22-q9-1"], "solutionFigures": ["crop-solution-ch22-q9-1"]}, {"id": "ch22-q10", "chapterId": 22, "chapter": "DNA Viruses", "number": 10, "text": "Choose the correct statement regarding CMV.", "options": [{"id": "A", "text": "Ganciclovir resistance is due to mutation in UL97 phosphotransferase gene"}, {"id": "B", "text": "CMV can be cultured in vitro in any mammalian cell"}, {"id": "C", "text": "Commonest manifestation of CMV associated disease is watery diarrhea"}, {"id": "D", "text": "UL54 mutated CMV strains do not show cross resistance to Foscarnet"}], "correctIndex": 0, "correctLetter": "A", "solution": "Resistance to ganciclovir most commonly occurs due to mutations in the UL97\nphosphotransferase gene.\nOption B: Human CMV replicates in vitro only in human fibroblasts, although the virus is often\nisolated from epithelial cells of the host.\nOption C: CMV infection is mostly subclinical.\nOption D: UL54 mutations can confer resistance to ganciclovir, cidofovir, and foscarnet.", "questionPages": [355], "solutionPages": [366, 367], "questionFigures": [], "solutionFigures": []}, {"id": "ch22-q11", "chapterId": 22, "chapter": "DNA Viruses", "number": 11, "text": "Where are owl's eye inclusion bodies seen?", "options": [{"id": "A", "text": "Yellow fever"}, {"id": "B", "text": "Cytomegalovirus"}, {"id": "C", "text": "Adenovirus"}, {"id": "D", "text": "Herpes simplex virus"}], "correctIndex": 1, "correctLetter": "B", "solution": "Owl’s eye inclusion bodies are intranuclear basophilic inclusion bodies seen in CMV infection.", "questionPages": [355], "solutionPages": [367], "questionFigures": [], "solutionFigures": ["crop-solution-ch22-q11-1"]}, {"id": "ch22-q12", "chapterId": 22, "chapter": "DNA Viruses", "number": 12, "text": "What does the Paul-Bunnell test diagnose?", "options": [{"id": "A", "text": "Kissing disease"}, {"id": "B", "text": "Hand-foot-and-mouth disease"}, {"id": "C", "text": "Barlow's disease"}, {"id": "D", "text": "Fifth disease"}], "correctIndex": 0, "correctLetter": "A", "solution": "Paul-Bunnell test is used to diagnose kissing disease (infectious mononucleosis) caused by\nEpstein-Barr virus (EBV).\nIt is a heterophile agglutination test used to identify the heterophile antibodies that agglutinate\nsheep erythrocytes. Patients suffering from infectious mononucleosis due to Epstein-Barr virus\n(EBV) will produce antibodies that will react and agglutinate sheep erythrocytes.", "questionPages": [355], "solutionPages": [367], "questionFigures": [], "solutionFigures": []}, {"id": "ch22-q13", "chapterId": 22, "chapter": "DNA Viruses", "number": 13, "text": "You are studying the association of human herpesvirus-4 with other diseases. Which of the\nfollowing patients have diseases associated with this virus?", "options": [{"id": "A", "text": "1 and 5 only"}, {"id": "B", "text": "2,3 and 4"}, {"id": "C", "text": "3 and 4 only"}, {"id": "D", "text": "1,2and5"}], "correctIndex": 3, "correctLetter": "D", "solution": "Human herpesvirus-4 or Epstein-Barr virus causes infectious mononucleosis, Burkitt’s l:mphoma,\nand is associated with oral hairy leukoplakia in HIV patients.\nEBV may cause the following malignancies:\n+ Burkitt's l:mphoma\n* Nasopharyngeal carcinoma (in people of Chinese origin),\n+ Lymphomas in immunodeficient persons such as AIDS or transplant recipients.\nEndemic or African Burkitt's l:mphoma has got nearly 100% association with EBV, as compared\nto non-endemic and HIV-associated Burkitt's lymphoma.\nOral hairy leukoplakia is triggered by EBV in patients with poor immune status, most commonly\nwith HIV.\nOral submucous fibrosis is associated with the human papillomavirus (HPV).\n\n\n\nAdult T cell leukemia is associated with the human T-cell leukemia virus.", "questionPages": [355, 356], "solutionPages": [367, 368], "questionFigures": [], "solutionFigures": []}, {"id": "ch22-q14", "chapterId": 22, "chapter": "DNA Viruses", "number": 14, "text": "Which of the following viruses is known to cause hemorrhagic cystitis, diarrhea, and\nconjunctivitis?", "options": [{"id": "A", "text": "RSV"}, {"id": "B", "text": "Adenovirus"}, {"id": "C", "text": "Rhinovirus"}, {"id": "D", "text": "Rotavirus"}], "correctIndex": 1, "correctLetter": "B", "solution": "Adenovirus is known to cause hemorrhagic cystitis, diarrhea, and conjunctivitis.\nAcute hemorrhagic cystitis in children is caused by adenoviruses types 11 and 21.\nThe following table shows various syndromes caused by adenoviruses and associated serotypes:", "questionPages": [356], "solutionPages": [368], "questionFigures": [], "solutionFigures": ["crop-solution-ch22-q14-1"]}, {"id": "ch22-q15", "chapterId": 22, "chapter": "DNA Viruses", "number": 15, "text": "Viral infection mimicking erythroblastosis fetalis is:", "options": [{"id": "A", "text": "HSV"}, {"id": "B", "text": "Epstein-Barr virus"}, {"id": "C", "text": "Picornavirus"}, {"id": "D", "text": "Parvovirus B19"}], "correctIndex": 3, "correctLetter": "D", "solution": "Parvovirus B19 infection mimics erythroblastosis fetalis.\nParvovirus B19 is associated with:\n+ Erythema infectiosum (fifth disease)\n+ Transient aplastic crisis\n* Pure red cell aplasia\n+ Erythroblastosis fetalis (most commonly in early pregnancy)\nPicornavirus, Epstein-Barr virus, HSV infection do not mimic erythroblastosis fetalis.", "questionPages": [356], "solutionPages": [368], "questionFigures": [], "solutionFigures": []}, {"id": "ch22-q16", "chapterId": 22, "chapter": "DNA Viruses", "number": 16, "text": "Which organism causes the disease shown below?", "options": [{"id": "A", "text": "Roseola virus"}, {"id": "B", "text": "Parvovirus B19"}, {"id": "C", "text": "Rubella virus"}, {"id": "D", "text": "Rubeola virus"}], "correctIndex": 1, "correctLetter": "B", "solution": "The image showed a rash on the cheeks and face, with a slapped cheek appearance, characteristic\nof erythema infectiosum/ fifth disease. It is caused by Parvovirus B19.\n\n\n\nParvovirus B19 usually presents as a respiratory infection, with an erythematous maculopapular\nrash and arthralgia. The rash starts as prominent erythema of the cheek, popularly known as\nslapped-cheek appearance. The rash further spreads to the trunk and limbs followed by\nlymphadenopathy and arthralgia.\nIt induces aplastic crisis in sickle cell anemia patients.\nInfection during pregnancy leads to non-immune fetal hydrops (highest risk in the first half of\ngestational period).", "questionPages": [356, 357], "solutionPages": [368, 369], "questionFigures": ["crop-question-ch22-q16-1"], "solutionFigures": []}, {"id": "ch22-q17", "chapterId": 22, "chapter": "DNA Viruses", "number": 17, "text": "An 8-year-old child presents with skin lesions, suspected to be molluscum contagiosum. How\nis the diagnosis of this condition typically made?", "options": [{"id": "A", "text": "Viral Culture"}, {"id": "B", "text": "Skin biopsy"}, {"id": "C", "text": "PCR for Viral DNA"}, {"id": "D", "text": "Clinical appearance"}], "correctIndex": 3, "correctLetter": "D", "solution": "Diagnosis of molluscum contagiosum is based on clinical appearance.\nMolluscum contagiosum manifests as pink pearly wart-like lesions with a characteristic dimple at\nthe center (umbilicated), not associated with inflammation and necrosis.\nOption B: Skin biopsy or smear of expressed material shows characteristic inclusion bodies but is\nnecessary only when the diagnosis is uncertain.\nOptions A and C: Viral culture and PCR for viral DNA are not used for diagnosis.", "questionPages": [357], "solutionPages": [369], "questionFigures": [], "solutionFigures": ["crop-solution-ch22-q17-1"]}, {"id": "ch22-q18", "chapterId": 22, "chapter": "DNA Viruses", "number": 18, "text": "What is the causative organism of the condition shown below?", "options": [{"id": "A", "text": "Treponema pallidum"}, {"id": "B", "text": "Human papillomavirus 6 and 11"}, {"id": "C", "text": "Human papillomavirus 16 and 18"}, {"id": "D", "text": "Hemophilus ducreyi"}], "correctIndex": 1, "correctLetter": "B", "solution": "The image shows condyloma acuminata. It is most commonly caused by Human papillomavirus\n(HPV) 6 and 11.\nCondyloma acuminata is a benign, genital wart which is a moist, soft, pedunculated wart found on\nthe external genitalia.\nMicroscopically, the characteristic features include:\n\n\n\n+ A branching villous structure with connective tissue stroma\n+ Epidermis showing hyperkeratosis and acanthosis (thickening)\n* Cytoplasmic vacuolization of the squamous cells (koilocytosis) is characteristic of HPV infection.\n* No evident dysplasia\nOption A: Treponema pallidum can cause condylomata lata in secondary syphilis. It is smoother\nand flatter and may be associated with induration and ulceration. (image below)\nOption C: Human papillomavirus 16 and 18 are associated with carcinoma of the cervix and\nanogenital region.\nOption D: Hemophilus ducreyi causes chancroid. Given below is the image of chancroid.", "questionPages": [357], "solutionPages": [369, 370, 371], "questionFigures": ["crop-question-ch22-q18-1"], "solutionFigures": ["crop-solution-ch22-q18-1", "crop-solution-ch22-q18-2"]}, {"id": "ch22-q19", "chapterId": 22, "chapter": "DNA Viruses", "number": 19, "text": "A patient presents with plantar warts as shown below. Which type of human papillomavirus\nis responsible for causing these?", "options": [{"id": "A", "text": "6"}, {"id": "B", "text": "11"}, {"id": "C", "text": "1"}, {"id": "D", "text": "7"}], "correctIndex": 2, "correctLetter": "C", "solution": "HPV types 1a, 57, and 27 accounts for most plantar warts.\nHPV 7 causes hand warts in butchers (butcher's warts).\nHPV 6 and 11 cause condyloma acuminata, sinonasal papilloma, and squamous papilloma of the\nlarynx.", "questionPages": [357, 358], "solutionPages": [371], "questionFigures": ["crop-question-ch22-q19-1"], "solutionFigures": []}, {"id": "ch22-q20", "chapterId": 22, "chapter": "DNA Viruses", "number": 20, "text": "As a CHC medical officer, you organize an outreach program for HPV vaccination and the\nprevention of cervical cancer. Which protein is used for antigenic response in this vaccine?", "options": [{"id": "A", "text": "E6, E7"}, {"id": "B", "text": "Li"}, {"id": "C", "text": "E1, E2"}, {"id": "D", "text": "Le"}], "correctIndex": 1, "correctLetter": "B", "solution": "The HPV vaccines use virus-like particles (VLPs) that consist of the HPV L1 major capsid protein.\nThe L1 protein self-assembles into VLPs when expressed in eukaryotic cells.\nThese VLPs contain the same epitopes as the HPV virion. But they do not contain genetic material\nand cannot transmit infection. The immunogenicity of the HPV vaccines relies on the\ndevelopment of conformational neutralizing antibodies to epitopes displayed on viral capsids.\nThe nonavalent HPV vaccine works against strains 6, 11, 16, 18, 31, 33, 45, 52 and 58. It is usually\ncommercialized in the name of Gardasil-9. It has received expanded indication which now\nincludes the prevention of oropharyngeal and other head and neck cancers.", "questionPages": [358], "solutionPages": [371, 372], "questionFigures": [], "solutionFigures": ["crop-solution-ch22-q20-1"]}, {"id": "ch22-q21", "chapterId": 22, "chapter": "DNA Viruses", "number": 21, "text": "Nonavalent HPV vaccine works against which of the following strains of the virus?", "options": [{"id": "A", "text": "1, 6, 11, 16, 18, 31, 45, 52, 58"}, {"id": "B", "text": "6, 11, 16, 18, 31, 33, 45, 52, 58"}, {"id": "C", "text": "1, 16, 18, 21, 33, 45, 48, 52, 58"}, {"id": "D", "text": "6, 11, 16, 18, 33, 45, 48, 52, 58"}], "correctIndex": 1, "correctLetter": "B", "solution": "The nonavalent HPV vaccine works against strains 6, 11, 16, 18, 31, 33, 45, 52 and 58. It is usually\ncommercialized in the name of Gardasil-9. It has received expanded indication which now\nincludes the prevention of oropharyngeal and other head and neck cancers.", "questionPages": [358, 359], "solutionPages": [372], "questionFigures": [], "solutionFigures": ["crop-solution-ch22-q21-1"]}, {"id": "ch22-q22", "chapterId": 22, "chapter": "DNA Viruses", "number": 22, "text": "An HIV-positive patient presents with the following skin lesions. Which of the following\ndiseases is associated with the virus implicated here?", "options": [{"id": "A", "text": "Post-transplant lymphoproliferative disease"}, {"id": "B", "text": "Merkel cell carcinoma"}, {"id": "C", "text": "Adult T-cell leukemia"}, {"id": "D", "text": "Primary effusion lymphoma"}], "correctIndex": 3, "correctLetter": "D", "solution": "The above image showing red-purple macules and plaques in an HIV-positive patient is suggestive\nof Kaposi sarcoma, caused by human herpesvirus 8. It also causes primary effusion lymphoma. It\nis one of seven currently known human cancer viruses or oncoviruses.\nHHV-8 or Kaposi’s sarcoma-associated herpesvirus (KSHV) is known to cause Kaposi’s sarcoma,\nin immunocompromised persons. Cancer patients receiving chemotherapy, AIDS patients, and\norgan transplant recipients are all at a high risk of showing signs of infection.\nKSHV is a known causative agent of four diseases:\n* Kaposi's sarcoma\n+ KSHV-associated multicentric Castleman's disease (MCD)\n+ Primary effusion lymphoma\n* KSHV inflammatory cytokine syndrome", "questionPages": [359], "solutionPages": [372], "questionFigures": ["crop-question-ch22-q22-1"], "solutionFigures": []}, {"id": "ch22-q23", "chapterId": 22, "chapter": "DNA Viruses", "number": 23, "text": "Which of the following viruses is implicated in progressive multifocal leukoencephalopathy?", "options": [{"id": "A", "text": "JC virus"}, {"id": "B", "text": "BK virus"}, {"id": "C", "text": "Measles virus"}, {"id": "D", "text": "Herpes simplex virus"}], "correctIndex": 0, "correctLetter": "A", "solution": "Progressive multifocal leukoencephalopathy is caused by the JC\nvirus. JC virus-induced progressive multifocal leukoencephalopathy is one of the neurologic\ndiseases associated with HIV infection.\nOption B: BK virus is associated with nephropathy in transplant recipients.\nOption C: The long-term sequelae associated with measles infection is subacute sclerosing\npanencephalitis.\nOption D: Herpes simplex virus causes temporal lobe encephalitis.", "questionPages": [359, 360], "solutionPages": [372], "questionFigures": [], "solutionFigures": []}, {"id": "ch23-q1", "chapterId": 23, "chapter": "Hepatitis", "number": 1, "text": "Which of the following is a non-enveloped virus that causes hepatitis?", "options": [{"id": "A", "text": "Hepatitis C"}, {"id": "B", "text": "Hepatitis B"}, {"id": "C", "text": "Hepatitis A"}, {"id": "D", "text": "Hepatitis D"}], "correctIndex": 2, "correctLetter": "C", "solution": "Hepatitis A and E are non-enveloped viruses, while Hepatitis B, C, and D are enveloped viruses.", "questionPages": [373], "solutionPages": [], "questionFigures": [], "solutionFigures": []}, {"id": "ch23-q2", "chapterId": 23, "chapter": "Hepatitis", "number": 2, "text": "A 25-year-old man hailing from Mumbai presents to you with complaints of abdominal pain\nand malaise. On examination, he is icteric and the liver is palpable 6 cm below the costal\nmargin. On further questioning, he informs you that a few weeks back the drains surrounding\nhis house were overflowing due to the monsoon flooding. Which of the following is the most\nlikely etiology?", "options": [{"id": "A", "text": "Hepatitis A or D"}, {"id": "B", "text": "Hepatitis B or E"}, {"id": "C", "text": "Hepatitis A or B"}, {"id": "D", "text": "Hepatitis A or E"}], "correctIndex": 3, "correctLetter": "D", "solution": "The given case scenario with icterus, hepatomegaly, and environmental history is suggestive of\nacute viral hepatitis, likely to be caused by hepatitis A or E viruses.\nHepatitis A and E are transmitted by feco-oral route. Overcrowding, poor hygiene, and fecal\ncontamination of water supplies such as after monsoon flooding can lead to spreading of the\ndisease.\nHepatitis B, C, and D are transmitted by parenteral routes, e.g. blood transfusions.", "questionPages": [373], "solutionPages": [], "questionFigures": [], "solutionFigures": []}, {"id": "ch23-q3", "chapterId": 23, "chapter": "Hepatitis", "number": 3, "text": "A 18-year-old man presents with fever, diarrhea, and jaundice. He gives a history of\nconsuming food at a roadside stall. Which of the following statements is incorrect about the\netiological agent?", "options": [{"id": "A", "text": "It belongs to family Hepatoviridae"}, {"id": "B", "text": "Majority of infections are symptomatic"}, {"id": "C", "text": "It is transmitted by feco-oral route"}, {"id": "D", "text": "A formalin inactivated vaccine is used for prevention"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given clinical scenario is suggestive of viral hepatitis which is most likely to be Hepatitis A.\nHepatitis A virus belongs to the family Picornaviridae. It is transmitted by feco-oral route and\nmost of the infections are symptomatic.\n\n\n\nThere is no definitive treatment, thus, only supportive therapy is given.", "questionPages": [373], "solutionPages": [381], "questionFigures": [], "solutionFigures": []}, {"id": "ch23-q4", "chapterId": 23, "chapter": "Hepatitis", "number": 4, "text": "What is the average incubation period for Hepatitis A virus?", "options": [{"id": "A", "text": "<1 week"}, {"id": "B", "text": "30 days"}, {"id": "C", "text": "90 days"}, {"id": "D", "text": "120 days"}], "correctIndex": 1, "correctLetter": "B", "solution": "The average incubation period of the Hepatitis A virus (HAV) is around 30 days. It ranges from\n15-50 days. The clinical disease has a prodromal stage and an icteric stage.", "questionPages": [373, 374], "solutionPages": [381], "questionFigures": [], "solutionFigures": []}, {"id": "ch23-q5", "chapterId": 23, "chapter": "Hepatitis", "number": 5, "text": "Which of the following is called as Australia antigen?", "options": [{"id": "A", "text": "HBsAg"}, {"id": "B", "text": "HBeAg"}, {"id": "C", "text": "HBcAg"}, {"id": "D", "text": "HBV-DNA"}], "correctIndex": 0, "correctLetter": "A", "solution": "HBsAg (Hepatitis B surface antigen) is also known as the Australia antigen. It is called so because\nit was first isolated from the serum of an Australian person.\nSera from hepatitis B patients when observed under an electron microscope show three types of\nparticles:\n* A spherical particle: 22nm, most abundant, contains only HBsAg.\n+ Filamentous or tubular particle: 22nm, contains only HBsAg.\n+ A double-walled spherical structure: 42nm diameter, is the complete Hepatitis B virus. It was\ndescribed by Dane and is called Dane particle.", "questionPages": [374], "solutionPages": [381], "questionFigures": [], "solutionFigures": ["crop-solution-ch23-q5-1"]}, {"id": "ch23-q6", "chapterId": 23, "chapter": "Hepatitis", "number": 6, "text": "Which of the following is also referred to as Dane particle?", "options": [{"id": "A", "text": "HAV"}, {"id": "B", "text": "HBV"}, {"id": "C", "text": "HCV"}, {"id": "D", "text": "HDV"}], "correctIndex": 1, "correctLetter": "B", "solution": "Dane particle refers to Hepatitis B.\nSera from hepatitis B patients when observed under an electron microscope show three types of\nparticles:\n+ Spherical particle: 22nm, most abundant, contains only HBsAg.\n\n\n\n+ Filamentous or tubular particle: 22nm, contains only HBsAg.\n+ A double-walled spherical structure: 42nm diameter, is the complete Hepatitis B virus. It was\ndescribed by Dane and is called Dane particle.", "questionPages": [374], "solutionPages": [381, 382], "questionFigures": [], "solutionFigures": ["crop-solution-ch23-q6-1"]}, {"id": "ch23-q7", "chapterId": 23, "chapter": "Hepatitis", "number": 7, "text": "A 35-year-old male patient with chronic hepatitis B has high levels of serum HBeAg. Which of\nthe following viral genes is involved in coding the same?", "options": [{"id": "A", "text": "C gene"}, {"id": "B", "text": "S gene"}, {"id": "C", "text": "P gene"}, {"id": "D", "text": "X gene"}], "correctIndex": 0, "correctLetter": "A", "solution": "HBeAg is coded by the C gene. The presence of high levels of HBeAg (and HBV DNA) suggests\nhigh infectivity.\nHBV Genome has four overlapping genes. They code for:\n+ S gene-It codes for surface antigen.\n* C gene-\n+ When the C region alone is translated: HBcAg is formed.\n+ When translation begins from Pre C region, HBeAg is formed.\n+ P gene- Codes for DNA polymerase.\n+ X gene- Codes for a non-particulate protein HBxAg.", "questionPages": [374], "solutionPages": [382, 383], "questionFigures": [], "solutionFigures": ["crop-solution-ch23-q7-1"]}, {"id": "ch23-q8", "chapterId": 23, "chapter": "Hepatitis", "number": 8, "text": "While drawing blood from a patient with hepatitis B, it splashes into the eyes of a nurse.\nWhich of the following markers will appear first in her blood if she gets infected?", "options": [{"id": "A", "text": "HBeAg"}, {"id": "B", "text": "HBsAg"}, {"id": "C", "text": "Anti HBs"}, {"id": "D", "text": "Anti HBe"}], "correctIndex": 1, "correctLetter": "B", "solution": "HBsAg is the first marker to appear in the blood after infection.\nIt can be detected even before the elevation of serum transaminases and onset of clinical\nillness. Usually, it disappears within 2 months of onset of clinical disease but may last for even 6\nmonths and beyond. If it persists beyond 6 months, it indicates chronic hepatitis.\nAnti-HBs is the protective antibody, which appears soon after HBsAg, disappears and remains in\nserum for a long time.", "questionPages": [374, 375], "solutionPages": [383], "questionFigures": [], "solutionFigures": []}, {"id": "ch23-q9", "chapterId": 23, "chapter": "Hepatitis", "number": 9, "text": "A patient with hepatitis B presents to OPD for follow-up. Which of the following serological\nmarkers will not be detected in his blood?", "options": [{"id": "A", "text": "HBsAg"}, {"id": "B", "text": "Anti-HBs"}, {"id": "C", "text": "HBcAg"}, {"id": "D", "text": "Anti-HBc"}], "correctIndex": 2, "correctLetter": "C", "solution": "Hepatitis B core antigen (HBcAg) is not present in blood because it is enclosed within the HBsAg\ncoat. However, antibodies against HBc (Anti-HBc) are the earliest antibody markers to be seen in\nthe blood after 1-2 weeks.\nNote:\n+ HBsAg: Earliest marker to be detected in the serum of Hepatitis B-infected persons.\n+ Anti HBc: Earliest antibody to be detected in the serum of Hepatitis B-infected persons.\nThe given image shows hepatitis B virus and its antigens\n\n\n\nBe antigen\no\nantigen\nPartially double-stranded DNA", "questionPages": [375], "solutionPages": [383, 384], "questionFigures": [], "solutionFigures": ["crop-solution-ch23-q9-1"]}, {"id": "ch23-q10", "chapterId": 23, "chapter": "Hepatitis", "number": 10, "text": "There are 3 to 5% healthy hepatitis B carriers in India who are asymptomatic. They are at the\nrisk of developing hepatocellular carcinoma in the future because", "options": [{"id": "A", "text": "They are unable to mount inflammation against the virus"}, {"id": "B", "text": "Virus can integrate with host DNA and form complementary DNA"}, {"id": "C", "text": "There is a risk of elevation of transaminases"}, {"id": "D", "text": "Liver parenchymal cells are in a state of high proliferation"}], "correctIndex": 1, "correctLetter": "B", "solution": "In most tumors, HBV DNA is integrated into the cell genome, and in most cases, the virus DNA\nhas undergone rearrangements, including deletions. After integration, it promotes the\noverexpression of cell genes that can also contribute to oncogenesis.\nThe only viral gene product that is consistently present in the tumor cells is the X protein.", "questionPages": [375], "solutionPages": [384], "questionFigures": [], "solutionFigures": []}, {"id": "ch23-q11", "chapterId": 23, "chapter": "Hepatitis", "number": 11, "text": "The given life cycle is suggestive of which of the following viruses?", "options": [{"id": "A", "text": "HIV"}, {"id": "B", "text": "Hepatitis B"}, {"id": "C", "text": "Influenza"}, {"id": "D", "text": "Herpes simplex"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given life cycle is of the hepatitis B virus.\nSteps:\n+ The infectious virion attaches to cells and uncoating occurs.\n* Cell enzymes in the hepatocytes convert dsDNA to covalently closed circular double-stranded\nDNA (cccDNA)\n* HBV mRNA and pre-genome RNA is synthesized using cecDNA as a template.\n* pre-genome RNA is encapsidated by packaging signal into new core particles.\n* These new core particles are templates for HBV reverse transcriptase.\n+ Negative-strand DNA is synthesized by viral polymerase by reverse transcription.\n+ The cores bud from the pre-Golgi membranes, acquiring HBsAg-containing envelopes.\n* Once viral particles are assembled, they either exit the cell or cause reinfection of the same cell.", "questionPages": [375, 376], "solutionPages": [384, 385], "questionFigures": ["crop-question-ch23-q11-1"], "solutionFigures": []}, {"id": "ch23-q12", "chapterId": 23, "chapter": "Hepatitis", "number": 12, "text": "A patient is diagnosed with Hepatitis B infection. Which of the following markers will always\nbe present in his serum, even during recurrences, or if he develops chronic hepatitis?", "options": [{"id": "A", "text": "HBc Ag"}, {"id": "B", "text": "Anti HBs Ab"}, {"id": "C", "text": "Anti HBc Ab"}, {"id": "D", "text": "HBe Ag"}], "correctIndex": 2, "correctLetter": "C", "solution": "A patient who has had exposure to HBV will have anti-HBc antibody even when he has moved\ninto the chronic or recurrent stages. IgM anti-HBc reappears during acute recurrences while\nIgG anti-HBc is found in chronic states.\nThe HBsAg antigen is present in chronic hepatitis B, while the antibody anti-HBs is not.", "questionPages": [376], "solutionPages": [385], "questionFigures": [], "solutionFigures": []}, {"id": "ch23-q13", "chapterId": 23, "chapter": "Hepatitis", "number": 13, "text": "Which of the following is not synthesized by pre-core mutants of hepatitis B virus?", "options": [{"id": "A", "text": "HBsAg"}, {"id": "B", "text": "HBxAg"}, {"id": "C", "text": "HBcAg"}, {"id": "D", "text": "HBeAg"}], "correctIndex": 3, "correctLetter": "D", "solution": "Pre-core mutants of hepatitis B virus are unable to synthesize HBeAg.\nIn the HBV genome, the C gene consists of 2 regions:\n+ Pre-C region- When translation begins from the Pre-C region, HBeAg is synthesized.\n* C-region- When it begins from the C-region, HBcAg is synthesized.\nIn the HBeAg sequence of pre-core mutants, there is a G to A switch at the 28th amino acid,\ncausing a stop codon. Hence, pre-core mutants are unable to synthesize HBeAg.\nThe image below shows the HBV genome :", "questionPages": [376, 377], "solutionPages": [385], "questionFigures": [], "solutionFigures": ["crop-solution-ch23-q13-1"]}, {"id": "ch23-q14", "chapterId": 23, "chapter": "Hepatitis", "number": 14, "text": "The serological profile of a patient is given below. What is your diagnosis?", "options": [{"id": "A", "text": "Acute HBV infection with high infectivity"}, {"id": "B", "text": "HBV vaccination"}, {"id": "C", "text": "Chronic HBV infection with high infectivity"}, {"id": "D", "text": "Acute HBV infection with low infectivity"}], "correctIndex": 0, "correctLetter": "A", "solution": "HBsAg and IgM Anti-HBc are positive, indicating an acute hepatitis B infection. HBeAg positive\nindicates that the patient is highly infectious.", "questionPages": [377], "solutionPages": [385], "questionFigures": [], "solutionFigures": []}, {"id": "ch23-q15", "chapterId": 23, "chapter": "Hepatitis", "number": 15, "text": "An HBsAg positive primigravida presents to you for routine antenatal care. She asks you\nabout the risk of transmission of HBV to her baby. Which of the following is not related to the\nsame?", "options": [{"id": "A", "text": "Intrauterine transmission"}, {"id": "B", "text": "Normal vaginal delivery"}, {"id": "C", "text": "Forceps vaginal delivery"}, {"id": "D", "text": "Breastfeeding"}], "correctIndex": 3, "correctLetter": "D", "solution": "Breastfeeding is not related to the vertical transmission of hepatitis B virus. Breastfeeding is not\ncontraindicated in HBsAg-positive mothers.\nMother-to-child transmission of HBV can occur via three modalities:\n+ Intrauterine transmission- Transplacental transmission is uncommon. Another route is via a\nbreach in the placental barrier exposing maternal blood to fetal blood e.g. - threatened preterm\nlabor.\n+ Transmission during delivery- It is the most frequent method of vertical transmission. It is\nmostly due to newborn contact with the mother’s infected secretions or blood at the time of\ndelivery (normal/instrumental).\n* Postpartum transmission- Though HBV DNA is present in breast milk, it is not transmitted to\nthe fetus. However, cracked nipples expose the infant to maternal blood, and can transmit the\nvirus to the infant.\nImmunoprophylaxis with HBIg is indicated for babies born to HBsAg-positive mothers followed\nby a three-dose hepatitis B recombinant vaccine.", "questionPages": [377], "solutionPages": [385, 386], "questionFigures": [], "solutionFigures": []}, {"id": "ch23-q16", "chapterId": 23, "chapter": "Hepatitis", "number": 16, "text": "An intern takes a hepatitis B vaccine booster dose before his ward postings begin. Which of\nthe following serological markers will indicate immunity against HBV in this case?", "options": [{"id": "A", "text": "HBsAg"}, {"id": "B", "text": "Anti-HBs"}, {"id": "C", "text": "Anti-HBc"}, {"id": "D", "text": "Anti-HBe"}], "correctIndex": 1, "correctLetter": "B", "solution": "Presence of anti-HBs with the absence of all other serological virus markers indicates immunity\nfollowing HBV vaccination.", "questionPages": [377], "solutionPages": [386], "questionFigures": [], "solutionFigures": []}, {"id": "ch23-q17", "chapterId": 23, "chapter": "Hepatitis", "number": 17, "text": "Which of the following statements is false regarding HBV vaccination?", "options": [{"id": "A", "text": "The current vaccine is prepared by cloning 'S gene’ of HBV in Baker's yeast"}, {"id": "B", "text": "A single dose of HBV vaccine is recommended for high-risk groups for pre-exposure prophylaxis"}, {"id": "C", "text": "For high-risk mothers who are seronegative, hepatitis B vaccine can be given during pregnancy."}, {"id": "D", "text": "Hepatitis B vaccine should be administered intramuscularly in the deltoid muscle."}], "correctIndex": 1, "correctLetter": "B", "solution": "Pre-exposure prophylaxis consists of administration of a 3-4 dose series of hepatitis B vaccine\ngiven over a 6-month period.\nThe pre-exposure prophylaxis of Hepatitis B vaccine schedule is as follows:\nThe vaccine is genetically engineered by cloning 'S gene’ in baker’s yeast. It has non-glycosylated\nHBsAg particles given along with an alum adjuvant.\nPregnancy is not a contraindication for hepatitis B vaccination. The efficacy has been shown to be\nsimilar to that for non-pregnant adults, with overall seroconversion rates approaching 95 percent\nafter three doses which can be taken during routine prenatal care.\nThe vaccine is given intramuscularly, in the deltoid muscle and can be co-administered with other\nvaccines.", "questionPages": [377, 378], "solutionPages": [386, 387], "questionFigures": [], "solutionFigures": ["crop-solution-ch23-q17-1", "crop-solution-ch23-q17-2"]}, {"id": "ch23-q18", "chapterId": 23, "chapter": "Hepatitis", "number": 18, "text": "A known case of hepatitis B going into hepatic failure is found to have a high viral load.\nWhich of the following serological markers will not contribute to the viral load?", "options": [{"id": "A", "text": "HBeAg"}, {"id": "B", "text": "HBV DNA"}, {"id": "C", "text": "HBV DNA polymerase"}, {"id": "D", "text": "Anti-HBs"}], "correctIndex": 3, "correctLetter": "D", "solution": "Anti-HBs will not contribute to the high viral load, as it is not a marker of active viral replication.\nHBeAg, HBV DNA, and HBV DNA polymerase are markers of active viral replication and will\ncontribute to the high viral load.\nHBeAg is a qualitative marker while HBV DNA is a quantitative marker of the replicative phase.", "questionPages": [378], "solutionPages": [387], "questionFigures": [], "solutionFigures": []}, {"id": "ch23-q19", "chapterId": 23, "chapter": "Hepatitis", "number": 19, "text": "A 30-year-old man with heroin addiction presents with fatigue, palpable purpura, joint pains,\nand abdominal pain. Urine analysis shows massive proteinuria. Which of the following\nviruses should be tested for in this patient?", "options": [{"id": "A", "text": "Hepatitis A"}, {"id": "B", "text": "Hepatitis C"}, {"id": "C", "text": "Hepatitis D"}, {"id": "D", "text": "Hepatitis E"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given clinical scenario is suggestive of mixed cryoglobulinemia, which is strongly associated\nwith hepatitis C. Hence, the patient should be tested for hepatitis C.", "questionPages": [378], "solutionPages": [387], "questionFigures": [], "solutionFigures": []}, {"id": "ch23-q20", "chapterId": 23, "chapter": "Hepatitis", "number": 20, "text": "Which hepatitis virus shows maximum chronicity in adults?", "options": [{"id": "A", "text": "Hepatitis A"}, {"id": "B", "text": "Hepatitis E"}, {"id": "C", "text": "Hepatitis C"}, {"id": "D", "text": "Hepatitis D"}], "correctIndex": 2, "correctLetter": "C", "solution": "Maximum chronicity is seen in HCV infection, followed by HBV infection.\n\n\n\n5-10% of adults infected with HBV develop chronic infection. The majority of neonates affected\nwith hepatitis B develop chronic hepatitis.\nHEV is associated with chronic infection only in immunocompromised individuals. HAV is not\nassociated with chronicity.\nNote: The most common cause of post-transfusion hepatitis in developed countries is hepatitis C", "questionPages": [378], "solutionPages": [387, 388], "questionFigures": [], "solutionFigures": ["crop-solution-ch23-q20-1"]}, {"id": "ch23-q21", "chapterId": 23, "chapter": "Hepatitis", "number": 21, "text": "A patient with fulminant hepatitis is found to have coinfection with hepatitis B and hepatitis\nD viruses. Which of the following structures of HBV aid in the survival of HDV?", "options": [{"id": "A", "text": "Reverse transcriptase"}, {"id": "B", "text": "Envelope protein"}, {"id": "C", "text": "Transcriptase to transcribe mRNA"}, {"id": "D", "text": "Replicase enzyme"}], "correctIndex": 1, "correctLetter": "B", "solution": "Hepatitis D virus (HDV) is an incomplete/defective virus. It requires HBV, to provide the envelope\nprotein (HbsAg) to aid in its survival. Hepatitis D is called the delta virus.\nTwo types of infection may occur:\n* Co-infection - acute HDV and HBV infections occur simultaneously\n+ Super-infection - Delta viral infection occurs in a person already harboring HBV. This most often\nleads to chronic hepatitis\nCoinfection and superinfection can cause fulminant hepatitis. HBV vaccination is protective\nagainst HDV.", "questionPages": [378, 379], "solutionPages": [388], "questionFigures": [], "solutionFigures": []}, {"id": "ch23-q22", "chapterId": 23, "chapter": "Hepatitis", "number": 22, "text": "In the year 1955, following sewage contamination of drinking water in New Delhi, an\noutbreak of jaundice ensued. Electron microscopy of fecal samples from the affected\npopulation revealed a virus resembling caliciviruses. Which of the following was the\netiological agent?", "options": [{"id": "A", "text": "Hepatitis C"}, {"id": "B", "text": "Hepatitis A"}, {"id": "C", "text": "Hepatitis B"}, {"id": "D", "text": "Hepatitis E"}], "correctIndex": 3, "correctLetter": "D", "solution": "Hepatitis E virus (HEV) resembles caliciviruses in morphology and physical characteristics.\nHepatitis E is a non-enveloped virus with ssRNA genome\nNote: The largest HEV epidemic occurred in New Delhi in 1955-1956.", "questionPages": [379], "solutionPages": [388], "questionFigures": [], "solutionFigures": []}, {"id": "ch23-q23", "chapterId": 23, "chapter": "Hepatitis", "number": 23, "text": "Which of the following is false about viral hepatitis?", "options": [{"id": "A", "text": "Anti LKM-3 antibody is associated with hepatitis B infection"}, {"id": "B", "text": "Anti-LKM1 antibodies are associated with hepatitis C infection"}, {"id": "C", "text": "IgM anti-HAV antibody appears during the late incubation period"}, {"id": "D", "text": "Enterically transmitted non-A, non-B hepatitis is caused by hepatitis E virus"}], "correctIndex": 0, "correctLetter": "A", "solution": "The anti-LKM-3 antibody is associated with hepatitis D infection, not hepatitis B.\nAnti-liver-kidney microsomal antibodies (anti-LKM) are many of several autoantibodies that are\ndetected in the serum of patients with different types of acute or chronic liver disease. These\nantibodies are targeted against antigens of the cytochrome P450 system.\nThey are also associated with chronic hepatitis C and autoimmune hepatitis.\nOption C: IgM anti-HAV antibody indicates current/recent infection. It appears during the late\nincubation period, peaks in 2-3 weeks, and disappears after 3-4 months. IgG denotes remote\ninfection or immunity. It appears around the same time, peaks at 3-4 months, and persists for a\nlong time.\nOption D: Hepatitis E infection was previously known as an epidemic or enterically transmitted\nnon-A, non-B hepatitis. It is transmitted by feco-oral route.", "questionPages": [379, 380], "solutionPages": [388, 389], "questionFigures": [], "solutionFigures": []}, {"id": "ch24-q1", "chapterId": 24, "chapter": "HIV", "number": 1, "text": "Which of the following subtypes of HIV is most common in India?", "options": [{"id": "A", "text": "Subtype A"}, {"id": "B", "text": "Subtype B"}, {"id": "C", "text": "Subtype C"}, {"id": "D", "text": "Subtype D"}], "correctIndex": 2, "correctLetter": "C", "solution": "Subtype C of HIV is the most common in India. It causes more than 95% of HIV infections.\nSubtypes A and C are more readily transmitted by heterosexual contact than subtype B, which is\nmainly transmitted by homosexual contact and injections.", "questionPages": [390], "solutionPages": [], "questionFigures": [], "solutionFigures": []}, {"id": "ch24-q2", "chapterId": 24, "chapter": "HIV", "number": 2, "text": "Which of the following statements is incorrect about HIV?", "options": [{"id": "A", "text": "Cross blood-brain barrier"}, {"id": "B", "text": "Has 2 single strands of RNA"}, {"id": "C", "text": "Inhibited by 0.3 % H202"}, {"id": "D", "text": "Is a thermostable virus"}], "correctIndex": 3, "correctLetter": "D", "solution": "HIV is a thermolabile virus. It is readily inactivated by heating to 60 °C for 10 minutes and at 100\n°C in seconds. At room temperature (20-25 °C) in the dried blood, it may survive for 1 week.\nOption A: HIV crosses the blood-brain barrier. It may cause encephalopathy leading to loss of\nhigher functions, progressing to dementia.\nOption B: HIV is a spherical, enveloped virus. Its genome is composed of two copies of identical\nsingle-stranded positive-sense RNA.\nOption C: HIV is inactivated by treatment with 0.3% hydrogen peroxide, 50% ethanol, 35%\nisopropanol or 10% household bleach. A 2% solution of glutaraldehyde is effective for the\ndisinfection of medical instruments.", "questionPages": [390], "solutionPages": [394], "questionFigures": [], "solutionFigures": []}, {"id": "ch24-q3", "chapterId": 24, "chapter": "HIV", "number": 3, "text": "Which of the following is a nonstructural gene of HIV?", "options": [{"id": "A", "text": "gag gene"}, {"id": "B", "text": "tat gene"}, {"id": "C", "text": "pol gene"}, {"id": "D", "text": "env gene"}], "correctIndex": 1, "correctLetter": "B", "solution": "The tat gene (trans-activating gene) is a non-structural gene.\nHIV has structural and non-structural genes:\n+ Structural genes- Genes coding for structural protiens:\n* gag- Codes for core and shell protein p55, which is cleaved to p15, p18 and p24\n* env- Codes for envelope glycoprotein gp160 which is cleaved to gp120 and gp41\n* pol- Codes for enzymes: Polymerase, reverse transcriptase, protease and endonuclease\n* Non-structural and regulatory genes:\n* tat- Trans-activating gene\n+ nef- Negative factor gene\n+ rev- Regulator of virus gene\n+ vif- Viral infectivity factor gene\n* vpu- (only in HIV-1) and vpx (only in HIV-2)\n+ vpr- Stimulates only the promoter region of the virus\n+ LTR- Long terminal repeat sequences", "questionPages": [390], "solutionPages": [394], "questionFigures": [], "solutionFigures": []}, {"id": "ch24-q4", "chapterId": 24, "chapter": "HIV", "number": 4, "text": "Which of the following represents the correct sequence of HIV replication?", "options": [{"id": "A", "text": "RNA-DNA-RNA"}, {"id": "B", "text": "RNA-DNA"}, {"id": "C", "text": "DNA-RNA"}, {"id": "D", "text": "DNA-RNA-DNA"}], "correctIndex": 0, "correctLetter": "A", "solution": "HIV replicates by the sequence RNA-DNA-RNA. The provirus initiates viral replication by\ndirecting the synthesis of viral RNA and other components. Hence, the sequence is\nRNA-ssDNA-dsDNA-RNA.\nHIV genome is composed of 2 single-stranded positive-sense RNA. When a virus infects a cell, the\nviral RNA is transcribed by the enzyme reverse transcriptase, first into single-stranded DNA and\nthen to double-stranded DNA which is integrated into the host chromosome.\nNote: If the options include RNA-DNA-RNA and RNA-DNA-DNA-RNA then the latter would be\nthe choice.\nThe given image represents HIV replication", "questionPages": [390, 391], "solutionPages": [394, 395], "questionFigures": [], "solutionFigures": ["crop-solution-ch24-q4-1"]}, {"id": "ch24-q5", "chapterId": 24, "chapter": "HIV", "number": 5, "text": "As part of developing the public health policy on HIV in India, which of the following modes\nof transmission would you focus on the most?", "options": [{"id": "A", "text": "Parent to child transmission"}, {"id": "B", "text": "Heterosexual transmission"}, {"id": "C", "text": "Blood transfusion"}, {"id": "D", "text": "Homosexual transmission"}], "correctIndex": 1, "correctLetter": "B", "solution": "Heterosexual transmission is the most common mode of transmission of HIV infection in\ndeveloping countries such as India and African countries. In many Western countries,\nmale-to-male sexual transmission is the dominant mode of transmission.\nBlood transfusion carries the highest risk per 10000 exposures of getting HIV from an infected\nperson. However, it is not the most common mode of transmission.", "questionPages": [391], "solutionPages": [395], "questionFigures": [], "solutionFigures": []}, {"id": "ch24-q6", "chapterId": 24, "chapter": "HIV", "number": 6, "text": "A 35-year-old bisexual man goes to an ICTC centre for counselling about HIV. Which of the\nfollowing is false about HIV transmission?", "options": [{"id": "A", "text": "Male-to-female HIV transmission has more risk of causing infection than female-to-male transmission"}, {"id": "B", "text": "The risk of acquiring HIV with unprotected receptive anal intercourse is lower than that with penile-vaginal intercourse"}, {"id": "C", "text": "The quantity of HIV-1 in plasma is a primary determinant of the risk of HIV-1 transmission"}, {"id": "D", "text": "Male circumcision is associated with a lower risk of HIV acquisition for heterosexual men"}], "correctIndex": 1, "correctLetter": "B", "solution": "The risk of HIV acquisition associated with unprotected receptive anal intercourse is relatively\nhigher than that seen in penile-vaginal intercourse. This is because the rectal mucosal membrane\nis thin and fragile and anal intercourse is associated with microtrauma (rectal tears).\nThe differences in transmission rates between men and women are because the vagina and cervix\nare exposed to semen for a longer duration, increasing the risk of transmission. However, the\npenis and urethral orifice are exposed relatively briefly to infected vaginal fluid, lowering the risk.", "questionPages": [391], "solutionPages": [395], "questionFigures": [], "solutionFigures": []}, {"id": "ch24-q7", "chapterId": 24, "chapter": "HIV", "number": 7, "text": "Specific binding of the HIV to the CD4 receptor occurs via which of these?", "options": [{"id": "A", "text": "gp120"}, {"id": "B", "text": "gp41"}, {"id": "C", "text": "CCR5"}, {"id": "D", "text": "CXCR4"}], "correctIndex": 0, "correctLetter": "A", "solution": "The specific binding of the HIV to the CD4 receptor is by the envelope glycoprotein gp120.\nOption B - Cell fusion occurs via binding to gp41. Cell fusion is essential for infection to take\nplace.\nOption C, D - Binding to CD4 receptor requires the participation of a co-receptor CXCR 4 for T\ncell tropic HIV strains and CCR 5 for macrophage-tropic strains.\n\n\n\n)\nbe ee", "questionPages": [391], "solutionPages": [395, 396], "questionFigures": [], "solutionFigures": ["crop-solution-ch24-q7-1"]}, {"id": "ch24-q8", "chapterId": 24, "chapter": "HIV", "number": 8, "text": "A patient presents to you with a history of sharing needles during IV drug abuse with an\nHIV-positive partner. HIV-antibody spot test was negative, however p24 antigen assay was\npositive. You explain to him that he is currently in the window period for HIV. Which of the\n\n\n\nfollowing statements would you use to explain the concept to him?", "options": [{"id": "A", "text": "It is the time period between infection and onset of first symptoms"}, {"id": "B", "text": "It is the time period between infection and detection of antibodies"}, {"id": "C", "text": "It is the time period between exposure and onset of viral multiplication"}, {"id": "D", "text": "It is the time period between exposure and appearance of symptoms"}], "correctIndex": 1, "correctLetter": "B", "solution": "In the given scenario, the patient has experienced a high-risk exposure to HIV due to sharing\nneedles during IV drug abuse with an HIV-positive partner.\nThe period between infection and detection of antibodies against HIV is known as the window\nperiod.\nThe window period may last anywhere between 2-8 weeks to a few months. During this period,\nthe individual may be highly infectious. HIV infection can be detected during this period by p24\nantigen assay and PCR.", "questionPages": [391, 392], "solutionPages": [396, 397], "questionFigures": [], "solutionFigures": ["crop-solution-ch24-q8-1"]}, {"id": "ch24-q9", "chapterId": 24, "chapter": "HIV", "number": 9, "text": "A 41-year-old man was admitted for hernioplasty and initial investigations revealed that he is\nHIV-positive. He gives no history of contact and has no HIV-associated symptoms. Which of\nthe following statements is incorrect about this phase of HIV infection?", "options": [{"id": "A", "text": "Viral replication is active"}, {"id": "B", "text": "Sequestered in lymphoid tissue"}, {"id": "C", "text": "Infective"}, {"id": "D", "text": "Rapid decline of CD4 count is common"}], "correctIndex": 3, "correctLetter": "D", "solution": "The given patient is in the latent period of HIV infection. During the latent phase of HIV\ninfection, the CD4+ T cell count declines steadily and not rapidly.\nAll patients infected with HIV pass through a phase of clinical latency during which they are\nasymptomatic. This can last for years. During the latent phase, patients show positive HIV\nantibody tests and they are infectious. There will be varying degrees of viral multiplication.\nThroughout the course of untreated infection and even during the stage of clinical latency, HIV is\nactively replicating or is sequestered in lymphoid tissues.", "questionPages": [392], "solutionPages": [397], "questionFigures": [], "solutionFigures": ["crop-solution-ch24-q9-1"]}, {"id": "ch24-q10", "chapterId": 24, "chapter": "HIV", "number

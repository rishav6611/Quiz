lar parasites.\nIt passes its life cycle in two hosts- the definitive host is the man and the intermediate host\n(vector) is reduviid bug or triatomine bugs.\nMetacyclic trypomastigotes are the infective forms to the man that are found in feces of reduviid\nbugs. Transmission occurs when mucus membranes, conjunctiva, or wound on the surface of the\nskin are contaminated by feces of the bug.\nInside the definitive host, the trypomastigotes differentiate into intracellular amastigotes. The\namastigotes multiply by binary fission and differentiate into trypomastigotes, which are then\nreleased into the bloodstream. These are the infective stage for triatomine bug. No multiplication\noccurs in this stage.\nInside the triatomine bug, the trypomastigotes are transformed into epimastigotes and then\ninto metacyclic trypomastigotes in the hindgut which are excreted in feces.\n\n\n\nNote: Amastigote forms resemble the Leishmania spp. and hence they are frequently known as\nLeishmanial forms. They are found in muscular tissue, nervous tissue, and reticuloendothelial\nsystem.", "questionPages": [513], "solutionPages": [530, 531], "questionFigures": ["crop-question-ch31-q17-1"], "solutionFigures": []}, {"id": "ch31-q18", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 18, "text": "The given life cycle belongs to which of the following organisms?", "options": [{"id": "A", "text": "Trypanosoma brucei gambiense"}, {"id": "B", "text": "Trypanosoma brucei rhodesiense"}, {"id": "C", "text": "Leishmania donovani"}, {"id": "D", "text": "Babesia microti"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given life cycle belongs to Leishmania donovani.\nThe definitive hosts are man, dog, and other mammals and the vector/intermediate host is female\nsandfly. Promastigotes are infective forms to man.\nL. donovani exists in 2 forms:\n+ Amastigote form- in humans and other mammals\n+ Promastigote form- in the sandfly and artificial culture\nWhen the infected sandfly bites a person, infectious promastigotes are released into the host\ndermis along with the sandfly saliva, which potentiates parasite infectivity.\nAmastigote form (as shown in the image below) is also known as Leishman-Donovan (LD) body. It\nis an intracellular form found inside macrophages, monocytes and reticuloendothelial cells. It\ncontains a kinetoplast which consists of a parabasal body and a blepharoplast. Flagellum is\nabsent.\nPromastigote form (as shown in the below image) is present in the midgut of the female sandfly.\nThe kinetoplast lies transversely near the anterior end. A single flagellum is seen. It is the\ninfective form of Leishmania donovani for humans.", "questionPages": [513, 514], "solutionPages": [531, 532], "questionFigures": ["crop-question-ch31-q18-1"], "solutionFigures": ["crop-solution-ch31-q18-1", "crop-solution-ch31-q18-2"]}, {"id": "ch31-q19", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 19, "text": "You are performing the following diagnostic procedure in a patient having fever for the past 2\nweeks to find the causative organism. Which disease are you most likely testing for?", "options": [{"id": "A", "text": "Kala-azar"}, {"id": "B", "text": "Schistosomiasis"}, {"id": "C", "text": "Toxoplasmosis"}, {"id": "D", "text": "Chagas disease"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given image shows bone marrow aspiration and it is most commonly done to diagnose\nKala-azar.\nThe microscopic demonstration of amastigotes from bone marrow is the gold standard for the\ndiagnosis of Kala-azar\nGenerally, the sternal marrow is aspirated by puncturing the sternum at the level of the 2nd or\n3rd intercostal space, using a sternal puncture needle.\nOther samples collected are peripheral blood, splenic aspirate, and enlarged lymph node.\nIn kala-azar:\n* Most common specimen collected for microscopy- bone marrow aspirate.\n* Most sensitive method- splenic aspirate.\nOption B: Schistosomiasis is typically diagnosed by stool examination for parasite eggs.\nOption C: Toxoplasmosis is usually diagnosed based on serologic testing.\nOption D: Chagas disease is diagnosed by peripheral blood smear examination, culture and\nexamination of aspirates from lymph nodes and chagoma.", "questionPages": [514, 515], "solutionPages": [532], "questionFigures": ["crop-question-ch31-q19-1"], "solutionFigures": []}, {"id": "ch31-q20", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 20, "text": "What is the vector for the condition diagnosed by the image shown below?", "options": [{"id": "A", "text": "Anopheles mosquito"}, {"id": "B", "text": "Ixodes Tick"}, {"id": "C", "text": "Sandfly"}, {"id": "D", "text": "Tsetse fly"}], "correctIndex": 2, "correctLetter": "C", "solution": "The image shown is of the Leishman-Donovan bodies whose presence are diagnostic of Kala Azar.\nThe vector of Kala Azar is a sandfly.\nLeishman-Donovan bodies are amastigotes with a double dot appearance containing a nucleus\nand small rod-like kinetoplast. They are present inside the macrophage.", "questionPages": [515], "solutionPages": [532, 533], "questionFigures": ["crop-question-ch31-q20-1"], "solutionFigures": []}, {"id": "ch31-q21", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 21, "text": "A 15-year-old boy from Delhi presented to the OPD with the finding seen in the image. It is\ndiagnosed to be an oriental sore. Which of the following causes this?", "options": [{"id": "A", "text": "Leishmania mexicana complex"}, {"id": "B", "text": "Leishmania braziliensis complex"}, {"id": "C", "text": "Leishmania donovani"}, {"id": "D", "text": "Leishmania tropica complex"}], "correctIndex": 3, "correctLetter": "D", "solution": "The given image shows cutaneous leishmaniasis and is caused by Leishmania tropica complex. It\nis also called oriental sore/Delhi boil/Bagdad boil/Aleppo button. It is seen mainly among children\nin endemic areas.\nOld world Leishmania tropica complex includes 3 species:\n+L. tropica\n+L. major\n+ L. aethiopica\nNew world Leishmania tropica complex includes 3 species:\n+ L. mexicana complex\n+L. braziliensis complex\nIt begins as a raised papule that grows into a nodule which then ulcerates over some\nweeks. The margins of the ulcer are raised and indurated. The ulcer is usually painless unless\nsecondary bacterial infection occurs.", "questionPages": [515, 516], "solutionPages": [533], "questionFigures": ["crop-question-ch31-q21-1"], "solutionFigures": []}, {"id": "ch31-q22", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 22, "text": "A medicine resident is evaluating a patient with abdominal pain and diarrhoea. The stool wet\nmount finding is given below. What is the most likely causative organism?", "options": [{"id": "A", "text": "Balantidium coli"}, {"id": "B", "text": "Isospora belli"}, {"id": "C", "text": "Cryptosporidium parvum"}, {"id": "D", "text": "Enteromonas hominis"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given image shows the trophozoite form of the Balantidium coli. Living trophozoites/cysts are\nyellowish or greenish in color on wet mount.\nBalantidium coli occurs in two stages:\n* Trophozoites are oval in shape and contain two nuclei. There is the presence of cilia over the\nentire surface and are larger around the mouth. Its anterior end is narrow and the posterior end is\nbroad. At the anterior end, there is a groove leading to the mouth (cytostome). Posteriorly, there\nis a small anal pore (cytopyge).\n* Cysts are smaller, round with a micronucleus, a macronucleus and many contractile vacuoles.", "questionPages": [516, 517], "solutionPages": [533], "questionFigures": ["crop-question-ch31-q22-1"], "solutionFigures": []}, {"id": "ch31-q23", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 23, "text": "What is the investigation of choice for the diagnosis of kala-azar?", "options": [{"id": "A", "text": "Rapid dipstick test"}, {"id": "B", "text": "Aldehyde test of Napier"}, {"id": "C", "text": "ELISA"}, {"id": "D", "text": "Indirect fluorescent antibody test"}], "correctIndex": 0, "correctLetter": "A", "solution": "The rapid dipstick test is the method of choice for the diagnosis of kala-azar.\nThe following tests are used for the laboratory diagnosis of kala-azar:\n* Rapid diagnostic tests - rK39 and dipstick test strip.\n+ Parasitological diagnosis - demonstration of LD bodies on microscopy is confirmatory\n* Surveillance purposes - Aldehyde test of Napier\n\n\n\n* Serological diagnosis - Rapid dipstick test, direct agglutination test, ELISA, indirect fluorescent\nantibody test\n+ Assessing immune status - Leishmanin (Montenegro) test\n* Induration of > 5 mm is considered positive\n* Usually becomes positive 4-6 weeks after onset of cutaneous leishmaniasis", "questionPages": [517, 518], "solutionPages": [533, 534], "questionFigures": [], "solutionFigures": []}, {"id": "ch32-q1", "chapterId": 32, "chapter": "Protozoology - Sporozoa", "number": 1, "text": "A 55-year-old man comes with complaints of fever and increasing fatigue for the past week.\nOn examination, he is febrile, hypotensive and tachycardic. The findings of microscopic\nexamination of his peripheral blood smear is given below. What is the causative agent?", "options": [{"id": "A", "text": "Plasmodium vivax"}, {"id": "B", "text": "Plasmodium falciparum"}, {"id": "C", "text": "Plasmodium ovale"}, {"id": "D", "text": "Plasmodium malariae"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given clinical history and the blood smear showing multiple ring forms in RBCs are\nsuggestive of malaria caused by Plasmodium falciparum.\nFalciparum malaria infects both young and mature erythrocytes. Binucleate rings (double\nchromatin) seen in RBCs are common and they resemble stereo headphones in appearance. The\nrings are often attached to the margins of the red cells and are described as form applique or\naccole. There may be several rings present within a single erythrocyte.\nHypnozoites are not present in P. falciparum infection.\nThe peripheral smear finding of P. falciparum malaria are:\n* Multiple ring form\n+ Accole form\n+ Absent schizont\n+ Banana shaped gametocytes\n* Maurer's dots\nThe below image shows banana shaped gametocyte:", "questionPages": [535], "solutionPages": [542], "questionFigures": ["crop-question-ch32-q1-1"], "solutionFigures": ["crop-solution-ch32-q1-1"]}, {"id": "ch32-q2", "chapterId": 32, "chapter": "Protozoology - Sporozoa", "number": 2, "text": "During your rural posting, a patient presents with a high fever and chills. Malaria is endemic\nin the area so you order a peripheral smear. While examining the peripheral blood smear, you\nnote that the schizont stage is not seen. Which of the following organisms is implicated here?", "options": [{"id": "A", "text": "Plasmodium vivax"}, {"id": "B", "text": "Plasmodium malariae"}, {"id": "C", "text": "Plasmodium falciparum"}, {"id": "D", "text": "Plasmodium ovale"}], "correctIndex": 2, "correctLetter": "C", "solution": "The schizont stage is usually not seen in the peripheral smear of individuals having Plasmodium\nfalciparum malaria.\nA mature schizont contains merozoites and hemozoin. This will burst to release merozoites into\ncirculation. The merozoites invade fresh erythrocytes, in which they go through the same process\nof development called erythrocytic schizogony or merogony.\nAfter the ring form is formed in peripheral blood, the remaining RBC cycle of falciparum occurs in\nthe capillaries of the brain and other internal organs. Hence only the ring form is seen in the\nperipheral smear.\n\n\n\nHowever, for other Plasmodium species, all erythrocytic stages occur in peripheral blood vessels.\nThe below image shows the life cycle of Plasmodium spp.\nA: infective Stage\nMosquito Stages - ue REE e\nBEBO eam , oa\n* et Naeeeee ae aos mea Exo-erythrocytic Cycle\n‘Sporogonic Cycle * Human Blood St\n— of ee\nDookinete siosgee ohes | 4 . « {irs stage),\nie ed i a \\ a Erythrocytic Cycle swatureZa\n“Neco Oy ls Retr e”\nPiscomm Go >\nGB netspos _—e", "questionPages": [535, 536], "solutionPages": [542, 543], "questionFigures": [], "solutionFigures": []}, {"id": "ch32-q3", "chapterId": 32, "chapter": "Protozoology - Sporozoa", "number": 3, "text": "Which of the following Plasmodium spp. has the longest incubation period?", "options": [{"id": "A", "text": "Plasmodium vivax"}, {"id": "B", "text": "Plasmodium falciparum"}, {"id": "C", "text": "Plasmodium malariae"}, {"id": "D", "text": "Plasmodium ovale"}], "correctIndex": 2, "correctLetter": "C", "solution": "Plasmodium malariae has the longest incubation period of 28 days.\nThe incubation period is the interval between the infective mosquito bite and the first appearance\nof clinical symptoms. The average incubation periods for Plasmodium species are:\n+ P. vivax: 8-31 days (14 days)\n+ P. falciparum: 8-14 days (12 days)\n+ P. ovale: 8-31days (14 days)\n+ P. malariae: 18-40 days (28 days)\nNote: The pre-patent period is the interval between the entry of the parasites into the host and the\ntime when they first become detectable in blood.", "questionPages": [536], "solutionPages": [543], "questionFigures": [], "solutionFigures": []}, {"id": "ch32-q4", "chapterId": 32, "chapter": "Protozoology - Sporozoa", "number": 4, "text": "Which of the following Plasmodium spp. mainly affects the old RBCs?", "options": [{"id": "A", "text": "Plasmodium vivax"}, {"id": "B", "text": "Plasmodium falciparum"}, {"id": "C", "text": "Plasmodium malariae"}, {"id": "D", "text": "Plasmodium ovale"}], "correctIndex": 2, "correctLetter": "C", "solution": "Plasmodium malaria mainly affects the old RBCs.\nOptions A and D- P. vivax and P. ovale infect young RBCs and reticulocytes.\nOption B- P. falciparum infects RBCs of all ages.\nThe degree of parasitization is not heavy for P. vivax and P. malariae while very high intensity of\nparasitization is seen in infection with P. falciparum.", "questionPages": [536], "solutionPages": [543, 544], "questionFigures": [], "solutionFigures": []}, {"id": "ch32-q5", "chapterId": 32, "chapter": "Protozoology - Sporozoa", "number": 5, "text": "A microbiologist is examining the slide shown in the following image under the microscope.\nWhich of the following is false regarding this?", "options": [{"id": "A", "text": "'B' is used for determining the species"}, {"id": "B", "text": "'B' is more sensitive than 'A'"}, {"id": "C", "text": "'A' is air dried rapidly and stained with one of the Romanowsky stains"}, {"id": "D", "text": "For 'B' to be considered negative, at least 200 oil immersion fields should be examined"}], "correctIndex": 0, "correctLetter": "A", "solution": "In the given image 'A' is a thin smear and 'B' is a thick smear. The thin smear is used for\ndetermining the species, not the thick smear.\nThe two types of smears are prepared from the peripheral blood are:\n+ Thin smear- It is used for detecting the parasites and determining the species. They are air-dried\nrapidly and stained with Romanowsky stains.\n* Thick smear- It is more sensitive and examined under oil immersion microscope. It is more\nsuitable for the rapid detection of malarial parasites. Species identification is difficult. It is\nrecommended that 200 oil immersion fields should be examined before a thick film is declared\nnegative.\nThe image below shows the thin and thick smears.", "questionPages": [536, 537], "solutionPages": [544], "questionFigures": ["crop-question-ch32-q5-1"], "solutionFigures": ["crop-solution-ch32-q5-1"]}, {"id": "ch32-q6", "chapterId": 32, "chapter": "Protozoology - Sporozoa", "number": 6, "text": "A 15-year-old boy presents to the OPD with high-grade fever, chills, and rigors for the past 3\ndays. A peripheral blood smear revealed the following. Which of the following is false\nregarding the diagnostic methods used to detect the condition he is likely suffering from?", "options": [{"id": "A", "text": "Jaswant Singh Bhattacharya stain is used for peripheral smear examination"}, {"id": "B", "text": "HRP-2 antigen test is done for detection of P.vivax"}, {"id": "C", "text": "Acridine orange dye is used in quantitative buffy coat method"}, {"id": "D", "text": "Rapid diagnostic tests have lesser sensitivity than microscopy"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given clinical scenario and the peripheral smear showing ring forms are suggestive of P.\nfalciparum malaria. HRP-2 antigen detection used in rapid diagnostic tests for malaria is specific\nfor P. falciparum.\nJaswant Singh Bhattacharya (JSB) stain is routinely used in India to stain peripheral blood\nsmears for the diagnosis of malaria.\nAcridine orange dye is used in the quantitative buffy coat (QBC) method of diagnosis which\nprovides better yield compared to peripheral smears.\nRapid diagnostic tests are based on the detection of antigens using immunochromatographic\nmethods. They are less sensitive than microscopy and also cannot differentiate between species\nexcept P. falciparum. The 2 antigens detected are:\n* pLDH (parasite lactate dehydrogenase)- pan malarial antigen\n\n\n\n* HRP-2 (histidine-rich protein 2)- specific for P.falciparum.", "questionPages": [537], "solutionPages": [544, 545], "questionFigures": ["crop-question-ch32-q6-1"], "solutionFigures": []}, {"id": "ch32-q7", "chapterId": 32, "chapter": "Protozoology - Sporozoa", "number": 7, "text": "A 50-year-old man with a 5-day history of fever is brought to the casualty by his son after an\nepisode of seizures. He is diagnosed with malignant tertian malaria. Which of the following\ncomplications will you not expect to see in this patient?", "options": [{"id": "A", "text": "Hypoglycemia"}, {"id": "B", "text": "Acute renal failure"}, {"id": "C", "text": "Pulmonary edema"}, {"id": "D", "text": "Metabolic alkalosis"}], "correctIndex": 3, "correctLetter": "D", "solution": "Metabolic acidosis (and not alkalosis) is a complication of malignant tertain malaria caused by\nPlasmodium falciparum.\nComplications of falciparum malaria include:\n* Metabolic acidosis\n* Cerebral malaria\n+ Algid malaria\n* Septicemic malaria\n* Blackwater fever\n* Pulmonary edema\n+ Acute renal failure\n* Hypoglycemia\n* Hyperpyrexia\n+ Severe anemia\n* Shock", "questionPages": [537, 538], "solutionPages": [545], "questionFigures": [], "solutionFigures": []}, {"id": "ch32-q8", "chapterId": 32, "chapter": "Protozoology - Sporozoa", "number": 8, "text": "A 24-year-old patient presents with a high-grade fever, headache, and weakness for 5 days.\nHe gives a history of blood transfusion 4 months back. The microscopic examination of the\nthin blood smear is given below. What is the most probable causative agent?", "options": [{"id": "A", "text": "Plasmodium knowlesi"}, {"id": "B", "text": "Babesia microti"}, {"id": "C", "text": "Plasmodium falciparum"}, {"id": "D", "text": "Plasmodium malariae"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given clinical history and the microscopy showing Maltese crosses or tetrads are suggestive of\nbabesiosis caused by Babesia microti.\nThe definitive host for babesia are ixodid ticks. Man is an incidental, dead-end host.\nOn microscopic examination, babesia trophozoites appear as intraerythrocytic round or pyriform\nor ring form. The ring form is the most common and it lacks the central hemozoin deposit which\ndifferentiates it from P. falciparum.\nOther distinguishing features are the absence of schizonts and gametocytes and the presence of\ntetrads/Maltese crosses, which are pathognomic of B. microti or B. duncani.\nThe below image shows Maltese cross appearance of Babesia microti.", "questionPages": [538], "solutionPages": [545, 546], "questionFigures": ["crop-question-ch32-q8-1"], "solutionFigures": ["crop-solution-ch32-q8-1"]}, {"id": "ch32-q9", "chapterId": 32, "chapter": "Protozoology - Sporozoa", "number": 9, "text": "Sabin-Feldman dye test is used for diagnosis of which of the following condition?", "options": [{"id": "A", "text": "Paragonimiasis"}, {"id": "B", "text": "Hydatid cyst"}, {"id": "C", "text": "Toxoplasmosis"}, {"id": "D", "text": "Cryptococcus"}], "correctIndex": 2, "correctLetter": "C", "solution": "Sabin-Feldman dye test is used for the diagnosis of toxoplasmosis.\nIt is based on the principle that the presence of anti-toxoplasma antibodies in the patient's\nserum inhibits the staining of trophozoites by alkaline methylene blue dye.\nToxoplasma trophozoites and complement are added to the patient's serum which is then\nincubated for an hour at 37°C. After incubation, methylene blue dye is added.\nIf anti-toxoplasma antibodies are present in the serum, these are activated by complement and\nthe parasite membrane is lysed. Thus, the trophozoites are not stained (positive result).\nIf there are no antibodies, trophozoites will take up the stain and appear blue under the\nmicroscope. This is considered to be a negative result.\nThe dilution of the test serum at which 50% of the tachyzoites are not stained is reported as the\nantibody titer of the test serum. The test is highly sensitive and specific.\nIt cannot differentiate between recent or past infections as it detects only IgG antibodies.", "questionPages": [538], "solutionPages": [546], "questionFigures": [], "solutionFigures": []}, {"id": "ch32-q10", "chapterId": 32, "chapter": "Protozoology - Sporozoa", "number": 10, "text": "Which of the following statements is true regarding Toxoplasma gondii?", "options": [{"id": "A", "text": "Humans are the definitive host"}, {"id": "B", "text": "Oocysts are formed within the intermediate host"}, {"id": "C", "text": "The tachyzoites inside the tissue cyst can be reactivated on immunosuppression"}, {"id": "D", "text": "Human toxoplasmosis is a zoonosis"}], "correctIndex": 3, "correctLetter": "D", "solution": "Human toxoplasmosis is a zoonosis. It is transmitted by cats.\nToxoplasma gondii has two types of life cycles:\n+ Enteric cycle\n* Exoenteric cycle\nThe enteric cycle occurs in definitive hosts such as cats. Exoenteric cycle occurs in intermediate\nhosts such as humans, mice, rats, etc.\n\n\n\nBoth asexual reproduction (schizogony) and sexual reproduction (gametogony) occur within the\nmucosal epithelial cells of the small intestine of the cat. The tachyzoites and tissue cyst represent\nstages in asexual multiplication, while the oocyst is formed by sexual reproduction.\nAll three forms, tachyzoites, tissue cyst, and oocyst occur in the definitive host. Only the asexual\nforms, tachyzoites, and tissue cysts are present in the intermediate host.\nTachyzoites continue to multiply and spread locally by the lymphatic system and blood, while the\nbradyzoites multiply slowly inside the tissue cyst. The dormant bradyzoites inside the cyst may be\nreactivated on immune suppression causing renewed infection in the host.\nThe below image shows the life cycle of Toxoplasma gondii.", "questionPages": [538, 539], "solutionPages": [546, 547], "questionFigures": [], "solutionFigures": ["crop-solution-ch32-q10-1"]}, {"id": "ch32-q11", "chapterId": 32, "chapter": "Protozoology - Sporozoa", "number": 11, "text": "An HIV positive pregnant woman was brought to the ER after an episode of generalized\ntonic-clonic seizures. CECT was done which showed multiple enhancing lesions. A\nstereotactic biopsy of the cerebral lesions was done and the image is given below. Which of\nthe following is the most appropriate drug for her treatment?", "options": [{"id": "A", "text": "Trimethoprim"}, {"id": "B", "text": "Sulfadadiazine"}, {"id": "C", "text": "Spiramycin"}, {"id": "D", "text": "Albendazole"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given clinical scenario and the image showing lymphocytes, macrophages, and eosinophils\nsurrounding the toxoplasma bradyzoites which are encased in cysts are suggestive of cerebral\ntoxoplasmosis. Spiramycin is the drug of choice during pregnancy.\nCerebral toxoplasmosis is an opportunistic infection commonly found in HIV tve patients and\nusually occurs when CD4+ T cell counts <100/uL.\nIt appears as ring enhancing lesions on contrast enhanced CT. Calcification may also be seen in\nold lesions.\nSabin-Feldman dye test is a serological test done for the detection of antibodies against\ntoxoplasma. IIF (indirect immunofluorescence), IHA (indirect heamagglutination), and\nCFT (complement fixation test) are also used for the diagnosis of toxoplasmosis. Dye test remains\npositive throughout life, while CFT becomes negative soon after acute infection.\nELISA is most commonly used and IgM and IgG antibodies are estimated separately.\nStandard treatment is sulfadiazine/pyrimethamine and leucovorin for a minimum of 4-6 weeks.\nThe drug of choice for toxoplasmosis in pregnancy is spiramycin.", "questionPages": [539], "solutionPages": [547, 548], "questionFigures": ["crop-question-ch32-q11-1"], "solutionFigures": []}, {"id": "ch32-q12", "chapterId": 32, "chapter": "Protozoology - Sporozoa", "number": 12, "text": "A Kinyoun-positive oocyst (25 um) isolated from an HIV patient with diarrhea is shown in the\nimage. What is the likely organism implicated here?", "options": [{"id": "A", "text": "Cystoisospora"}, {"id": "B", "text": "Cyclospora"}, {"id": "C", "text": "Cryptosporidium"}, {"id": "D", "text": "Microspora"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given clinical scenario with diarrhea in an HIV patient is suggestive of a coccidian parasitic\ninfestation. Kinyoun-positive oocysts with the size of 25 um in the image are formed\nby Cystoisospora.\nComparison of coccidian parasites causing diarrhea in an immunocompromised host:\nThe below image shows oocysts of Cyclospora cayetanensis in the modified acid-fast stain.\n\n\n\nThe below image shows oocysts of Cryptosporidium parvum in the modified acid-fast stain.", "questionPages": [539, 540], "solutionPages": [548, 549], "questionFigures": ["crop-question-ch32-q12-1"], "solutionFigures": ["crop-solution-ch32-q12-1", "crop-solution-ch32-q12-2"]}, {"id": "ch32-q13", "chapterId": 32, "chapter": "Protozoology - Sporozoa", "number": 13, "text": "A patient who underwent a renal transplant 3 months ago came with complaints of diarrhea\nfor the last 9 days. The stool sample subjected to Kinyoun staining revealed 4-6 ym structures\nas shown below. Which of the following is true about the causative organism?", "options": [{"id": "A", "text": "It does not shows autoinfection"}, {"id": "B", "text": "It is an obligate intracellular organism"}, {"id": "C", "text": "Oocysts are immediately infective after being excreted in stool"}, {"id": "D", "text": "Metronidazole is the drug of choice"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given clinical scenario with Kinyoun stain positive oocysts of size 4-6 ym is suggestive of\ncryptosporidiosis. The oocysts are immediately infective after being excreted in the stool.\nCryptosporidium is a coccidian parasite and implicated in causing traveler's diarrhea in\nimmunocompromised patients. The two cryptosporidium species responsible are C. hominis and\nC. parvum.\nThe infective form is the oocyst excreted in the patient's feces, which can be acquired through\ndrinking or during recreational water activities. The oocysts are immediately infectious (unlike\nisospora oocysts, which require maturation), and may cause autoinfection or be implicated in\n\n\n\n\nperson-to-person transmission. Because of their small size (4-5micron), they is difficult to see\nusing routine staining. Hence acid-fast/Kinyoun's stain is used.\nOnce ingested, the 4 sporozoites are released from the cyst and attach to the small intestinal\nmucosa. It causes crampy abdominal pain and non-inflammatory watery diarrhea.\nTreatment is mainly supportive, though nitazoxanide has been FDA approved for use in\ncryptosporidium infection.\nComparative features of coccidian parasites:", "questionPages": [540, 541], "solutionPages": [549, 550], "questionFigures": ["crop-question-ch32-q13-1"], "solutionFigures": ["crop-solution-ch32-q13-1"]}, {"id": "ch32-q14", "chapterId": 32, "chapter": "Protozoology - Sporozoa", "number": 14, "text": "Match the following:", "options": [{"id": "A", "text": "A-2, B-1, C-3, D-4"}, {"id": "B", "text": "A-3, B-2, C-1, D-4"}, {"id": "C", "text": "A-4, B-1, C-2, D-3"}, {"id": "D", "text": "A-1, B-2, C-4, D-3"}], "correctIndex": 1, "correctLetter": "B", "solution": "The below image shows trophozoites of Trichomonas vaginalis with flagella.\n\n\n\nThe below image shows the trophozoite of Balantidium coli with cilia.\nThe below image shows the trophozoite of Balamuthia mandrillaris with pseudopodia.\n\n\n\nThe below image shows tachyzoites of Toxoplasma gondi. They have no specialised structure for\nlocomotion.", "questionPages": [541], "solutionPages": [550, 551, 552], "questionFigures": [], "solutionFigures": ["crop-solution-ch32-q14-1", "crop-solution-ch32-q14-2", "crop-solution-ch32-q14-3"]}, {"id": "ch33-q1", "chapterId": 33, "chapter": "Helminthology - Cestodes & Trematodes", "number": 1, "text": "Which of the following cestodes requires only one host?", "options": [{"id": "A", "text": "Hymenolepis nana"}, {"id": "B", "text": "Echinococcus granulosus"}, {"id": "C", "text": "Diphyllobothrium latum"}, {"id": "D", "text": "Multiceps multiceps"}], "correctIndex": 0, "correctLetter": "A", "solution": "Hymenolepis nana requires only one host for its development. Man serves as the host for H. nana.\nUsually, cestodes complete their life cycle in 2 different hosts except:\n+ Hymenolepis requires only 1 host, man.\n+ Diphyllobothrium requires 3 hosts\nParasite requiring a single host to complete its development is said to have a direct life cycle.\nParasites having a direct life cycle are:", "questionPages": [553], "solutionPages": [], "questionFigures": [], "solutionFigures": ["crop-solution-ch33-q1-1"]}, {"id": "ch33-q2", "chapterId": 33, "chapter": "Helminthology - Cestodes & Trematodes", "number": 2, "text": "A 10-year-old child is brought to your clinic with complaints of diarrhea and abdominal pain\nfor the last 4 days. Stool microscopy is shown below. The eggs present in the stool float in a\nsaturated solution of salt. Which of the following can you use to treat her?", "options": [{"id": "A", "text": "Ivermectin"}, {"id": "B", "text": "Mebendazole"}, {"id": "C", "text": "Praziquantel"}, {"id": "D", "text": "Paromomycin"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given clinical history and the egg seen on stool microscopy are suggestive of infection with\nHymenolepis nana. A single dose of praziquantel (25 mg/kg) is the drug of choice.\n\n\n\nThe Hymenolepis nana eggs have a thin colorless outer membrane and inner embryophore\nenclosing the hexacanth oncosphere. The space between two membranes contains yolk granules\nand 4-8 thread-like polar filaments arising from two knobs on the embryophore. The eggs float in\nsaturated salt solution and are non-bile stained.\nHymenolepiasis occurs more commonly in children and is usually asymptomatic. In heavy\ninfections, they present with nausea, anorexia, abdominal pain, diarrhea,\nand irritability. Sometimes pruritus may occur due to an allergic response.\nThe image given below shows the egg of Hymenolepis nana.", "questionPages": [553], "solutionPages": [564], "questionFigures": ["crop-question-ch33-q2-1"], "solutionFigures": ["crop-solution-ch33-q2-1"]}, {"id": "ch33-q3", "chapterId": 33, "chapter": "Helminthology - Cestodes & Trematodes", "number": 3, "text": "A patient is brought to the hospital, with complaints of seizures and the MRI image of the\nbrain is given below. The disease is most probably caused by?", "options": [{"id": "A", "text": "Cysticercosis cellulosae"}, {"id": "B", "text": "T. saginata"}, {"id": "C", "text": "Cysticerocosis bovis"}, {"id": "D", "text": "T. asiatica"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given clinical scenario and MRI brain showing scolex within multiple cystic lesions are\nsuggestive of neurocysticercosis caused by the larval form of T. solium called Cysticercosis\ncellulosae.\nNeurocysticercosis is the most common central nervous system parasitic infection.\nThe clinical features of neurocysticercosis include:\n+ Epilepsy\n+ Increased intracranial tension\n+ Hydrocephalus\n+ Psychiatric disturbances\n* Meningoencephalitis\n* Transient paresis\n+ Behavioral disorders\n+ Aphasia\n\n\n\n+ Visual disturbances.\nThe CT and MRI findings seen in neurocysticercosis are:\n* Scolex within a cyst\n* Cystic lesions with or without ring enhancement\n* Nodular calcifications\n+ Focal enhancing lesions\n* Multilobulated cystic lesions in the subarachnoid space.\nNote: About 70% of adult-onset epilepsy is due to neurocysticercosis.\nAlbendazole is the drug of choice for neurocysticercosis. Glucocorticoid therapy is usually\nbegun before initiating albendazole (antiparasitic drug). This is continued for several days after\nthe institution of therapy to reduce the incidence of side effects from inflammatory reactions to\ndead and dying cysticerci of Taenia solium.", "questionPages": [553, 554], "solutionPages": [564, 565], "questionFigures": ["crop-question-ch33-q3-1"], "solutionFigures": []}, {"id": "ch33-q4", "chapterId": 33, "chapter": "Helminthology - Cestodes & Trematodes", "number": 4, "text": "A 42-year-old man presented to the ER with complains of abdominal discomfort, indigestion,\nnausea and diarrhea after consuming measly pork. Stool examination reveals round eggs as\nshown in the image below. Which of the following statements is true regarding the causative\norganism?", "options": [{"id": "A", "text": "Eggs are not infective to man"}, {"id": "B", "text": "Hooks are absent"}, {"id": "C", "text": "The eggs do not float in saturated salt solution"}, {"id": "D", "text": "Intermediate host is cow"}], "correctIndex": 2, "correctLetter": "C", "solution": "Development of the given symptoms following the consumption of measly pork is suggestive of\nintestinal taeniasis caused by Taenia solium (pork tapeworm). The eggs of Taenia solium do not\nfloat in the saturated salt solution.\nThe eggs of T. solium are infective to man and pigs. The eggs of T. saginata are infective only to\ncattle and not to man.\nThe adult worm of Taenia solium is usually 2-3 meters long and the scolex has dagger-shaped\nhooks.\nMan is the definitive host. The intermediate host is usually pig, but occasionally it can be man.\nThe below image shows the life cycle of T. solium.", "questionPages": [554, 555], "solutionPages": [565, 566], "questionFigures": ["crop-question-ch33-q4-1"], "solutionFigures": ["crop-solution-ch33-q4-1"]}, {"id": "ch33-q5", "chapterId": 33, "chapter": "Helminthology - Cestodes & Trematodes", "number": 5, "text": "The adult form of echinococcus is seen in which of the following?", "options": [{"id": "A", "text": "Dog"}, {"id": "B", "text": "Cat"}, {"id": "C", "text": "Swine"}, {"id": "D", "text": "Sheep"}], "correctIndex": 0, "correctLetter": "A", "solution": "The adult form of echinococcus is seen in dogs and other canids which are its definitive hosts.\nThe larval stage is passed in intermediate hosts such as sheep, cattle, goat, swine, horse, camel,\nand man.\nMan acts as an accidental intermediate host (dead end).\nHuman infection follows the ingestion of eggs due to the intimate handling of dogs or by eating\nraw vegetables or other food contaminated with dog feces.\nNote: Humans can become accidental definitive hosts, second intermediate hosts, or paratenic\nhosts for spirometra. These are cestodes belonging to the Diphyllobothriidae family. They cause a\ncondition called sparagnosis.\nThe image below shows the life cycle of Echinococcus granulosus.\nCo aoe\nOscamae a 0 tonne\n& abi ~ 6 Ga\n«0 Aduttn smal intestine KS\nVY Protoscolex\nfoment\nSoe” | commen, %~@ ie\nIntermediate Host emeventes © eS\n(oneap gross ie ac) ames O 8\n®\nAo Kf |\n62) of «\n\\@g Avvincna son\n= Pe Oncasphere hatches: AX: Diagnostic Stage\nHyde cyst in ve, ung, ot poncttes esl al", "questionPages": [555], "solutionPages": [566], "questionFigures": [], "solutionFigures": []}, {"id": "ch33-q6", "chapterId": 33, "chapter": "Helminthology - Cestodes & Trematodes", "number": 6, "text": "Which of the following organisms cause multiple alveolar-like lesions in the liver?", "options": [{"id": "A", "text": "Echinococcus multilocularis"}, {"id": "B", "text": "Echinococcus granulosus"}, {"id": "C", "text": "Entamoeba histolytica"}, {"id": "D", "text": "Cysticercus cellulosae"}], "correctIndex": 0, "correctLetter": "A", "solution": "Echinococcus multilocularis causes multiple alveolar-like lesions in the liver.\nE. multilocularis leads to formation of a multilocular hydatid cyst, most commonly affecting the\nliver. It presents as multiple small cysts in the liver.\nNote: Echinococcus granulosus causes a hollow fluid-filled unilocular cyst in the liver.\nThe CT below shows water lily sign, which is seen in the hydatid disease of the lung. It is caused\nby Echinococcus granulosus.\n\n\n\nThe water-lily sign occurs due to detachment of the endocyst membrane from the cyst wall giving\nthe apparance of floating membranes within the pericyst. This mimics the appearance of a water\nlily.\nIt is classically visualised on plain radiographs (mainly chest X-ray) when the collapsed\nmembranes are calcified but may be seen on ultrasound, CT, or MRI.", "questionPages": [555, 556], "solutionPages": [566, 567], "questionFigures": [], "solutionFigures": ["crop-solution-ch33-q6-1"]}, {"id": "ch33-q7", "chapterId": 33, "chapter": "Helminthology - Cestodes & Trematodes", "number": 7, "text": "While examining a patient with right upper quadrant pain, you note the abdomen is soft with\nlocalised tenderness present. CT abdomen findings are given below. Based on these findings,\nyou post the patient for a PAIR procedure. Which of the following is not used in this\nprocedure?\nc d", "options": [{"id": "A", "text": "Cetrimide"}, {"id": "B", "text": "95% Alcohol"}, {"id": "C", "text": "Sodium hypochlorite"}, {"id": "D", "text": "Hypotonic saline"}], "correctIndex": 3, "correctLetter": "D", "solution": "The given clinical scenario and CT findings are suggestive of hydatid disease of the liver.\nHypotonic saline is not used as a scolicidal agent for the PAIR procedure (Puncture, Aspiration,\nInjection, and Re-aspiration) which is the treatment of choice in the early stages of this condition.\nComputed tomography (CT) scan is the best imaging modality for hydatid cyst. It shows the\npresence of a space-occupying lesion with a smooth outline with septa.\nIn PAIR the steps involved are:\n* USG or CT guided puncture of the cyst\n+ Aspiration of the cyst fluid\n+ Injection of scolicidal agent\n* Re-aspiration of fluid after 5 minutes\nThe following agents can be used as scolicidal agents:\nThe below image depicts the PAIR procedure.", "questionPages": [556], "solutionPages": [567, 568], "questionFigures": ["crop-question-ch33-q7-1"], "solutionFigures": ["crop-solution-ch33-q7-1", "crop-solution-ch33-q7-2"]}, {"id": "ch33-q8", "chapterId": 33, "chapter": "Helminthology - Cestodes & Trematodes", "number": 8, "text": "A 24-year-old woman presented to the OPD with a history of progressive breathlessness and\ncough for 3 months. A chest X-ray was done which showed a cavitary lesion in the lower lobe\nof the right lung. Wedge resection of the lesion was done and the histopathology image is\ngiven below. What is the most probable causative agent?", "options": [{"id": "A", "text": "Strongyloides stercoralis"}, {"id": "B", "text": "Fasciola hepatica"}, {"id": "C", "text": "Echinococcus granulosus"}, {"id": "D", "text": "Paragonimus westermani"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given clinical scenario and the histological slide showing the hydatid cyst are suggestive of\ninfection with Echinococcus granulosus.\nThe hydatid cyst wall consists of 3 layers:\n+ Pericyst- the outer dense fibrous capsule that is formed as a result of host inflammatory\nresponse.\n+ Ectocyst- the intermediate layer consisting of acellular, chitinous, laminated hyaline material.\n+ Endocyst- the inner germinal layer that is cellular and consists of a number of nuclei embedded\nin protoplasmic mass and is extremely thin. It is the vital layer of the cyst and it is the site of\nasexual reproduction giving rise to brood capsules with scolices.\nThe clinical features of hydatid disease of lung are breathlessness, cough, hemoptysis and chest\npain. Treatment includes wedge resection or lobectomy and administration of albendazole.\nThe below image shows the histology of hydatid cyst.", "questionPages": [556, 557], "solutionPages": [568, 569], "questionFigures": ["crop-question-ch33-q8-1"], "solutionFigures": ["crop-solution-ch33-q8-1"]}, {"id": "ch33-q9", "chapterId": 33, "chapter": "Helminthology - Cestodes & Trematodes", "number": 9, "text": "Which of the following organisms does the given life cycle belong to?", "options": [{"id": "A", "text": "Hymenolepis diminuta"}, {"id": "B", "text": "Echinococcus granulosus"}, {"id": "C", "text": "Hymenolepis nana"}, {"id": "D", "text": "Diphyllobothrium latum"}], "correctIndex": 3, "correctLetter": "D", "solution": "This is the life cycle of Diphyllobothrium latum. It is also known as fish tapeworm or broad\ntapeworm.\nThe 3 hosts of Diphyllobothrium latum are:\n+ Definitive host- man, dog, and cat.\n+ First intermediate host- freshwater crustacean\n* Second intermediate host- freshwater fish.\nThe infective form to humans is the third stage plerocercoid larvae. It possesses a rudimentary\nscolex.\nThe adult worm lives inside the small intestine and lays operculated eggs. These freshly passed\neggs contain an immature embryo surrounded by yolk granules. This hexacanth embryo with 6\nhooklets inside the egg is called oncosphere.", "questionPages": [557, 558], "solutionPages": [569], "questionFigures": ["crop-question-ch33-q9-1"], "solutionFigures": []}, {"id": "ch33-q10", "chapterId": 33, "chapter": "Helminthology - Cestodes & Trematodes", "number": 10, "text": "A 35-year-old woman presented to you with complaints of tingling and numbness in her legs.\nOn examination, her hands appear as shown in the image, ankle reflex was absent and\nRomberg's test was positive. Which of the following is most likely implicated in this\ncondition?", "options": [{"id": "A", "text": "Echinococcus granulosis"}, {"id": "B", "text": "Diphyllobothrium latum"}, {"id": "C", "text": "Hymenolepis nana"}, {"id": "D", "text": "Taenia solium"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given clinical scenario with cutaneous hyperpigmentation and features of subacute combined\ndegeneration are suggestive of vitamin B12 deficiency. This can be caused by Diphyllobothrium\nlatum.\nThe anemia develops because the tapeworm absorbs a large quantity of vitamin B12 and interferes\nwith its ileal absorption leading to vitamin B12 deficiency. This can also lead to megaloblastic\nanemia (Bothriocephalus anemia).\nIn severe cases, patients may exhibit neurological features of vitamin B12 deficiency like:\n+ Tingling and numbness\n\n\n\n+ Bilateral lower limb weakness\n+ Bilateral hypertonia\n+ Sensory ataxia (Romberg's positive)\n+ Absent deep tendon reflexes.\nIt is treated with parenteral vitamin B12 supplementation.", "questionPages": [558], "solutionPages": [569, 570], "questionFigures": ["crop-question-ch33-q10-1"], "solutionFigures": []}, {"id": "ch33-q11", "chapterId": 33, "chapter": "Helminthology - Cestodes & Trematodes", "number": 11, "text": "Which of the following organisms most commonly causes Katayama fever?", "options": [{"id": "A", "text": "Schistosoma haematobium"}, {"id": "B", "text": "Fasciola hepatica"}, {"id": "C", "text": "Schistosoma mansoni"}, {"id": "D", "text": "Clonorchis sinensis"}], "correctIndex": 2, "correctLetter": "C", "solution": "Among the given options, Katayama fever is most commonly caused by Schistosoma mansoni.\nIt is an immune complex mediated disease caused by antibodies to the schistosomulae, adult\nworms, and eggs. This acute illness consists of fever, abdominal pain, diarrhea, and allergic\nmanifestations.\nThe diagnosis is by the demonstration of the eggs in feces.\nPraziquantel is effective in the treatment. Glucocorticoids are given to suppress hypersensitivity\nreactions.\nInstances of Katayama fever are rarer in infections with Schistosoma haematobium compared to\nS. mansoni.\n*Note: Katayama fever is most commonly caused by S. japonicum and S. mansoni. But, among the\ngiven options, S. mansoni is the most common cause of Katayama fever.", "questionPages": [558, 559], "solutionPages": [570], "questionFigures": [], "solutionFigures": []}, {"id": "ch33-q12", "chapterId": 33, "chapter": "Helminthology - Cestodes & Trematodes", "number": 12, "text": "A 20-year-old male patient presents to the OPD with complaints of fever, intermittent\nabdominal pain, and burning micturition. He gives a history of swimming in a freshwater lake\n10 days back. Urine microscopy shows the following. Which of the following is the causative\nagent?", "options": [{"id": "A", "text": "Schistosoma hematobium"}, {"id": "B", "text": "Schistosoma mansoni"}, {"id": "C", "text": "Schistosoma japonicum"}, {"id": "D", "text": "Schistosoma species cannot be determined based on egg"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given clinical picture and image showing an egg that is non-operculated with the terminal\nspine at one pole are suggestive of infection with Schistosoma hematobium.\nSpecies differentiation of schistosoma can be done based on the location of the spine as follows:\n+ Terminal spine- Schistosoma hematobium\n+ Lateral spine- Schistosoma mansoni\n* Rudimentary lateral spine- Schistosoma japonicum\nThe image below shows egg of Schistosoma mansoni. Adult worms of S. mansoni live in\nthe inferior mesenteric vein.\n\n\n\nAdult worms of S. japonicum live in the superior mesenteric vein draining the ileocecal region.\nThey are also seen in the intrahepatic portal venules and hemorrhoidal plexus of veins.\nThe image below shows an egg of Schistosoma japonicum.\nAdult worms of S. hematobium live in the vesical and pelvic plexus of veins.\nThe below image shows the life cycle of S-hematobium:", "questionPages": [559], "solutionPages": [570, 571, 572], "questionFigures": ["crop-question-ch33-q12-1"], "solutionFigures": ["crop-solution-ch33-q12-1", "crop-solution-ch33-q12-2"]}, {"id": "ch33-q13", "chapterId": 33, "chapter": "Helminthology - Cestodes & Trematodes", "number": 13, "text": "A 50-year-old fisherman presented with complaints of blood in the urine. A diagnostic\ncystoscopy was done and the microscopic view of the biopsied specimen is given below.\nWhich of the following is most likely to be associated with this condition?", "options": [{"id": "A", "text": "Schistosoma hematobium"}, {"id": "B", "text": "Fasciolopsis buski"}, {"id": "C", "text": "Clonorchis sinensis"}, {"id": "D", "text": "Schistosoma mansoni"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given clinical scenario and the image showing keratin pearls are suggestive of squamous cell\ncarcinoma of the urinary bladder. It is associated with Schistosoma hematobium infection.\nChronic schistosomiasis presents as painless hematuria, dysuria, and proteinuria. Fibrosis may\ncause obstructive uropathies like hydronephrosis and hydroureter. It has been associated with\nsquamous cell carcinoma of the bladder. Such malignancy is detected in a younger age group as\ncompared to transitional cell carcinoma of the bladder.\nThe following parasites cause malignancies:\n+ Schistosoma hematobium- bladder carcinoma\n* Clonorchis sinensis and Opisthorchis viverrini- bile duct carcinoma", "questionPages": [559, 560], "solutionPages": [572], "questionFigures": ["crop-question-ch33-q13-1"], "solutionFigures": []}, {"id": "ch33-q14", "chapterId": 33, "chapter": "Helminthology - Cestodes & Trematodes", "number": 14, "text": "Identify the parasite from the given life cycle.", "options": [{"id": "A", "text": "Fasciola hepatica"}, {"id": "B", "text": "Fasciolopsis buski"}, {"id": "C", "text": "Pargaonimus westermani"}, {"id": "D", "text": "Clonorchis sinensus"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given life cycle belongs to Fasciola hepatica.\nFasciola hepatica (sheep liver fluke) causes disease primarily in sheep and other domestic\nanimals.\nHumans are infected by eating watercress (or other aquatic plants) contaminated by larvae\n(metacercariae) that excyst in the duodenum, penetrate the gut wall, and reach the liver, where\nthey mature into adults.\nThe adult flukes in the bile ducts produce eggs, which are excreted in the feces. The eggs hatch in\nfreshwater and miracidia enter the snails. Miracidia develop into cercariae, which then encyst on\naquatic vegetation. Sheep and humans eat the plants, thus completing the life cycle.\n\n\n\nMost infections are asymptomatic. Halzoun is a painful pharyngitis caused by the presence of\nadult flukes on the posterior pharyngeal wall after eating raw sheep liver. Obstructive jaundice can\noccur months or years later.\nDiagnosis is made by identification of the eggs in the feces.", "questionPages": [560, 561], "solutionPages": [572, 573], "questionFigures": ["crop-question-ch33-q14-1"], "solutionFigures": []}, {"id": "ch33-q15", "chapterId": 33, "chapter": "Helminthology - Cestodes & Trematodes", "number": 15, "text": "Which of the following organisms does the given life cycle belong to?", "options": [{"id": "A", "text": "Diphyllobothrium latum"}, {"id": "B", "text": "Paragonimus westermani"}, {"id": "C", "text": "Fasciola hepatica"}, {"id": "D", "text": "Clonorchis sinensis"}], "correctIndex": 3, "correctLetter": "D", "solution": "The given life cycle belongs to Clonorchis sinensis. It causes clonorchiasis (Asian liver fluke\ninfection).\nThe hosts for Clonorchis sinensis are:\n* Definitive host- humans\n+ First intermediate host- snail\n* Second intermediate host- fish\nHumans are infected by eating raw or undercooked fish containing the encysted larvae\n(metacercariae). In the duodenum, metacercaria will undergo excystation and migrate to bile\nducts to develop into adult worms. The eggs containing miracidia are excreted in human feces\nwhich are then ingested by snails. Miracidium hatches out in the midgut of the snail. Inside the\nsnail, sporocyst develops into 1st and 2nd generation redia and then to cercariae. The cercariae\nnow penetrate the fish and develop into metacercaria (infective form).\nChronic clonorchiasis is strongly associated with cholangiocarcinoma.", "questionPages": [561], "solutionPages": [573], "questionFigures": ["crop-question-ch33-q15-1"], "solutionFigures": []}, {"id": "ch33-q16", "chapterId": 33, "chapter": "Helminthology - Cestodes & Trematodes", "number": 16, "text": "A wet mount examination of the stool sample of a patient with abdominal pain and diarrhea\nis given below. Which of the following parasites is he likely infected with?", "options": [{"id": "A", "text": "Fasciola hepatica"}, {"id": "B", "text": "Ancyclostoma duodenale"}, {"id": "C", "text": "Schistosoma japonicum"}, {"id": "D", "text": "Enterobius vermicularis"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given image showing an operculated egg (egg having a lid-like structure on its end) in the\nstool sample is suggestive of Fasciola hepatica infection.\nThe eggs of Fasciola hepatica are large, ovoid, operculated, and bile stained. They contain an\nimmature larva (miracidium) and do not float in the saturated salt solution.\nThe following are the parasites with operculated eggs:\n+ Fasciola hepatica\n+ Fasciolopsis buski\n+ Fasciola gigantica\n+ Paragonimus westermani\n* Opisthorchis felineus\n* Clonorchis sinensis\n* Gastrodiscoides hominis\n+* Diphyllobothrium latum\n\n\n\nEggs of Schistosoma japonicum, Enterobius vermicularis, and Ancylostoma duodenale are\nnon-operculated.", "questionPages": [561, 562], "solutionPages": [573, 574], "questionFigures": ["crop-question-ch33-q16-1"], "solutionFigures": []}, {"id": "ch33-q17", "chapterId": 33, "chapter": "Helminthology - Cestodes & Trematodes", "number": 17, "text": "A 23-year-old patient has a history of travel to China and the consumption of pickled crab. He\nnow complains of rusty sputum and cough. What is the most likely causative organism?", "options": [{"id": "A", "text": "Fasciola buski"}, {"id": "B", "text": "Fasciola hepatica"}, {"id": "C", "text": "Paragonimus westermani"}, {"id": "D", "text": "Schistosoma japonicum"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given clinical scenario is suggestive of infection with Paragonimus westermani.\nParagonimus westermani is a trematode. The transmission to humans occurs by eating raw or\nundercooked crab or crayfish containing metacercariae. The metacercariae excyst in the human\ngut and young worms migrate to the lungs, where they become encapsulated in lung tissue.\nThe patient complains of cough, chest pain, and hemoptysis. The viscous sputum is speckled with\ngolden-brown eggs.\nPraziquantel (25 mg/ kg TDS for 1-2 days) is the drug of choice.", "questionPages": [562, 563], "solutionPages": [574], "questionFigures": [], "solutionFigures": []}, {"id": "ch34-q1", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 1, "text": "Which of the following parasites is ovoviviparous?", "options": [{"id": "A", "text": "Enterobius vermicularis"}, {"id": "B", "text": "Trichuris trichiura"}, {"id": "C", "text": "Strongyloides stercoralis"}, {"id": "D", "text": "Trichinella spiralis"}], "correctIndex": 2, "correctLetter": "C", "solution": "Strongyloides stercoralis is an ovoviviparous parasite.\n\nNematodes are classified as follows:\n\n* Oviparous - lay eggs:\n\n* Unsegmented eggs: Ascaris lumbricoides, Trichuris trichuria\n\n* Segmented eggs: Ancylostoma duodenale, Necator americanus\n\n+ Eggs containing larva: Enterobius vermicularis\n\n+ Viviparous - produce larvae. e.g., Trichinella spiralis, Wuchereria bancrofti, Brugia malayi\n\n* Ovoviviparous — lay eggs containing fully formed larvae that hatch immediately. e.g.,\n\nStrongyloides stercoralis", "questionPages": [575], "solutionPages": [588], "questionFigures": [], "solutionFigures": []}, {"id": "ch34-q2", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 2, "text": "Identify the helminth from the life cycle given below.\nWotan ce\n@DPDx = ae", "options": [{"id": "A", "text": "Ancylostoma duodenale"}, {"id": "B", "text": "Strongyloides stercoralis"}, {"id": "C", "text": "Ascaris lumbricoides"}, {"id": "D", "text": "Enterobius vermicularis"}], "correctIndex": 1, "correctLetter": "B", "solution": "The image shows the life cycle of Strongyloides stercoralis.\nThe infective form of strongyloides is the filariform larva. Infection occurs through penetration of\nthe skin by larvae in the soil. Then, they migrate to the small intestine.\nThe larvae molt twice and become adult female worms in the small intestine. The eggs laid in the\nmucosa of the intestine hatch immediately releasing the rhabditiform larva (L1 stage). These\nrhabditiform larvae in the bowel can develop directly into filariform larvae that penetrate the\ncolonic wall or perianal skin and enter the circulation to repeat the migration. This establishes\nongoing internal reinfection.\nThe rhabditiform larva can be seen on microscopic examination of stool.", "questionPages": [575], "solutionPages": [588], "questionFigures": ["crop-question-ch34-q2-1"], "solutionFigures": []}, {"id": "ch34-q3", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 3, "text": "A 24-year-old patient presented with complaints of diarrhea, vomiting, and abdominal pain\nfor 1 week. The stool microscopy revealed the following. What is the appropriate treatment\nfor this condition?", "options": [{"id": "A", "text": "Ivermectin"}, {"id": "B", "text": "Tinidazole"}, {"id": "C", "text": "Albendazole"}, {"id": "D", "text": "Praziquantel"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given clinical scenario and the stool microscopy showing the rhabditiform larva of S.\nstercoralis are suggestive of strongyloidiasis. The most appropriate treatment for this condition\nwould be ivermectin.\nStrongyloidiasis is caused by Strongyloides stercoralis. It is generally a benign and asymptomatic\ncondition. In some cases, there may be cutaneous, pulmonary, and intestinal manifestations.", "questionPages": [575, 576], "solutionPages": [588], "questionFigures": ["crop-question-ch34-q3-1"], "solutionFigures": []}, {"id": "ch34-q4", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 4, "text": "An 8-year-old child was brought with complaints of perianal itching which is worse in the\nnight. The scotch tape method demonstrates eggs as shown in the image given below. What is\nthe most likely causative agent?", "options": [{"id": "A", "text": "Hookworm"}, {"id": "B", "text": "Whipworm"}, {"id": "C", "text": "Pinworm"}, {"id": "D", "text": "Roundworm"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given clinical scenario of perianal itching and the scotch tape microscopy showing the eggs\nare suggestive of infestation with pinworm (Enterobius vermicularis).\nThe eggs of pinworm are plano-convex in shape, colorless, non-bile stained, and float in the\nsaturated salt solution. Eggshell is double layered and relatively thick, though transparent.\nSince pinworms are not released in feces, the diagnosis cannot be made by conventional fecal ova\nand parasite tests. NIH swab method and the scotch tape method are used for the collection of\nspecimens.\nThe NIH swab (National Institutes of Health, USA) consists of a glass rod, at one end of which a\npiece of transparent cellophane is attached with a rubber band. The cellophane part is used for\nswabbing by rolling over the perianal area. It is returned to the test tube and sent to the\nlaboratory. The cellophane piece is detached, spread over a glass side, and examined\nmicroscopically.\nThe image given below shows the NIH swab.\n\n\n\nIn scotch tape method, the tape is firmly pressed against the anal margin, covering all sides. The\ntape is transferred to a glass slide with sticky side down. Then a drop of toluene is added for\nclearing and examined under the microscope.\nThe below image shows the life cycle of Enterobius vermicularis.\n\n\n\nMi Emvryonates egos\ninqeseed by bamnan\nGy @\na —\nin email intestine\n< _4\n\\se\\\n2 s\nA BS\nA. coos on peor en\nmature within 4 to @ hours orescum\n7 naman © Srenr ess\nstright to lay oops", "questionPages": [576, 577], "solutionPages": [588, 589, 590], "questionFigures": ["crop-question-ch34-q4-1"], "solutionFigures": ["crop-solution-ch34-q4-1"]}, {"id": "ch34-q5", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 5, "text": "Which of the following helminthic infections that is commonly transmitted by soil, is\ncharacterized byl the egg in stool as shown in the image below?", "options": [{"id": "A", "text": "Trichuris trichiura"}, {"id": "B", "text": "Ancyclostoma duodenale"}, {"id": "C", "text": "Necator americanus"}, {"id": "D", "text": "Ascaris lumbricoides"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given image shows the egg of Trichuris trichiura (whipworm).\nThe characteristic features of whipworm eggs are:\n+ Eggs are barrel-shaped in the middle with a projecting mucus plug at each pole containing an\nunsegmented ovum. The plugs are colorless.\n+ They float in the saturated salt solution.\n+ It has a triple shell, the outermost layer of which is stained brown.\nThey are commonly transmitted by soil. The eggs passed in the stool are\nunembryonated. Microscopic identification of the eggs in a stool specimen is diagnostic of\nwhipworm infection.\nIn moderate infections of 20 adult worms or less, the worms are confined to the caecum and\nascending colon. The symptoms include epigastric and lower abdominal pain, diarrhoea (rarely\nbloody), vomiting, flatulence and distention, weight loss, and increased blood and iron loss.\nIn heavy infections of 200 adult worms or more (trichuriasis dysentery syndrome), the worms are\nin the distal colon and rectum. The symptoms include bloody diarrhoea with profuse mucus,\nabdominal pain, tenesmus, weight loss leading to cachexia, severe anemia, and rectal prolapse. On\nexamination, clubbing may be present. Blood investigations may show moderate eosinophilia.\nChronic infection leads to growth retardation and nutritional deficiencies. Around 0.005 ml of\nblood is lost per day per worm. In heavy infections, as much as 4 to 5 ml can be lost per day per\nworm.\nTreatment is mebendazole or albendazole.", "questionPages": [577, 578], "solutionPages": [590], "questionFigures": ["crop-question-ch34-q5-1"], "solutionFigures": []}, {"id": "ch34-q6", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 6, "text": "A college student came to the OPD with fever and muscle aches. He tells you he had\nconsumed smoked pork at a party 2 weeks back. Following this, he had developed abdominal\ncramps and diarrhea which had resolved on their own. CBC revealed eosinophilia and the\nmuscle biopsy showed the following finding. What is the causative organism?", "options": [{"id": "A", "text": "Trichuris trichiura"}, {"id": "B", "text": "Trichinella spiralis"}, {"id": "C", "text": "Ascaris lumbricoides"}, {"id": "D", "text": "Enterobius vermicularis"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given clinical scenario and muscle biopsy showing larvae are suggestive of trichinellosis. It is\ncaused by Trichinella spiralis.\nTrichinella spiralis is known as the pork worm since the infection is acquired by consuming raw\nor undercooked pork. The initial infection presents with diarrhea and abdominal pain. In the later\nphase of the infection, the larvae move from the intestines into the circulation and migrate into\nmuscles where they are encysted. This causes symptoms like fever and myalgia.\nThese larvae are calcified in about 5-6 months. Eosinophilia caused by parasitic infection also\ncomes down after 6 months.\nDetection of spiral larva in muscle tissue is done by performing a muscle biopsy. Deltoid, biceps,\ngastrocnemius, or pectoralis muscles are usually selected for biopsy.\nOther parasites that can be demonstrated in a muscle biopsy are:\n*T. solium\n+ T. cruzi (amastigote)\nThe image below shows Trichinella spiralis larvae within the muscle.", "questionPages": [578], "solutionPages": [590, 591], "questionFigures": ["crop-question-ch34-q6-1"], "solutionFigures": ["crop-solution-ch34-q6-1"]}, {"id": "ch34-q7", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 7, "text": "In a patient with a positive Bachman intradermal test, which of the following infections will\nyou suspect?", "options": [{"id": "A", "text": "Schistosomiasis"}, {"id": "B", "text": "Kala-azar"}, {"id": "C", "text": "Hydatid disease"}, {"id": "D", "text": "Trichinellosis"}], "correctIndex": 3, "correctLetter": "D", "solution": "Bachman intradermal test is used for the diagnosis of trichinellosis.\nIn this test, 1:5,000 or 1:10,000 dilution of the trichinella larval antigen is injected intradermally.\nAn erythematous wheal appears in positive cases within 15-20 minutes. The test remains positive\nfor years after infection.", "questionPages": [578, 579], "solutionPages": [591], "questionFigures": [], "solutionFigures": []}, {"id": "ch34-q8", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 8, "text": "Identify the organism shown in this image.", "options": [{"id": "A", "text": "Strongyloides stercoralis"}, {"id": "B", "text": "Enterobius vermicularis"}, {"id": "C", "text": "Ancylostoma duodenale"}, {"id": "D", "text": "Ascaris lumbricoides"}], "correctIndex": 3, "correctLetter": "D", "solution": "The given image shows the Ascaris lumbricoides (roundworm). It is the most common of human\nhelminths and is distributed worldwide.\nAdult worms live in the small intestine (85% in the jejunum and 15% in the ileum). The\nroundworm, Ascaris lumbricoides is the largest nematode parasite in the human intestine.\nThe adult worms are large cylindrical worms, with tapering ends, the anterior end being more\npointed than the posterior.\nMan is the natural host. There is no intermediate host.\nInfection occurs through food or water contaminated with nightsoil or human feces containing\neggs of ascaris. The eggs contain the infective rhabditiform larva.", "questionPages": [579], "solutionPages": [591, 592], "questionFigures": ["crop-question-ch34-q8-1"], "solutionFigures": []}, {"id": "ch34-q9", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 9, "text": "A 9- year-old boy was brought to the casualty with fever and colicky abdominal pain. An erect\nX-ray abdomen showed multiple air-fluid levels. Stoo] examination revealed the following\negg. Which of the following is false about the organism causing this condition?", "options": [{"id": "A", "text": "Human is the only host"}, {"id": "B", "text": "Can cause pancreatitis"}, {"id": "C", "text": "Can cause Loeffler's syndrome"}, {"id": "D", "text": "Egg containing L1 larva is infective"}], "correctIndex": 3, "correctLetter": "D", "solution": "The given clinical scenario and the image are suggestive of ascariasis caused by Ascaris\nlumbricoides. Embryonated egg containing the L3 larva is the infective form.\nMan is the only natural host. There is no intermediate host. The infection is acquired via the\nconsumption of food or water contaminated with eggs. The eggs hatch after reaching the\nduodenum to release the larvae. These penetrate the intestinal mucosa and enter the portal\nvessels. From the liver, larvae reach the systemic circulation, lungs and then reach the small\nintestine to produce symptoms.\nClinical features:\nDue to the migrating larvae:\n° Fever\n* Dry cough\n¢ Asthmatic wheezing\n+ Loeffler's syndrome\nDue to the adult worm:\n+ Asymptomatic\n* Nutritional effects - protein-energy malnutrition, Vitamin A deficiency\n* Toxic effects - urticaria, angioedema due to hypersensitivity\n* Mechanical effects - colicky abdominal pain, volvulus, and intestinal obstruction\n+ Ectopic ascariasis - acute biliary obstruction, pancreatitis, and obstructive appendicitis.\nThe life cycle of Ascaris lumbricoides is given below.", "questionPages": [579, 580], "solutionPages": [592, 593], "questionFigures": ["crop-question-ch34-q9-1"], "solutionFigures": ["crop-solution-ch34-q9-1"]}, {"id": "ch34-q10", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 10, "text": "What is the most common cause for visceral larva migrans?", "options": [{"id": "A", "text": "Toxocara canis"}, {"id": "B", "text": "Ancylostoma braziliense"}, {"id": "C", "text": "Ascaris lumbricoides"}, {"id": "D", "text": "Strongyloides stercoralis"}], "correctIndex": 0, "correctLetter": "A", "solution": "The most common cause for visceral larva migrans is Toxocara canis. It occurs most commonly in\nchildren and presents as fever, hepatosplenomegaly, and pneumonitis.\nLarva migrans is generally seen when human infection occurs with nonhuman species of\nnematodes. It can be classified into cutaneous or visceral types, depending on whether the larval\nmigration takes place in the skin or in deeper tissues.\nVisceral larva migrans is caused by the migration of nematode larvae that are acquired via the oral\nroute. Cutaneous larva migrans is caused by the migration of nematode larvae (most\ncommonly Ancylostoma braziliense) that are acquired via skin penetration.\nPatients having visceral larva migrans may develop neurological disturbances (neural larva\nmigrans) and endophthalmitis (ophthalmic larva migrans).\nDifferences between cutaneous larva migrans and visceral larva migrans:", "questionPages": [580], "solutionPages": [593, 594], "questionFigures": [], "solutionFigures": ["crop-solution-ch34-q10-1"]}, {"id": "ch34-q11", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 11, "text": "A middle-aged woman comes to the OPD with complaints of weakness for the past 3 months.\nShe is diagnosed to have microcytic hypochromic anemia. The stool microscopy reveals the\nfollowing. What is the most probable causative agent?", "options": [{"id": "A", "text": "Ancylostoma duodenale"}, {"id": "B", "text": "Strongyloides stercoralis"}, {"id": "C", "text": "Enterobius vermicularis"}, {"id": "D", "text": "Ascaris lumbricoides"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given clinical scenario of iron deficiency anemia and the stool microscopy showing the egg is\nsuggestive of infection by Ancylostoma duodenale.\nEggs of both Ancylostoma duodenale (old world hookworm) and Necator americanus (new world\nhookworm) are identical.\nThe hookworm eggs are oval or elliptical in shape, colorless, and non-bile stained. It has a thin\ntransparent hyaline shell membrane. The ovum is segmented with 4 to 8 blastomeres. There is a\nclear space between the segmented ovum and eggshell. Eggs float in the saturated salt solution.\nHumans are infected when filariform larvae in moist soil penetrate the skin or subcutaneous\ntissue. The larvae are then carried in the venous circulation to the heart and lungs, where they\nmay cause mild transient pneumonitis or bronchitis. They migrate up the respiratory tract to the\npharynx, are swallowed, and reach the small intestine producing epigastric pain, dyspepsia,\nnausea, vomiting, and diarrhea.\nA. duodenale or N. americanus ingest blood, secrete anticoagulants, and interfere with the\nabsorption of iron, B12, and folic acid. This leads to iron deficiency anemia and protein-energy\nmalnutrition resulting from blood loss.\nThe average blood loss of the host per worm per day is 0.2 mL with Ancylostoma duodenale\nand 0.03 mL with Necator americanus.", "questionPages": [580, 581], "solutionPages": [594], "questionFigures": ["crop-question-ch34-q11-1"], "solutionFigures": []}, {"id": "ch34-q12", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 12, "text": "A patient presented to the OPD with dry cough, low-grade fever and wheezing. He is\ndiagnosed with Loeffler’s syndrome. Which of the following parasites does not cause this?", "options": [{"id": "A", "text": "Ascaris lumbricoides"}, {"id": "B", "text": "Necator americanus"}, {"id": "C", "text": "Strongyloides stercoralis"}, {"id": "D", "text": "Enterobius vermicularis"}], "correctIndex": 3, "correctLetter": "D", "solution": "Loeffler's syndrome is an eosinophilic inflammation of the lung caused by Ascaris\nlumbricoides, Strongyloides stercoralis and Necator americanus. Enterobius vermicularis does not\ncause Loeffler’s syndrome.\nIt is associated with pneumonia characterized by dry cough, low-grade fever, wheezing, urticaria,\nand eosinophilia.\nParasites causing Loeffler’s syndrome are:\n* Migrating larva of:\n+ Ascaris lumbricoides\n+ Strongyloides stercoralis\n+ Ancylostoma duodenale\n+ Necator americanus\n* Echinococcus granulosus\n* Cryptosporidium parvum\n+ Eggs of Paragonimus westermani\n+ Entamoeba histolytica\n* Trichomonas tenax", "questionPages": [581], "solutionPages": [594, 595], "questionFigures": [], "solutionFigures": []}, {"id": "ch34-q13", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 13, "text": "A 27-year-old woman had gone on a trek in the Amazon rainforest. A month later she\npresented to the OPD with the following lesion which was painful and pruritic. Her systemic\nexamination was normal. Which of the following organisms is most likely to cause this\ncondition?", "options": [{"id": "A", "text": "Strongyloides stercoralis"}, {"id": "B", "text": "Ancylostoma braziliense"}, {"id": "C", "text": "Toxocara canis"}, {"id": "D", "text": "Necator americanus"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given clinical scenario and the image showing serpiginous skin lesions are suggestive of\ncutaneous larva migrans or creeping eruption or ground itch. This is most commonly caused\nby Ancylostoma braziliense.\nCutaneous larva migrans is caused by non-human hookworms like Ancylostoma braziliense and\nAncylostoma caninum. It is acquired via direct skin contact with soil contaminated by dog or\ncat feces. The larvae remain confined to the outer layers of skin, as they are unable to penetrate\nthe basement membrane of the human skin.\nIt presents as erythematous, pruritic papules at the site of entry and serpiginous tracks in the\nepidermis. The symptoms begin to appear within the first two weeks of the patient’s return from a\ntropical or endemic country. The larval track progresses at approximately 1 cm/h with cutaneous\nlesions only progressing a few millimeters to a few centimeters daily.\nDiagnosis is based mainly on clinical features.\nThe treatment includes:\n* Thiabendazole topical application\n+ Albendazole 40omg/day X 3 days or\n+ Ivermectin 200mcg/kg single dose stat\nThe differences between cutaneous larva migrans and visceral larva migrans are:\nNote: A rapidly moving lesion (10cm/hr) produced by Strongyloides stercoralis is known as larva\ncurrens (running larva). It occurs as an otherwise asymptomatic lesion\nin immunocompetent individuals. In immunocompromised, hyper-infestation syndrome occurs\nwith paralytic ileus and secondary Gram-negative sepsis.", "questionPages": [581, 582], "solutionPages": [595], "questionFigures": ["crop-question-ch34-q13-1"], "solutionFigures": ["crop-solution-ch34-q13-1"]}, {"id": "ch34-q14", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 14, "text": "Which the following filarial worms are non-pathogenic to humans?", "options": [{"id": "A", "text": "Onchocerca volvulus"}, {"id": "B", "text": "Brugia malayi"}, {"id": "C", "text": "Wuchereria bancrofti"}, {"id": "D", "text": "Mansonella ozzardi"}], "correctIndex": 3, "correctLetter": "D", "solution": "Mansonella ozzardi is generally non-pathogenic to humans.\n\n\n\nOption A: Onchocerca volvulus infection may manifest as skin nodules or onchocercoma which\nare formed as a result of fibroblastic reaction around adult worms deep in the subcutaneous\ntissues. Microfilariae cause lesions in the skin and eyes.\nOptions B and C: In lymphatic filariasis (Wuchereria and Brugia), the typical manifestations are\ncaused by the adult worms blocking lymph nodes and vessels. Microfilaria (larval form) are\nresponsible for allergic manifestations seen in occult filariasis.", "questionPages": [582], "solutionPages": [595, 596], "questionFigures": [], "solutionFigures": []}, {"id": "ch34-q15", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 15, "text": "A 55-year-old man came to the hospital with complaints of progressive swelling of his legs.\nOn examination, you note bilateral non-pitting edema of the lower limbs with thickening of\nthe overlying skin. What is the best next step in the management of this patient?", "options": [{"id": "A", "text": "PCR"}, {"id": "B", "text": "Lymphoscintigraphy"}, {"id": "C", "text": "Night blood test for worms"}, {"id": "D", "text": "Lymphangiography"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given clinical picture is suggestive of lymphatic filariasis (elephantiasis). The best next step\nwould be to test the night blood for worms since the filarial species is nocturnally periodic\n(between 10 pm and 4 am) in India.\nLymphatic filariasis is caused by Wuchereria bancrofti and Brugia malayi.\nElephantiasis is a delayed sequel to repeated lymphangitis, obstruction, and lymphedema.\nRepeated leakage of lymph into tissues first results in lymphedema, then to elephantiasis.\nDiethylcarbamazine is the drug of choice.\nOption A: PCR is negative in chronic filariasis.\nOptions B & D: Lymphangiography and lymphoscintigraphy may be used to demonstrate\nabnormal lymphatic urinary fistula leading to chyluria in chronic filariasis.", "questionPages": [582, 583], "solutionPages": [596], "questionFigures": ["crop-question-ch34-q15-1"], "solutionFigures": []}, {"id": "ch34-q16", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 16, "text": "A child from Bihar is brought to the AIIMS ER with a high-grade fever. On examination,\nbilaterally enlarged, tender inguinal lymph nodes are present. The peripheral smear\nexamination finding is shown in the image. What is the most likely causative organism?", "options": [{"id": "A", "text": "Wuchereria bancrofti"}, {"id": "B", "text": "Brugia malayi"}, {"id": "C", "text": "Loa loa"}, {"id": "D", "text": "Onchocerca volvulus"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given clinical scenario and the peripheral smear showing sheathed microfilaria with two\nnuclei at the tail tip is suggestive of infection with Brugia malayi.\nAcute infection may manifest as acute adenolymphangitis which is characterized by high fever,\nlymphatic inflammation (lymphangitis and lymphadenitis) and transient local edema. The\nmost commonly affected lymph nodes are inguinal nodes followed by axillary nodes which\nbecome enlarged, painful and tender.\nThe following are the characteristic features of microfilaria of Brugia malayi:\n+ Smaller in size compared to microfilaria of W. bancrofti.\n* Shows kinks and secondary curves.\n* Cephalic space is longer.\n* Carries double stylets at the anterior end.\n* Nuclear column appears blurred in Giemsa-stained films.\n+ Tail tip carries 2 distinct nuclei, one terminal and the other subterminal.\nThe below image shows the microfilaria of Brugia malayi.", "questionPages": [583, 584], "solutionPages": [596, 597], "questionFigures": ["crop-question-ch34-q16-1"], "solutionFigures": ["crop-solution-ch34-q16-1"]}, {"id": "ch34-q17", "chapterId": 34, "chapter": "Helminthology - Nematodes", "number": 17, "text": "A patient from Kerala has presented to your OPD with fever. A magnified view of peripheral\nblood smear is shown below. Which of the following is false regarding the organism seen?", "options": [{"id": "A", "text": "DEC provocation test is used to demonstrate microfilaria during the day"}, {"id": "B", "text": "Second stage filariform larva is the infective form"}, {"id": "C", "text": "Microfilaria is the major diagnostic form"}, {"id": "D", "text": "Filarial stage of adult worms are responsible for disease"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given clinical scenario with a peripheral smear showing sheathed microfilaria with a pointed\ntail free of nuclei is suggestive of Wuchereria bancrofti. The third stage filariform larva is the\ninfective form.\nWuchereria bancrofti infection is usually asymptomatic. The symptoms are due to obstruction of\nlymphatics by the filarial stage of adult worms.\nThe lymphatic vessels of the male genitalia are most commonly affected in bancroftian filariasis,\nproducing episodic funiculitis, epididymitis, and orchitis. Adenolymphangitis of the extremities is\nless common.\nHydrocele is the most common sign of chronic bancroftian filariasis, followed by lymphedema,\nelephantiasis, and chyluria. The swelling involves the whole leg, the whole arm, the scrotum, the\nvulva, or the breast.\nDEC provocation test is used to demonstrate microfilaria during the day.\nThe image below shows the life cycle of Wuchereria bancrofti.\n\n\n\nThe image below shows the difference between microfilaria of various filarial nematodes.", "questionPages": [584], "solutionPages": [597, 598], "questionFigures": ["crop-question-ch34-q17-1"], "solutionFigures

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microbiology M8 Qbank Quiz</title>
<style>
:root {
  --primary:#6366f1;
  --primary-dark:#4f46e5;
  --success:#22c55e;
  --error:#ef4444;
  --warning:#f59e0b;
  --bg:#fafafa;
  --surface:#ffffff;
  --text:#1f2937;
  --text-muted:#6b7280;
  --border:#e5e7eb;
  --shadow:0 4px 6px -1px rgba(0,0,0,.10);
  --shadow-lg:0 20px 25px -5px rgba(0,0,0,.10);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  line-height:1.6;
}
button, select { font:inherit; }
button { color:inherit; }
.hidden { display:none !important; }
.setup-screen {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.setup-card {
  background:var(--surface);
  border-radius:24px;
  padding:48px;
  max-width:760px;
  width:100%;
  box-shadow:var(--shadow-lg);
  text-align:center;
}
.setup-card h1 {
  font-size:2rem;
  margin-bottom:8px;
  font-weight:700;
  letter-spacing:0;
}
.subtitle {
  color:var(--text-muted);
  margin-bottom:32px;
}
.setup-stats {
  display:flex;
  justify-content:center;
  gap:40px;
  margin-bottom:32px;
  padding:20px;
  background:var(--bg);
  border-radius:16px;
}
.setup-stat { text-align:center; }
.setup-stat-value {
  font-size:1.75rem;
  font-weight:700;
  color:var(--primary);
}
.setup-stat-label {
  font-size:.8rem;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:.5px;
}
.form-group {
  text-align:left;
  margin-bottom:24px;
}
.form-label {
  display:block;
  font-weight:600;
  margin-bottom:8px;
  font-size:.95rem;
}
.form-help {
  font-size:.85rem;
  color:var(--text-muted);
  margin-bottom:12px;
}
.category-select {
  width:100%;
  padding:12px 16px;
  border:2px solid var(--border);
  border-radius:12px;
  font-size:1rem;
  background:var(--surface);
  cursor:pointer;
}
.category-select:focus {
  outline:none;
  border-color:var(--primary);
}
.category-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(156px,1fr));
  gap:12px;
  max-height:360px;
  overflow-y:auto;
  padding:4px;
}
.category-card {
  width:100%;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:16px 12px;
  background:var(--bg);
  border:2px solid var(--border);
  border-radius:14px;
  cursor:pointer;
  text-align:center;
  transition:all .2s;
  min-height:126px;
}
.category-card:hover {
  border-color:var(--primary);
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}
.category-card.active {
  background:var(--primary);
  border-color:var(--primary);
  color:#fff;
}
.chapter-number {
  width:100%;
  font-size:.72rem;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-bottom:7px;
}
.category-card.active .chapter-number,
.category-card.active .category-count { color:rgba(255,255,255,.82); }
.category-name {
  width:100%;
  max-width:100%;
  min-width:0;
  font-size:.9rem;
  font-weight:700;
  line-height:1.25;
  margin-bottom:6px;
  overflow-wrap:anywhere;
  word-break:break-word;
  hyphens:auto;
}
.category-count {
  width:100%;
  font-size:.72rem;
  color:var(--text-muted);
}
.start-btn {
  width:100%;
  padding:16px;
  background:var(--primary);
  color:#fff;
  border:0;
  border-radius:12px;
  font-size:1.1rem;
  font-weight:600;
  cursor:pointer;
  transition:all .2s;
  margin-top:8px;
}
.start-btn:hover { background:var(--primary-dark); transform:translateY(-1px); }
.quiz-screen {
  max-width:95%;
  margin:0 auto;
  padding:20px;
}
.quiz-screen.active { display:block; }
.top-bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
  flex-wrap:wrap;
  gap:12px;
}
.quiz-info {
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}
.category-badge {
  padding:6px 14px;
  background:var(--primary);
  color:#fff;
  border-radius:20px;
  font-size:.85rem;
  font-weight:600;
  max-width:520px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.question-counter {
  color:var(--text-muted);
  font-size:.9rem;
}
.quit-btn {
  padding:8px 16px;
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:8px;
  cursor:pointer;
  font-size:.9rem;
  transition:all .2s;
}
.quit-btn:hover { background:var(--error); color:#fff; border-color:var(--error); }
.progress-container { margin-bottom:24px; }
.progress-bar {
  height:8px;
  background:var(--border);
  border-radius:4px;
  overflow:hidden;
}
.progress-fill {
  height:100%;
  width:0;
  background:var(--primary);
  border-radius:4px;
  transition:width .3s ease;
}
.progress-text {
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:8px;
  font-size:.85rem;
  color:var(--text-muted);
}
.question-card {
  background:var(--surface);
  border-radius:20px;
  padding:32px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}
.question-header {
  display:flex;
  gap:8px;
  margin-bottom:20px;
  flex-wrap:wrap;
  align-items:center;
}
.tag {
  padding:4px 10px;
  border-radius:6px;
  font-size:.7rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0;
}
.tag.exam { background:#ede9fe; color:#5b21b6; }
.tag.pyq { background:#fef3c7; color:#92400e; }
.source-btn {
  margin-left:auto;
  padding:7px 12px;
}
.question-title {
  font-size:1rem;
  color:var(--text-muted);
  margin-bottom:10px;
  font-weight:600;
}
.question-text {
  white-space:pre-wrap;
  font-size:1.3rem;
  line-height:1.7;
  margin-bottom:28px;
  font-weight:500;
}
.question-figure-grid {
  display:grid;
  gap:14px;
  margin:0 0 28px;
  text-align:center;
}
.question-figure-img {
  width:auto;
  max-width:min(100%, 860px);
  height:auto;
  object-fit:contain;
  justify-self:center;
  border-radius:12px;
  border:1px solid var(--border);
  background:#fff;
}
.options {
  display:flex;
  flex-direction:column;
  gap:12px;
}
.option {
  width:100%;
  display:flex;
  align-items:center;
  padding:18px 20px;
  background:var(--bg);
  border:2px solid transparent;
  border-radius:14px;
  cursor:pointer;
  transition:all .15s;
  text-align:left;
}
.option:hover {
  border-color:var(--primary);
  background:#f5f3ff;
}
.option.selected {
  border-color:var(--primary);
  background:#ede9fe;
}
.option.correct {
  border-color:var(--success);
  background:#f0fdf4;
}
.option.wrong {
  border-color:var(--error);
  background:#fef2f2;
}
.option-letter {
  width:40px;
  height:40px;
  border-radius:10px;
  background:var(--surface);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  margin-right:16px;
  flex-shrink:0;
  border:2px solid var(--border);
  font-size:1rem;
}
.option.selected .option-letter {
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}
.option.correct .option-letter {
  background:var(--success);
  color:#fff;
  border-color:var(--success);
}
.option.wrong .option-letter {
  background:var(--error);
  color:#fff;
  border-color:var(--error);
}
.option-text {
  font-size:1.05rem;
  flex:1;
}
.controls {
  display:flex;
  gap:12px;
  margin-top:24px;
}
.btn {
  padding:14px 28px;
  border-radius:12px;
  border:0;
  font-size:1rem;
  font-weight:600;
  cursor:pointer;
  transition:all .2s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.btn:disabled { opacity:.4; cursor:not-allowed; }
.btn-primary {
  background:var(--primary);
  color:#fff;
  flex:1;
}
.btn-primary:hover:not(:disabled) { background:var(--primary-dark); }
.btn-secondary {
  background:var(--surface);
  color:var(--text);
  border:2px solid var(--border);
}
.btn-secondary:hover:not(:disabled) { border-color:var(--primary); }
.explanation {
  background:linear-gradient(135deg,#ede9fe 0%,#f5f3ff 100%);
  border:1px solid var(--primary);
  border-radius:14px;
  padding:24px;
  margin-top:24px;
  display:none;
}
.explanation.show { display:block; animation:fadeIn .3s ease; }
.explanation-header {
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
  color:var(--primary);
  font-weight:700;
  font-size:1.1rem;
}
.status {
  margin-bottom:14px;
  padding:12px 14px;
  border-radius:10px;
  font-weight:800;
}
.status.ok { color:#166534; background:#dcfce7; border:1px solid #86efac; }
.status.bad { color:#991b1b; background:#fee2e2; border:1px solid #fca5a5; }
.status.warn { color:#92400e; background:#fef3c7; border:1px solid #fcd34d; }
.solution-body {
  line-height:1.8;
  color:var(--text);
  font-size:1rem;
}
.solution-body p { margin:10px 0; }
.solution-body ul { margin:10px 0 14px 1.25rem; padding:0; }
.solution-body li { margin:6px 0; padding-left:4px; }
.solution-body .ocr-muted { color:var(--text-muted); font-size:.95rem; }
.solution-source {
  margin-top:18px;
  border-top:1px solid rgba(99,102,241,.24);
  padding-top:16px;
}
.solution-source h3 {
  margin:0 0 10px;
  font-size:1rem;
  color:var(--primary);
}
.solution-figure-grid {
  display:grid;
  gap:14px;
}
.solution-figure-img {
  width:auto;
  max-width:min(100%, 860px);
  height:auto;
  object-fit:contain;
  justify-self:center;
  border-radius:12px;
  border:1px solid var(--border);
  background:#fff;
}
.pages {
  margin-top:18px;
  display:grid;
  gap:12px;
}
.page-img {
  width:100%;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
  box-shadow:var(--shadow);
}
.quick-nav {
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:4px;
  margin-top:20px;
}
.quick-nav-item {
  width:36px;
  height:36px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.8rem;
  font-weight:700;
  cursor:pointer;
  border:2px solid var(--border);
  background:var(--surface);
  flex-shrink:0;
}
.quick-nav-item:hover { border-color:var(--primary); }
.quick-nav-item.current { border-color:var(--primary); box-shadow:0 0 0 2px rgba(99,102,241,.2); }
.quick-nav-item.answered { background:var(--primary); color:#fff; border-color:var(--primary); }
.quick-nav-item.correct { background:var(--success); color:#fff; border-color:var(--success); }
.quick-nav-item.wrong { background:var(--error); color:#fff; border-color:var(--error); }
@keyframes fadeIn {
  from { opacity:0; transform:translateY(8px); }
  to { opacity:1; transform:translateY(0); }
}
@media (max-width:640px) {
  .setup-card { padding:32px 24px; }
  .setup-card h1 { font-size:1.5rem; }
  .setup-stats { gap:20px; }
  .category-grid { grid-template-columns:repeat(auto-fit,minmax(138px,1fr)); max-height:300px; }
  .category-card { min-height:120px; padding:14px 10px; }
  .category-name { font-size:.84rem; }
  .quiz-screen { padding:14px; }
  .category-badge { max-width:100%; }
  .question-card { padding:24px; }
  .question-text { font-size:1.1rem; }
  .option { padding:14px 16px; }
  .option-letter { width:32px; height:32px; font-size:.9rem; margin-right:12px; }
  .controls { flex-direction:column; }
  .btn { width:100%; }
  .source-btn { margin-left:0; }
}

/* Mobile-friendly enhancements */
html { -webkit-text-size-adjust: 100%; }
body { overflow-x: hidden; }
img, video, canvas, svg { max-width: 100%; height: auto; }
button, select, input, textarea { max-width: 100%; }
@media (max-width: 768px) {
 body { font-size: 16px; }
 .setup-screen { padding: 12px; align-items: flex-start; }
 .setup-card { padding: 24px 16px; margin: 12px auto; border-radius: 16px; }
 .setup-card h1 { font-size: 1.55rem; }
 button, select { min-height: 42px; }
 .container, .quiz-container, .main-container, .question-container { width: 100% !important; max-width: 100% !important; padding-left: 12px !important; padding-right: 12px !important; }
 table { display: block; max-width: 100%; overflow-x: auto; }
 pre, code { overflow-wrap: anywhere; white-space: pre-wrap; }
}
</style>
</head>

23}, {"id": 23, "title": "Hepatitis", "start": 373, "end": 389, "count": 23}, {"id": 24, "title": "HIV", "start": 390, "end": 398, "count": 11}, {"id": 25, "title": "Myxoviruses and Rhabdoviruses", "start": 399, "end": 415, "count": 17}, {"id": 26, "title": "Arboviruses and Picorna Viruses", "start": 416, "end": 431, "count": 19}, {"id": 27, "title": "Miscellaneous Viruses - Rubella, Coronaviruses, Prions, Rotavirus, Filovirus, Zika Virus and Nipah Virus", "start": 432, "end": 446, "count": 17}, {"id": 28, "title": "Superficial and Systemic Mycoses", "start": 447, "end": 472, "count": 20}, {"id": 29, "title": "Opportunistic Mycoses", "start": 473, "end": 488, "count": 14}, {"id": 30, "title": "General Parasitology", "start": 489, "end": 504, "count": 17}, {"id": 31, "title": "Protozoology - Amoebae, Ciliates & Flagellates", "start": 505, "end": 534, "count": 23}, {"id": 32, "title": "Protozoology - Sporozoa", "start": 535, "end": 552, "count": 14}, {"id": 33, "title": "Helminthology - Cestodes & Trematodes", "start": 553, "end": 574, "count": 17}, {"id": 34, "title": "Helminthology - Nematodes", "start": 575, "end": 601, "count": 22}, {"id": 35, "title": "Applied Microbiology", "start": 602, "end": 615, "count": 15}], "questions": [{"id": "ch1-q1", "chapterId": 1, "chapter": "General Microbiology", "number": 1, "text": "Identify the condenser in the following image.", "options": [{"id": "A", "text": "Above the stage"}, {"id": "B", "text": "Below the stage"}, {"id": "C", "text": "Near the eyepiece"}, {"id": "D", "text": "Above the objective lenses"}], "correctIndex": 1, "correctLetter": "B", "solution": "This is a modern compound microscope, and the condenser is located below the stage.\nThe purpose of the condenser lens is to focus the light from the illuminator onto the specimen.\nMicroscopes with a stage condenser lens render a sharper image than those with no condenser\nlens.\nThe simple microscope was invented first by Antonie van Leeuwenhoek, the father of microscopy\nand microbiology. It uses 1 lens for magnification. The compound microscope, introduced by\nHans and Zacharias Janssen uses 2 lenses, an objective lens and an eyepiece, to provide better\nmagnification power than the simple microscope.", "questionPages": [4], "solutionPages": [], "questionFigures": ["crop-question-ch1-q1-1"], "solutionFigures": ["crop-solution-ch1-q1-1"]}, {"id": "ch1-q2", "chapterId": 1, "chapter": "General Microbiology", "number": 2, "text": "A 28-year-old sex worker presented with a painless ulcer on her vulva. On examination,\ninguinal lymphadenopathy is present. Which of the following methods has been used to\ndemonstrate the causative agent as per the given image?", "options": [{"id": "A", "text": "Dark-field microscopy"}, {"id": "B", "text": "Phase contrast microscopy"}, {"id": "C", "text": "Fluorescent microscopy"}, {"id": "D", "text": "Electron microscopy"}], "correctIndex": 0, "correctLetter": "A", "solution": "A painless genital ulcer with inguinal lymphadenopathy with the presence of spiral organisms on\nmicroscopy is suggestive of syphilis. It is caused by Treponema pallidum, demonstrated\nby dark-field microscopy.\nDark-field microscopy images have a dark background with a refractile organism. The dark\nground microscope has an optical system that enhances the contrast of unstained bodies. It uses\nreflected light and has a higher resolving power than the light microscope. Dark-field microscopy\nis the the most specific and sensitive technique to visualize Treponema pallidum when an active\nchancre or condyloma lata is present.\nOther options:\nOption B: Phase contrast microscopy improves the contrast to delineate structures within cells. A\ndark image is formed on a light background.\nOption C: Fluorescent microscopy uses fluorescent dyes like auramine-rhodamine to appreciate\nMycobacterial species and malarial parasites.\nOption D: The electron microscope, invented by Ernst Ruska, helps in appreciating viral\nstructures. It has a very high resolving power.", "questionPages": [4, 5], "solutionPages": [16], "questionFigures": ["crop-question-ch1-q2-1"], "solutionFigures": []}, {"id": "ch1-q3", "chapterId": 1, "chapter": "General Microbiology", "number": 3, "text": "Which among the following statements is false?", "options": [{"id": "A", "text": "Muramic acid is present in prokaryotes"}, {"id": "B", "text": "Mitotic division is present in eukaryotes"}, {"id": "C", "text": "80S ribosome is present in prokaryotes"}, {"id": "D", "text": "Multiple linear chromosomes present in eukaryotes"}], "correctIndex": 2, "correctLetter": "C", "solution": "80S ribosome is present in eukaryotes, while 70S ribosome is present in prokaryotes.\n80S ribosome has subunits 60S and 40S, while 70S has subunits 50S and 30S.", "questionPages": [5], "solutionPages": [16], "questionFigures": [], "solutionFigures": ["crop-solution-ch1-q3-1"]}, {"id": "ch1-q4", "chapterId": 1, "chapter": "General Microbiology", "number": 4, "text": "Which of the following methods will not help you visualize the bacterial cell wall?", "options": [{"id": "A", "text": "Fluorescence microscopy"}, {"id": "B", "text": "Electron microscopy"}, {"id": "C", "text": "Differential staining"}, {"id": "D", "text": "Simple staining"}], "correctIndex": 3, "correctLetter": "D", "solution": "The cell wall of bacteria cannot be seen with simple stains or direct light microscopy.\n\n\n\nThe bacterial cell wall is present outside the plasma membrane and confers strength and shape to\nthe cell. It is composed of peptidoglycans. The cell wall can be demonstrated by the following\nmethods:\n+ Plasmolysis\n* Microdissection\n+ Reaction with specific antibodies\n* Mechanical rupture of the cell\n+ Differential staining procedures (E.g. Chance's method)\n+ Electron microscopy\n+ Fluorescence microscopy", "questionPages": [5, 6], "solutionPages": [16, 17], "questionFigures": [], "solutionFigures": []}, {"id": "ch1-q5", "chapterId": 1, "chapter": "General Microbiology", "number": 5, "text": "In which of the following phases of the bacterial growth curve does sporulation occur?\nMARROW", "options": [{"id": "A", "text": "D"}, {"id": "B", "text": "A"}, {"id": "C", "text": "C"}, {"id": "D", "text": "B"}], "correctIndex": 2, "correctLetter": "C", "solution": "Sporulation occurs in the stationary phase of the bacterial growth curve, which is marked as C in\nthe image.\nThe bacterial growth curve is obtained when a batch of bacteria is seeded in a liquid medium and\nincubated. It consists of 4 distinct phases:\n+ Lag phase (A) - The bacteria adapt to a new environment. They synthesize and accumulate\nenzymes and metabolic intermediates required for multiplication. Thus, there is no increase in\ncell number but cell size increases. Maximum cell size is obtained towards the end of this phase.\n+ Log or exponential phase (B) - The bacteria start dividing and their numbers increase\nexponentially with time. Cells are smaller and stain uniformly. The growth rate is constant.\n* Stationary phase (C) - There is depletion of nutrients and accumulation of toxic products. Thus,\ncell division reduces and a state of equilibrium is attained, where the number of new cells formed\nequals the number that die. Growth rate is zero. Sporulation occurs during this phase. Many\nbacteria produce secondary metabolic products such as exotoxins and antibiotics.\n* Death phase or the phase of decline (D) - Growth rate is negative. The population decreases due\nto cell death from nutritional exhaustion, toxin accumulation and the action of autolytic enzymes.\nInvolution forms are common.", "questionPages": [6], "solutionPages": [17, 18], "questionFigures": ["crop-question-ch1-q5-1"], "solutionFigures": ["crop-solution-ch1-q5-1"]}, {"id": "ch1-q6", "chapterId": 1, "chapter": "General Microbiology", "number": 6, "text": "Which organism has the following cell wall structure?", "options": [{"id": "A", "text": "Gram-positive organism"}, {"id": "B", "text": "Gram-negative organism"}, {"id": "C", "text": "Fungi"}, {"id": "D", "text": "Mycobacteria"}], "correctIndex": 0, "correctLetter": "A", "solution": "The presence of teichoic acid and lipoteichoic acid with a thick peptidoglycan layer is a feature of\ngram-positive bacteria.\nThe cell wall of bacteria provides shape and ridigity to the bacterial cell. It is composed of\npeptidoglycans.\n\n\n\nOther options:\nOption C: The cell wall of fungi consists of chitin, mannan, and polysaccharides (glucan).\nOption D: The cell wall of mycobacteria have mycolic acid, which is responsible for acid fastness.", "questionPages": [6, 7], "solutionPages": [18, 19], "questionFigures": ["crop-question-ch1-q6-1"], "solutionFigures": ["crop-solution-ch1-q6-1", "crop-solution-ch1-q6-2"]}, {"id": "ch1-q7", "chapterId": 1, "chapter": "General Microbiology", "number": 7, "text": "Which of the following helps in bacterial adhesion?", "options": [{"id": "A", "text": "Cytoplasmic membrane"}, {"id": "B", "text": "Mesosomes"}, {"id": "C", "text": "Fimbriae"}, {"id": "D", "text": "Lipopolysaccharides"}], "correctIndex": 2, "correctLetter": "C", "solution": "Fimbriae help in bacterial adhesion.\nFimbriae, also called pili, are hair-like surface appendage that projects from the cell surface as\nstraight filaments. They are primarily seen in Gram-negative bacteria. They are polymers of pilin.\nFimbriae are classified based on the function as ordinary pili - for adhesion - and sex pili -\ninvolved in bacterial conjugation. The functions of pili are given below:\n+ Bacterial conjugation through sex pili, which transfer of genetic material occurs.\n+ Bacterial adhesion of symbiotic and pathogenic bacteria to host cells using adhesins.\n+ Resistance to phagocytosis.\n+ Antigenic pilin proteins are responsible for the immune response.\n* Twitching motility to bacteria.", "questionPages": [7], "solutionPages": [19], "questionFigures": [], "solutionFigures": []}, {"id": "ch1-q8", "chapterId": 1, "chapter": "General Microbiology", "number": 8, "text": "Pasteurization is done at .", "options": [{"id": "A", "text": "73 degree Celsius for 20 minutes"}, {"id": "B", "text": "63 degree Celsius for 30 minutes"}, {"id": "C", "text": "72 degree Celsius for 30 seconds"}, {"id": "D", "text": "63 degree Celsius for 30 seconds"}], "correctIndex": 1, "correctLetter": "B", "solution": "Pasteurization is done at 63 degree Celsius for 30 minutes.\nPasteurization is the process of applying heat to milk to kill or stunt the growth of pathogenic\nbacteria. It was developed by Louis Pasteur. There are two methods for pasteurization:\n* Holder method: Milk is heated at 63°C for 30 minutes\n\n\n\n+ Flash process: Milk is heated to 72°C for 15-20 seconds\nOnce heated appropriately, the milk is cooled quickly to 13°C or lower. All the non-sporing\npathogens (mycobacteria, brucellae, salmonellae) are killed in pasteurization. In the Holder\nmethod, heat resistant Coxiella burnetti may survive.\nNote: Louis Pasteur pioneered the techniques of pasteurization and sterilization. He also first\nadvanced the germ theory of disease which states that most diseases were caused by\nmicroorganisms. Furthermore, he disproved the theory of spontaneous generation and developed\nvaccines for rabies and fowl cholera. He is thus known as the father of modern microbiology.", "questionPages": [7], "solutionPages": [19, 20], "questionFigures": [], "solutionFigures": []}, {"id": "ch1-q9", "chapterId": 1, "chapter": "General Microbiology", "number": 9, "text": "Which of the following methods of sterilization involves exposure to 100 °C for 20 minutes on\n3 successive days?", "options": [{"id": "A", "text": "Autoclaving"}, {"id": "B", "text": "Tyndallization"}, {"id": "C", "text": "Pasteurization"}, {"id": "D", "text": "Inspissation"}], "correctIndex": 1, "correctLetter": "B", "solution": "The method of sterilization that involves exposure at 100°C for 20 minutes for 3 successive days is\ncalled tyndallization or intermittent sterilization.\nTyndallization, which utilizes steam, was used for sterilization of media containing gelatin, egg,\nserum, or sugar. This method may not kill spores of certain anaerobes and\nthermophiles. Autoclaving has replaced this method now.\nOther options:\nOption A: Autoclaving involves heating at 121°C for 15 minutes at a pressure of 15psi. This is the\nused for intruments, linen, laboratory ware.\nOption C: In pasteurization, milk is heated at either 63°C for 30 minutes (the holder method) or at\n72°C for 15-20 seconds (the flash process), followed by cooling quickly to 13°C or lower.\nOption D: Heating an article at 80-85 °C for 30 minutes on 3 consecutive days is called\ninspissation.", "questionPages": [7], "solutionPages": [20], "questionFigures": [], "solutionFigures": []}, {"id": "ch1-q10", "chapterId": 1, "chapter": "General Microbiology", "number": 10, "text": "Which of the following works by disrupting the cell membrane?", "options": [{"id": "A", "text": "Lysol"}, {"id": "B", "text": "Povidone-iodine"}, {"id": "C", "text": "Thiomersal"}, {"id": "D", "text": "Ethylene oxide"}], "correctIndex": 0, "correctLetter": "A", "solution": "Lysol works by disrupting the cell membrane.\nLysol is a phenol compound, which is obtained by distillation of coal tar. Phenols cause cell\nmembrane damage and inactivate membrane-bound oxidases and dehydrogenases. This causes\nlysis and release of cell contents. Low concentrations of phenol can precipitate proteins. They are\nnot inactivated by organic matter and are thus useful disinfectants.\nThe mechnisms of action of other disinfecting agents are:\n+ DNA damage\n+ Ionizing radiation\n+ Ultraviolet light\n+ Hydrogen peroxide\n+ DNA reactive chemicals like acriflavin.\n+ Protein modification\n\n\n\n+ Alcohol\n* Chlorine\n* Iodine\n* Heavy metals (e.g. thiomersal)\n* Hydrogen peroxide\n* Formaldehyde\n* Glutaraldehyde\n+ Ethylene oxide\n+ Acids and alkalis", "questionPages": [7, 8], "solutionPages": [20, 21], "questionFigures": [], "solutionFigures": []}, {"id": "ch1-q11", "chapterId": 1, "chapter": "General Microbiology", "number": 11, "text": "Which of the following methods is used in the test shown below?", "options": [{"id": "A", "text": "Streak culture"}, {"id": "B", "text": "Lawn culture"}, {"id": "C", "text": "Stroke culture"}, {"id": "D", "text": "Stab culture"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given image shows antibiotic sensitivity testing which uses the lawn culture method.\nLawn or carpet culture is the method in which a uniform surface growth of bacterium is present\non the medium. It is used for antibiotic sensitivity testing (disc method) and bacteriophage typing.\nStab culture (option D) is used for demonstration of gelatin liquefaction and oxygen requirements\nof bacterium, for maintenance of stock cultures. Streak culture (option A) is routinely used for the\nisolation of bacteria in pure culture from clinical specimens. Stroke culture (option C) is used for\nproviding pure growth of bacterium for slide agglutination and other diagnostic tests. Other\nmethods of culture include:\n+ Liquid culture - These are preferred for inocula containing antibiotics and other inhibitory\nsubstances.\n+ Pour plate culture - It gives an estimate of viable bacterial count in a suspension.", "questionPages": [8], "solutionPages": [21, 22], "questionFigures": ["crop-question-ch1-q11-1"], "solutionFigures": ["crop-solution-ch1-q11-1"]}, {"id": "ch1-q12", "chapterId": 1, "chapter": "General Microbiology", "number": 12, "text": "In which of the following organisms will the following phenomenon not be observed in?", "options": [{"id": "A", "text": "Bacillus anthracis"}, {"id": "B", "text": "Klebsiella pneumoniae"}, {"id": "C", "text": "Neisseria gonorrheae"}, {"id": "D", "text": "Hemophilus influenzae"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given image shows Quellung reaction (halo around the bacteria) and is seen in capsulated\nbacteria. Neisseria gonorrhoeae is not capsulated, therefore Quellung reaction will not be\nobserved in it.\nIn Quellung reaction, a suspension of a capsulated bacterium is mixed with its specific\nanticapsular serum and examined under the microscope. The anticapsular antibodies bind to the\ncapsule and thus the capsule becomes very prominent and appears swollen. Capsulated organisms\ncan be remembered with the following mnemonic:\nSome - Streptococcus pneumoniae\nKillers - Klebsiella pneumoniae\nHave - Haemophilus influenzae\nNice - Neisseria meningitidis\nCapsules - Cryptococcus neoformans", "questionPages": [8, 9], "solutionPages": [22], "questionFigures": ["crop-question-ch1-q12-1"], "solutionFigures": []}, {"id": "ch1-q13", "chapterId": 1, "chapter": "General Microbiology", "number": 13, "text": "A 32-year-old laborer working at a construction site presented with fever and hemoptysis. The\nsputum sample collected for examination showed the following. The smear will be stained by\nwhich of the following sequences?", "options": [{"id": "A", "text": "Gentian violet - iodine - alcohol - saffranin"}, {"id": "B", "text": "Methylene blue - malachite green- acetic acid-water"}, {"id": "C", "text": "Methanol-methylene blue-acid-water"}, {"id": "D", "text": "Carbol fuschin - acid-alcohol - methylene blue"}], "correctIndex": 3, "correctLetter": "D", "solution": "The given clinical vignette of fever and hemoptysis in a labourer with the sputum smear\nshowing acid-fast bacilli is suggestive of tuberculosis. Mycobacterium tuberculosis, detected on\nsputum smear, is appreciated by Ziehl-Neelsen staining, which would includes carbol fuschin -\nacid - alcohol - methylene blue.\nAcid-fast bacteria (like MTB) in a stained Ziehl-Neelsen (ZN) smear appear bright red against a\nblue background. Steps involved in ZN staining are:\n+ Place the sample on slide evenly spread it with rotational movement\n+ Air-dry the slide and fix it by passing it over a flame\n+ Apply carbol fuschin stain and heat to fix it.\n+ Wash with water to remove excess stain\n* Decolourise with alcohol\n+ Apply Methylene blue/Malachite green stain\n+ Wash with water to remove excess stain\n+ View under the microscope\nKinyoun modified the classical ZN staining such that heat fixing is not required. It is called the\ncold method. It involves increasing the concentration of phenol acid and the duration of staining.\nThe slide is then washed with water and decolourized with acid alcohol. Counterstaining with\nLoeffler's methylene blue or malachite green is done for a minute and viewed under a microscope.\nAcid-fast bacteria in a stained smear appear bright red against a blue background.\nThe image attached below summarizes the steps.\n\n\n\nOption A: It depicts the order of Gram staining, which was discovered by Hans Christian Gram in\n1884.\n* Primary staining with para-rosaniline dye (crystal violet, methyl violet or gentian violet).\n* Application of dilute solution of iodine.\n* Decolorisation with an organic solvent (ethanol, acetone, aniline).\n* Counterstaining with the dye of contrasting colour (carbol fuchsin, safranine, neutral red).\nOption B: It includes the steps for performing Albert's stain which is used for detected\nCorynebacterium diphtheriae.\n+ A heavy smear of the bacterial isolate is prepared on a glass slide and allowed to dry without\nfixing.\n+ Albert’s stain is applied for (3-4) minutes. Then it is washed with water and Albert's iodine is\napplied for one minute.\n* Wash with water and let dry with blotting paper.\n+ Examine the slide under oil immersion.\nCorynebacterium diphtheriae are slender bacilli with an arrangement resembling the letters V or\nL. They have metachromatic granules at the poles of bacilli which are also called polar bodies,\nvolutin, or Babes-Ernst granules. Albert staining is useful in the demonstration of metachromatic\ngranules. The presence of metachromatic granules helps to distinguish C.diphtheriae from\ndiphtheroids which lack them. The images below show Corynebacterium diphtheriae.", "questionPages": [9, 10], "solutionPages": [22, 23, 24], "questionFigures": ["crop-question-ch1-q13-1"], "solutionFigures": ["crop-solution-ch1-q13-1", "crop-solution-ch1-q13-2"]}, {"id": "ch1-q14", "chapterId": 1, "chapter": "General Microbiology", "number": 14, "text": "Given are a few case scenarios. The etiological agents of which of the following are\nmicroaerophilic?", "options": [{"id": "A", "text": "2and5"}, {"id": "B", "text": "3 and 4"}, {"id": "C", "text": "1and 4"}, {"id": "D", "text": "1and2"}], "correctIndex": 3, "correctLetter": "D", "solution": "The aetiological agents of 1 and 2 are microaerophilic.\nThe given case scenarios are:\n1. A businessman with epigastric pain and positive urease test has peptic ulcer disease, caused by\nHelicobacter pylori. It is microaerophilic.\n2. Diarrhea caused by Gram-negative, small, spirally curved rod-like, motile bacilli describes\nCampylobacter jejuni. It is microaerophilic.\n3. Rice-water diarrhea and Gram-negative curved bacilli with 'fish-in-stream' appearance\ndescribes cholera caused by Vibrio cholerae. It is a facultative anaerobe.\n4. Nasopharyngeal swab from a child with paroxysmal cough showing ‘mercury drops' colonies\ndescribes Bordetella pertussis. It is an obligate aerobe.\n5. Dry, rough, raised, irregular colonies on LJ medium describes Mycobacerium tuberculosis. It is\nan obligate aerobe.\nMicroaerophilic organisms grow best in low oxygen tension (2-10% oxygen).\nNote: Mycobacteria, such as M. bovis, can grow at oxygen tensions ranging from atmospheric to\nmicroaerophilic conditions. However, M. tuberculosis is an obligate aerobe.", "questionPages": [10], "solutionPages": [24], "questionFigures": [], "solutionFigures": []}, {"id": "ch1-q15", "chapterId": 1, "chapter": "General Microbiology", "number": 15, "text": "The given image shows a culture medium with lactose fermenting and non-lactose fermenting\nbacteria. Which of the following is not a component of the culture medium?", "options": [{"id": "A", "text": "Taurocholate"}, {"id": "B", "text": "Peptone"}, {"id": "C", "text": "Neutral red"}, {"id": "D", "text": "Cysteine"}], "correctIndex": 3, "correctLetter": "D", "solution": "The given image shows MacConkey agar. Cysteine is not a constituent of MacConkey agar.\nMacConkey agar is a differential or indicator medium. Lactose-fermenting organisms (Eg: E. coli)\nproduce a pink color, and non-lactose fermenting organisms (Shigella sp., Salmonella sp.) do not\nchange the color. Contents of MacConkey agar include peptone, lactose, agar, neutral red and\n\n\n\nsodium taurocholate (Mnemonic- PLANT). MacConkey agar is also a selective medium i.e. the bile\nsalts (sodium taurocholate) and dyes (neutral red) inhibit the growth of Gram-positive organisms\nand Gram-negative cocci.", "questionPages": [10, 11], "solutionPages": [24, 25], "questionFigures": ["crop-question-ch1-q15-1"], "solutionFigures": []}, {"id": "ch1-q16", "chapterId": 1, "chapter": "General Microbiology", "number": 16, "text": "Which of the following is an enrichment medium?", "options": [{"id": "A", "text": "B"}, {"id": "B", "text": "C"}, {"id": "C", "text": "A"}, {"id": "D", "text": "D"}], "correctIndex": 2, "correctLetter": "C", "solution": "The image 'A' represents alkaline peptone water, which is an enrichment medium used for Vibrio\ncholerae.\nThe other images represent:\nImage B- Blood agar with P. aeruginosa colonies\nImage C- Loeffler's serum slope, which is used to isolate C. diphtheriae\nImage D- Chocolate agar with F. tularensis colonies\nEnrichment media suppress the growth of commensal bacteria and allow for the growth of certain\norganisms. These media are used for samples with mixed flora e.g. stool. They are always liquid\nmedia, like alkaline peptone water. Other examples include tetrathionate broth and selenite-F\nbroth for Salmonella sp. and Shigella sp.\nEnriched medium are those media to which additional nutrients such as blood, serum, or egg are\nadded. They're used to grow bacteria with specific nutritional requirements. Examples include\nblood agar to test the hemolytic property of bacteria, chocolate agar for isolation of H. influenzae\nand Loeffler's serum slope for isolation of C. diphtheriae.", "questionPages": [11], "solutionPages": [25], "questionFigures": ["crop-question-ch1-q16-1"], "solutionFigures": []}, {"id": "ch1-q17", "chapterId": 1, "chapter": "General Microbiology", "number": 17, "text": "A microbiologist observes the following growth on a blood agar plate. Which of the following\nwill not be the etiological agent?", "options": [{"id": "A", "text": "Clostridium tetani"}, {"id": "B", "text": "Corynebacterium diphtheriae"}, {"id": "C", "text": "Proteus mirabilis"}, {"id": "D", "text": "Bacillus cereus"}], "correctIndex": 1, "correctLetter": "B", "solution": "The above image shows a swarming type of growth on the agar plate. It will not be caused by\nCorynebacterium diphtheriae.\nSwarming is the growth of motile bacteria in the form of a thin film on solid culture media. It is\nexhibited by the following:\n* Gram-positive bacilli - Clostridium tetani (option A), Bacillus cereus (option D)\n+ Gram-negative bacilli - Proteus mirabilis (option C), Proteus vulgaris\n* Gram-negative halophilic bacteria- Vibrio parahaemolyticus\nSwarming can be inhibited by increasing the concentration of agar (6%), alcohol, sodium\nazide, boric acid, chloral hydrate, sulfonamide, and surface-active agents.", "questionPages": [11, 12], "solutionPages": [25], "questionFigures": ["crop-question-ch1-q17-1"], "solutionFigures": []}, {"id": "ch1-q18", "chapterId": 1, "chapter": "General Microbiology", "number": 18, "text": "Bacterial transduction occurs by", "options": [{"id": "A", "text": "Plasmids"}, {"id": "B", "text": "Sex pili"}, {"id": "C", "text": "Bacteriophage"}, {"id": "D", "text": "Uptake of genetic material by other bacteria."}], "correctIndex": 2, "correctLetter": "C", "solution": "Bacterial transduction occurs by bacteriophages.\nTransduction is a process of acquiring bacterial DNA from a bacteriophage (virus) that has\nincorporated bacterial DNA from previous host bacteria.\n\n\n\nOther methods of exchange of genetic material are transformation and\nconjugation. Transformation involves the uptake of genetic material from the environment, which\nis released by other bacteria. Conjugation is the direct transfer of DNA from one bacterial cell to\nanother bacterial cell through a sex pilus or bridge. The transferred DNA is a plasmid, a circle of\nDNA that is distinct from the main bacterial chromosome.", "questionPages": [12], "solutionPages": [25, 26], "questionFigures": [], "solutionFigures": ["crop-solution-ch1-q18-1"]}, {"id": "ch1-q19", "chapterId": 1, "chapter": "General Microbiology", "number": 19, "text": "Which of the following principles is primarily used in polymerase chain reaction?", "options": [{"id": "A", "text": "Transcription of DNA"}, {"id": "B", "text": "It can amplify small amounts of DNA"}, {"id": "C", "text": "It can amplify small amounts of RNA"}, {"id": "D", "text": "Reverse transcription of RNA"}], "correctIndex": 1, "correctLetter": "B", "solution": "The primary principle used in polymerase chain reaction (PCR) is the amplification of small\namounts of DNA.\nPCR is an automated process in which a single or a few copies of a DNA piece is amplified to\ngenerate of thousands to millions of copies of that particular DNA sequence. There are 3 basic\nsteps are involved in PCR:\n* DNA extraction from microorganism\n+ Amplification of extracted DNA - Denaturation (95°C), Primer annealing (55°C), Extension\n(72°C)\n* Gel electrophoresis of the amplified product\nPCR is used in rapid diagnostic tests for infections (e.g. HIV DNA), forensic investigations etc. The\nfounder of PCR is Karry B Mullis.\n\n\n\n© Elongation ata.72°C", "questionPages": [12, 13], "solutionPages": [26, 27], "questionFigures": [], "solutionFigures": ["crop-solution-ch1-q19-1"]}, {"id": "ch1-q20", "chapterId": 1, "chapter": "General Microbiology", "number": 20, "text": "Which of the following describes the reverse transcriptase enzyme used in RT-PCR correctly?", "options": [{"id": "A", "text": "DNA-dependent RNA polymerase"}, {"id": "B", "text": "RNA-dependent DNA polymerase"}, {"id": "C", "text": "DNA-dependent DNA polymerase"}, {"id": "D", "text": "RNA-dependent RNA polymerase"}], "correctIndex": 1, "correctLetter": "B", "solution": "The enzyme involved in RT-PCR is reverse transcriptase (RT) which has RNA-dependent DNA\npolymerase activity.\nIn reverse transcription-polymerase chain reation (RT-PCR), reverse transcriptase synthesizes\nDNA from the RNA template. RT-PCR can be used for the demonstration of poliovirus RNA,\ncausing paralytic poliomyelitis, in CSF. It can also be used for the detection of viruses from\nnasopharyngeal swabs (SARS-CoV2, H1N1).\nIn real-time RT-PCR, fluorescent dyes or DNA probes are used to quantify the pathogen DNA load\nin the specimen. So, it can be used to quantify viral loads in HIV, hepatitis B, etc., and is also\ncalled quantitative PCR (qPCR).", "questionPages": [13], "solutionPages": [27, 28], "questionFigures": [], "solutionFigures": ["crop-solution-ch1-q20-1"]}, {"id": "ch1-q21", "chapterId": 1, "chapter": "General Microbiology", "number": 21, "text": "What are jumping genes known as?", "options": [{"id": "A", "text": "Episomes"}, {"id": "B", "text": "Plasmids"}, {"id": "C", "text": "Transposons"}, {"id": "D", "text": "Cosmids"}], "correctIndex": 2, "correctLetter": "C", "solution": "Jumping genes are also called transposons.\nTransposons are genetic elements that can move between chromosomal and extra-chromosomal\nDNA molecules. Insertion of a transposon leads to acquisition of new characteristics by the\nrecipient DNA. Transposons contain several genes, including those necessary for their migration\nfrom one genetic locus to another. They may contain genes for specialised functions like antibiotic\nresistance. However, they do not contain genes for their replication.\nJumping genes were discovered by Barbara McClintock and she was awarded the Nobel Prize in\nPhysiology or Medicine 1983 for the same.\nOther options:\nOptions A and B: The cytoplasmic carriers of genetic information are termed plasmids or\nepisomes.\nOption D: A cosmid is a type of hybrid plasmid that contains a Lambda phage cos sequence. (Cos\nsites + plasmid = cosmids).", "questionPages": [13], "solutionPages": [28], "questionFigures": [], "solutionFigures": []}, {"id": "ch1-q22", "chapterId": 1, "chapter": "General Microbiology", "number": 22, "text": "In which of the following situations will you use a sanitizer?", "options": [{"id": "A", "text": "A, B & C only"}, {"id": "B", "text": "A & B only"}, {"id": "C", "text": "A, BC & D"}, {"id": "D", "text": "C & D only"}], "correctIndex": 0, "correctLetter": "A", "solution": "You should use a sanitiser before and after examining the patient and after touching the patients'\nsurroundings. The hands should be washed with soap and water thoroughly in case they are\nvisibly soiled.\nSanitization is the process through which pathogenic organisms are reduced to safe levels on\ninanimate objects to reduce the likelihood of cross-infections. It is a component of hand-hygiene,\nwhich is demonstrated by the image below.\n\n\n\nNote: Disinfectants like chlorhexidine and alexidine have a biguanide functional group. They are\nmostly used as oral disinfectants and hand products. They are bactericidal but not sporicidal.\nMycobacteria are also resistant to these compounds.", "questionPages": [13], "solutionPages": [28, 29], "questionFigures": [], "solutionFigures": ["crop-solution-ch1-q22-1"]}, {"id": "ch1-q23", "chapterId": 1, "chapter": "General Microbiology", "number": 23, "text": "An orthopedician is performing the following procedure to visualize the anterior cruciate\nligament in a patient. Which of the following will be used to sterilise the instrument used?", "options": [{"id": "A", "text": "Ethylene oxide"}, {"id": "B", "text": "Gamma rays"}, {"id": "C", "text": "Hydrogen peroxide"}, {"id": "D", "text": "Ultraviolet rays"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given image shows arthroscopy being performed. Arthroscopes are sterilized using plasma\nsterilization which utilises hydrogen peroxide.\nIn plasma sterilisation, radiofrequency energy is applied to create an electromagnetic field\nthrough which hydrogen peroxide vapours are passed. This generates plasma which contains free\nradicals of hydrogen and oxygen. Plasma denatures all organisms and is used sterilize\narthroscopes and ureteroscopes. Sterilization control is monitored by Geobacillus\nstearothermophilus and Bacillus atrophaeus.\nOption A: Ethylene oxide has both microbicidal and sporicidal activity. It is used for sterilisation\nheat-sensitive equipment like heart-lung machines, respirators, suture materials etc. Sterilization\ncontrol is monitored by Bacillius atrophaeus and Bacillus subtilus.\nOption B: Gamma rays cause breakage of DNA. It destroys spores and vegetative cells, but is not\neffective against viruses. It is referred to as cold sterilisation and is used in commercial plants to\nsterilize plastics, syringes, swabs. Sterilization control is monitored by Bacillus pumilius.\nOption D: Ultraviolet rays are used to sterilise biosafety cabinets, entryways, operation theatres\nand laboratories.", "questionPages": [13, 14, 15], "solutionPages": [29], "questionFigures": ["crop-question-ch1-q23-1"], "solutionFigures": []}, {"id": "ch2-q1", "chapterId": 2, "chapter": "Components of Immune system", "number": 1, "text": "What type of immunity is being conferred to a neonate receiving the BCG vaccine?", "options": [{"id": "A", "text": "Natural active immunity"}, {"id": "B", "text": "Natural passive immunity"}, {"id": "C", "text": "Artificial active immunity"}, {"id": "D", "text": "Artificial passive immunity"}], "correctIndex": 2, "correctLetter": "C", "solution": "The immunity conferred to a neonate receiving the BCG vaccine is artificial active immunity, as it\ninvolves administering a live attenuated vaccine form of Mycobacterium bovis to stimulate an\nadaptive immune response and develop antibodies, establishing long-term immunity.\nTypes of adaptive immunity:\n+ Natural active immunity: It results from either a clinical or an inapparent infection by a microbe.\n+ Artificial active immunity: It is the resistance induced by vaccines which are preparations of\nkilled or attenuated microorganisms or their products.\n+ Natural passive immunity: It is the immunity passively transferred from mother to baby. In\nhuman infants, maternal antibodies are transmitted predominantly through the placenta, while in\nanimals such as pigs, the transfer of antibodies occurs mainly through the colostrum.\n+ Artificial passive immunity: It is the resistance passively transferred to a recipient by the\nadministration of antibodies. Hyperimmune sera of animal or human origin, convalescent sera,\nand pooled human immunoglobulin are used for this purpose.\n* Combined immunization: A combination of the active and passive methods of immunization is\nused.\nExamples of the above types of immunity:\nNote: Adoptive immunity is immunity in which immunologically competent lymphocytes are\ninjected. The transfer factor is composed of these immunologically competent lymphocytes. It can\npassively transfer cell-mediated immunity against those antigens to which the donor is sensitive.", "questionPages": [30], "solutionPages": [40], "questionFigures": [], "solutionFigures": ["crop-solution-ch2-q1-1", "crop-solution-ch2-q1-2"]}, {"id": "ch2-q2", "chapterId": 2, "chapter": "Components of Immune system", "number": 2, "text": "A 33-year-old with a large dirty wound on his knee and abrasions on his palms presents to the\ncasualty. He does not remember the last time he received a TT injection and was thus given\ntetanus immunoglobulin. Which of the following is false about this type of immunity?", "options": [{"id": "A", "text": "Acquired immediately"}, {"id": "B", "text": "Memory is absent"}, {"id": "C", "text": "Long lasting"}, {"id": "D", "text": "No negative phase"}], "correctIndex": 2, "correctLetter": "C", "solution": "Giving pre-formed immunoglobulin (e.g. Tetanus immunoglobulin) directly is an example of\npassive immunity, which is not long-lasting.\nThe differentiating features between active and passive immunity:\nNegative phase: It is the time period during which the level of measurable immunity is lower than\nit was before the antigenic stimulus. This is because the antigen combines with any pre-existing\nantibody and lowers its level in circulation. It is seen at the beginning of the active immune\nresponse.\nSecondary type response: If an individual who has been actively immunized against an antigen\nexperiences the same antigen subsequently, the immune response occurs more quickly and\nabundantly than during the first encounter.", "questionPages": [30], "solutionPages": [40, 41], "questionFigures": [], "solutionFigures": ["crop-solution-ch2-q2-1", "crop-solution-ch2-q2-2"]}, {"id": "ch2-q3", "chapterId": 2, "chapter": "Components of Immune system", "number": 3, "text": "A patient with chronic mucocutaneous candidiasis was administered transfer factor as\ntreatment. What type of immunity does this result in?", "options": [{"id": "A", "text": "Active immunity"}, {"id": "B", "text": "Passive immunity"}, {"id": "C", "text": "Combined immunity"}, {"id": "D", "text": "Adoptive immunity"}], "correctIndex": 3, "correctLetter": "D", "solution": "Adoptive immunity occurs when transfer factor is given.\nTransfer factor is composed of an extract of immunologically competent lymphocytes such as T\nlymphocytes, NK cells, macrophages, or B cells. It has the ability to passively transfer\ncell-mediated immunity against antigens to which the donor is sensitive.\nIt has been attempted in the treatment of lepromatous leprosy and chronic mucocutaneous\ncandidiasis.", "questionPages": [30], "solutionPages": [41], "questionFigures": [], "solutionFigures": []}, {"id": "ch2-q4", "chapterId": 2, "chapter": "Components of Immune system", "number": 4, "text": "Which of the following is not a pattern recognition receptor?", "options": [{"id": "A", "text": "NOD-like receptors"}, {"id": "B", "text": "Toll-like receptors"}, {"id": "C", "text": "RIG-like receptors"}, {"id": "D", "text": "BMP-like receptors"}], "correctIndex": 3, "correctLetter": "D", "solution": "Bone morphogenetic protein-like receptors are not pattern-recognition receptors.\nPattern recognition receptors (PRRs) are essential for the innate immune system. They identify\npathogen-associated molecular patterns (PAMPs) common to classes of microbes and trigger\nimmune responses. These receptors can be found on the cell surface, detecting extracellular\npathogens, or within the endosomes and cellular matrix, detecting intracellular invading viruses.\nPRRs activate pro-inflammatory pathways, promote phagocytosis in cells like macrophages,\nneutrophils and dendritic cells, and may act as secreted proteins binding directly to pathogens.\nBased on the localization and functional characteristics, PRRs are classified as:\n* Membrane-bound PRRs:\n+ Toll-like receptors (TLR)- detect microbial carbohydrates and lipoproteins (Option B)\n* C-type lectin receptors (CLR)- detect mannose residues\n* Cytoplasmic (intracellular) PRRs:\n\n\n\n* Nucleotide oligomerization (NOD)-like receptors (NLR) - NOD1 and NOD2 - Detects bacterial\ncell wall peptidoglycans (Option A)\n+ RIG-I-like receptors (RLRs) - detect viral RNA (Option C)\n* Secreted PRRs\nOn the contrary, BMP receptors are multifunctional transmembrane serine-threonine kinase\nreceptors that belong to the transforming growth factor B (TGF-B) superfamily, regulating cell\ngrowth, differentiation, and apoptosis with no role in pattern recognition. Also, there are no\nreceptors termed \"BMP-like receptors\".\nNote: A mutation in the Bone morphogenetic protein receptor 2 (BMPR2) gene enhances the\nproliferation and reduces the apoptosis of pulmonary vascular endothelial and smooth muscle\ncells, leading to hereditary pulmonary arterial hypertension (PAH).", "questionPages": [30, 31], "solutionPages": [41, 42], "questionFigures": [], "solutionFigures": []}, {"id": "ch2-q5", "chapterId": 2, "chapter": "Components of Immune system", "number": 5, "text": "A 23-year-old presents with diarrhea, fever, and vomiting. The given bacteria is implicated.\nWhich toll-like receptor binds to the structure of the bacteria marked A?", "options": [{"id": "A", "text": "TLR 2"}, {"id": "B", "text": "TLR 4"}, {"id": "C", "text": "TLR5"}, {"id": "D", "text": "TLR 9"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given image and clinical history suggest a typhoid infection. The structure marked A is the\nflagella of bacteria. Toll-like receptor (TLR) 5 binds to the flagella of bacteria.\nToll-like receptors (TLRs) are transmembrane receptors that have an extracellular domain, that\ndetect infecting pathogens.\n+ TLR 1 - Mycobacteria and Gram-negative bacteria\n+ TLR 2 - Mycobacteria and Gram-positive bacteria\n* TLR 3 - Viral RNA\n+ TLR 4 - Gram-negative bacteria\n* TLR 5 - Flagella\n* TLR 9 - Bacterial DNA, some herpes viruses, malarial parasite\nTLRs act through the NF-KB pathway and initiate inflammation.", "questionPages": [31], "solutionPages": [42], "questionFigures": ["crop-question-ch2-q5-1"], "solutionFigures": []}, {"id": "ch2-q6", "chapterId": 2, "chapter": "Components of Immune system", "number": 6, "text": "Which of the following statements is true about T cell dependent antigens?", "options": [{"id": "A", "text": "Their response doesn't show immunological memory"}, {"id": "B", "text": "They activate only mature B cells"}, {"id": "C", "text": "They activate B cells polyclonally"}, {"id": "D", "text": "They activate only IgG antibodies"}], "correctIndex": 1, "correctLetter": "B", "solution": "T cell-dependent antigens activate only mature B cells.\nDepending on their ability to induce the formation of antibodies, antigens are classified as T-cell\ndependent and T-cell independent antigens.", "questionPages": [31, 32], "solutionPages": [42, 43], "questionFigures": [], "solutionFigures": ["crop-solution-ch2-q6-1", "crop-solution-ch2-q6-2"]}, {"id": "ch2-q7", "chapterId": 2, "chapter": "Components of Immune system", "number": 7, "text": "A 28-year-old woman presents with a fever of 103°F, hypotension, confusion, and a diffuse\nrash as shown below. 3 days back, she had uncontrollable epistaxis for which a nasal pack\nwas placed. What is the likely mechanism of action of the microbial toxin that has caused her\ncurrent illness?", "options": [{"id": "A", "text": "Enhancement of phagocytosis"}, {"id": "B", "text": "Increased antigen presentation by macrophages"}, {"id": "C", "text": "Polyclonal activation of T cells"}, {"id": "D", "text": "Uncontrolled activation of complement"}], "correctIndex": 2, "correctLetter": "C", "solution": "This woman presented with fever, hypotension, and a diffuse erythematous rash, three days after\na nasal packing was done. This is characteristic of toxic shock syndrome - commonly caused by\nstaphylococcal toxic shock syndrome toxin-1 (TSST-1), which is a superantigen.\nSuperantigens act by causing polyclonal activation of T cells. They activate a large number of T\ncells irrespective of their antigen specificity.\nIn contrast to regular antigens which bind to the binding groove on T cells, superantigens bind\noutside the groove directly to the lateral aspect of the TCR f chain. This leads to a massive release\nof cytokines and polyclonal activation of T cells.\nClinically, this manifests as fever, hypotension, and skin exfoliation.\nExamples of organisms that produce superantigens:\n+ Bacterial\n\n\n\n* Staphylococcus aureus- Enterotoxins\n* Group A streptococci - Pyrogenic exotoxin\n* Mycoplasma arthritidis- mitogen 1\n+ Yersinia enterocolitica\n+ Yersinia pseudotuberculosis\n+ Viral\n+ Epstein-Barr virus (EBV)\n* Cytomegalovirus (CMV)\n* Rabies nucleocapsid\n+ HIV-encoded negative regulatory factor.\n* Fungal- Malassezia furfur", "questionPages": [32], "solutionPages": [43, 44], "questionFigures": ["crop-question-ch2-q7-1"], "solutionFigures": ["crop-solution-ch2-q7-1"]}, {"id": "ch2-q8", "chapterId": 2, "chapter": "Components of Immune system", "number": 8, "text": "What are the changes in the variable regions of an immunoglobulin known as?", "options": [{"id": "A", "text": "Idiotype"}, {"id": "B", "text": "Isotype"}, {"id": "C", "text": "Allotype"}, {"id": "D", "text": "Epitope"}], "correctIndex": 0, "correctLetter": "A", "solution": "Changes in the variable regions of heavy and light chains of an immunoglobulin are called an\nidiotype.\nOther options:\nOption B: Isotypes are the changes in the constant regions of the heavy chain of the\nimmunoglobulin.\nOption C: Allotypes refer to multiple alleles that exist for some genes. This leads to subtle amino\nacid differences that occur in some but not all members of the same species.\nOption D: An epitope is the smallest unit of antigenicity and it is an antigenic determinant.", "questionPages": [32], "solutionPages": [44], "questionFigures": [], "solutionFigures": []}, {"id": "ch2-q9", "chapterId": 2, "chapter": "Components of Immune system", "number": 9, "text": "Which of the following statements about immunoglobulins is false?", "options": [{"id": "A", "text": "IgG is used to diagnose fetal infection"}, {"id": "B", "text": "IgM has weak precipitation activity"}, {"id": "C", "text": "IgG has four subclasses"}, {"id": "D", "text": "IgM is mainly intravascular"}], "correctIndex": 0, "correctLetter": "A", "solution": "IgG cannot detect fetal infections because it is not produced by the fetus in significant amounts.\nIgG is the only maternal immunoglobulin that is normally transported across the placenta and\nprovides natural passive immunity to the newborn.", "questionPages": [32, 33], "solutionPages": [44], "questionFigures": [], "solutionFigures": []}, {"id": "ch2-q10", "chapterId": 2, "chapter": "Components of Immune system", "number": 10, "text": "Which of the following immunoglobulins acts as surface immunoglobulin on B cells?", "options": [{"id": "A", "text": "Ig G"}, {"id": "B", "text": "Ig A"}, {"id": "C", "text": "IgM"}, {"id": "D", "text": "IgE"}], "correctIndex": 2, "correctLetter": "C", "solution": "Monomeric IgM is the major antibody receptor on the surface of B lymphocytes for antigen\nrecognition.\nIgD is the other class of antibodies which acts as the B cell receptors.", "questionPages": [33], "solutionPages": [44, 45], "questionFigures": [], "solutionFigures": []}, {"id": "ch2-q11", "chapterId": 2, "chapter": "Components of Immune system", "number": 11, "text": "A 3-year-old child presents with a history of repeated sinopulmonary infections caused by\nencapsulated organisms. Which of the following is most likely to be deficient in this case?", "options": [{"id": "A", "text": "IgG1"}, {"id": "B", "text": "IgG2"}, {"id": "C", "text": "IgG3"}, {"id": "D", "text": "IgG4"}], "correctIndex": 1, "correctLetter": "B", "solution": "Deficiency of IgG2 results in recurrent sinopulmonary infections with encapsulated organisms.\nIgG is the only maternal immunoglobulin that is normally transported across the placenta and\nprovides natural passive immunity to the newborn. IgG1 is the antibody maximally transported\nacross the placenta, whereas IgG2 has the least transplacental movement.\nDeficiencies of other IgG:\n+ IgG1- bacterial infections (diphtheria, tetanus)(Option A)\n+ IgG3- viral infections (Option C)\n+ IgG4- parasitic infections (Option D)", "questionPages": [33], "solutionPages": [45], "questionFigures": [], "solutionFigures": []}, {"id": "ch2-q12", "chapterId": 2, "chapter": "Components of Immune system", "number": 12, "text": "Identify the class of immunoglobulinl™l shown in the image below.", "options": [{"id": "A", "text": "Ig A"}, {"id": "B", "text": "IgG"}, {"id": "C", "text": "IgM"}, {"id": "D", "text": "IgE"}], "correctIndex": 0, "correctLetter": "A", "solution": "The above image shows a dimeric structure, characteristic of secretory IgA.\nIgA immunoglobulin is the major antibody responsible for mucosal immunity. Its serum levels are\nusually low. It is predominantly present in the extravascular secretions. It is present in secretions\nsuch as milk, saliva, and tears, and in secretions of the respiratory, intestinal, and genital tracts.\nWhen present in the serum, it exists as a monomer similar to IgG. However, when it is secreted, it\nexists as a dimer. The dimeric structure consists of two monomers, which are stabilized by two\nadditional polypeptides:\n¢ J chain, which stabilizes the molecule.\n* Secretory component, which is incorporated into the IgA when transported through the\nepithelial cell.", "questionPages": [33, 34], "solutionPages": [45, 46], "questionFigures": ["crop-question-ch2-q12-1"], "solutionFigures": ["crop-solution-ch2-q12-1"]}, {"id": "ch2-q13", "chapterId": 2, "chapter": "Components of Immune system", "number": 13, "text": "Which immunoglobulin is majorly responsible for the reaction demonstrated below?", "options": [{"id": "A", "text": "Ig G"}, {"id": "B", "text": "Ig A"}, {"id": "C", "text": "IgM"}, {"id": "D", "text": "IgE"}], "correctIndex": 2, "correctLetter": "C", "solution": "The image shows blood typing, which works on the principle of agglutination. IgM is mainly\nresponsible for agglutination.\nIt is the most efficient immunoglobulin in agglutination, complement fixation, and other\nantigen—antibody reactions and is important also in defense against bacteria and viruses.\nIt is a pentamer, and hence is more effective than IgG in opsonization (C3b mediated),\nbactericidal action and bacterial agglutination but less effective in neutralization of toxins and\nviruses.", "questionPages": [34, 35], "solutionPages": [46], "questionFigures": ["crop-question-ch2-q13-1"], "solutionFigures": ["crop-solution-ch2-q13-1"]}, {"id": "ch2-q14", "chapterId": 2, "chapter": "Components of Immune system", "number": 14, "text": "You are counseling a new mother about the importance of breastfeeding. What forms the\nsecretory component of the antibody that is maximally present in breast milk?", "options": [{"id": "A", "text": "Plasma cell only"}, {"id": "B", "text": "Epithelial cells of lining mucosa only"}, {"id": "C", "text": "Plasma cell and oligosaccharides"}, {"id": "D", "text": "Oligosaccharides and epithelial cells"}], "correctIndex": 1, "correctLetter": "B", "solution": "The antibody maximally present in breast milk is IgA. The secretory component of IgA is formed\nby epithelial cells of lining mucosa.\nIgA occurs in two forms- serum IgA (monomer) and secretory IgA.\nSecretory IgA is a dimer formed by two monomer units joined together by a J-chain and\na secretory component (secretory piece). Secretory IgA along with the J chain is synthesized by\nthe plasma cells situated near the mucosal or glandular epithelium. The secretory component is\nsynthesized by epithelial cells, not by plasma cells.\nIt is believed to protect IgA from denaturation by bacterial proteases.", "questionPages": [35], "solutionPages": [46, 47], "questionFigures": [], "solutionFigures": ["crop-solution-ch2-q14-1"]}, {"id": "ch2-q15", "chapterId": 2, "chapter": "Components of Immune system", "number": 15, "text": "When papain acts on a molecule of immunoglobulin, which of the following are the end\nproducts?", "options": [{"id": "A", "text": "2 Fc and 1 Fab fragments"}, {"id": "B", "text": "1 variable chain and 1 constant chain"}, {"id": "C", "text": "1 Fe and 2 Fab fragments"}, {"id": "D", "text": "1 Fab and 1 hypervariable region"}], "correctIndex": 2, "correctLetter": "C", "solution": "When papain acts on a molecule of immunoglobulin, the end products are 1 Fc and 2 Fab\nfragments.\nEnzymatic digestion of antibody:\n+ Papain- 2 Fab fragments and one Fc fragment\n+ Pepsin- One F(ab’)2 fragment and many smaller fragments\n* Mercaptoethanol- 2 H and 2 L chains", "questionPages": [35], "solutionPages": [47, 48], "questionFigures": [], "solutionFigures": ["crop-solution-ch2-q15-1", "crop-solution-ch2-q15-2"]}, {"id": "ch2-q16", "chapterId": 2, "chapter": "Components of Immune system", "number": 16, "text": "Affinity maturation is due to:", "options": [{"id": "A", "text": "Isotype switching"}, {"id": "B", "text": "Somatic hypermutation"}, {"id": "C", "text": "mRNA splicing"}, {"id": "D", "text": "VDJ rearrangement"}], "correctIndex": 1, "correctLetter": "B", "solution": "Affinity maturation is due to somatic hypermutation.\nAffinity maturation is the process by which antibodies gain increased affinity, avidity, and\nanti-pathogen activity. It is a result of somatic hypermutation (SHM) of immunoglobulin genes in\nB cells, coupled to selection for antigen binding.\nThis process occurs in the germinal centers and proceeds for weeks after acute infection or\nvaccination, or for many cycles during chronic infection. The resulting antibodies can be highly\nmutated from their germline-encoded counterparts, with increases of several orders of magnitude\nin affinity for antigen compared to the corresponding naive B cell receptors (BCRs).\nOther options:\nOption A: Isotype switching, also known as class switch recombination, is a process where the\nconstant region of the antibody heavy chain is changed, leading to a switch in the antibody isotype\n(e.g., from IgM to IgG). This process is crucial for the functional properties of antibodies but is not\ndirectly involved in affinity maturation.\nOption C: mRNA splicing is a cellular process that involves the removal of introns and the joining\nof exons to generate mature mRNA. While this process is essential for the production of\nfunctional antibodies, it is not specifically associated with affinity maturation. Affinity maturation\nprimarily occurs through somatic hypermutation.\nOption D: VDJ rearrangement is the process by which the variable regions of immunoglobulin\ngenes are assembled from gene segments (V, D, and J segments). This process contributes to the\ndiversity of antibodies but is distinct from affinity maturation. Affinity maturation occurs after\nVDJ rearrangement and is driven by somatic hypermutation in the variable regions.", "questionPages": [35], "solutionPages": [48], "questionFigures": [], "solutionFigures": []}, {"id": "ch2-q17", "chapterId": 2, "chapter": "Components of Immune system", "number": 17, "text": "An immunologist is conducting an experiment to understand precipitation reactions. He\nnotes that on adding excessive amount of antigen to a serum sample containing small amount\nof antibodies, the amount of precipitate formed is less, compared to adding smaller amount\n\n\n\nof antigen to the same sample. What is this phenomenon called?", "options": [{"id": "A", "text": "Pro-zone phenomenon"}, {"id": "B", "text": "Zone of equivalence"}, {"id": "C", "text": "Post-zone phenomenon"}, {"id": "D", "text": "Flocculation phenomenon"}], "correctIndex": 2, "correctLetter": "C", "solution": "This phenomenon is called post-zone phenomenon because it has excessive antigen in the test\nsystem, leading to weak or even absent precipitation.\nLattice hypothesis explains precipitation reactions. The amount of precipitate formed is greatly\ninfluenced by the relative proportions of antigens and antibodies.\n+ Prozone phenomenon is caused by excessive antibodies in the test system. (weak/absent\nprecipitation- false-negative test)\n+ Zone of equivalence- antigen, and antibody are in optimum proportions and maximum\nprecipitation occurs.\n* Post-zone phenomenon is due to the presence of excessive antigen in the test system.\n(weaker/absent precipitation)\nFlocculation: Instead of sedimenting, precipitate remains suspended as floculus.", "questionPages": [35, 36], "solutionPages": [48, 49], "questionFigures": [], "solutionFigures": ["crop-solution-ch2-q17-1"]}, {"id": "ch2-q18", "chapterId": 2, "chapter": "Components of Immune system", "number": 18, "text": "Double diffusion in two dimensions is called as .", "options": [{"id": "A", "text": "Oudin procedure"}, {"id": "B", "text": "Oakley — Fulthrope procedure"}, {"id": "C", "text": "Radial immunodiffusion"}, {"id": "D", "text": "Ouchterlony procedure"}], "correctIndex": 3, "correctLetter": "D", "solution": "Double diffusion in two dimensions is called the Ouchterlony procedure. Ex: Elek’s test for testing\ntoxigenicity in diphtheria bacilli.\nThe images below show the different types of immunodiffusion.", "questionPages": [36], "solutionPages": [49, 50, 51], "questionFigures": [], "solutionFigures": ["crop-solution-ch2-q18-1", "crop-solution-ch2-q18-2"]}, {"id": "ch2-q19", "chapterId": 2, "chapter": "Components of Immune system", "number": 19, "text": "A patient presented to the casualty with the following finding. A positive Nagler's reaction\nconfirmed the presence of lecithinase-producing organisms. What is the principle behind this\ntest?", "options": [{"id": "A", "text": "Precipitation"}, {"id": "B", "text": "Complement fixation test"}, {"id": "C", "text": "Agglutination"}, {"id": "D", "text": "Neutralisation"}], "correctIndex": 3, "correctLetter": "D", "solution": "Nagler’s reaction is an example of a neutralization test. It is done for the detection of\nlecithinase toxin produced by C. perfringens.\nThe alpha-toxin of C. perfringens has phospholipase activity. When grown on a medium\ncontaining egg yolk phospholipid, an area of opacity around the bacterial colonies is seen (Nagler's\npositive). The presence of antitoxin can inhibit this.\nOther examples of neutralization tests are:\n+ Plaque inhibition test- neutralization of bacteriophages\n+ Schick test- neutralization of diphtheria toxin by antitoxin\n+ Anti-streptolysin O test- for beta-hemolytic Streptococci.", "questionPages": [36, 37], "solutionPages": [51, 52], "questionFigures": ["crop-question-ch2-q19-1"], "solutionFigures": ["crop-solution-ch2-q19-1"]}, {"id": "ch2-q20", "chapterId": 2, "chapter": "Components of Immune system", "number": 20, "text": "A patient presents with a painless ulcer on his penis. A Wasserman test is done and is\nreactive. What is the principle of this test?", "options": [{"id": "A", "text": "Precipitation"}, {"id": "B", "text": "Complement fixation"}, {"id": "C", "text": "Agglutination"}, {"id": "D", "text": "Neutralisation"}], "correctIndex": 1, "correctLetter": "B", "solution": "Wassermann's reaction is an example of a complement fixation test. It is a non-specific test for the\ndiagnosis of syphilis.\nAn antigen combines with its (specific) antibody in the presence of complement, and the\nantigen-antibody complex adsorbs the complement. This reaction is not visible and requires the\nuse of an indicator (sheep erythrocytes and the specific anti-erythrocyte antibody).", "questionPages": [37], "solutionPages": [52], "questionFigures": [], "solutionFigures": ["crop-solution-ch2-q20-1"]}, {"id": "ch2-q21", "chapterId": 2, "chapter": "Components of Immune system", "number": 21, "text": "Which of the following activates the classical complement pathway?", "options": [{"id": "A", "text": "Immune complexes"}, {"id": "B", "text": "Mannose residues"}, {"id": "C", "text": "Hydrolysis of C3"}, {"id": "D", "text": "Endotoxins"}], "correctIndex": 0, "correctLetter": "A", "solution": "The classical pathway of complement is activated by immune complexes or antigen-antibody\ncomplexes. (antigen bound to IgM or IgG).\nLipopolysaccharide of gram-negative bacteria activates the alternative complement pathway.\nThe binding of mannose-binding lectin to mannose residues (on the surfaces of Salmonella,\nNeisseria, and Listeria) activates the lectin complement pathway.", "questionPages": [37], "solutionPages": [52, 53], "questionFigures": [], "solutionFigures": ["crop-solution-ch2-q21-1"]}, {"id": "ch2-q22", "chapterId": 2, "chapter": "Components of Immune system", "number": 22, "text": "In the alternate complement pathway, which of the following functions as C3 convertase?", "options": [{"id": "A", "text": "C4b2b"}, {"id": "B", "text": "C3bB"}, {"id": "C", "text": "C3bBb"}, {"id": "D", "text": "C4b2a"}], "correctIndex": 2, "correctLetter": "C", "solution": "C3 convertase in the alternate pathway is C3bBb.\nIn the classical pathway and lectin pathway, the C3 convertase is C4b2a.", "questionPages": [37], "solutionPages": [53], "questionFigures": [], "solutionFigures": ["crop-solution-ch2-q22-1"]}, {"id": "ch2-q23", "chapterId": 2, "chapter": "Components of Immune system", "number": 23, "text": "A 23-year-old girl presents with the finding shown below. She has a history of multiple\nsimilar episodes in the past and reports that some of her family members have similar\ncomplaints. She has no itching. Which of the following is deficient in this patient?", "options": [{"id": "A", "text": "C3b inactivator"}, {"id": "B", "text": "C1, C2, C4"}, {"id": "C", "text": "C1 inhibitor"}, {"id": "D", "text": "C5-C8"}], "correctIndex": 2, "correctLetter": "C", "solution": "This girl presents with features of hereditary angioneurotic edema, which is due to a deficiency of\nC1 inhibitor.\nHereditary angioneurotic edema is an autosomal dominant disorder that is more common than\ncomplement deficiency states. A deficiency of C1 inhibitor leads\n\n\n\nto unregulated activation of kallikrein. This increases the production of vasoactive peptides such\nas bradykinin. It causes episodes of edema affecting the skin and mucosal surfaces such as the\nlarynx and the gastrointestinal tract. This may result in life-threatening asphyxia or nausea,\nvomiting, and diarrhea after minor trauma or emotional stress.\nNote -\n* C1, C2, C4 deficiency - collagen vascular disorders.\n* C5-C8 deficiency - recurrent bacteremia with Neisseria", "questionPages": [37, 38, 39], "solutionPages": [53, 54], "questionFigures": ["crop-question-ch2-q23-1"], "solutionFigures": []}, {"id": "ch3-q1", "chapterId": 3, "chapter": "Structure and Functions of the Immune System & Immune Response", "number": 1, "text": "In which of the following areas do B lymphocytes reside?", "options": [{"id": "A", "text": "Spleen follicles"}, {"id": "B", "text": "Lymph node paracortex"}, {"id": "C", "text": "Periarteriolar lymphoid sheath"}, {"id": "D", "text": "Thymic medulla"}], "correctIndex": 0, "correctLetter": "A", "solution": "B lymphocytes reside in the splenic follicles.\nLymphocytes are part of the adaptive immune system. They include B lymphocytes and T\nlymphocytes. B lymphocytes mature in the bone marrow and then migrate to secondary lymphoid\norgans - follicles of spleen and in follicles of lymph nodes. T lymphocytes are produced in the\nbone marrow but mature in the thymus. They are also present in the periarteriolar lymphoid\nsheaths (PALS) of spleen and paracortex of lymph node.\n\n\n\nIn a lymph node, follicles may contain a central region called germinal centre. This contains B\ncells that have been stimulated by an antigen.", "questionPages": [55], "solutionPages": [62], "questionFigures": [], "solutionFigures": ["crop-solution-ch3-q1-1"]}, {"id": "ch3-q2", "chapterId": 3, "chapter": "Structure and Functions of the Immune System & Immune Response", "number": 2, "text": "A mother brings her 1-year-old child to the hospital with complaints that he turns blue while\nbreastfeeding. It resolves when he assumes a squatting position. On examination, a cleft\npalate is seen. Labs show hypocalcemia. Which of the following abnormalities is expected to\nbe seen in the lymphoid organs?", "options": [{"id": "A", "text": "Decreased size of germinal centres of lymph nodes"}, {"id": "B", "text": "Decreased size of paracortical areas of lymph nodes"}, {"id": "C", "text": "Increased size of splenic follicles"}, {"id": "D", "text": "Increased size of the peri arteriolar lymphoid sheath of spleen"}], "correctIndex": 1, "correctLetter": "B", "solution": "Turning blue on breastfeeding with resolution on squatting describes a tet-spell or a cyanotic\nspell, indicating a congenital cardiac defect. Cleft palate, cardiac defects and hypocalcemia\n(parathyroid hypoplasia/aplasia) suggest a diagnosis of DiGeorge syndrome. In this disorder,\na decreased size of paracortical areas of lymph nodes is noted.\nDiGeorge syndrome is characterised by thymic aplasia, causing a deficiency of T cells and absent\ncell-mediated immunity. Thus, paracortical areas of lymph nodes and periarteriolar sheaths of the\nspleen, where T cells reside, are reduced in size. B cells are usually not affected.", "questionPages": [55], "solutionPages": [62, 63], "questionFigures": [], "solutionFigures": []}, {"id": "ch3-q3", "chapterId": 3, "chapter": "Structure and Functions of the Immune System & Immune Response", "number": 3, "text": "Match the following specialized macrophages with the tissues they are found in.", "options": [{"id": "A", "text": "I-A; II-C; III-D; IV-E; V-B"}, {"id": "B", "text": "I-C; II-B; III-D; IV-E; V-A"}, {"id": "C", "text": "I-D; II-C; I-A; IV-B; V-E"}, {"id": "D", "text": "I-B; II-C; III-D; IV-E; V-A"}], "correctIndex": 3, "correctLetter": "D", "solution": "The correct answer is I-B; II-C; IIJ-D; IV-E; V-A.\nMacrophages can be divided into:\n1. Blood macrophages (monocytes) are the largest of the myeloid cells found in the peripheral\nblood. They survive for 3 days.\n2. Tissue macrophages present in different organs. They survive for months.\nThe main functions of macrophages are phagocytosis and antigen presentation.\nThe specialised (tissue-specific) macrophages present in different tissues are listed below:\n+ Peripheral blood: Monocytes\n+ Placenta: Hofbauer cells\n+ Liver: Kupffer cells\n* Brain: Microglial cells\n* Kidney: Mesangial cells\n* Lungs: Alveolar

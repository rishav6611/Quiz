scopy is being done. They are not\nuseful for culture or animal pathogenicity testing.", "questionPages": [164, 165], "solutionPages": [170, 171], "questionFigures": [], "solutionFigures": []}, {"id": "ch10-q4", "chapterId": 10, "chapter": "Mycobacteria Tuberculosis", "number": 4, "text": "A patient with suspected tuberculosis gives a sputum sample for microscopic examination.\nWhat is the minimum number of acid-fast bacilli that should be present in 1 mL of sputum\nfor them to be detected by this method?", "options": [{"id": "A", "text": "100"}, {"id": "B", "text": "1000"}, {"id": "C", "text": "10000"}, {"id": "D", "text": "10"}], "correctIndex": 2, "correctLetter": "C", "solution": "At least 10,000 acid-fast bacilli should be present per milliliter of sputum for them to be readily\ndemonstrable in direct smears.\nSlide reporting as per NTEP guidelines:", "questionPages": [165], "solutionPages": [171], "questionFigures": [], "solutionFigures": ["crop-solution-ch10-q4-1"]}, {"id": "ch10-q5", "chapterId": 10, "chapter": "Mycobacteria Tuberculosis", "number": 5, "text": "A patient has chronic cough with occasional blood in the sputum. He has a history of\nsignificant weight loss and night sweats. Which of the following media cannot be used to\nculture the organism causing his symptoms?", "options": [{"id": "A", "text": "BACTEC 460"}, {"id": "B", "text": "Middlebrook 7H10"}, {"id": "C", "text": "Loefflers medium"}, {"id": "D", "text": "McLeod's Medium"}], "correctIndex": 3, "correctLetter": "D", "solution": "This patient with chronic cough and hemoptysis with a concurrent history of significant weight\nloss and night sweats most likely has tuberculosis, caused by Mycobacterium tuberculosis.\nMcLeod's medium is not used to culture M. tuberculosis. It is a selective medium for\nCorynebacterium diphtheriae.\nCulture media used to cultivate Mycobacterium tuberculosis include:\n+ Solid- Loeffler's medium is a serum-containing solid medium used for the culture of M.\ntuberculosis. Other solid media used include Lowenstein- Jensen medium, Dorset medium,\nTarshis medium, and Pawlowsky's medium.\n\n\n\n* Liquid- Middlebrook’s media are used for the preparation of antigens and vaccines and in\nsensitivity testing. Other examples of liquid mycobacterial culture media include Dubos' medium,\nSula's medium and Sauton's medium.\n+ Automated culture methods:\n* BACTEC 460- uses radioisotopes for detection\n* BacT alert- colorimetric method of detection\n* BACTEC MGIT- fluorometric detection method.", "questionPages": [165], "solutionPages": [171, 172, 173], "questionFigures": [], "solutionFigures": ["crop-solution-ch10-q5-1", "crop-solution-ch10-q5-2"]}, {"id": "ch10-q6", "chapterId": 10, "chapter": "Mycobacteria Tuberculosis", "number": 6, "text": "A microbiology resident is performing liquid automated culture on the sputum sample of a\nTB suspect patient. Which of the following culture media would he not use for the same?", "options": [{"id": "A", "text": "BactiAlert"}, {"id": "B", "text": "Versatrek"}, {"id": "C", "text": "BACTEC MGIT 960"}, {"id": "D", "text": "Tarshis"}], "correctIndex": 3, "correctLetter": "D", "solution": "Tarshis medium is a solid growth medium used for culturing mycobacterium species. Versatrek,\nBactiAlert, and BACTEC MGIT 960 are liquid automated cultures used for tuberculosis.\nThe diagnostic tools for TB are as follows:\n1. Sputum microscopy for AFB\n+ Zieh] Neelson staining\n+ Fluorescence staining\n2. Culture\n+ Solid media— Lowenstein-Jensen (most common), Petragnini and\nDorset, Tarshis, Loeffler, Pawlowsky.\n* Liquid automated culture — Versatrek, BactiAlert, BACTEC MGIT 960 (MGIT stands for\nMycobacteria Growth Indicator Tube)\n* Drug Sensitivity Testing / Proportionate Sensitivity Testing:\n* Using MGIT, LJ medium\n3. Rapid molecular diagnostic testing\n+ Line probe assay\n* CB-NAAT- Nucleic acid amplification test using GeneXpert system\n4. Other diagnostic tools are as follows:\n* Chest X-ray\n+ Tuberculin sensitivity testing", "questionPages": [165, 166], "solutionPages": [173, 174], "questionFigures": [], "solutionFigures": []}, {"id": "ch10-q7", "chapterId": 10, "chapter": "Mycobacteria Tuberculosis", "number": 7, "text": "Which of the following tests can simultaneously detect TB and rifampicin resistance in <2\nhours?", "options": [{"id": "A", "text": "LAM detection by ELISA"}, {"id": "B", "text": "Xpert MTB/RIF"}, {"id": "C", "text": "BACTEC MGIT"}, {"id": "D", "text": "Line probe assay"}], "correctIndex": 1, "correctLetter": "B", "solution": "Xpert MTB/RIF detects tuberculosis (TB) and rifampicin resistance simultaneously within 2\nhours. It is a fully automated, real-time nucleic acid amplification technology, with high specificity\nand sensitivity.\nThe WHO recommends its use worldwide as the initial diagnostic test in adults and children who\nare presumed to have multi-drug resistant tuberculosis (MDR-TB) or HIV-associated TB. Xpert\nMTBIRIF should also be the first test applied to the cerebrospinal fluid (CSF) of patients in whom\ntubercular meningitis is suspected as well as a replacement test (over conventional microscopy,\nculture, and histopathology) for gastric lavage, pleural and other biopsies, and fine-needle\naspiration specimens.\nThe image below shows the Xpert MTB/RIF system.", "questionPages": [166], "solutionPages": [174], "questionFigures": [], "solutionFigures": ["crop-solution-ch10-q7-1"]}, {"id": "ch10-q8", "chapterId": 10, "chapter": "Mycobacteria Tuberculosis", "number": 8, "text": "Which of the following is not a method of testing drug susceptibility in Mycobacterium\ntuberculosis?", "options": [{"id": "A", "text": "Radiometric broth method"}, {"id": "B", "text": "Molecular method"}, {"id": "C", "text": "Disc diffusion method"}, {"id": "D", "text": "Proportion Method"}], "correctIndex": 2, "correctLetter": "C", "solution": "Disc diffusion method is used for drug susceptibility testing for most bacteria; however, it is not\nused for Mycobacterium tuberculosis.\nThe disc diffusion technique is not suitable for testing Mycobacterium tuberculosis because the\norganism grows so slowly that the drug has time to diffuse throughout the medium, and sharp\nzones of inhibition are not seen.\n\n\n\nMethods used in the drug susceptibility testing of M.tb include:\nFor agar-based methods, 7H10 or 7H11 Middlebrook media are used and only the proportion\nmethod can be applied.\nRadiometric techniques measure the metabolic activity of the bacteria. Based on changes in these\nvalues, drug susceptibility can be estimated.", "questionPages": [166], "solutionPages": [174, 175], "questionFigures": [], "solutionFigures": ["crop-solution-ch10-q8-1", "crop-solution-ch10-q8-2"]}, {"id": "ch10-q9", "chapterId": 10, "chapter": "Mycobacteria Tuberculosis", "number": 9, "text": "TB test done only on whole blood sample is .", "options": [{"id": "A", "text": "TrueNat TB"}, {"id": "B", "text": "Gene xpert"}, {"id": "C", "text": "Interferon gamma release assay"}, {"id": "D", "text": "All the above"}], "correctIndex": 2, "correctLetter": "C", "solution": "TB test done on a whole blood sample is the interferon-gamma release assay. It has been used for\nthe diagnosis of latent tuberculosis in patients with HIV(who frequently have a negative Mantoux\ntest).\nInterferon-gamma release assays include:\n* QuantiFERON-TB Gold\n+ T-SPOT.TB\nQuantiFERON-TB Gold quantitates the amount of IFN-y produced by CD4+ T cells in response to\nthe antigens from Mycobacterium tuberculosis. QuantiFERON-TB Gold Plus (QFT- Plus) is an\nimproved version of the QuantiFERON-TB Gold test. QuantiFERON-TB Gold detects only\nTB-specific CD4+ responses. However, QuantiFeron-TB Gold Plus detects both CD8+ and CD4+\nT-cell responses to TB-specific antigens.\nT-SPOT.TB determines the total number of individual effector T cells expressing IFN-y.\n\n\n\nThe TrueNat TB test is a new molecular test that can diagnose TB in one hour as well as test for\nrifampicin resistance. This test uses a sputum sample taken from the patient. Only about 0.5 ml of\nthe sample is required. Gene Xpert is also a molecular method of testing that cannot use blood as\na sample. (Option A and B)", "questionPages": [166], "solutionPages": [175, 176], "questionFigures": [], "solutionFigures": []}, {"id": "ch10-q10", "chapterId": 10, "chapter": "Mycobacteria Tuberculosis", "number": 10, "text": "A urine LAM (Lipoarabinomannan) assay was performed in an HIV +ve patient with a CD4+\ncount of 40/uL. Infection with which of the following organisms can be diagnosed using this\ntest?", "options": [{"id": "A", "text": "M. tuberculosis"}, {"id": "B", "text": "M. leprae"}, {"id": "C", "text": "Mycoplasma"}, {"id": "D", "text": "Listeria monocyogenes"}], "correctIndex": 0, "correctLetter": "A", "solution": "Urine lipoarabinomannan (LAM) assay is used for the diagnosis of tuberculosis.\nLipoarabinomannan (LAM) antigen is a lipopolysaccharide present in the mycobacterial cell wall,\nreleased from metabolically active cells or degenerating cells of patients having tuberculosis.\nUrine LAM is a useful tool in diagnosing tuberculosis, especially in patients with HIV and low\nCD4+ T cell count.\nMost diagnostic tests for tuberculosis rely on sputum samples, which are difficult to obtain and\nhave low sensitivity in immunocompromised patients, patients with disseminated TB, and\nchildren, delaying treatment initiation. Lipoarabinomannan (LAM) is the only WHO-endorsed TB\nbiomarker that can be detected in urine, an easily collected sample.", "questionPages": [166, 167], "solutionPages": [176], "questionFigures": [], "solutionFigures": ["crop-solution-ch10-q10-1"]}, {"id": "ch10-q11", "chapterId": 10, "chapter": "Mycobacteria Tuberculosis", "number": 11, "text": "A middle-aged man came with a history of fever and night sweats for the past 2 weeks. He has\nhad noticeable weight loss. Bronchoalveolar lavage was done, but Mycobacterium\ntuberculosis was not detected. Extra-pulmonary TB is suspected. Which site is most likely\naffected?", "options": [{"id": "A", "text": "Genitourinary tract"}, {"id": "B", "text": "Skeletal system"}, {"id": "C", "text": "Gastrointestinal tract"}, {"id": "D", "text": "Lymph nodes"}], "correctIndex": 3, "correctLetter": "D", "solution": "Lymph nodes are the most common site of extrapulmonary TB.\nThe diagnosis is established by fine needle aspiration biopsy.\nIn descending order of frequency, the extrapulmonary sites most commonly involved in TB are:\n+ lymph nodes\n+ pleura\n* genitourinary tract\n\n\n\n* bones and joints\n* meninges, peritoneum and pericardium.\nIn less than 50% of these cases, there is associated pulmonary disease.", "questionPages": [167], "solutionPages": [176, 177], "questionFigures": [], "solutionFigures": []}, {"id": "ch10-q12", "chapterId": 10, "chapter": "Mycobacteria Tuberculosis", "number": 12, "text": "Your neighbour is worried about a scar on her 5-month-old daughter's arm that is shown\nbelow. She tells you the child has received all vaccines on time. Which of the following\nstatements is true about the vaccine that caused this finding?", "options": [{"id": "A", "text": "Distilled water is used as diluent for this vaccine"}, {"id": "B", "text": "The dose administered is 0.5 ml"}, {"id": "C", "text": "The route of administration is subcutaneous"}, {"id": "D", "text": "WHO recommends Danish 1331 strain for vaccine"}], "correctIndex": 3, "correctLetter": "D", "solution": "The scar shown in the image results from the BCG (Bacillus Calmette-Guérin) vaccine. The WHO\nrecommends Danish 1331 strain for BCG vaccine production.\nNormal saline is recommended as the diluent for the BCG vaccine as distilled water is an irritant.\nThe dose administered is 0.1ml containing 0.1mg.\nIt is administered intradermally by using 26 gauge tuberculin syringe on the left deltoid.", "questionPages": [167, 168], "solutionPages": [177], "questionFigures": ["crop-question-ch10-q12-1"], "solutionFigures": []}, {"id": "ch10-q13", "chapterId": 10, "chapter": "Mycobacteria Tuberculosis", "number": 13, "text": "You are performing the pre-employment check up of a young man. You need to perform a\ntuberculin skin test as a part of this process. Which of the following tests would you not use\nfor this purpose?", "options": [{"id": "A", "text": "Pirquet test"}, {"id": "B", "text": "Heaf test"}, {"id": "C", "text": "QuantiFERON-TB gold"}, {"id": "D", "text": "Tine test"}], "correctIndex": 2, "correctLetter": "C", "solution": "QuantiFERON-TB gold is not a type of tuberculin skin test. It is a type of interferon-gamma\nrelease assays (IGRAs), a whole-blood test that can aid in diagnosing Mycobacterium tuberculosis\ninfection.\nThere are 3 described methods for tuberculin skin testing (TST):\n* Mantoux test, also known as the Pirquet test (preferred method)\n+ Heaf test\n+ Tine test\nIn contrast, IGRAs that have been approved by the FDA are:\n* QuantiFERON-TB Gold In-Tube test (QFT-GIT)\n+ T-SPOT.TB test (T-Spot)\n* QuantiFERON-TB Gold Plus (QFT- Plus)\nIGRA is not used in India due to a higher probability of a false positive due to universal BCG\nvaccination. It can also lead to a diagnosis of active TB in a patient with latent TB and may lead to\novertreatment. This test is banned in India after the WHO advised against it in low and\nmiddle-income countries.", "questionPages": [168], "solutionPages": [177], "questionFigures": [], "solutionFigures": []}, {"id": "ch11-q1", "chapterId": 11, "chapter": "Other Mycobacteria", "number": 1, "text": "Which of the following is a pigment-producing species of mycobacteria?", "options": [{"id": "A", "text": "M. ulcerans"}, {"id": "B", "text": "M. scrofulaceum"}, {"id": "C", "text": "M. avium intracellulare complex"}, {"id": "D", "text": "M. xenopi"}], "correctIndex": 1, "correctLetter": "B", "solution": "Mycobacterium scrofulaceum is a pigment-producing species of mycobacteria.\nM. scrofulaceum is a scotochromogen which produces yellow or orange colored pigments, even in\nthe dark. It belongs to group II of Runyon's classification. It can cause scrofula or cervical adenitis\nin children.\nM.ulcerans, M.avium intracellulare complex (MAC), and M. xenopi belong to group IIJ-non\nphotochromogens as they do not form pigment even on exposure to light.", "questionPages": [178], "solutionPages": [183], "questionFigures": [], "solutionFigures": []}, {"id": "ch11-q2", "chapterId": 11, "chapter": "Other Mycobacteria", "number": 2, "text": "A microbiologist working with mycobacteria notes moist, smooth, flat, white colonies growing\non Lowenstein-Jensen media. Which species of mycobacteria is she likely studying?", "options": [{"id": "A", "text": "Mycobacterium tuberculosis"}, {"id": "B", "text": "Mycobacterium bovis"}, {"id": "C", "text": "Mycobacterium kansasii"}, {"id": "D", "text": "Mycobacterium avium-intracellulare"}], "correctIndex": 1, "correctLetter": "B", "solution": "The species of mycobacteria being studied here is Mycobacterium bovis. It forms moist, smooth,\nflat, white colonies on Lowenstein-Jensen (LJ) media that break-up easily when touched.\nMycobacterium bovis belongs to the Mycobacterium tuberculosis complex. It causes\ntuberculosis-like disease in humans.\nLowenstein—Jensen medium is a commonly used, egg-based, selective media for mycobacteria. It\ncontains:\n+ Egg- Provides fatty acids and protein required for metabolism\n* Malachite green- Prevents the growth of contaminants. Makes it a selective medium.\n* Mineral salt solution- Buffer\n* Glycerol- Source of carbon, favors growth of M. tuberculosis, but not M. bovis. LJ medium\nwithout glycerol, which contains pyruvate, is used for culture of M. bovis.\n+ L-asparagine- Nitrogen source\nThe image below shows M.bovis colonies on LJ media.\nMycobacterium tuberculosis colonies on LJ medium are dry, rough, raised and irregular with a\nwrinkled surface. They are creamy white or buff-colored, tenacious and difficult to\nemulsify(rough, tough, buff).", "questionPages": [178], "solutionPages": [183, 184], "questionFigures": [], "solutionFigures": ["crop-solution-ch11-q2-1", "crop-solution-ch11-q2-2"]}, {"id": "ch11-q3", "chapterId": 11, "chapter": "Other Mycobacteria", "number": 3, "text": "The following findings are obtained during biochemical testing of a mycobacterial species.\nIdentify the organism.", "options": [{"id": "A", "text": "M. bovis"}, {"id": "B", "text": "M. tuberculosis"}, {"id": "C", "text": "M. simiae"}, {"id": "D", "text": "M. kansasii"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given biochemical findings are characteristic of Mycobacterium simiae. Eventhough atypical\nmycobacteria or non-tuberculous mycobacteria(NTM) are usually niacin test negative, some NTM\nlike M. simiae and M. chelonae give a positive niacin test positive.\nMycobacteria can be identified based on their biochemical reactions as follows:\nThe first four tests are used to distinguish between M. tb complex and atypical mycobacteria while\nthe last four tests are used to distinguish between M. tb and M. bovis.", "questionPages": [178], "solutionPages": [184], "questionFigures": [], "solutionFigures": ["crop-solution-ch11-q3-1"]}, {"id": "ch11-q4", "chapterId": 11, "chapter": "Other Mycobacteria", "number": 4, "text": "A 54-year-old male presents with an ulcer on his hand. On swab culture, growth of M.\nulcerans is seen. What is the diagnosis?", "options": [{"id": "A", "text": "Hunner’s ulcer"}, {"id": "B", "text": "Meleney’s ulcer"}, {"id": "C", "text": "Buruli ulcer"}, {"id": "D", "text": "Marjolin's ulcer"}], "correctIndex": 2, "correctLetter": "C", "solution": "Mycobacterium ulcerans causes Buruli ulcer.\nM. ulcerans produces a toxin called mycolactone which leads to formation of Buruli ulcer. This is\na chronic, debilitating, necrotizing disease of the skin and soft tissue which is characterized by the\nformation of ulcers that progressively enlarge over time if left untreated. The ulcers heal with\ndisfiguring scars.\nThe image below shows a Buruli ulcer.\n¥ ~\nOption A: Hunner's ulcers are seen in a subset of patients with interstitial cystitis. These are areas\nof inflammation on the bladder wall.\nThe image below shows a cystoscopic image of a Hunner's ulcer.\nOption B: Meleney's ulcer or post-operative synergistic bacterial gangrene occurs in\nimmuno-compromised individuals following abdominal surgery. It is caused by a synergistic\ninteraction between microaerophilic nonhemolytic Streptococcus and hemolytic aerobic\nStaphylococcus aureus.\n\n\n\nOption D: Marjolin ulcer is a rare and aggressive form of squamous cell carcinoma that grows\nfrom burns, scars, or poorly healing wounds.\nThe image below shows a Marjolin's ulcer in a burn scar.", "questionPages": [178, 179], "solutionPages": [184, 185, 186], "questionFigures": [], "solutionFigures": ["crop-solution-ch11-q4-1", "crop-solution-ch11-q4-2"]}, {"id": "ch11-q5", "chapterId": 11, "chapter": "Other Mycobacteria", "number": 5, "text": "A 42-year-old man who works at an aquarium and handles the fish without protective\nequipment presents to the OPD with the following finding. Infection with which of the\nfollowing bacteria led to his condition?", "options": [{"id": "A", "text": "M. kansasi"}, {"id": "B", "text": "M. marinum"}, {"id": "C", "text": "M. paratuberculosis"}, {"id": "D", "text": "M. gordonae"}], "correctIndex": 1, "correctLetter": "B", "solution": "The image shows a fish tank granuloma that is caused by M. marinum.\nThe typical clinical presentation is as a single, small violet papule or nodule confined to one\nextremity, developing 2-3 weeks after trauma. The nodule may break down to form an indolent\nulcer. M. marinarum is a natural pathogen of fish and amphibians, which spreads to humans who\ncome in contact with contaminated swimming pools or fish tanks.\nOther non-tuberculous mycobacteria causing disease in humans include:\n+ M. kansasii: Disease resembles pulmonary TB\n*M. scrofulaceum: Cervical lymphadenitis\n+ M. avium complex: Pulmonary, disseminated TB, especially in AIDS patients\n+ M. fortuitum: Nail salon furunculosis\nM. paratuberculosis (aka Johne’s bacillus) causes Johne’s disease in cattle. It is associated with\nCrohn’s disease in humans.", "questionPages": [179], "solutionPages": [186], "questionFigures": ["crop-question-ch11-q5-1"], "solutionFigures": []}, {"id": "ch11-q6", "chapterId": 11, "chapter": "Other Mycobacteria", "number": 6, "text": "Which of the following statements is true about the microbiological diagnosis of the disease\nafflicting the patient shown below?", "options": [{"id": "A", "text": "Acid fast staining is done by Ziehl-Neelsen technique, using 25% sulphuric acid"}, {"id": "B", "text": "Sample should be collected from the centre of the lesion"}, {"id": "C", "text": "The number of samples to be collected is 3-4"}, {"id": "D", "text": "It is cultivated in nine banded armadillos and foot pads of mice"}], "correctIndex": 3, "correctLetter": "D", "solution": "The image depicts leonine facies in a patient suffering from leprosy or Hansen's disease caused by\nMycobacterium leprae. It is cultivated in nine-banded armadillos and footpads of mice.\n\n\n\nM. leprae is a Gram-positive, weakly acid fast bacillus. Thus, 5% sulphuric acid (option A) is used\nfor decolourisation to demonstrate M.leprae's acid-fastness. On microscopy, the bacilli appear\nbound together in masses called globi, within which they are arranged in a 'cigar bundle’\nappearance.\nFor leprosy diagnosis, specimens are collected from the nasal mucosa, skin lesions and earlobes.\nNasal smears are collected from the internal septum of the nose. Skin smears are collected from\nthe edges of the lesions (option B) rather than from the centre. Slit skin smears are taken as well.\nThe skin is pinched up tight to minimise bleeding and a cut is made with a scalpel, deep enough to\nget into the infiltrated layers. This is done over the buttocks, forehead, chin, cheek, and ears (at\nleast 5-6 different areas) (option C).", "questionPages": [179, 180], "solutionPages": [186, 187], "questionFigures": ["crop-question-ch11-q6-1"], "solutionFigures": []}, {"id": "ch11-q7", "chapterId": 11, "chapter": "Other Mycobacteria", "number": 7, "text": "What is the generation time of lepra bacilli?", "options": [{"id": "A", "text": "12-13 days"}, {"id": "B", "text": "12-13 hours"}, {"id": "C", "text": "15-20 hours"}, {"id": "D", "text": "1 month"}], "correctIndex": 0, "correctLetter": "A", "solution": "The generation time of lepra bacilli is 12-13 days.\nGeneration time, also known as doubling time, is the time it takes for the bacterial population to\ndouble. It can also be measured as the time between two cell divisions under optimum conditions.\nThe generation time of different bacilli are given below:\n+ Lepra bacilli- 12-13 days average (may vary from 8-42 days)\n* Tubercle bacilli- 15-20 hours\n* Coliform bacilli- 20 minutes", "questionPages": [180], "solutionPages": [187], "questionFigures": [], "solutionFigures": []}, {"id": "ch11-q8", "chapterId": 11, "chapter": "Other Mycobacteria", "number": 8, "text": "What are the bacteria present in Virchow's cells?", "options": [{"id": "A", "text": "M. avium intercellulare"}, {"id": "B", "text": "M. tuberculosis"}, {"id": "C", "text": "M. bovis"}, {"id": "D", "text": "M. leprae"}], "correctIndex": 3, "correctLetter": "D", "solution": "The bacteria present in Virchows cells is M. leprae.\nLepromatous leprosy lesions contain large aggregates of lipid laden macrophages (lepra\ncells/Virchow cells) which are often filled with globi (masses) of acid fast bacilli.\nThe image below shows a high-power Fite-Faraco stain of a skin lesion showing globi of M.leprae.", "questionPages": [180, 181], "solutionPages": [187, 188], "questionFigures": [], "solutionFigures": ["crop-solution-ch11-q8-1"]}, {"id": "ch11-q9", "chapterId": 11, "chapter": "Other Mycobacteria", "number": 9, "text": "You counsel a patient with leprosy about lepra reactions before starting her on multidrug\ntherapy. Which among these is correct regarding these reactions?", "options": [{"id": "A", "text": "1, 2 and 4"}, {"id": "B", "text": "3 and 5 only"}, {"id": "C", "text": "2,4 and5"}, {"id": "D", "text": "1 and 2 only"}], "correctIndex": 2, "correctLetter": "C", "solution": "Statements 2, 4, and 5 regarding lepra reactions are correct.\nType 2 lepra reactions are unrelated to drug therapy, whereas type 1 reactions may occur within a\nyear of starting treatment.\nNew lesions typically appear in type 2 lepra reactions. They are tender and erythematous\nsubcutaneous and dermal nodules. Existing lesions show no changes.", "questionPages": [181], "solutionPages": [188], "questionFigures": [], "solutionFigures": []}, {"id": "ch11-q10", "chapterId": 11, "chapter": "Other Mycobacteria", "number": 10, "text": "A patient diagnosed with leprosy was undergoing further evaluation for classification of type\nand immune response. Which of the following statements is false regarding the intradermal\ntest used in such evaluation?", "options": [{"id": "A", "text": "Negative in children &1lt;6 month age"}, {"id": "B", "text": "It has no value in prognostication of leprosy"}, {"id": "C", "text": "Used to classify leprosy"}, {"id": "D", "text": "BCG vaccine may convert a negative test to positive"}], "correctIndex": 1, "correctLetter": "B", "solution": "The lepromin test has value as a prognostic test for leprosy.\nThe lepromin, or Mitsuda test, is a method to measure cellular immunity in leprosy. It is a skin\ntest for delayed hypersensitivity to lepra antigens. A bacillary suspension of inactivated M. leprae\nis injected just under the skin and the induration reaction is measured 3-4 weeks after.\nIt is used to classify leprosy. A negative lepromin test is seen in lepromatous and borderline\nleprosy. It is negative in children <6 months of age, it may be positive at the end of 1st\nyear. BCG vaccine is capable of converting a negative lepromin test to a positive.", "questionPages": [181], "solutionPages": [188], "questionFigures": [], "solutionFigures": []}, {"id": "ch11-q11", "chapterId": 11, "chapter": "Other Mycobacteria", "number": 11, "text": "You are performing the test shown in the image on a patient. How many days later do you ask\nthe patient to return so that you get an accurate read on the Mitsuda reaction?", "options": [{"id": "A", "text": "3 days"}, {"id": "B", "text": "10 days"}, {"id": "C", "text": "20 days"}, {"id": "D", "text": "30 days"}], "correctIndex": 2, "correctLetter": "C", "solution": "Mitsuda's reaction is read in the 3rd week, i.e., on the 21st day or 20 days after the day of\ninjection.\nLepromin test is a skin test for delayed hypersensitivity to lepra antigens. It is the only method for\nstudying immunity in leprosy. A bacillary suspension of inactivated M. leprae is injected just\n\n\n\nunder the skin.\nThe first reaction to occur is the early reaction of Fernandez, which consists of erythema and\ninduration developing in 24-48 hours. It usually remains for 3-5 days; it is usually poorly defined\nand carries less significance. The second and more meaningful result is the late reaction of\nMitsuda, starting at 1-2 weeks (7-10 days), reaching a peak in three or four weeks, and gradually\nsubsiding over the next few weeks. On the 21st day, if there is a nodule more than 5 mm in\ndiameter, the reaction is said to be positive.\nNote: The 21st day is 20 days after the day of injection which is counted as the 1st day.", "questionPages": [181, 182], "solutionPages": [188, 189], "questionFigures": ["crop-question-ch11-q11-1"], "solutionFigures": []}, {"id": "ch11-q12", "chapterId": 11, "chapter": "Other Mycobacteria", "number": 12, "text": "A leprosy vaccine is being introduced on a pilot basis in India. Which of the following\nmycobacterial species is the basis for its development?", "options": [{"id": "A", "text": "M. vaccae"}, {"id": "B", "text": "M. bovis Danish 1331 strain"}, {"id": "C", "text": "M.leprae murium"}, {"id": "D", "text": "M. indicus pranii"}], "correctIndex": 3, "correctLetter": "D", "solution": "Mycobacterium indicus pranii is the basis for the development of a leprosy vaccine.\nThe leprosy vaccine species was originally called Mycobacterium W (M.w) but was later renamed\nMycobacterium indicus pranii. The vaccine is administered via intradermal route. The dose is 0.1\nml. It is divided into two equal doses and given on both arms.\nBooster doses will be given to maintain the immunity level. These are given only in one arm.", "questionPages": [182], "solutionPages": [189], "questionFigures": [], "solutionFigures": []}, {"id": "ch12-q1", "chapterId": 12, "chapter": "Escherichia, Proteus and Klebsiella", "number": 1, "text": "An old woman presented to the OPD with dysuria and frequent micturition. Urinalysis\nshowed pus cells, and culture on MacConkey agar showed the following. Which organism is\ninvolved here?", "options": [{"id": "A", "text": "Escherichia"}, {"id": "B", "text": "Salmonella"}, {"id": "C", "text": "Shigella"}, {"id": "D", "text": "Proteus"}], "correctIndex": 0, "correctLetter": "A", "solution": "This patient who presented with dysuria and frequent micturition with urinalysis showing pus\ncells, and growth of lactose-fermenting colonies on MacConkey agar suggests a diagnosis of\nurinary tract infection by Escherichia coli.\nEnterobacteriaceae family is classified based on their action on lactose present in MacConkey's\nmedium as:\n+ Lactose fermenters - Escherichia, Klebsiella\n+ Late lactose fermenters - Shigella sonnei\n* Non-lactose fermenters- Salmonella species, Shigella species\nThe image below shows lactose fermenting and non-lactose fermenting colonies on MacConkey\nagar.\nMnemonic to remember non-lactose fermenters: (SPY PSM)\n* Salmonella\n¢ Proteus\n+ Yersinia\n* Providencia- late fermenter\n* Shigella (except S.sonnei which is a late lactose fermenter)\n\n\n\n* Morganella", "questionPages": [190], "solutionPages": [199], "questionFigures": ["crop-question-ch12-q1-1"], "solutionFigures": ["crop-solution-ch12-q1-1"]}, {"id": "ch12-q2", "chapterId": 12, "chapter": "Escherichia, Proteus and Klebsiella", "number": 2, "text": "The stool culture of a patient with suspected food poisoning produced hemolytic colonies on\nblood agar. The isolated organism gave a positive indole test and a positive MUG test. You\nobserve the following colonies on eosin methylene blue agar. Identify the organism.", "options": [{"id": "A", "text": "Escherichia coli"}, {"id": "B", "text": "Klebsiella pneumoniae"}, {"id": "C", "text": "Proteus vulgaris"}, {"id": "D", "text": "Klebsiella granulomatis"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given scenario of a patient with suspected food poisoning with stool culture growing\nhemolytic colony on blood agar with a positive indole test and MUG test with a iridescent green\ncolony growth on eosin methylene blue agar is characteristic of Escherichia coli.\nE. coli produces the enzyme f-glucuronidase which is tested using the MUG test. In it, the\nsubstrate MUG (4-methylumbelliferyl-B-glucuronide) is reduced by the enzyme to produce a\nfluorescent color which indicates a positive MUG test.", "questionPages": [190, 191], "solutionPages": [199], "questionFigures": ["crop-question-ch12-q2-1"], "solutionFigures": []}, {"id": "ch12-q3", "chapterId": 12, "chapter": "Escherichia, Proteus and Klebsiella", "number": 3, "text": "What is the cut-off for bacteriuria beyond which a diagnosis of catheter-associated urinary\ntract infection (CAUTI) can be made?", "options": [{"id": "A", "text": ">10%2 CFU/ml"}, {"id": "B", "text": ">10%3 CFU/ml"}, {"id": "C", "text": ">10%4 CFU/ml"}, {"id": "D", "text": ">10%5 CFU/ml"}], "correctIndex": 1, "correctLetter": "B", "solution": "The cut-off value for bacteriuria to diagnose catheter-associated urinary tract infection (CAUTI) is\n>103 CFU/mL.\nThe minimum criterion for catheter-associated asymptomatic bacteriuria (CA-ASB)\nis >102 CFU/mL.", "questionPages": [191], "solutionPages": [199], "questionFigures": [], "solutionFigures": []}, {"id": "ch12-q4", "chapterId": 12, "chapter": "Escherichia, Proteus and Klebsiella", "number": 4, "text": "A tourist came to the OPD with complaints of abdominal pain and watery diarrhea. Which of\nthe following strains of E. coli is most commonly implicated in this case?", "options": [{"id": "A", "text": "Enteropathogenic E. coli"}, {"id": "B", "text": "Enterohemorrhagic E. coli"}, {"id": "C", "text": "Enterotoxigenic E. coli"}, {"id": "D", "text": "Enteroinvasive E. coli"}], "correctIndex": 2, "correctLetter": "C", "solution": "This patient with watery diarrhea most likely has traveller’s diarrhea caused by Enterotoxigenic\nEscherichia coli (ETEC).\nEnterotoxigenic E. coli (ETEC) is the most common organism that causes diarrhea in travelers. It\nproduces the following toxins:\n+ LT (heat-labile toxin) - acts by TeAMP\n+ ST (heat-stable toxin) - two types of ST are known, ST-A (ST-I) and ST-B (ST-II)\n* ST-A is soluble in methanol and acts by T cGMP in the intestine.\n¢ ST-B is insoluble in methanol, and the mode of action is not known.\nOther options:\nOption A: Enteropathogenic E. coli (EPEC) causes infantile diarrhea in developing countries. It\nadheres to the mucosal surface of the small intestine using E. coli adherent factor (EAF) and locus\nof enterocyte effacement (LEE) and causes effacement of microvilli.\nOption B: Enterohemorrhagic E. coli (EHEC) produces verocytotoxin, which targets vascular\nendothelium. It causes hemorrhagic colitis and hemolytic uremic syndrome.\nOption D: Enteroinvasive E.coli (EIEC) invades interstitial epithelial cells in the intestine and\ncauses a condition resembling shigellosis. This ability is determined by a plasmid, which can be\ndetected as a diagnostic test.", "questionPages": [191, 192], "solutionPages": [199, 200], "questionFigures": [], "solutionFigures": []}, {"id": "ch12-q5", "chapterId": 12, "chapter": "Escherichia, Proteus and Klebsiella", "number": 5, "text": "Identify the organism below that causes effacement and attachment of intestinal cells.", "options": [{"id": "A", "text": "ETEC"}, {"id": "B", "text": "EIEC"}, {"id": "C", "text": "EPEC"}, {"id": "D", "text": "EAEC"}], "correctIndex": 2, "correctLetter": "C", "solution": "Attachment and effacement lesions on intestinal cells are caused by enteropathogenic Escherichia\ncoli (EPEC).\nE. coli is the second most common cause of diarrhea in the pediatric age group. Rotavirus is the\nmost common cause. EPEC causes watery diarrhea which is self-limiting.\nEPEC adheres to the mucosal cells of the small bowel and causes loss of microvilli (effacement).\nThis leads to the formation of filamentous actin pedestals or cuplike structures and occasionally\nmay cause entry of the EPEC into the mucosal cells.\nPathogenicity requires the presence of two important factors:\n+ Bundle-forming pilus encoded by plasmid containing EPEC adherence factor (EAF).\n* Chromosomal locus of enterocyte effacement (LEE) pathogenicity island.\nThe image below shows an electron microscopy image of E Coli.", "questionPages": [192], "solutionPages": [200, 201], "questionFigures": ["crop-question-ch12-q5-1"], "solutionFigures": ["crop-solution-ch12-q5-1", "crop-solution-ch12-q5-2"]}, {"id": "ch12-q6", "chapterId": 12, "chapter": "Escherichia, Proteus and Klebsiella", "number": 6, "text": "You are investigating an outbreak of diarrhea. You find out that the etiological agent causes\nstacked-brick formation on hep-2 cells as shown below. What is the likely organism?\n\n\n\nhe ew\n. -™ “e .\n™~ e 5 : *~ Ne,\n, = re\n: YB\n% ”\n. 7 — . a >.”\n» ae 4 tt\n_ 7\" “\n. ex. » we, 7 yt\n2 _ ‘ & ~~\n4\n7 ~ i. . . gp", "options": [{"id": "A", "text": "Enteroaggregative E.coli"}, {"id": "B", "text": "Enterohemorrhagic E.coli"}, {"id": "C", "text": "Enterotoxigenic E.coli"}, {"id": "D", "text": "Enteroinvasive E.coli"}], "correctIndex": 0, "correctLetter": "A", "solution": "The stacked-brick pattern of adherence on hep-2 cells is caused by enteroaggregative E. coli\n(EAEC).\nEnteroaggregative E. coli has been associated with persistent diarrhea. Intestinal colonization of\nEAEC is mediated by aggregative adherence fimbriae (AAF). EAST-1 toxin (enteroaggregative\nheat-stable toxin) is considered to be a major virulence factor for EAEC.\nThe given image shows the stacked-brick pattern of adherence on microscopy at 600x\nmagnification.", "questionPages": [192, 193], "solutionPages": [201, 202], "questionFigures": [], "solutionFigures": ["crop-solution-ch12-q6-1"]}, {"id": "ch12-q7", "chapterId": 12, "chapter": "Escherichia, Proteus and Klebsiella", "number": 7, "text": "A 29-year-old woman presented with bloody diarrhea, abdominal pain, hemolytic anemia,\nthrombocytopenia, and acute renal failure. She was diagnosed with hemolytic uremic\nsyndrome and treated with plasmapheresis and dialysis. What is false about the infectious\ncausative agent?", "options": [{"id": "A", "text": "Serotype 0157:H7 causes hemolytic-uremic syndrome."}, {"id": "B", "text": "It does not produce a Shiga like toxin"}, {"id": "C", "text": "Fecal leukocytes may be seen"}, {"id": "D", "text": "There is person to person transmission."}], "correctIndex": 1, "correctLetter": "B", "solution": "Hemolytic-uremic syndrome (HUS) is caused by enterohemorrhagic E. coli (EHEC) serotype\n0157:H7. It produces a Shiga like toxin, therefore EHEC is also known as Shiga toxin-producing\nE. coli (STEC).\nOther options:\nOption A - Strains of E. coli producing verocytotoxin or Shiga toxin (stx2a-g) can cause diarrheal\ndisease ranging from mild diarrhea to fatal hemorrhagic colitis and HUS. The most\ncommon EHEC belongs to serotype 0157:H7.\nOption C - In EHEC diarrhea, fecal leukocytes are commonly seen (70%) but although it is an\ninfectious condition, fever is not seen. The absence of fever can lead to its misdiagnosis as a\nnon-infectious condition such as intussusception or ischemic bowel disease.\nOption D - The disease is transmitted through contaminated feces. Person-to-person\ntransmission can occur if infected persons do not wash their hands after using the toilet or after\nchanging diapers.\nNote: Shiga toxin produced by S. dysenteriae is referred to as Stx.", "questionPages": [193], "solutionPages": [202], "questionFigures": [], "solutionFigures": []}, {"id": "ch12-q8", "chapterId": 12, "chapter": "Escherichia, Proteus and Klebsiella", "number": 8, "text": "Sereny test was employed for laboratory diagnosis of which of the following organisms?", "options": [{"id": "A", "text": "Enterotoxigenic E. coli"}, {"id": "B", "text": "Enteropathogenic E. coli"}, {"id": "C", "text": "Enterohemorrhagic E. coli"}, {"id": "D", "text": "Enteroinvasive E. coli"}], "correctIndex": 3, "correctLetter": "D", "solution": "The Sereny test is an animal pathogenicity test that used to be employed for laboratory diagnosis\nof enteroinvasive E. coli and Shigella.\nFreshly isolated suspension of bacteria is instilled into the eyes of guinea pigs which leads\nto mucopurulent conjunctivitis and severe keratitis.\nIt is not in use anymore as we have better methods of detecting toxigenicity now like molecular\nmethods.", "questionPages": [193, 194], "solutionPages": [202], "questionFigures": [], "solutionFigures": []}, {"id": "ch12-q9", "chapterId": 12, "chapter": "Escherichia, Proteus and Klebsiella", "number": 9, "text": "What is the culture media used to differentiate E. coli 0157:H7 from other E. coli?", "options": [{"id": "A", "text": "Sorbitol-MacConkey agar"}, {"id": "B", "text": "Mannitol salt agar"}, {"id": "C", "text": "Cystine-lactose-electrolyte deficient medium"}, {"id": "D", "text": "Thiosulphate citrate Bile salt sucrose medium"}], "correctIndex": 0, "correctLetter": "A", "solution": "Sorbitol-MacConkey agar is used to differentiate E. coli 0157:H7 from other E. coli.\nE. coli 0157:H7 does not ferment sorbitol and produces pale colonies on Sorbitol-MacConkey\nagar. All other strains of E. coli ferment sorbitol. Thus they produce pink colonies on\nSorbitol-MacConkey agar.\n0157:H7 strains do not contain B-glucuronidase and so are unable to use the substrate\n4-methylumbelliferyl-B-glucuronide(MUG). Thus, they give a negative MUG test.", "questionPages": [194], "solutionPages": [202], "questionFigures": [], "solutionFigures": []}, {"id": "ch12-q10", "chapterId": 12, "chapter": "Escherichia, Proteus and Klebsiella", "number": 10, "text": "Match the following E.coli with their respective pathogenesis.", "options": [{"id": "A", "text": "A-4,B-3,C-2,D-1"}, {"id": "B", "text": "A-1,B-3,C-2,D-4"}, {"id": "C", "text": "A-1,B-2,C-3,D-4"}, {"id": "D", "text": "A-4,B-2,C-3.D-1"}], "correctIndex": 2, "correctLetter": "C", "solution": "The correctly matched pairs are as follows:\nThe various strains of Escherichia coli are:\n\n\n\n+ Enterotoxigenic E. coli (ETEC) is the most common organism that causes diarrhea\nin travelers. It produces the following toxins:\n+ LT (heat-labile toxin)- acts by TcAMP\n+ ST (heat-stable toxin)- two types of ST are known, ST-A (ST-I) and ST-B (ST-II)\n* ST-A is soluble in methanol and acts by TcGMP in the intestine.\n¢ ST-B is insoluble in methanol, and the mode of action is not known.\n+ Enteroinvasive E. coli (EIEC) invade interstitial epithelial cells in the intestine and cause a\ncondition resembling shigellosis. This ability is determined by a plasmid, detection of which can\nalso be a diagnostic test. Sereny's test was employed to diagnose EIEC but it is not in use\nanymore.\n+ Enterohemorrhagic E. coli (EHEC) produces verocytotoxin, which targets vascular endothelium.\nIt causes hemorrhagic colitis and hemolytic uremic syndrome.\n* Enteropathogenic E. coli (EPEC) causes infantile diarrhea in developing countries. It adheres to\nthe mucosal surface of small intestine using EAF and LEE and causes effacement of microvilli.\nThis leads to attachment and effacement lesions of intestinal cells.\n+ Enteroaggregative E. coli (EAEC) produces the stacked brick pattern of adherence on hep-2 cells.\nEAEC has been associated with persistent diarrhea. Intestinal colonization of EAEC is mediated\nby AAF (aggregative adherence fimbriae). EAEC produces EAST-1 toxin (enteroaggregative\nheat-stable toxin) which is considered to be a major virulence factor.", "questionPages": [194], "solutionPages": [202, 203], "questionFigures": [], "solutionFigures": ["crop-solution-ch12-q10-1"]}, {"id": "ch12-q11", "chapterId": 12, "chapter": "Escherichia, Proteus and Klebsiella", "number": 11, "text": "Which of the following statements is false?", "options": [{"id": "A", "text": "E.coli is an aerobe and facultative anaerobe."}, {"id": "B", "text": "Proteus infection increases risk of uric acid stones."}, {"id": "C", "text": "E.coli is motile by peritrichous flagella."}, {"id": "D", "text": "Proteus can metabolise phenylalanine to phenylpyruvic acid."}], "correctIndex": 1, "correctLetter": "B", "solution": "Proteus increases the risk of struvite stones in the bladder as it leads to the alkalinisation of\nurine. Struvite stones are magnesium-ammonium phosphate stones that appear as\nrectangular/coffin-lid crystals shaped on urine microscopy. Uric acid stones are precipitated in\nacidic urine.\nProteus produces enzyme phenylalanine deaminase which converts phenylalanine to phenyl\npyruvic acid. This property is the basis for the phenylalanine deaminase test.\n\n\n\nThe test is performed by inoculating the organism in phenylalanine agar. After incubation, 10%\nferric chloride is added to the media. If phenyl pyruvic acid was produced, it will react with the\nferric chloride and turn dark green. If the medium remains a straw colour, the organism is\nnegative for phenylalanine deaminase production.\nE. coli is an aerobe and facultative anaerobe. Its motility is due to the presence of peritrichous\nflagella. It is the most common cause of urinary tract infections.", "questionPages": [194], "solutionPages": [203, 204], "questionFigures": [], "solutionFigures": []}, {"id": "ch12-q12", "chapterId": 12, "chapter": "Escherichia, Proteus and Klebsiella", "number": 12, "text": "Which of the following shows Dienes phenomenon?", "options": [{"id": "A", "text": "Proteus mirabilis"}, {"id": "B", "text": "Klebsiella granulomatis"}, {"id": "C", "text": "Providencia stuartii"}, {"id": "D", "text": "Serratia marcescens"}], "correctIndex": 0, "correctLetter": "A", "solution": "Dienes phenomenon is exhibited by Proteus mirabilis.\nWhen two identical strains of Proteus are inoculated at different places of the same culture plate,\nthe resulting swarms of growth coalesce and no line is formed between swarming cultures of the\nsame strain. However, if they are from two different strains, the spreading films of growth fail to\ncoalesce and remain separated by a narrow but easily visible furrow (known as Dienes line). This\nis known as Dienes phenomenon.\nThe image below shows Dienes phenomenon.", "questionPages": [194, 195], "solutionPages": [204], "questionFigures": [], "solutionFigures": ["crop-solution-ch12-q12-1"]}, {"id": "ch12-q13", "chapterId": 12, "chapter": "Escherichia, Proteus and Klebsiella", "number": 13, "text": "Blood culture of the sputum sample taken from a patient diagnosed with hospital-acquired\npneumonia, showed a characteristic phenomenon as shown in the image. Identify the bacteria\nthat exhibit this phenomenon.", "options": [{"id": "A", "text": "Klebsiella"}, {"id": "B", "text": "Enterobacter"}, {"id": "C", "text": "Serratia"}, {"id": "D", "text": "Proteus"}], "correctIndex": 3, "correctLetter": "D", "solution": "The given image of the blood culture finding shows the characteristic bull's eye swarming pattern\nexhibited by Proteus.\nProteus species move very actively with the help of peritrichous flagella, resulting in swarming on\nsolid media. It can be suppressed by the addition of:\n+ pheny] ethyl alcohol\n+ chloral hydrate\n\n\n\n* sulphonamides\n* sodium azide\n+ boric acid\n+ increasing the concentration of agar to 6%.\nSwarming does not occur on MacConkey medium and cystine-lactose-electrolyte-deficient (CLED)\nmedium.\nProteus is a gram-negative bacillus seen as a normal gastrointestinal flora. The two most common\nspecies causing infection in humans are P. mirabilis and P. vulgaris, which can be differentiated\nby spot indole test. P. mirabilis is indole negative while P. vulgaris is indole positive. Production\nof urease enzyme by Proteus, which hydrolyses urea to ammonia causes alkalinization of urine.\nAlkalinization of urine leads to the precipitation of organic and inorganic compounds which\ncontributes to the formation of Struvite stones. P. mirabilis is associated with urinary tract\ninfections while P. vulgaris is usually associated with wound and soft tissue infections.\nOther organisms that show swarming include:\n+ Clostridium tetani\n+ Vibrio parahaemolyticus\n* Serratia", "questionPages": [195], "solutionPages": [204, 205], "questionFigures": ["crop-question-ch12-q13-1"], "solutionFigures": []}, {"id": "ch12-q14", "chapterId": 12, "chapter": "Escherichia, Proteus and Klebsiella", "number": 14, "text": "A middle-aged man from north India presents with a deformity as shown in the image below.\nHe gives a history of foul-smelling purulent nasal discharge before this nodule appeared.\nWhich of the following organisms is responsible for his condition?", "options": [{"id": "A", "text": "Rhinosporidium seeberi"}, {"id": "B", "text": "Klebsiella rhinoscleromatis"}, {"id": "C", "text": "Klebsiella ozaenae"}, {"id": "D", "text": "Klebsiella oxytoca"}], "correctIndex": 1, "correctLetter": "B", "solution": "The above image and clinical scenario are suggestive of rhinoscleroma and it is caused by\nKlebsiella rhinoscleromatis.\nK. rhinoscleromatis is a gram-negative bacillus also known as Frisch bacillus. It is endemic in\nnorth India. Rhinoscleroma is characterized by chronic granulomatous hypertrophy of the\nnose. Biopsy of the lesion shows:\n* Mikulicz cells- large foamy cells with a central nucleus and vacuolated, cytoplasm containing\ncausative bacilli.\n+ Russell bodies- eosinophilic inclusion bodies found in the plasma cells. These are also observed\nin multiple myeloma.\nOther options:\nOption A: Rhinosporidium seeberi causes rhinosporidiosis.\nOption C: K. ozaenae causes atrophic rhinitis.\nOption D: K. oxytoca is associated with hemorrhagic colitis.", "questionPages": [195, 196], "solutionPages": [205], "questionFigures": ["crop-question-ch12-q14-1"], "solutionFigures": []}, {"id": "ch12-q15", "chapterId": 12, "chapter": "Escherichia, Proteus and Klebsiella", "number": 15, "text": "You notice a sputum sample of a patient suspected of having ventilator-associated pneumonia\nturns progressively redder over time. Microscopic examination of the sample reveals an\nabsence of red blood cells. Which of the following organisms could have caused this?", "options": [{"id": "A", "text": "Streptococcus pneumoniae"}, {"id": "B", "text": "Proteus mirabilis"}, {"id": "C", "text": "Klebsiella pneumonia"}, {"id": "D", "text": "Serratia marcescens"}], "correctIndex": 3, "correctLetter": "D", "solution": "The given condition of sputum sample turning redder over time can be caused by Serratia\nmarcescens.\n\n\n\nSerratia marcescens are pleomorphic coccobacilli that can grow in sputum after collection and can\nmimic hemoptysis because they produce a red pigment called prodigiosin.\nS. macescens mainly cause healthcare-associated infections such as ventilator-associated\npneumonia, meningitis, endocarditis, septicemia and peritonitis. They can contaminate IV fluids,\nsurgical instruments, and antiseptic solutions.", "questionPages": [196], "solutionPages": [205, 206], "questionFigures": [], "solutionFigures": []}, {"id": "ch12-q16", "chapterId": 12, "chapter": "Escherichia, Proteus and Klebsiella", "number": 16, "text": "A 19-year-old boy presented with a single painless papule on his penis with no enlarged\nlymph nodes. A smear was made from the lesion and stained with Wright- Giemsa stain\nwhich showed the finding as shown in the following picture. Identify the organism.", "options": [{"id": "A", "text": "Treponema pallidum"}, {"id": "B", "text": "Herpes simplex"}, {"id": "C", "text": "Chlamydia trachomatis"}, {"id": "D", "text": "Klebsiella granulomatis"}], "correctIndex": 3, "correctLetter": "D", "solution": "The given clinical vignette and the image showing Donovan bodies in Wright/Giemsa-stained\nimpression smears indicate a diagnosis of donovanosis caused by Klebsiella granulomatis. They\nappear as rounded coccobacilli within cystic spaces in large mononuclear cells (called Pund cells).\nKlebsiella granulomatis shows bipolar condensation of chromatin giving a safety pin appearance.\nBipolar staining (safety pin appearance) is shown by:\n°H. ducreyi\n+ Vibrio parahaemolyticus\n* Klebsiella granulomatis\n+ Yersinia pestis\n* Burkholderia pseudomallei\n+ Burkholderia mallei", "questionPages": [196, 197, 198], "solutionPages": [206], "questionFigures": ["crop-question-ch12-q16-1"], "solutionFigures": []}, {"id": "ch13-q1", "chapterId": 13, "chapter": "Shigella and Salmonella", "number": 1, "text": "A child presents with a high fever, acute abdominal pain, and malaise. The child passes small\namounts of bloody mucopurulent stools with increasing tenesmus and cramps. What is the\nmost likely causative organism?", "options": [{"id": "A", "text": "Vibrio cholerae"}, {"id": "B", "text": "Rotavirus"}, {"id": "C", "text": "Shigella dysenteriae"}, {"id": "D", "text": "Entamoeba histolytica"}], "correctIndex": 2, "correctLetter": "C", "solution": "Acute onset of symptoms (fever, abdominal cramps) with dysentery (bloody mucopurulent stools)\nand tenesmus is most likely due to Shigella dysenteriae.\nShigella dysenteriae is a Gram-negative bacillus causing bacillary dysentery in humans. It is\nspread through faeco-oral transmission.\nOther options:\nOption A: Vibrio cholerae results in watery diarrhea with characteristic rice watery stools.\nOption B: Viruses such as rotavirus and norovirus causes watery diarrhea through mucosal\nirritation.\nOption D: Entamoeba histolytica results in gradual onset of symptoms usually 1-3 weeks with\ndysentery.", "questionPages": [207], "solutionPages": [], "questionFigures": [], "solutionFigures": []}, {"id": "ch13-q2", "chapterId": 13, "chapter": "Shigella and Salmonella", "number": 2, "text": "Which of the following toxins acts by inhibiting protein synthesis?", "options": [{"id": "A", "text": "Cholera toxin"}, {"id": "B", "text": "Shiga toxin"}, {"id": "C", "text": "Pertussis toxin"}, {"id": "D", "text": "Labile toxin of ETEC"}], "correctIndex": 1, "correctLetter": "B", "solution": "Shiga toxin acts by inhibiting protein synthesis.\nShiga toxin or verotoxin is an exotoxin produced by Shigella species. It consists of two subunits A\nand B. The B subunit binds to globotriaosylceramide receptors on the target cell, and then, the A\nsubunit gets internalized. The A subunit leads to inhibition of 60S ribosome, leading to shut down\nof protein synthesis. Its site of action is in the endothelial cells of small blood vessels of GIT.", "questionPages": [207], "solutionPages": [], "questionFigures": [], "solutionFigures": []}, {"id": "ch13-q3", "chapterId": 13, "chapter": "Shigella and Salmonella", "number": 3, "text": "A 4-year-old boy developed bloody diarrhea and abdominal cramps. The bacteria isolated\nfrom the stool specimen did not ferment lactose or mannitol. Which of the following\norganisms is implicated here?", "options": [{"id": "A", "text": "Shigella dysenteriae"}, {"id": "B", "text": "Shigella flexneri"}, {"id": "C", "text": "Shigella boydii"}, {"id": "D", "text": "Shigella sonnei"}], "correctIndex": 0, "correctLetter": "A", "solution": "Shigella dysenteriae does not ferment mannitol and lactose.\nShigella species cause bacillary dysentery (bloody diarrhea with abdominal cramps). They do not\nferment lactose, except S.sonnei which is a late lactose fermenter. To differentiate between the\nvarious Shigella species, mannitol fermentation is noted.\nClassification of pathogenic Shigella species:", "questionPages": [207], "solutionPages": [213], "questionFigures": [], "solutionFigures": ["crop-solution-ch13-q3-1"]}, {"id": "ch13-q4", "chapterId": 13, "chapter": "Shigella and Salmonella", "number": 4, "text": "Which of the following salmonellae is non-motile?", "options": [{"id": "A", "text": "Salmonella typhi"}, {"id": "B", "text": "Salmonella enteridis"}, {"id": "C", "text": "Salmonella gallinarum"}, {"id": "D", "text": "Salmonella chester"}], "correctIndex": 2, "correctLetter": "C", "solution": "S. gallinarum is non-motile.\nSalmonellae are aerobic or facultatively anaerobic Gram-negative bacilli. They are motile due to\nthe presence of peritrichous flagella, except S. gallinarum and S. pullorum.", "questionPages": [207, 208], "solutionPages": [213], "questionFigures": [], "solutionFigures": []}, {"id": "ch13-q5", "chapterId": 13, "chapter": "Shigella and Salmonella", "number": 5, "text": "A Greek patient with travel history to India is diagnosed with enteric fever. What is the\nminimum amount of pathogen required to cause this condition?", "options": [{"id": "A", "text": "1-10 bacilli"}, {"id": "B", "text": "100 bacilli"}, {"id": "C", "text": "1043 -1046 bacilli"}, {"id": "D", "text": "10°8 -10‘10 bacilli"}], "correctIndex": 2, "correctLetter": "C", "solution": "Enteric fever is caused by S. typhi or S. paratyphi. The minimum amount of S. typhi required to\ncause enteric fever is 103 to 106 organisms.\nEnteric fever spreads through the feco-oral route. It presents with step-ladder fever and\nabdominal pain after an incubation period of 10-20 days. Over the next week, the patient can\ndevelop abdominal distension, diarrhea, splenomegaly and characteristic rose spots on the\nabdomen due to vasculitis.\nThe amount of pathogen required to cause an infection in the host is known as the infectious dose.\nThe infectious doses of few bacteria are given below:\n+ Escherichia coli - 106 — 108 organisms\n+ Shigella - 10 — 100 organisms\n+ Escherichia coli 0157:H7 - <10 organisms", "questionPages": [208], "solutionPages": [213], "questionFigures": [], "solutionFigures": []}, {"id": "ch13-q6", "chapterId": 13, "chapter": "Shigella and Salmonella", "number": 6, "text": "What is the incubation period of Salmonella typhi?", "options": [{"id": "A", "text": "2-5 days"}, {"id": "B", "text": "5-21 days"}, {"id": "C", "text": "14-25 days"}, {"id": "D", "text": "20-30 days"}], "correctIndex": 1, "correctLetter": "B", "solution": "The incubation period for Salmonella typhi is from 5 to 21 days.\nThe incubation period for Salmonella typhi typically averages 10-14 days, but can range from 5 to\n21 days. The duration is likely dependant on the inoculum size and the host’s health and immune\nstatus.", "questionPages": [208], "solutionPages": [213], "questionFigures": [], "solutionFigures": []}, {"id": "ch13-q7", "chapterId": 13, "chapter": "Shigella and Salmonella", "number": 7, "text": "A 25-year-old man presented to the ER with fever, splenomegaly, and a rash as shown in the\nimage below. After admission, he developed intestinal perforation and an exploratory\nlaparotomy revealed several longitudinal ulcers in the small bowel. What is the probable\ndiagnosis?", "options": [{"id": "A", "text": "Enteric fever"}, {"id": "B", "text": "Tuberculosis"}, {"id": "C", "text": "Amoebiasis"}, {"id": "D", "text": "Hemorrhagic colitis"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given image shows Rose spots. The combination of this with fever, splenomegaly, presence of\nlongitudinal ulcers in the intestine and intestinal perforation is suggestive of enteric fever.\nThe term enteric fever includes typhoid fever caused by Salmonella typhi and paratyphoid fever\ncaused by Salmonella paratyphi A, B and C.\nEnteric fever presents with step ladder pyrexia. The fever is accompanied by relative bradycardia\nwhich is known as the Faget sign. Hepatosplenomegaly is a common finding on\nexamination. Rose spots that fade on pressure appear on the skin during the second or third\nweek.\nSince bile is a good culture medium for the bacilli, they multiply abundantly in the gallbladder\nand are discharged continuously into the intestine. In the intestine, it causes inflammation and\n\n\n\nnecrosis leaving behind the characteristic typhoid ulcers which are oriented along the axis of the\nintestine (longitudinal ulcers). Ulceration of the bowel leads to two major\ncomplications- intestinal perforation and hemorrhage.\nOption B: In intestinal tuberculosis, ulcers are perpendicular to the axis of the intestine\n(transverse ulcers).\nOption C: Flask shaped ulcers are characteristic of amoebiasis.\nOption D: Hemorrhagic colitis is caused by Shigella dysenteriae and some strains of E. coli. It is\ncharacterised by bloody diarrhea with tenesmus.", "questionPages": [208, 209], "solutionPages": [213, 214], "questionFigures": ["crop-question-ch13-q7-1"], "solutionFigures": []}, {"id": "ch13-q8", "chapterId": 13, "chapter": "Shigella and Salmonella", "number": 8, "text": "While evaluating a patient suspected to have enteric fever, you order a widely used tube\nagglutination test in the second week of his illness. Which of the following statements\nregarding this test is false?", "options": [{"id": "A", "text": "H agglutinin titer > 160 and O agglutinin titer > 80 is considered significant"}, {"id": "B", "text": "O antibody cannot differentiate between Salmonella types."}, {"id": "C", "text": "O antibody lasts longer and hence is not indicative of recent infection."}, {"id": "D", "text": "High titer value in a single test is not confirmative."}], "correctIndex": 2, "correctLetter": "C", "solution": "The tube agglutination test which is widely used for the diagnosis of enteric fever is the Widal test.\nThe O antibodies detected via this test disappear within a few weeks of disease resolution and so\nare indicative of recent infection.\nWidal test is a serological test for the measurement of O and H antigens of Salmonella typhi and\nSalmonella paratyphi present in the patient's serum. Four antigens are used- O antigens of S.\ntyphi (TO), H antigens of S. typhi (TH), H antigens of S. paratyphi A (AH) and H antigens of S.\nparatyphi B (BH).\nParatyphoid O antigens cross-reacts with the typhoid O antigen due to the sharing of factor 12. It\nis not used in the test and thus, O antibody cannot differentiate between Salmonella types.\nH agglutinin titer > 160 and O agglutinin titer > 80 is considered significant. However,\na 4-fold rise in titers between ist and 3rd week is more significant compared to a single high titer\nbecause of the possibility of an anamnestic reaction - a transient rise of titer due to unrelated\ninfections (malaria, dengue) in persons who had a prior enteric fever. After one week interval, if\nthe titer increases, it indicates true infection. If the titer decreases, it indicates an anamnestic\nreaction.", "questionPages": [209], "solutionPages": [214], "questionFigures": [], "solutionFigures": []}, {"id": "ch13-q9", "chapterId": 13, "chapter": "Shigella and Salmonella", "number": 9, "text": "A young man with fever for 2 weeks has the following serology findings. Which of the given\nstatements is true about the disease he has?", "options": [{"id": "A", "text": "Intestinal perforation following infection with S.typhi occurs in the 1st week."}, {"id": "B", "text": "Faget’s sign is seen in enteric fever."}, {"id": "C", "text": "In Widal test, Felix tube is used to detect H antigen."}, {"id": "D", "text": "Blood culture is the gold standard of diagnosis"}], "correctIndex": 1, "correctLetter": "B", "solution": "Widal results showing titers for O antibody >80 and H antibody for S.typhi to be >160 is\nsuggestive of enteric fever. Faget's sign is seen in enteric fever.\nEnteric fever, caused by Salmonella typhi and Salmonella paratyphi A, B and C, presents with step\nladder pyrexia. The fever rises one day and falls the subsequent morning. It continues to form\npeaks and troughs. Hepatosplenomegaly is a common finding on examination. Rose spots that\nfade on pressure appear on the skin during the second or third week. Faget's sign is the unusual\npairing of fever with bradycardia (relative bradycardia) instead of tachycardia. It is also observed\nin yellow fever, brucellosis, and tularemia. Intestinal perforation (option A) is a complication of\nenteric fever caused by Salmonella typhi. It occurs in the 3rd week following infection.\nWidal test is a serological test used for the diagnosis of enteric fever during the 2nd week. It\nmeasures the levels of H and O antigens in the patient's serum.\n\n\n\nBone marrow culture is the gold standard (option D) for diagnosis of enteric fever. Blood culture\nis most commonly performed to confirm the diagnosis, however, bone marrow is more sensitive.", "questionPages": [209, 210], "solutionPages": [214, 215], "questionFigures": [], "solutionFigures": ["crop-solution-ch13-q9-1"]}, {"id": "ch13-q10", "chapterId": 13, "chapter": "Shigella and Salmonella", "number": 10, "text": "A patient, suspected to have enteric fever, has been started on ceftriaxone by his local village\nhealer 2 days ago. Which investigation will confirm his diagnosis at this stage?", "options": [{"id": "A", "text": "Blood culture"}, {"id": "B", "text": "Bone marrow culture"}, {"id": "C", "text": "Stool culture"}, {"id": "D", "text": "Urine culture"}], "correctIndex": 1, "correctLetter": "B", "solution": "Bone marrow culture is preferred at this stage.\nBone marrow culture is the most sensitive test (>80% sensitivity) for diagnosis of enteric fever.\nIt remains positive for upto 5 days after starting antibiotics, unlike blood culture. Hence, it is\npreferred in the patient above who has been on antibiotics for 2 days.\nBlood culture has a sensitivity of about 60% for diagnosis of enteric fever. Its sensitivity drops\nwith duration of illness, and is thus useful onlyduring the 1st week of enteric fever. It rapidly\nbecomes negative on treatment with antibiotics. Stool culture has a sensitivity of 30% and only\nyields positive results from the 2nd or 3rd week onwards. Urine culture has low sensitivity and\nmay be positive only after the 2nd week.\nNote: The sensitivity of diagnostic methods for enteric fever is duodenal content culture > bone\nmarrow culture > blood culture. However, duodenal content culture is rarely done in clinical\npractice.", "questionPages": [210], "solutionPages": [215], "questionFigures": [], "solutionFigures": []}, {"id": "ch13-q11", "chapterId": 13, "chapter": "Shigella and Salmonella", "number": 11, "text": "You are administering a Vi capsular polysaccharide vaccine to a child in Germany before his\ntrip to India. Which of the following is false about the antigen used in this vaccine?", "options": [{"id": "A", "text": "It is a capsular antigen"}, {"id": "B", "text": "It is polysaccharide in nature"}, {"id": "C", "text": "It is heat stable"}, {"id": "D", "text": "It is alcohol stable"}], "correctIndex": 2, "correctLetter": "C", "solution": "Vi capsule polysaccharide antigen is a heat-labile antigen used in the Vi capsular polysaccharide\nvaccine (ViCPS) for typhoid.\nVi antigen is found in Salmonella typhi, S. paratyphi C and S. dublin. It is a capsular antigen and\nis a polysaccharide. It acts as a virulence factor by inhibiting phagocytosis and resisting\ncomplement activation and bacterial lysis. It envelopes the O antigen, and thus, many S. typhi\nstrains fail to agglutinate with O antiserum. However, it can be destroyed by heat. It is alcohol\nstable. This antigen is poorly immunogenic.\nThe Vi capsular polysaccharide vaccine (Vi CPS) contains purified Vi polysaccharide. It is given as\na single dose of 0.5ml intramuscularly to children over 2 years of age. It is recommended for\ntravellers to areas endemic for Salmonella infections.", "questionPages": [210], "solutionPages": [215, 216], "questionFigures": [], "solutionFigures": []}, {"id": "ch13-q12", "chapterId": 13, "chapter": "Shigella and Salmonella", "number": 12, "text": "A man living in the UK is planning to travel to India. His doctor prescribes the necessary\nvaccines prior to travel including an oral typhoid vaccine. What is the schedule for this\nvaccine?", "options": [{"id": "A", "text": "Day 1,3,5,7"}, {"id": "B", "text": "Day 1,3,7,14"}, {"id": "C", "text": "Day 1,7,14"}, {"id": "D", "text": "Day 1,7,14,21"}], "correctIndex": 0, "correctLetter": "A", "solution": "The oral typhoid vaccine is given on days 1, 3, 5, and 7.\nTyphoral or Ty21a is a live attenuated oral typhoid vaccine. It is given in 4 doses given on days 1,\n3, 5, and 7. No antibiotics should be given during this period. It is indicated only in individuals\nover 6 years of age. Protective immunity starts after 7 days of the last dose and lasts for 4 years.\nTy21a can also be administered to HIV-positive, asymptomatic individuals as long as their CD4\ncount is above 200/mm3. It is contraindicated in immunocompromised patients.", "questionPages": [210], "solutionPages": [216], "questionFigures": [], "solutionFigures": []}, {"id": "ch13-q13", "chapterId": 13, "chapter": "Shigella and Salmonella", "number": 13, "text": "Which of the following drugs is not used for typhoid fever in adults?", "options": [{"id": "A", "text": "Azithromycin"}, {"id": "B", "text": "Ciprofloxacin"}, {"id": "C", "text": "Ceftriaxone"}, {"id": "D", "text": "Amikacin"}], "correctIndex": 3, "correctLetter": "D", "solution": "Amikacin is not used in the treatment of typhoid fever.\nAmikacin is an aminoglycoside. Despite showing efficient in vitro killing of Salmonella, first- and\nsecond-generation cephalosporins and aminoglycosides have proven to be ineffective in actual\nclinical cases.", "questionPages": [210, 211], "solutionPages": [216, 217], "questionFigures": [], "solutionFigures": ["crop-solution-ch13-q13-1", "crop-solution-ch13-q13-2"]}, {"id": "ch13-q14", "chapterId": 13, "chapter": "Shigella and Salmonella", "number": 14, "text": "A patient developed fever and diarrhoea after consumption of undercooked eggs. Which of\nthe following statements is false about this condition?", "options": [{"id": "A", "text": "Gastroenteritis due to non-typhoidal salmonellosis is usually self limited."}, {"id": "B", "text": "Stool cultures remain positive for 4-5 weeks after infection."}, {"id": "C", "text": "Most common isolate from stool culture is Salmonella enteritidis."}, {"id": "D", "text": "Non-typhoidal salmonellosis can be acquired from multiple animal reservoirs."}], "correctIndex": 2, "correctLetter": "C", "solution": "The given case scenario is suggestive of non-typhoidal salmonellosis (NTS). The most\ncommon organism isolated in NTS from stool culture is Salmonella typhimurium.\nNontyphoidal salmonellosis refers to illnesses caused by all serotypes of Salmonella except for\nSalmonella typhi, Salmonella paratyphi A, B, and C. Transmission of nontyphoidal salmonellosis\noccurs usually through the consumption of food or water contaminated with animal feces.\nTransmission may also occur through food products, especially eggs, poultry, undercooked\nground meat, and hence multiple animals act as reservoirs for non-typhoidal salmonella.\nGastroenteritis is the most common clinical presentation of NTS. The illness usually lasts 4-7\ndays, and most people recover without treatment. Culturing organisms continues to be the\nmainstay of clinical diagnostic testing for nontyphoidal salmonella infection. Approximately 90%\nof isolates are obtained from routine stool culture until 4-5 weeks after infection.", "questionPages": [211], "solutionPages": [217], "questionFigures": [], "solutionFigures": []}, {"id": "ch14-q1", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 1, "text": "A child presents with profuse, painless diarrhea. Stool microscopy shows the following\nfinding. What is this characteristic appearance called?", "options": [{"id": "A", "text": "School of fish appearance"}, {"id": "B", "text": "Railroad appearance"}, {"id": "C", "text": "Fish in stream appearance"}, {"id": "D", "text": "Drumstick appearance."}], "correctIndex": 2, "correctLetter": "C", "solution": "The given clinical vignette is suggestive of cholera caused by Vibrio cholerae. The image\nshows the characteristic fish in stream appearance of Vibrio.\nOther options:\nOptions A and B: School of fish appearance and railroad appearance are shown by Haemophilus\nducreyi.\nOption D: Drumstick appearance is shown by Clostridium tetani due to its spherical and terminal\nspores.", "questionPages": [218], "solutionPages": [], "questionFigures": ["crop-question-ch14-q1-1"], "solutionFigures": []}, {"id": "ch14-q2", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 2, "text": "While studying the microscopic features of Vibrio cholerae, you observe the following finding.\nWhat type of motility can you see here?", "options": [{"id": "A", "text": "Lashing motility"}, {"id": "B", "text": "Swarming motility"}, {"id": "C", "text": "Darting motility"}, {"id": "D", "text": "Twitching motility"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given microscopic finding shows the darting motility characteristic of Vibrio cholerae.\nVibrio cholerae is actively motile with a polar flagellum. The actively motile vibrios appear like a\n‘swarm of gnats’.", "questionPages": [218, 219], "solutionPages": [], "questionFigures": ["crop-question-ch14-q2-1"], "solutionFigures": []}, {"id": "ch14-q3", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 3, "text": "On the basis of which antigen is Vibrio cholerae classified under the Sakazaki typing scheme?", "options": [{"id": "A", "text": "O antigen"}, {"id": "B", "text": "K antigen"}, {"id": "C", "text": "H antigen"}, {"id": "D", "text": "O and H antigen"}], "correctIndex": 0, "correctLetter": "A", "solution": "Vibrio cholerae are classified based on O antigen, under Sakazaki typing scheme.\nBased on the presence or absence of O antigen, V. cholerae is classified as 01 which agglutinate\nwith antisera to O1 group (agglutinable vibrios) and non-01, which do not agglutinate with\nantisera to O1 group (non-agglutinable vibrios).\nAs per the Gardner and Venkatraman classification, Vibrios are classified into Group A (V.\ncholerae) and Group B (others) based on H antigen or flagellar antigen.\nGardner and Venkatraman classification:", "questionPages": [219], "solutionPages": [229], "questionFigures": [], "solutionFigures": ["crop-solution-ch14-q3-1"]}, {"id": "ch14-q4", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 4, "text": "Which of the following statements is false regarding non-agglutinable vibrios?", "options": [{"id": "A", "text": "They belong to serogroup 02 — 0200"}, {"id": "B", "text": "They are mostly pathogenic"}, {"id": "C", "text": "They are not agglutinated by O-1 antiserum"}, {"id": "D", "text": "These are similar to V. cholera in most cultural and biochemical reactions"}], "correctIndex": 1, "correctLetter": "B", "solution": "Non-agglutinable vibrios are non-pathogenic (except 0139) and hence, they are called non-cholera\nvibrios.\nThe vibrios which are not agglutinated by O-1 antiserum are called non-agglutinable (NAG)\nvibrios. They belong to the serogroups 02-0200 of which only serogroup O-139 is known to cause\nepidemics of cholera. They are similar to Vibrio cholerae in most biochemical reactions and\nculture characteristics, except that they are hemolytic to sheep erythrocytes and give a positive\nVoges-Proskauer reaction.", "questionPages": [219, 220], "solutionPages": [229], "questionFigures": [], "solutionFigures": []}, {"id": "ch14-q5", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 5, "text": "A microbiologist studying Vibrio cholera added sulphuric acid to a 24-hour peptone culture of\nthe organism and a reddish-pink color developed. Which of the following is true about the\ntest he performed?", "options": [{"id": "A", "text": "It is known as methyl red test"}, {"id": "B", "text": "A nitrosoindole compound is formed giving it the red colour"}, {"id": "C", "text": "The red colour is obtained due to pigment production by the bacteria"}, {"id": "D", "text": "The red colour is obtained due to acid & gas production by Vibrio"}], "correctIndex": 1, "correctLetter": "B", "solution": "The test described here is the 'cholera red reaction’ given by Vibrio cholera. When few drops of\nconcentrated sulphuric acid are added to a 24-hour peptone water culture, a reddish-pink colour\ndevelops due to the formation of nitrosoindole. Vibrio cholerae reduce nitrates to nitrites and\nconvert tryptophan to indole. These two properties contribute to the cholera red reaction.\n\n\n\nOther options:\nOption A: The methyl red (MR) test is used to detect the production of sufficient acid during the\nfermentation of glucose by bacteria. It is used to classify Enterobacteriacae.\nOption C: Vibrio cholera does not produce any colored pigment.\nOption D: Vibrio ferments carbohydrates leading to production of acid but no gas.", "questionPages": [220], "solutionPages": [229, 230], "questionFigures": [], "solutionFigures": ["crop-solution-ch14-q5-1"]}, {"id": "ch14-q6", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 6, "text": "A 20-year-old woman presents with complaints of passing profuse loose stools which looked\nlike rice water for the past 3 days. There's a history of similar symptoms in the family. Stool\nsamples were sent to the lab for analysis and the test given in the image is performed.\nIdentify this test.", "options": [{"id": "A", "text": "Loop test"}, {"id": "B", "text": "String test"}, {"id": "C", "text": "Wire test"}, {"id": "D", "text": "Duodenal string test"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given case scenario of passing profuse rice-water stools with similar complaints in the family\nsuggests a probable diagnosis of cholera. The test shown in the above image is the string test and\nit is performed to identify Vibrio cholerae.\nTo perform the string test, a loopful of the bacterial culture is mixed with a drop of 0.5% sodium\ndeoxycholate in saline on a slide. The bacterial cells of Vibrio cholerae are lysed by sodium\ndeoxycholate, causing the suspension to lose its turbidity and become mucoid. A string is formed\nwhen the loop is drawn away from the suspension.\nNote: The duodenal string test refers to the Entero test performed for the diagnosis of giardiasis.", "questionPages": [220], "solutionPages": [230], "questionFigures": ["crop-question-ch14-q6-1"], "solutionFigures": []}, {"id": "ch14-q7", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 7, "text": "Which of the following bacteria is not microaerophilic?", "options": [{"id": "A", "text": "Helicobacter pylori"}, {"id": "B", "text": "Campylobacter jejuni"}, {"id": "C", "text": "Mycobacterium bovis"}, {"id": "D", "text": "Vibrio cholera"}], "correctIndex": 3, "correctLetter": "D", "solution": "Vibrio cholera is a facultative anaerobe and is not microaerophilic.", "questionPages": [220, 221], "solutionPages": [230], "questionFigures": [], "solutionFigures": []}, {"id": "ch14-q8", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 8, "text": "The disruption of which of the following is responsible for watery diarrhea in cholera caused\nby Vibrio?", "options": [{"id": "A", "text": "Intercalated discs"}, {"id": "B", "text": "Macula densa"}, {"id": "C", "text": "Zonula occludens"}, {"id": "D", "text": "Hemidesmosomes"}], "correctIndex": 2, "correctLetter": "C", "solution": "The disruption of zonula occludens is responsible for watery diarrhea in cholera caused by Vibrio\ncholerae.\nZonula occludens toxin (Zot) is an enterotoxin elaborated by Vibrio cholerae that increases\nintestinal permeability by interacting with a mammalian cell receptor with subsequent activation\nof intracellular signaling leading to the disassembly of the intercellular tight junctions.\nMechanism of action of cholera toxin:\n* The cholera toxin molecule consists of 1 A and 5 B subunits. The B (binding) units attach to the\nGM1 ganglioside receptors on the surface of jejunal epithelial cells. The A (active) subunit,\non being transported into the enterocyte, dissociates into A1 and A2. A2 fragment only links\nbiologically active A1 to the B subunit.\n+ A1 causes prolonged activation of cellular adenylate cyclase and accumulation of cAMP, leading\nto outpouring into the small intestinal lumen, of large quantities of water and electrolytes. This\nleads to watery diarrhea which is isotonic with plasma but contains much more potassium and\nbicarbonate.\n+ The toxin also inhibits the intestinal absorption of sodium and chloride.\n+ All clinical manifestations and complications in cholera result from the massive water and\nelectrolyte depletion thus caused.", "questionPages": [221], "solutionPages": [230, 231], "questionFigures": [], "solutionFigures": ["crop-solution-ch14-q8-1"]}, {"id": "ch14-q9", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 9, "text": "A young child was brought to the ER with a history of loose stools. On examination, she is\ntachycardic, appears lethargic and skin goes back slowly after the skin pinch test. She was\nadmitted and started on IV fluids and input-output charting was done. The given image\nshows stool output from the patient. Which of the following is the mechanism of action of the\ntoxin responsible for the same?", "options": [{"id": "A", "text": "Inhibit elongation factor -2"}, {"id": "B", "text": "Toxin causes Increased guany]l cycla

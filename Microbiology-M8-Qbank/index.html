 responsible for the draughtsman appearance of\npneumococcal colonies?", "options": [{"id": "A", "text": "Pneumolysin"}, {"id": "B", "text": "Autolysin"}, {"id": "C", "text": "Capsular polysaccharide"}, {"id": "D", "text": "Pneumotoxin"}], "correctIndex": 1, "correctLetter": "B", "solution": "The factor responsible for the draughtsman appearance of pneumococcal colonies is autolysin.\nWhen pneumococci are incubated on blood agar for a prolonged duration, the resultant colonies\nare surrounded with concentric rings and have a central umbonation. This appearance of\npneumococcal colonies is known as carrom coin appearance or draughtsman appearance.\nAutolysin is an amidase enzyme produced by pneumococci that cleaves peptidoglycan, leading to\nthe autolysis of cells. It is also responsible for the bile solubility of pneumococci.\nThe below image shows the characteristic draughtsman appearance of pneumococcal colonies.", "questionPages": [102], "solutionPages": [113], "questionFigures": [], "solutionFigures": ["crop-solution-ch6-q18-1"]}, {"id": "ch6-q19", "chapterId": 6, "chapter": "Streptococci and Enterococci", "number": 19, "text": "In a splenectomized patient, there is an increased risk of infection by all capsulated\norganisms. Which of the following is least likely to cause an infection in such patients?", "options": [{"id": "A", "text": "Streptococcus pneumoniae"}, {"id": "B", "text": "Klebsiella pneumoniae"}, {"id": "C", "text": "Haemophilus influenzae"}, {"id": "D", "text": "Staphylococcus aureus"}], "correctIndex": 3, "correctLetter": "D", "solution": "In splenectomized patients, there is an increased risk of infection by capsulated organisms such as\nStreptococcus pneumoniae, Haemophilus influenzae, and Klebsiella pneumoniae. Staphylococcus\naureus does not have a capsule and so poses no increased risk to these individuals.\nThe phagocytosis of capsulated organisms is prevented by their capsule. Thus, the body's main\ndefence against these organisms is the spleen.\nCertain components called opsonins attach to these capsulated organisms, and then they are\ndelivered to the spleen, where their uptake is facilitated by receptors present on the surface of\nsplenic phagocytes. After splenectomy, this defence mechanism is lost leaving patients susceptible\nto infection from these bacteria.", "questionPages": [102], "solutionPages": [113], "questionFigures": [], "solutionFigures": []}, {"id": "ch6-q20", "chapterId": 6, "chapter": "Streptococci and Enterococci", "number": 20, "text": "Which of the following statements is true about the pneumococcal vaccine?", "options": [{"id": "A", "text": "Pneumococcal polyvalent vaccine PPSV23 is indicated in splenectomized patients."}, {"id": "B", "text": "Pneumococcal polyvalent vaccine PCV13 is contraindicated in children less than 2 years."}, {"id": "C", "text": "Pneumococcal polyvalent vaccine PPV 23 gives protection for 10 years."}, {"id": "D", "text": "Pneumococcal polyvalent vaccine is contraindicated if age > 65 years."}], "correctIndex": 0, "correctLetter": "A", "solution": "Pneumococcal polyvalent vaccine PPSV23 is indicated in splenectomised patients.\nThere are two kinds of polyvalent pneumococcal vaccines:\n* Pneumococcal polysaccharide vaccine - PPSV23\n+ It is indicated in splenectomized patients, sickle cell disease, immunocompromised patients, and\npatients above 65 years of age.\n* CDC currently recommends the administration of one additional dose of PPSV23 at least 5 years\nafter the last dose.\n* Children younger than 2 years old should not get this vaccine since they fail to mount an\nadequate response.\n* Pneumococcal conjugate vaccine-\n¢ It includes PCV10 and PCV13.\n+ It is indicated in children less than 2 years.", "questionPages": [102, 103], "solutionPages": [113, 114], "questionFigures": [], "solutionFigures": []}, {"id": "ch7-q1", "chapterId": 7, "chapter": "Staphylococci", "number": 1, "text": "A child injures his knee while playing. A few days later, the wound on his knee shows signs of\ninflammation. The wound is cultured and its Gram-stained smear is given below. Further\ntesting shows that the cultured organism is coagulase-positive. Identify the organism.", "options": [{"id": "A", "text": "Streptococcus pyogenes"}, {"id": "B", "text": "Staphylococcus aureus"}, {"id": "C", "text": "Staphylococcus epidermidis"}, {"id": "D", "text": "Staphylococcus saprophyticus"}], "correctIndex": 1, "correctLetter": "B", "solution": "An infected wound culture showing Gram-positive cocci arranged in clusters which are\ncoagulase-positive suggest that the cultured organism is Staphylococcus aureus.\n\n\n\nStaphylococci are Gram-positive cocci that are catalase-positive. They grow in clusters because the\ncells divide successively in three perpendicular planes, with the daughter cells remaining attached\nto one another following each successive division. Among the 45 different species of\nStaphylococcus, Staphylococcus aureus is the only one which is coagulase positive.\nOther options:\nOption A: Streptococci are catalase negative. They are Gram-positive cocci arranged in chains.\nOptions C & D: S. epidermidis and S. saprophyticus are both coagulase negative.\nDifferent bacteria with their typical arrangements are given below:\n* Staphylococcus: Clusters\n* Streptococcus: Chains\n* Pneumococcus: Pairs/lanceolate shaped\n* Micrococcus: Tetrads", "questionPages": [115], "solutionPages": [121], "questionFigures": ["crop-question-ch7-q1-1"], "solutionFigures": ["crop-solution-ch7-q1-1"]}, {"id": "ch7-q2", "chapterId": 7, "chapter": "Staphylococci", "number": 2, "text": "The specimen obtained by performing incision and drainage of a breast abscess was sent for\nculture on nutrient agar. An image of the culture plate is given below. Microscopy of the\nisolated organism revealed gram-positive cocci arranged in clusters. Which of the following is\na false statement regarding this organism?", "options": [{"id": "A", "text": "Pigment production occurs optimally at 35°C."}, {"id": "B", "text": "Golden yellow pigmentation is due to B-carotene"}, {"id": "C", "text": "Pigment production is enhanced by adding milk to culture media"}, {"id": "D", "text": "Confluent growth presents a characteristic 'oil-paint appearance’"}], "correctIndex": 0, "correctLetter": "A", "solution": "Gram-positive cocci arranged in clusters that produce golden-yellow pigment on nutrient agar is\nsuggestive of Staphylococcus aureus. The pigment production occurs optimally at 22°C.\nStaphylococcus aureus is a Gram-positive coccus. On nutrient agar, its colonies are large (2-4 mm\nin diameter), convex, smooth, shiny, opaque and easily emulsifiable. The colonies appear golden\nyellow due to the presence of staphyloxanthin (carotenoid). Pigment production occurs optimally\nat 22°C and in aerobic conditions. It is enhanced when 1% glycerol or milk is incorporated in the\nmedium.\nOn a nutrient agar slope, there is confluent growth of Staphylococcus, which appears as a\ncharacteristic oil-paint appearance.", "questionPages": [115, 116], "solutionPages": [121, 122], "questionFigures": ["crop-question-ch7-q2-1"], "solutionFigures": []}, {"id": "ch7-q3", "chapterId": 7, "chapter": "Staphylococci", "number": 3, "text": "Which factor forms the basis of co-agglutination reaction shown by Staphylococcus aureus?", "options": [{"id": "A", "text": "Protein A"}, {"id": "B", "text": "Clumping factor"}, {"id": "C", "text": "Beta hemolysin"}, {"id": "D", "text": "Coagulase"}], "correctIndex": 0, "correctLetter": "A", "solution": "Protein A forms the basis of the co-agglutination reaction shown by Staphylococcus aureus.\nProtein A bearing staphylococci are coated with IgG antiserum. Protein A binds to the Fc terminal\nof IgG, leaving the Fab terminal free to combine with its specific antigen. The corresponding\nantigen is then added to this mixture which causes agglutination of the bacteria. This is known as\nthe co-agglutination reaction. It is used for streptococcal, gonococcal or hemophilus typing.", "questionPages": [116], "solutionPages": [122], "questionFigures": [], "solutionFigures": ["crop-solution-ch7-q3-1"]}, {"id": "ch7-q4", "chapterId": 7, "chapter": "Staphylococci", "number": 4, "text": "Which of the following toxins exhibits hot-cold phenomenon?", "options": [{"id": "A", "text": "° -hemolysin"}, {"id": "B", "text": "B-hemolysin"}, {"id": "C", "text": "y-hemolysin"}, {"id": "D", "text": "5-hemolysin"}], "correctIndex": 1, "correctLetter": "B", "solution": "B-hemolysin exhibits a hot-cold phenomenon.\nB-hemolysin is a sphingomyelinase that is hemolytic only for sheep cells but not human cells. It\ninitiates hemolysis at 370C but the hemolysis is evident only after chilling. This is called the\nhot-cold phenomenon.", "questionPages": [116, 117], "solutionPages": [122], "questionFigures": [], "solutionFigures": []}, {"id": "ch7-q5", "chapterId": 7, "chapter": "Staphylococci", "number": 5, "text": "Which of the following pairs of toxins produced by Staphylococcus aureus are called\nsynergohymenotropic toxins?", "options": [{"id": "A", "text": "° and f toxins"}, {"id": "B", "text": "B and Panton-Valentine-toxins"}, {"id": "C", "text": "y and Panton-Valentine-toxins"}, {"id": "D", "text": "B and 6 toxins"}], "correctIndex": 2, "correctLetter": "C", "solution": "y-toxin and Panton-Valentine-toxin (leucocidin) of Staphylococcus aureus are called\nsynergohymenotropic toxins.\nSynergohymenotropic (synergo - working together, hymenotropic - form pores) toxins are a family\nof bicomponent toxins that act through the synergistic activity of 2 non-associated secretory\nproteins - class F and class S proteins. Gamma hemolysin has two components necessary for its\nhemolytic action. It is encoded by three genes HlgA and HlgC (belonging to class S) and HlgB\n(belonging to class F), resulting in 2 pairs of class S and F components - HlgA and HlgB, or HlgC\nand HlgB.\n\n\n\nPanton-Valentine Leucocidin is composed of two components- S and F - encoded by two\ncontiguous and cotranscribed genes, lukS-PV and lukF-PV. It is associated with the majority of\ncommunity-associated methicillin-resistant Staphylococcus aureus (CA-MRSA).", "questionPages": [117], "solutionPages": [122, 123], "questionFigures": [], "solutionFigures": []}, {"id": "ch7-q6", "chapterId": 7, "chapter": "Staphylococci", "number": 6, "text": "Which of the following staphylococcal infections is not toxin mediated?", "options": [{"id": "A", "text": "Food poisoning"}, {"id": "B", "text": "Toxic shock syndrome"}, {"id": "C", "text": "Septicemia"}, {"id": "D", "text": "Staphylococcal scalded skin syndrome"}], "correctIndex": 2, "correctLetter": "C", "solution": "Staphylococcal septicemia is not toxin mediated.\nSepticemia occurs due to the invasion of bacterial organisms into the bloodstream. This causes an\ninflammatory response to bacterial products, leading to various manifestations seen in sepsis -\nfever, hypotension, alkalosis.\nToxin mediated staphylococcal infections include food poisoning caused by enterotoxin, toxic\nshock syndrome caused by toxic shock syndrome toxin and staphylococcal scalded skin syndrome\ncaused by exfoliative/epidermolytic toxin.", "questionPages": [117], "solutionPages": [123], "questionFigures": [], "solutionFigures": []}, {"id": "ch7-q7", "chapterId": 7, "chapter": "Staphylococci", "number": 7, "text": "A college student with a history of intravenous drug abuse presents with a fever for the last 3\nweeks. Echocardiography is performed which reveals large friable vegetations on the cusps of\nthe tricuspid valve. Which of the following organisms is the most common cause for this\ncondition?", "options": [{"id": "A", "text": "Staphylococcus aureus"}, {"id": "B", "text": "Staphylococcus epidermidis"}, {"id": "C", "text": "Streptococcus gallolyticus"}, {"id": "D", "text": "Streptococcus viridans"}], "correctIndex": 0, "correctLetter": "A", "solution": "Fever with vegetations on the tricuspid valve points to a diagnosis of right-sided infective\nendocarditis. Staphylococcus aureus is the most common cause of right-sided infective\nendocarditis among intravenous drug abusers.\nInfective endocarditis is the microbial infection of heart valves or endocardium, leading to the\nformation of vegetations (thrombotic debris and microbial organisms).The following image shows\na graphical illustration of vegetations seen in infective endocarditis.", "questionPages": [117], "solutionPages": [123], "questionFigures": [], "solutionFigures": ["crop-solution-ch7-q7-1"]}, {"id": "ch7-q8", "chapterId": 7, "chapter": "Staphylococci", "number": 8, "text": "By which of the following mechanisms is penicillin resistance commonly transferred to\nStaphylococcus aureus?", "options": [{"id": "A", "text": "Change in PBP"}, {"id": "B", "text": "Conjugation"}, {"id": "C", "text": "Transduction"}, {"id": "D", "text": "Production of B-lactamase"}], "correctIndex": 2, "correctLetter": "C", "solution": "Penicillin resistance in Staphylococcus aureus is determined by plasmids that are most commonly\ntransferred by transduction.\nPenicillin resistance in Staphylococci most commonly occurs due to bacterial production of\nbeta-lactamase, which inactivates penicillins by splitting their beta-lactam ring. These enzymes\nare inducible and are plasmid-mediated. They confer resistance to penicillin G, ampicillin,\npiperacillin etc.\nThe genetic transfer of antibiotic resistance can occur in the following ways:\n* Transformation: After death or cell lysis, some bacteria release their DNA into the environment.\nOther bacteria, generally of the same species, can come into contact with these free DNA\nfragments, take them up and incorporate them into their DNA by recombination.\n* Transduction: This method involves the transfer of DNA, episome or plasmid from one\nbacterium to another with the use of a bacteriophage.\n* Conjugation: This mechanism requires the presence of a special plasmid called the F plasmid\nthat codes for the sex pilus. It is the most common method of transfer of antibiotic resistance in\nmost other bacteria.\nNote: Change in penicillin binding proteins (PBPs) and production of B-lactamases are modes of\npenicillin resistance seen in S. aureus but the question asks for methods of transfer of drug\nresistance.", "questionPages": [117, 118], "solutionPages": [123, 124], "questionFigures": [], "solutionFigures": []}, {"id": "ch7-q9", "chapterId": 7, "chapter": "Staphylococci", "number": 9, "text": "Contact based isolation is employed for which of the following diseases?", "options": [{"id": "A", "text": "Diphtheria"}, {"id": "B", "text": "MRSA"}, {"id": "C", "text": "Mumps"}, {"id": "D", "text": "Asthma"}], "correctIndex": 1, "correctLetter": "B", "solution": "Contact based isolation is employed for patients who are infected with\nMRSA (methicillin-resistant Staphylococcus aureus).\nThe three categories of transmission-based precautions include:\n* Contact-based isolation is used for infections, diseases, or germs that are spread by touching the\npatient or items in the room. Examples include MRSA, vancomycin-resistant enterococci (VRE),\ndiarrheal illnesses, open wounds, and respiratory syncytial virus (RSV).\n+ Droplet-based isolation is employed for diphtheria and mumps.\n+ Airborne precautions are required to protect against conditions like measles, severe acute\nrespiratory syndrome (SARS), varicella (chickenpox), and Mycobacterium tuberculosis.", "questionPages": [118], "solutionPages": [124], "questionFigures": [], "solutionFigures": []}, {"id": "ch7-q10", "chapterId": 7, "chapter": "Staphylococci", "number": 10, "text": "An outbreak of methicillin-resistant Staphylococcus aureus infection was reported in the\nsurgical ward of a hospital. Which of the following precautionary measures would you\nrecommend to best curb its spread?", "options": [{"id": "A", "text": "Administration of vancomycin empirically to all the patients"}, {"id": "B", "text": "Frequent fumigation of wards"}, {"id": "C", "text": "Wearing masks before performing invasive procedures"}, {"id": "D", "text": "Washing of hands before & after treating the patients"}], "correctIndex": 3, "correctLetter": "D", "solution": "Among the given options, washing hands before and after treating the patients is the most\neffective way to curb the spread of methicillin-resistant Staphylococcus aureus (MRSA) infections.\nIn addition to this, personnel with active S. aureus lesions and carriers should be excluded from\nareas having patients at highest risk for severe staphylococcal infections like newborn nurseries,\nintensive care units, operating rooms, and cancer chemotherapy wards. In such individuals, the\napplication of topical antiseptics such as mupirocin to nasal or perineal carriage sites may\ndiminish the shedding of MRSA.", "questionPages": [118], "solutionPages": [124, 125], "questionFigures": [], "solutionFigures": []}, {"id": "ch7-q11", "chapterId": 7, "chapter": "Staphylococci", "number": 11, "text": "A 32-year-old man presented with multiple tender, erythematous fluctuant skin lesions as\nshown in the image. You suspect it to be a case of botryomycosis. Which of the following is\nthe most likely organism implicated in this condition?", "options": [{"id": "A", "text": "Madurella mycetomatis"}, {"id": "B", "text": "Actinomyces israelii"}, {"id": "C", "text": "Staphylococcus aureus"}, {"id": "D", "text": "Staphylococcus lugdunensis"}], "correctIndex": 2, "correctLetter": "C", "solution": "The most common cause of botryomycosis is Staphylococcus aureus.\nBotryomycosis is a rare chronic bacterial granulomatous disease that usually involves the skin and\nrarely viscera. It is most commonly caused by Staphylococcus aureus but can also be caused by\nPseudomonas, Escherichia coli, Proteus, and Streptococci. Patients present with chronic,\nsuppurative, granulomatous skin lesions like nodules, abscesses and sinuses.\nActinomycetoma, eumycetoma and botryomycosis are difficult to distinguish clinically but are\nreadily distinguished with microbiologic testing or biopsy. Granules of botryomycosis consist of\nloose masses of cocci. Organisms can also be seen in wound discharge or histologic specimens.", "questionPages": [118, 119], "solutionPages": [125], "questionFigures": ["crop-question-ch7-q11-1"], "solutionFigures": []}, {"id": "ch7-q12", "chapterId": 7, "chapter": "Staphylococci", "number": 12, "text": "A 14-year-old boy presents with a history of vomiting within 3 hours of consumption of food\nat a party. Which of the following organism is most likely to cause these symptoms?", "options": [{"id": "A", "text": "Staphylococcus aureus"}, {"id": "B", "text": "Clostridium botulinum"}, {"id": "C", "text": "Clostridium perfringes"}, {"id": "D", "text": "Salmonella typhi"}], "correctIndex": 0, "correctLetter": "A", "solution": "Vomiting 2 hours after the consumption of food is likely food poisoning by Staphylococcus\naureus.\nStaphylococcus aureus can grow in carbohydrate and protein food sources, producing\nenterotoxins. There are 15 types, all of which are superantigens. They are preformed toxins that\nare relatively heat stable. They stimulate the vagus nerve, vomiting centre of the brain and\nintestinal peristaltic activity. Type A enterotoxin is responsible for most cases of food poisoning.\nThe common sources of infection are the foods that are not cooked after handling. These include\nsliced meats, puddings, pastries, and sandwiches. Ingestion of such contaminated food causes\nfood poisoning within 30 minutes to 6 hours after consumption. Patients present with nausea,\nvomiting, stomach cramps, and diarrhoea.", "questionPages": [119], "solutionPages": [125], "questionFigures": [], "solutionFigures": []}, {"id": "ch7-q13", "chapterId": 7, "chapter": "Staphylococci", "number": 13, "text": "An 18-year-old girl presented with burning micturition and fever with chills for three days.\nUrine culture grew bacteria which were coagulase-negative and novobiocin-resistant. Which\nof the following is the most likely organism implicated here?", "options": [{"id": "A", "text": "Staphylococcus aureus"}, {"id": "B", "text": "Staphylococcus hominis"}, {"id": "C", "text": "Staphylococcus epidermidis"}, {"id": "D", "text": "Staphylococcus saprophyticus"}], "correctIndex": 3, "correctLetter": "D", "solution": "Burning micturition and fever with chills in a young woman points to a diagnosis of urinary tract\ninfection (UTI). The most likely organism implicated here is Staphylococcus saprophyticus as it is\ncoagulase-negative and novobiocin-resistant.\nStaphylococcus saprophyticus is a part of the normal flora of human skin and periurethral area\nand thus is a common cause of urinary tract infection (UTI) in young women.\n\n\n\nOption A: Staphylococcus aureus is a coagulase-positive bacterium. It is an uncommon cause of\nUTI.\nOptions B and C: Staphylococcus hominis and Staphylococcus epidermidis are coagulase-negative\nand novobiocin-sensitive. They are usually considered contaminants if found on urine culture but\nthey may also cause UTIs in children with underlying urinary tract abnormalities.", "questionPages": [119, 120], "solutionPages": [125, 126], "questionFigures": [], "solutionFigures": ["crop-solution-ch7-q13-1"]}, {"id": "ch7-q14", "chapterId": 7, "chapter": "Staphylococci", "number": 14, "text": "Choose the incorrect statement regarding Micrococci.", "options": [{"id": "A", "text": "It is modified oxidase positive."}, {"id": "B", "text": "It is catalase positive."}, {"id": "C", "text": "It is rarely associated with disease."}, {"id": "D", "text": "It is arranged in chains."}], "correctIndex": 3, "correctLetter": "D", "solution": "Micrococci are arranged in pairs, tetrads or clusters of eight.\nMicrococci are Gram-positive cocci that are often mistaken for S. aureus. However, they are larger\nin size and mostly occur in pairs, tetrads or clusters of eight. They form smaller colonies in culture\nin comparison to S. aureus. Hugh-Leifson oxidation-fermentation test can be used\nto differentiate between micrococci (oxidative pattern) and staphylococci (fermentative pattern).\nMicrococci are catalase-positive and modified oxidase-positive. They are ordinarily\nnon-pathogenic but can rarely cause infections in an immunocompromised host. They are part of\nnormal bacterial flora in the body.\nThe following image shows the tetrad arrangement of micrococci:\n\n\n\nDifferent bacteria with their typical arrangements are given below:\n1. Staphylococcus: Clusters\n2. Streptococcus: Chains\n3. Pneumococcus: Pairs/lanceolate shaped\n4. Micrococcus: Tetrads", "questionPages": [120], "solutionPages": [126, 127], "questionFigures": [], "solutionFigures": ["crop-solution-ch7-q14-1"]}, {"id": "ch8-q1", "chapterId": 8, "chapter": "Corynebacterium, Listeria and Actinomyces", "number": 1, "text": "A father brought his 9-year-old unimmunized child to the pediatric OPD with complaints of\nfever, sore throat and difficulty in swallowing. The findings of oropharyngeal examination are\nshown in the image below. Which of the following is the most likely causative organism of\nthis condition?", "options": [{"id": "A", "text": "Gram-negative diplococci"}, {"id": "B", "text": "Spiral gram-negative bacteria"}, {"id": "C", "text": "Club-shaped gram-positive bacilli"}, {"id": "D", "text": "Gram-positive cocci in chains"}], "correctIndex": 2, "correctLetter": "C", "solution": "Fever, sore throat and difficulty in swallowing with the presence of a dirty white pseudomembrane\non the posterior pharynx is strongly suggestive of diphtheria caused by Corynebacterium\ndiphtheriae. They are described as club-shaped gram positive bacilli.\nCorynebacterium diphtheriae are gram-positive, non-sporing, non-capsulated and non-motile\nbacilli. They possess polymetaphosphate granules that serve as storage granules and are\ncalled metachromatic granules. These give the bacilli a beaded or club-shaped appearance on\nmicroscopic examination.\n\n\n\nOther options:\nOption A: Gram-negative diplococci describes Neisseria menigitidis and N. gonorrhoeae.\nOption C: Spiral gram-negative bacteria describes Campylobacter spp. and Helicobacter spp..\nOption D: Gram-positive cocci in chains describes Streptococci. They typically cause acute\nexudative pharyngitis characterised by purulent exudate over the tonsils.", "questionPages": [128], "solutionPages": [137], "questionFigures": ["crop-question-ch8-q1-1"], "solutionFigures": ["crop-solution-ch8-q1-1"]}, {"id": "ch8-q2", "chapterId": 8, "chapter": "Corynebacterium, Listeria and Actinomyces", "number": 2, "text": "A patient has complains of fever with chills. A throat examination reveals swollen glands and\na thick, whitish membrane over his tonsils. Albert staining is to be done. What are the\nconstituents of Albert's stain?", "options": [{"id": "A", "text": "Carbol fuschin and methylene blue"}, {"id": "B", "text": "Carbol fuschin and malachite green"}, {"id": "C", "text": "Toluidine and malachite green"}, {"id": "D", "text": "Toluidine and methylene blue"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given scenario is suggestive of diphtheria caused by Corynebacterium diphtheria. This\norganism is stained using Albert's stain which contains toluidine blue 'O' and malachite\ngreen. Both these dyes have an affinity for acidic cytoplasm as they are basic dyes.\nAlbert’s, Neisser’s, and Ponder’s stain are used to demonstrate the metachromatic\ngranules(Volutin / Babes Ernst granules) of Corynebacterium diphtheria.\nCorynebacterium diphtheria appears as green-coloured bacilli with purple-blue-coloured\nmetachromatic granules in cuneiform arrangement.", "questionPages": [128, 129], "solutionPages": [137, 138], "questionFigures": [], "solutionFigures": ["crop-solution-ch8-q2-1"]}, {"id": "ch8-q3", "chapterId": 8, "chapter": "Corynebacterium, Listeria and Actinomyces", "number": 3, "text": "Which of the following is not a selective medium for Corynebacterium diptheriae?", "options": [{"id": "A", "text": "Tinsdale medium"}, {"id": "B", "text": "Loeffler's serum slope"}, {"id": "C", "text": "Potassium tellurite agar"}, {"id": "D", "text": "McLeod's medium"}], "correctIndex": 1, "correctLetter": "B", "solution": "Loeffler's serum slope is an enriched medium for the growth of Corynebacterium diphtheriae. It is\nnot a selective medium as other organisms can also grow on this medium.\nThe selective media for Corynebacterium diphtheria are potassium tellurite agar, Tinsdale\nmedium and McLeod's medium (tellurite blood agar). Tellurite inhibits the growth of other\nbacteria. C. diphtheria reduces the tellurite to metallic tellurium, giving its colonies a grey black\ncolour. On\nOn Loeffler's serum slope, colonies appear as small white opaque discs that may acquire a yellow\nting. The advantages for growing C. diphtheriae on Loeffler's serum slope are rapid growth in 6-8\nhrs and that its the best medium for metachromatic granules production. The disadvantage of\nusing this medium is that on incubation beyond 6-8 hrs, it supports the growth of commensals as\nwell.", "questionPages": [129], "solutionPages": [138], "questionFigures": [], "solutionFigures": []}, {"id": "ch8-q4", "chapterId": 8, "chapter": "Corynebacterium, Listeria and Actinomyces", "number": 4, "text": "A throat swab taken from a patient who presented with fever, dysphagia and cervical\nlymphadenopathy was sent for culture on potassium tellurite agar. The resultant colonies had\na poached egg appearance. Which among the following is the most likely organism implicated\nhere?", "options": [{"id": "A", "text": "Corynebacterium diphtheriae gravis"}, {"id": "B", "text": "Corynebacterium diphtheriae mitis"}, {"id": "C", "text": "Corynebacterium diphtheriae intermedius"}, {"id": "D", "text": "Corynebacterium pseudotuberculosis"}], "correctIndex": 1, "correctLetter": "B", "solution": "Poached egg colonies on potassium tellurite agar indicate Corynebacterium diphtheriae mitis.\nMacleod classified diphtheria bacilli based on colony morphology on tellurite blood agar into the\nfollowing three types:\n* Gravis: They form daisy head colonies and are variably hemolytic. They ferment glycogen and\nstarch.\n* Intermedius: They form frog’s egg colonies and are non-hemolytic. They do not ferment glycogen\nand starch.\n* Mitis: They form poached egg colonies and are hemolytic. They do not ferment glycogen and\nstarch.\n\n\n\nThe following image shows the various colony morphologies of C. diphtheriae.", "questionPages": [129], "solutionPages": [138, 139], "questionFigures": [], "solutionFigures": ["crop-solution-ch8-q4-1"]}, {"id": "ch8-q5", "chapterId": 8, "chapter": "Corynebacterium, Listeria and Actinomyces", "number": 5, "text": "The toxin produced by the organisms shown below acts via?", "options": [{"id": "A", "text": "Increase in cAMP"}, {"id": "B", "text": "Increase in cGMP"}, {"id": "C", "text": "ADP ribosylation of EF2"}, {"id": "D", "text": "RNA glycosidase"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given image shows gram-positive rods with club-shaped ends, beaded appearance, and\na Chinese-letter pattern of arrangement indicative of Corynebacterium diphtheriae.\nThe toxin produced by the bacteria - diphtheria toxin - inhibits polypeptide chain elongation and\nprotein synthesis by inactivating the elongation factor-2 (EF-2) by ADP ribosylation. It has two\nfragments - fragment B helps in binding of the toxin to host cells and fragment A inactivates EF-2.", "questionPages": [129, 130], "solutionPages": [139], "questionFigures": ["crop-question-ch8-q5-1"], "solutionFigures": ["crop-solution-ch8-q5-1"]}, {"id": "ch8-q6", "chapterId": 8, "chapter": "Corynebacterium, Listeria and Actinomyces", "number": 6, "text": "Which of the following bacteria gain toxigenicity by lysogenic conversion?", "options": [{"id": "A", "text": "Corynebacterium diphtheriae"}, {"id": "B", "text": "Enterotoxigenic E. coli"}, {"id": "C", "text": "Shigella dysenteriae"}, {"id": "D", "text": "Klebsiella pneumoniae"}], "correctIndex": 0, "correctLetter": "A", "solution": "Lysogenic or phage conversion is seen in Corynebacterium diphtheriae.\nThe toxigenicity of diphtheria bacillus depends on the presence of the corynephages (tox+). When\nthe bacillus is cured of the phage, its toxigenic capacity is lost.\nA bacteriophage is a virus that parasitises bacteria. It can carry host DNA and transfer it to\nanother bacterium. In lysogenic conversion, the viral DNA is integrated with the bacterial DNA\nand thus can code for new characteristics, like toxin production. The conversion of non-toxigenic\nbacterial strains to toxigenic by infecting them with bacteriophages is known as lysogenic\nconversion.\ngenome. On to daughuer cel,\n>\nFi _", "questionPages": [130], "solutionPages": [139, 140], "questionFigures": [], "solutionFigures": ["crop-solution-ch8-q6-1"]}, {"id": "ch8-q7", "chapterId": 8, "chapter": "Corynebacterium, Listeria and Actinomyces", "number": 7, "text": "Which of the following factors does not affect the toxin production of Corynebacterium\ndiphtheria?", "options": [{"id": "A", "text": "Concentration of iron in the medium"}, {"id": "B", "text": "Tox Phage"}, {"id": "C", "text": "Biotype"}, {"id": "D", "text": "Concentration of zinc in the medium"}], "correctIndex": 3, "correctLetter": "D", "solution": "Toxin production of Corynebacterium diphtheriae depends on the concentration of iron in the\nmedium, presence of tox phage, and its biotype. Concentration of zinc in the medium has no\neffect on this process.\nAn increase in iron concentration (option A) upregulates the DT (diphtheria toxin) repressor gene,\nthereby decreasing the toxin production. The optimum level of iron in the medium for toxin\nproduction is 0.14 g/millilitre, while a concentration of 0.5 pg/millilitre inhibits the formation of\ntoxins.\nThe gene for diphtheria toxin is coded by bacteriophage (corynebacteriophage toxt) and thus the\npresence of phages (option B) is integral to toxin production. Toxin production also depends on\nthe biotype (option C) - gravis, intermedius, mitis and belfanti - of the bacilli. All four biotypes are\ntoxigenic.\nDiphtheria toxin is also produced by Corynebacterium ulcerans and Corynebacterium\npseudotuberculosis.", "questionPages": [130], "solutionPages": [140], "questionFigures": [], "solutionFigures": []}, {"id": "ch8-q8", "chapterId": 8, "chapter": "Corynebacterium, Listeria and Actinomyces", "number": 8, "text": "What is Elek’s gel precipitation test used to test?", "options": [{"id": "A", "text": "Susceptibility to Corynebacterium diphtheriae"}, {"id": "B", "text": "Biotype of Corynebacterium diphtheriae"}, {"id": "C", "text": "Toxigenicity of Corynebacterium diphtheriae"}, {"id": "D", "text": "Antibody titer against Corynebacterium diphtheriae"}], "correctIndex": 2, "correctLetter": "C", "solution": "Elek's test is used to test the toxigenicity of Corynebacterium diphtheriae.\nElek's gel precipitation test is an in vitro immunoprecipitation (immunodiffusion) test used to\ndetermine whether or not a strain of Corynebacterium diphtheriae is toxigenic. In this test, a\nrectangular strip of filter paper impregnated with diphtheria antitoxin is placed on the surface of a\n20% normal horse serum agar. Narrow streaks of the C. diphtheriae strains are made at right\nangles to the filter paper strip with positive and negative controls. If the strain produces toxins,\nthe toxin will diffuse in the agar and produce a line of precipitation (arrowhead) where it meets\nthe antitoxin at optimum concentration.\nThe test is shown in the image below.\nOption A: For checking susceptibility to diphtheria, Schick test is used.\nOption B: The biotype of diphtheria can be determined based on colony morphology and\nbiochemical reactions.\nOption D: The antibody titer against diphtheria can be measured by various serological methods\nlike passive haemagglutination, latex agglutination test, toxoid enzyme-linked immunosorbent\nassay (Toxoid-ELISA), and toxin-binding inhibition ELISA (ToBI-ELISA).", "questionPages": [130], "solutionPages": [140, 141], "questionFigures": [], "solutionFigures": ["crop-solution-ch8-q8-1"]}, {"id": "ch8-q9", "chapterId": 8, "chapter": "Corynebacterium, Listeria and Actinomyces", "number": 9, "text": "What diphtheria antibody titer is considered optimally protective?", "options": [{"id": "A", "text": ">0.11U/ml"}, {"id": "B", "text": ">0.011U/ml"}, {"id": "C", "text": ">0.05 IU/ml"}, {"id": "D", "text": ">0.5 IU/ml"}], "correctIndex": 0, "correctLetter": "A", "solution": "Diphtheria antibody titer is considered optimally protective if the titre is >o.1 IU/mL.\nDiphtheria is primarily the result of the action of diphtheria toxin, not bacterial invasion. Hence,\nantibodies to the diphtheria toxin is a good measure of protection against diphtheria. These\nantibodies can be induced by immunisation with diphtheria toxoid vaccine. The titers of IgG\nantibody against diphtheria toxoid vaccine reflect various levels of protection against the disease\nas follows:\n+ <o0.01 IU/mL: No protection\n* 0.01 -0.1 IU/mL: Minimal protection\n\n\n\n* >o.1 IU/mL: Optimal protection\nNote: The question asks optimally protective titer and not minimum effective titer which is\n>o.01 IU/mL.", "questionPages": [130, 131], "solutionPages": [141, 142], "questionFigures": [], "solutionFigures": []}, {"id": "ch8-q10", "chapterId": 8, "chapter": "Corynebacterium, Listeria and Actinomyces", "number": 10, "text": "A 5-year-old boy presented with fever, sore throat, dysphagia, and a tonsillar\npseudomembrane. Which of the following complications will you not anticipate in him?", "options": [{"id": "A", "text": "Asphyxia"}, {"id": "B", "text": "Otitis media"}, {"id": "C", "text": "Myocarditis"}, {"id": "D", "text": "Pupillary paralysis"}], "correctIndex": 3, "correctLetter": "D", "solution": "A child with fever, sore throat, dysphagia, and a tonsillar pseudomembrane likely has diphthteria.\nPupillary reactions remain normal and pupillary paralysis is not a complication seen with\ndiphtheria.\nThe complications of diphtheria include asphyxia due to the mechanical airway obstruction by the\npseudomembrane. Myocarditis and polyneuropathy are toxic complications of diphtheria.\nPatients may develop post diphtheritic paralysis involving palatine and ciliary nerves. Paralysis of\nthe diaphragm and neurogenic bladder dysfunction may also occur. Acute circulatory failure,\nseptic complications, such as pneumonia and otitis media and renal failure may also occur.", "questionPages": [131], "solutionPages": [142], "questionFigures": [], "solutionFigures": []}, {"id": "ch8-q11", "chapterId": 8, "chapter": "Corynebacterium, Listeria and Actinomyces", "number": 11, "text": "Which of the following features is not typically seen in diphtheroids?", "options": [{"id": "A", "text": "They possess few or no metachromatic granules"}, {"id": "B", "text": "They are usually arranged in parallel rows"}, {"id": "C", "text": "Most of them do not produce toxins"}, {"id": "D", "text": "They do not ferment sucrose"}], "correctIndex": 3, "correctLetter": "D", "solution": "Diphtheroids ferment both sucrose and glucose, whereas Corynebacterium diphtheriae ferments\nonly glucose.\nSucrose fermentation is done to differentiate between C. diphtheriae and diphtheroids.\nDiphtheroids:\n+ They are corynebacteria resembling C. diphtheriae which occur as normal commensals in the\nthroat, skin, conjunctiva and other areas.\n+ In general, diphtheroids stain more uniformly than diphtheria bacilli and possess few or no\nmetachromatic granules.\n* Most of them do not produce toxins.\n* They tend to be arranged in parallel rows (palisades) rather than the cuneiform pattern.\n+ The common diphtheroids include Corynebacterium xerosis.", "questionPages": [131], "solutionPages": [142], "questionFigures": [], "solutionFigures": []}, {"id": "ch8-q12", "chapterId": 8, "chapter": "Corynebacterium, Listeria and Actinomyces", "number": 12, "text": "A 45-year-old fisherman presents with pain and a lesion in his hand similar to what is shown\nin the image. What is the causative organism for this condition?", "options": [{"id": "A", "text": "Streptococcus pyogenes"}, {"id": "B", "text": "Corynebacterium xerosis"}, {"id": "C", "text": "Erysipelothrix rhusiopathiae"}, {"id": "D", "text": "Bacillus anthracis"}], "correctIndex": 2, "correctLetter": "C", "solution": "The above image shows a raised, well-circumscribed, violaceous lesion with the absence of pus.\nThus, it is erysipeloid which is a skin infection caused by Erysipelothrix rhusiopathiae.\nErysipeloid usually occurs on the fingers by direct inoculation at the site of a cut or abrasion, in\npeople who handle animals, fish or animal products. Pain, swelling and erythema develop and the\ncondition has been called seal finger and whale finger. Pus is usually absent at the infection site,\nwhich helps differentiate it from staphylococcal and streptococcal skin infections. It resolves\nwithout treatment in 3-4 weeks.\n\n\n\nErysipelothrix rhusiopathiae is a slender, non-motile, non-sporing Gram positive bacillus. It is\ncatalase, oxidase, and indole negative. It causes disease in multiple land animals like swine,\nturkeys and sheep.\nNote: Erysipelas is caused by Streptococcus pyogenes. It presents as erythematous raised lesions\nwith sharply demarcated edges.", "questionPages": [131, 132], "solutionPages": [142, 143], "questionFigures": ["crop-question-ch8-q12-1"], "solutionFigures": []}, {"id": "ch8-q13", "chapterId": 8, "chapter": "Corynebacterium, Listeria and Actinomyces", "number": 13, "text": "A 1-day-old newborn developed severe sepsis and died after 1 day despite aggressive\ntreatment. On examination, multiple granulomas are present over the skin. The organism\nisolated from the blood sample shows the motility depicted below. What is the most likely\ncausative organism?", "options": [{"id": "A", "text": "Treponema pallidum"}, {"id": "B", "text": "Vibrio cholera"}, {"id": "C", "text": "Listeria monocytogenes"}, {"id": "D", "text": "Clostridium"}], "correctIndex": 2, "correctLetter": "C", "solution": "Early onset sepsis with skin granulomas and organisms showing tumbling motility points to a\ndiagnosis of granulomatosis infantiseptica caused by Listeria monocytogenes.\nListeria monocytogenes shows slow tumbling motility when grown at 25 °C. But at 37°C, it is\nnon-motile because the peritrichous flagella are produced by the bacillus optimally between\n20°C and 30°C. This is known as differential motility as motility pattern changes with a change in\ntemperature. Listeria moves from cell-to-cell using host cell actin framework.\nListeria infection can manifest as febrile gastroenteritis, bacteremia, neurolisteriosis and\ngranulomatosis infantiseptica.", "questionPages": [132, 133], "solutionPages": [143], "questionFigures": ["crop-question-ch8-q13-1"], "solutionFigures": []}, {"id": "ch8-q14", "chapterId": 8, "chapter": "Corynebacterium, Listeria and Actinomyces", "number": 14, "text": "A 45-year-old man presents to the OPD with complaints of fever with chills, headache,\nabdominal pain, and diarrhoea. He gives a history of consuming raw refrigerated cucumbers\nthe previous day. What is the most likely etiologic organism?", "options": [{"id": "A", "text": "Staphylococcus aureus"}, {"id": "B", "text": "Bacillus cereus"}, {"id": "C", "text": "Listeria monocytogenes"}, {"id": "D", "text": "Vibrio cholerae"}], "correctIndex": 2, "correctLetter": "C", "solution": "Fever, headache, abdominal pain, diarrhoea following consumption of refridgerated food is\nsuggestive of food poisoning caused by Listeria monocytogenes.\nListeria monocytogenes can survive at refrigerator temperatures (4°C), under conditions of low\npH and high salt. So it is able to overcome food preservation and safety barriers, making it an\nimportant foodborne pathogen.\nHealthy persons exposed to L. monocytogenes in food may develop a mild, self-limiting febrile\ngastroenteritis lasting 1-3 days. This develops after an incubation period of 6-48 hours.\nSymptoms include fever, chills, headache, myalgias, abdominal pain, and diarrhea.\nImmunocompromised individuals can develop meningoencephalitis, bacteremia, or focal\ninfections.\nThe drug of choice is high dose intravenous ampicillin.", "questionPages": [133], "solutionPages": [143], "questionFigures": [], "solutionFigures": []}, {"id": "ch8-q15", "chapterId": 8, "chapter": "Corynebacterium, Listeria and Actinomyces", "number": 15, "text": "Multiple abscesses with discharging sinuses, demonstrating sulphur granules in pus, are\ncaused by", "options": [{"id": "A", "text": "Actinomyces"}, {"id": "B", "text": "Nocardia"}, {"id": "C", "text": "Salmonella"}, {"id": "D", "text": "Tularemia"}], "correctIndex": 0, "correctLetter": "A", "solution": "Multiple abscesses with discharging sinuses, demonstrating sulfur granules in pus, are\ncharacteristic of actinomycosis caused by Actinomyces.\nActinomycosis is a chronic granulomatous infection characterized by indurated swellings in\nthe connective tissue with suppuration and discharge of sulfur granules. The most common\ncausative agent is Actinomyces israelli.\n\n\n\nVarious clinical forms of actinomycosis include cervicofacial, thoracic, abdominal, and pelvic\nactinomycosis. Among them, oral-cervicofacial actinomycosis is most common, presenting as a\nsoft tissue swelling, abscess, or mass lesion involving the angle of the jaw.", "questionPages": [133], "solutionPages": [143, 144], "questionFigures": [], "solutionFigures": []}, {"id": "ch8-q16", "chapterId": 8, "chapter": "Corynebacterium, Listeria and Actinomyces", "number": 16, "text": "Which of the following is a false statement regarding Nocardia?", "options": [{"id": "A", "text": "They are aerobes"}, {"id": "B", "text": "They are acid-fast"}, {"id": "C", "text": "They are commensals"}, {"id": "D", "text": "They produce urease"}], "correctIndex": 2, "correctLetter": "C", "solution": "Nocardia are free-living organisms and not commensals.\nNocardia are aerobic Gram-positive filamentous bacilli. They are non-sporing. They are\nconsidered weakly acid-fast, determined by Kinyoun's acid-fast staining technique. They produce\nurease and are catalase positive. They are found in the soil. Nocardia asteroides is the Nocardia\nspecies which is most commonly involved in human disease (cutaneous and systemic). The\nparaffin bait technique is used for the isolation of Nocardia.", "questionPages": [133], "solutionPages": [144], "questionFigures": [], "solutionFigures": []}, {"id": "ch8-q17", "chapterId": 8, "chapter": "Corynebacterium, Listeria and Actinomyces", "number": 17, "text": "Identify the organism from the given image.", "options": [{"id": "A", "text": "Mycobacterium leprae"}, {"id": "B", "text": "Mycobacterium tuberculosis"}, {"id": "C", "text": "Actinomyces israelli"}, {"id": "D", "text": "Nocardia asteroides"}], "correctIndex": 3, "correctLetter": "D", "solution": "The organism shown in the image is Nocardia asteroides.\nNocardia species are weakly acid-fast filamentous organisms with hyphae-like branching on\nmicroscopy. They are aerobic, gram-positive, catalase-positive, and urease-positive. They are\nweakly acid-fast because they stain with carbolfuchsin and retain when decolourized with 1-4%\nsulfuric acid instead of the stronger acid-alcohol decolorant.\nInfection follows traumatic inoculation of the organism into the subcutaneous tissue from soil or\nvegetable sources. They can present with a characteristic powdery substance that appears as gritty\nor necrotic material on the skin or within soft tissues. Accompanying this are multiple discharging\nsinuses, which are abnormal openings that form as the body attempts to expel infected material.\nThese sinuses can drain purulent, often foul-smelling discharge typically associated with localised\nabscesses, and the discharge may be viscous, sometimes containing necrotic tissue.\nOther options:\nOptions A and B: Mycobacteria species are acid-fast but not have branching filaments.\nOption C: Actinomyces species are not acid-fast. They are Gram-positive arranged in a sun-ray\nappearance.", "questionPages": [133, 134], "solutionPages": [144], "questionFigures": ["crop-question-ch8-q17-1"], "solutionFigures": []}, {"id": "ch8-q18", "chapterId": 8, "chapter": "Corynebacterium, Listeria and Actinomyces", "number": 18, "text": "A patient presents with a mobile, warm to touch nodule in the neck. On the anaerobic culture\nof the biopsy material from this swelling, it showed colonies as shown in the image which had\ngram-positive branching rods on staining. Which of the following is the drug of choice in this\ncondition?", "options": [{"id": "A", "text": "Doxycycline"}, {"id": "B", "text": "Cotrimoxazole"}, {"id": "C", "text": "Penicillin"}, {"id": "D", "text": "Surgical drainage"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given image shows molar tooth colonies that are characteristic of Actinomyces species. The\ngiven clinical scenario of a mobile, warm to touch nodule in the neck describes cervicofacial\nactinomycosis also known as ‘lumpy jaw syndrome’. Penicillin is the drug of choice for\nactinomyces infection.\nActinomyces are Gram-positive anaerobic bacilli that produce molar tooth colonies on incubation\nfor 72 hours on brain-heart infusion agar. They cause a chronic suppurative and granulomatous\ninfection called actinomycosis. It can present as one of the following clinical types:\n\n\n\n* Cervicofacial type- Fluctuant mass in the jaw area producing draining fistulas.\n* Thoracic type- Pulmonary infection with fever, cough, and purulent sputum.\n+ Abdominal type- Occurs following ruptured appendix or ulcer. It may spread throughout the\nperitoneum and involve multiple organs.\nActinomycosis can spread to bones and surrounding tissue and produce multiple discharging\nsinuses. Treatment requires prolonged administration of penicillin for 6-12 months. In\npenicillin-allergic patients, clindamycin or erythromycin is effective. Surgical excision and\ndrainage may be required in some cases.\nThe given image shows cervicofacial actinomycosis.\nThe given image shows a patient with multiple cutaneous lesions caused by Actinomyces:", "questionPages": [134, 135], "solutionPages": [144, 145, 146], "questionFigures": ["crop-question-ch8-q18-1"], "solutionFigures": ["crop-solution-ch8-q18-1"]}, {"id": "ch8-q19", "chapterId": 8, "chapter": "Corynebacterium, Listeria and Actinomyces", "number": 19, "text": "Which of the following toxins act by inhibiting elongation factor -2?", "options": [{"id": "A", "text": "1 & 4"}, {"id": "B", "text": "2 & 4"}, {"id": "C", "text": "3 & 4"}, {"id": "D", "text": "4 & 5"}], "correctIndex": 0, "correctLetter": "A", "solution": "Both diphtheria toxin and pseudomonas exotoxin act by inhibiting elongation factor-2(EF-2).", "questionPages": [135], "solutionPages": [146], "questionFigures": [], "solutionFigures": []}, {"id": "ch8-q20", "chapterId": 8, "chapter": "Corynebacterium, Listeria and Actinomyces", "number": 20, "text": "The most common clinical form of actinomycosis is", "options": [{"id": "A", "text": "Abdominal"}, {"id": "B", "text": "Cervicofacial"}, {"id": "C", "text": "Pelvic"}, {"id": "D", "text": "Thoracic"}], "correctIndex": 1, "correctLetter": "B", "solution": "The most common clinical form of actinomycosis is cervicofacial.\nActinomycosis is a chronic granulomatous infection characterized by indurated swellings, mainly\nin the connective tissue, suppuration, and discharge of sulphur granules. The most common\ncausative agent is Actinomycetes israelli.\nVarious clinical forms of actinomycosis involves cervicofacial, thoracic, abdominal, and pelvic\nactinomycosis. Among them, actinomycosis most frequently occurs as oral-cervicofacial form\npresenting as a soft tissue swelling, abscess, or mass lesion involving the angle of jaw.", "questionPages": [135, 136], "solutionPages": [146], "questionFigures": [], "solutionFigures": ["crop-solution-ch8-q20-1"]}, {"id": "ch9-q1", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 1, "text": "Which of the following organisms is capsulated?", "options": [{"id": "A", "text": "Clostridium tetani"}, {"id": "B", "text": "Clostridium difficile"}, {"id": "C", "text": "Clostridium perfringens"}, {"id": "D", "text": "Clostridium botulinum"}], "correctIndex": 2, "correctLetter": "C", "solution": "Clostridium perfringens is the capsulated organism among the given options.\n\nMost of the clostridial species are non-capsulated except C.perfringens and C.butyricum.\n\nAll clostridia are motile, with a peritrichate flagella, with the exception of:\n\n°C. perfringens\n\n*C. tetani type VI.", "questionPages": [147], "solutionPages": [], "questionFigures": [], "solutionFigures": []}, {"id": "ch9-q2", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 2, "text": "A young man presented with complaints of severe abdominal pain and watery diarrhoea eight\nhours after consuming meat at a restaurant. A stool sample was sent for culture and the\nisolated organism showed this appearance on litmus milk fermentation. Which of the\nfollowing is the most likely causative organism?", "options": [{"id": "A", "text": "Bacillus anthracis"}, {"id": "B", "text": "Clostridium tetani"}, {"id": "C", "text": "Clostridium perfringens"}, {"id": "D", "text": "Clostridium botulinum"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given clinical history and the image showing stormy fermentation of lactose in litmus milk is\nsuggestive of gastroenteritis caused by Clostridium perfingens type A.\nThe fermentation of lactose by this organism leads to the formation of acid which coagulates the\ncasein in litmus milk. The clotted milk is disrupted due to vigorous gas production and this\ncharacteristic finding is obtained that is called stormy fermentation.", "questionPages": [147, 148], "solutionPages": [155], "questionFigures": ["crop-question-ch9-q2-1"], "solutionFigures": []}, {"id": "ch9-q3", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 3, "text": "Which of the following reactions are positive for Clostridium perfringens?", "options": [{"id": "A", "text": "M'fadyean reaction, CAMP test"}, {"id": "B", "text": "M'fadyean reaction, Reverse CAMP test,"}, {"id": "C", "text": "Target hemolysis, Reverse CAMP test"}, {"id": "D", "text": "Stormy fermentation, Elek's test"}], "correctIndex": 2, "correctLetter": "C", "solution": "Target hemolysis and reverse CAMP test are positive for Clostridium perfringens.\nA narrow zone of complete hemolysis due to 6-toxin and a wider zone of incomplete hemolysis\ndue to ° -toxin results in development of target hemolysis on blood agar by C. perfringens.\nIn the reverse CAMP test, C.perfringens is streaked over the centre of the plate and Streptococcus\nagalactiae is streaked at right angles to it. A positive reverse CAMP test shows the presence of an\narrow-shaped zone of enhanced hemolysis pointing towards C.perfringens. ° -toxin produced by\nC.perfringens interacts with the CAMP factor and produce synergistic hemolysis.\nM'fadyean reaction is positive Bacillus anthracis.\nThe CAMP test is positive for Streptococcus agalactiae where it is inoculated on a plate streaked\nwith Staphylococcus aureus.\nElek's test is positive for Corynebacterium diptheriae.", "questionPages": [148], "solutionPages": [155], "questionFigures": [], "solutionFigures": []}, {"id": "ch9-q4", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 4, "text": "A middle-aged diabetic man presented to the ER with severe abdominal pain, diarrhea and\nvomiting following consumption of pork and sweet potato curry. Following admission, the\npatient developed intra-abdominal sepsis and was taken into emergency surgery.\nHistopathology of the resected intestine showed mucosal necrosis. Which of the following\ntoxins is likely implicated in his condition?", "options": [{"id": "A", "text": "° -toxin"}, {"id": "B", "text": "B-toxin"}, {"id": "C", "text": "8-toxin"}, {"id": "D", "text": "e-toxin"}], "correctIndex": 1, "correctLetter": "B", "solution": "The condition described here is necrotising enteritis(pigbel) that is caused by B-toxin\nof Clostridium perfringens type-C.\nThis is a severe and often fatal enteritis caused by C.perfringens type C strains with heat-resistant\nspores that germinate in the intestine producing beta toxin, causing mucosal necrosis. The\nevocative name 'pigbel' is New Guinea pidgin for abdominal pain and diarrhea following\nunaccustomed feasting on pig meat along with trypsin inhibitors like sweet potatoes.\nImmunisation with the type C toxoid has been shown to protect against this condition.", "questionPages": [148], "solutionPages": [155], "questionFigures": [], "solutionFigures": []}, {"id": "ch9-q5", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 5, "text": "Which of the toxins produced by clostridium species is the basis of Nagler's reaction?", "options": [{"id": "A", "text": "° -toxin"}, {"id": "B", "text": "B-toxin"}, {"id": "C", "text": "e-toxin"}, {"id": "D", "text": "6-toxin"}], "correctIndex": 0, "correctLetter": "A", "solution": "° -toxin produced by Clostridium perfringens forms the basis of Nagler's reaction.\nThe ° -toxin of C.perfringens has lecithinase activity. When C.perfringens is grown on a\nmedia containing egg yolk with the ° -antitoxin spread on one half of the plate, colonies on the\nother half without the antitoxin will be surrounded by a zone of opacity. There will be no opacity\naround the colonies on the half of the plate with the antitoxin due to the specific neutralization of\n° -toxin. This is known as Nagler's reaction.", "questionPages": [148], "solutionPages": [155, 156], "questionFigures": [], "solutionFigures": ["crop-solution-ch9-q5-1"]}, {"id": "ch9-q6", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 6, "text": "A patient presents with a laceration over his leg following trauma with an unclean sharp\nmetal rod 3 days ago. He also complains of difficulty in opening his mouth and abdominal\ncramps. Microscopy of the wound discharge revealed rod-shaped bacilli with terminal\nspherical spores. Which of the following is the organism most likely implicated here?", "options": [{"id": "A", "text": "Clostridium perfringens"}, {"id": "B", "text": "Clostridium botulinum"}, {"id": "C", "text": "Clostridium tertium"}, {"id": "D", "text": "Clostridium tetani"}], "correctIndex": 3, "correctLetter": "D", "solution": "The above clinical vignette is strongly suggestive of tetanus caused by Clostridium tetani. It is a\ngram-positive, slender bacillus that has a spherical and terminal spore, giving it a characteristic\ndrumstick appearance.\nThe genus clostridium consists of gram-positive, anaerobic, spore-forming bacilli.\nClassification of Clostridium based on shape and position of spores:\n* Central or equatorial: Clostridium bifermentans\n* Subterminal: Clostridium perfringens, Clostridium novyi, and Clostridium botulinum\n* Oval and terminal (tennis racket shaped ): Clostridium tertium and Clostridium difficile\n* Spherical and terminal (drumstick appearance): Clostridium tetani\nThe below image shows the characteristic drumstick appearance of C. tetani.", "questionPages": [148, 149], "solutionPages": [156, 157], "questionFigures": [], "solutionFigures": ["crop-solution-ch9-q6-1"]}, {"id": "ch9-q7", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 7, "text": "Which of the following is the first sign of generalized tetanus?", "options": [{"id": "A", "text": "Fever"}, {"id": "B", "text": "Increased respiratory and GI secretions"}, {"id": "C", "text": "Trismus"}, {"id": "D", "text": "Autonomic disturbance"}], "correctIndex": 2, "correctLetter": "C", "solution": "The first sign of generalized tetanus is increased tone of the masseter muscle, which results\nin trismus or lock-jaw.\nTetanus:\n+ Route of entry of organism- injury, unhygienic surgery, abortion/delivery, otitis media\n+ The incubation period is 6-10 days.\n+ First clinical sign- increased masseter tone (trismus/lock-jaw) followed by descending tetanus\n* Deep tendon reflex is exaggerated.\n+ In neonates, difficulty in feeding is the usual presentation.\n+ Diagnosis is always clinical, microscopy is unreliable.\n* Treatment includes cleaning the entry wound first in order to remove anaerobic foci of infection\nand prevent further toxin production. Metronidazole is preferred for antibiotic therapy. Antitoxin\nshould be given early in an attempt to deactivate any circulating tetanus toxin. Spasms are\ncontrolled by heavy sedation with benzodiazepines. Symptomatic treatment is given for\nrespiratory and cardiovascular derangements.", "questionPages": [149], "solutionPages": [157], "questionFigures": [], "solutionFigures": []}, {"id": "ch9-q8", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 8, "text": "Strychnine toxin acts by blocking the action of glycine at the post-synaptic receptors in the\nmotor neurons of the anterior horn of the spinal cord. Which of the following has a similar\nmechanism of action but acts presynaptically?", "options": [{"id": "A", "text": "° -toxin of C. perfringens"}, {"id": "B", "text": "Botulinum toxin"}, {"id": "C", "text": "Tetanus toxin"}, {"id": "D", "text": "Toxin A of C. difficile"}], "correctIndex": 2, "correctLetter": "C", "solution": "Tetanus toxin has similar mechanisms of action as strychnine but acts pre-synaptically.\nStrychnine prevents the uptake of glycine at inhibitory synapses post-synaptically, while\ntetanospasmin blocks release of inhibitory neurotransmitters like glycine and\ngamma-aminobutyric acid (GABA) pre-synaptically. This leads to increased release of\nacetylcholine, thereby leading to the development of spastic paralysis.\n\n\n\nThe image below depicts the mechanism of action of tetanus toxin.", "questionPages": [149], "solutionPages": [157, 158], "questionFigures": [], "solutionFigures": ["crop-solution-ch9-q8-1"]}, {"id": "ch9-q9", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 9, "text": "An 18-year-old girl presents with a contaminated wound sustained 4 hours ago. She had\nreceived complete immunization against tetanus 7 years ago. Which of the following\ninjections should be given to her?", "options": [{"id": "A", "text": "Full course tetanus toxoid"}, {"id": "B", "text": "Single dose tetanus toxoid"}, {"id": "C", "text": "Human tetanus immunoglobulin"}, {"id": "D", "text": "Human tetanus immunoglobulin and single dose of toxoid"}], "correctIndex": 1, "correctLetter": "B", "solution": "As she has received complete immunization against tetanus 7 years back, she should be given a\nsingle dose of tetanus toxoid for her contaminated wound.", "questionPages": [149], "solutionPages": [158], "questionFigures": [], "solutionFigures": []}, {"id": "ch9-q10", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 10, "text": "An elderly diabetic man presented to the ER with a contaminated wound with necrotic\nmaterial. As a first-year surgical resident, which of the following would be your first step in\ntreating the conditon?", "options": [{"id": "A", "text": "Anti-gas gangrene serum"}, {"id": "B", "text": "Debridement"}, {"id": "C", "text": "Antibiotics"}, {"id": "D", "text": "Tetanus toxoid"}], "correctIndex": 1, "correctLetter": "B", "solution": "Initial treatment for contaminated wounds with necrotic material is debridement.\nA contaminated wound with necrotic material is suggestive of a higher risk of clostridial\ninfection that may lead to gas gangrene. Emergent surgical exploration and\nthorough debridement are extremely important in the management of gas gangrene. Antibiotics\n(penicillin G plus clindamycin) and anti-gas gangrene serum have to be initiated after\ndebridement. Hyperbaric oxygen therapy may also be considered.", "questionPages": [149, 150], "solutionPages": [158], "questionFigures": [], "solutionFigures": []}, {"id": "ch9-q11", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 11, "text": "An 18-year-old man presented with sudden onset descending paralysis and blurred vision 3\ndays after the intake of canned food. On examination, the patient has quadriparesis with\nareflexia. Both the pupils are nonreactive. What is the most probable diagnosis?", "options": [{"id": "A", "text": "Poliomyelitis"}, {"id": "B", "text": "Botulism"}, {"id": "C", "text": "Gullian Barre Syndrome"}, {"id": "D", "text": "Tetanus"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given clinical vignette of acute onset descending flaccid paralysis with a history of\nconsumption of canned food is suggestive of botulism.\nThe incubation period from ingestion of contaminated food to the onset of symptoms in\nfood-borne botulism is usually 8-36 h but can be as long as 10 days and is dose-dependent. The\nclinical syndrome of botulism consists of bilateral cranial-nerve palsies that may progress to\nrespiratory compromise, a bilateral descending flaccid paralysis of voluntary muscles, and even\ndeath.\n\n\n\nCranial nerve deficits may manifest as some of the following:\n+ diplopia\n+ dysarthria\n+ dysphonia\n* ptosis\n* ophthalmoplegia\n+ facial paralysis and impaired gag reflex\nThe absence of cranial nerve palsies makes botulism highly unlikely, as does a lack of cranial\nnerve deficits at the onset of illness. Pupillary reflexes may be depressed and fixed or dilated\npupils are sometimes noted.\nThe cornerstones of treatment for botulism are meticulous intensive care and administration of\nbotulinum antitoxin.\nOption A: In poliomyelitis, weakness is generally asymmetric, more proximal than distal, and may\ninvolve the legs (most commonly), the arms, or the abdominal, thoracic, or bulbar muscles.\nOption C: Guillain-Barre syndrome is usually associated with ascending flaccid paralysis.\nOption D: Tetanus causes spastic paralysis.", "questionPages": [150], "solutionPages": [158, 159], "questionFigures": [], "solutionFigures": []}, {"id": "ch9-q12", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 12, "text": "Which of the following organisms is predominantly proteolytic in Robertson cooked meat\nmedium?", "options": [{"id": "A", "text": "Clostridium perfringens"}, {"id": "B", "text": "Clostridium botulinum A"}, {"id": "C", "text": "Clostridium difficile"}, {"id": "D", "text": "Clostridium septicum"}], "correctIndex": 1, "correctLetter": "B", "solution": "Clostridium botulinum A is predominantly proteolytic in Robertson cooked meat medium.\nIn Robertson cooked meat media, the saccharolytic species like C.perfringens, C.difficile, and\nC.septicum turn the meat pink, while the proteolytic species such as C.botulinum A turn the\nmeat black.\nExamples of predominantly proteolytic clostridia:\n+ C.bifermentans\n¢ C.botulinum A, B, F\n* C.histolyticum\nC. tetani is slightly proteolytic but not saccharolytic.\nExamples of predominantly saccharolytic clostridia:\n* C.perfringens\n* C.septicum\n* C.novyi\n* C.difficile\nC.botulinum C, D and E are saccharolytic but not proteolytic.", "questionPages": [150], "solutionPages": [159, 160], "questionFigures": [], "solutionFigures": []}, {"id": "ch9-q13", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 13, "text": "Which of the following organisms form the citron bodies?", "options": [{"id": "A", "text": "Clostridium septicum"}, {"id": "B", "text": "Clostridium histolyticum"}, {"id": "C", "text": "Clostridium tetani"}, {"id": "D", "text": "Clostridium perfringens"}], "correctIndex": 0, "correctLetter": "A", "solution": "Citron bodies are boat or leaf-shaped pleomorphic bacteria, usually associated with Clostridium\nsepticum.\nIt is a gram-positive, spore-forming, obligate anaerobic bacterium.\nGram stain morphology of Clostridium septicum from CSF (a) and blood culture (b) in 1000~\nmagnification with spore formation(arrow) is shown below.", "questionPages": [150, 151], "solutionPages": [160], "questionFigures": [], "solutionFigures": ["crop-solution-ch9-q13-1"]}, {"id": "ch9-q14", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 14, "text": "An elderly diabetic lady was brought to the hospital with complaints of diarrhoea and\nabdominal pain. She had recently been treated with intravenous clindamycin for cellulitis.\nShe was febrile at the time of examination and the blood reports revealed a Hb level of 12/d];\nWEC count of 18000/mm3; and C-reactive protein 160mg/l. What is the most sensitive test to\ndetect the causative organism?", "options": [{"id": "A", "text": "Glutamate dehydrogenase immunoassay"}, {"id": "B", "text": "PCR to detect toxin gene"}, {"id": "C", "text": "Toxigenic culture"}, {"id": "D", "text": "ELISA to detect toxin antigen"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given clinical vignette of a patient having diarrhea following antibiotic administration is\nsuggestive of pseudomembranous colitis due to Clostridium difficile. Toxigenic culture is the most\nsensitive method for the detection of Clostridium difficle infection.\nThe methods for diagnosis of Clostridium difficle infection are:\n* Toxigenic culture- Anaerobic incubation of the sample in cycloserine-cefoxitin-fructose agar\n(CCFA) or its variant for several days. This is followed by identification of the organism in the\ngrowth and tests to confirm toxin production. This method has a sensitivity of 100%.\n* Cell cytotoxicity neutralization assay (CCNA)- A stool filtrate is prepared and applied onto a\nmonolayer of an appropriate cell line. The cells are observed for toxin-induced cytopathic effect\n(CPE). This is followed by a neutralization assay to confirm that the CPE is attributable to\nC.difficile toxins. Sensitivity is around 75-85% when compared to toxigenic culture (reference\nstandard)\n* Nucleic acid amplification tests (e.g.PCR)- More sensitive (93.3%) for C.difficile detection than\ntoxin immunoassays but less sensitive than toxigenic culture.\n+ Toxin immunoassays- Enzyme immunoassays using monoclonal or polyclonal antibodies against\nC.difficile toxins. Sensitivity is lower than other tests.\n\n\n\n+ Glutamate dehydrogenase immunoassays- Detects glutamate dehydrogenase, a metabolic\nenzyme produced by all isolates of C.difficile (toxigenic and nontoxigenic). The test is highly\nsensitive but has low specificity.", "questionPages": [151], "solutionPages": [160, 161], "questionFigures": [], "solutionFigures": ["crop-solution-ch9-q14-1"]}, {"id": "ch9-q15", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 15, "text": "A veterinarian developed an ulcer with central black eschar over the forearm as shown in the\nimage. Which of the following is the most probable causative organism?", "options": [{"id": "A", "text": "Pseudomonas aeruginosa"}, {"id": "B", "text": "Yersinia pestis"}, {"id": "C", "text": "Bacillus anthracis"}, {"id": "D", "text": "Francisella tularensis"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given clinical scenario is suggestive of cutaneous anthrax which is caused by Bacillus\nanthracis.\nHuman anthrax presents in one of three ways:\n+ Cutaneous Anthrax(hide porter’s disease)- Black eschar at the base, with a very prominent\ninflammatory ring around the eschar, is referred to as a malignant pustule.\n+ Pulmonary Anthrax(Wool sorter’s disease)- Hemorrhagic pneumonia.\n+ Intestinal Anthrax- Hemorrhagic diarrhoea. It occurs mainly in primitive communities that eat\nthe carcasses of animals dying of anthrax.\nRobert Koch validated the germ theory of disease after discovering the anthrax bacillus as the\ncause of anthrax. He also discovered the causative agents of tuberculosis and cholera. Hence, he is\nknown as the Father of Bacteriology.\nKoch's postulates, which link specific microorganisms to specific diseases, state that the\nmicroorganism must be:\n+ Found in abundance in diseased organisms, but not in healthy organisms.\n+ Isolated from a diseased organism and grown in pure culture\n+ Able to cause disease when inoculated into a healthy organism\n+ Re-isolated from the diseased experimental host and identical to the original specific causative\nagent", "questionPages": [151, 152], "solutionPages": [161, 162], "questionFigures": ["crop-question-ch9-q15-1"], "solutionFigures": []}, {"id": "ch9-q16", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 16, "text": "Which of the following bacilli characteristically shows the M’Fadyean’s reaction?", "options": [{"id": "A", "text": "Bacillus cereus"}, {"id": "B", "text": "Clostridium"}, {"id": "C", "text": "Bacillus anthracis"}, {"id": "D", "text": "Corynebacterium diphthteriae"}], "correctIndex": 2, "correctLetter": "C", "solution": "M'Fadyean’s reaction is shown by Bacillus anthracis.\nWhen a blood film containing anthrax bacilli is stained with polychrome methylene blue for a few\nseconds and examined under the microscope, amorphous purplish material is noticed around the\nbacilli. This represents the capsular material and is called M'Fadyean’s reaction.\nThe following micrograph shows M'Fadyean's reaction:", "questionPages": [152], "solutionPages": [162], "questionFigures": [], "solutionFigures": ["crop-solution-ch9-q16-1"]}, {"id": "ch9-q17", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 17, "text": "A dairy farmer presented to the dermatology OPD with an ulcer with central black eschar\nover the forearm. Which of the following media can be used as a selective medium for the\ngrowth of the likely etiological agent?", "options": [{"id": "A", "text": "PLET medium"}, {"id": "B", "text": "Buffered charcoal yeast extract medium"}, {"id": "C", "text": "Cetrimide Agar"}, {"id": "D", "text": "MYPA agar"}], "correctIndex": 0, "correctLetter": "A", "solution": "Based on his profession and clinical description of the lesion, the diagnosis is most likely to\nbe cutaneous anthrax (most common form of anthrax) caused by Bacillus anthracis. The selective\nmedium for this organism is PLET (polymyxin-lysozyme-EDTA-thallous acetate) medium.\nOther options:\nOption B: Buffered charcoal yeast extract medium is used for Legionella.\nOption C: Cetrimide agar is a selective medium for Pseudomonas aeruginosa.\nOption D: Mannitol, Egg Yolk, Phenol red, Polymyxin Agar (MYPA) medium is a selective medium\nfor Bacillus cereus.", "questionPages": [152], "solutionPages": [162], "questionFigures": [], "solutionFigures": []}, {"id": "ch9-q18", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 18, "text": "A swab was taken from an ulcer and sent to the laboratory for culture. The following image\ndepicts a blood agar culture plate on which gamma phage suspension has been applied.\nWhich of the following is the most likely organism implicated?", "options": [{"id": "A", "text": "Erysipelothrix rhusiopathiae"}, {"id": "B", "text": "Clostridium butyricum"}, {"id": "C", "text": "Bacillus anthracis"}, {"id": "D", "text": "Bacillus cereus"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given image with a circular spot of diminished growth in the culture plate from a swab from\nan ulcer depicts the gamma phage lysis assay. The most likely organism implicated is Bacillus\nAnthracis.\n\n\n\nThis test is performed by inoculating Bacillus Anthracis in sheep blood agar followed by the\napplication of gamma phage suspension over one area of the culture plate. The gamma phage\nsuspension inhibits the growth of Bacillus anthracis colonies resulting in an an area of diminished\ngrowth called a plaque.", "questionPages": [152, 153], "solutionPages": [162, 163], "questionFigures": ["crop-question-ch9-q18-1"], "solutionFigures": []}, {"id": "ch9-q19", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 19, "text": "Which of the following tests is used for the diagnosis of anthrax?", "options": [{"id": "A", "text": "Paul- Bunnell test"}, {"id": "B", "text": "Kahn test"}, {"id": "C", "text": "Ascoli's thermoprecipitation test"}, {"id": "D", "text": "Rose-Waaler test"}], "correctIndex": 2, "correctLetter": "C", "solution": "Ascoli's thermoprecipitation test is used for the diagnosis of anthrax caused by Bacillus anthracis.\nIt is an example of a ring precipitation test.\nOption A: Paul-Bunnell test is used to diagnose infectious mononucleosis.\nOption B: Kahn test is used to diagnose syphilis.\nOption D: Rose-Waaler test is used to diagnose rheumatoid arthritis.", "questionPages": [153], "solutionPages": [163], "questionFigures": [], "solutionFigures": []}, {"id": "ch9-q20", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 20, "text": "A young patient presented to the medicine OPD with complaints of nausea and vomiting. He\ngave a history of having fried rice from a local Chinese restaurant a few hours ago. What is\nthe most likely causative organism?", "options": [{"id": "A", "text": "Clostridium perfringens"}, {"id": "B", "text": "Bacillus cereus"}, {"id": "C", "text": "Staphylococcus aureus"}, {"id": "D", "text": "Bacillus anthracis"}], "correctIndex": 1, "correctLetter": "B", "solution": "Based on the symptoms and a history of consuming fried rice 6 hours ago, we can diagnose this to\nbe a case of food poisoning due to Bacillus cereus.\nFood poisoning cause by B. cereus is of two types:", "questionPages": [153], "solutionPages": [163], "questionFigures": [], "solutionFigures": ["crop-solution-ch9-q20-1"]}, {"id": "ch9-q21", "chapterId": 9, "chapter": "Clostridium and Bacillus", "number": 21, "text": "Which of the following can grow in an acidic pH?", "options": [{"id": "A", "text": "Vibrio"}, {"id": "B", "text": "Lactobacilli"}, {"id": "C", "text": "Salmonella"}, {"id": "D", "text": "Shigella"}], "correctIndex": 1, "correctLetter": "B", "solution": "Among the given options, lactobacilli is the one that can grow in an acidic pH.\nIt is a gram-positive, facultatively anaerobic, non-motile, non—spore-forming bacterium.\nLactobacillus derives lactic acid from glucose, creating an acidic environment, and can grow in an\nacidic medium. It is found in the vagina as part of its normal microbiota.", "questionPages": [153, 154], "solutionPages": [163], "questionFigures": [], "solutionFigures": []}, {"id": "ch10-q1", "chapterId": 10, "chapter": "Mycobacteria Tuberculosis", "number": 1, "text": "The following slide is given as a spotter in your microbiology practical examination. Identify\nthe following organism.", "options": [{"id": "A", "text": "Mycobacteria"}, {"id": "B", "text": "Nocardia"}, {"id": "C", "text": "Actinomyces"}, {"id": "D", "text": "Corynebacterium"}], "correctIndex": 0, "correctLetter": "A", "solution": "The image shows pink non-branching acid-fast bacilli on a blue background. These findings are\nconsistent with the staining characteristics of mycobacteria. The stain used is the Ziehl-Neelsen\nstain.\nOther options:\nOption B: The image below shows Nocardia stained using an acid-fast staining technique.\nNocardia is partially acid-fast and appears as branching filaments.\nOption C: The image given below is of a gram-stained specimen of Actinomyces israelii. A. israelii\nis non acid-fast\nOption D: The images below show the staining characteristics of Corynebacterium diphtheriae. It\nis stained with Albert's stain which shows the needle appearance.", "questionPages": [164], "solutionPages": [169, 170], "questionFigures": ["crop-question-ch10-q1-1"], "solutionFigures": ["crop-solution-ch10-q1-1", "crop-solution-ch10-q1-2"]}, {"id": "ch10-q2", "chapterId": 10, "chapter": "Mycobacteria Tuberculosis", "number": 2, "text": "Which of the following is the component of mycobacteria which makes it acid fast?", "options": [{"id": "A", "text": "Mycolic acid"}, {"id": "B", "text": "Muramic acid"}, {"id": "C", "text": "Teichoic acid"}, {"id": "D", "text": "Talosaminuronic acid"}], "correctIndex": 0, "correctLetter": "A", "solution": "Mycobacteria are acid-fast due to the presence of mycolic acid in their cell walls.\nOn being stained with carbol fuchsin or fluorescent dyes such as auramine-O or rhodamine, they\nresist decolourization by 20% sulphuric acid and absolute alcohol for 10 minutes. This property is\nreferred to as acid and alcohol fastness and is routinely used to identify mycobacteria.", "questionPages": [164], "solutionPages": [170], "questionFigures": [], "solutionFigures": ["crop-solution-ch10-q2-1"]}, {"id": "ch10-q3", "chapterId": 10, "chapter": "Mycobacteria Tuberculosis", "number": 3, "text": "A patient presents early in the morning to the DOTS center to provide sputum samples.\nWhich of the following reagents are used in the digestion and decontamination of his samples\nbefore smear preparation?", "options": [{"id": "A", "text": "NaOH and KOH"}, {"id": "B", "text": "NaCl and N-acetyl cysteine"}, {"id": "C", "text": "N-acetyl cysteine and NaOH"}, {"id": "D", "text": "KOH and NaCl"}], "correctIndex": 2, "correctLetter": "C", "solution": "NaOH and N-acetylcysteine are used for the digestion and decontamination of sputum used in\nsmear preparation for Mycobacterium tuberculosis.\n\n\n\nSputum and specimens from non-sterile sites need prior treatment for digestion (to liquefy the\nthick pus), decontamination (to inhibit the normal flora), and concentration (to increase the yield)\nbefore they can be used for testing.\nMethods used for digestion and decontamination of sputum:\n+ Petroffs method- Uses 4% NaOH and HCl.\n+ N-acetyl cysteine (NALC) + 2% NaOH - NALC liquefies the sputum and NaOH kills the normal\nflora. This method is better suited for automated culture systems and is superior to Petroffs\nmethod.\nNote: Formalin or hypochlorite can be used only if smear micro

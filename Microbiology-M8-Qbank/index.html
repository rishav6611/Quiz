 macrophages\n* Bone: Osteoclasts\n* Connective tissue: Histiocytes", "questionPages": [55], "solutionPages": [63], "questionFigures": [], "solutionFigures": ["crop-solution-ch3-q3-1"]}, {"id": "ch3-q4", "chapterId": 3, "chapter": "Structure and Functions of the Immune System & Immune Response", "number": 4, "text": "Which of the following is the most potent stimulator of naive T-cells?", "options": [{"id": "A", "text": "Mature dendritic cells"}, {"id": "B", "text": "Follicular dendritic cells"}, {"id": "C", "text": "B lymphocytes"}, {"id": "D", "text": "NK cells"}], "correctIndex": 0, "correctLetter": "A", "solution": "Mature dendritic cells are the most potent stimulator of naive T cells.\nNaive CD4+ T cells are activated when they come in contact with two ligands - MHC class II and a\ncostimulary membrane protein (eg: CD28). Both of these are present in antigen-presenting cells,\nthe most potent of which is the mature dendritic cell. Other professional antigen-presenting cells\ninclude macrophages and B lymphocytes (option C).\nOther options:\n\n\n\nOption B: Follicular dendritic cells are functionally different from dendritic cells. They are not\nantigen-presenting-cells and do not activate naive T cells.\nOption D: NK cells do not stimulate naive T cells.", "questionPages": [55, 56], "solutionPages": [63, 64], "questionFigures": [], "solutionFigures": ["crop-solution-ch3-q4-1"]}, {"id": "ch3-q5", "chapterId": 3, "chapter": "Structure and Functions of the Immune System & Immune Response", "number": 5, "text": "Nude mice are not resistant to xenograft due to the absence of", "options": [{"id": "A", "text": "B cell"}, {"id": "B", "text": "T cell"}, {"id": "C", "text": "Both B and T cell"}, {"id": "D", "text": "NK cell"}], "correctIndex": 1, "correctLetter": "B", "solution": "Nude mice are not resistant to xenograft due to absence of T cell.\nA xenograft is a tissue graft or organ transplant from a donor of a different species.\nNude mice lack body hair, hence the name. They lack a thymus and thus cannot generate mature\nT lymphocytes. The absence of T-lymphocytes makes them unable to mount adaptive immune\nresponses requiring helper T cells and cytotoxic T cells. The absence of functioning T cells also\nprevents the rejection of allografts & xenografts.", "questionPages": [56], "solutionPages": [64], "questionFigures": [], "solutionFigures": []}, {"id": "ch3-q6", "chapterId": 3, "chapter": "Structure and Functions of the Immune System & Immune Response", "number": 6, "text": "Which of the following statements about T-cell receptors is false?", "options": [{"id": "A", "text": "In 95% of T cells, the TCR consists of ° and B polypeptide chains."}, {"id": "B", "text": "y5 TCR recognize peptide antigens presented by MHC molecules."}, {"id": "C", "text": "Each TCR is non-covalently linked to six polypeptide chains, which form CD3 complex."}, {"id": "D", "text": "The linked CD3 complex and € chains initiate activating signals."}], "correctIndex": 1, "correctLetter": "B", "solution": "6 TCR recognize different type of antigens without the requirement of major histocompatibility\ncomplex (MHC)\nEach T cell recognizes a specific bound antigen by means of an antigen-specific T-cell receptor\n(TCR). The TCR is a heterodimer and is of two types:\n* aB TCR (95%) recognize peptide antigens that are presented by MHC molecules on the surfaces\nof antigen-presenting cells.\n* ¥5 TCR (5%) recognize peptides, lipids, and small molecules, without a requirement for display\nby MHC proteins. They have particular localization patterns in the mucosal tissues, which protect\nagainst microbes that try to enter through epithelia.\n\n\n\nTCRs are non-covalently bound to six polypeptide chains or three dimers (a de pair, a ye pair, and\na CC or Cn pair), forming the CD3 complex and the ¢ dimer. The CD3 complex and ¢ dimer convey\nsignals received by the receptor to the interior of the cell.", "questionPages": [56], "solutionPages": [64, 65], "questionFigures": [], "solutionFigures": []}, {"id": "ch3-q7", "chapterId": 3, "chapter": "Structure and Functions of the Immune System & Immune Response", "number": 7, "text": "A 52-year-old requires a kidney transplant due to chronic kidney disease. Her 2 children\nmatch her HLA type 4/6 and 5/6 respectively. On what chromosome is this match protein\nsequence located?", "options": [{"id": "A", "text": "Chromosome 5"}, {"id": "B", "text": "Chromosome 6"}, {"id": "C", "text": "Chromosome 7"}, {"id": "D", "text": "Chromosome 8"}], "correctIndex": 1, "correctLetter": "B", "solution": "HLA complex of genes is located on the short arm of chromosome 6 (chromosome 6p21).\nThe human leukocyte antigen (HLA) system or complex is a gene complex encoding the major\nhistocompatibility complex (MHC) proteins. In humans, the MHC molecules are called human\nleukocyte antigens (HLA) because they were initially detected on leukocytes by the binding of\nantibodies. The combination of HLA alleles in each individual is called the HLA haplotype. The\nfunction of MHC molecules is to display peptide fragments of protein antigens for recognition\nby antigen-specific T cells.\nThe HLA system is highly polymorphic. Each individual’s HLA alleles differ from the other. It has\nto be checked before organ transplantation. The HLA complex consists of 3 separate clusters of\ngenes:\n* Class I- A, B and C loci\n* Class II- DR, DQ and DP loci\n* Class III- Complement C2 and C4 of classical pathway and properdin factor B of the alternate\npathway, heat shock proteins(HSP), TNF ° and B.", "questionPages": [56], "solutionPages": [65], "questionFigures": [], "solutionFigures": []}, {"id": "ch3-q8", "chapterId": 3, "chapter": "Structure and Functions of the Immune System & Immune Response", "number": 8, "text": "Which of the following statements is false regarding MHC molecules?", "options": [{"id": "A", "text": "MHC class II presents peptide antigen to CD4 T cells"}, {"id": "B", "text": "The action of MHC II occurs via endocytic pathway"}, {"id": "C", "text": "MHC Class II presents endogenous antigens"}, {"id": "D", "text": "MHC I is present on antigen presenting cells"}], "correctIndex": 2, "correctLetter": "C", "solution": "MHC class II presents exogenous antigens while MHC class I presents endogenous antigens.", "questionPages": [56, 57], "solutionPages": [65, 66], "questionFigures": [], "solutionFigures": ["crop-solution-ch3-q8-1"]}, {"id": "ch3-q9", "chapterId": 3, "chapter": "Structure and Functions of the Immune System & Immune Response", "number": 9, "text": "You are observing flow cytometry being performed at a laboratory for MHC class 1 antigen.\nIdentify the cells that lack this antigen.", "options": [{"id": "A", "text": "Platelets"}, {"id": "B", "text": "T lymphocytes"}, {"id": "C", "text": "B lymphocytes"}, {"id": "D", "text": "Red blood cells"}], "correctIndex": 3, "correctLetter": "D", "solution": "Red blood cells are anucleated cells that lack MHC class I antigens.\nMHC class I antigens are present on platelets and all nucleated cells, except sperm cells. They are\nresponsible for the presentation of peptide antigen to CD8 T cells.\nThe human major histocompatibility complex (MHC), or the HLA complex, is a cluster of genes\nwhose products are responsible for antigen presentation to T cells, transplant rejection, etc. HLA\ncomplex of genes is present on the short arm of chromosome 6. The genes are clustered in three\nregions named MHC region-I, II and III.\nMHC class II antigens are present only on antigen-presenting cells (macrophages, dendritic cells,\nB cells). They present the peptide antigen to CD4 T cells. APCs also contain MHC class I antigens.\nMHC region III comprises of genes that code for complement factors like C2, C4, C3 convertase,\nfactor B and properdin, heat shock protein, tumor necrosis factor and steroid 21-hydroxylases.", "questionPages": [57], "solutionPages": [66], "questionFigures": [], "solutionFigures": []}, {"id": "ch3-q10", "chapterId": 3, "chapter": "Structure and Functions of the Immune System & Immune Response", "number": 10, "text": "A patient newly diagnosed with HIV is found to have a CD4+ count of 78cells/yL. Which of\nthe following is not a function of these cells?", "options": [{"id": "A", "text": "Immunogenic memory"}, {"id": "B", "text": "Produce immunoglobulins"}, {"id": "C", "text": "Activate macrophages"}, {"id": "D", "text": "Activate cytotoxic cells"}], "correctIndex": 1, "correctLetter": "B", "solution": "CD4+ is a marker of T helper and memory cells. They do not produce immunoglobulins.\nCD4+ T cells are activated when an antigen-presenting cell expressing MHC-II binds to them. The\nactivated CD4+ T cell differentiates into T helper (TH) cells and regulatory T cells. The TH cells\nare further differentiated into TH1, TH2 and TH17 cells. Helper T cells have the following\nfunctions:\n+ Activation and proliferation of cytotoxic T cells\n* Regulation of monocyte-macrophage system\n+ Activation of B cell to produce plasma cells\n+ Production of interleukins\nMemory cells (Tm) have both CD4+ and CD8+ markers. They provide anamestic immune\nresponse and are thus responsible for immunogenic memory.\nImmunoglobulins are produced by the plasma cells.", "questionPages": [57], "solutionPages": [66], "questionFigures": [], "solutionFigures": []}, {"id": "ch3-q11", "chapterId": 3, "chapter": "Structure and Functions of the Immune System & Immune Response", "number": 11, "text": "Which of the following statements is false regarding the surface markers of T and B cells?", "options": [{"id": "A", "text": "T cells express CD 3"}, {"id": "B", "text": "T cells express CD 10"}, {"id": "C", "text": "B cells express CD 19"}, {"id": "D", "text": "B cells express CD 21"}], "correctIndex": 1, "correctLetter": "B", "solution": "T cells do not express CD10. CD10 is a marker of pre-B cell and germinal center B cells.\nGiven below is a list of cell surface markers and the cells they are expressed on:\n* CD3: All T cells\n* CD4: Helper T cells\n* CD8: Cytotoxic T cells\n* CD4, CD25: Regulatory T cells\n\n\n\n+ Ig, CD19, CD20, CD21: B Cells\n* CD10: Pre-B Cells, germinal center B cells\n* CD40, MHC-II: Macrophages\n* CD16, CD56: NK Cells\n* CD34: Hematopoietic stem cells\nNote : Pan T antigens are antigens found on all T cells and include CD2, CD3, CD5 and CD7.", "questionPages": [57], "solutionPages": [66, 67], "questionFigures": [], "solutionFigures": []}, {"id": "ch3-q12", "chapterId": 3, "chapter": "Structure and Functions of the Immune System & Immune Response", "number": 12, "text": "Which of the following markers is used for the identification of memory T cells?", "options": [{"id": "A", "text": "CD45RA"}, {"id": "B", "text": "CD45RB"}, {"id": "C", "text": "CD45RC"}, {"id": "D", "text": "CD45RO"}], "correctIndex": 3, "correctLetter": "D", "solution": "CD45RO is used as a marker for the identification of memory T cells.\nCD45RA is a marker for virgin or nailfive T helper cells.", "questionPages": [57, 58], "solutionPages": [67], "questionFigures": [], "solutionFigures": []}, {"id": "ch3-q13", "chapterId": 3, "chapter": "Structure and Functions of the Immune System & Immune Response", "number": 13, "text": "In a patient with influenza, there is decreased expression of MHC proteins on the surface of\nthe virus-infected cells. Which component of the immune system acts on such cells?", "options": [{"id": "A", "text": "Cytotoxic T cells"}, {"id": "B", "text": "Macrophages"}, {"id": "C", "text": "NK cells"}, {"id": "D", "text": "Helper T cells"}], "correctIndex": 2, "correctLetter": "C", "solution": "Natural killer cells (NK cells) act on virus-infected cells with reduced MHC expression.\nNK cells are a subtype of lymphocytes that kill damaged or infected cells. NK cells express CD16\nand CD56. Their action is inhibited when MHC I is expressed on normal cells. This prevents NK\nCells from killing normal cells. In the presence of a viral infection or malignancy, MHC expression\nof a cell is reduced. Thus, NK cells get activated and kill virus-infected/tumor cells. NK cells also\nsecrete cytokines (IFN-y) which activate macrophages (option B) for destruction of ingested\nmicrobes.\nOther options:\nOption A: Cytotoxic T cells act when cells expressing MHC I present endogenous antigens.\nOption D: Helper T cells act when cells expressing MHC II (antigen-presenting cells) present\nexogenous antigens.", "questionPages": [58], "solutionPages": [67], "questionFigures": [], "solutionFigures": []}, {"id": "ch3-q14", "chapterId": 3, "chapter": "Structure and Functions of the Immune System & Immune Response", "number": 14, "text": "A 9- year-old boy was brought with colicky pain, nausea, vomiting. Lab investigations\nrevealed eosinophilia and stool examination shows the following egg. Which interleukin is\nsecreted in this scenario?", "options": [{"id": "A", "text": "IL-1"}, {"id": "B", "text": "IL-3"}, {"id": "C", "text": "IL-6"}, {"id": "D", "text": "IL-5"}], "correctIndex": 3, "correctLetter": "D", "solution": "A child with colicky abdominal pain, nausea, vomiting with eosinophilia likely has a parasitic\ninfection with Ascaris lumbricoides (egg shown in the image). Parasitic infections trigger the\nrelease of IL-5.\nIn a parasitic infection, Th2 cells are stimulated and they produce IL-4 and IL-5. IL-4 stimulates\nthe differentiation of B-cells into IgE-secreting plasma cells, while IL-5 stimulates the maturation\nand release of eosinophils from the bone marrow. The secreted IgE coats the parasite. The\nactivated eosinophils bind to the IgE-coated parasite and kill them through the release of major\nbasic protein.", "questionPages": [58, 59], "solutionPages": [67, 68], "questionFigures": ["crop-question-ch3-q14-1"], "solutionFigures": []}, {"id": "ch3-q15", "chapterId": 3, "chapter": "Structure and Functions of the Immune System & Immune Response", "number": 15, "text": "Macrophages are the major source of .", "options": [{"id": "A", "text": "IL-1"}, {"id": "B", "text": "IL-5"}, {"id": "C", "text": "IL-7"}, {"id": "D", "text": "IFN-y"}], "correctIndex": 0, "correctLetter": "A", "solution": "Macrophages are the major source of IL-1.\nMacrophages are phagocytic cells that secrete the following molecules:\n+ Enzymes - Lysozyme, proteases, elastases, collagenases, plasminogen activator.\n+ Cytokines - Interleukins 1, 6, 8, 10, 12; TNF-° ; TGF-f; prostaglandins.\n+ Platelet-derived growth factor (PDGF), Platelet activated factor (PAF).\n* Colony-stimulating factor (CSF), Angiotensin-converting enzyme (ACE)\n* Complements - C2, C4.\n* Reactive O02 species (ROS)- H202, NO, OH.\nInterferon-gamma (IFN-y) is secreted by T-cells. It is one of the most potent macrophage\nactivators.", "questionPages": [59], "solutionPages": [68], "questionFigures": [], "solutionFigures": []}, {"id": "ch3-q16", "chapterId": 3, "chapter": "Structure and Functions of the Immune System & Immune Response", "number": 16, "text": "Which of the following mediators of inflammation is an example of a C-X-C chemokine?", "options": [{"id": "A", "text": "Lipoxin LXA- 4"}, {"id": "B", "text": "Interleukin IL- 8"}, {"id": "C", "text": "Lymphotactin-° XCL1"}, {"id": "D", "text": "Fractalkine CX3CL1"}], "correctIndex": 1, "correctLetter": "B", "solution": "Interleukin-8 is an example of a C-X-C chemokine.\nChemokines are chemotactic (chemoattractant) cytokines. They recruit leukocytes to sites of\ninflammation. The C-X-C or alpha chemokines have a total of four cysteines, of which the first\ntwo separated by one amino acid. represented by 'X'.", "questionPages": [59], "solutionPages": [68], "questionFigures": [], "solutionFigures": []}, {"id": "ch3-q17", "chapterId": 3, "chapter": "Structure and Functions of the Immune System & Immune Response", "number": 17, "text": "Which of the following is not an antigen-presenting cell?", "options": [{"id": "A", "text": "Helper T cells"}, {"id": "B", "text": "Macrophages"}, {"id": "C", "text": "Fibroblasts"}, {"id": "D", "text": "Dendritic cells"}], "correctIndex": 0, "correctLetter": "A", "solution": "T cell is not an antigen-presenting cell.\nAntigen presenting cells contain MHC class II molecules on their surface. They digest pathogens\nat the site of infection and display those exogenous antigens to T lymphopcytes, thus leading to T\nlymphocyte activation. Examples of antigen-presenting cells include dendritic cells,\nmacrophages, B cells, glial cells (brain), fibroblasts (skin), thymic epithelial cells and vascular\nendothelial cells.", "questionPages": [59], "solutionPages": [68], "questionFigures": [], "solutionFigures": []}, {"id": "ch3-q18", "chapterId": 3, "chapter": "Structure and Functions of the Immune System & Immune Response", "number": 18, "text": "A surgeon takes the following 2 images of a patient's arm 6 weeks apart. Which of the\nfollowing mediators promote the process shown below?", "options": [{"id": "A", "text": "TGF-B"}, {"id": "B", "text": "IFN-°"}, {"id": "C", "text": "TNF-°"}, {"id": "D", "text": "IFN-B"}], "correctIndex": 0, "correctLetter": "A", "solution": "The image shows wound healing. TGF-f (transforming growth factor-B) is responsible for wound\nhealing.\nTGF-B is produced by B and T cells and it inhibits their proliferation. It acts as a growth factor for\nfibroblasts and promotes wound healing. It stimulates the production of collagen, fibronectin and\nproteoglycans. It also promotes class switching of B cells to IgA. IL-10 is also involved in wound\nhealing and suppression of inflammation.\n\n\n\nOption B: IFN-° inhibits viral replication, activates NK cells, and regulates the activity of\nmacrophages and T cells.\nOption C: TNF-° is involved in tumour cytotoxicity, phagocytic cell activation, and antiviral and\nantiparasitic effects. It is an acute phase protein.\nOption D: IFN-f has antiviral activity.", "questionPages": [59, 60], "solutionPages": [68, 69], "questionFigures": ["crop-question-ch3-q18-1"], "solutionFigures": []}, {"id": "ch3-q19", "chapterId": 3, "chapter": "Structure and Functions of the Immune System & Immune Response", "number": 19, "text": "A patient's plasma has high levels of interferon beta. He most likely has an infection due to", "options": [{"id": "A", "text": "Virus"}, {"id": "B", "text": "Bacteria"}, {"id": "C", "text": "Fungi"}, {"id": "D", "text": "Mycoplasma"}], "correctIndex": 0, "correctLetter": "A", "solution": "Interferon-beta is secreted during infection due to viruses.\nInterferons are classified as cytokines. Interferons are non-toxic, non-antigenic and\nspecies-specific molecules. They are inactivated by proteases. They are stable at pH over 2-10,\nexcept INF-y (labile at pH 2) and are non-dialysable and non-sedimentable.\nThere are three types of interferons - ° , B and y. IFN-° or leukocyte interferon is produced by\nleucocytes. It has antiviral activity, is immunoregulaotry and antiproliferative. IFN-B or fibroblast\ninterferon is produced by fibroblasts and epithelial cells. It has antiviral activity and is thus\nincreased in viral infections. It enhances MHC class 1 and NK cell activity. IFN-y or immune\ninterferon is produced by T-lymphocytes, NK cells . It activates macrophages, increases neutrophil\nfunction, enhances both MHC class 1 and class II expression and has anti-proliferative\n(anti-tumour) functions.", "questionPages": [60], "solutionPages": [69], "questionFigures": [], "solutionFigures": []}, {"id": "ch3-q20", "chapterId": 3, "chapter": "Structure and Functions of the Immune System & Immune Response", "number": 20, "text": "A newborn diagnosed with a hepatoblastoma is planned for liver transplantation. Her father\nis found to be an HLA match, and he donates part of his liver. What type of transplantation is\ndescribed here?", "options": [{"id": "A", "text": "Autograft"}, {"id": "B", "text": "Allograft"}, {"id": "C", "text": "Xenograft"}, {"id": "D", "text": "Isograft"}], "correctIndex": 1, "correctLetter": "B", "solution": "The transplant of an organ/tissue from a father to child is an example of an allograft.", "questionPages": [60, 61], "solutionPages": [69], "questionFigures": [], "solutionFigures": []}, {"id": "ch4-q1", "chapterId": 4, "chapter": "Hypersensitivity", "number": 1, "text": "What route of administration of the shocking dose of an antigen is most effective in causing\nan anaphylactic reaction?", "options": [{"id": "A", "text": "Intradermal"}, {"id": "B", "text": "Intravenous"}, {"id": "C", "text": "Subcutaneous"}, {"id": "D", "text": "Oral"}], "correctIndex": 1, "correctLetter": "B", "solution": "The intravenous route of administration is the most effective route of administration for shocking\ndose in causing anaphylaxis.\nAnaphylaxis is a type I hypersensitivity syndrome. There are 2 clinical syndromes which are\ncharacterised as:\n+ Anaphylaxis - acute, potentially fatal systemic form\n+ Atopy - chronic, recurrent, non-fatal, localized form\nPriming dose: For induction of hypersensitivity reactions, the host should have contact with the\nantigen, leading to priming of the appropriate B or T lymphocytes.\nShocking dose: Subsequent contact with allergen causing manifestations of hypersensitivity.\n\n\n\nEffectiveness: intravenous > intraperitoneally~subcutaneously > intradermally (least)", "questionPages": [70], "solutionPages": [76], "questionFigures": [], "solutionFigures": ["crop-solution-ch4-q1-1"]}, {"id": "ch4-q2", "chapterId": 4, "chapter": "Hypersensitivity", "number": 2, "text": "Which type of reaction is the Schultz-Dale phenomenon?", "options": [{"id": "A", "text": "Type II hypersensitivity reaction"}, {"id": "B", "text": "Type I hypersensitivity reaction"}, {"id": "C", "text": "Type III hypersensitivity reaction"}, {"id": "D", "text": "Type IV hypersensitivity reaction"}], "correctIndex": 1, "correctLetter": "B", "solution": "The Schultz—Dale phenomenon is a type I hypersensitivity reaction.\nIt describes in-vitro contraction of smooth muscles that have been exposed to antigens,\ndemonstrating immediate hypersensitivity reaction in some human and animal tissues.\nOther type I hypersensitivity reactions are the Prausnitz-Kustner reaction and the Theobald Smith\nphenomenon.", "questionPages": [70], "solutionPages": [76], "questionFigures": [], "solutionFigures": []}, {"id": "ch4-q3", "chapterId": 4, "chapter": "Hypersensitivity", "number": 3, "text": "The presence of which of the following antibodies is demonstrated by the Prausnitz-Kustner\nreaction?", "options": [{"id": "A", "text": "IgM"}, {"id": "B", "text": "IgG"}, {"id": "C", "text": "IgE"}, {"id": "D", "text": "IgA"}], "correctIndex": 2, "correctLetter": "C", "solution": "The presence and activity of IgE antibodies are demonstrated by the Prausnitz—Kistner (P-K)\nreaction.\nIn this method, the serum is injected from an allergic person into the skin of a nonallergic\nindividual. Then a suspected antigen is later injected into the same site. A positive P-K reaction is\na wheal and flare reaction seen in the non-allergic individual. This indicates that the suspected\nantigen is causing hypersensitivity. Because of the danger of transmitting viral hepatitis and\nAIDS, this test is no longer used.", "questionPages": [70], "solutionPages": [76], "questionFigures": [], "solutionFigures": []}, {"id": "ch4-q4", "chapterId": 4, "chapter": "Hypersensitivity", "number": 4, "text": "A child, upon ingestion of shellfish, developed a tingling sensation in the mouth, swelling of\nthe face, lips, and tongue, and also complained of abdominal pain and dizziness. What type of\nreaction is this?", "options": [{"id": "A", "text": "IgE mediated reaction"}, {"id": "B", "text": "T cell mediated cytotoxic reaction"}, {"id": "C", "text": "IgG mediated reaction"}, {"id": "D", "text": "IgA mediated hypersensitivity reaction"}], "correctIndex": 0, "correctLetter": "A", "solution": "This child who developed tingling in the mouth, and swelling of the lips and face after eating shelf\nlife is an example of an IgE mediated type of hypersensitivity reaction.\n\n\n\nAnaphylaxis is a severe, potentially life-threatening allergic reaction that occurs rapidly and\naffects the whole body. It is characterized by a sudden release of histamines and other chemicals\nfrom the immune system in response to an allergen, such as certain foods, medications, insect\nstings, or latex. The onset of symptoms can occur within minutes to a few hours after exposure to\nthe allergen.The primary mediators are histamine and serotonin. The secondary mediators are\nprostaglandins and leukotrienes.\nClinically, anaphylaxis can present with a combination of symptoms that typically include:\n+ Respiratory Symptoms: Patients often experience wheezing and respiratory distress due to\nbronchoconstriction. Other signs may include shortness of breath, coughing, and a feeling of\ntightness in the chest.\n+ Skin Symptoms: Urticaria (hives) and angioedema (swelling of the skin and mucous membranes)\nare common. These skin reactions usually develop rapidly, often within minutes to two hours of\nexposure to the allergen.\n* Cardiovascular Symptoms: Hypotension (low blood pressure) is a key indicator of anaphylaxis.\nPatients may also experience tachycardia (increased heart rate) and, in severe cases, shock.\n* Gastrointestinal Symptoms: Abdominal pain, vomiting, diarrhea, and cramps can occur,\nparticularly if the anaphylaxis is triggered by food allergens.\n* Neurological Symptoms: Dizziness, lightheadedness, or loss of consciousness can occur due to\nthe sudden drop in blood pressure and reduced oxygen supply to the brain.", "questionPages": [70, 71], "solutionPages": [76, 77], "questionFigures": [], "solutionFigures": ["crop-solution-ch4-q4-1"]}, {"id": "ch4-q5", "chapterId": 4, "chapter": "Hypersensitivity", "number": 5, "text": "Two days after penicillin administration, a patient developed antibodies that resulted in\nhemolysis. Which type of hypersensitivity reaction is this?", "options": [{"id": "A", "text": "Type I"}, {"id": "B", "text": "Type II"}, {"id": "C", "text": "Type III"}, {"id": "D", "text": "Type IV"}], "correctIndex": 1, "correctLetter": "B", "solution": "Development of antibodies resulting in hemolysis after penicillin administration is an example of\na type II reaction. This is a drug-induced type II hypersensitivity reaction.\nPenicillin in high doses can result in immune-mediated hemolysis via the hapten mechanism. In\nthis, the drug attaches to surface of RBC membrane. Antibodies are produced that are targeted\nagainst this combination of penicillin and RBCs.\n\n\n\nComplement is activated by the attached antibody leading to the removal of red blood cells by the\nspleen.", "questionPages": [71], "solutionPages": [77, 78], "questionFigures": [], "solutionFigures": ["crop-solution-ch4-q5-1"]}, {"id": "ch4-q6", "chapterId": 4, "chapter": "Hypersensitivity", "number": 6, "text": "A skin transplant was done from a sister to her brother. After a few years, a brother-to-sister\nskin transplant was done, but rejection occurred. What is this phenomenon known as?", "options": [{"id": "A", "text": "Schwartzman reaction"}, {"id": "B", "text": "Theobald Smith phenomena"}, {"id": "C", "text": "Eichwald Silmser effect"}, {"id": "D", "text": "Schultz Dale phenomena"}], "correctIndex": 2, "correctLetter": "C", "solution": "The above scenario describes an Eichwald-Silmser effect, which is a unilateral sex-linked\nhisto-incompatibility.\nWhile transplants between same-sex siblings are successful, grafts from female to male are also\nsuccessful, but an exception is seen when the donor is a male and the recipient is a female. Such\ngrafts are rejected as the grafted male tissue (XY) will have antigens determined by the Y\nchromosome which will be absent in the female (XX) recipient.", "questionPages": [71], "solutionPages": [78], "questionFigures": [], "solutionFigures": []}, {"id": "ch4-q7", "chapterId": 4, "chapter": "Hypersensitivity", "number": 7, "text": "A 9-year-old girl is brought with complaints of sensitivity to light and profuse lacrimation. On\ninspection, the given finding is seen on her upper tarsal conjunctiva. What type of\nhypersensitivity reaction is this?", "options": [{"id": "A", "text": "Type I"}, {"id": "B", "text": "Type II"}, {"id": "C", "text": "Type II and III"}, {"id": "D", "text": "Type IV"}], "correctIndex": 0, "correctLetter": "A", "solution": "Spring catarrh or vernal keratoconjunctivitis is a type I hypersensitivity reaction.\nIt is a bilateral, seasonally recurrent, chronic conjunctivitis due to type I hypersensitivity allergic\nreaction to an external antigen. The antigen reacts with IgE, this stimulates mast cell\ndegranulation leading to the release of histamine and other mediators of the allergic response.\nSpring catarrh is one of the several forms of allergic conjunctivitis.", "questionPages": [71, 72], "solutionPages": [78], "questionFigures": ["crop-question-ch4-q7-1"], "solutionFigures": []}, {"id": "ch4-q8", "chapterId": 4, "chapter": "Hypersensitivity", "number": 8, "text": "Which type of hypersensitivity reaction is involved in the hyperacute rejection of renal\ntransplants?", "options": [{"id": "A", "text": "Type IV"}, {"id": "B", "text": "Type II"}, {"id": "C", "text": "Type II"}, {"id": "D", "text": "Type I"}], "correctIndex": 2, "correctLetter": "C", "solution": "Hyperacute graft rejection is an example of type II hypersensitivity reaction.\nIt is mediated by preformed antibodies. It is a rare event that occurs in kidney transplantation.", "questionPages": [72], "solutionPages": [78, 79], "questionFigures": [], "solutionFigures": ["crop-solution-ch4-q8-1"]}, {"id": "ch4-q9", "chapterId": 4, "chapter": "Hypersensitivity", "number": 9, "text": "Which of the following statements is not true about anaphylaxis?", "options": [{"id": "A", "text": "It is a type I hypersensitivity reaction"}, {"id": "B", "text": "Large amount of histamine released"}, {"id": "C", "text": "Primary mediators like IL 4, IL 5 and GM-CSF are released"}, {"id": "D", "text": "Mediated through allergen specific IgE"}], "correctIndex": 2, "correctLetter": "C", "solution": "IL4, IL5, GM-CSF are secondary mediators and not primary mediators.\nAnaphylaxis is a type I reaction and is mediated through IgE.\nPrimary mediators are preformed contents of mast cells and basophil granules such as histamine,\nserotonin. They cause vasodilation and bronchoconstriction. Secondary mediators are newly\nformed upon stimulation by mast cells, basophils, and other leucocytes (such as leukotrienes IL3,\nIL4, IL5, IL6; GM-CSF, and prostaglandins) which lead to inflammatory cell infiltrates.", "questionPages": [72, 73], "solutionPages": [79], "questionFigures": [], "solutionFigures": ["crop-solution-ch4-q9-1"]}, {"id": "ch4-q10", "chapterId": 4, "chapter": "Hypersensitivity", "number": 10, "text": "While studying the patient data on hypersensitivity reactions over the last 2 months, you are\ntasked with classifying the cases by type. Who among the following patients falls under type\nII hypersensitivity?", "options": [{"id": "A", "text": "A patient with berylliosis"}, {"id": "B", "text": "Eczematous reaction on the hand of an HCW wearing powdered gloves"}, {"id": "C", "text": "A patient with heat intolerance, sinus tachycardia, and proptosis"}, {"id": "D", "text": "Glomerulonephritis in a patient with systemic lupus erythematosus"}], "correctIndex": 2, "correctLetter": "C", "solution": "Heat intolerance, sinus tachycardia, and proptosis of the eye suggest a diagnosis of Grave's\ndisease. It is a type II hypersensitivity reaction that results in the binding of\nanti-thyroid-stimulating hormone (anti-TSH) antibodies to TSH receptors and stimulates the\nthyroid cells to produce thyroid hormones.\nType II hypersensitivity reactions involve combining the of IgG antibodies with the antigenic\ndeterminants on the surface of cells leading to cytotoxic effects.\n\n\n\nOther options:\nOption A: Berylliosis is a type IV hypersensitivity reaction.\nOption B: Eczematous reaction on the hand of an HCW wearing powdered gloves (contact\ndermatitis) is a type IV hypersensitivity reaction.\nOption D: Glomerulonephritis in a patient with SLE (systemic lupus erythematosus) is a type III\nhypersensitivity reaction.", "questionPages": [73], "solutionPages": [79, 80], "questionFigures": [], "solutionFigures": ["crop-solution-ch4-q10-1"]}, {"id": "ch4-q11", "chapterId": 4, "chapter": "Hypersensitivity", "number": 11, "text": "A 22-year-old hiker presents with an itchy rash on her wrist. She gives a history of getting\nbrushed with poison ivy on a trek the previous day. What cells are involved in this reaction?", "options": [{"id": "A", "text": "T cells"}, {"id": "B", "text": "B cells"}, {"id": "C", "text": "Macrophages"}, {"id": "D", "text": "Langerhans cells"}], "correctIndex": 0, "correctLetter": "A", "solution": "The history and image suggest a diagnosis of contact dermatitis, a type IV hypersensitivity\nreaction mediated by T cells. These are delayed hypersensitivity reactions and are induced by\nsensitized T cells, which on contact with the specific antigen releases cytokines that produce\nbiological effects on leucocytes, macrophages, and tissue cells.\nTwo types of delayed hypersensitivity are:\n* Tuberculin type\n* Contact dermatitis type", "questionPages": [73], "solutionPages": [80], "questionFigures": ["crop-question-ch4-q11-1"], "solutionFigures": []}, {"id": "ch4-q12", "chapterId": 4, "chapter": "Hypersensitivity", "number": 12, "text": "A 45-year-old hypertensive man complains of fever, migraine, loss of appetite, and myalgia.\nOn examination, splinter hemorrhages and palpable purpura are noted. On CT angiography,\n\n\n\naneurysm and stenosis of medium-sized vessels are observed. What is the type of\nhypersensitivity reaction associated with this disease?", "options": [{"id": "A", "text": "Type I hypersensitivity"}, {"id": "B", "text": "Type II hypersensitivity"}, {"id": "C", "text": "Type III hypersensitivity"}, {"id": "D", "text": "Type IV hypersensitivity"}], "correctIndex": 2, "correctLetter": "C", "solution": "The most likely diagnosis is polyarteritis nodosa. It is an example of a type III hypersensitivity\nreaction.\nIn type III hypersensitivity, immune complexes may deposit in tissues or blood vessels, and elicit\nan acute inflammatory reaction by activating the complement system. The inflammatory reaction\ncauses tissue injury.\n\n\n\nThe pathogenesis of systemic immune complex disease can be divided into three phases:\n* Formation of immune complexes\n* Deposition of immune complexes\n* Inflammation and tissue injury.\nExamples of type III hypersensitivity reactions:\n+ Post-streptococcal glomerulonephritis\n+ SLE\n+ Polyarteritis nodosa\n+ Reactive arthritis\n+ Serum sickness\n+ Arthus reaction\n* Farmer’s lung\n+ Hypersensitivity pneumonitis\n* Type II lepra reaction\n* Henoch Schonlein purpura", "questionPages": [73, 74], "solutionPages": [80, 81], "questionFigures": [], "solutionFigures": ["crop-solution-ch4-q12-1"]}, {"id": "ch4-q13", "chapterId": 4, "chapter": "Hypersensitivity", "number": 13, "text": "Which type of hypersensitivity reaction is implicated in the autoimmune disease shown\nbelow?", "options": [{"id": "A", "text": "Type I"}, {"id": "B", "text": "Type II"}, {"id": "C", "text": "Type III"}, {"id": "D", "text": "Type IV"}], "correctIndex": 1, "correctLetter": "B", "solution": "The disease shown in the image is myasthenia gravis. It is an example of type II hypersensitivity.\nType II hypersensitivity reactions are mediated by antibodies directed towards self-antigens- cell\nsurface or extracellular matrix.", "questionPages": [74], "solutionPages": [81, 82], "questionFigures": ["crop-question-ch4-q13-1"], "solutionFigures": ["crop-solution-ch4-q13-1"]}, {"id": "ch4-q14", "chapterId": 4, "chapter": "Hypersensitivity", "number": 14, "text": "A 24-year-old patient comes with recurrent episodes of sneezing, rhinorrhea, and watering of\nthe eyes. She says she has these symptoms throughout the year. Which of the following\nimmunoglobulins will be elevated in her case?", "options": [{"id": "A", "text": "IgA"}, {"id": "B", "text": "IgM"}, {"id": "C", "text": "IgE"}, {"id": "D", "text": "IgG"}], "correctIndex": 2, "correctLetter": "C", "solution": "The clinical vignette describes a case of chronic allergic rhinits. IgE is elevated in these cases.\nPerennial allergic rhinitis, a type of chronic rhinitis is a year-round problem and is often caused\nby indoor allergens such as dust and animal dander in addition to pollens that may exist at the\ntime. Symptoms tend to occur regardless of the time of the year.", "questionPages": [74, 75], "solutionPages": [82], "questionFigures": [], "solutionFigures": []}, {"id": "ch5-q1", "chapterId": 5, "chapter": "Immune Disorders", "number": 1, "text": "A 6-month-old child has a history of recurrent skin and respiratory tract infections.\nInvestigations are carried out and a disorder of phagocytosis is suspected. Which of the\nfollowing will not be a differential diagnosis in this case?", "options": [{"id": "A", "text": "DiGeorge syndrome"}, {"id": "B", "text": "Leukocyte adhesion deficiency"}, {"id": "C", "text": "Chediak-Higashi syndrome"}, {"id": "D", "text": "Chronic granulomatous disease"}], "correctIndex": 0, "correctLetter": "A", "solution": "DiGeorge syndrome is not a disorder of phagocytosis.\nIt is due to a developmental defect involving the endodermal derivatives of the 3rd and 4th\npharyngeal pouches. Cell-mediated immunity is defective due to decreased T-cells. Affected\nindividuals also have depressed graft rejection, hypocalcemia, and cardiac defects.\n\n\n\nDisorders of phagocytosis:\n+ Leukocyte adhesion deficiency\n* Chediak—Higashi syndrome\n* Chronic granulomatous disease\n* Tuftsin deficiency\n* Cyclic neutropenia\nOther options:\nOption B: Leukocyte adhesion deficiency leads to defective neutrophil migration to sites of\ninfection, peripheral neutrophilia, and recurrent infections without pus.\nOption C: Chediak—Higashi syndrome is an autosomal-recessive disorder due to defects in\nlysosomal transport protein (LYST), leading to defective microtubule polymerization and defective\nphagolysosome formation. There is neutropenia and recurrent infections.\nOption D: Chronic granulomatous disease is due to a defect in NADPH oxidase resulting in the\nabsence of respiratory burst. It presents with recurrent infections with catalase-positive microbes.", "questionPages": [83], "solutionPages": [88], "questionFigures": [], "solutionFigures": []}, {"id": "ch5-q2", "chapterId": 5, "chapter": "Immune Disorders", "number": 2, "text": "A 1-year-old boy presents with meningococcal meningitis. He has a history of recurrent\nbacterial chest and ear infections. Family history reveals that he has a male cousin (maternal\nside) who died in infancy from infection. The physician suspects X-linked\nagammaglobulinemia. Which of the following is false regarding his condition?", "options": [{"id": "A", "text": "It is caused by a mutation of the BTK gene"}, {"id": "B", "text": "Both humoral and cell mediated immunity are affected"}, {"id": "C", "text": "All classes of immunoglobulin levels are reduced"}, {"id": "D", "text": "Lymph node biopsy shows depletion of follicles"}], "correctIndex": 1, "correctLetter": "B", "solution": "X-linked or Bruton's agammaglobulinemia is primarily a disease of humoral immunity.\nCell-mediated immunity is not affected.\nIt is an inherited immunodeficiency disease caused by mutations in the gene coding for Bruton\ntyrosine kinase (BTK). B cells do not differentiate and mature. They are arrested in the pre-B cell\nstage.\nThere are extremely low IgG levels (below 100 mg/dL) and an absence of other immunoglobulin\nclasses. The tonsils and lymph nodes are usually atrophic. Lymph node biopsy reveals depletion of\ncells of B cell-dependent areas (follicles). Babies born with this disorder have virtually no\nperipheral B cells (<1%) and suffer from recurrent bacterial infections.", "questionPages": [83], "solutionPages": [88], "questionFigures": [], "solutionFigures": []}, {"id": "ch5-q3", "chapterId": 5, "chapter": "Immune Disorders", "number": 3, "text": "An immunologist orders a nitroblue tetrazolium test on a child suspected to have a primary\nimmunodeficiency disease. What condition is she screening the child for?", "options": [{"id": "A", "text": "Tuftsin deficiency"}, {"id": "B", "text": "Wiskott-Aldrich syndrome"}, {"id": "C", "text": "Chronic granulomatous disease"}, {"id": "D", "text": "Chediak-Higashi syndrome"}], "correctIndex": 2, "correctLetter": "C", "solution": "The Nitroblue Tetrazolium Test (NBT) is used as a screening test for chronic granulomatous\ndisease (CGD) by assessing the reactive oxygen species (ROS) production in phagocytes.\nThis principle relies on the color change of nitroblue tetrazolium, which transforms from\ncolorless/yellow to deep blue when it encounters ROS. A higher nitroblue test score indicates that\nthe cell is more efficient in producing ROS.\nIn chronic granulomatous disease, there is an NADPH oxidase defect. Hence, the phagocyte\ncannot produce reactive oxygen species or radicals required for bacterial killing, which results in\nrecurrent infections. Here, the leukocytes fail to reduce nitroblue tetrazolium during phagocytosis.\nHence, a negative test (NBT remains colourless to yellow) is seen in CGD.\nA positive test result means neutrophils turn blue, as shown below:\n\n\n\nA negative test means nitroblue tetrazolium remains colourless/yellow, as shown below:", "questionPages": [83], "solutionPages": [88, 89], "questionFigures": [], "solutionFigures": ["crop-solution-ch5-q3-1"]}, {"id": "ch5-q4", "chapterId": 5, "chapter": "Immune Disorders", "number": 4, "text": "A 1-year-old boy is brought with a history of recurrent pneumonia. He also has eczema and a\nhistory of prolonged bleeding after circumcision. Peripheral smear shows thrombocytopenia\nwith small platelets. Which of the following is most likely to be deficient?", "options": [{"id": "A", "text": "IgM"}, {"id": "B", "text": "IgG"}, {"id": "C", "text": "IgA"}, {"id": "D", "text": "IgE"}], "correctIndex": 0, "correctLetter": "A", "solution": "The history here is highly suggestive of Wiskott-Aldrich syndrome (WAS), a condition\ncharacterized by decreased IgM levels.\nWiskott-Aldrich syndrome (WAS) is an X-linked recessive immunodeficiency disorder. It is caused\nby mutations in the Wiskott-Aldrich syndrome protein (WASp) that primarily affects the T\nlymphocytes. Normally, WASp regulates the actin cytoskeleton and thus helps in cell adhesion,\nmigration, and the formation of synapses between antigen-presenting and target cells. In WAS,\nthere is a progressive loss of T lymphocytes in the peripheral blood resulting in defects in cellular\nimmunity.\n\n\n\nThe clinical features of WAS are a triad of recurrent bacterial infections, eczema, and bleeding due\nto thrombocytopenia (with small platelets). Diagnosis is based on intracellular\nimmunofluorescence analysis of WAS protein (WASp) expression in blood cells. IgM levels in the\nserum are low, but levels of IgG are usually normal. IgA and IgE levels are normal or elevated.\nReduced-sized platelet is a typical feature of WAS.\nThe image below shows an 18-month-old child with WAS, showing multiple petechiae and\nhematoma.", "questionPages": [83, 84], "solutionPages": [89, 90], "questionFigures": [], "solutionFigures": ["crop-solution-ch5-q4-1"]}, {"id": "ch5-q5", "chapterId": 5, "chapter": "Immune Disorders", "number": 5, "text": "An 8-year-old boy was brought to the pediatric OPD with multiple cold abscess lesions as\nshown below on his face, chest, and back. The child has a history of recurrentlll respiratory\ninfections. On examination, he has atopic excoriations over the skin folds. What is the most\nprobable diagnosis?", "options": [{"id": "A", "text": "Hyper IgM syndrome"}, {"id": "B", "text": "Wiscott Aldrich syndrome"}, {"id": "C", "text": "Hyper IgE syndrome"}, {"id": "D", "text": "X-linked agammaglobulinemia"}], "correctIndex": 2, "correctLetter": "C", "solution": "A child with multiple abscesses (as shown in the image above) with a history of atopy and\nrecurrent respiratory infections suggests immunodeficiency, and the most probable diagnosis is\nHyper IgE syndrome.\nThe hyper-IgE syndromes are rare primary immunodeficiency syndromes characterized by\nrecurrent severe staphylococcal abscesses of the skin, lungs, and other sites, eczema, eosinophilia,\nand marked elevation of serum IgE levels. They occur in 2 forms:\n+ Autosomal dominant - involves mutations in the gene encoding STAT-3 (also known as Job\nsyndrome)\n+ Autosomal recessive - involves mutations in DOCK8.\nIn Job syndrome, mutation of the STAT3 gene leads to IgE overproduction without modulation.\nLoss of modulation is due to the absence of anti-inflammatory cytokines IL-6, IL-10, and\nIFN-gamma. Lack of IL-6 leads to deficiency of CD4 + Th17 cells, making them susceptible to\nvarious infections.\nIt usually presents as a triad of atopic dermatitis, recurrent skin staphylococcal infections, and\nrecurrent pulmonary infections that occur early in childhood. The eczematoid rash affects the\nscalp and face, gets superinfected with Staphylococcus aureus and forms cold abscesses. Candida\ninfections are common. Recurrent staphylococcal pneumonia with pneumatocoeles is also\n\n\n\ncommonly seen. Other non-immunological features are:\n\n+ Dysmorphic facial features that appear in early adolescence and are absent in the autosomal\n\nrecessive form\n\n* Craniosynostosis\n\n¢ Arnold-Chiari type 1\n\n+ Hyperextensible joints\n\n+ Scoliosis\n\n+ Pathological fractures\n\n+ Retention of primary teeth\n\n* Vascular complications\n\n* Ocular complications\n\nDiagnosis is based on measurements of serum IgE levels >2000U/mL where IgA, IgG and IgM\n\nconcentrations are generally normal, in adjunct with the clinical features seen in Job syndrome. It\n\nis associated with peripheral blood eosinophilia.\n\nThe treatment primarily focuses on preventing infections through the use of antimicrobials,\n\nincluding antibiotics and antifungals, along with immunoglobulin replacement therapy.", "questionPages": [84], "solutionPages": [90, 91], "questionFigures": ["crop-question-ch5-q5-1"], "solutionFigures": []}, {"id": "ch5-q6", "chapterId": 5, "chapter": "Immune Disorders", "number": 6, "text": "Which of the following is a combined immunodeficiency disorder associated with both B-cell\nand T-cell defects?", "options": [{"id": "A", "text": "Louis—Bar syndrome"}, {"id": "B", "text": "DiGeorge syndrome"}, {"id": "C", "text": "Chediak-Higashi syndrome"}, {"id": "D", "text": "Tuftsin deficiency"}], "correctIndex": 0, "correctLetter": "A", "solution": "Louis—Bar syndrome or ataxia-telangiectasia is a combined immunodeficiency disorder.\n\nAtaxia-telangiectasia is a syndrome complex that comprises neurologic, immunologic,\n\nendocrinologic, and cutaneous disorders. The gene involved in this condition is the mutation in\n\nthe ATM gene mapped to the long arm of chromosome 11(11q22-23). The mode of inheritance is\n\nautosomal recessive. There is defective DNA repair and increased sensitivity to ionizing radiation.\n\nClinical features:\n\n+ Progressive cerebellar ataxia\n\n* Oculocutaneous telangiectasias\n\n* Chronic sinopulmonary disease\n\n+ High incidence of malignancy - adenocarcinomas and lymphoreticular tumors (lymphoma,\n\nleukemia, and Hodgkin's disease)\n\n* Humoral and cellular immunodeficiency\n\n* Ovarian dysgenesis and chromosomal abnormalities\n\n* Hypoplastic thymus\n\n+ Ataxia and chorioathetoid movements start in infancy.\n\nThe onset of telangiectasia is around 3 to 6 years and involves the face, conjunctiva and other\n\nparts of the body. By 12 years of age, affected children are usually confined to wheelchairs due to\n\nprogressive ataxia.\n\n\n\nDeath occurs due to sinopulmonary infection in early life or due to malignancy in the second or\nthird decade. They lack IgA and IgE. Cell-mediated immunity is also defective.\nThe image below shows ocular telangiectasia in a patient with A-T.\nOther options:\nOption B: DiGeorge syndrome is a cellular immunodeficiency disorder associated with T-cell\ndeficiency.\nOptions C and D: Chediak-Higashi syndrome and tuftsin deficiency are disorders of phagocytosis.", "questionPages": [84, 85], "solutionPages": [91, 92], "questionFigures": [], "solutionFigures": ["crop-solution-ch5-q6-1"]}, {"id": "ch5-q7", "chapterId": 5, "chapter": "Immune Disorders", "number": 7, "text": "A 2-year-old boy presents with reports showing fungal pneumonia, the causative organism is\nshown below. Parents give a history of recurrent bacterial infections. Laboratory analysis\nshow markedly elevated IgM and low levels of IgG. Which of the following is the most likely\ncause of his illness?", "options": [{"id": "A", "text": "Defective cytokine signaling in T-cell precursors"}, {"id": "B", "text": "Autosomal-dominant mutation in the STAT3 gene"}, {"id": "C", "text": "Deficiency in CD40 ligand or CD40"}, {"id": "D", "text": "Defect in the NADPH oxidative pathway"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given history of recurrent bacterial infections and fungal pneumonia caused by Pneumocystis\njirovecii (as shown in the image above), along with elevated IgM and low IgG levels, are suggestive\nof hyper-IgM syndrome, an inherited deficiency in the CD40 ligand or CD40.\nHyper-IgM syndrome is a primary immunodeficiency disorder that is inherited as:\n+ X-linked form (most common): CD40 ligand (CD40L) defect on T-helper cells, preventing B-cell\nactivation, class switching and memory cells formation.\n+ Autosomal recessive form: Affect CD40 on B-cells or enzymes like activation-induced cytidine\ndeaminase (AID), a DNA-editing enzyme expressed in B cells.\nThe B-cell response to T-independent antigen is unaffected. CD40-CD40L interactions are also\nrequired for IL-12 secretion. So, defects in this pathway result in increased susceptibility to\nintracellular pathogens.\nIn normal immune response, B-cells expressing CD40 on their surface interact with CD40L on\nT-cells to undergo class switching from IgM to various other classes (IgG, IgA, IgE) depending on\nthe type of antigen. Thus, failure of this class switching leads to an increase in IgM with extremely\nlow levels of IgG and no IgA or IgE.\n\n\n\nClinical features include recurrent pyogenic infections caused by low levels of opsonizing IgG\nantibodies. Patients are highly susceptible to pneumonia caused by Pneumocystis jirovecii.\nThe illustration below depicts the defects in components of T-cell & B-cell interactions that\ngive rise to primary immunodeficiency.\nOther options:\nOption A: Defective cytokine signalling in T-cell precursors is seen in X-linked Severe Combined\nImmunodeficiency (SCID). It is caused by a mutation in the common y-chain (yc) subunit of\ncytokine receptors. This defect disrupts Interleukins (IL-2, IL-4, IL-7, IL-9, IL-15 and IL-21)\nsignalling, leading to low T-cell and NK-cell numbers. Although B-cell numbers are normal, these\nare non-functional due to the absence of T-cell help, resulting in impaired antibody synthesis.\nOption B: Mutation in the STAT3 gene is seen in an autosomal dominant form of Hyper IgE\nsyndrome (also known as Job syndrome), characterized by recurrent staphylococcal skin\nabscesses, recurrent pulmonary infections often with pneumatoceles and atopic dermatitis. Here,\nserum IgE levels are markedly elevated (due to IgE overproduction without modulation), and IgA,\nIgG and IgM concentrations are generally normal.\nOption D: A defect in NADPH oxidative pathway is seen in chronic granulomatous disease,\nleading to failure of the oxidative burst in phagocytes, predisposing individuals to\ncatalase-positive microbial infections.", "questionPages": [85], "solutionPages": [92, 93], "questionFigures": ["crop-question-ch5-q7-1"], "solutionFigures": ["crop-solution-ch5-q7-1"]}, {"id": "ch5-q8", "chapterId": 5, "chapter": "Immune Disorders", "number": 8, "text": "A5-year-old boy is brought with complaints as shown below. The parents report that these\ncomplaints have been present for the last 2 years. Which of the following is found to be the\nmost effective treatment for this disease?", "options": [{"id": "A", "text": "iand3"}, {"id": "B", "text": "1 and 2"}, {"id": "C", "text": "Only 2"}, {"id": "D", "text": "2and3"}], "correctIndex": 3, "correctLetter": "D", "solution": "This 5-year-old boy presenting with a 2-year history of thick, white-coated tongue and dystrophic\nnail changes, as shown in the above image, suggests chronic mucocutaneous candidiasis, for\nwhich transfer factor therapy and amphotericin B have been reported to be the effective\ntreatments.\nChronic mucocutaneous candidiasis (CMC) is characterized by deficient cell-mediated immunity\nto candida, usually due to defects in IL-17. Mutations affecting the IL-17 signalling pathway lead to\n\n\n\nimpaired IL-17 production and defective TH17 function, compromising mucosal and skin defence\nmechanisms and increasing susceptibility to fungal infections.\nPatients develop persistent fungal infections of the skin, nails, oral cavity, and genitals, primarily\ncaused by Candida species. Despite chronic mucocutaneous involvement, these patients typically\ndo not develop invasive candidiasis. A key feature of CMC is the absence of delayed\nhypersensitivity to candida antigens. However, circulating antibodies to them are present in high\ntitres. They do not show increased susceptibility to other infections but may develop\nendocrinopathies, autoimmune disorders, and vascular abnormalities.\nTransfer factor therapy and Amphotericin B have been reported to be effective for the treatment\nof chronic mucocutaneous candidiasis.", "questionPages": [85, 86], "solutionPages": [93, 94], "questionFigures": ["crop-question-ch5-q8-1"], "solutionFigures": []}, {"id": "ch5-q9", "chapterId": 5, "chapter": "Immune Disorders", "number": 9, "text": "An infant with a history of delayed separation of the umbilical cord now presents with\nrecurrent pneumonia. The total leukocyte count is 20,000/microlitre. Which of the following\ngenetic defects is most likely present?", "options": [{"id": "A", "text": "Mutation of Bruton tyrosine kinase gene"}, {"id": "B", "text": "Low levels of NADPH oxidase and negative DHR test"}, {"id": "C", "text": "Reduced phagocyte surface expression of sialyl-Lewis x"}, {"id": "D", "text": "Excessive IgM with reduced IgG and IgA"}], "correctIndex": 2, "correctLetter": "C", "solution": "This history of delayed separation of the umbilical cord with recurrent pneumonia and peripheral\nleucocytosis is highly suggestive of leucocyte adhesion defect (LAD). In this defect, there is\nreduced phagocyte surface expression of sialyl-Lewis X.\nLAD is an autosomal recessive disorder affecting leukocyte function. Neutrophils have reduced\nadhesion, mobility, and phagocytic ability. There are three main types of LAD:\n+ LAD 1- Defective B2 integrin common chain (CD18), leading to abnormal neutrophil chemotaxis\nand defective tight adhesion.\n+ LAD 2- Reduced phagocyte surface expression of sialyl-Lewis X (fucosylated protein), leading to\nabnormal neutrophil rolling and tethering.\n+ LAD 3- Defect in regulatory protein (kindlin 3, also known as Fermt 3) involved in activating the\nligand affinity for B2 integrins, leading to abnormal neutrophil chemotaxis and adhesion (milder\nthan type 1).\nLAD is characterised by recurrent bacterial and fungal infections, reduced inflammatory\nresponses despite elevated blood neutrophilia, and delayed wound healing and delayed umbilical\ncord loss. in patients with LAD type 3, there may be bleeding as B2 integrin on platelets is\nnon-functional.\nTypical signs of inflammation may be absent, pus does not form with few neutrophils on biopsy of\ninfected tissues along with massive hyperleukocytosis (>30,000/1L) in the blood. Early\nallogeneic hematopoietic stem cell transplantation is used in the treatment of severe LAD.", "questionPages": [86], "solutionPages": [94], "questionFigures": [], "solutionFigures": []}, {"id": "ch5-q10", "chapterId": 5, "chapter": "Immune Disorders", "number": 10, "text": "Which of the following statements is true about severe combined immunodeficiency\ndisorders?", "options": [{"id": "A", "text": "Reticular dysgenesis of de Vaal is a mild form of combined immunodeficiency"}, {"id": "B", "text": "They are inherited as autosomal dominant disorders"}, {"id": "C", "text": "Adenosine deaminase deficiency is associated with chondrocyte abnormalities"}, {"id": "D", "text": "The defect in Swiss type agammaglobulinemia is at the level of multipotent hemopoeitic stem cell"}], "correctIndex": 2, "correctLetter": "C", "solution": "Adenosine deaminase deficiency is associated with chondrocyte abnormalities.\nSevere combined immunodeficiency disorders are associated with severe deficiency of both\nhumoral and CMI. They are inherited in both X-linked and autosomal recessive modes. There are\ndifferent forms of this disorder:\n\n\n\n+ Reticular dysgenesis is the most serious form of combined immunodeficiency. Here the defect is\nat the level of the multipotent hemopoietic stem cell.\n+ Adenosine deaminase (ADA) deficiency is associated with enzyme deficiency. The condition is\nassociated with chondrocyte abnormalities which can be discerned radiologically.\n* Swiss-type agammaglobulinemia is associated with lymphocytopenia and severe defect in CMI.\nThe basic defect is at the level of the lymphoid stem cell.", "questionPages": [86, 87], "solutionPages": [94, 95], "questionFigures": [], "solutionFigures": []}, {"id": "ch5-q11", "chapterId": 5, "chapter": "Immune Disorders", "number": 11, "text": "Which of the following is an immunologically privileged site?", "options": [{"id": "A", "text": "Seminiferous tubule"}, {"id": "B", "text": "Area postrema"}, {"id": "C", "text": "Optic nerve"}, {"id": "D", "text": "Loop of Henle"}], "correctIndex": 0, "correctLetter": "A", "solution": "The seminiferous tubules are an immunologically privileged site.\nImmunologically privileged sites can tolerate the introduction of antigens without eliciting an\nimmune response. This allows a higher likelihood of graft survival, even without perfect HLA\nmatching. As a result, an allograft can be placed in these sites without endangering a rejection\nreaction.\nThe unique immune tolerance in these regions is primarily due to the lack of effective lymphatic\ndrainage, which prevents antigen presentation to the immune system, and the presence of\nblood-tissue barriers that restrict immune cell infiltration. Low vascularity contributes to immune\nprivilege by minimising antigen exposure and immune cell recruitment.\nExamples of immune-privileged sites are the anterior chamber of the eye, cornea, testes, and\nbrain.\nNote: Although part of the brain, the blood-brain barrier is absent at the area postrema, therefore\nit is not an immune-privileged site.", "questionPages": [87], "solutionPages": [95], "questionFigures": [], "solutionFigures": []}, {"id": "ch6-q1", "chapterId": 6, "chapter": "Streptococci and Enterococci", "number": 1, "text": "What is the Lancefield grouping of B-hemolytic-streptococci based on?", "options": [{"id": "A", "text": "T antigen"}, {"id": "B", "text": "M protein"}, {"id": "C", "text": "Group-specific cell wall polypeptide"}, {"id": "D", "text": "Group-specific C carbohydrate antigen"}], "correctIndex": 3, "correctLetter": "D", "solution": "Lancefield grouping of B-hemolytic-streptococci is based on group-specific carbohydrate C antigen\npresent on the cell wall. He classified them into 20 serological types from Group-A to Group V\nexcept for I and J.\nGroup A B-hemolytic streptococci (Streptococcus pyogenes) are further classified by\nGriffith typing based on protein antigens (M, T, R) present on the cell surface.", "questionPages": [96], "solutionPages": [104], "questionFigures": [], "solutionFigures": ["crop-solution-ch6-q1-1"]}, {"id": "ch6-q2", "chapterId": 6, "chapter": "Streptococci and Enterococci", "number": 2, "text": "An elderly diabetic lady presented with swelling and pain of her right leg following a skin\nbiopsy. She was febrile at the time of examination and hemorrhagic bullae with necrosis of\nthe surrounding skin were noted on her leg. Gram staining of the pus collected from the\nbullae is shown below. Which of the following is the most likely organism causing this\ncondition?", "options": [{"id": "A", "text": "Clostridium histolyticum"}, {"id": "B", "text": "Streptococcus pyogenes"}, {"id": "C", "text": "Staphylococcus aureus"}, {"id": "D", "text": "Clostridium perfringens"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given clinical vignette is strongly suggestive of necrotizing fasciitis which is most commonly\ncaused by Streptococcus pyogenes (Group A B-hemolytic streptococcus).\nNecrotizing fasciitis is a rapidly progressive inflammatory infection of the fascia, with secondary\nnecrosis of the subcutaneous tissues. It has also been referred to as Meleney ulcer, acute dermal\ngangrene, hospital gangrene, suppurative fasciitis, and synergistic necrotizing cellulitis. The\nsource of the infection is either the skin, with organisms introduced into the tissue through\ntrauma, or the bowel flora, with organisms released during abdominal surgery.\nThe onset of symptoms is usually quite acute and is marked by severe pain at the site of\ninvolvement, malaise, fever, chills, and a toxic appearance. The affected limb is edematous with\nthe overlying skin turning dusky with mottled erythema and the development of hemorrhagic\nbullae.\nThis is a surgical emergency as the condition is rapidly fatal. Treatment of the condition includes:\n* Surgical intervention is the major therapeutic modality in cases of necrotizing fasciitis.\n+ Antibiotics- penicillin (1-4 million U IV q4h) plus clindamycin (600-900 mg IV q8h).\nThe following image shows surgical debridement being done for a case of necrotising fasciitis.", "questionPages": [96, 97], "solutionPages": [104, 105], "questionFigures": ["crop-question-ch6-q2-1"], "solutionFigures": ["crop-solution-ch6-q2-1"]}, {"id": "ch6-q3", "chapterId": 6, "chapter": "Streptococci and Enterococci", "number": 3, "text": "A 7-year-old child was brought in by her mother to the OPD with complaints of fever, sore\nthroat, and a scarlatiniform rash. A throat swab was taken and sent to the lab for culture on\nblood agar. Which of the following factors is responsible for the zones of hemolysis seen in\nthe culture below?", "options": [{"id": "A", "text": "Lipoteichoic acid"}, {"id": "B", "text": "Streptolysin S"}, {"id": "C", "text": "Streptokinase"}, {"id": "D", "text": "Hyaluronidase"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given case scenario o a patient with fever, sore throat, and a scarlatiniform rash is suggestive\nof scarlet fever caused by Streptococcus pyogenes. Streptolysin S is the factor responsible for\nthe zones of hemolysis seen around streptococcal colonies on blood agar.\nStreptococci produces two hemolysins:\n+ Streptolysin O is called so because it is oxygen-labile. It is also heat-labile and it has specific\ncardiotoxic and leucotoxic activity.\n+ Streptolysin S is called so because it is soluble in serum. It is also oxygen-stable hemolysin. It is\na protein but is not antigenic.\nThe following image shows blood agar with colonies of streptococci with hemolytic zones around\nthem:", "questionPages": [97], "solutionPages": [105, 106], "questionFigures": ["crop-question-ch6-q3-1"], "solutionFigures": ["crop-solution-ch6-q3-1"]}, {"id": "ch6-q4", "chapterId": 6, "chapter": "Streptococci and Enterococci", "number": 4, "text": "Which of the following organisms produces superantigen?", "options": [{"id": "A", "text": "Staphylococcus epidermidis"}, {"id": "B", "text": "Streptococcus pyogenes"}, {"id": "C", "text": "Clostridium perfringens"}, {"id": "D", "text": "Vibrio cholera"}], "correctIndex": 1, "correctLetter": "B", "solution": "Streptococcus pyogenes produces streptococcal pyrogenic exotoxin (SPE), which is a superantigen.\nSuperantigens are protein toxins that stimulate large numbers of T cells, irrespective of antigen\nspecificity. They bind to the class II MHC molecule outside the peptide-binding groove and VB\nregion of the TCR. Some examples of superantigens are staphylococcal enterotoxins, toxic shock\nsyndrome toxin, and group A streptococcal pyrogenic exotoxin.\nThe below image shows the binding of superantigen to T-cell receptor.", "questionPages": [97], "solutionPages": [106], "questionFigures": [], "solutionFigures": ["crop-solution-ch6-q4-1"]}, {"id": "ch6-q5", "chapterId": 6, "chapter": "Streptococci and Enterococci", "number": 5, "text": "Which of the following types of streptococcal pyrogenic exotoxins is bacteriophage mediated?", "options": [{"id": "A", "text": "type A & type B"}, {"id": "B", "text": "type C & type D"}, {"id": "C", "text": "type B & type D"}, {"id": "D", "text": "type A & type C"}], "correctIndex": 3, "correctLetter": "D", "solution": "Streptococcal pyrogenic exotoxins type A and type C are bacteriophage-mediated toxins.\nThe streptococcal pyrogenic exotoxin(SPE) is so named because the primary effect of the toxin is\nthe induction of fever. It is also known as erythrogenic toxin because its intra-dermal injection\ninto susceptible individuals produced an erythematous reaction (Dick Test).\nThere are 3 types of streptococcal pyrogenic exotoxins namely:\n+ type A - phage mediated.\n* type B - chromosome mediated.\n+ type C - phage mediated.", "questionPages": [97, 98], "solutionPages": [106], "questionFigures": [], "solutionFigures": []}, {"id": "ch6-q6", "chapterId": 6, "chapter": "Streptococci and Enterococci", "number": 6, "text": "Which of the following is a streptococcal toxin responsible for connective tissue breakdown?", "options": [{"id": "A", "text": "Hyaluronidase"}, {"id": "B", "text": "Streptococcal Pyrogenic Exotoxin (SPE)"}, {"id": "C", "text": "Streptolysin O"}, {"id": "D", "text": "Serum opacity factor"}], "correctIndex": 0, "correctLetter": "A", "solution": "Hyaluronidase is the streptococcal toxin responsible for connective tissue breakdown.\nHyaluronidase or spreading factor is expressed by non-capsulated strains of Streptococcus\npyogenes, such as M type 4 and 22. It acts by cleaving hyaluronic acid, which is present in the\nconnective tissue, epithelial, and neural tissues. This results in the spread of infection along the\nintercellular space.", "questionPages": [98], "solutionPages": [106, 107], "questionFigures": [], "solutionFigures": []}, {"id": "ch6-q7", "chapterId": 6, "chapter": "Streptococci and Enterococci", "number": 7, "text": "Which streptococcal antigen cross reacts with myocardium?", "options": [{"id": "A", "text": "Peptidoglycan"}, {"id": "B", "text": "Cell wall M protein"}, {"id": "C", "text": "Hyaluronic acid"}, {"id": "D", "text": "Cell wall C carbohydrate"}], "correctIndex": 1, "correctLetter": "B", "solution": "Antibodies to the cell wall M antigen present on the Streptococcus cross-reacts with a similar\nmyocardial antigen. This cross-reaction with myocardium is the cause of acute rheumatic fever.", "questionPages": [98], "solutionPages": [107], "questionFigures": [], "solutionFigures": []}, {"id": "ch6-q8", "chapterId": 6, "chapter": "Streptococci and Enterococci", "number": 8, "text": "A 12-year-old child presented with a sore throat for 3 days. Which of the following medium is\nused to culture the throat swab?", "options": [{"id": "A", "text": "Blood Agar"}, {"id": "B", "text": "Lowenstein-Jensen medium"}, {"id": "C", "text": "Stewart medium"}, {"id": "D", "text": "Chocolate Agar"}], "correctIndex": 0, "correctLetter": "A", "solution": "Blood agar is the preferred culture media as it is used for the culture and isolation of\nStreptococcus pyogenes which is the most common cause of sore throat.\nThe selective medium for Streptococcus pyogenes is Crystal violet blood agar and the transport\nmedia for this organism is Pikes medium.", "questionPages": [98], "solutionPages": [107], "questionFigures": [], "solutionFigures": []}, {"id": "ch6-q9", "chapterId": 6, "chapter": "Streptococci and Enterococci", "number": 9, "text": "Which of the following organisms show beta-hemolysis on blood agar, resistance to\nbacitracin, and a positive CAMP test?", "options": [{"id": "A", "text": "Streptococcus pyogenes"}, {"id": "B", "text": "Streptococcus agalactiae"}, {"id": "C", "text": "Pneumococcus"}, {"id": "D", "text": "Enterococcus"}], "correctIndex": 1, "correctLetter": "B", "solution": "Streptococcus agalactiae is a group B streptococci that shows B-hemolysis on blood agar,\nis resistant to bacitracin, and gives a positive CAMP test.\nThe CAMP test is used to identify group B B-hemolyitic-streptococci based on their ability to\nform CAMP factor. This factor causes synergistic hemolysis with B-hemolysin formed\nby Staphylococcus aureus, when Streptococcus agalactiae is inoculated perpendicular to a streak\nof Staphylococcus aureus on blood agar. This produces the characteristic arrow-head zone of\nhemolysis.\nThe below image shows a positive CAMP test.\n\n\n\nThe following table provides important laboratory characteristics which differentiate\nStreptococcus pyogenes from Streptococcus agalactiae.", "questionPages": [98, 99], "solutionPages": [107, 108], "questionFigures": [], "solutionFigures": ["crop-solution-ch6-q9-1"]}, {"id": "ch6-q10", "chapterId": 6, "chapter": "Streptococci and Enterococci", "number": 10, "text": "A child presents to the OPD with an infective skin lesion over his leg. On microscopic\nexamination of the pus from the lesion, gram-positive cocci in chains are visualized and pus\nculture shows B-haemolytic colonies on blood agar. Which of the following tests can be\nperformed to identify the causative organism?", "options": [{"id": "A", "text": "Bile solubility"}, {"id": "B", "text": "Optochin sensitivity"}, {"id": "C", "text": "Bacitracin sensitivity"}, {"id": "D", "text": "Catalase positive"}], "correctIndex": 2, "correctLetter": "C", "solution": "B hemolytic colonies on blood agar with gram-positive cocci in chains seen on microscopy suggest\nthe organism is a B-hemolytic streptococcus. Bacitracin sensitivity is used to differentiate between\ngroup A and group B B-hemolytic streptococci.\nGroup A: Bacitracin-sensitive (S. pyogenes)\nGroup B: Bacitracin-resistant (S. agalactiae)\nOptions A & B: Bile solubility and optochin sensitivity are used to differentiate Streptococcus\npneumoniae and viridans streptococci. They are both ° hemolytic on blood agar but some species\nof viridans streptocci are non hemolytic.\nOption D: Catalase test is used to differentiate streptococcus and staphylococcus. Staphylococcus\nappear as clusters of gram positive cocci on microscopy and not chains.", "questionPages": [99], "solutionPages": [108, 109], "questionFigures": [], "solutionFigures": []}, {"id": "ch6-q11", "chapterId": 6, "chapter": "Streptococci and Enterococci", "number": 11, "text": "Which of the following bacteria is associated with the causation of colorectal carcinoma,\nrectal polyp, endocarditis and septicaemia and is pyrrolidinyl arylamidase test negative?", "options": [{"id": "A", "text": "Streptococcus equisimilis"}, {"id": "B", "text": "Streptococcus gallolyticus"}, {"id": "C", "text": "Enterococcus"}, {"id": "D", "text": "Streptococcus pyogenes"}], "correctIndex": 1, "correctLetter": "B", "solution": "Streptococcus gallolyticus is associated with the causation of colorectal CA, rectal polyp,\nendocarditis, and septicemia and is pyrrolidinyl arylamidase test (PYR test) negative.\nStreptococcus gallolyticus, formerly called Streptococcus bovis, is a non-enterococcal Group D\nstreptococci. It is bile insoluble, esculin hydrolysis positive, PYR negative and shows no growth in\n6.5% NaCl.", "questionPages": [99], "solutionPages": [109], "questionFigures": [], "solutionFigures": []}, {"id": "ch6-q12", "chapterId": 6, "chapter": "Streptococci and Enterococci", "number": 12, "text": "Which of the following organisms can survive up to 60°C, is PYR positive, and can grow on\nmedia with 6.5% NaCl?", "options": [{"id": "A", "text": "Streptococcus pyogenes"}, {"id": "B", "text": "Streptococcus agalactiae"}, {"id": "C", "text": "Enterococcus feacalis"}, {"id": "D", "text": "Streptococcus pneumoniae"}], "correctIndex": 2, "correctLetter": "C", "solution": "Among the given options, Enterococcus feacalis can survive up to 60°C, is PYR test positive, and\ncan grow in the presence of 6.5% NaCl.\nEnterococci have the following features:\n* Formation of tiny deep pink colonies on MacConkey’s medium\n¢ Survives at 600C for 30 minutes.\n* Growth in the presence of 40 % bile, 6.5% sodium chloride at pH 9.6.\n* PYR (Pyrrolidonyl Arylamidase) positive\n* Esculin hydrolysis is positive.\n* Usually nonhemolytic, but may show ° or B hemolysis.\nOption A: Streptococcus pyogenes is a delicate organism, easily destroyed by heat (54°C for 30\nmin), PYR positive.\nOption B: Streptococcus agalactiae is PYR test negative.\nOption D: Streptococcus pneumoniae are readily destroyed by heat (52°C for 15 min).", "questionPages": [99, 100], "solutionPages": [109], "questionFigures": [], "solutionFigures": []}, {"id": "ch6-q13", "chapterId": 6, "chapter": "Streptococci and Enterococci", "number": 13, "text": "A patient admitted to an ICU spiked a fever and his blood culture was positive for\ngram-positive cocci in chains, which are catalase-negative. He was being given ceftazidime\nand amikacin via a central venous line for the past week. Following this, you started him on\nvancomycin but his blood culture remained positive for the same organism even after 2 weeks\nof therapy. Which of the following is the most likely organism causing the infection?", "options": [{"id": "A", "text": "Streptococcus pyogenes"}, {"id": "B", "text": "Viridans streptococci"}, {"id": "C", "text": "Enterococcus faecium"}, {"id": "D", "text": "Coagulase-negative Staphylococcus"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given scenario is suggestive of vancomycin-resistant enterococci (VRE) infection.\nGram-positive cocci in chains that are catalase-negative suggest that the organism belongs to\nStreptococcaceae family. Positive culture after 2 weeks of vancomycin therapy suggests resistance\nto vancomycin.\nOption A: Streptococcus pyogenes are sensitive to vancomycin and are not commonly implicated\nin central venous line infections.\nOption B: Viridans streptococci are usually mouth commensals and are sensitive to vancomycin.\nOption D: Coagulase-negative staphylococci are gram-positive cocci in clusters which\nare catalase-positive. Hence, they can be ruled out.", "questionPages": [100], "solutionPages": [109, 110], "questionFigures": [], "solutionFigures": []}, {"id": "ch6-q14", "chapterId": 6, "chapter": "Streptococci and Enterococci", "number": 14, "text": "Oral examination of a young patient shows the following finding. Which bacteria belonging to\nviridans group is most commonly implicated in this condition?", "options": [{"id": "A", "text": "Streptococcus mutans"}, {"id": "B", "text": "Streptococcus mitis"}, {"id": "C", "text": "Streptococcus sanguis"}, {"id": "D", "text": "Streptococcus salivarius"}], "correctIndex": 0, "correctLetter": "A", "solution": "The above image shows dental caries which are commonly caused by Streptococcus mutans.\nIt belongs to the viridans group/° -hemolytic streptococci.\nStreptococcus mutans breaks down the dietary sucrose producing acid and a tough adhesive\ndextran. The acid damages dentine while the dextrans bind together with food debris, epithelial\ncells, mucus, and bacteria to form dental plaques, leading to formation of dental caries.", "questionPages": [100], "solutionPages": [110], "questionFigures": ["crop-question-ch6-q14-1"], "solutionFigures": []}, {"id": "ch6-q15", "chapterId": 6, "chapter": "Streptococci and Enterococci", "number": 15, "text": "A 49-year-old man presented with high-grade fever, cough and shortness of breath. On\nexamination, he was febrile, tachypneic and tachycardic. A chest X-ray was performed which\nis shown in the image. What is the single most likely causative organism?", "options": [{"id": "A", "text": "Staphylococcus aureus"}, {"id": "B", "text": "Streptococcus pyogenes"}, {"id": "C", "text": "Streptococcus pneumoniae"}, {"id": "D", "text": "Haemophilus influenzae"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given clinical history and the X-ray showing right lower lobe consolidation is strongly\nsuggestive of lobar pneumonia, most commonly caused by Streptococcus pneumoniae (>95 %\nof cases).\nLobar pneumonia is an acute exudative inflammation of an entire pulmonary lobe. The below\nimage shows the histopathological picture of lobar pneumonia.", "questionPages": [100, 101], "solutionPages": [110], "questionFigures": ["crop-question-ch6-q15-1"], "solutionFigures": ["crop-solution-ch6-q15-1"]}, {"id": "ch6-q16", "chapterId": 6, "chapter": "Streptococci and Enterococci", "number": 16, "text": "A 70-year-old male presented with fever, chills and cough associated with chest pain. His\nsputum sample was sent for culture on blood agar which showed the presence of ° -hemolytic\ncolonies the following day. Which of the following best describes the organism likely\nimplicated here?", "options": [{"id": "A", "text": "Gram-positive cocci in short chains, catalase negative and bile resistant"}, {"id": "B", "text": "Gram-positive cocci in pairs, catalase negative and bile soluble"}, {"id": "C", "text": "Gram-positive cocci in clusters, catalase positive and coagulase positive"}, {"id": "D", "text": "Gram-positive cocci in clusters, catalase positive and coagulase negative"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given clinical scenario and the growth of alpha-hemolytic colonies from the sputum of the\npatient are strongly suggestive of pneumococcal pneumonia. Pneumococci are gram-positive cocci\nin pairs, catalase negative, and bile soluble.\nThe image below shows Gram positive cocci in pairs. bile solubility, and catalase reaction.\n\n\n\nThe image below shows positive bile solubility test shown by Streptococcus pneumoniae.\nThe below image shows catalse test.", "questionPages": [101], "solutionPages": [110, 111, 112], "questionFigures": [], "solutionFigures": ["crop-solution-ch6-q16-1", "crop-solution-ch6-q16-2"]}, {"id": "ch6-q17", "chapterId": 6, "chapter": "Streptococci and Enterococci", "number": 17, "text": "Quellung reaction is used to demonstrate .", "options": [{"id": "A", "text": "Capsule"}, {"id": "B", "text": "Cell wall"}, {"id": "C", "text": "Cell membrane"}, {"id": "D", "text": "Pilli"}], "correctIndex": 0, "correctLetter": "A", "solution": "Quellung reaction is used to demonstrate the capsule of streptococci.\nQuellung reaction (Quellung = swelling):\n+ A suspension of pneumococci is mixed on a slide with a drop of type-specific antiserum and a\nloop full of methylene blue solution.\n+ In the presence of homologous antiserum, the capsule becomes apparently swollen, sharply\ndelineated and refractile.\n+ The Quellung test can be done directly with sputum from acute pneumonia cases.\nThe below image shows the swollen capsule of pneumococci following the addition of homologous\nantiserum.", "questionPages": [101, 102], "solutionPages": [112, 113], "questionFigures": [], "solutionFigures": ["crop-solution-ch6-q17-1"]}, {"id": "ch6-q18", "chapterId": 6, "chapter": "Streptococci and Enterococci", "number": 18, "text": "Which of the following factors is

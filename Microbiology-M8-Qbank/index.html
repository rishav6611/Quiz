se activity"}, {"id": "C", "text": "The toxin causes continued activation of adenylate cyclase"}, {"id": "D", "text": "Inhibit 60S ribosomal subunit"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given clinical scenario of dehydration, profuse diarrhea, and rice water stools is suggestive of\ncholera. Cholera toxin causes continued activation of adenylate cyclase.\nMechanism of action of cholera toxin:\n* The cholera toxin molecule consists of 1 A and 5 B subunits. The B (binding) units attach to the\nGM1 ganglioside receptors on the surface of jejunal epithelial cells. The A (active) subunit,\non being transported into the enterocyte, dissociates into A1 and A2. A2 fragment only links\nbiologically active A1 to the B subunit.\n\n\n\n+ A1 causes prolonged activation of cellular adenylate cyclase and accumulation of cAMP, leading\nto outpouring into the small intestinal lumen, of large quantities of water and electrolytes and the\nconsequent watery diarrhea, that is isotonic with plasma but contains much more of potassium\nand bicarbonate.\n+ The toxin also inhibits the intestinal absorption of sodium and chloride.\n+ All clinical manifestations and complications in cholera result from the massive water and\nelectrolyte depletion thus caused.", "questionPages": [221, 222], "solutionPages": [231, 232], "questionFigures": ["crop-question-ch14-q9-1"], "solutionFigures": ["crop-solution-ch14-q9-1"]}, {"id": "ch14-q10", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 10, "text": "Which of the following does not play a role in the virulence of Vibrio cholerae?", "options": [{"id": "A", "text": "Lipopolysaccharide"}, {"id": "B", "text": "Flagella"}, {"id": "C", "text": "Pilum"}, {"id": "D", "text": "Cholera toxin"}], "correctIndex": 0, "correctLetter": "A", "solution": "Vibrio cholerae possesses lipopolysaccharide (LPS) O antigen but it plays no role in the\npathogenesis of cholera. It is responsible for the immunity induced by killed vaccines.\nFactors involved in virulence of Vibrio cholerae:\n+ In the small intestine, vibrios can cross the protective layer of mucus and reach the epithelial\ncells by using mucinase and other proteolytic enzymes.\n* Toxin co-regulated pilus(TCP), is essential for the adhesion to the epithelial surface and\ncolonization of the bacteria in small intestine.\n* Cholera toxin (also known as choleragen and cholera enterotoxin) causes watery diarrhea\nthrough cAMP-mediated pathway.", "questionPages": [222], "solutionPages": [232], "questionFigures": [], "solutionFigures": []}, {"id": "ch14-q11", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 11, "text": "An El Tor vibrio was identified to be the causative agent of a diarrhea epidemic. Which of the\nfollowing is not a characteristic feature of this organism?", "options": [{"id": "A", "text": "Resistant to El Tor phage V"}, {"id": "B", "text": "Intrinsic resistance to polymyxin B"}, {"id": "C", "text": "Voges-Proskauer test is positive"}, {"id": "D", "text": "Not susceptible to group IV phage"}], "correctIndex": 0, "correctLetter": "A", "solution": "El Tor vibrios are susceptible to El Tor phage V.", "questionPages": [222], "solutionPages": [232, 233], "questionFigures": [], "solutionFigures": []}, {"id": "ch14-q12", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 12, "text": "You are a medical officer at a district hospital and receive 13 patients with rice-water diarrhea\nand dehydration. You suspect cholera and want to send the stool samples to the hospital lab.\nWhich of the following media will you not use?", "options": [{"id": "A", "text": "Venkatraman-Ramakrishnan medium"}, {"id": "B", "text": "Cary-Blair medium"}, {"id": "C", "text": "Monsur's GTTA medium"}, {"id": "D", "text": "Nutrient agar"}], "correctIndex": 3, "correctLetter": "D", "solution": "Nutrient agar is not used to transport Vibrio cholerae. It is a simple media used to grow\nnon-fastidious organisms, but not to transport them.\nTransport media for Vibrio cholerae:\n* Venkatraman-Ramakrishnan (VR) medium\n* Cary-Blair medium\nIf the specimen can reach the laboratory in a few hours, it may also be transported in enrichment\nmedia. Examples include:\n+ Alkaline peptone water\n* Monsur's medium.\nIf transport media are not available, strips of blotting paper may be soaked in the watery stool and\nsent to the laboratory packed in plastic envelopes.", "questionPages": [222], "solutionPages": [233], "questionFigures": [], "solutionFigures": []}, {"id": "ch14-q13", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 13, "text": "Which of the following bacteria shows Kanagawa phenomenon?", "options": [{"id": "A", "text": "Vibrio cholerae"}, {"id": "B", "text": "Vibrio parahaemolyticus"}, {"id": "C", "text": "Vibrio vulnificus"}, {"id": "D", "text": "Vibrio alginolyticus"}], "correctIndex": 1, "correctLetter": "B", "solution": "Kanagawa phenomenon is shown by Vibrio parahaemolyticus. It refers to hemolysis occuring\nwhen the bacteria are inoculated on Wagatsuma agar.\nPathogenic strains of V. parahaemolyticus are hemolytic, while non-pathogenic strains are\nnon-hemolytic. This phenomenon occurs due to a heat-stable hemolysin.", "questionPages": [222, 223], "solutionPages": [233], "questionFigures": [], "solutionFigures": []}, {"id": "ch14-q14", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 14, "text": "An outbreak of food poisoning in a coastal city is determined to be due to contaminated\nseafood. The causative bacteria formed the following colonies on TCBS agar and showed\nhemolysis on Wagatsuma agar. Which of the following statements regarding the organism\nimplicated here is false?", "options": [{"id": "A", "text": "It is non-capsulated"}, {"id": "B", "text": "It shows bipolar staining"}, {"id": "C", "text": "It produces peritrichous flagella on solid medium"}, {"id": "D", "text": "It gives a positive string test"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given case scenario of an organism that caused food poisoning due to contaminated seafood\nin addition to the cultural characteristics is suggestive of food contamination by Vibrio\nparahaemolyticus. It is a capsulated organism.\nV. parahaemolyticus is an enteropathogenic halophilic vibrio that is an important cause of food\npoisoning throughout the world. It inhabits the coastal seas, where it is found in shrimps, crabs,\nand oysters.\nIt forms opaque green colonies with a raised centre and flat translucent periphery on TCBS agar\nunlike V. cholera which forms yellow colonies. Pathogenic strains show hemolysis on Wagatsuma\nagar which is known as Kanagawa phenomenon. This can be used as a test for pathogenecity.\nOther options:\nOption B: It shows bipolar staining and has a tendency for pleomorphism, especially when grown\non 3% salt agar.\nOption C: Unlike other vibrios, it produces peritrichous flagella when grown on solid media. Polar\nflagella are formed in liquid cultures.\nOption D: String test is positive like with V. cholera.", "questionPages": [223], "solutionPages": [233, 234], "questionFigures": ["crop-question-ch14-q14-1"], "solutionFigures": []}, {"id": "ch14-q15", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 15, "text": "Which of the following vibrios has the highest salt tolerance?", "options": [{"id": "A", "text": "Vibrio mimicus"}, {"id": "B", "text": "Vibrio parahaemolyticus"}, {"id": "C", "text": "Vibrio vulnificus"}, {"id": "D", "text": "Vibrio alginolyticus"}], "correctIndex": 3, "correctLetter": "D", "solution": "Vibrio with the highest salt tolerance of up to 10% NaCl is Vibrio alginolyticus.\nThe salt tolerances of vibrio species are as follows:\n+ V. cholerae optimally grows at 0.5-1% NaCl concentration. Its growth is inhibited by high\nconcentration of >6% NaCl.\n+ V. mimicus grows best at low salt concentrations of 0.5-1% like V. cholerae.\n+ V. parahaemolyticus grows optimally salt concentration of 2-4 %. It has a salt tolerance up to\n8%.\n+ V. vulnificus has a salt tolerance similar to V. parahaemolyticus.\n+ V. alginolyticus has the highest salt tolerance of up to 10% NaCl.", "questionPages": [223, 224], "solutionPages": [234], "questionFigures": [], "solutionFigures": []}, {"id": "ch14-q16", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 16, "text": "A fisherman presented to the ER with a wound on his left leg. He tells you he had got a small\ncut a week back that got worse after his recent fishing trip. On examination, you note vesicles\nand bullae around the wound. Specimen taken from the bullae revealed lactose-fermenting\ncolonies. What is the causative agent?", "options": [{"id": "A", "text": "Vibrio cholerae"}, {"id": "B", "text": "Vibrio parahaemolyticus"}, {"id": "C", "text": "Vibrio vulnificus"}, {"id": "D", "text": "Vibrio alginolyticus"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given case scenario of contact with seawater of an existing wound leading to cellulitis by a\nlactose-fermenting bacteria suggests infection with Vibrio vulnificus.\nV. vulnificus ferments lactose but not sucrose. It has a salt tolerance of up to 8%.\nInfection with V. vulnificus can manifest in 2 ways:\n+ Soft-tissue infections can occur after contact with seawater and progress to cellulitis.\n+ Primary septicemia can occur in patients, typically with underlying liver disease, who have\nacquired the organism through the gastrointestinal tract after recent consumption of raw\nshellfish.\nNote: V. cholerae, V. parahaemolyticus, and V. alginolyticus do not ferment lactose although\nlactose may be split very slowly by V. cholerae.", "questionPages": [224], "solutionPages": [234], "questionFigures": [], "solutionFigures": []}, {"id": "ch14-q17", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 17, "text": "All of the following are correctly matched except:", "options": [{"id": "A", "text": "Vibrio parahaemolyticus - Food poisoning"}, {"id": "B", "text": "Vibrio alginolyticus - Infections of the eyes, ears and wounds"}, {"id": "C", "text": "Vibrio vulnificus - Dysentery"}, {"id": "D", "text": "Vibrio cholerae - Watery diarrhea"}], "correctIndex": 2, "correctLetter": "C", "solution": "Vibrio vulnificus causes wound infection following contact of open wounds with sea water.\nIn immunocompromised hosts, and particularly those with liver disease, it penetrates the gut\nmucosa following ingestion. It may not cause any gastrointestinal manifestations and directly\nenters the bloodstream, leading to the rapid development of septicemia with high mortality.\nOther options:\nOption A: V. parahaemolyticus causes food poisoning associated with marine food. It also causes\nacute diarrhea, unassociated with food poisoning.\nOption B: V. alginolyticus has been associated with infections of the eyes, ears, and wounds in\nhuman beings exposed to seawater.\n\n\n\nOption D: Cholera is caused by V. cholerae via its toxin but it does not cause dysentery which is\ncharacterized by bloody diarrhea. It is mainly associated with watery diarrhea.", "questionPages": [224], "solutionPages": [234, 235], "questionFigures": [], "solutionFigures": []}, {"id": "ch14-q18", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 18, "text": "A 17-year-old presents to you with complaints of passing loose stools. Given below are the\nfindings of his stool microscopy. Infection with which of the following bacteria would you\nconsider in your differential diagnosis?", "options": [{"id": "A", "text": "Shigella dysenteriae"}, {"id": "B", "text": "Campylobacter jejuni"}, {"id": "C", "text": "Escherichia coli"}, {"id": "D", "text": "Bacillus cereus"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given clip shows darting motility which is seen in Vibrio cholerae and Campylobacter jejuni.\nThus, among the given options, infection with C. jejuni should be considered as a differential\ndiagnosis in this case.\nCampylobacter jejuni possesses a single polar flagellum, hence it exhibits darting motility.\nShigella dysenteriae is a non-motile organism.", "questionPages": [224, 225], "solutionPages": [235], "questionFigures": ["crop-question-ch14-q18-1"], "solutionFigures": []}, {"id": "ch14-q19", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 19, "text": "A young man presented with complaints of a tingling sensation in his hands and feet. He also\ncomplains of weakness in his legs that is slowly spreading to his upper body. He had an\nepisode of bloody diarrhea 10 days ago. Which of the following organisms is the likely cause\nof this patient's condition?", "options": [{"id": "A", "text": "Vibrio cholerae"}, {"id": "B", "text": "Campylobacter jejuni"}, {"id": "C", "text": "Leptospira interrogans"}, {"id": "D", "text": "Helicobacter pylori"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given case scenario with ascending paralysis is suggestive of the development Guillain-Barré\nsyndrome (GBS) following diarrhea. The organism that likely caused this patients condition is\nCampylobacter jejuni, which can cause diarrhea and trigger GBS.\nCampylobacter is a slender, spirally curved, gram-negative bacillus. Growth occurs under\nmicroaerophilic conditions. The organism also shows darting motility. Asymptomatic\ncampylobacter infection also may trigger Guillain-Barré syndrome.\nGuillain-Barre syndrome is an acute, fulminant polyradiculoneuropathy that is autoimmune in\nnature. In C. jejuni infection, bacterial lipopolysaccharide triggers an autoimmune response\nagainst axons via molecular mimicry, hence causing GBS. Other organisms associated with GBS\ninclude cytomegalovirus, M. pneumonia, and Epstein-Barr virus.", "questionPages": [225], "solutionPages": [235, 236], "questionFigures": [], "solutionFigures": ["crop-solution-ch14-q19-1"]}, {"id": "ch14-q20", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 20, "text": "A young man presented with bloody diarrhoea, abdominal pain, and fever. Lab investigations\nshowed leucocytosis and stool microscopy revealed RBCs and leucocytes. Darkfield\nmicroscopy showed a bacteria having darting motility. Which of the following is a selective\nculture medium for this organism?", "options": [{"id": "A", "text": "Skirrow’s media"}, {"id": "B", "text": "PLET medium"}, {"id": "C", "text": "BSK medium"}, {"id": "D", "text": "BCYE medium"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given clinical scenario of fever, bloody diarrhea, abdominal pain and leucocytosis alongwith\nmicroscopy findings of RBCs and WBCs in fecal smear, and organism having darting motility are\nsuggestive of infection with Campylobacter jejuni. The selective culture medium used for\nCampylobacter is Skirrow’s media.\nOther selective media for Campylobacter include:\n+ Butzler's medium\n+ Campy-BAP media\nThe transport medium used for Campylobacter is the Cary-Blair medium.", "questionPages": [225, 226], "solutionPages": [236], "questionFigures": [], "solutionFigures": []}, {"id": "ch14-q21", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 21, "text": "Identify the organism & the stain seen in the image given below.", "options": [{"id": "A", "text": "Campylobacter jejuni; Gimenez stain"}, {"id": "B", "text": "Helicobacter pylori; modified Giemsa stain"}, {"id": "C", "text": "Treponema pallidum; Levaditi stain"}, {"id": "D", "text": "Helicobacter pylori; Warthin-Starry stain"}], "correctIndex": 3, "correctLetter": "D", "solution": "The given image shows Helicobacter pylori stained using Warthin-Starry stain.\nH.pylori is a Gram-negative spiral rod that is motile by a unipolar tuft of\nlophotrichous flagella. The bacteria are present only in the mucus overlying the gastric\nmucosa and do not actually invade into the mucosa.\nThe given image shows Helicobacter pylori on gastric mucosa stained with Warthin-Starry silver\nstain.", "questionPages": [226], "solutionPages": [236], "questionFigures": ["crop-question-ch14-q21-1"], "solutionFigures": ["crop-solution-ch14-q21-1"]}, {"id": "ch14-q22", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 22, "text": "Which of the following organisms produce urease?", "options": [{"id": "A", "text": "Helicobacter pylori"}, {"id": "B", "text": "Salmonella"}, {"id": "C", "text": "Escherichia coli"}, {"id": "D", "text": "Shigella"}], "correctIndex": 0, "correctLetter": "A", "solution": "Helicobacter pylori produces urease.\nUrease-producing organisms: (Mnemonic-PUNCH)\n¢ Proteus\n\n\n\n* Ureaplasma urealyticum\n* Nocardia\n* Cryptococcus, Corynebacterium urealyticum\n°H. pylori", "questionPages": [226], "solutionPages": [236, 237], "questionFigures": [], "solutionFigures": []}, {"id": "ch14-q23", "chapterId": 14, "chapter": "Vibrio and Campylobacterales", "number": 23, "text": "You are a surgery resident evaluating a 45-year-old female patient with complaints of burning\nabdominal pain for the past 2 months that is relieved on taking food. You determine the\ndisease to have a bacterial etiology. Which of the following is the most sensitive test to detect\nthe causative organism here?", "options": [{"id": "A", "text": "Culture"}, {"id": "B", "text": "Serology"}, {"id": "C", "text": "Urea breath test"}, {"id": "D", "text": "Histology"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given case scenario is suggestive of a duodenal ulcer caused by Helicobacter pylori. The urea\nbreath test is the most sensitive test for the diagnosis of Helicobacter pylori infection.\nTo perform this test, the patient drinks a urea solution labelled with radioactive carbon-14. The\npatient then blows into a tube. If H. pylori urease is present, the urea is hydrolyzed, and labelled\ncarbon dioxide is detected in breath samples. The sensitivity of the urea breath test is >90%.", "questionPages": [226, 227, 228], "solutionPages": [237], "questionFigures": [], "solutionFigures": []}, {"id": "ch15-q1", "chapterId": 15, "chapter": "Pseudomonas and Burkholderiales", "number": 1, "text": "A 20 year old male presents with acute onset cough and thick sticky sputum. There is a\nhistory of repeated lung infections since childhood. Chest Xray shows evidence of bilateral\nupper lobe bronchiectasis. On evaluation, the chloride concentration in his sweat is >60\nmEq/L. What is the organism majorly associated with this patient's respiratory disease?", "options": [{"id": "A", "text": "Burkholderia pseudomallei"}, {"id": "B", "text": "Pseudomonas putida"}, {"id": "C", "text": "Pseudomonas aeruginosa"}, {"id": "D", "text": "Burkholderia cepacia"}], "correctIndex": 2, "correctLetter": "C", "solution": "Bilateral upper lobe bronchiectasis with a history of repeated lung infections since childhood and\nevelated sweat chloride concentration suggests a diagnosis of cystic fibrosis (CF). Pseudomonas\naeruginosa is a common etiological agent associated with chronic airway infection in patients\nwith cystic fibrosis (CF).\n\n\n\nIn cystic fibrosis, there is thick inspissated mucus and impaired mucociliary clearance. Due to\nthese factors, lungs are often colonized in infancy and early childhood with Staphylococcus aureus\nand Haemophilus influenzae. In adulthood, they are replaced by P. aeruginosa. This results in\nchronic inflammation, which leads to airway modelling and bronchiectasis.\nNote: Burkholderia cepacia complex is an opportunistic environmental pathogen. It causes fatal\nrespiratory distress and septicemia in CF patients. This is termed as 'cepacia syndrome’.", "questionPages": [238], "solutionPages": [243], "questionFigures": [], "solutionFigures": []}, {"id": "ch15-q2", "chapterId": 15, "chapter": "Pseudomonas and Burkholderiales", "number": 2, "text": "Which of the following organisms causes scombroid fish poisoning?", "options": [{"id": "A", "text": "Salmonella"}, {"id": "B", "text": "Staphylococcus"}, {"id": "C", "text": "Pseudomonas aeruginosa"}, {"id": "D", "text": "Peptostreptococcus"}], "correctIndex": 2, "correctLetter": "C", "solution": "Scombroid fish poisoning is associated with Pseudomonas aeruginosa.\nIt follows the consumption of both scombroid (mackerel-like) fish and nonscombroid fish that\nhave not been refrigerated properly. The musculature of these dark- or red-fleshed fish undergoes\ndecomposition by Morganella morganii, Escherichia coli, Proteus species, Klebsiella species, and\nPseudomonas aeruginosa. There is consequent decarboxylation of the amino acid L-histidine to\nform histamine.\nA second compound is thought to play a causative role in this intoxication because large doses of\noral histamine do not reproduce the affliction. The toxin or toxins involved are heat stable and are\nnot destroyed by cooking or freezing.\nSymptoms develop within 15-90 min of ingestion. Most cases are mild, with tingling of lips and\nmouth, mild abdominal discomfort, and nausea. The more severe and commonly described\npresentation includes flushing, conjunctival hyperemia, pruritus, urticaria, and\nangioedema. Without treatment, the symptoms generally resolve within 8-12 h.", "questionPages": [238], "solutionPages": [243], "questionFigures": [], "solutionFigures": []}, {"id": "ch15-q3", "chapterId": 15, "chapter": "Pseudomonas and Burkholderiales", "number": 3, "text": "A patient comes to the dermatology OPD complaining of greenish discoloration of her nails.\nYou diagnose her with green nail syndrome. Production of which of the following helps\ndifferentiate the organism implicated here from other members of its genus?", "options": [{"id": "A", "text": "Pyocyanin"}, {"id": "B", "text": "Pyoverdin"}, {"id": "C", "text": "Pyorubin"}, {"id": "D", "text": "Pyomelanin"}], "correctIndex": 0, "correctLetter": "A", "solution": "Green nail syndrome is caused by Pseudomonas aeruginosa. Production of pyocyanin helps\ndifferentiate it implicated here from other Pseudomonas species.\nPseudomonas aeruginosa is the only member of the Pseudomonas species that produces\npyocyanin which is a bluish-green pigment. Other species of Pseudomonas also produce pigments\nbut they cannot produce pyocyanin. Some of the other pigments produced by Pseudomonas\nspecies including P. aeruginosa are pyoverdin/flourescein (greenish-yellow pigment), pyorubin\n(red pigment) and pyomelanin (brown pigment).", "questionPages": [238], "solutionPages": [243], "questionFigures": [], "solutionFigures": []}, {"id": "ch15-q4", "chapterId": 15, "chapter": "Pseudomonas and Burkholderiales", "number": 4, "text": "The mechanism of action of exotoxin A of Pseudomonas resembles that of :", "options": [{"id": "A", "text": "Cholera toxin"}, {"id": "B", "text": "Diphtheria toxin"}, {"id": "C", "text": "Tetanus toxin"}, {"id": "D", "text": "Anthrax toxin"}], "correctIndex": 1, "correctLetter": "B", "solution": "The action of exotoxin A of Pseudomonas aeruginosa is similar to that of the diphtheria toxin.\nBoth exotoxin A and diphtheria toxin cause ADP ribosylation of EF-2 and inhibit protein\nsynthesis. Exotoxin A is a single-chain polypeptide with A and B fragments. The B fragment binds\nthe toxin while the A fragment inactivates EF-2 in the presence of nicotinamide adenine\ndinucleotide (NAD). This leads to the inhibition of polypeptide chain elongation and thus, protein\n\n\n\nsynthesis.", "questionPages": [238, 239], "solutionPages": [243, 244], "questionFigures": [], "solutionFigures": ["crop-solution-ch15-q4-1"]}, {"id": "ch15-q5", "chapterId": 15, "chapter": "Pseudomonas and Burkholderiales", "number": 5, "text": "A patient with acute onset fever, cough and hemoptysis is diagnosed to have Whitmore's\ndisease. Which of the following organisms causes this condition?", "options": [{"id": "A", "text": "Burkholderia pseudomallei"}, {"id": "B", "text": "Burkholderia mallei"}, {"id": "C", "text": "Burkholderia cepacia"}, {"id": "D", "text": "Paraburkholderia species"}], "correctIndex": 0, "correctLetter": "A", "solution": "Burkholderia pseudomallei causes Whitmore's disease.\nMelioidosis was first described by Whitmore and Krishnaswami. Whitmore isolated the bacillus,\nand hence, it is known as Whitmore bacillus and melioidosis is called Whitmore's disease.\nMelioidosis is similar in presentation to glanders disease (caused by Burkholderia mallei).\nHumans are infected tby contact with contaminated soil via skin abrasions.\nTypes of melioidosis:\n+ Acute - It causes acute pneumonia with upper lobe infiltrates or severe necrotizing disease. It\ncan also mimic tuberculosis with fever, cough, hemoptysis. It may lead to septicemia.\n* Chronic - It can lead to the development of multiple caseous or suppurative foci, with skin and\nsubcutaneous abscesses. These can lead to lymphangitis and lymphadenopathy. It may involve\nbones and other internal organs.\nThe bacillus has a safety-pin appearance on methylene blue staining. Treatment is divided into\ntwo stages: an intensive 2 week phase of ceftazidime or a carbapenem followed by at least 12\nweeks of oral cotrimoxazole to eradicate the organism and prevent relapse.", "questionPages": [239], "solutionPages": [244], "questionFigures": [], "solutionFigures": []}, {"id": "ch15-q6", "chapterId": 15, "chapter": "Pseudomonas and Burkholderiales", "number": 6, "text": "A horse-groomer was diagnosed with ulcerative tracheobronchitis. Upon enquiry, it was\ndiscovered that one of his horses had recently died of pneumonia after developing a fever and\nsubcutaneous nodules. Which of the following statements is false about the likely causative\nagent?", "options": [{"id": "A", "text": "It is non-motile."}, {"id": "B", "text": "It is always oxidase negative"}, {"id": "C", "text": "It is the causative agent for Glanders disease."}, {"id": "D", "text": "It induces Strauss reaction on inoculation into guinea pigs."}], "correctIndex": 1, "correctLetter": "B", "solution": "The development of ulcerative tracheobronchitis after contact with an infected horse is suggestive\nof glanders which is caused by Burkholderia mallei. It is an oxidase variable organism.\nIn this case, the horse likely had glanders, which presents with fever, pneumonia, and\nsubcutaneous nodules called Farcy buds. Discharges from the respiratory tract and skin are highly\ninfectious and can be transmitted to humans through close contact (occupational route). The\n\n\n\nhorse-groomer likely contracted the infection by the inhalational route and developed acute\nglanders, which is characterised by fever, mucopurulent nasal discharge and ulcerative necrosis of\nupper respiratory tract (ulcerative tracheobronchitis). It may lead to septicemia and has a high\nfatality rate. Percutaneous exposure causes local suppurative skin lesions with associated regional\nlymphadenopathy.\nB. mallei is a non-motile Gram-negative bacillus causing Glanders disease. It is an aerobe and a\nfacultative anaerobe. It is oxidase variable i.e. it is usually oxidase negative but may occasionally\nshow a positive reaction. It is a biosafety level 3 pathogen and so must be handled only in\nspecialised laboratories. When male guinea pigs are inoculated intraperitoneally with suspected\ninfectious material, it causes Strauss reaction. B. mallei sets up a necrotizing inflammation in the\nscrotal sac within a few days and can be confirmed bacteriologically.", "questionPages": [239], "solutionPages": [244, 245], "questionFigures": [], "solutionFigures": []}, {"id": "ch15-q7", "chapterId": 15, "chapter": "Pseudomonas and Burkholderiales", "number": 7, "text": "Which of the following is Burkholderia cepacia resistant to?", "options": [{"id": "A", "text": "Ceftazidime"}, {"id": "B", "text": "Trimethoprim-sulfamethoxazole"}, {"id": "C", "text": "Temocillin"}, {"id": "D", "text": "Cefotetan"}], "correctIndex": 3, "correctLetter": "D", "solution": "Burkholderia cepacia is resistant to cefotetan.\nB. cepacia complex strains are intrinsically resistant to aminoglycosides, polymixin, first and\nsecond-generation cephalosporins (e.g. cefotetan) and carboxypenicillins. This antimicrobial\nresistance is mediated by efflux pumps, antimicrobial degradation, modifying enzymes or altered\nmembrane functions.\nB. cepacia is a Gram-negative bacillus which can cause severe necrotizing pneumonia in patients\nwith chronic granulomatous disease. It can lead to fatal septicemia in patients with cystic fibrosis.\nAntimicrobial agents that are effective against B. cepacia complex include meropenem,\nceftazidime, trimethoprim-sulfamethoxazole, piperacillin and temocillin.", "questionPages": [239, 240], "solutionPages": [245], "questionFigures": [], "solutionFigures": []}, {"id": "ch15-q8", "chapterId": 15, "chapter": "Pseudomonas and Burkholderiales", "number": 8, "text": "An organism cultured in Bordet-Gengou medium shows smooth, refractile, glistening\ncolonies resembling ‘bisected pearls’ or 'mercury drops'. The organism is most likely .", "options": [{"id": "A", "text": "Bordetella parapertussis"}, {"id": "B", "text": "Bordetella bronchiseptica"}, {"id": "C", "text": "Bordetella pertussis"}, {"id": "D", "text": "Bordetella petrii"}], "correctIndex": 2, "correctLetter": "C", "solution": "The organism showing colonies resembling ‘bisected pearls' or 'mercury drops' on Bordet-Gengou\nmedium most likely is Bordetella pertussis.\nBordetella pertussis is a Gram-negative coccobacillus. It causes whooping cough or pertussis in\nchildren.\nIt can be isolated on the enriched medium Bordet-Genou medium (potato-blood-glycerol agar).\nAfter incubation for 48 to 72 hours, B. pertussis colonies are small, dome-shaped, smooth,\nopaque, viscid, greyish white, refractile, and glistening resembling ‘bisected pearls’ or ‘mercury\ndrops' and are surrounded by a hazy zone of hemolysis. If growth is confluent, an ‘aluminium\npaint’ appearance is seen. In culture films, Bordetella pertussis bacilli tend to be arranged in loose\nclumps, with clear spaces in between, giving a ‘thumbprint’ appearance.\nB. parapertussis (option A) grows on nutrient agar with the production of a brown, diffusible\npigment after two days. It also grows more rapidly than B.pertussis on charcoal blood agar.", "questionPages": [240], "solutionPages": [245, 246], "questionFigures": [], "solutionFigures": ["crop-solution-ch15-q8-1"]}, {"id": "ch15-q9", "chapterId": 15, "chapter": "Pseudomonas and Burkholderiales", "number": 9, "text": "An 8-year-old boy with incomplete vaccination history comes with vomiting after bouts of\nsevere, violent cough. What is the mechanism of action of the toxin responsible for this child's\ndisease?", "options": [{"id": "A", "text": "Activation of phospholipase and degrades cell membrane"}, {"id": "B", "text": "Inactivation of 60S ribosome"}, {"id": "C", "text": "ADP ribosylation and lymphocytosis"}, {"id": "D", "text": "Activation of guanylate cyclase"}], "correctIndex": 2, "correctLetter": "C", "solution": "Post-tussive vomiting and bouts of cough in an unimmunized child points to a diagnosis of\npertussis, caused by Bordetella pertussis. It secretes pertussis toxin (PT), which acts by ADP\nribosylation and disrupts signal transduction of many cell types. This promotes lymphocytosis.\nThe pertussis toxin disrupts protein synthesis and causes necrosis of parts of the epithelium,\nleading to pseudomembrane formation. Pertussis toxin also promotes sensitization to histamine\nand enhances insulin secretion but these effects have not been demonstrable in patients. They are\nonly seen in experimental animals.\nB. pertussis also produces other toxins like:\n+ Adenylate cyclase toxin (ACT)- It acts by catalysing the production of cAMP by various types of\ncells and inhibiting phagocytosis.\n+ Heat labile toxin (HLT)- It is a cytoplasmic protein present in all bordetellae. It is dermonecrotic\nand lethal in mice. Its pathogenic role is not known.\n+ Tracheal cytotoxin (TCT)- It is low molecular weight peptidoglycan which induces ciliary damage\nin hamster trachea.", "questionPages": [240], "solutionPages": [246], "questionFigures": [], "solutionFigures": []}, {"id": "ch15-q10", "chapterId": 15, "chapter": "Pseudomonas and Burkholderiales", "number": 10, "text": "Which of the following statements is false about pertussis toxin?", "options": [{"id": "A", "text": "It is expressed on the surface of the bacillus."}, {"id": "B", "text": "It cannot be toxoided."}, {"id": "C", "text": "\"A\" portion of A-B structure is the enzymatically active moiety."}, {"id": "D", "text": "It is similar to cholera toxin in its structure and function."}], "correctIndex": 1, "correctLetter": "B", "solution": "Pertussis toxin (PT) can be toxoided.\nPT is one of the toxins produced by Bordetella pertussis. It is expressed on the surface of the\nbacillus and secreted into the surrounding medium. It has an A-B structure, the A portion being\nthe enzymatically active moiety and B, the binding component. PT is similar to cholera toxin in its\nstructure and function. PT has ADP-ribosylating activity and acts on inhibitory Gi° subunit of\nG-protein coupled receptor (GPCR), whereas cholera toxin acts on stimulatory Gs ° subunit of\n\n\n\nGPCR.\nPertussis toxoid is the major component of the acellular pertussis vaccine. A toxoid is a toxin that\nhas lost its toxicity but retains its antigenicity.", "questionPages": [240], "solutionPages": [246, 247], "questionFigures": [], "solutionFigures": []}, {"id": "ch15-q11", "chapterId": 15, "chapter": "Pseudomonas and Burkholderiales", "number": 11, "text": "A 4-year-old unimmunized child presents with whooping cough. Which of the following\nconstituents of the causative organism is responsible for facilitating its adhesion to the\nrespiratory epithelium?", "options": [{"id": "A", "text": "Adenylate cyclase"}, {"id": "B", "text": "Lipopolysaccharide"}, {"id": "C", "text": "Tracheal cytotoxin"}, {"id": "D", "text": "Filamentous hemagglutinin"}], "correctIndex": 3, "correctLetter": "D", "solution": "Whooping cough is caused by Bordetella pertussis. Filamentous hemagglutinin (FHA) is\nresponsible for facilitating the adhesion of Bordetella pertussis to the respiratory epithelium.\nBordetella pertussis produces 3 hemagglutinins: Pertussis toxin (PT), lipid factor and FHA. FHA is\na surface protein and is readily shed. Along with fimbrae, it helps in the adhesion of B. pertussis\nto the cilia of the respiratory epithelium and to erythrocytes. FHA and PT also promote secondary\ninfection by coating other bacteria such as Haemophilus influenzae and Pneumococci. They then\nassists their binding to respiratory epithelium. This phenomenon has been termed ‘piracy of\nadhesins'.", "questionPages": [240, 241], "solutionPages": [247], "questionFigures": [], "solutionFigures": []}, {"id": "ch15-q12", "chapterId": 15, "chapter": "Pseudomonas and Burkholderiales", "number": 12, "text": "What is the incubation period of pertussis in humans?", "options": [{"id": "A", "text": "<7 days"}, {"id": "B", "text": "3-5 days"}, {"id": "C", "text": "21-30 days"}, {"id": "D", "text": "7-14 days"}], "correctIndex": 3, "correctLetter": "D", "solution": "The incubation period of pertussis in humans is 7-14 days.\nPertussis is caused by Bordetella pertussis. After the incubation period, the disease takes a\nprotracted course comprising three stages:\n* Catarrhal: It lasts 1-2 weeks and is characterized by coryza, lacrimation, mild cough, low-grade\nfever, and malaise.\n+ Paroxysmal: It lasts 2-4 weeks with the cough becoming more frequent and spasmodic. The\ncough comes in repetitive bursts of 5-10 in number, often within a single expiration.\nPost-tussive vomiting is frequent. The episode may be terminated by an audible whoop, which\noccurs upon rapid inspiration against a closed glottis at the end of a paroxysm.\n* Convalescent: It lasts 1-3 months and is characterized by gradual resolution of coughing\nepisodes.\nWhooping cough is also known as '100-day cough’. For 6-12 months following the illness,\nintercurrent viral infections may be associated with a recrudescence of paroxysmal cough.", "questionPages": [241], "solutionPages": [247], "questionFigures": [], "solutionFigures": []}, {"id": "ch15-q13", "chapterId": 15, "chapter": "Pseudomonas and Burkholderiales", "number": 13, "text": "You are evaluating a 6-year-old unimmunised girl with cough and abdominal pain. Her\nmother informs you that her daughter has bouts of violent coughing which frequently ends\nwith a loud whoop and is accompanied by vomiting. She gives history of similar complaints in\na classmate 2-3 weeks back. Which of the following drugs will you prescribe for this patient?", "options": [{"id": "A", "text": "Erythromycin"}, {"id": "B", "text": "Penicillin"}, {"id": "C", "text": "Ciprofloxacin"}, {"id": "D", "text": "Cotrimoxazole"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given case scenario of whooping cough, post-tussive vomiting, and abdominal pain, along\nwith positive history of exposure in an unimmunised child is suggestive of pertussis.\nErythromycin or one of the newer macrolides such as azithromycin or clarithromycin is the drug\nof choice for the treatment of this condition.\nAntibiotic therapy in pertussis is used to eradicate the bacteria from the nasopharynx. The\ntreatment is beneficial if it is started within 10 days of the disease. Macrolides are the drugs of\n\n\n\nchoice. Trimethoprim-sulfamethoxazole (Cotrimoxazole) is recommended as an alternative for\nindividuals allergic to macrolides. Macrolides may also be used in the chemoprophylaxis of\npertussis. Post-exposure prophylaxis is given to household close contacts, and high-risk contacts\n(infants, immunocompromised, pregnancy).", "questionPages": [241], "solutionPages": [247, 248], "questionFigures": [], "solutionFigures": []}, {"id": "ch15-q14", "chapterId": 15, "chapter": "Pseudomonas and Burkholderiales", "number": 14, "text": "A young child with unknown immunization history is suspected to have whooping cough.\nWhich of the following methods will you prefer to use to collect a specimen for culture?", "options": [{"id": "A", "text": "Cough plate method"}, {"id": "B", "text": "Per-oral swab"}, {"id": "C", "text": "Per-nasal swab"}, {"id": "D", "text": "Post-nasal swab"}], "correctIndex": 2, "correctLetter": "C", "solution": "Whooping cough is caused by Bordotella pertussis. The most effective method for collecting a\nspecimen for the culture of this organism is the per-nasal or nasopharyngeal swab method.\nRespiratory specimens may be collected for the culture (gold standard) of Bordetella pertussis by\nthree different methods:\n+ Per-nasal swab: A Dacron or rayon tipped swab on a flexible nichrome wire is passed along the\nfloor of the nasal cavity and material is collected from the pharyngeal wall. This specimen is\nthe most effective and best suited for diagnostic procedures.\n* Cough plate method: A culture plate is held about 10 to 15 cms in front of the patient's mouth\nduring a bout of cough.\n+ Post-nasal (peroral) method: Secretions from the posterior pharyngeal wall are collected with a\ncotton swab on a bent wire passed through the mouth.\nOther diagnostic tests for pertussis include direct fluorescent aantibody test and PCR on\nnasopharyngeal specimens. Enzyme immunoassays of antibodies after exposure to B. pertussis\ncan also be used for patients between 2-4 weeks of illness.", "questionPages": [241], "solutionPages": [248], "questionFigures": [], "solutionFigures": []}, {"id": "ch15-q15", "chapterId": 15, "chapter": "Pseudomonas and Burkholderiales", "number": 15, "text": "A pregnant woman comes to the ANC clinic for her 2nd dose of the Tdap vaccine. Which of\nthe following constitutes the acellular component of this vaccine?", "options": [{"id": "A", "text": "Pertactin, filamentous hemaglutinin, and cytotoxin"}, {"id": "B", "text": "Endotoxin, fimbriae, and pili"}, {"id": "C", "text": "Pertussis toxoid, cytotoxin, and pili"}, {"id": "D", "text": "Pertussis toxoid, filamentous hemaglutinin, and fimbrial protein"}], "correctIndex": 3, "correctLetter": "D", "solution": "Tdap vaccine is the tetanus, diphtheria and acellular pertussis vaccine. The component of the\nacellular pertussis vaccine is inactivated pertussis toxin (PT) and it may contain one or more\nbacterial components such as pertactin, filamentous hemagglutinin, and fimbrial protein.\nPertussis vaccine is usually administered in combination with the toxoids of diphtheria and\ntetanus (DTaP). Five doses of pertussis vaccine are recommended - at 2, 4, 6 and 15-18 months of\nage followed by a booster dose at 4-6 years of age.\nTdap is now also recommended for pregnant women in between 27 weeks and 36 weeks of\ngestation by the ACOG. This is because infants between the age of 0-2 months are vulnerable to\npertussis as they do not begin their vaccine schedule before 6 weeks of age. Thus to protect these\ninfants, placental transfer of maternal pertussis antibodies has proven to be the most effective\napproach. Children under 4 years who are contacts of patients should receive a booster even if\nthey had been previously immunized. Non-immunized contacts should receive full series of\nvaccination and also chemoprophylaxis with erythromycin for 10 days after contact with the\npatient has ceased.", "questionPages": [241, 242], "solutionPages": [248], "questionFigures": [], "solutionFigures": []}, {"id": "ch16-q1", "chapterId": 16, "chapter": "Haemophilus", "number": 1, "text": "A woman presents with fever with chills and a productive cough. Chest X-ray is suggestive of\nlobar pneumonia. She had undergone splenectomy 2 years back. Sputum culture on blood\nagar shows the following. What is the causative agent?", "options": [{"id": "A", "text": "Hemophilus influenzae"}, {"id": "B", "text": "Klebsiella granulomatis"}, {"id": "C", "text": "Streptococcus pneumoniae"}, {"id": "D", "text": "Neisseria meningitidis"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given scenario of bacterial pneumonia in a splenectomised individual along with the image\nshowing satellitism on blood agar points towards an infection due to Hemophilus influenzae.\nPneumonia can occur as a part of overwhelming post-splenectomy infection (OPSI). This is a fatal\npost-splenectomy complication occuring due to infections with encapsulated organisms such as S.\npneumoniae, H. influenzae, and N. meningitidis. It can be prevented by vaccinating against these\norganisms within 2 weeks of undergoing splenectomy.\nSatellitism is seen when S. aureus is streaked across a plate of blood agar on which H. influenzae\nhas been inoculated. After overnight incubation, the colonies of H. influenzae will be large and\nwell developed alongside the streak of Staphylococcus and smaller when they are farther away\nfrom the streak. This is due to the release of factor V by lysis of RBCs mediated by S. aureus.\nFactor V is required for the growth of H. influenzae.\nThe given image shows satellitism on blood agar", "questionPages": [249], "solutionPages": [255], "questionFigures": ["crop-question-ch16-q1-1"], "solutionFigures": ["crop-solution-ch16-q1-1"]}, {"id": "ch16-q2", "chapterId": 16, "chapter": "Haemophilus", "number": 2, "text": "A patient presented with fever, seizures, and altered sensorium. Gram stain of the CSF is\ngiven below. Satellitism was seen on blood agar. Which of the following statements is false\nabout this disease?", "options": [{"id": "A", "text": "This is the most serious disease produced by this organism."}, {"id": "B", "text": "The disease is more common in young adults."}, {"id": "C", "text": "The bacilli reach the meninges from the nasopharynx through the bloodstream."}, {"id": "D", "text": "Cefotaxime is the drug of choice"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given scenario and the image showing gram-negative coccobacilli in the CSF are suggestive of\nhemophilus meningitis caused by H.influenzae. Hemophilus meningitis is more common in\nchildren between 3 months and 3 years of age and not common in young adults.\nOther options:\nOption A: Meningitis is the most serious disease caused by H. influenzae. The case fatality rate is\n90% if untreated.\nOption C: H. influenze is transmitted via respiratory droplets. Thus, it is introduced into the\nnasopharynx of the contacts of an infected individual. It has to enter the bloodstream to reach the\nmeninges.\nOption D: Cefotaxime or ceftazidime are the drugs of choice for the treatment of hemophilus\nmeningitis.", "questionPages": [249, 250], "solutionPages": [255], "questionFigures": ["crop-question-ch16-q2-1"], "solutionFigures": []}, {"id": "ch16-q3", "chapterId": 16, "chapter": "Haemophilus", "number": 3, "text": "Which of the following is not caused by non-typable H. influenzae?", "options": [{"id": "A", "text": "Meningitis"}, {"id": "B", "text": "Otitis media"}, {"id": "C", "text": "Sinusitis"}, {"id": "D", "text": "Puerperal sepsis"}], "correctIndex": 0, "correctLetter": "A", "solution": "Meningitis is caused by typable H. influenzae.\nNon-typable H. influenzae cause:\n* Otitis media\n+ Sinusitis\n+ Puerperal sepsis\n+ Exacerbations of COPD.\n\n\n\nH. influenzae is typed into 6 serotypes (a to f) based on the capsular polysaccharide.\nSerotype b (Hib) is the most virulent and accounts for most of the invasive infections.\nThe differences between type b strains and non-typable strains of H. influenzae are given in the\ntable below:", "questionPages": [250], "solutionPages": [255, 256], "questionFigures": [], "solutionFigures": ["crop-solution-ch16-q3-1"]}, {"id": "ch16-q4", "chapterId": 16, "chapter": "Haemophilus", "number": 4, "text": "All of the following Hemophilus species require both Factors X and V except .", "options": [{"id": "A", "text": "H. hemolyticus"}, {"id": "B", "text": "H. influenzae"}, {"id": "C", "text": "H. parahemolyticus"}, {"id": "D", "text": "H. aegypticus"}], "correctIndex": 2, "correctLetter": "C", "solution": "Hemophilus parahemolyticus requires only factor V for its growth. It does not require factors X.\nHemophilus species requiring both factors X and V: (Mnemonic to remember: HAI)\n+H. hemolyticus\n+ H. aegypticus\n+H. influenzae\nFactor V- It refers to the co-enzyme, NAD. It is heat-labile (destroyed at 120°C in a few minutes)\nand present inside RBC.\nFactor X- It refers to Hemin. It is heat stable and is present in the blood.", "questionPages": [250, 251], "solutionPages": [256, 257], "questionFigures": [], "solutionFigures": ["crop-solution-ch16-q4-1"]}, {"id": "ch16-q5", "chapterId": 16, "chapter": "Haemophilus", "number": 5, "text": "A 7-year-old girl presents to the emergency with acute stridor. The mother gives a history of\nfever, drooling, and breathing difficulty since that morning. An X-ray of her neck appears as\ngiven below. What is the most likely causative agent?", "options": [{"id": "A", "text": "Hemophilus parainfluenzae"}, {"id": "B", "text": "Streptococcus pneumoniae"}, {"id": "C", "text": "Hemophilus influenzae"}, {"id": "D", "text": "Parainfluenza virus"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given clinical vignette and ‘thumb sign’ on the X-ray are suggestive of acute epiglottitis caused\nby Hemophilus influenzae.\nIt is an acute inflammation of the epiglottis causing obstructive laryngitis and presents with high\nfever, severe sore throat, tachycardia, systemic toxicity, and drooling as patients are unable to\nswallow. The patient characteristically leans forward while sitting for ease of breathing.\nThe diagnosis often is made on clinical grounds. On direct fiberoptic laryngoscopy, the typical\nedematous cherry-red epiglottis is visualized. Neck radiographs reveal an enlarged edematous\nepiglottis (Thumb sign). The below image shows the Thumb sign.\nIn some countries, widespread vaccination against Hib has drastically decreased acute epiglottitis\ncases in children by over 90%. However, the incidence in adults has remained largely unchanged\nsince the Hib vaccine was introduced. Despite vaccination efforts, many pediatric cases of\nepiglottitis today are still caused by Hib due to either lack of vaccination or vaccine\nineffectiveness. In adults and increasingly in children, other bacterial pathogens, particularly\ngroup A Streptococcus, have been linked to cases of epiglottitis.\nTreatment includes airway management followed by administration of antibiotics like\nampicillin/sulbactam, cefotaxime, or ceftriaxone.", "questionPages": [251], "solutionPages": [257], "questionFigures": ["crop-question-ch16-q5-1"], "solutionFigures": ["crop-solution-ch16-q5-1"]}, {"id": "ch16-q6", "chapterId": 16, "chapter": "Haemophilus", "number": 6, "text": "Pneumonia due to a gram-negative pleomorphic bacillus growing on chocolate agar which is\ncatalase and oxidase-positive is:", "options": [{"id": "A", "text": "E.coli"}, {"id": "B", "text": "Pseudomonas"}, {"id": "C", "text": "Haemophilus influenzae"}, {"id": "D", "text": "Actinomyces"}], "correctIndex": 2, "correctLetter": "C", "solution": "Pneumonia due to a gram-negative pleomorphic bacillus growing on chocolate agar which is\ncatalase and oxidase-positive is most likely Haemophilus influenza.\nHaemophilus pneumonia typically occurs in infants and is accompanied by empyema and\nsometimes meningitis as well. In older children and adults, the picture is of lobar\npneumonia. Sputum is collected for the detection and isolation of Hemophilus. As the bacillus is\nvery sensitive to low temperatures, specimens should never be refrigerated before inoculation.\nH.infiuenzae is a Gram-negative, non-motile, non-sporing bacillus, exhibiting considerable\n\n\n\npleomorphism. In sputum, it usually occurs as clusters of coccobacillary forms.\nThe bacillus has fastidious growth requirements. The accessory growth factors, named X and V,\npresent in the blood are essential for growth. Catalase and\noxidase reactions are positive. Nitrates are reduced to nitrites. Biotyping has been done on the\nbasis of indole production.\nCultures may be preserved for about a month on chocolate agar slopes. Chocolate agar is made by\nheating blood agar to 80-90°C for 15-20 minutes. This causes the release of V factor from within\nthe erythrocytes.\nTreatment- Amoxycillin-clavulanate or clarithromycin is more effective in treating respiratory\ninfections by Haemophilus influenzae.", "questionPages": [251], "solutionPages": [257, 258], "questionFigures": [], "solutionFigures": []}, {"id": "ch16-q7", "chapterId": 16, "chapter": "Haemophilus", "number": 7, "text": "A middle-aged man who is a known case of diabetes and chronic bronchitis presents to the\nOPD with low-grade fever and productive cough for 5 days. Which of the following is not a\n\n\n\nvirulence factor of the likely causative organism?", "options": [{"id": "A", "text": "Outer membrane protein (OMP)"}, {"id": "B", "text": "Lipooligosaccharide (LOS)"}, {"id": "C", "text": "Capsular polysaccharide"}, {"id": "D", "text": "Pili"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given clinical scenario describes an acute exacerbation of COPD characterized by low-grade\nfever, increased cough, sputum production, and shortness of breath. The most common cause of\nthese are non-typable H. influenzae which lack a capsule and so capsular antigen cannot be a\nvirulence factor.\nAll H. influenzae have the following virulence factors:\n* Outer membrane proteins (OMP)\n+ Lipooligosaccharide(LOS)\n+ Pili\nIn addition to the above factors, H. influenzae type b also has its capsular polysaccharide as a\nvirulence factor.\nThe differences between Hib and non-typable strains are given below:", "questionPages": [251, 252], "solutionPages": [258], "questionFigures": [], "solutionFigures": ["crop-solution-ch16-q7-1"]}, {"id": "ch16-q8", "chapterId": 16, "chapter": "Haemophilus", "number": 8, "text": "Which of the following bacteria does not belong to the HACEK group?", "options": [{"id": "A", "text": "Haemophilus parainfluenza"}, {"id": "B", "text": "Aggregatibacter actinomycetemcomitans"}, {"id": "C", "text": "Escherichia coli"}, {"id": "D", "text": "Kingella kingae"}], "correctIndex": 2, "correctLetter": "C", "solution": "Escherichia coli does not belong to the HACEK group.\nThe acronym HACEK refers to a group of fastidious slow-growing bacteria, normally residing in\nthe mouth. These can sometimes cause severe infections, particularly culture-negative subacute\nbacterial endocarditis.\nThe group includes:\n* Haemophilus species (H. parainfluenzae, H. aphrophilus, H. paraphrophilus)\n+ Aggregatibacter actinomycetemcomitans (previously called as Actinobacillus)\n* Cardiobacterium hominis\n+ Eikenella corrodens\n+ Kingella kingae", "questionPages": [252], "solutionPages": [258, 259], "questionFigures": [], "solutionFigures": []}, {"id": "ch16-q9", "chapterId": 16, "chapter": "Haemophilus", "number": 9, "text": "A 26-year-old man presented with painful, bleeding genital ulcers. On examination, tender\ninguinal lymphadenopathy is present. Scraping from the ulcer base was taken and the\nmicroscopic appearance of the Gram-stained smear is shown below. What is the causative\norganism?", "options": [{"id": "A", "text": "Haemophilus ducreyi"}, {"id": "B", "text": "Treponema pallidum"}, {"id": "C", "text": "Chlamydia trachomatis serovar L1"}, {"id": "D", "text": "Chlamydia trachomatis serovar L2"}], "correctIndex": 0, "correctLetter": "A", "solution": "The image shows the' school of fish' or 'railroad track' appearance of Haemophilus ducreyi. This\nappearance is seen when the bacilli are arranged in small groups, whorls or in chains. The given\ncase scenario is suggestive of chancroid.\nChancroid is characterized by non-indurated, tender, irregular ulcers that may bleed on touch.\nThe neighbouring lymph nodes are enlarged, painful, and tender.\nOther options:\nOption B - Treponema pallidum causes syphilis, characterised by chancre - a single painless ulcer\nwith a clean base and a firm raised border, with painless lymphadenopathy. Persistent or multiple\nchancres may be seen in HIV-infected or other immunodeficient patients.\nOptions C and D - Chlamydia trachomatis serovars Li, L2 and L3 cause lymphogranuloma\nvenereum, characterised by shallow, painless ulcers that progress to painful lymphadenopathy.", "questionPages": [252, 253], "solutionPages": [259], "questionFigures": ["crop-question-ch16-q9-1"], "solutionFigures": []}, {"id": "ch16-q10", "chapterId": 16, "chapter": "Haemophilus", "number": 10, "text": "The following are true about chancroid:", "options": [{"id": "A", "text": "C & D only"}, {"id": "B", "text": "A, B,C & D"}, {"id": "C", "text": "AB & C"}, {"id": "D", "text": "A & B only"}], "correctIndex": 2, "correctLetter": "C", "solution": "Chancroid is a painful genital ulcer caused by Haemophilus ducreyi, which is a gram-negative\ncoccobacillus. Microscopic appearance of H. ducreyi is called the school of fish appearance or\nrailroad appearance. Chancroid ulcers have a soft base that bleeds easily to touch. They also cause\npainful lymphadenopathy.\nThe image below shows the 'school-of-fish' appearance characteristic of H. ducreyi.\n\n\n\nNote: Groove sign is a characteristic sign seen in lymphogranuloma venereum. It refers to the\ndepression created by the inguinal ligament as it passes between the groups of inflamed inguinal\nlymph nodes.", "questionPages": [253], "solutionPages": [259, 260], "questionFigures": [], "solutionFigures": ["crop-solution-ch16-q10-1"]}, {"id": "ch16-q11", "chapterId": 16, "chapter": "Haemophilus", "number": 11, "text": "Which of the following is not involved in urethritis?", "options": [{"id": "A", "text": "Trichomonas"}, {"id": "B", "text": "Chlamydia"}, {"id": "C", "text": "Gonococcus"}, {"id": "D", "text": "H.ducreyi"}], "correctIndex": 3, "correctLetter": "D", "solution": "Haemophilus ducreyi does not cause urethritis. It causes chancroid (soft chancre), which presents\nas a genital ulcer.\nUrethritis is classified into two types:\n* Gonococcal urethritis - caused by Neisseria gonorrhoea.\n* Non-gonococcal urethritis - caused by:\n+ Chlamydia trachomatis (most common)\n* Ureaplasma urealyticum\n+ Adenovirus\n+ Haemophilus vaginalis\n* Mycoplasma genitalium\n* Tricomonas vaginalis (rare)\n+ Herpes simplex virus (rare)", "questionPages": [253], "solutionPages": [260], "questionFigures": [], "solutionFigures": []}, {"id": "ch16-q12", "chapterId": 16, "chapter": "Haemophilus", "number": 12, "text": "A>5-year-old girl presents with conjunctivitis, fever, and hemorrhagic skin lesions. There's a\nhistory of travel to Brazil. Which of the following etiological agents would you suspect in this\ncase?", "options": [{"id": "A", "text": "Haemophilus influenzae type A"}, {"id": "B", "text": "Haemophilus parahaemolyticus"}, {"id": "C", "text": "Haemophilus aegypticus"}, {"id": "D", "text": "Haemophilus parainfluenzae"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given case scenario is suggestive of Brazilian purpuric fever (BPF) caused by Haemophilus\naegypticus (Koch-Weeks bacillus).\n\n\n\nRecent DNA studies have shown that the bacillus is identical to non-capsulated H.influenzae\nand it is now named H.influenzae biotype aegypticus.\nIt is worldwide in distribution and causes:\n+ A highly contagious form of conjunctivitis (‘pink eye’) which is especially common in the tropics\nand subtropics and may lead to epidemics. It responds to local sulphonamide or gentamicin\nadministration.\n* Brazilian purpuric fever characterized by fever, purpura, and conjunctivitis which proceeds to\nfulminant septicemia in infants and children. It has a high fatality rate.", "questionPages": [253, 254], "solutionPages": [260, 261], "questionFigures": [], "solutionFigures": []}, {"id": "ch17-q1", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 1, "text": "The milk ring test is found to be positive for a sample of milk. Which organism has it most\nlikely been contaminated with?", "options": [{"id": "A", "text": "Brucella"}, {"id": "B", "text": "Bordetella"}, {"id": "C", "text": "Bacillus"}, {"id": "D", "text": "Burkholderia"}], "correctIndex": 0, "correctLetter": "A", "solution": "Milk ring test (MRT) is positive for Brucella. It is used for the detection of infected animals in\ndairy farms.\nA sample of whole milk is mixed with a drop of Brucella antigen and incubated at 70 °C for 40-50\nmin. If antibodies are present in the milk, the bacilli are agglutinated and rise with the cream to\nform a blue ring at the top, leaving the rest of the milk unstained (MRT positive). If antibodies are\nabsent, the solution remains uniformly blue (MRT negative).", "questionPages": [262], "solutionPages": [], "questionFigures": [], "solutionFigures": ["crop-solution-ch17-q1-1"]}, {"id": "ch17-q2", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 2, "text": "Which of the following is an intracellular pathogen?", "options": [{"id": "A", "text": "Brucella suis"}, {"id": "B", "text": "Haemophilus influenzae"}, {"id": "C", "text": "Pseudomonas aeruginosa"}, {"id": "D", "text": "Staphylococcus aureus"}], "correctIndex": 0, "correctLetter": "A", "solution": "Brucella suis is primarily an intracellular pathogen affecting reticuloendothelial system. This\naccounts for its refractoriness to chemotherapy.", "questionPages": [262], "solutionPages": [], "questionFigures": [], "solutionFigures": []}, {"id": "ch17-q3", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 3, "text": "A farmer was diagnosed with brucellosis. Which of the following patterns of fever will be seen\nin this disease?", "options": [{"id": "A", "text": "Pel-Ebstein fever"}, {"id": "B", "text": "Undulant fever"}, {"id": "C", "text": "Relapsing fever"}, {"id": "D", "text": "Saddleback fever"}], "correctIndex": 1, "correctLetter": "B", "solution": "Brucellosis is a bacterial zoonosis caused by Brucella sp which presents with undulant fever. It is\nreferred to as undulant fever because of the rising and falling of fever like a wave (remittent\nfever). Patients may also have arthralgia, muscular pain, sweating, loss of weight, and appetite.\nCNS symptoms such as fatigue, irritability, and depression might also occur.\nOther options\nOption A: Pel-Ebstein fever is seen in Hodgkin's lymphoma. It is characterized by fever lasting\n3-10 days followed by afebrile periods of 3-10 days.\n\n\n\nOption C: Relapsing fever is seen in infection with Borrelia recurrentis in which days of fever are\nfollowed by a several-day afebrile period and then relapse into additional days of fever. A similar\npicture is also seen in malaria.\nOption D: Saddleback fever is seen in dengue. Saddleback fever is defined as temperature\n>37.5°C with defervescence of at least one day, followed by a second peak lasting at least one\nday.", "questionPages": [262], "solutionPages": [272], "questionFigures": [], "solutionFigures": []}, {"id": "ch17-q4", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 4, "text": "A 56-year-old dairy farmer presented with remittent fever and night sweats for 1 month. On\nexamination, he was hypotensive and pallor was present. Rose Bengal card tests done on milk\n\n\n\nsamples from his farm were found to be positive. Which blood culture method with a biphasic\nmedium will be used to isolate the organism?", "options": [{"id": "A", "text": "BACTEC method"}, {"id": "B", "text": "Castaneda method"}, {"id": "C", "text": "Septi-check method"}, {"id": "D", "text": "Oxoid signal method"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given case scenario of remittent fever with anemia with a positive Rose Bengal card test is\nsuggestive of brucellosis. Castaneda method for blood culture is used to isolate Brucella sp.\nIn the Castaneda method, blood is inoculated into a bottle of trypticase soy broth or brucella broth\nin a biphasic blood culture bottle (with liquid and solid media in the same bottle). This method\nminimizes materials and manipulation, thus reducing the chances of contamination and risk of\ninfection to laboratory workers.\nBlood cultures are positive in only 30-50% of cases even when repeated samples are\ntested. B.melitensis and B.suis are isolated more readily than B.abortus. The below image shows\nCastaneda's bottle.\nLab diagnosis of brucellosis is done using the following methods:\n* Blood culture with\n* Castaneda's method - recommended\n* BACTEC - an automated method. It is faster than Castaneda's method.\n+ Serological tests:\n* Standard agglutination test (SAT)\n+ ELISA for specific IgG/IgM\n\n\n\n+ Dipstick assays\n+ Detection in milk and infected cattle is carried out by:\n* Microscopic demonstration by staining or immunofluorescence\n* Milk ring test\n* Rose Bengal card test", "questionPages": [262, 263], "solutionPages": [272, 273], "questionFigures": [], "solutionFigures": ["crop-solution-ch17-q4-1"]}, {"id": "ch17-q5", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 5, "text": "A 50-year-old farmer presents with fever, weight loss, and lower backache for three weeks.\nBlood reports show predominant lymphocytosis. What are the drugs of choice for treating\nthis condition?", "options": [{"id": "A", "text": "Cotrimoxazole and rifampicin"}, {"id": "B", "text": "Doxycycline and cotrimoxazole"}, {"id": "C", "text": "Doxycycline and streptomycin"}, {"id": "D", "text": "Streptomycin and rifampicin"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given scenario of a farmer with fever, weightloss and back pain with a predominant\nlymphocytosis points towards a diagnosis of acute brucellosis. The drugs of choice for this\ncondition in adults are intramuscular streptomycin with doxycycline.\nThe usual alternative regimen (and the current World Health Organization recommendation) is\nrifampin plus doxycycline. However, this is associated with a higher relapse rate, possibly because\nrifampicin increases clearance of doxycycline and reduces serum doxycycline levels.\nIn children, cotrimoxazole along with rifampicin or gentamycin may be used for the treatment of\nbrucellosis.\nNote: B. melitensis is endemic to the Middle East.", "questionPages": [263], "solutionPages": [273], "questionFigures": [], "solutionFigures": []}, {"id": "ch17-q6", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 6, "text": "A 34-year-old man presents to the hospital with fever, joint pain and a rash on his hands. He\ngives a history of a rat bite 1 week back. Which of the following can cause this disease?", "options": [{"id": "A", "text": "1 and 3."}, {"id": "B", "text": "2 and 4."}, {"id": "C", "text": "3 and 5."}, {"id": "D", "text": "2 and 5."}], "correctIndex": 3, "correctLetter": "D", "solution": "The given case scenario is suggestive of rat-bite fever. This can be caused by Streptobacillus\nmoniliformis and Spirillum minus.\nRat-bite fever (RBF) is characterized by fever, rash, and arthralgia which usually occurs days or\nweeks after a bite.\nThe two types of rat-bite fever are:\n+ Streptobacillary RBF develops 2-10 days after a rat bite, associated with sudden onset of fever,\nheadache, and myalgia followed by petechial rash and arthritis. It is also called Haverhill fever or\nErythema arthrititicum epidemicum.\n+ Spirillary RBF is similar to streptobacillary type but it is also associated with regional\nlymphadenopathy. It is also called Sodoku.\nDiagnosis is based on demonstration of causative organisms in peripheral blood films. Serology\ncan also be used for diagnosis.\nRBF is treated with intravenous Penicillin G. Alternative drugs include ampicillin, cefuroxime,\nand cefotaxime.\nNote: Pasteurella multocida causes cellulitis and lymphangitis following bites by cats and dogs.\nBartonella henselae causes cat sratch disease and bacillary angiomatosis.\nBorellia burgdorferi causes Lyme disease.", "questionPages": [263], "solutionPages": [273, 274], "questionFigures": [], "solutionFigures": []}, {"id": "ch17-q7", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 7, "text": "While evaluating the Pap smear of a patient, you come across the following finding. What is\nthe diagnosis?", "options": [{"id": "A", "text": "Lymphogranuloma venereum"}, {"id": "B", "text": "Bacterial vaginosis"}, {"id": "C", "text": "Trichomoniasis"}, {"id": "D", "text": "Gonorrhea"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given image shows clue cells which are seen in bacterial vaginosis. They are epithelial cells\nwith their surface covered by adherent bacilli seen in stained or unstained films.\nBacterial vaginosis is a polymicrobial infection characterized by a malodorous (fishy smell) vaginal\ndischarge. Causative organisms include:\n* Gardnerella vaginalis\n* Mycoplasma hominis\n+ Prevotella\n* Ureaplasma\n+ Peptostreptococcus.\nBacterial vaginosis is diagnosed using Amsel's criteria and Nugent's score:\n1. Amsel's Criteria: (any 3 should be present)\n* Thin, white/yellow homogenous vaginal discharge\n+ pH of Vaginal fluid>4.5\n+ Fishy odour of discharge accentuated on adding 10% KOH (Whiff test)\n* Clue cells seen on microscopy\n2. Nugent's score is obtained by counting the number of Gardnerella vaginalis, Mobilincus and\nlactobacillus in the gram-stained smear of vaginal discharge. A score of >7 is diagnostic\nTreatment is oral metronidazole 500 mg BD for 7 days.\nThe images below show clue cells from microscopy.", "questionPages": [263, 264], "solutionPages": [274, 275], "questionFigures": ["crop-question-ch17-q7-1"], "solutionFigures": ["crop-solution-ch17-q7-1", "crop-solution-ch17-q7-2"]}, {"id": "ch17-q8", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 8, "text": "A patient from Kolar, Karnataka presented with fever and hemoptysis. The findings of his\nPp P 8\nperipheral smear examination are given below. Which of the following is the causative\norganism?", "options": [{"id": "A", "text": "Yersinia pestis"}, {"id": "B", "text": "Bacillus anthracis"}, {"id": "C", "text": "Bordetella pertussis"}, {"id": "D", "text": "Klebsiella pneumonia"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given case scenario and the image showing the characteristic \"safety-pin appearance\" in\nperipheral smear is suggestive of plague caused by Yersinia pestis.\nOn staining with Giemsa stain or methylene blue (Wayson's stain), the bacteria has bipolar\nstaining with two ends densely stained and the central area clear. This is the characteristic\n‘safety-pin appearance’ seen in Y. pestis.\nBipolar staining is also shown by the following organisms:\n+ Haemophilus ducreyi\n+ Vibrio parahemolyticus\n* Calymmatobacterium granulomatis\n¢ Burkholderia mallei\n* Burkholderia pseudomallei.\nNote: In India, 4 foci of plague are known:\n+ Kolar at the trijunction of Tamil Nadu, Andhra Pradesh, and Karnataka.\n* Beed-Latur belt in Maharashtra\n* Rhoru, Himachal Pradesh\n+ Uttarakhand\nThe image given below shows the safety-pin appearance of Yersinia pestis on Wayson's stain", "questionPages": [264, 265], "solutionPages": [275, 276], "questionFigures": ["crop-question-ch17-q8-1"], "solutionFigures": ["crop-solution-ch17-q8-1"]}, {"id": "ch17-q9", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 9, "text": "A child from Uttarakhand suddenly developed fever with chills and malaise. He also\ndeveloped a tender swelling which is shown in the image. There's a history of similar\ncomplaints in the community. What is false about the disease he's likely suffering from?", "options": [{"id": "A", "text": "Wild rodents and their infected fleas are the primary reservoir."}, {"id": "B", "text": "The septicemic form cannot be acquired directly."}, {"id": "C", "text": "The pneumonic form is far more contagious than the bubonic form."}, {"id": "D", "text": "The bubonic form may progress to the pneumonic form."}], "correctIndex": 1, "correctLetter": "B", "solution": "The given case scenario of sudden-onset fever with painful lymphadenopathy and a history of\nsimilar complaints in the community is suggestive of a diagnosis of plague caused by Yersinia\npestis. The septicemic form of the disease may be acquired directly if the bacteria enter the\nbloodstream via infected blood transfusions.\nWild rodents and their infected fleas are the primary reservoirs of Yersinia pestis. Infection is\ntransmitted to humans by the bite of infected fleas.\nHuman plague occurs in 3 clinical forms (in increasing order of severity): bubonic plague<\npneumonic plague< septicemic plague\nBubonic plague- It is the most common variety of the disease. It is named after the buboes\nmeaning swollen lymph nodes, which typically develop within a week after an infected flea bite.\nOther clinical features include sudden onset of fever and chills, headache, and fatigue.\nPneumonic plague- Bubonic plague can advance and spread to the lungs. It is the most virulent\nform of plague. Any person with pneumonic plague may transmit the disease via droplets to other\nhumans. The symptoms include dyspnoea, chest pain, cough, fever, and hemoptysis.\nSepticemic plague- When the bacteria enter the bloodstream directly and multiply there, it is\nknown as septicemic plague. When left untreated, both bubonic and pneumonic plague can lead\nto septicemic plague.", "questionPages": [265], "solutionPages": [276], "questionFigures": ["crop-question-ch17-q9-1"], "solutionFigures": []}, {"id": "ch17-q10", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 10, "text": "A sudden epidemic of pneumonic plague has occurred in the Beed-Latur belt of Maharashtra.\nThe primary contact of a suspected case came to you for preventive treatment. What will you\nprescribe for chemoprophylaxis in this patient?", "options": [{"id": "A", "text": "Penicillin"}, {"id": "B", "text": "Rifampicin"}, {"id": "C", "text": "Erythromycin"}, {"id": "D", "text": "Doxycycline"}], "correctIndex": 3, "correctLetter": "D", "solution": "The drug of choice for chemoprophylaxis of plague is doxycycline. It is given for 7 days to all close\ncontacts of a patient having pneumonic plague.\n\n\n\nCiprofloxacin, levofloxacin, and moxifloxacin are the other first-line drugs used for antimicrobial\nprophylaxis.\nThe drug of choice for the treatment of plague is streptomycin. Streptomycin is nephrotoxic and\nototoxic and should, therefore be cautiously used. Doxycycline or ciprofloxacin (and other\nfluoroquinolones) are considered as alternative drugs for the treatment of plague.", "questionPages": [265, 266], "solutionPages": [276, 277], "questionFigures": [], "solutionFigures": []}, {"id": "ch17-q11", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 11, "text": "Which of the following organisms do not cause yersiniosis?", "options": [{"id": "A", "text": "Yersinia enterocolotica"}, {"id": "B", "text": "Yersinia pestis"}, {"id": "C", "text": "Yersinia enterocolitica and Yersinia pseudotuberculosis"}, {"id": "D", "text": "Yersinia pestis and Yersinia pseudotuberculosis"}], "correctIndex": 1, "correctLetter": "B", "solution": "The term yersiniosis denotes infections with yersiniae other than Y.pestis.\nYersiniosis includes zoonotic infections by Y.pseudotuberculosis and Y.enterocolitica.", "questionPages": [266], "solutionPages": [277], "questionFigures": [], "solutionFigures": []}, {"id": "ch17-q12", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 12, "text": "A 65-year-old patient presents to the OPD with high fever, chest pain, dyspnoea, and\nhemoptysis. The patient also complains of watery diarrhea. The direct fluorescent antibody\nstained film of his pleural fluid is given below. Identify the most likely etiologic agent.", "options": [{"id": "A", "text": "Chlamydia pneumoniae"}, {"id": "B", "text": "Legionella pneumophila"}, {"id": "C", "text": "Hemophilus influenzae"}, {"id": "D", "text": "Klebsiella pneumoniae"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given clinical vignette and the image showing fluorescent organisms in the direct fluorescent\nantibody (DFA) stained film of pleural fluid suggest the diagnosis of Legionnaire's disease, caused\nby Legionella pneumophila.\nTwo distinct clinical patterns of legionellosis have been identified:\n* Legionnaires' disease presents with fever, non-productive cough, and dyspnea rapidly\nprogressing to pneumonia if left untreated. Patients can also develop a hyponatremia. Diarrhea\nand encephalopathy are also common. It is often included in the differential diagnosis of atypical\npneumonia. Atypical pneumonia is also caused by:\n* Chlamydia pneumonia\n* Chlamydia psittaci\n* Mycoplasma pneumonia\n* Coxiella burnetii\n+ Viruses such as influenza virus, adenovirus and respiratory syncytial virus\n+ Pontiac fever is a milder, non-fatal, influenza-like illness with fever, chills, myalgia, and\nheadache.\nOther options:\nOption A: Chlamydia pneumonia causes pharyngitis, sinusitis, bronchitis, and pneumonia. It has\nalso been associated with adult onset asthma. Outbreaks have been reported in closed\ncommunities. Real-time PCR is used for its diagnosis.\nOption C: Haemophilus influenzae typically causes pneumonia in infants. While the primary\ninfections occur due to capsulated strains, bronchopneumonia may occur as a secondary infection\ndue to non-capsulated strains. Gram stain and culture are used for diagnosis.\nOption D: Klebsiella pneumonia causes fatal pneumonia, which occurs in middle -aged or older\npersons with risk factors such as alcoholism, chronic bronchopulmonary disease or diabetes\nmellitus. Gram stain and culture are used for diagnosis.", "questionPages": [266], "solutionPages": [277, 278], "questionFigures": ["crop-question-ch17-q12-1"], "solutionFigures": []}, {"id": "ch17-q13", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 13, "text": "BCYE medium is used to culture:", "options": [{"id": "A", "text": "Leptospira"}, {"id": "B", "text": "Bacillus cereus"}, {"id": "C", "text": "Campylobacter"}, {"id": "D", "text": "Legionella"}], "correctIndex": 3, "correctLetter": "D", "solution": "BCYE medium (buffered charcoal yeast extract agar) is used to culture Legionella pneumophila.\nLegionella pneumophila has fastidious growth requirements and grows on complex media such\nas BCYE medium with L-cysteine and antibiotic supplements (e.g., polymyxin B, cefazolin,\nvancomycin). The charcoal acts as a detoxifying agent. It grows slowly, and the colonies may take\n3-6 days to appear.\nOther options:\nOption A: Leptospira is cultured on EMJH (Ellinghausen, McCullough, Johnson and Harris)\nmedium\nOption B: Bacillus cereus is cultured on PEMBA (Polymyxin pyruvate egg-yolk\nmannitol—bromothymol blue) agar\nOption C: Campylobacter is cultured on Skirrow's, Campy BAP or Butzler's agar.", "questionPages": [266, 267], "solutionPages": [278], "questionFigures": [], "solutionFigures": []}, {"id": "ch17-q14", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 14, "text": "A 60-year-old man is diagnosed with Legionnaires’ disease. He had recently attended a\nconference. What is the most likely way he acquired the infection?", "options": [{"id": "A", "text": "From the air-conditioned rooms at the conference"}, {"id": "B", "text": "From a chronic carrier of the disease"}, {"id": "C", "text": "From sharing a towel with a fellow colleague in the conference"}, {"id": "D", "text": "From drinking the water provided at the conference"}], "correctIndex": 0, "correctLetter": "A", "solution": "This patient most likely acquired infection with Legionella pneumophila from inhalation of\naerosol in the air-conditioned rooms at the conference.\nLegionella pneumophila can be found in natural, freshwater environments, but generally is not\npresent in sufficient numbers to cause disease. Infection is typically by inhalation of aerosols\nproduced by cooling towers, air conditioners, and showerheads which act as disseminators\nNo animal reservoirs exist. No evidence of human-to-human transmission has been found and no\ncarrier state is established.", "questionPages": [267], "solutionPages": [278], "questionFigures": [], "solutionFigures": []}, {"id": "ch17-q15", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 15, "text": "A patient presented with fever and regional lymphadenopathy, following a scratch from his\npet kitten. His lymph node biopsy specimen was examined with Warthin-Starry staining; the\nfindings are shown in the given image. What is the causative organism of this condition?", "options": [{"id": "A", "text": "Bartonella henselae"}, {"id": "B", "text": "Bartonella bacilliformis"}, {"id": "C", "text": "Bartonella quintana"}, {"id": "D", "text": "Borrelia burgdorferi"}], "correctIndex": 0, "correctLetter": "A", "solution": "This patient presents with fever and lymphadenopathy after a cat scratch and the above image\nshows the black short rod-shaped bacilli arranged in chains or clumps, suggestive of cat scratch\ndisease, This condition is caused by Bartonella henselae.\nCat scratch disease presents as a febrile illness with lymphadenopathy following a cat scratch.\nPatients present with a painless papule or pust

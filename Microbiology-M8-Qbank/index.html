\nMedia used in mycology can be classified as:\n* Specific media-\n* SDA agar\n* Czapek-Dox medium\n+ Birdseed agar\n* Cornmeal agar\n* Non-specific media-\n* Blood agar\n¢ Brain heart infusion agar", "questionPages": [450, 451], "solutionPages": [465, 466], "questionFigures": [], "solutionFigures": ["crop-solution-ch28-q10-1"]}, {"id": "ch28-q11", "chapterId": 28, "chapter": "Superficial and Systemic Mycoses", "number": 11, "text": "A gardener from the sub-Himalayan region presented with multiple ulcerative eruptions\nalong the lymphatics of his hand. A tissue biopsy was taken and sent for culture. Microscopic\nexamination of the organism cultured is shown in the image. Identify the organism.", "options": [{"id": "A", "text": "Sporothrix schenckii"}, {"id": "B", "text": "Histoplasma capsulatum"}, {"id": "C", "text": "Phialophora richardsiae"}, {"id": "D", "text": "Exophiala jeanselmei"}], "correctIndex": 0, "correctLetter": "A", "solution": "The presence of multiple ulcerative eruptions along the lymphatics in a gardener from the\nsub-Himalayan region and the microscopic finding of flower-like clusters of conidia are suggestive\nof sporotrichosis, caused by Sporothrix schenckii. It is a thermally dimorphic fungus that lives on\nvegetation.\nThe lesions occur following traumatic inoculation of the fungus. A granulomatous nodule is first\nformed at the site of inoculation that may progress to form a necrotic or ulcerative lesion. The\ninfection can spread via lymphatic channels from the skin and subcutaneous tissue to the lymph\nnodes resulting in formation of secondary ulcers on the lymph nodes. This condition is known as\nlymphocutaneous sporotrichosis. This disease is commonly encountered among gardeners, forest\nworkers and manual labourers.\nClinical presentation of lymphocutaneous sporotrichosis:", "questionPages": [451], "solutionPages": [466, 467], "questionFigures": ["crop-question-ch28-q11-1"], "solutionFigures": ["crop-solution-ch28-q11-1"]}, {"id": "ch28-q12", "chapterId": 28, "chapter": "Superficial and Systemic Mycoses", "number": 12, "text": "A farmer developed multiple ulcerative nodules along the lymphatics following a rose thorn\nprick a week ago. Microscopic finding of the skin biopsy is given below. What is the likely\ndiagnosis?", "options": [{"id": "A", "text": "Cryptococcosis"}, {"id": "B", "text": "Sporotrichosis"}, {"id": "C", "text": "Histoplasmosis"}, {"id": "D", "text": "Aspergillosis"}], "correctIndex": 1, "correctLetter": "B", "solution": "The image shows an asteroid body which is characteristically seen in a case of sporotrichosis.\nAsteroid bodies are formed due to the deposition of the immune complexes around the yeast cell.\nIt consists of a central rounded or oval basophilic, cigar-shaped yeast cell surrounded peripherally\nby eosinophilic radiations. Formation of such structures is called the Splendore-Hoeppli\nphenomenon.\nNote: Asteroid bodies are also seen in sarcoidosis. Those are irregular, star-shaped inclusions seen\nin multinucleate giant cells.", "questionPages": [451, 452], "solutionPages": [467], "questionFigures": ["crop-question-ch28-q12-1"], "solutionFigures": []}, {"id": "ch28-q13", "chapterId": 28, "chapter": "Superficial and Systemic Mycoses", "number": 13, "text": "A farmer from the sub-Himalayan belt had a thorn prick injury a year back and developed a\nwarty, verrucous growth at the site of prick. A skin biopsy sample was taken and sent for\nhistopathological examination. The characteristic microscopic body as shown in the image\nwas seen. Which of the following could be the most likely diagnosis?", "options": [{"id": "A", "text": "Blastomycosis"}, {"id": "B", "text": "Pheohyphomycosis"}, {"id": "C", "text": "Chromoblastomycosis"}, {"id": "D", "text": "Sporotrichosis"}], "correctIndex": 2, "correctLetter": "C", "solution": "The history of a slowly spreading warty, verrucous lesion following a thorn prick injury and the\nhistopathological image showing medlar bodies is suggestive of chromoblastomycosis.\nChromoblastomycosis (chromomycosis) is a subcutaneous mycotic infection that is usually caused\nby traumatic inoculation. Over months to years, the primary lesion becomes verrucous and\nwart-like with extension along the draining lymphatics.\nHistologically, the lesions are granulomatous and the dark sclerotic bodies may be seen within\nleukocytes or giant cells called medlar/copper penny bodies.", "questionPages": [452, 453], "solutionPages": [467], "questionFigures": ["crop-question-ch28-q13-1"], "solutionFigures": ["crop-solution-ch28-q13-1"]}, {"id": "ch28-q14", "chapterId": 28, "chapter": "Superficial and Systemic Mycoses", "number": 14, "text": "A middle-aged man from south India presented to the OPD with a swelling in his left foot that\nis unresponsive to antibiotics. On examination, multiple discharging sinuses were noted. The\ndischarge contained brown granules that were soft in consistency. Which of the following is\nlikely the causative agent?", "options": [{"id": "A", "text": "Actinomadura madurae"}, {"id": "B", "text": "Sporothrix schenckii"}, {"id": "C", "text": "Fonsecaea pedrosoi"}, {"id": "D", "text": "Madurella mycetomatis"}], "correctIndex": 3, "correctLetter": "D", "solution": "A swelling with multiple discharging sinuses with brown granules that is unresponsive to the\nantibiotics is suggestive of eumycetoma caused by Madurella mycetomatis.\nMycetoma is a chronic, granulomatous infection of the skin, subcutaneous tissues, fascia and\nbone, which most often affects the foot or the hand. It can be divided into three types-\neumycetomas, actinomycetomas and botryomycosis.\nInfection follows traumatic inoculation of the organism into the subcutaneous tissue from soil or\nvegetable sources. Within host tissues, the organisms develop to form compacted colonies (grains)\n0.5-2 mm in diameter, the color of which depends on the organism responsible. It results in\ntumefactions, deformities and draining sinuses discharging these grains or granules.\nLaboratory Diagnosis:\n+ A. Direct Examination: The presence of grains in pus collected from draining sinuses or in\nbiopsy material is diagnostic.\n* B. Culture Samples should also be cultured, at both 25-30°C and 37°C, on brain-heart infusion\nagar or blood agar for actinomycetes and on Sabouraud agar (without cycloheximide) for fungi.\nTreatment:\nThe management of eumycetoma is difficult, involving surgical debridement or excision and\nchemotherapy. Actinomycetoma on the other hand, responds well to rifampicin in combination\nwith sulfonamides or cotrimoxazole.\nOption A: Actinomadura madurae causes actinomycetoma which would respond to antibiotics.\nOption B: Sporothrix schenckii causes sporotrichosis which is characterised by lesions along the\nroute of lymphatics.\nOption C: Fonsecaea pedrosoi causes chromoblastomycosis which would not have discharging\nsinuses.", "questionPages": [453], "solutionPages": [467, 468], "questionFigures": ["crop-question-ch28-q14-1"], "solutionFigures": []}, {"id": "ch28-q15", "chapterId": 28, "chapter": "Superficial and Systemic Mycoses", "number": 15, "text": "Which of the following is not a dimorphic fungus?", "options": [{"id": "A", "text": "Sporothrix schenckii"}, {"id": "B", "text": "Coccidioides immitis"}, {"id": "C", "text": "Pneumocystis jirovecii"}, {"id": "D", "text": "Talaromyces marneffei"}], "correctIndex": 2, "correctLetter": "C", "solution": "Pneumocystis jirovecii is a yeast-like fungus and not a dimorphic fungus.\nDimorphic fungi exist in the yeast form in body tissues and cultures maintained at 37°C, and in\nthe filamentous form in cultures at room temperature(25°C).\nExamples of dimorphic fungi include:\n* Blastomyces dermatitidis\n* Coccidioides immitis\n* Paracoccidioides brasiliensis\n* Talaromyces marneffei\n* Sporothrix schenckii\n* Histoplasma capsulatum\n* Coccidioides posadasii", "questionPages": [453, 454], "solutionPages": [468, 469], "questionFigures": [], "solutionFigures": []}, {"id": "ch28-q16", "chapterId": 28, "chapter": "Superficial and Systemic Mycoses", "number": 16, "text": "A 54-year-old man had presented to the clinic with a history of chronic cough. His chest X-ray\nshowed a mass in the left lung with hilar lymphadenopathy. Biopsy of the mass was done and\nfindings are shown below. Which of the following is the most likely diagnosis?", "options": [{"id": "A", "text": "Gilchrist disease"}, {"id": "B", "text": "Darling's disease"}, {"id": "C", "text": "Desert rheumatism"}, {"id": "D", "text": "Jorge Lobo's disease"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given clinical history and the presence of tiny yeast forms within macrophages are suggestive\nof Histoplasmosis which is also called Darling's disease. Other names of this condition include\nCave's disease and Ohio disease.\nThe causative agent is a dimorphic fungus called Histoplasma capsulatum. Transmission\noccurs via inhalation of conidia.\nAfter inhalation, the conidia develop into yeast cells and are engulfed by alveolar macrophages.\nWithin macrophages, the yeasts may disseminate to reticuloendothelial tissues, such as the liver,\nspleen, bone marrow, and lymph nodes.\nBiopsy reveals tiny (2-4 microns) oval-shaped yeast cells inside macrophages.\nOn culture and microscopy, tuberculate macroconidia and hyaline septate mold with microconidia\nare seen.\nIt is treated using azole antifungals.", "questionPages": [454], "solutionPages": [469], "questionFigures": ["crop-question-ch28-q16-1"], "solutionFigures": []}, {"id": "ch28-q17", "chapterId": 28, "chapter": "Superficial and Systemic Mycoses", "number": 17, "text": "A 7-year-old boy with a recent history of travel to South America was brought to the hospital\nwith fever, enlarged lymph nodes and multiple skin lesions on his face. Tissue sample from\nthe lesion shows the following findings under microscopy. Which of the following is the most\nlikely causative organism?", "options": [{"id": "A", "text": "Coccidioides immitis"}, {"id": "B", "text": "Paracoccidioides brasiliensis"}, {"id": "C", "text": "Histoplasma capsulatum"}, {"id": "D", "text": "Blastomyces dermatitidis"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given clinical history and the characteristic pilot's wheel appearance on culture(image) is\nsuggestive of paracoccidioidomycosis caused by Paracoccidioides brasiliensis. It is also called Lutz\nmycosis/ South American blastomycosis.\nParacoccidioides brasiliensis is a thermally dimorphic fungus that causes a chronic granulomatous\ndisease affecting the lungs, skin, mucosa, lymph nodes. On culture, yeast form is seen at 37° C and\nthe mycelial form at 25° C.\nMicroscopy of tissue sample reveals thick walled, round, yeast cells with numerous buds attached\nto each other circumferentially giving the classic mickey mouse or pilot wheel appearance.\nMost infections are asymptomatic and few individuals with acute disease present with\nhepatosplenomegaly, lymphadenopathy and skin lesions.\nThe below image shows skin lesions in a child with paracoccidioidomycosis.\n\n\n\nTreatment:\n* Mild/moderate disease: Itraconazole\n+ Severe disease: Amphotericin B for 2-3weeks followed by Itraconazole.", "questionPages": [454, 455], "solutionPages": [469, 470], "questionFigures": ["crop-question-ch28-q17-1"], "solutionFigures": ["crop-solution-ch28-q17-1"]}, {"id": "ch28-q18", "chapterId": 28, "chapter": "Superficial and Systemic Mycoses", "number": 18, "text": "A 50-year-old male presents with low-grade fever and a skin lesion as shown below. He had a\nhistory of recent travel to North America. Chest X-Ray reveals consolidation in the right lung\nwith hilar lymphadenopathy. Culture on Sabouraud dextrose agar at 37°C shows thick-walled,\nlarge (7-20 ), round yeast cells with a single broad-based bud. What is the most probable\ndiagnosis?", "options": [{"id": "A", "text": "Blastomycosis"}, {"id": "B", "text": "Histoplasmosis"}, {"id": "C", "text": "Coccidioidomycosis"}, {"id": "D", "text": "Paracoccidioidomycosis"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given clinical scenario with pulmonary and cutaneous involvement along with a history of\ntravel to North America and the characteristic culture findings suggests the diagnosis\nof Blastomycosis caused by Blastomyces dermitidis.\nBlastomycosis is a chronic infection, characterized by the formation of suppurative and\ngranulomatous lesions, especially, in the lungs and skin.\nIt is most common in North America and so is also called North Amerian Blastomycosis.\nThe causative organism is a thermally dimorphic fungus called Blastomyces dermatitidis. Humans\nare infected by the inhalation of spores in the soil.\nBlastomycosis can present in three forms:\n* Pulmonary disease:\n* Presents with cough, sputum production, chest pain, and fever\n* Hilar lymphadenopathy may be present\n+ Focal or diffuse consolidation, miliary lesions, or abscess formation may occur.\n* Resembles TB and Histoplasmosis\n* Cutaneous disease:\n* Involvement of face and exposed parts of the skin\n+ Skin lesion: ulcerated verrucous granulomas with an advancing border and central scarring. The\nborder is filled with microabscesses and has a sharp, sloping edge. (image in stem)\n\n\n\n+ Disseminated disease:\n* Multiple skin lesions are the most common presentation\n+ Highly fatal\n* Genitourinary tract (especially prostate) is frequently involved\n* Bone involvement resembles chronic osteomyelitis.\nIt can be diagnosed based on culture findings. Characterictic findings include the presence\nof thick-walled round yeast cell with a single broad-based bud when cultured at 37°C. (figure of 8\nappearance)\nTreatment:\n* Localised mild/moderate disease - Itraconazole (6 months)\n* Disseminated/ severe disease - Amphotericin B", "questionPages": [455, 456], "solutionPages": [470, 471], "questionFigures": ["crop-question-ch28-q18-1"], "solutionFigures": []}, {"id": "ch28-q19", "chapterId": 28, "chapter": "Superficial and Systemic Mycoses", "number": 19, "text": "A middle-aged man residing in a rural area presents with psychosis, ataxia and convulsions.\nOn further inquiry, you find out there is history of similar complaints in the family members\nwho recently consumed food prepared with grains as shown in the image. What is the\npoisoning is most likely due to?", "options": [{"id": "A", "text": "Claviceps purpurea"}, {"id": "B", "text": "Aspergillus flavus"}, {"id": "C", "text": "Amanita phalloides"}, {"id": "D", "text": "Aspergillus fumigatus"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given clinical vignette and the presence of dark coloured ergot growing on the wheat as shown\nin the image are suggestive of ergotism due to Claviceps purpurea\nMycotic poisoning is of two types: Mycetism and Mycotoxicosis\nMycetism:\nThe fungus itself causes toxic effects.\nExamples:\n* Claviceps > Ergot poisoning\n* Coprine — coprine poisoning\n* Inocybe > muscarine poisoning\nMycotoxicosis:\nFungal toxins contaminate food and cause toxic effects.\nExamples:\n+ Aflatoxins: These are a type of mycotoxins produced by Aspergillus species of fungi, such as\nAspergillus flavus and Aspergillus parasiticus.\n+ Fusarium toxins\n* Citrinin toxin was first isolated from Penicillium citrinum.", "questionPages": [456], "solutionPages": [471], "questionFigures": ["crop-question-ch28-q19-1"], "solutionFigures": []}, {"id": "ch28-q20", "chapterId": 28, "chapter": "Superficial and Systemic Mycoses", "number": 20, "text": "The below given image shows result of hair perforation test. The organism likely to show\nbelow given appearance is", "options": [{"id": "A", "text": "Trichophyton rubrum"}, {"id": "B", "text": "Trichophyton violaceum"}, {"id": "C", "text": "Trichophyton schoenleinii"}, {"id": "D", "text": "Trichophyton mentagrophytes"}], "correctIndex": 3, "correctLetter": "D", "solution": "Image shows surface erosion of shaft caused by Trichophyton mentagrophytes.\nHair perforation test:\n\n\n\n+ Done to differentiate Trichophyton rubrum from mentagrophytes.\n+ Few strands of human hair are placed in a petridish with 20 ml of distilled water and autoclaved.\n+ Few drops of sterile 10% yeast extract and a few fragments of the test fungus are added to the\nhair strands.\n* Incubated at 250C for 2-3 weeks.\n+ Hair is removed and examined microscopically in a lactophenol cotton blue stained wet\npreparation.\n* T.mentagrophytes causes surface erosion of the shaft resulting in wedge shaped appearance of\nthe shaft.", "questionPages": [456, 457, 458], "solutionPages": [471, 472], "questionFigures": ["crop-question-ch28-q20-1"], "solutionFigures": []}, {"id": "ch29-q1", "chapterId": 29, "chapter": "Opportunistic Mycoses", "number": 1, "text": "What is the stain used for identifying cryptococcus?", "options": [{"id": "A", "text": "Giemsa stain"}, {"id": "B", "text": "Ziehl-Nielsen stain"}, {"id": "C", "text": "Gram staining"}, {"id": "D", "text": "Mucicarmine"}], "correctIndex": 3, "correctLetter": "D", "solution": "Mucicarmine stain is used in the identification of cryptococcus.\nMucicarmine stained specimen of lung tissue containing cryptococci:", "questionPages": [473], "solutionPages": [], "questionFigures": [], "solutionFigures": ["crop-solution-ch29-q1-1"]}, {"id": "ch29-q2", "chapterId": 29, "chapter": "Opportunistic Mycoses", "number": 2, "text": "Which of the following is a false statement regarding Cryptococcus neoformans?", "options": [{"id": "A", "text": "It is laccase negative"}, {"id": "B", "text": "It most commonly causes meningitis in AIDS patients"}, {"id": "C", "text": "There are 3 serological types based on capsular polysaccharide"}, {"id": "D", "text": "Niger seed agar is used to demonstrate melanin production"}], "correctIndex": 0, "correctLetter": "A", "solution": "Pathogenic varieties of cryptococcus including C. neoformans and C. gattii are laccase positive.\nThey also have ability to grow at 37° C and these factors are used to differentiate them from\nnon-pathogenic cryptococci.\nCryptococci have been classified into 5 serotypes (A, B, C, D, and AD) based on their capsular\npolysaccharide:\n+ Three serotypes fall under Cryptococcus neoformans - A(var. grubii), D(var. neoformans), and\nAD(a hybrid of serotypes A and D). Although serotype AD is very similar to serotypes A and D, the\nisolates still comprise a discrete group that can be distinguished.\n+ The serotypes B and C are now considered a different species - Cryptococcus gattii.\nNiger seed agar is a solid medium used for selective and differential isolation\nof Cryptococcus neoformans from clinical specimens. C. neoformans and C. gattii produces brown\n\n\n\ncolonies on this medium due to the formation of melanin. Melanin is produced by laccase\nusing caffeic acid as the substrate.\nThe following image shows pigmented colonies of C. gattii growing on niger seed agar.\nCryptococcal meningitis caused by Cryptococcus neoformans, is an opportunistic infection seen in\nindividuals with AIDS. Flucytosine and amphotericin B are used in the treatment of this\ncondition.", "questionPages": [473], "solutionPages": [481], "questionFigures": [], "solutionFigures": ["crop-solution-ch29-q2-1"]}, {"id": "ch29-q3", "chapterId": 29, "chapter": "Opportunistic Mycoses", "number": 3, "text": "Which of the following organisms cannot be grown on any culture media?", "options": [{"id": "A", "text": "1 & 4"}, {"id": "B", "text": "1, 3 & 5"}, {"id": "C", "text": "1,2 & 5"}, {"id": "D", "text": "2 & 4"}], "correctIndex": 3, "correctLetter": "D", "solution": "Rhinosporidium seeberi and Pneumocystis jirovecii are non-cultivable organisms and cannot be\ngrown on any culture media.\nAnother example of a non-cultivable fungus is Lacazia loboi. It causes Jorge Lobo's disease which\nis a chronic subcutaneous mycosis.\nRhizopus oryzae is a mold which is easily cultivable on SDA. Dimorphic fungi like Histoplasma\ncapsulatum and Paracoccidiodes brasiliensis are identified based on their colony morphology on\nSDA.\nNote: Recently, molecular biological techniques have demonstrated that Rhinosporidium is\nan aquatic protistan parasite. Infections due to Rhinosporidium have been classified under\ninfections due to Protozoa under the ICD 11.", "questionPages": [473], "solutionPages": [481], "questionFigures": [], "solutionFigures": []}, {"id": "ch29-q4", "chapterId": 29, "chapter": "Opportunistic Mycoses", "number": 4, "text": "A patient with HIV presented complaining of cough and progressively worsening breathing\ndifficulty. Chest X-ray showed bilateral interstitial infiltrates. The findings of microscopic\nexamination of his bronchoalveolar lavage is given below. Which is the most probable\ncausative organism?", "options": [{"id": "A", "text": "Pneumocystis jirovecii"}, {"id": "B", "text": "Histoplasma capsulatum"}, {"id": "C", "text": "Cryptococcus neoformans"}, {"id": "D", "text": "Rhinosporidium seeberi"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given clinical picture and the GMS stained smear showing the black-colored cysts\nresembling crushed ping pong balls are suggestive of pneumocystis pneumonia (PCP) caused by\nPneumocystis jirovecii.\n\n\n\nPatients with PCP generally present with fever and cough that is usually non-productive. Chest\nX-ray is either a normal film if the disease is suspected early, or with diffuse bilateral interstitial\ninfiltrates. The classic finding of dense perihilar infiltrate is unusual in patients with AIDS.\nTreatment of choice is trimethoprim-sulfamethoxazole (cotrimoxazole) and pentamidine\nisethionate. Cotrimoxazole can also be used for prophylaxis in patients having AIDS.\nThe following X-ray image shows a cyst (arrow) and bilateral lung infiltrates in a patient with PCP:", "questionPages": [473, 474], "solutionPages": [481, 482], "questionFigures": ["crop-question-ch29-q4-1"], "solutionFigures": ["crop-solution-ch29-q4-1"]}, {"id": "ch29-q5", "chapterId": 29, "chapter": "Opportunistic Mycoses", "number": 5, "text": "A middle-aged inmunocompromised patient presents with complaints of pain during\nswallowing. She describes it as a burning sensation that radiates to her back every time she\nswallows. Oral examination reveals creamy white patches on the oral mucosa. The wet mount\nmicroscopy of the scraping obtained from the patches is given below. Identify the organism.", "options": [{"id": "A", "text": "Candida albicans"}, {"id": "B", "text": "Cryptococcus neoformans"}, {"id": "C", "text": "Aspergillus fumigatus"}, {"id": "D", "text": "Histoplasma capsulatum"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given clinical scenario of odynophagia, creamy white patches on the oral mucosa and the wet\nmount microscopy showing budding yeasts with pseudohyphae are suggestive of oral candidiasis\ncaused by Candida albicans.\n\n\n\nIt is an opportunistic infection commonly seen in immunocompromised states like AIDS, diabetes\netc.\nTreatment includes topical azoles or nystatin.", "questionPages": [474, 475], "solutionPages": [482, 483], "questionFigures": ["crop-question-ch29-q5-1"], "solutionFigures": []}, {"id": "ch29-q6", "chapterId": 29, "chapter": "Opportunistic Mycoses", "number": 6, "text": "The following test is positive for identification of", "options": [{"id": "A", "text": "Candida albicans"}, {"id": "B", "text": "Candida glabrata"}, {"id": "C", "text": "Candida parapsilosis"}, {"id": "D", "text": "Candida tropicalis"}], "correctIndex": 0, "correctLetter": "A", "solution": "The image shows the germ tube test used for identifying Candida albicans.\nUnlike other species of candida, yeast cells of Candida albicans will begin to form germ tubes after\nincubation in serum maintained at 37°C for about 90 minutes. This is known as the\nReynolds-Braude phenomenon. This test is positive for Candia dubliniensis as well.", "questionPages": [475], "solutionPages": [483], "questionFigures": ["crop-question-ch29-q6-1"], "solutionFigures": []}, {"id": "ch29-q7", "chapterId": 29, "chapter": "Opportunistic Mycoses", "number": 7, "text": "A 35-year-old HIV positivelll patient presents with mucosal lesions in the mouth as shown in\nthe image below. On microscopy, budding yeasts and pseudohyphae are seen. What is the\nlikely diagnosis?", "options": [{"id": "A", "text": "Oral candidiasis"}, {"id": "B", "text": "Hairy leukoplakia"}, {"id": "C", "text": "Lichen planus"}, {"id": "D", "text": "Diphtheria"}], "correctIndex": 0, "correctLetter": "A", "solution": "The most likely diagnosis of the given clinical scenario is oral candidiasis.\nOral candidiasis or thrush is a patchy, pseudomembranous lesion that develops over the tongue,\nlips, gum or palate. It is composed of epithelial cells, yeasts, and pseudohyphae. The causative\nagent is usually Candida albicans.\nIt occurs in almost all individuals with AIDS. Other risk factors include hyperglycemia, cellular\nimmunodeficiency, corticosteroids or antibiotics.\nIt is treated with topical nystatin or oral ketoconazole or fluconazole.\nOption B: Hairy leukoplakia is a wart-like growth on the tongue, caused by Epstein Barr virus. It\nis commonly seen as a white lesion on the lateral side of the tongue.\nOption C: Lichen planus is a pruritic disease characterized by papules commonly seen over the\nflexor surfaces and trunk. Oral and vulvovaginal lesions may also occur. Oral lesions appear as\nlacy, white, and raised lesions.\nOption D: Diphtheria is characterized by the presence of a grey pseudomembrane covering the\ntonsils and pharynx. It is caused by Corynebacterium diphtheriae.", "questionPages": [475, 476], "solutionPages": [483], "questionFigures": ["crop-question-ch29-q7-1"], "solutionFigures": []}, {"id": "ch29-q8", "chapterId": 29, "chapter": "Opportunistic Mycoses", "number": 8, "text": "Galactomannan in serum is seen in:", "options": [{"id": "A", "text": "1 & 2 only"}, {"id": "B", "text": "1 & 3 only"}, {"id": "C", "text": "1 only"}, {"id": "D", "text": "1, 2 & 3 only"}], "correctIndex": 2, "correctLetter": "C", "solution": "The galactomannan assay is used for the diagnosis of invasive (deep-seated) mycoses caused by\nAspergillus species.\nGalactomannan is a component of the cell wall of Aspergillus. It can be detected in serum or\nbronchoalveolar lavage by ELISA for the diagnosis of invasive aspergillosis in adults and children.\nThis test is especially useful in hematopoietic stem cell transplant recipients or patients with\nhematologic malignancies.\nOther diagnostic features of invasive aspergillosis are:\n+ A positive culture from the affected organ\n\n\n\n+ Aspergillus antigen detection of galactomannan\n+ Narrow, septate hyphae with branching at 450 and conidiophores\n+ Halo sign on CT scan", "questionPages": [476], "solutionPages": [483, 484], "questionFigures": [], "solutionFigures": []}, {"id": "ch29-q9", "chapterId": 29, "chapter": "Opportunistic Mycoses", "number": 9, "text": "Identify the organism in the given slide stained with Gomori methenamine silver stain.", "options": [{"id": "A", "text": "Obtuse angled mucor"}, {"id": "B", "text": "Acute angled penicillium"}, {"id": "C", "text": "Acute angled branching aspergillus"}, {"id": "D", "text": "Obtuse angled rhizopus"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given slide stained with GMS shows acute-angled (450) uniform, branching septate hyphae\nwhich is suggestive of Aspergillus species.\nAspergillus species grow rapidly, producing aerial hyphae that bear characteristic conidial\nstructures. Long aseptate conidiophores are seen with terminal vesicles on which phialides are\narranged in basipetal chains.\nThe following image shows the lactophenol cotton blue solution (LPCB) mount of Aspergillus\nfumigatus showing the long conidiophores with terminal vesicles.\nOption A: Mucor produces nonseptate, broad hyphae with aerial sporangiophores which end in a\nsporangium.\nOption B: Penicillium produces septate hyphae with branched, septate and brush-like\nconidiophores.\nOption D: Rhizopus appears similar to Mucor but it has rhizoids with sporangiophores arising in\ngroups directly above the rhizoids.", "questionPages": [476, 477], "solutionPages": [484], "questionFigures": ["crop-question-ch29-q9-1"], "solutionFigures": ["crop-solution-ch29-q9-1"]}, {"id": "ch29-q10", "chapterId": 29, "chapter": "Opportunistic Mycoses", "number": 10, "text": "A young lady complains of recurrent rhinitis, nasal discharge and bilateral nasal blockage for\ntwo years. She has a history of allergic rhinitis. On rhinoscopy, multiple ethmoidal polyps\nwith mucosal thickening and impacted secretions are seen in both the nasal cavities. A tissue\nbiopsy is taken and sent for culture, which on microscopic examination shows the following\nappearance. What is the most probable organism implicated here?", "options": [{"id": "A", "text": "Aspergillus fumigatus"}, {"id": "B", "text": "Aspergillus flavus"}, {"id": "C", "text": "Aspergillus niger"}, {"id": "D", "text": "Penicillium chrysogenum"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given clinical picture and the microscopic appearance is suggestive of fungal rhinosinusitis.\nThe most probable causative organism is Aspergillus fumigatus. It is commonly involved in\nparanasal sinus mycoses (fungal sinusitis).\n\n\n\nThe disease has been described to have four types:\n+ allergic\n* non-invasive\n+ invasive\n* fulminant\nA possible fifth type called non-invasive destructive type may also exist.\nZygomycetes like mucor and rhizopus are the common agents in fulminant type of fungal\nsinusitis.\nThe characteristic microscopic appearance of Aspergillus fumigatus:\n+ The vesicle is conical.\n+ Phialides are arranged in a single row.\n* Conidia arise from the upper third of the vesicle and are hyaline.\nOption B: Aspergillus flavus appears as follows:\n+ The vesicle is globular.\n+ Phialides are arranged in one or two rows.\n* Conidia arise from the entire vesicle and are hyaline.\nOption C: Aspergillus niger appear as follows:\n\n\n\n+ The vesicle is globular shaped.\n+ Phialides are in two rows.\n* Conidia arise from the entire vesicle and are black.\nOption D: Penicillium chrysogenum appear as follows:\n+ Septate hyphae with branched conidiophores bearing chains of spores(brush or broom\nappearance).", "questionPages": [477, 478], "solutionPages": [484, 485, 486], "questionFigures": ["crop-question-ch29-q10-1"], "solutionFigures": ["crop-solution-ch29-q10-1", "crop-solution-ch29-q10-2", "crop-solution-ch29-q10-3"]}, {"id": "ch29-q11", "chapterId": 29, "chapter": "Opportunistic Mycoses", "number": 11, "text": "What is the drug of choice for invasive pulmonary aspergillosis?", "options": [{"id": "A", "text": "Itraconazole"}, {"id": "B", "text": "Voriconazole"}, {"id": "C", "text": "Lyophylised Amphotericin B"}, {"id": "D", "text": "Posaconazole"}], "correctIndex": 1, "correctLetter": "B", "solution": "Voriconazole is the drug of choice in the treatment of invasive pulmonary aspergillosis. It can\nalso be used against candida species (including glabrata and krusei), scedosporium and fusarium.\n\n\n\nThe other options can be used as alternatives for the treatment of invasive pulmonary\naspergillosis if voriconazole is unavailable.", "questionPages": [478], "solutionPages": [486, 487], "questionFigures": [], "solutionFigures": []}, {"id": "ch29-q12", "chapterId": 29, "chapter": "Opportunistic Mycoses", "number": 12, "text": "B 1-3 glucan assay is used to diagnose all except?", "options": [{"id": "A", "text": "Candidiasis"}, {"id": "B", "text": "Aspergillosis"}, {"id": "C", "text": "Pneumocystis pneumonia"}, {"id": "D", "text": "Mucormycosis"}], "correctIndex": 3, "correctLetter": "D", "solution": "The B 1-3 glucan assay cannot be used to diagnose mucormycosis. This condition is usually\ndiagnosed based on clinical features and culture.\nThe test detects the presence of (1-3)--d-glucan (BDG) which is an abundant cell wall\npolysaccharide found in most fungi.\nIt is a chromogenic, quantitative enzyme immunoassay (EIA) designed to detect beta D Glucan by\nusing purified, lysed horseshoe crab (Limulus polyphemus) amebocytes. 1,3 Beta D Glucan level of\n>80 pg/mL is considered a positive result.\nFungi that do not contain BDG in their cell walls include\n* Cryptococcus neoformans\n+ Zygomycetes like rhizopus and mucor\n+ Blastomyces dermatitidis\nMucormycosis is an opportunistic mycosis caused by zygomycetes, which do not contain\n(1-3)-B-d-glucan, and hence, the B 1-3 glucan assay cannot be used for its diagnosis.", "questionPages": [478], "solutionPages": [487], "questionFigures": [], "solutionFigures": []}, {"id": "ch29-q13", "chapterId": 29, "chapter": "Opportunistic Mycoses", "number": 13, "text": "Which fungus is most commonly associated with orbital cellulitis in patients with diabetic\nketoacidosis ?", "options": [{"id": "A", "text": "Candida"}, {"id": "B", "text": "Rhizopus"}, {"id": "C", "text": "Aspergillus"}, {"id": "D", "text": "Trichophyton"}], "correctIndex": 1, "correctLetter": "B", "solution": "Rhizopus is the most common fungus associated with orbital cellulitis in patients with diabetic\nketoacidosis.\nDiabetic patients are immunocompromised and so prone to develop opportunistic infections.\nOrbital cellulitis with Rhizopus may turn fatal in these patients as it is an angioinvasive fungus\nand could lead to septicemia and thromboses.", "questionPages": [478], "solutionPages": [487], "questionFigures": [], "solutionFigures": []}, {"id": "ch29-q14", "chapterId": 29, "chapter": "Opportunistic Mycoses", "number": 14, "text": "A 68-year-old post-COVID-19 patient presented with a black, foul-smelling nasal discharge\nand blurred vision. On examination, a blackish necrotic mass eroding the septum and hard\npalate was visualised. Lactophenol cotton blue mount from the culture is given below. Which\nof the following statements is false regarding the condition?", "options": [{"id": "A", "text": "It is a fatal condition"}, {"id": "B", "text": "Iron administration to patients with active infection should be avoided"}, {"id": "C", "text": "Posaconazole can be used to treat it"}, {"id": "D", "text": "Pulmonary form is the most common"}], "correctIndex": 3, "correctLetter": "D", "solution": "The given clinical scenario and the LPCB mount showing aseptate hyphae branching at\nright-angles is strongly suggestive of mucormycosis. Rhino-orbito-cerebral mucormycosis is the\nmost common form of mucormycosis. Pulmonary mucormycosis is the second most common\nform.\nMucormycosis is an invasive disease caused principally by species of Rhizopus, Mucor,\nand Lichtheimia. The disease is often characterized by hyphae growing in and around the blood\nvessels. It can turn fatal on cerebral involvement and development of speticemia.\nRisk factors for the infection include:\n+ Diabetes (Diabetic ketoacidosis).\n\n\n\n+ Elevated levels of free iron.\n* Defects in phagocytic function.\n* Organ or hematopoietic stem transplantation.\nTreatment of choice is Amphotericin-B. Posaconazole can be used as an alternative drug.", "questionPages": [478, 479, 480], "solutionPages": [487, 488], "questionFigures": ["crop-question-ch29-q14-1"], "solutionFigures": []}, {"id": "ch30-q1", "chapterId": 30, "chapter": "General Parasitology", "number": 1, "text": "A 9-year-old child infected with Toxocara canis is diagnosed to have visceral larva migrans. It\nis an example of .", "options": [{"id": "A", "text": "Obligate parasite"}, {"id": "B", "text": "Facultative parasite"}, {"id": "C", "text": "Accidental parasite"}, {"id": "D", "text": "Aberrant parasite"}], "correctIndex": 3, "correctLetter": "D", "solution": "Toxocara canis (dog roundworm) infecting a human is an example of an aberrant parasite. It is\ndefined as a parasite that infects a host where they cannot develop further.\nParasites can be classified as:\n+ Ectoparasites - inhabit only the body surface of the host without penetrating the tissue. The term\ninfestation is often used for parasitization. e.g., lice, ticks, and mites.\n+ Endoparasite - lives within the body of the host and causes infection.\nEndoparasites are further classified as follows:\n* Obligate parasites - cannot exist without a host. e.g., Toxoplasma gondii and Plasmodium.\n+ Facultative parasites - exist as either parasitic or free-living forms. e.g., Naegleria fowleri.\n+ Accidental parasites - infects an unusual host. e.g., Echinococcus granulosus infects man\n+ Aberrant/Wandering parasites - infects a host where they cannot develop further. e.g., Toxocara\ncanis (dog roundworm) infecting humans.", "questionPages": [489], "solutionPages": [495], "questionFigures": [], "solutionFigures": []}, {"id": "ch30-q2", "chapterId": 30, "chapter": "General Parasitology", "number": 2, "text": "Which of the following refers to a host in which the larval stage of the parasite remains viable\nwithout further development?", "options": [{"id": "A", "text": "Definitive host"}, {"id": "B", "text": "Intermediate host"}, {"id": "C", "text": "Paratenic host"}, {"id": "D", "text": "Reservoir host"}], "correctIndex": 2, "correctLetter": "C", "solution": "A host in which the larval stage of the parasite remains viable without further development is\nreferred to as the paratenic host.\nFor example, in the lifecycle of Diphyllobothrium latum (fish tapeworm), humans are the\ndefinitive host. The first intermediate host is cyclops and the second is small freshwater fish. If the\nsmall freshwater fish with the plerocercoid larva get eaten by a larger fish, the larva survives in the\nlarger fish. This makes the larger fish a paratenic host.\nHost is an organism that harbors the parasite and provides nourishment and shelter to it. It is\nrelatively larger than the parasite.\nTypes of hosts:\n+ Definitive host - harbors stages of sexual reproduction of the parasite.\n+ Intermediate host - harbors stages of asexual multiplication of the parasite.\n+ Paratenic host - harbors only the larval stage of the parasite which remains viable without\nfurther development.\n+ Reservoir host - harbors the parasite and acts as an important source of infection to other\nsusceptible hosts, especially in endemic areas.\n+ Accidental host - harbors a parasite that is not usually found in the host.", "questionPages": [489], "solutionPages": [495], "questionFigures": [], "solutionFigures": []}, {"id": "ch30-q3", "chapterId": 30, "chapter": "General Parasitology", "number": 3, "text": "A 46-year-old farmer came to the clinic with cough and chest pain for one week and fatigue\nfor a month. He was diagnosed to have a hydatid cyst in his right lung. Which of the following\nclasses does the causative organism of this disease belong to?", "options": [{"id": "A", "text": "Cestodes"}, {"id": "B", "text": "Nematodes"}, {"id": "C", "text": "Trematodes"}, {"id": "D", "text": "Zoonoses"}], "correctIndex": 0, "correctLetter": "A", "solution": "The causative organism of hydatid disease is Echinococcus granulosus and it belongs to the\nclass cestodes.\nIt is a tape-like, segmented worm. It infects man accidentally, giving rise to hydatid cysts.\n\n\n\nThe image below shows the classification of parasites.\nNote: Zoonoses refers to diseases caused by zoonotic organisms. It is not a class of organisms.", "questionPages": [489], "solutionPages": [495, 496], "questionFigures": [], "solutionFigures": ["crop-solution-ch30-q3-1"]}, {"id": "ch30-q4", "chapterId": 30, "chapter": "General Parasitology", "number": 4, "text": "Which of the following is the smallest cestode infecting humans?", "options": [{"id": "A", "text": "Diphyllobothrium latum"}, {"id": "B", "text": "Hymenolepis nana"}, {"id": "C", "text": "Heterophyes heterophyes"}, {"id": "D", "text": "Strongyloides stercoralis"}], "correctIndex": 1, "correctLetter": "B", "solution": "The smallest cestode infecting humans is Hymenolepis nana.\nOption A: Diphyllobothrium latum is the longest cestode infecting man.\nOption C: Heterophyes heterophyes is the smallest trematode infecting man.\nOption D: Strongyloides stercoralis is the smallest nematode infecting man.\nAlso, Fasciolopsis buski is the largest trematode infecting humans.", "questionPages": [489, 490], "solutionPages": [496], "questionFigures": [], "solutionFigures": []}, {"id": "ch30-q5", "chapterId": 30, "chapter": "General Parasitology", "number": 5, "text": "Which of the following parasites has a direct life cycle?", "options": [{"id": "A", "text": "Enterobius vermicularis"}, {"id": "B", "text": "Taenia solium"}, {"id": "C", "text": "Toxoplasma gondii"}, {"id": "D", "text": "Trichinella spiralis"}], "correctIndex": 0, "correctLetter": "A", "solution": "Enterobius vermicularis has a direct life cycle.\nParasite requiring a single host to complete its development is said to have a direct life cycle.\nParasites having a direct life cycle are:\nParasite requiring two or more hosts to complete its development is said to have indirect life\ncycle, e.g. Plasmodium spp.", "questionPages": [490], "solutionPages": [496, 497], "questionFigures": [], "solutionFigures": ["crop-solution-ch30-q5-1"]}, {"id": "ch30-q6", "chapterId": 30, "chapter": "General Parasitology", "number": 6, "text": "Match the following:", "options": [{"id": "A", "text": "1-B, 2-D, 3-C, 4-A"}, {"id": "B", "text": "1-B, 2-D, 3-A, 4-C"}, {"id": "C", "text": "1-D, 2-B, 3-A, 4-C"}, {"id": "D", "text": "1-D, 2-A, 3-B, 4-C"}], "correctIndex": 1, "correctLetter": "B", "solution": "The correct answer is option B.\nA boy from Kolkata with fever and massive splenomegaly is likely suffering from Kala-azar caused\nby Leishmania donovani. Its intermediate host is sandfly.\nA lady from Kerala with bilateral non-pitting pedal edema is likely suffering from lymphatic\nfilariasis caused by Wuchereria bancrofti. Its intermediate host is the culex mosquito.\n\n\n\nA man presenting with new-onset seizures and MRI brain showing cyst with a dot sign is likely\nsuffering from neurocysticercosis caused by ingestion of Taenia solium eggs (Cysticercus\ncellulose). The intermediate host of Taenia Solium is the pig.\nA woman having fever with her peripheral smear showing Maltese cross appearance is likely\nsuffering from babesiosis caused by Babesia microti. Its intermediate host is human.", "questionPages": [490], "solutionPages": [497, 498, 499], "questionFigures": [], "solutionFigures": ["crop-solution-ch30-q6-1", "crop-solution-ch30-q6-2", "crop-solution-ch30-q6-3"]}, {"id": "ch30-q7", "chapterId": 30, "chapter": "General Parasitology", "number": 7, "text": "An entomologist who had recently visited Mexico presented to the OPD with fever, fatigue,\nand an alleged history of contact with the insect given in the image. Which of the following\ndiseases is it a biological vector for?\n\n\n\n< F h% tf\ni Maeg", "options": [{"id": "A", "text": "Sleeping sickness"}, {"id": "B", "text": "Leishmaniasis"}, {"id": "C", "text": "Babesiosis"}, {"id": "D", "text": "Chagas disease"}], "correctIndex": 3, "correctLetter": "D", "solution": "The image shows reduviid bug which is the biological vector for the transmission of\nChagas disease. Acute Chagas disease can present as fever with fatigue and a subcutaneous\nswelling known as a chagoma. It may lead to fatal myocarditis.\nBiological vectors not only help in the transfer of parasites but the parasites undergo development\nor multiplication in their body as well. They are also called true vectors.\nExamples of biological vectors are:\n* Mosquito - Malaria, filariasis\n* Sandfly - Kala-azar\n+ Tsetse fly - Sleeping sickness\n* Reduviid bugs - Chagas disease\n* Ticks - Babesiosis", "questionPages": [490, 491], "solutionPages": [499], "questionFigures": ["crop-question-ch30-q7-1"], "solutionFigures": []}, {"id": "ch30-q8", "chapterId": 30, "chapter": "General Parasitology", "number": 8, "text": "Autoinfection is not seen with which of the following parasites?", "options": [{"id": "A", "text": "Strongyloides stercoralis"}, {"id": "B", "text": "Taenia solium"}, {"id": "C", "text": "Hymenolepis nana"}, {"id": "D", "text": "Ascaris lumbricoides"}], "correctIndex": 3, "correctLetter": "D", "solution": "Autoinfection is not seen in infection with Ascaris lumbricoides.\nAutoinfection refers to either of the following:\n+ Reinfection by microbes or parasitic organisms that are present on or within the body. It is also\nknown as internal reinfection. e.g., Strongyloides.\n+ Self-infection by direct contact with a contagious agent, as with parasite eggs in the infectious\nstate transmitted by fingernails. e.g., Pinworm.\nThe following are the parasites causing autoinfection (mnemonic: CHEST.C)\n\n\n\n* Cryptosporidium parvum\n+ Hymenolepis nana\n+ Enterobius vermicularis\n+ Strongyloides stercoralis\n+ Taenia solium\n+ Capillaria philippinensis.", "questionPages": [491], "solutionPages": [499, 500], "questionFigures": [], "solutionFigures": []}, {"id": "ch30-q9", "chapterId": 30, "chapter": "General Parasitology", "number": 9, "text": "A microbiologist is doing research about antigenic variations in parasites. Which of the\nfollowing parasites will exhibit this phenomenon?", "options": [{"id": "A", "text": "Trypanosoma brucei"}, {"id": "B", "text": "Hymenolepis nana"}, {"id": "C", "text": "Taenia solium"}, {"id": "D", "text": "Enterobius vermicularis"}], "correctIndex": 0, "correctLetter": "A", "solution": "Trypanosoma brucei exhibits antigenic variation within the host. This genetic switch protects\nthem from antibodies.\nThese trypanosomes exhibit unique antigenic variations of their glycoproteins. There is a cyclical\nfluctuation in the trypanosomes occurring in the blood of infected vertebrates after every 7-10\ndays.\nParasites exhibiting antigenic variation include:\n+ Trypanosoma brucei gambiense\n+ Trypanosome brucei rhodesiense\n+ Plasmodium spp.\n* Giardia lamblia\nThe following image shows Trypanosoma brucei.\nThe following image shows Plasmodium spp.\n\n\n\nThe following image shows the trophozoite of Giardia lamblia.", "questionPages": [491, 492], "solutionPages": [500, 501], "questionFigures": [], "solutionFigures": ["crop-solution-ch30-q9-1", "crop-solution-ch30-q9-2"]}, {"id": "ch30-q10", "chapterId": 30, "chapter": "General Parasitology", "number": 10, "text": "You order a peripheral blood film examination while evaluating a patient with pyrexia of\nunknown origin. Which of the following organisms cannot be detected by this investigation?", "options": [{"id": "A", "text": "Giardia"}, {"id": "B", "text": "Trypanosoma"}, {"id": "C", "text": "Babesia"}, {"id": "D", "text": "Leishmania"}], "correctIndex": 0, "correctLetter": "A", "solution": "Stool examination is useful for the detection of Giardia lamblia, not peripheral blood film\nexamination.\nExamination of blood is of vital importance for demonstrating parasites that circulate in blood\nvessels.\nExamples of parasites found in the peripheral blood film:", "questionPages": [492], "solutionPages": [501, 502], "questionFigures": [], "solutionFigures": ["crop-solution-ch30-q10-1"]}, {"id": "ch30-q11", "chapterId": 30, "chapter": "General Parasitology", "number": 11, "text": "A Giemsa stain of a thin peripheral smear is prepared. Which of the following cannot be\ndiagnosed?", "options": [{"id": "A", "text": "Coxiella burnetii"}, {"id": "B", "text": "Toxoplasma gondii"}, {"id": "C", "text": "Bartonella henselae"}, {"id": "D", "text": "Ehrlichia chaffeensis"}], "correctIndex": 0, "correctLetter": "A", "solution": "The diagnosis of Coxiella burnetii cannot be done using a Giemsa stain of a thin peripheral smear.\nIt is done mainly by serology, which shows a rise in the titer of specific antibodies to C. burnetii.\nMicroorganisms such as Histoplasma, Leishmania, Toxoplasma, and Pneumocystis can also be\ndetected with Giemsa, and in gastric tissues, Helicobacter pylori (H. pylori) appear thin and\ndistinctly blue. Giemsa’s stain is frequently used for diagnostic purposes in haematology to\ndifferentiate the nuclear and cytoplasmic morphology of platelets, RBCs, WBCs, and parasites.", "questionPages": [492], "solutionPages": [502], "questionFigures": [], "solutionFigures": []}, {"id": "ch30-q12", "chapterId": 30, "chapter": "General Parasitology", "number": 12, "text": "A patient has presented to the PHC with fever and chills. You order a rapid diagnostic test to\ndetect HRP-2 antigen. Which of the following diseases is it used to diagnose?", "options": [{"id": "A", "text": "Malaria"}, {"id": "B", "text": "Filaria"}, {"id": "C", "text": "Amoebiasis"}, {"id": "D", "text": "Giardiasis"}], "correctIndex": 0, "correctLetter": "A", "solution": "HRP-2 antigen detection is used in the diagnosis of malaria.\nMalaria antigens detected by the rapid immunochromatographic test are:\n* pLDH - positivity is seen in all Plasmodium species\n* HRP-2 - positivity is specific for P. falciparum\nThe below image shows rapid diagnostic test (RDT) kit for malaria.", "questionPages": [492], "solutionPages": [502], "questionFigures": [], "solutionFigures": ["crop-solution-ch30-q12-1"]}, {"id": "ch30-q13", "chapterId": 30, "chapter": "General Parasitology", "number": 13, "text": "In a patient with a positive Casoni's skin test, which of the following infections will you\nsuspect?", "options": [{"id": "A", "text": "Schistosomiasis"}, {"id": "B", "text": "Kala-azar"}, {"id": "C", "text": "Hydatid disease"}, {"id": "D", "text": "Toxoplasmosis"}], "correctIndex": 2, "correctLetter": "C", "solution": "Casoni’s skin test is done in patients with hydatid disease.\nIt is an immediate hypersensitivity reaction (type I).\nThis test is abandoned now due to non-specificity and has been supplemented by serological tests.", "questionPages": [492, 493], "solutionPages": [502, 503], "questionFigures": [], "solutionFigures": []}, {"id": "ch30-q14", "chapterId": 30, "chapter": "General Parasitology", "number": 14, "text": "A patient presented to the OPD with cough, chest pain, and expectoration of rusty colored\nsputum. He is diagnosed to have an oriental lung fluke infection. Which of the following\nparasites is implicated here?", "options": [{"id": "A", "text": "Clonorchis sinensis"}, {"id": "B", "text": "Paragonimus Westermani"}, {"id": "C", "text": "Fasciolopsis buski"}, {"id": "D", "text": "Metagonimus yokogawai"}], "correctIndex": 1, "correctLetter": "B", "solution": "Paragonimus westermani is commonly known as oriental lung fluke or Japanese lung fluke. It\ncauses a pulmonary syndrome characterised by cough, chest pain and hemoptysis.\nParagonimus westermani is a trematode. The transmission to humans occurs by eating raw or\nundercooked crab or crayfish containing metacercariae. The metacercariae excyst in the human\ngut and young worms migrate to the lungs, where they become encapsulated in lung tissue.\nThe patient complains of cough, chest pain, and hemoptysis. The viscous sputum is speckled with\ngolden-brown eggs.\nTreatment: Praziquantel (25 mg/ kg TDS for 1-2 days) is the drug of choice.\nThe following image shows the life cycle of Paragonimus westermani, the oriental lung fluke.\n© ere cncyot nto metacerearoe, ub\n28 8) Ae CDC\nFS\n= el fs ™ ig\nHumana gest\nN44 - Sse\n~ 0,4 - same\n— [ A y) [7)\n~~ —“~ ~ —_ |Excyst in\n° we A“ a Jduodenum\nMiracidia hatch AL eal r=)\nand penetrate snail a,\nwe ”\\|\\@\n: Adults in cystic\n@emoryonated 6995 AT erately eggs", "questionPages": [493], "solutionPages": [503], "questionFigures": [], "solutionFigures": []}, {"id": "ch30-q15", "chapterId": 30, "chapter": "General Parasitology", "number": 15, "text": "A college student from Mangalore comes to the OPD with intermittent fever, headache, and\nchills for 1 week. She gives a history of malaria 1 year back for which she had received\ntreatment. Which of the following species you would expect to see in the peripheral smear of\nthis patient?", "options": [{"id": "A", "text": "Plasmodium vivax and falciparum"}, {"id": "B", "text": "Plasmodium ovale and falciparum"}, {"id": "C", "text": "Plasmodium vivax and ovale"}, {"id": "D", "text": "Plasmodium vivax and malariae"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given clinical scenario is suggestive of malaria relapse and it is caused by Plasmodium vivax\nand Plasmodium ovale species.\nIn case of P.vivax and P.ovale, two kinds of sporozoites are seen. Some multiply inside hepatic\ncells to form schizonts while others persist and remain dormant as hypnozoites (resting forms).\nThese dormant forms may get activated and release merozoites, which go on infecting RBCs\nproducing true clinical relapse. It usually occurs after 6 to 12 months of complete cure from the\ndisease.\n\n\n\nIn case of P.falciparum and P.malariae, the initial tissue phase disappears completely and no\nhypnozoites are found, hence relapse is not seen.\nIn Plasmodium falciparum, recrudescence can be seen which is defined as the recurrence of\nasexual parasitemia. It usually occurs within 8 weeks of treatment and is due to incomplete\ntreatment or drug resistance.", "questionPages": [493], "solutionPages": [503, 504], "questionFigures": [], "solutionFigures": []}, {"id": "ch30-q16", "chapterId": 30, "chapter": "General Parasitology", "number": 16, "text": "A middle-aged woman comes to the clinic with abdominal pain, diarrhea, fatigue, and weight\nloss. Stool examination revealed bile-stained eggs. Which of the following organisms may not\nbe implicated in this case?", "options": [{"id": "A", "text": "Ascaris lumbricoides"}, {"id": "B", "text": "Trichuris trichuria"}, {"id": "C", "text": "Enterobius vermicularis"}, {"id": "D", "text": "Taenia solium"}], "correctIndex": 2, "correctLetter": "C", "solution": "Enterobius vermicularis eggs are non-bile stained and the others are bile stained.\nEnterobiasis commonly occurs in young children and is characterised by anal pruritus. The\nworm may migrate up to the uterus, fallopian tubes and into the peritoneum in adult women. This\ncan lead to:\n* Chronic salpingitis\n* Cervicitis\n+ Peritonitis\n* Recurrent urinary tract infections.", "questionPages": [493], "solutionPages": [504], "questionFigures": [], "solutionFigures": []}, {"id": "ch30-q17", "chapterId": 30, "chapter": "General Parasitology", "number": 17, "text": "You are examining a wet mount stool sample of a patient with diarrhea. As the eggs are not\nvisible, you concentrate the sample using the saturated salt solution technique. Which of the\nfollowing eggs will not float in this technique?", "options": [{"id": "A", "text": "Trichuris tricuhria"}, {"id": "B", "text": "Hymenolopis nana"}, {"id": "C", "text": "Strongyloides stercoralis"}, {"id": "D", "text": "Enterobius vermicularis"}], "correctIndex": 2, "correctLetter": "C", "solution": "The eggs of Strongyloides stercoralis will not float in a saturated salt solution.\nConcentration methods are used when the parasites in stool are scanty and difficult to identify in\nroutine stool examination. It is of 2 types:\n+ Floatation methods- the feces are suspended in a solution of high specific gravity and eggs will\nfloat up. e.g. saturated salt solution technique, zinc sulfate centrifugal floatation technique.\n* Sedimentation Methods - the feces are suspended in a solution with low specific gravity and eggs\nwill sediment at the bottom. e.g. formol-ether sedimentation technique.", "questionPages": [493, 494], "solutionPages": [504], "questionFigures": [], "solutionFigures": []}, {"id": "ch31-q1", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 1, "text": "The life cycle given below is of which of the following:", "options": [{"id": "A", "text": "E. vermicularis"}, {"id": "B", "text": "A. duodenal"}, {"id": "C", "text": "B. coli"}, {"id": "D", "text": "E. histolytica"}], "correctIndex": 3, "correctLetter": "D", "solution": "The given life cycle is of Entamoeba histolytica.\nIts life cycle includes 2 stages - the motile trophozoite and the non-motile cyst, both of which are\nseen in the image shown above. The transmission is primarily by the fecal-oral route. There is no\nanimal reservoir.\nThe ingested cysts differentiate into trophozoites in the ileum which invade the colonic\nepithelium. The trophozoites penetrate to the submucosal layer and form abscesses which break\ndown to form flask-shaped ulcer.\nThe trophozoites multiply by binary fission and produce cysts, and both stages are passed in the\nfeces. Trophozoites are rapidly destroyed outside the body. Cysts survive in the external\nenvironment and are responsible for transmission.\nThe most frequent site of systemic disease is the liver.\nNote: The genus Entamoeba has four morphologically identical species - E. histolytica, E. dispar,\nE. bangladeshi, and E. moshkovskii. E. moshkovskii which was initially thought to be\nnon-pathogenic has recently been shown to be a causative agent of non-invasive diarrhea.", "questionPages": [505], "solutionPages": [], "questionFigures": ["crop-question-ch31-q1-1"], "solutionFigures": []}, {"id": "ch31-q2", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 2, "text": "A 40-year-old man is diagnosed to have amoebic dysentery. Which of the following is the\ninfective form of the protozoan causing this disease?", "options": [{"id": "A", "text": "Trophozoite"}, {"id": "B", "text": "Mature quadrinucleate cyst"}, {"id": "C", "text": "Metacyclic trophozoite"}, {"id": "D", "text": "Precyst"}], "correctIndex": 1, "correctLetter": "B", "solution": "The mature quadrinucleate cyst is the infective form of Entamoeba histolytica causing amoebic\ndysentery. It is passed in feces and can remain viable under moist conditions for about 10 days.\nThe following are the characteristic features of various life stages of Entamoeba histolytica:\nThe trophozoite is found only in tissues. Its cytoplasm has a ground-glass appearance. The\nnucleus has a central karyosome with radiating fibrils called linin network giving a cartwheel\nappearance. Pseudopodia are present which exhibit gliding motility.\nThe below image shows trophozoite form.\n\n\n\nThe precystic stage has a large glycogen vacuole and 2 chromatid bars. It secretes a refractile cyst\nwall to become a cyst.\nThe cystic stage has a mature cyst with 4 nuclei and no glycogen mass. Chromatid bars disappear.\nThe below image shows cystic form.", "questionPages": [505], "solutionPages": [519], "questionFigures": [], "solutionFigures": ["crop-solution-ch31-q2-1", "crop-solution-ch31-q2-2"]}, {"id": "ch31-q3", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 3, "text": "A 25-year-old woman presented with complaints of abdominal pain and 6 episodes of passing\nfoul-smelling dark stool mixed with mucus and blood streaks. There is no history of fever and\ntenesmus. On examination, vitals are stable and localized tenderness is present in the right\niliac fossa. Which of the following is most likely to cause this condition?", "options": [{"id": "A", "text": "Giardia lamblia"}, {"id": "B", "text": "Entamoeba histolytica"}, {"id": "C", "text": "Campylobacter jejuni"}, {"id": "D", "text": "Shigella dysenteriae"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given clinical scenario is suggestive of amoebic dysentery and the causative agent is\nEntamoeba histolytica.\nClinical features of intestinal amebiasis:\n+ Acute intestinal amebiasis- dysentery, lower abdominal discomfort, and flatulence.\n\n\n\n* Chronic amebiasis- low-grade symptoms such as occasional diarrhea, weight loss, and fatigue.\n* The amoebic ulcer which is flask-shaped is the typical lesion seen in intestinal amoebiasis. The\nulcers are multiple and are confined to the colon. Sometimes, in secondary intestinal lesions, the\nulcers are numerous in the cecum, followed by the sigmoido-rectal region.\nA granulomatous lesion called an ameboma may form in the cecal or rectosigmoid areas of the\ncolon which can resemble an adenocarcinoma of the colon.\nThe most appropriate treatment is intravenous metronidazole.\nOption A - Giardia is often asymptomatic, but in some cases can lead to fat malabsorption, dull\nepigastric pain, and flatulence.\nOption C - Campylobacter presents with fever, pain, and watery diarrhea. The stool contains\nleucocytes and blood.\nOption D - Shigella causes bacillary dysentery which is characterised by fever and generalised\nabdominal tenderness.", "questionPages": [505, 506], "solutionPages": [519, 520], "questionFigures": [], "solutionFigures": []}, {"id": "ch31-q4", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 4, "text": "You received a stool sample of a patient suspected to have dysentery in the microbiology lab.\nOn microscopy, you observe the structures shown in the image. What other findings you will\nexpect to see in this stool sample?", "options": [{"id": "A", "text": "RBCs as discrete or in rouleaux"}, {"id": "B", "text": "Charcot-Leyden crystals"}, {"id": "C", "text": "Abundant cellular exudates"}, {"id": "D", "text": "Absent eosinophils"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given image is showing erythrophagocytosis (trophozoite with ingested RBCs) and this in the\nstool sample of a patient with features of dysentery is indicative of amoebic dysentery. The other\nstool microscopic finding seen in amoebic dysentery is Charcot-Leyden crystals.\nThe ingested erythrocytes appear as dark inclusions. Erythrophagocytosis is the only\ncharacteristic that can be used to morphologically differentiate E. histolytica from the\nnonpathogenic entamoeba.\nAmoebic dysentery:\nClinically, it is insidious in onset with localized abdominal tenderness. Tenesmus, toxicity, and\nfever are absent.\nUnder microscopy, RBCs are clumped, yellowish-brown in color. Charcot-Leyden crystals and\neosinophils are present.\nCharcot-Leyden crystals are diamond-shaped, clear, and refractile structures that may be seen in\nstool specimens under microscopy and represent breakdown products of eosinophils.\nThe below image shows Charcot-Leyden crystals:", "questionPages": [506], "solutionPages": [520, 521], "questionFigures": ["crop-question-ch31-q4-1"], "solutionFigures": ["crop-solution-ch31-q4-1"]}, {"id": "ch31-q5", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 5, "text": "A patient with abdominal pain and mucus in stool is diagnosed to have intestinal amoebiasis.\nWhich of the following is the most common extraintestinal complication of this disease?", "options": [{"id": "A", "text": "Hepatic amoebiasis"}, {"id": "B", "text": "Pulmonary amoebiasis"}, {"id": "C", "text": "Amoebic appendicitis"}, {"id": "D", "text": "Splenic abscess"}], "correctIndex": 0, "correctLetter": "A", "solution": "The most common extraintestinal complication of amoebiasis is hepatic amoebiasis.\nIn intestinal amoebiasis, most of the trophozoites reach the liver. However, only a small portion of\nthem actually lodge and multiply in the liver cells. Patients usually present with an enlarged,\ntender liver without detectable impairment of liver function called amoebic hepatitis.\nFew patients go on to develop amoebic liver abscess. The center of the abscess contains thick\nchocolate brown pus (anchovy sauce pus), which is made up of liquefied necrotic liver tissue. It is\nbacteriologically sterile and free of amoeba. The periphery is made up of nearly normal liver tissue\ncontaining invading amoeba.\nComplications and sequelae of intestinal amoebiasis:\n+ Fulminant amoebic colitis\n* Toxic megacolon\n+ Perianal ulceration\n+ Amoeboma\n+ Extraintestinal amoebiasis\n+ Hepatic amoebiasis (most common)- Amoebic hepatitis and Amoebic liver abscess\n+ Amoebic appendicitis and peritonitis\n+ Pulmonary amoebiasis\n* Cerebral amoebiasis\n* Splenic abscess\n+ Cutaneous amoebiasis\n* Genitourinary amoebiasis", "questionPages": [506, 507], "solutionPages": [521, 522], "questionFigures": [], "solutionFigures": ["crop-solution-ch31-q5-1"]}, {"id": "ch31-q6", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 6, "text": "A 40-year-old man was brought to the casualty with complaints of nausea, vomiting and\ndisorientation. His brother tells you they had recently gone on a camping trip where they had\nswum in a freshwater lake. On examination, Kernig's sign is positive. A spinal tap is\nperformed and the findings of CSF wet mount microscopy are shown below. Which of the\nfollowing is the most likely causative organism?", "options": [{"id": "A", "text": "Naegleria fowleri"}, {"id": "B", "text": "Acanthamoeba spp."}, {"id": "C", "text": "Angiostrongylus cantonensis"}, {"id": "D", "text": "Balamuthia mandrillaris"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given clinical scenario and microscopy showing amoeboid trophozoite form with pseudopodia\nis suggestive of primary amoebic meningoencephalitis. It is caused by Naegleria fowleri.\nIt is also known as brain-eating amoeba. It occurs in 3 forms: cyst, amoeboid trophozoite and\nflagellate trophozoite forms.\nThe infection usually follows swimming in freshwater rivers or ponds. The amoebae invade the\nnasal mucosa and pass through the olfactory nerve branches in the cribriform plate into the\nmeninges. Incubation period is 2 days to 2 weeks.\nTreatment is with intravenous amphotericin B.\nOptions B & D: Both Acanthamoeba and B.mandrillaris cause granulomatous amoebic\nmeningoencephalitis which is a subacute condition.\nOption C: A. cantonensis is the most common cause of eosinophilic meningitis in Southeast Asia.\nIt is a nematode(roundworm).", "questionPages": [507], "solutionPages": [522], "questionFigures": ["crop-question-ch31-q6-1"], "solutionFigures": []}, {"id": "ch31-q7", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 7, "text": "A college student presents with ocular redness, foreign body sensation, and corneal ulcers\nfollowing the use of contact lens. The saline mount preparation of the corneal scraping shows\npolygonal cysts. What would be the most probable cause?", "options": [{"id": "A", "text": "Acanthamoeba"}, {"id": "B", "text": "Naegleria"}, {"id": "C", "text": "Entamoeba"}, {"id": "D", "text": "Onchocerca"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given clinical history and the demonstration of polygonal cysts are suggestive of amoebic\nkeratitis caused by acanthamoeba.\nAcanthamoeba culbertsoni is a free-living amoeba. It exists as trophozoite form and resistant\ncystic form. Both these forms are infective. The trophozoite is large and characterized by\nspine-like pseudopodia (acanthopodia).\nHuman beings acquire the infection by inhalation of cysts or trophozoites, ingestion of cysts, or\ndirectly through traumatized skin or eyes.\n\n\n\nIt presents as two chronic conditions- acanthamoeba keratitis and granulomatous amoebic\nencephalitis.\nDiagnosis of amoebic keratitis is made by the demonstration of the cyst in corneal scrapings by\nwet mount, histology, and culture.\nThe below image shows the ring lesion seen in acanthamoeba keratitis.\nThe below image shows cysts of acanthamoeba in lactophenol cotton blue staining.", "questionPages": [507, 508], "solutionPages": [522, 523], "questionFigures": [], "solutionFigures": ["crop-solution-ch31-q7-1"]}, {"id": "ch31-q8", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 8, "text": "Which of the following protozoan parasites is found in the lumen of the human small\nintestine?", "options": [{"id": "A", "text": "1"}, {"id": "B", "text": "2"}, {"id": "C", "text": "3"}, {"id": "D", "text": "4"}], "correctIndex": 1, "correctLetter": "B", "solution": "Image 2 shows the trophozoite of Giardia lamblia, which is the only protozoan parasite found in\nthe lumen of the human small intestine. It lives in the duodenum and upper jejunum.\n\n\n\nOther protozoan parasites found in the human small intestine do not occur in the lumen but are\npresent in the epithelial cells lining the small intestine. These include:\n+ Isospora belli\n* Cyclospora cayetanensis\n* Cryptosporidium parvum\n* Sarcocystis hominis\nOptions A and C: Entamoeba histolytica and Balantidium coli are found in the human large\nintestine.\nOption D: Trichomonas vaginalis is found in the genital tract.\nThe image given below shows the trophozoite of Giardia lamblia.\nThe image given below shows the trophozoite of Entamoeba histolytica.\n\n\n\nThe image given below shows the trophozoite of Balantidium coli.\nThe image given below shows the trophozoite of Trichomonas vaginalis.", "questionPages": [508], "solutionPages": [523, 524, 525], "questionFigures": ["crop-question-ch31-q8-1"], "solutionFigures": ["crop-solution-ch31-q8-1", "crop-solution-ch31-q8-2"]}, {"id": "ch31-q9", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 9, "text": "A 30-year-old HIV-positive patient presented with a chronic history of watery diarrhea. The\nhistopathology of the duodenum is shown in the image below. What is the likely diagnosis?", "options": [{"id": "A", "text": "Giardiasis"}, {"id": "B", "text": "Echinococcosis"}, {"id": "C", "text": "Isosporiasis"}, {"id": "D", "text": "Cryptosopridiasis"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given clinical scenario with the histopathology showing trophozoites of Giardia lamblia in the\nduodenal wall is suggestive of giardiasis.\nGiardia lamblia, also called Giardia duodenalis, is the causative agent of giardiasis. It is the only\ncommon pathogenic protozoan found in the duodenum and jejunum of humans.\nInfection occurs by the ingestion of mature cysts in contaminated water and food and\nis transmitted by the faeco-oral route.\n\n\n\nIt is weakly pathogenic in humans. Secretory IgA and IL-6 are responsible for clearing the\ninfection. Hence, giardiasis usually occurs in immunosuppressed, agammaglobulinemic, or\nmalnourished individuals.\nClinical features:\n+ Diarrhea\n+ Fat malabsorption\n+ Dull epigastric pain\n+ Belching and flatulence\n+ Iron deficiency and growth stunting.\n+ Stool will have excess mucus and fat but no blood.\nDetection of antigen by ELISA is more sensitive and specific than microscopy. Entero test is also\nused in the diagnosis.\nHistopathology of the duodenum reveals several heart-shaped or pear-shaped trophozoites with\ntwo equally sized nuclei. The small intestinal morphology is usually normal. However, in heavy\ninfections, there may be villous blunting and intraepithelial infiltrates.\nMetronidazole/tinidazole/nitazoxanide are the first-line agents in the treatment.\nThe image given below shows a magnified view of the pear-shaped trophozoites of Giardia\nlamblia.", "questionPages": [508, 509], "solutionPages": [525, 526], "questionFigures": ["crop-question-ch31-q9-1"], "solutionFigures": ["crop-solution-ch31-q9-1"]}, {"id": "ch31-q10", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 10, "text": "A patient is undergoing the test depicted in the image given below. Which of the following\ndiseases does it help to diagnose?", "options": [{"id": "A", "text": "Amoebiasis"}, {"id": "B", "text": "Trichomoniasis"}, {"id": "C", "text": "Giardiasis"}, {"id": "D", "text": "Echinococcosis"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given image depicts a string test or entero test and is used in the diagnosis of giardiasis.\nIt is a useful method for obtaining the duodenal specimen in giardiasis.\n\n\n\nIn this test, a coiled thread inside a small weighted gelatin capsule is swallowed by the patient,\nafter attaching the free end of the thread in the cheek. The capsule passes through the stomach to\nthe duodenum. After 2 hours, the thread is withdrawn, placed in saline, and is shaken. The\ncentrifuged deposit of the saline is then examined for giardia.", "questionPages": [509, 510], "solutionPages": [526, 527], "questionFigures": ["crop-question-ch31-q10-1"], "solutionFigures": []}, {"id": "ch31-q11", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 11, "text": "The findings of the microscopic examination of the wet mount preparation of stool of a\npatient with diarrhoea is shown below. Which of the following organisms will exhibit this type\nof motility?", "options": [{"id": "A", "text": "Vibrio cholera"}, {"id": "B", "text": "Giardia lamblia"}, {"id": "C", "text": "Campylobacter jejuni"}, {"id": "D", "text": "Listeria monocytogenes"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given wet mount preparation of stool shows organisms having falling leaf motility. It is\nexhibited by Giardia lamblia.\nThe trophozoite is motile with a slow oscillation along its long axis resembling a falling leaf.", "questionPages": [510], "solutionPages": [527], "questionFigures": ["crop-question-ch31-q11-1"], "solutionFigures": []}, {"id": "ch31-q12", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 12, "text": "A patient came to the gynecology OPD with complaints of foul-smelling frothy vaginal\ndischarge and intense itching. The per speculum finding is given below. Which of the\nfollowing statements is false regarding the causative organism of this disease?", "options": [{"id": "A", "text": "It exists in cyst and trophozoite form"}, {"id": "B", "text": "It is an obligate parasite"}, {"id": "C", "text": "The gold standard for diagnosis is culture on CPLM or PEM"}, {"id": "D", "text": "It can cause male infertility"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given clinical scenario with the image showing strawberry cervix is suggestive of Trichomonas\nvaginalis infection. It exists only in trophozoite form.\nTrichomonas vaginalis is the only protozoan with one stage in its life cycle ie., trophozoite form\n(no cyst stage is seen). It is an obligate parasite and cannot live without close association with\nvaginal, urethral or prostatic tissues.\nThe common presentation of trichomoniasis is foul-smelling frothy vaginal discharge, itching, and\ndysuria. The gold standard for diagnosis is culture on CPLM (cysteine-peptone-liver-maltose) or\nPEM (plastic envelope medium). The treatment of choice is metronidazole.\nT. vaginalis infection in women may lead to infertility, preterm birth and low-birth-weight infants.\nIn men, trichomoniasis has been also associated with infertility through inflammatory damage to\nthe genitourinary tract or interference with sperm function.\nThe below image shows the trophozoite form of Trichomonas vaginalis.", "questionPages": [510, 511], "solutionPages": [527, 528], "questionFigures": ["crop-question-ch31-q12-1"], "solutionFigures": ["crop-solution-ch31-q12-1"]}, {"id": "ch31-q13", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 13, "text": "A 12-year-old child presented to you with fever, malaise, and weight loss. On examination,\nyou notice the finding shown in the image. In which of the following conditions is this seen?", "options": [{"id": "A", "text": "West African sleeping sickness"}, {"id": "B", "text": "Chagas disease"}, {"id": "C", "text": "Leishmaniasis"}, {"id": "D", "text": "Babesiosis"}], "correctIndex": 0, "correctLetter": "A", "solution": "The given image shows posterior cervical lymphadenopathy which is called Winterbottom’s sign.\nIt is seen in West African sleeping sickness.\nIt is seen in stage I of West African sleeping sickness caused by Trypanosoma brucei gambiense.\nThe table below shows diseases caused by various Trypanosoma species.", "questionPages": [511, 512], "solutionPages": [528], "questionFigures": ["crop-question-ch31-q13-1"], "solutionFigures": ["crop-solution-ch31-q13-1"]}, {"id": "ch31-q14", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 14, "text": "Which of the following statements is false regarding Trypanosoma?", "options": [{"id": "A", "text": "Tsetse fly is the vector for both T. rhodesiense and T. gambiense"}, {"id": "B", "text": "T. gambiense exhibits antigenic variation"}, {"id": "C", "text": "T. rhodesiense can cause myocarditis"}, {"id": "D", "text": "Humans are the reservoir for T. rhodesiense"}], "correctIndex": 3, "correctLetter": "D", "solution": "Humans are the reservoir for T. gambiense, not for T. rhodesiense.\nThe table below shows characteristic differences between West African and East African\ntrypanosomiasis.\nParasites causing myocarditis include:\n+ Trypanosoma brucei rhodesiense\n* Trypanosoma cruzi\n* Toxoplasma gondii\n* Echinococcus granulosus\n* Trichinella spiralis", "questionPages": [512], "solutionPages": [528, 529], "questionFigures": [], "solutionFigures": ["crop-solution-ch31-q14-1", "crop-solution-ch31-q14-2"]}, {"id": "ch31-q15", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 15, "text": "A middle-aged woman presents to the OPD with fever and malaise for the past 4 months. On\nexamination, the following ocular finding is noted along with hepatosplenomegaly and\nlymphadenopathy. What is the most probable diagnosis?", "options": [{"id": "A", "text": "West African Sleeping Sickness"}, {"id": "B", "text": "Chagas disease"}, {"id": "C", "text": "Toxoplasmosis"}, {"id": "D", "text": "East African Sleeping Sickness"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given clinical scenario with the image showing Romana's sign is suggestive of Chagas disease.\nIt is caused by T. cruzi. Reduviid bugs are vectors for Chagas disease.\nInoculation of T. cruzi in conjunctiva causes unilateral, painless edema of periocular tissues in the\neye is called Romana’s sign. This is classically seen in acute Chagas disease that lasts for 1 to 4\nmonths.\nThe following image shows a patient with Romana's sign.\nAcute Chagas disease is also characterised by the presence of chagomas which are subcutaneous\nlesions occurring at the site of inoculation.\nChronic Chagas disease is characterized by megaesophagus, megacolon, and myopathy.\nShown below is an image of the Reduviid bug.\n\n\n\n‘ F . al 4\n3 MS", "questionPages": [512, 513], "solutionPages": [529, 530], "questionFigures": ["crop-question-ch31-q15-1"], "solutionFigures": ["crop-solution-ch31-q15-1", "crop-solution-ch31-q15-2"]}, {"id": "ch31-q16", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 16, "text": "Which of the following is used for the culture of Trypanosoma?", "options": [{"id": "A", "text": "NNN medium"}, {"id": "B", "text": "Boeck and Drbohlav medium"}, {"id": "C", "text": "Craig’s medium"}, {"id": "D", "text": "NIH polygenic medium"}], "correctIndex": 0, "correctLetter": "A", "solution": "NNN (Novy, McNeal, and Nicolle) medium is used for the culture of Trypanosoma brucie and\ncruzie. It is also used for the culture of Leishmania.\nThe other media used in the culture of Trypanosoma are Weinman's medium and Tobie's\nmedium.\nOptions B, C & D: Boeck and Drbohlav medium, Craig’s medium and NIH polygenic medium\nare used for the culture of E.histolytica.", "questionPages": [513], "solutionPages": [530], "questionFigures": [], "solutionFigures": []}, {"id": "ch31-q17", "chapterId": 31, "chapter": "Protozoology - Amoebae, Ciliates & Flagellates", "number": 17, "text": "The given life cycle belongs to which of the following organisms?", "options": [{"id": "A", "text": "Trypanosoma brucei rhodesiense"}, {"id": "B", "text": "Trypanosoma cruzi"}, {"id": "C", "text": "Trypanosoma brucei gambiense"}, {"id": "D", "text": "Trypanosoma rangeli"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given life cycle belongs to Trypanosoma cruzi.\nT. cruzi is the causative organism of Chagas disease or South American trypanosomiasis. They are\nintracellu

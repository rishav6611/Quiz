ule at the site of the scratch and lymph node\nenlargement and can be suppurative. The disease is usually self resolving. However, it can be\ntreated with azithromycin only in patients who have severe complications.", "questionPages": [267, 268], "solutionPages": [278], "questionFigures": ["crop-question-ch17-q15-1"], "solutionFigures": []}, {"id": "ch17-q16", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 16, "text": "Choose the correct statement regarding 5-day fever.", "options": [{"id": "A", "text": "Transmitted by Phlebotomus sandflies."}, {"id": "B", "text": "Incubation period is 5 days"}, {"id": "C", "text": "No animal reservoir is known"}, {"id": "D", "text": "Treatment is necessary only in the severe cases"}], "correctIndex": 2, "correctLetter": "C", "solution": "5-day fever is an exclusively human disease and no animal reservoir is known.\n\n\n\n5-day fever is also known as trench fever/quintan fever. It is caused by Bartonella quintana. It is\ncharacterized by sudden onset of fever accompanied by headache, malaise, restlessness, and shin\npain.\nTrench fever is transmitted by the body louse. (Option A). It has an incubation period ranging\nfrom 14-30 days. Symptoms coincide with the release of B. quintana in blood every 3-5 days with\neach episode lasting 5 days. Recrudescence and relapses are common. (Option B)\nAll cases are treated using doxycycline. Macrolides and fluoroquinolones can also be used in its\ntreatment. (Option D)", "questionPages": [268], "solutionPages": [278, 279], "questionFigures": [], "solutionFigures": []}, {"id": "ch17-q17", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 17, "text": "A young man presented to the ER with fever and suppurative lymphadenopathy of his left\naxilla a few days after he sustained a scratch from his pet cat. Which of the following will\nmost likely be seen on biopsy of the lymph node?", "options": [{"id": "A", "text": "Foreign body granuloma"}, {"id": "B", "text": "Naked granuloma"}, {"id": "C", "text": "Durck granuloma"}, {"id": "D", "text": "Stellate granuloma"}], "correctIndex": 3, "correctLetter": "D", "solution": "The given scenario points to a diagnosis of cat-scratch disease caused by B. henselae. Stellate\ngranulomas are characteristically present in this condition. They are granulomas containing\ncentral granular debris and neutrophils; giant cells are uncommon.\nThe image below shows a stellate granuloma\nOther options:\nOption A: Foreign body granulomas are incited by relatively inert foreign bodies, such as\ntalc, sutures. Epithelioid cells and giant cells are apposed to the surface of the foreign body.\nThe foreign material can usually be identified in the center of the granuloma.\nThe given image shows suture granuloma. The suture material is surrounded by lymphocytic\ninfiltration\n\n\n\nOption B: Naked granulomas are seen in sarcoidosis. They are non-caseating granulomas\nminimally surrounded by lymphocytes. The image below shows a naked granuloma\nOption C: Durck granulomas are seen in cerebral malaria. The image below shows a Durck\ngranuloma", "questionPages": [268], "solutionPages": [279, 280, 281], "questionFigures": [], "solutionFigures": ["crop-solution-ch17-q17-1", "crop-solution-ch17-q17-2", "crop-solution-ch17-q17-3"]}, {"id": "ch17-q18", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 18, "text": "A patient who is a known case of AIDS presents to the OPD with fever, chills, weight loss and\nthe cutaneous lesions shown below. The microscopic examination of the lesions revealed\npredominant neutrophilic infiltration. What is the most likely diagnosis?", "options": [{"id": "A", "text": "Kaposi sarcoma"}, {"id": "B", "text": "Verruga peruana"}, {"id": "C", "text": "Bacillary angiomatosis"}, {"id": "D", "text": "Eczema herpeticum"}], "correctIndex": 2, "correctLetter": "C", "solution": "This clinical vignette of a patient with HIV infections and the violaceous lesions with a\nneutrophilic infiltrate is suggestive of bacillary angiomatosis.\nBacillary angiomatosis is seen in severely immunocompromised patients and is caused by B.\nhenselae or B. quintana. It is characterized by neovascular proliferative lesions involving the skin.\nIt consists of lobular proliferation of small blood vessels lined by enlarged endothelial cells\ninterspersed with mixed infiltrates of neutrophils and lymphocytes, with a predominance of\nthe former.\nBoth bacillary angiomatosis and Kaposi's sarcoma can have the clinical presentation mentioned in\nthe question. However, the major differentiating factor is the microscopic examination:\n+ Bacillary angiomatosis predominantly has mixed infiltrate accompanied by neutrophils with\nclumps of bacilli.\n* Kaposi's sarcoma predominantly has plasma cells and lymphocytic infiltrates.", "questionPages": [268, 269], "solutionPages": [281], "questionFigures": ["crop-question-ch17-q18-1"], "solutionFigures": []}, {"id": "ch17-q19", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 19, "text": "A patient has presented with lesions on the dorsum of the hand followed by axillary\nlymphadenopathy. What significant history will you ask for in this case?", "options": [{"id": "A", "text": "History of exposure to rats"}, {"id": "B", "text": "History of exposure to cats"}, {"id": "C", "text": "History of similar complaint in family members"}, {"id": "D", "text": "History of tick bite"}], "correctIndex": 1, "correctLetter": "B", "solution": "This scenario of lesions on the hand followed by axillary lymphadenopathy is suggestive of cat\nscratch disease, hence we should ask about the history of exposure to cats. It is caused by\nBartonella henselae.\nBartonella henselae is an intracellular, pleomorphic, gram-negative bacillus. They can be\nidentified in lymph node biopsy with Warthin-Starry Silver stain. In addition to cat scratch\ndisease, in immunocompromised individuals, it can also cause bacillary angiomatosis and peliosis\nhepatis.\n\n\n\nIn immunocompetent hosts, cat scratch disease is a self limiting illness. However in patients with\nsevere disease, azithromycin can be used to treat the infection.", "questionPages": [269], "solutionPages": [281, 282], "questionFigures": [], "solutionFigures": ["crop-solution-ch17-q19-1"]}, {"id": "ch17-q20", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 20, "text": "Which of the following is incorrectly matched?", "options": [{"id": "A", "text": "Bartonella henselae- Bacillary angiomatosis"}, {"id": "B", "text": "Ehrlichia chaffeensis - Human monocytic ehrlichiosis"}, {"id": "C", "text": "Ehrlichia phagocytophila - Human granulocytic ehrlichiosis"}, {"id": "D", "text": "Bartonella bacilliformis - Parinaud's oculoglandular syndrome"}], "correctIndex": 3, "correctLetter": "D", "solution": "Parinaud's oculoglandular syndrome is an atypical form of cat scratch disease and is caused\nby Bartonella henselae . Bartonella henselae also causes bacillary angiomatosis in HIV-infected\nand other immunodeficient patients. . It presents as vascular nodules or tumours on the skin,\nmucosa, and other locations.\nBartonella bacilliformis causes Oroya fever also known as Carrion's disease.\nNote: Ehrlichia phagocytophila has been renamed as Anaplasma phagocytophilum.", "questionPages": [269, 270], "solutionPages": [282], "questionFigures": [], "solutionFigures": []}, {"id": "ch17-q21", "chapterId": 17, "chapter": "Miscellaneous Bacteria - Yersinia, Brucella, Bartonella, Legionella", "number": 21, "text": "A patient with fever and hemolytic anemia developed characteristic Peruvian warts 1 month\nlater. What is the causative organism for this disease?", "options": [{"id": "A", "text": "Bartonella hensalae"}, {"id": "B", "text": "Bartonella quintana"}, {"id": "C", "text": "Bartonella bacilliformis"}, {"id": "D", "text": "Bartonella australis"}], "correctIndex": 2, "correctLetter": "C", "solution": "The above clinical scenario of fever, hemolytic anemia followed by verruga peruana lesions\n(Peruvian warts) is suggestive of Oroya fever. It is caused by Bartonella bacilliformis. The vector\nfor Oroya fever is sandfly.\nOroya fever or Carrion’s disease is associated with verruga peruana which are cutaneous vascular\nlesions carrying the bacteria.\nIt presents as fever with progressive anemia due to bacterial invasion of erythrocytes. A\nlate sequela in survivors of Oroya fever or in those with asymptomatic infection is verruga\nperuana, which is characterized by vascular nodular skin lesions carrying the bacteria that occur\nin successive crops. An image of verruga peruana is given below.\nImage shows verruga peruana lesions.\n\n\n\nBartonella quintana causes trench fever or 5 day fever.\nBartonella henselae causes cat scratch disease. It also causes bacillary angiomatosis and bacillary\npeliosis in HIV infected people.", "questionPages": [270, 271], "solutionPages": [282, 283], "questionFigures": [], "solutionFigures": ["crop-solution-ch17-q21-1"]}, {"id": "ch18-q1", "chapterId": 18, "chapter": "Gram Negative Cocci", "number": 1, "text": "Which of the following is not a risk factor for Neisseria meningitidis infection?", "options": [{"id": "A", "text": "Hypergammaglobulinemia"}, {"id": "B", "text": "Mycoplasma infection"}, {"id": "C", "text": "Hyposplenism"}, {"id": "D", "text": "History of recent pilgrimage"}], "correctIndex": 0, "correctLetter": "A", "solution": "Hypogammaglobulinemia is a risk factor for Neisseria meningitidis infection,\nnot hypergammaglobulinemia.\nRisk factors for meningococcal infection include:\n* Overcrowding\n* Cigarette smoking\n* Mycoplasma infection\n* Hyposplenism\n+ Hypogammaglobulinemia\n+ History of travel like pilgrimage\n+ Recent viral infection\n* Terminal complement pathway deficiency (C5-C9 Deficiency) - increases the risk of disseminated\ngonococcemia", "questionPages": [284], "solutionPages": [], "questionFigures": [], "solutionFigures": []}, {"id": "ch18-q2", "chapterId": 18, "chapter": "Gram Negative Cocci", "number": 2, "text": "A 22-year-old student presented with high-grade fever, and purpuric rash as shown in the\nimage below. CSF sample showed gram-negative diplococci. Which of the following is the\nmost likely aetiology?", "options": [{"id": "A", "text": "Neisseria meningitidis"}, {"id": "B", "text": "Pseudomonas aeruginosa"}, {"id": "C", "text": "Streptococcus pneumoniae"}, {"id": "D", "text": "E.coli"}], "correctIndex": 0, "correctLetter": "A", "solution": "This patient has a high-grade fever and is a student, so he presumably spends a lot of time in\ncrowded areas. The above image shows a purpuric rash. This patient's features are seen in\nmeningococcemia caused by Neisseria meningitidis, which are gram-negative diplococci.\nThe organism enters the body through the nasopharynx by attaching to the epithelial cells with\nthe help of pili. From the nasopharynx, they enter the bloodstream producing bacteremia, and the\nsymptoms may resemble upper respiratory tract infection.\nFulminant meningococcemia is the severe form, where the patient presents with high-grade fever\nand hemorrhagic rash. There is thrombosis of several small blood vessels in various organs with\nperivascular infiltration and petechial hemorrhages. Some patients with fulminant\nmeningococcemia may also develop disseminated intravascular coagulation, and circulatory\ncollapse, a condition known as Waterhouse—Friderichsen syndrome.", "questionPages": [284], "solutionPages": [], "questionFigures": ["crop-question-ch18-q2-1"], "solutionFigures": []}, {"id": "ch18-q3", "chapterId": 18, "chapter": "Gram Negative Cocci", "number": 3, "text": "What is the most common manifestation of Neisseria meningitidis infection?", "options": [{"id": "A", "text": "Meningitis"}, {"id": "B", "text": "Septicaemia"}, {"id": "C", "text": "Fever"}, {"id": "D", "text": "Asymptomatic"}], "correctIndex": 3, "correctLetter": "D", "solution": "Infection with Neisseria meningitidis is most commonly asymptomatic colonization in the\nnasopharynx of healthy individuals. Hence, a nasopharyngeal swab is used in the detection of\ncarriers. In some patients, local inflammation ensues with rhinitis and pharyngitis.\nCeftriaxone as a single-dose IV/IM injection is highly (97%) effective in the eradication of carrier\nstate and can be used at all ages and also in pregnancy. Ciprofloxacin is also highly effective and\ncan be given orally, but it is not recommended in pregnancy and below 18 years of age.", "questionPages": [284, 285], "solutionPages": [292], "questionFigures": [], "solutionFigures": []}, {"id": "ch18-q4", "chapterId": 18, "chapter": "Gram Negative Cocci", "number": 4, "text": "A5-year-old girl with thalassemia major was prophylactically immunized with a\npolysaccharide meningococcal vaccine before being taken up for elective splenectomy. Which\ngroup of Neisseria meningitidis would she be susceptible to even after immunization?", "options": [{"id": "A", "text": "Group A"}, {"id": "B", "text": "Group B"}, {"id": "C", "text": "Group C"}, {"id": "D", "text": "Group Y"}], "correctIndex": 1, "correctLetter": "B", "solution": "Polysaccharide vaccines of Neisseria meningitidis do not offer protection against group B\nmeningococci. This is because the group B capsule is made up of sialic acid residue which is also\nexpressed on the surface of neural cells in the fetus. So, the B polysaccharide is perceived as ‘self’\nand is poorly immunogenic.\nTo overcome this issue and provide protection against group B meningococci, a new vaccine was\ndeveloped based on the surface protein i.e., non-capsular antigen of serogroup B meningococci.\nThis is the multicomponent meningococcal vaccine - 4CMenB.\nMeningococcal polysaccharide vaccines developed based on capsular antigen can be classified as:\n+ Plain polysaccharide vaccines:\n+ Bivalent (A and C),\n+ Trivalent (A, C and W-135)\n* Tetravalent (A, C, Y, and W-135)\n* Conjugated polysaccharide vaccines:\n* Monovalent (A or C)\n* Quadrivalent (A, C, Y, and W-135) MenQuadfi vaccine", "questionPages": [285], "solutionPages": [292], "questionFigures": [], "solutionFigures": []}, {"id": "ch18-q5", "chapterId": 18, "chapter": "Gram Negative Cocci", "number": 5, "text": "A young man is brought to the ER with complaints of headache and fever. On examination, a\nmaculopapular rash is seen over his trunk & extremities, and the following sign is\nelicited. Which of the following antibiotics should he be started on empirically?", "options": [{"id": "A", "text": "Ceftriaxone"}, {"id": "B", "text": "Rifampicin"}, {"id": "C", "text": "Ciprofloxacin"}, {"id": "D", "text": "Cefazolin"}], "correctIndex": 0, "correctLetter": "A", "solution": "The clip given shows a positive Kernig's sign. This in combination with the other clinical features\nindicates a diagnosis of meningococcal meningitis. Third-generation cephalosporins such as\nceftriaxone, cefotaxime, and ceftazidime are used empirically for the initiation of treatment for\nsuspected meningococcal meningitis.\nThese drugs are administered as they also cover the various other potentially penicillin-resistant\nbacteria that may produce clinical features similar to that of meningococcal meningitis like\npenicillin-resistant pneumococcus. Also, some instances of reduced meningococcal sensitivity to\npenicillin have also been reported.\nBoth meningococcal meningitis and meningococcal septicemia are conventionally treated for 7\ndays, although courses of 3-5 days may be equally effective. Rifampicin can be used for\nprophylaxis for close contacts. Ceftriaxone can also be used for chemoprophylaxis, especially in\npregnant individuals.\nThe image below shows petechial rashes in meningococcal infection", "questionPages": [285, 286], "solutionPages": [292, 293], "questionFigures": ["crop-question-ch18-q5-1"], "solutionFigures": ["crop-solution-ch18-q5-1"]}, {"id": "ch18-q6", "chapterId": 18, "chapter": "Gram Negative Cocci", "number": 6, "text": "You have to administer chemoprophylaxis to the contacts of a patient diagnosed with\nmeningococcal meningitis. Which of the following combinations is correct?", "options": [{"id": "A", "text": "1,2,4and5"}, {"id": "B", "text": "2,4 and 5"}, {"id": "C", "text": "1, 2, and3"}, {"id": "D", "text": "1,3and5"}], "correctIndex": 0, "correctLetter": "A", "solution": "Ciprofloxacin, ceftriaxone, and rifampicin can be used for chemoprophylaxis of meningococcal\nmeningitis.\nCiprofloxacin should not be given in pregnancy and to those below 18 years of age. Ceftriaxone is\npreferred in these cases as a single IM or IV dose. However, reduced susceptibility of isolates to\nceftriaxone has occasionally been reported.\nRecommended chemoprophylaxis for high-risk close contacts of meningococcal meningitis:", "questionPages": [286], "solutionPages": [293], "questionFigures": [], "solutionFigures": ["crop-solution-ch18-q6-1"]}, {"id": "ch18-q7", "chapterId": 18, "chapter": "Gram Negative Cocci", "number": 7, "text": "Which of the following differentiates meningococcus from gonococcus?", "options": [{"id": "A", "text": "It is oxidase positive"}, {"id": "B", "text": "It ferments glucose"}, {"id": "C", "text": "It ferments maltose"}, {"id": "D", "text": "It reduces nitrates"}], "correctIndex": 2, "correctLetter": "C", "solution": "Only meningococcus can ferment maltose, whereas both gonococcus and meningococcus can\nferment glucose.\nBoth species are catalase and oxidase positive and neither of them can reduce nitrate. The only\nNeisseria species that can reduce nitrate is N. mucosa.", "questionPages": [286], "solutionPages": [293, 294], "questionFigures": [], "solutionFigures": []}, {"id": "ch18-q8", "chapterId": 18, "chapter": "Gram Negative Cocci", "number": 8, "text": "A 30-year-old man has treatment-resistant gonorrhea. You plan to send a sample of his\nurethral discharge to the lab for culture and sensitivity testing. What transport media would\nyou use for this purpose?", "options": [{"id": "A", "text": "Cary-Blair medium"}, {"id": "B", "text": "Thayer-Martin medium"}, {"id": "C", "text": "Stuart's medium"}, {"id": "D", "text": "Pike’s medium"}], "correctIndex": 2, "correctLetter": "C", "solution": "Stuart’s medium is the transport media used for Neisseria gonorrheae and Neisseria meningitidis.\nStuart’s medium is a semisolid, non-nutrient medium, which prevents microbial proliferation. It\nensures that microorganisms present are able to survive for a sufficiently long period of time.", "questionPages": [286], "solutionPages": [294], "questionFigures": [], "solutionFigures": []}, {"id": "ch18-q9", "chapterId": 18, "chapter": "Gram Negative Cocci", "number": 9, "text": "A 25-year old man presents with a history of urethral discharge for the last three days. A gram\nstain smear of the discharge is shown below. All of the following are true regarding the likely\netiology except?", "options": [{"id": "A", "text": "Catalase and oxidase positive"}, {"id": "B", "text": "Pili is a virulence factor"}, {"id": "C", "text": "Obligate intracellular organism"}, {"id": "D", "text": "Shows twitching motility"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given slide shows gram-negative diplococci within the polymorphs, characteristic of Neisseria\ngonorrhoeae infection. Neisseria is not an obligate intracellular organism, it can also occur\nextracellularly i.e, it is a facultative intracellular organism. The other neisseria that are found as\nnormal inhabitants of the human respiratory tract occur extracellularly.\nNeisseria gonorrhoeae is a gram-negative, non-sporulating, non-motile diplococcus that\nis aerobic but may grow anaerobically also. It is oxidase and catalase-positive.\nAlthough Neisseria are non-motile organisms, they show twitching motility. This is a\nflagella-independent form of bacterial translocation over moist surfaces that occurs by the\nextension and retraction of polar type IV pili. These pili act as virulence factors by promoting\nattachment to host cells and inhibiting phagocytosis.\nVirulence factors for gonococci:\n* Outer Membrane Proteins (OMPs)\n- IgA proteases\n+ Pili\n+ Lipo-oligosaccharide (LOS)\n+ Transferrin\n+ Lactoferrin-binding protein", "questionPages": [286, 287], "solutionPages": [294], "questionFigures": ["crop-question-ch18-q9-1"], "solutionFigures": []}, {"id": "ch18-q10", "chapterId": 18, "chapter": "Gram Negative Cocci", "number": 10, "text": "Which of the following is the most common manifestation of gonorrhoea in males?", "options": [{"id": "A", "text": "Asymptomatic"}, {"id": "B", "text": "Acute urethritis"}, {"id": "C", "text": "Discharging sinus"}, {"id": "D", "text": "Genital ulcer"}], "correctIndex": 1, "correctLetter": "B", "solution": "Gonorrhea in males most commonly manifests as acute urethritis.\nIn males, the disease starts as acute urethritis. This infection may extend along the urethra to\ninvolve the prostate, seminal vesicles, and epididymis. Chronic urethritis may lead to stricture\nformation. The infection may also spread to the periurethral tissues causing abscesses and\nmultiple discharging sinuses (watercan perineum).\n\n\n\nIn females, the initial infection involves the cervix, uteri and urethra which may extend to\nBartholin glands, endometrium, and fallopian tubes. The vaginal mucosa is not usually affected in\nadults because the stratified squamous epithelium is resistant to infection by the cocci, and also\nbecause of the acidic pH of vaginal secretions.\nPelvic inflammatory disease and salpingitis may lead to sterility. Rarely peritonitis may develop\nwith perihepatic inflammation (Fitz-Hugh-Curtis syndrome) which may also occur\nfollowing Chlamydia trachomatis infection.", "questionPages": [287], "solutionPages": [294, 295], "questionFigures": [], "solutionFigures": []}, {"id": "ch18-q11", "chapterId": 18, "chapter": "Gram Negative Cocci", "number": 11, "text": "A patient with a history of sexual intercourse with a commercial sex worker 3 days back has\ndeveloped genital discharge resembling ‘flow of seed' as shown below. What medium should\nbe used for the culture of the discharge?", "options": [{"id": "A", "text": "Mannitol salt agar"}, {"id": "B", "text": "Thayer-Martin media"}, {"id": "C", "text": "Potassium tellurite agar"}, {"id": "D", "text": "TCBS agar"}], "correctIndex": 1, "correctLetter": "B", "solution": "The clinical scenario is suggestive of gonococcal urethritis caused by Neisseria\ngonorrhoeae. Thayer-Martin and modified Thayer-Martin media are used for the culture of this\norganism. Gonorrhoea may manifest as mucopurulent genital discharge which can be described\nas resembling ‘flow of seed' (semen).\nThayer-Martin medium contains vancomycin, colistin and nystatin.\nGonorrhea is a sexually transmitted disease caused by N. gonorrhea. The major symptoms include\nurethritis, vaginal discharge, dyspareunia, and dysuria. In the laboratory diagnosis of N.\ngonorrhea, the discharge on Gram's stain reveals gramMnegative intracellular diplococci within\nphagocytes. It acidifies glucose but not maltose in serum sugars. Stuart's medium is used for\ntransport while Thayer-Martin agar is used as a selective medium used to isolate N. gonorrhoeae.\nCultures can be obtained from chocolate agar or Mueller-Hinton agar.\nStuart's medium is the transport media used for Neisseria gonorrhea and Neisseria meningitides.\nIt is a semisolid, non-nutrient medium. Charcoal present in the medium neutralizes certain\nbacterial inhibitors while a reducing agent prevents oxidation.", "questionPages": [287, 288], "solutionPages": [295], "questionFigures": ["crop-question-ch18-q11-1"], "solutionFigures": []}, {"id": "ch18-q12", "chapterId": 18, "chapter": "Gram Negative Cocci", "number": 12, "text": "Which of the following is not a content of modified Thayer-Martin medium?", "options": [{"id": "A", "text": "Vancomycin"}, {"id": "B", "text": "Trimethoprim"}, {"id": "C", "text": "Nystatin"}, {"id": "D", "text": "Polymyxin B"}], "correctIndex": 3, "correctLetter": "D", "solution": "Modified Thayer-Martin medium does not include polymyxin B. It includes polymyxin E, which is\nalso known as colistin.\nModified Thayer—Martin medium is a selective media for Neisseria species. It includes:\n* Vancomycin - to inhibit most gram-positive bacteria.\n* Colistin (Polymyxin E) - to inhibit most gram-negative bacteria other than Neisseria.\n* Nystatin or anisomycin - to inhibit yeast.\n* Trimethoprim - to inhibit proteus.\nThe contents of the Thayer-Martin medium are the same as that of the modified Thayer-Martin\nmedium except for the presence of trimethoprim in the modified version. The image below depicts\nThayer-Martin medium.", "questionPages": [288], "solutionPages": [295, 296], "questionFigures": [], "solutionFigures": ["crop-solution-ch18-q12-1"]}, {"id": "ch18-q13", "chapterId": 18, "chapter": "Gram Negative Cocci", "number": 13, "text": "An unresponsive middle-aged man with fever and petechial rashes was rushed into the ER.\nYou successfully resuscitate him. Abdominal ultrasound shows bilateral adrenal hemorrhage.\nWhich of the following statements is false regarding his condition?", "options": [{"id": "A", "text": "Patients who recover may suffer from sloughing of the skin"}, {"id": "B", "text": "The implicated organism can be isolated from the petechial rashes"}, {"id": "C", "text": "The causative organism is Neisseria gonorrheae"}, {"id": "D", "text": "Hypoplastic spleen is a risk factor for this condition"}], "correctIndex": 2, "correctLetter": "C", "solution": "The above scenario depicts Waterhouse-Friderichsen syndrome which is a complication seen in\ninfection with meningococci. Waterhouse-Friderichsen syndrome is also known as hemorrhagic\nadrenalitis or fulminant meningococcemia and is characterized by bilateral adrenal gland\nhemorrhage.\nThough Waterhouse-Freiderichsen syndrome is most often associated with meningococcal\nsepticemia, it may complicate sepsis caused by other organisms like certain streptococcal species\nalso. Hypoplastic spleen may also be associated with this condition and the implicated organism\ncan be isolated from the petechial rashes.\nComplications :\n* Shock, extensive hemorrhage within the skin\n* May fall into a coma\n* Death, usually after a few hours, due to adrenal insufficiency\n+ Patients who recover may suffer from extensive sloughing of the skin and loss of digits due to\ngangrene.\nFulminant meningococcemia is a medical emergency and needs to be treated with adequate\nantibiotics as fast as possible. Ceftriaxone is an antibiotic commonly used nowadays.", "questionPages": [288, 289], "solutionPages": [296], "questionFigures": [], "solutionFigures": []}, {"id": "ch18-q14", "chapterId": 18, "chapter": "Gram Negative Cocci", "number": 14, "text": "A 30-year-old woman with a history of recurrent pelvic inflammatory disease presents to the\nOPD with fever and right upper abdominal pain. A diagnostic laparoscopy was done and the\nfindings are as given below. Which of the following organisms could be the causative agent?", "options": [{"id": "A", "text": "Treponema pallidum"}, {"id": "B", "text": "Haemophilus ducreyi"}, {"id": "C", "text": "Neisseria meningitidis"}, {"id": "D", "text": "Chlamydia trachomatis"}], "correctIndex": 3, "correctLetter": "D", "solution": "The scenario depicted is Fitz-Hugh-Curtis syndrome which is a rare complication of pelvic\ninflammatory disease (PID) following infection with Chlamydia trachomatis or Neisseria\ngonorrhoeae.\n\n\n\nIt causes liver capsule inflammation leading to the creation of violin-string adhesions which can\nbe seen on laparoscopy. On CT imaging it appears as perihepatic inflammatory stranding and\nhepatic capsular enhancement.\nThe major symptom and signs include right upper quadrant pain. It is also associated with\nminimal pelvic pain, vaginal discharge, or cervical motion tenderness.", "questionPages": [289], "solutionPages": [296, 297], "questionFigures": ["crop-question-ch18-q14-1"], "solutionFigures": []}, {"id": "ch18-q15", "chapterId": 18, "chapter": "Gram Negative Cocci", "number": 15, "text": "Which is the true statement regarding gonococcal urethritis?", "options": [{"id": "A", "text": "Symptoms are more severe in females than in males"}, {"id": "B", "text": "Infection does not involve rectum and prostate"}, {"id": "C", "text": "Dysuria is the most common presentation"}, {"id": "D", "text": "Single dose of cefixime is the first line of treatment"}], "correctIndex": 2, "correctLetter": "C", "solution": "Acute urethritis is the most common clinical manifestation of gonorrhea in males and major\nsymptoms include urethral discharge and dysuria, usually without urinary frequency or urgency.\nOther options:\nOption A: The stratified squamous epithelium of the vagina is resistant to gonococcus, so infection\nis less severe in females.\nOption B: In males, it can involve rectum, prostate, and epididymitis, but it never involves testes.\nOption D: Rising minimum inhibitory concentration of cefixime worldwide has led the CDC to\ndiscontinue its recommendation of this agent as first-line treatment for uncomplicated gonorrhea.\nThird-generation cephalosporins have remained highly effective as single-dose therapy for\ngonorrhoea. Ceftriaxone (250mg, IM) single dose + azithromycin 1 g PO, single dose or\ndoxycycline 100 mg PO BD for 7 days is given. This also covers treatment for chlamydia (if\nchlamydial infection is not ruled out).", "questionPages": [289], "solutionPages": [297], "questionFigures": [], "solutionFigures": []}, {"id": "ch18-q16", "chapterId": 18, "chapter": "Gram Negative Cocci", "number": 16, "text": "Which of the following is not true about Neisseria gonorrhoeae?", "options": [{"id": "A", "text": "It is exclusively a human pathogen"}, {"id": "B", "text": "Some strains may cause disseminated disease"}, {"id": "C", "text": "Vaccination has no role in prevention"}, {"id": "D", "text": "Drug resistance is only due to acquisition of plasmids"}], "correctIndex": 3, "correctLetter": "D", "solution": "Neisseria gonorrheae acquires resistance to antibiotics either by chromosomal mutations or by the\nacquisition of plasmids (R factors). These resistant strains are also known as:\n+ PPNG - penicillinase-producing N. gonorrhoeae (plasmid-borne resistance)\n+ TRNG - tetracycline-resistant N. gonorrhoeae (plasmid-borne resistance)\n* CMRNG - chromosomally mediated resistance in N. gonorrhoeae (resistance to both penicillin\nand tetracycline)\n* QRNG - quinolone resistant N. gonorrhoeae (due to alterations in DNA gyrase and\ntopoisomerase IV)\nOther options:\nOption A: N. gonorrhea is a fastidious organism and is exclusively a human pathogen.\nOption B: Some strains of N. gonorrhea can ascend up the genital tract and can lead to many\ndisseminated diseases such as septic arthritis and pelvic inflammatory disease.\nOption C: Vaccines are not effective against N. gonorrhea due to its antigenic variation and ability\nto invade neurophils.", "questionPages": [289, 290], "solutionPages": [297, 298], "questionFigures": [], "solutionFigures": []}, {"id": "ch18-q17", "chapterId": 18, "chapter": "Gram Negative Cocci", "number": 17, "text": "Which of the following is true about Moraxella catarrhalis?", "options": [{"id": "A", "text": "It is DNAse positive"}, {"id": "B", "text": "An uncommon cause of COPD exacerbation"}, {"id": "C", "text": "It ferments glucose"}, {"id": "D", "text": "Causes angular conjunctivitis"}], "correctIndex": 0, "correctLetter": "A", "solution": "Moraxella catarrhalis is a DNAse positive gram-negative diplococcus. It is the second most\ncommon bacterial cause of COPD exacerbations (after H. influenzae). It can also cause otitis\nmedia, sinusitis, tracheobronchitis, and pneumonia.\nIt differs from pathogenic Neisseria as:\n+ It does not ferment any carbohydrates - Asaccharolytic\n+ Gives a positive tributyrin hydrolysis test.\n* Shows positive DNAse test.\nAngular conjunctivitis is caused by Moraxella lacunata, which is a gram-negative rod-shaped\nbacteria.\nTreatment is with oral amoxicillin and clauvulanic acid.", "questionPages": [290, 291], "solutionPages": [298], "questionFigures": [], "solutionFigures": []}, {"id": "ch19-q1", "chapterId": 19, "chapter": "Rickettsia, Chlamydia and Mycoplasma", "number": 1, "text": "Transovarial transmission is a feature of which of the following diseases?", "options": [{"id": "A", "text": "Scrub typhus"}, {"id": "B", "text": "Epidemic typhus"}, {"id": "C", "text": "Endemic typhus"}, {"id": "D", "text": "Trench fever"}], "correctIndex": 0, "correctLetter": "A", "solution": "Transovarial transmission is a feature of Orientia tsutsugamushi which causes scrub typhus.\nTransovarial transmission refers to passing on the disease-causing bacteria from parent arthropod\nto offspring arthropod. Orientia tsutsugamushi is maintained by transovarial transmission in\ntrombiculid mites. It is also seen in Rickettsia rickettsii, Rickettsia conorii, and Rickettsia akari.\nThe image below shows a trombiculid mite.\nTrench fever (option D) is caused by Bartonella quintana.", "questionPages": [299], "solutionPages": [], "questionFigures": [], "solutionFigures": ["crop-solution-ch19-q1-1"]}, {"id": "ch19-q2", "chapterId": 19, "chapter": "Rickettsia, Chlamydia and Mycoplasma", "number": 2, "text": "A 36-year-old trekker presented with fever, headache, and rashes following a tick bite. He was\nlater diagnosed to have Rocky Mountain spotted fever. Which of the following statements is\nfalse about the microbe implicated?", "options": [{"id": "A", "text": "Obligate intracellular organism"}, {"id": "B", "text": "Beta-lactams are ineffective"}, {"id": "C", "text": "Reproduce by binary fission"}, {"id": "D", "text": "Cell wall is absent"}], "correctIndex": 3, "correctLetter": "D", "solution": "Rocky Mountain spotted fever is caused by Rickettsia rickettsii. A cell wall is present in rickettsial\norganisms.\nRickettsiae are obligate intracellular, gram-negative pleomorphic coccobacilli. They are unable to\ngrow in cell-free media and are thus cultured in yolk sacs of embryonated eggs. They are\nnon-motile, non-capsulated organisms that contain both DNA and RNA. They reproduce by\nbinary fission and are transmitted by arthropods like ticks and lice (except Coxiella burnetii and\nBartonella henselae).\nThe rickettsiae are localized in endothelial cells of small blood vessels (except Ehrlichia and\nAnaplasma) in humans. They cause endothelial cell enlargement and degeneration, predisposing\n\n\n\nto thrombus formation. Tetracyclines, macrolides, and fluoroquinolones are effective against this\ngroup but, beta-lactams are ineffective.", "questionPages": [299], "solutionPages": [308], "questionFigures": [], "solutionFigures": []}, {"id": "ch19-q3", "chapterId": 19, "chapter": "Rickettsia, Chlamydia and Mycoplasma", "number": 3, "text": "Which of the following statements is true regarding endemic murine typhus?", "options": [{"id": "A", "text": "Man to man transmission occurs"}, {"id": "B", "text": "It is caused by R.prowazekii"}, {"id": "C", "text": "Vector is Xenopsylla cheopis"}, {"id": "D", "text": "Neill-Mooser reaction is negative"}], "correctIndex": 2, "correctLetter": "C", "solution": "The vector for endemic murine typhus is the rat flea, Xenopsylla cheopis.\nEndemic murine typhus is cuased by Rickettsia typhi (option B) while epidemic typhus is caused\nby Rickettsia prowazekii. The zoonotic reservoir for R. typhi is the rat. Humans are infected\nwhen flea feces contaminate pruritic bite lesions. Transmission can also occur via inhalation of\naerosols of dried feces of rickettsemic rat flea. No man-to-man transmission occurs. Patients\npresent with fever, chills, vomiting and a maculopapular rash that is more prominent on the\ntrunk. Diagnosis is by serology and treatment is with doxycycline.\nWhen male guinea pigs are inoculated intraperitoneally with blood from a case of endemic typhus,\nthey develop fever and a characteristic scrotal inflammation. The scrotum becomes enlarged and\nthe testes cannot be pushed into the abdomen. This is known as the Neil-Mooser reaction. It is\npositive with Rickettsia typhi (option D) and negative with Rickettsia prowazekii.\nThe image below shows the rat flea, Xenopsylla cheopis.", "questionPages": [299], "solutionPages": [308], "questionFigures": [], "solutionFigures": ["crop-solution-ch19-q3-1"]}, {"id": "ch19-q4", "chapterId": 19, "chapter": "Rickettsia, Chlamydia and Mycoplasma", "number": 4, "text": "Multiple inmates at a prison are suspected to have epidemic typhus following an arthropod\ninfestation. Which of the following vectors is implicated in the spread of this disease?", "options": [{"id": "A", "text": "A"}, {"id": "B", "text": "B"}, {"id": "C", "text": "C"}, {"id": "D", "text": "D"}], "correctIndex": 1, "correctLetter": "B", "solution": "Louse (image B), Pediculus humanus corporis, transmits epidemic typhus.\nGaol fever/ Jail fever/ epidemic typhus is caused by Rickettsia prowazekii.", "questionPages": [299, 300], "solutionPages": [308, 309], "questionFigures": ["crop-question-ch19-q4-1"], "solutionFigures": ["crop-solution-ch19-q4-1"]}, {"id": "ch19-q5", "chapterId": 19, "chapter": "Rickettsia, Chlamydia and Mycoplasma", "number": 5, "text": "A 45-year-old man from Kashmir presents with fever, chills and rash for 1 week. The rash\nappeared on the 5th day of the fever starting from the trunk and progressing to the limbs.\nEpidemic typhus is suspected. Which of the following statements is incorrect about the\ndisease?", "options": [{"id": "A", "text": "Transmitted by a louse"}, {"id": "B", "text": "Brill-Zinsser disease is a recrudescent form"}, {"id": "C", "text": "Rash is present on palms and soles"}, {"id": "D", "text": "Transovarian transmission does not occur"}], "correctIndex": 2, "correctLetter": "C", "solution": "Epidemic typhus rash spares the palms and soles.\nEpidemic typhus, caused by Rickettsia prowazekii, is transmitted by the louse Pediculus humanus\ncorporis. There is no transovarial transmission of R. prowazekii. The disease spreads through\ninfected louse feces deposited when the louse feeds on the human host. It is commonly seen in\npoor unhygienic or cold conditions.\nEpidemic typhus starts with fever and chills. A characteristic rash appears on the fourth or fifth\nday, starting on the trunk and spreading over the limbs but sparing the face, palms, and soles. In\nsome patients who recover from epidemic typhus, the rickettsiae may remain latent in the\nlymphoid tissues or organs for years. Such latent infection may, at times, be reactivated leading to\nrecrudescent typhus (Brill-Zinsser disease).\nTransovarial transmission refers to passing on the disease-causing bacteria from parent arthropod\nto offspring arthropod. It occurs with Orientia tsutsugamushi, Rickettsia rickettsii, R. conorii and\nR. akari.\nNote: Rash on palms and soles is typically described in Rocky Mountain spotted fever, secondary\nsyphilis and hand, foot, and mouth disease\nThe image below shows the rash of epidemic typhus.", "questionPages": [300], "solutionPages": [309, 310], "questionFigures": [], "solutionFigures": ["crop-solution-ch19-q5-1"]}, {"id": "ch19-q6", "chapterId": 19, "chapter": "Rickettsia, Chlamydia and Mycoplasma", "number": 6, "text": "What is the drug of choice for scrub typhus?", "options": [{"id": "A", "text": "Doxycycline"}, {"id": "B", "text": "Ciprofloxacin"}, {"id": "C", "text": "Chloramphenicol"}, {"id": "D", "text": "Azithromycin"}], "correctIndex": 0, "correctLetter": "A", "solution": "The drug of choice for scrub typhus is doxycycline.\nTo treat scrub typhus, oral doxycycline 100 mg is given twice daily for 7-15 days. In the case of\npregnant women, oral azithromycin 500 mg for 3 days may be used as doxycycline is\ncontraindicated in pregnancy.\nScrub typhus is a rickettsial infection caused by Orientia tsutsugamushi. The vector is a\ntrombiculid mite. Humans are infected when they are bitten by the mite larvae known as chiggers.\nThe incubation period is 1- 3 weeks. Patients develop a characteristic eschar at the site of the mite\nbite, along with regional lymphadenopathy and maculopapular rash. It can be associated with\nfever, headache, myalgia, meningoencephalitis, myocarditis, and pneumonia.\nSerologic assays are used for diagnosis. Weil-Felix reaction is a heterophile agglutination reaction\nused for diagnosis, wherein the sera are tested for agglutinins to the O antigens of Proteus strains\nOX19, OX2, and OXK. OXK alone is agglutinated in scrub typhus.", "questionPages": [300, 301], "solutionPages": [310], "questionFigures": [], "solutionFigures": []}, {"id": "ch19-q7", "chapterId": 19, "chapter": "Rickettsia, Chlamydia and Mycoplasma", "number": 7, "text": "A 25-year-old man came with complaints of fever and a skin lesion as shown below. He gives\na history of hiking in scrub forests a week prior, where he suffered an insect bite. On\nexamination, there is regional lymphadenopathy and a maculopapular rash. Which of the\nfollowing arthropods is involved in the spread of this disease?", "options": [{"id": "A", "text": "Gamasid mite"}, {"id": "B", "text": "Trombiculid mite"}, {"id": "C", "text": "Tick"}, {"id": "D", "text": "Louse"}], "correctIndex": 1, "correctLetter": "B", "solution": "A history of contact with scrub vegetation with fever, regional lymphadenopathy, maculopapular\nrash, and eschar at the bite site is suggestive of scrub typhus.\nScrub typhus is caused by Orientia tsutsugamushi and transmitted by trombiculid mite.\nDoxycycline 100mg BD for 7-14 days is the drug of choice for treatment of scrub typhus in adults.\nIn case of pregnant women and children, azithromycin or chloramphenicol may be preferred\nwhere doxycycline is relatively contraindicated.", "questionPages": [301], "solutionPages": [310, 311], "questionFigures": ["crop-question-ch19-q7-1"], "solutionFigures": []}, {"id": "ch19-q8", "chapterId": 19, "chapter": "Rickettsia, Chlamydia and Mycoplasma", "number": 8, "text": "A wildlife photographer presents with a blackish lesion at the site of an insect bite from a few\ndays back. He also gives a history of fever. A positive Weil-Felix test with OX K agglutinins\nwas observed. What is the diagnosis?", "options": [{"id": "A", "text": "Rocky mountain spotted fever"}, {"id": "B", "text": "Epidemic typhus"}, {"id": "C", "text": "Endemic typhus"}, {"id": "D", "text": "Scrub typhus"}], "correctIndex": 3, "correctLetter": "D", "solution": "In the above clinical scenario, a history of insect bite followed by the development of a\ncharacteristic eschar at the site of the bite and a positive Weil-Felix test with OX K agglutinins\nsuggests a diagnosis of scrub typhus.\nWeil-Felix reaction is a heterophile agglutination reaction, wherein the sera are tested for\nagglutinins to the O antigens of certain Proteus strains OX 19, OX 2, and OX K. The basis of the\ntest is sharing an alkali stable carbohydrate antigen by some Rickettsiae and by some strains of\nProteus.", "questionPages": [301, 302], "solutionPages": [311], "questionFigures": [], "solutionFigures": ["crop-solution-ch19-q8-1"]}, {"id": "ch19-q9", "chapterId": 19, "chapter": "Rickettsia, Chlamydia and Mycoplasma", "number": 9, "text": "A veterinarian presents with new-onset mitral regurgitation and fever. An echo reveals valve\nvegetations and blood cultures show no growth. Q fever is suspected. Which of the following\nstatements is false regarding the organism implicated?", "options": [{"id": "A", "text": "Obligate intracellular"}, {"id": "B", "text": "Gram-negative bacteria"}, {"id": "C", "text": "Survives Holder's method of pasteurisation"}, {"id": "D", "text": "Transmitted by mites"}], "correctIndex": 3, "correctLetter": "D", "solution": "Coxiella burnetii is the causative organism of Q fever. It is transmitted by ixodid ticks in\nanimals; however, it is not transmitted to humans via ticks.\nCoxiella burnetii is a filterable, obligate intracellular pathogen. They are gram-negative but are\nbetter stained with Gimenez, Giemsa stains. They are heat resistant and hence survive Holder's\nmethod of pasteurization.\nQ fever is a zoonosis and the primary source of human infection are infected cattle, sheep, and\ngoats. It spreads through the inhalational route. Veterinarians are at higher risk due to increased\nexposure. Acute disease resembles influenza, nonbacterial (atypical) pneumonia, and hepatitis.\nChronic disease presents as culture-negative bacterial endocarditis in patients with valvular heart\ndisease.", "questionPages": [302], "solutionPages": [311], "questionFigures": [], "solutionFigures": []}, {"id": "ch19-q10", "chapterId": 19, "chapter": "Rickettsia, Chlamydia and Mycoplasma", "number": 10, "text": "A patient presents with redness of the eye and foreign body sensation. On examination, there\nis follicular hypertrophy in the lower lids and moderately abundant exudates. Chlamydial\ninfection is suspected. Which strains could have caused this condition?", "options": [{"id": "A", "text": "Serotypes D to K"}, {"id": "B", "text": "Serotypes A, B, Ba and C"}, {"id": "C", "text": "Serotype Li, L2, L3"}, {"id": "D", "text": "Serotype H- K"}], "correctIndex": 0, "correctLetter": "A", "solution": "Redness, foreign body sensation with follicular hypertrophy in the lower lids and moderately\nabundant exudates suggests inclusion conjunctivitis which is caused by Chlamydia trachomatis\nserotypes D to K.\n\n\n\nInclusion conjunctivitis is a type of acute follicular conjunctivitis caused by C. trachomatis\nserotypes D to K. The infection is transmitted to the eye from genitals, or contaminated swimming\npools. Patients present with foreign body sensation, redness and mucopurulent discharge. On\nexamination, there is acute follicular hypertrophy of the lower palpebral conjunctiva and fornix,\nnon-tender pre-auricularlymphadenopathy and superficial keratitis in upper half of cornea.\nC. trachomatis is a Gram-negative, obligate intracellular bacteria. It cannot produce ATP. It\ncauses a variety of human diseases (ocular and genitourinary) and has two main biological\nvariants:\n* TRIC biovar which causes trachoma inclusion conjunctivitis (TRIC biovar). This is further\ndivided into 12 serological variants:\n+ A, B, Ba, C serovars which cause blinding or endemic trachoma\n* D to K servovars which cause inclusion conjunctivitis\n+ LGV biovar (L1, L2, L3 serotypes) which causes lymphogranuloma venereum", "questionPages": [302], "solutionPages": [311, 312], "questionFigures": [], "solutionFigures": []}, {"id": "ch19-q11", "chapterId": 19, "chapter": "Rickettsia, Chlamydia and Mycoplasma", "number": 11, "text": "A thick, yellowish discharge is noted from the eyes of a five-day-old neonate in the step-down\nward during rounds. An iodine-stained smear of the exudates is positive for large cytoplasmic\ninclusions as shown in the image. Which of the following is false about the organism\nresponsible for the above condition?", "options": [{"id": "A", "text": "Filterable organisms"}, {"id": "B", "text": "Obligate intracellular"}, {"id": "C", "text": "Possess only DNA"}, {"id": "D", "text": "Cannot grow on artificial media"}], "correctIndex": 2, "correctLetter": "C", "solution": "The given clinical scenario of a thick yellowish discharge from the eye showing iodine-stained\ninclusion bodies is suggestive of inclusion conjunctivitis caused by Chlamydia trachomatis. As\nchlamydia is a bacteria, it possesses both DNA and RNA.\nChlamydiae are obligate intracellular organisms that produce basophilic inclusion bodies. They\nare filterable like viruses. They are called energy parasites as they lack enzymes for ATP synthesis.\nThey cannot grow on artificial media but can grow on cell lines like McCoy, HeLa, or the yolk sac\nof the chick embryo.\nChlamydiae occur in two forms, the elementary body and the reticulate body. The extracellular,\ninfective form is called the elementary body. The intracellular, non-infective, growing,\nand replicative form is called the reticulate body. These are found inside a membrane-bound\ncompartment called the inclusion body which can be visualized within infected epithelial cells by\niodine or Giemsa stain. The cell wall of the reticulate body is fragile and pliable, leading\nto pleomorphism.", "questionPages": [302, 303], "solutionPages": [312, 313], "questionFigures": ["crop-question-ch19-q11-1"], "solutionFigures": ["crop-solution-ch19-q11-1"]}, {"id": "ch19-q12", "chapterId": 19, "chapter": "Rickettsia, Chlamydia and Mycoplasma", "number": 12, "text": "A poultry worker was admitted to ICU with severe pneumonia. Bronchoalveolar lavage was\ndone; it showed Levinthal Cole Lillie bodies. Which of the following is the causative organism\nfor the above condition?", "options": [{"id": "A", "text": "Legionella pneumophila"}, {"id": "B", "text": "Chlamydia psittaci"}, {"id": "C", "text": "Mycoplasma pneumoniae"}, {"id": "D", "text": "Moraxella catarrhalis"}], "correctIndex": 1, "correctLetter": "B", "solution": "Pneumonia in a poultry worker with Levinthal-Cole-Lillie bodies on bronchoalveolar lavage\nspecimens is suggestive of psittacosis.\nLevinthal-Cole-Lillie bodies are inclusion bodies of Chlamydia psittaci seen in infected cells\nincluding alveolar macrophages from patients suffering from psittacosis. C. psittaci can be\ntransmitted to humans by direct contact with infected birds or by inhalation of aerosols from\navian feather dust. Psittacosis presents with fever, chills, muscular aches and pains, severe\nheadache, hepatosplenomegaly and gastrointestinal symptoms. Severe pneumonia may develop. It\nis treated with tetracycline.", "questionPages": [303], "solutionPages": [313], "questionFigures": [], "solutionFigures": []}, {"id": "ch19-q13", "chapterId": 19, "chapter": "Rickettsia, Chlamydia and Mycoplasma", "number": 13, "text": "A patient presented with painful swellings on both sides of the groin as shown in the image.\nThe clinician suspects lymphogranuloma venereum. Which is the most common serovar\ncausing the above condition?", "options": [{"id": "A", "text": "Li"}, {"id": "B", "text": "La"}, {"id": "C", "text": "13"}, {"id": "D", "text": "L4"}], "correctIndex": 1, "correctLetter": "B", "solution": "Lymphogranuloma venereum (LGV) is caused most commonly by Chlamydia trachomatis LGV\nserovar L2.\nLGV is a sexually transmitted disease, characterized by suppurative inguinal adenitis.", "questionPages": [303, 304], "solutionPages": [313], "questionFigures": ["crop-question-ch19-q13-1"], "solutionFigures": []}, {"id": "ch19-q14", "chapterId": 19, "chapter": "Rickettsia, Chlamydia and Mycoplasma", "number": 14, "text": "What is the incubation period of lymphogranuloma venereum?", "options": [{"id": "A", "text": "1-5 days"}, {"id": "B", "text": "7-10 days"}, {"id": "C", "text": "10-30 days"}, {"id": "D", "text": "30-60 days"}], "correctIndex": 2, "correctLetter": "C", "solution": "The incubation period of Lymphogranuloma venereum ranges from 10-30 days.\nChlamydia trachomatis serovars Li, L2, and L3 cause lymphogranuloma venereum (LGV). The\nmost common presentation is the inguinal syndrome, which is characterized by painful inguinal\nlymphadenopathy.", "questionPages": [304], "solutionPages": [313, 314], "questionFigures": [], "solutionFigures": []}, {"id": "ch19-q15", "chapterId": 19, "chapter": "Rickettsia, Chlamydia and Mycoplasma", "number": 15, "text": "Lesion scrapings from a genital ulcer show numerous polymorphs, but no bacteria. Which of\nthe following is the most appropriate culture medium for organisms responsible for the above\ncondition?", "options": [{"id": "A", "text": "McCoy cells"}, {"id": "B", "text": "Thayer-Martin agar"}, {"id": "C", "text": "Robertson’s cooked meat"}, {"id": "D", "text": "PPLO broth"}], "correctIndex": 0, "correctLetter": "A", "solution": "Clinical scrapings from a genital ulcer showing polymorphs in the absence of bacteria is suggestive\nof chlamydial infection and the most appropriate culture medium is McCoy cells (human synovial\ncarcinoma cell line).\nC. trachomatis is a small gram-negative bacterium and an obligate intracellular parasite that\nappears as an intracytoplasmic inclusion body. The gram stain of the cervical smear would show\nleucocytes but no organisms. Hence, selective culture media like the McCoy cells culture is used to\nisolate the organism.\nOption B: Thayer—Martin agar is used for isolation of Neisseria spp.\nOption C: Robertson’s cooked meat is used for the culture of anaerobes, especially Clostridia\nOption D: Pleuropneumonia-like organisms (PPLO) broth is used to culture Mycoplasma spp. and\nUreaplasma spp.\nNote: Abnormal urethral gram stain showing >10 PMNs/1000A~ field in women with dysuria\nbut without coliform bacteriuria supports the diagnosis of chlamydial urethritis.", "questionPages": [304, 305], "solutionPages": [314], "questionFigures": [], "solutionFigures": []}, {"id": "ch19-q16", "chapterId": 19, "chapter": "Rickettsia, Chlamydia and Mycoplasma", "number": 16, "text": "A 28-year-old woman presented with a 3-day history of mucopurulent cervical discharge.\nGram staining of the discharge revealed numerous pus cells, but no organisms. What is the\ninvestigation of choice for the diagnosis of this infection?", "options": [{"id": "A", "text": "Saline mount"}, {"id": "B", "text": "Serum antibody testing by immunofluorescence"}, {"id": "C", "text": "Culture in Thayer Martin media"}, {"id": "D", "text": "Nucleic acid amplification test"}], "correctIndex": 3, "correctLetter": "D", "solution": "Mucopurulent cervical discharge for 3 days is suggestive of acute cervicitis. As gram stain does not\nshow any organism, gonococcal infection is less likely. In this case, Chlamydia trachomatis is the\nmost likely organism. For C. trachomatis, the investigation of choice is the nucleic acid\namplification test (NAAT).\nNAATs are the most sensitive tests to detect chlamydia. These tests also have a high specificity\ncomparable to culture, and in contrast to culture, do not depend on viable pathogens. Therefore,\nNAATs are generally considered the test of choice for chlamydia and have replaced culture as the\ndiagnostic gold standard.\nMucopurulent cervicitis is the inflammation of the columnar epithelium and subepithelium of the\nendocervix in women. Its commonly caused by Neiserria gonorrhoeae and Chlamydia\ntrachomatis.", "questionPages": [305], "solutionPages": [314], "questionFigures": [], "solutionFigures": []}, {"id": "ch19-q17", "chapterId": 19, "chapter": "Rickettsia, Chlamydia and Mycoplasma", "number": 17, "text": "Which of the following microbes is also referred to as Eaton's agent ?", "options": [{"id": "A", "text": "Klebsiella pneumoniae"}, {"id": "B", "text": "Corynebacterium diphtheria"}, {"id": "C", "text": "Chlamydia trachomatis"}, {"id": "D", "text": "Mycoplasma pneumoniae"}], "correctIndex": 3, "correctLetter": "D", "solution": "Eaton's agent refers to Mycoplasma pneumoniae.\nEaton was the first to isolate Mycoplasma pneumoniae. Because it was filterable, it was\nconsidered to be a virus previously.\nIt was formerly known as PPLO- Pleuro pneumonia-like organism.", "questionPages": [305], "solutionPages": [314], "questionFigures": [], "solutionFigures": []}, {"id": "ch19-q18", "chapterId": 19, "chapter": "Rickettsia, Chlamydia and Mycoplasma", "number": 18, "text": "A 20-year-old military recruit presented with fever, sore throat, and non-productive cough\nwhich showed no improvement with beta-lactam antibiotics. X-ray showed peribronchial\npneumonia with thickened bronchial markings. Primary atypical pneumonia is suspected.\nWhich of the following statements is false regarding the organism responsible for this\ncondition?", "options": [{"id": "A", "text": "Obligate intracellular"}, {"id": "B", "text": "Cell wall is absent"}, {"id": "C", "text": "Highly pleomorphic"}, {"id": "D", "text": "Multiply by binary fission"}], "correctIndex": 0, "correctLetter": "A", "solution": "The above clinical scenario of fever, non-productive cough, no improvement with beta-lactam\nantibiotics along with X-ray features showing peribronchial pneumonia with thickened bronchial\nmarkings is suggestive of Mycoplasma pneumonia, also known as primary atypical pneumonia or\nwalking pneumonia.\nMycoplasmas are not obligate intracellular parasites. They are free-living bacteria devoid of cell\nwalls. They are highly pleomorphic, with no fixed shape or size.\nBecause of their plasticity, they can pass through bacterial filters and have often been\nmistaken for viruses.\nMycoplasmas do not possess spores, flagella, or fimbria. Some species exhibit gliding\nmotility. Mycoplasmas are gram-negative, but are better stained by Giemsa stain.", "questionPages": [305], "solutionPages": [314, 315], "questionFigures": [], "solutionFigures": []}, {"id": "ch19-q19", "chapterId": 19, "chapter": "Rickettsia, Chlamydia and Mycoplasma", "number": 19, "text": "Diene’s method of staining is used for which of the following organisms?", "options": [{"id": "A", "text": "Mycoplasma"}, {"id": "B", "text": "Chlamydiae"}, {"id": "C", "text": "Anthrax"}, {"id": "D", "text": "Diphtheria"}], "correctIndex": 0, "correctLetter": "A", "solution": "Diene's method is used for mycoplasma.\nMycoplasma shows a ‘fried-egg’ colony on Diene’s method of staining. The central dark bluish\narea represents the area of mycoplasmal down growth whereas the pale blue periphery indicates\nsuperficial growth of mycoplasma on the agar.", "questionPages": [305, 306], "solutionPages": [315], "questionFigures": [], "solutionFigures": ["crop-solution-ch19-q19-1"]}, {"id": "ch19-q20", "chapterId": 19, "chapter": "Rickettsia, Chlamydia and Mycoplasma", "number": 20, "text": "Mycoplasma is inherently resistant to which of the following antibiotics?", "options": [{"id": "A", "text": "Beta lactam antibiotics"}, {"id": "B", "text": "Macrolides"}, {"id": "C", "text": "Tetracycline"}, {"id": "D", "text": "Flouroquinolones"}], "correctIndex": 0, "correctLetter": "A", "solution": "Mycoplasma is inherently resistant to beta-lactam antibiotics.\nMycoplasma lack cell wall, and therefore, are inherently resistant to beta-lactam antibiotics as\nthese drugs act on the cell wall.", "questionPages": [306, 307], "solutionPages": [315], "questionFigures": [], "solutionFigures": []}, {"id": "ch20-q1", "chapterId": 20, "chapter": "Spirochetes", "number": 1, "text": "Identify the organism.", "options": [{"id": "A", "text": "Leptospira interrogans"}, {"id": "B", "text": "Treponema pallidum"}, {"id": "C", "text": "Borrelia burgdorferi"}, {"id": "D", "text": "Helicobacter pylori"}], "correctIndex": 1, "correctLetter": "B", "solution": ".The given image shows Treponema pallidum demonstrated by dark ground microscopy.\nTreponemes are short, slender with regular and sharp spirals.\nOption A: Leptospira have a large number of closely wound spirals and characteristic hooked ends\nas shown in the image below\n\n\n\nOption C: Borrelia are large with irregular and wide open coils.\nOption D: Helicobacter pylori is a spiral rod (bacilli) that is not classified as a spirochete.", "questionPages": [316], "solutionPages": [325], "questionFigures": ["crop-question-ch20-q1-1"], "solutionFigures": ["crop-solution-ch20-q1-1", "crop-solution-ch20-q1-2"]}, {"id": "ch20-q2", "chapterId": 20, "chapter": "Spirochetes", "number": 2, "text": "A 30-year-old truck driver presented with a painless ulcer in the genital area. On\nexamination, a single ulcer with an indurated base was found. An image of the tissue section\nis shown below. Identify the staining method.", "options": [{"id": "A", "text": "Fontana's method"}, {"id": "B", "text": "Levaditi's method"}, {"id": "C", "text": "Castaneda's method"}, {"id": "D", "text": "Albert's method"}], "correctIndex": 1, "correctLetter": "B", "solution": "The given image shows Treponema pallidum demonstrated by Levaditi's method. Single painless\nulcer with indurated base points towards the diagnosis of syphilis.\nSyphilis is caused by Treponema pallidum, a spirochete bacillus. It is a sexually transmitted\ninfection. Intrauterine transmission can lead to congenital syphilis.\nIt shows corkscrew motility which can be demonstrated by darkfield microscopy.\nTreponema can be stained by silver impregnation methods.\n+ Fontana's method is used on smear\n+ Levaditi's method is used for tissue sections\nThe clinical manifestations of syphilis include:\nPrimary syphilis: The typical primary chancre usually begins as a single painless papule\nthat rapidly becomes eroded and usually becomes indurated, with a characteristic cartilaginous\nconsistency on palpation of the edge and base of the ulcer.\nInguinal lymphadenopathy is bilateral and may occur with anal as well as with genital chancres.\nThe chancre generally heals within 4-6 weeks (range, 2-12 weeks), but lymphadenopathy may\npersist for months.\nSecondary syphilis: The various features include mucocutaneous or cutaneous lesions and\ngeneralized nontender lymphadenopathy. macular, papular, papulosquamous, and occasionally\npustular syphilides. Other features of secondary syphilis include sore throat, fever, weight loss,\nmalaise, anorexia, headache, and meningismus. Ocular findings associated with secondary (or\nlater/ unknown-stage) syphilis include pupillary abnormalities and optic neuritis as well as the\n\n\n\nclassic iritis or uveitis.\nLatent syphilis: Early latent syphilis is limited to the first year after infection, whereas late latent\nsyphilis is defined as that of 1 year’s duration (or of unknown duration). T. pallidum may still seed\nthe bloodstream intermittently during the latent stage, and latent syphilis in a pregnant woman\nmay infect the fetus in utero.\nNeurosyphilis: The major clinical categories of symptomatic neurosyphilis include meningeal,\nmeningovascular, and parenchymatous syphilis.\nCardiovascular syphilis: Cardiovascular involvement results in uncomplicated aortitis, aortic\nregurgitation, saccular aneurysm (usually of the ascending aorta), or coronary ostial stenosis.\nCongenital syphilis: The earliest manifestations of congenital syphilis include rhinitis, or\n“snuffles”; mucocutaneous lesions, bone changes, including periostitis detectable by x-ray\nexamination of long bones; hepatosplenomegaly, lymphadenopathy, anemia, jaundice,\nthrombocytopenia, and leukocytosis.\nSerologic tests for syphilis recommended by the Centers for Disease Control and Prevention\n(CDC):\n* Screening or diagnosis (RPR or VDRL),\n* Quantitative measurement of antibody to assess clinical syphilis activity or to monitor response\nto therapy (RPR or VDRL)\n* Confirmation of a syphilis diagnosis in a patient with a reactive RPR or VDRL test (FTA-ABS,\nTPHA, EIA/CIA)\nTreatment of syphilis is with 2.4 million units of intramuscular benzathine penicillin.", "questionPages": [316, 317], "solutionPages": [325, 326], "questionFigures": ["crop-question-ch20-q2-1"], "solutionFigures": []}, {"id": "ch20-q3", "chapterId": 20, "chapter": "Spirochetes", "number": 3, "text": "What type of motility is shown by Treponema pallidum?", "options": [{"id": "A", "text": "Tumbling motility"}, {"id": "B", "text": "Gliding motility"}, {"id": "C", "text": "Corkscrew motility"}, {"id": "D", "text": "Darting motility"}], "correctIndex": 2, "correctLetter": "C", "solution": "Treponema pallidum show corkscrew motility, i.e movement by rotation around the long axis.\nThe characteristic feature of spirochetes is the presence of endoflagella, situated between the\nouter membrane and cell wall, that facilitates this movement.", "questionPages": [317], "solutionPages": [326, 327], "questionFigures": [], "solutionFigures": ["crop-solution-ch20-q3-1"]}, {"id": "ch20-q4", "chapterId": 20, "chapter": "Spirochetes", "number": 4, "text": "A 32-year-old pregnant lady tests VDRL positive at her ist-trimester antenatal check-up. An\nFTA-ABS confirms the diagnosis. Which of the following is a false statement about the\norganism causing this disease?", "options": [{"id": "A", "text": "It cannot be cultured in vitro"}, {"id": "B", "text": "Endoflagella is in the periplasmic space."}, {"id": "C", "text": "Humans are the only known natural hosts"}, {"id": "D", "text": "Reiter’s strain is pathogenic"}], "correctIndex": 3, "correctLetter": "D", "solution": "VDRL positive status is suggestive of syphilis, caused by Treponema pallidum. Fluorescent\ntreponemal antibody absorption (FTA-ABS) is a confirmatory test.\nReiter's strain is a cultivable, non-pathogenic treponeme, showing morphological and antigenic\nsimilarities with T.pallidum. It is widely used as the antigen in group-specific treponemal tests for\nthe diagnosis of syphilis.\nNichol's strain is virulent and non-cultivable in artificial media. However, it can be grown in cell\nculture through serial passage in live rabbit testes.", "questionPages": [317, 318], "solutionPages": [327], "questionFigures": [], "solutionFigures": []}, {"id": "ch20-q5", "chapterId": 20, "chapter": "Spirochetes", "number": 5, "text": "A patient had a solitary, painless penile ulcer 2 months back. Now, he presents with a\ngeneralized maculopapular rash over the body. What is the sensitivity of VDRL at this stage of\nthe disease?", "options": [{"id": "A", "text": "25%"}, {"id": "B", "text": "50%"}, {"id": "C", "text": "75%"}, {"id": "D", "text": "100%"}], "correctIndex": 3, "correctLetter": "D", "solution": "The sensitivity of VDRL is 100% in secondary syphilis. History of solitary painless ulcer with a\ngeneralized maculopapular rash is consistent with secondary syphilis.\nThe VDRL test becomes positive 4-5 weeks after exposure to T. pallidum and 1-2 weeks after the\nappearance of the chancre.\nThe VDRL test is a highly sensitive test. The sensitivity of the test depends on the stage of the\ndisease:\n* Primary syphilis- 60-75%\n* Secondary syphilis- 100%\n+ High antibody titers may be found in patients developing gummatous lesions and neurovascular\nor cardiovascular complications.\n+ Tertiary syphilis- usually negative\n+ Negative test:\n\n\n\n+ Early primary syphilis\n+ Latent acquired syphilis\n+ Late congenital syphilis\nSecondary syphilis is the most infective stage in the course of the illness. The patient may present\nwith a roseolar or papular skin rash, condyloma lata, and mucous patches.\nThe image below shows lesions of secondary syphilis.", "questionPages": [318], "solutionPages": [327, 328], "questionFigures": [], "solutionFigures": ["crop-solution-ch20-q5-1"]}, {"id": "ch20-q6", "chapterId": 20, "chapter": "Spirochetes", "number": 6, "text": "Which of the following is a false statement regarding the serological tests of syphilis?", "options": [{"id": "A", "text": "Rapid plasma reagin test is a group specific treponemal test"}, {"id": "B", "text": "VDRL test is the test of choice for response to therapy"}, {"id": "C", "text": "VDRL is the test of choice for examining CSF"}, {"id": "D", "text": "Treponemal tests are likely to remain reactive even after adequate therapy"}], "correctIndex": 0, "correctLetter": "A", "solution": "RPR is a non-specific test. It uses the VDRL antigen (cardiolipin) containing carbon particles.\nHence, results can be seen by the naked eye, whereas VDRL requires a microscope for\nvisualization of flocculation.\nThe test of choice for monitoring response to treatment and for examining CSF is VDRL\nThe test of choice for syphilis screening is RPR.\nAfter treatment, in early syphilis,\n* Non-treponemal tests- titers decline or become non-reactive\n+ Treponemal tests- remain reactive\nFor diagnosis of syphilis, a 2 test approach is used i.e., screening with an NTT (non-treponemal\ntest) which includes either VDRL or RPR. Confirmation of syphilis is done by a treponemal test,\nmost commonly by TPHA (Treponema pallidum hemagglutination test).\nFollow-up is done using NTT (as treponemal tests remains positive for years after treatment).", "questionPages": [318], "solutionPages": [328], "questionFigures": [], "solutionFigures": []}, {"id": "ch20-q7", "chapterId": 20, "chapter": "Spirochetes", "number": 7, "text": "A 55-year old man was brought to the OPD with complaints of rapid decline in cognition,\nimpaired position, and vibratory sense. There is a history of sporadic short-term relationships\nwith many promiscuous sexual partners. Romberg’s sign is positive and bilateral Argyll\nRobertson pupils are seen on checking for pupillary reflex. Which of the following is the\ninvestigation of choice?", "options": [{"id": "A", "text": "Treponema pallidum haemagglutination test"}, {"id": "B", "text": "Venereal disease research laboratory (VDRL) test"}, {"id": "C", "text": "Fluorescent Treponemal Antibody Absorption test"}, {"id": "D", "text": "EIA-Enzyme-linked ImmunoAssay"}], "correctIndex": 1, "correctLetter": "B", "solution": "The clinical scenario given above with a positive sexual history, Romberg test, and Argyll\nRobertson pupils is suggestive of neurosyphilis. The investigation of choice for neurosyphilis\nis VDRL.\nThe CSF VDRL test is highly specific and, when reactive, is considered diagnostic of\nneurosyphilis.\nInvolvement of the CNS in syphilis is detected by examination of CSF for:\n* Mononuclear pleocytosis (>5 white blood cells/uL).\n+ Increased protein concentration (>45 mg/dL).\n+ CSF VDRL reactivity.", "questionPages": [318], "solutionPages": [328, 329], "questionFigures": [], "solutionFigures": []}, {"id": "ch20-q8", "chapterId": 20, "chapter": "Spirochetes", "number": 8, "text": "You treated a case of secondary syphilis with a single dose of benzathine penicillin-G 2.4\nmillion IU IM. What follow-up advice would you give for the assessment of the patient's\n\n\n\nresponse to treatment?", "options": [{"id": "A", "text": "Follow up with VDRL after 6 months and 12 months"}, {"id": "B", "text": "Follow up with VDRL after 3 months and 6 months"}, {"id": "C", "text": "Follow up with TPHA after 6 months and 12 months"}, {"id": "D", "text": "Follow up with TPHA after 3 months and 6 months"}], "correctIndex": 0, "correctLetter": "A", "solution": "The investigation used to assess response to treatment in syphilis is VDRL. In the case of\nsecondary syphilis, follow-up VDRL should be done at 6 months and 12 months.\nVDRL and RPR become negative after adequate treatment whereas specific treponemal tests\nremain positive indefinitely despite treatment.\nGuidelines for follow up:\n+ Patients with primary or secondary syphilis should be examined 6 and 12 months after\ntreatment.\n+ Patients with latent or late syphilis should be examined at 6, 12, and 24 months after treatment.", "questionPages": [318, 319], "solutionPages": [329], "questionFigures": [], "solutionFigures": []}, {"id": "ch20-q9", "chapterId": 20, "chapter": "Spirochetes", "number": 9, "text": "A pregnant woman at 10 weeks of gestational age tested VDRL positive but negative for\nspecific treponemal tests. What is your interpretation?", "options": [{"id": "A", "text": "Positive for syphilis"}, {"id": "B", "text": "False negative"}, {"id": "C", "text": "Positive for non pathogenic treponema"}, {"id": "D", "text": "Biological false positive"}], "correctIndex": 3, "correctLetter": "D", "solution": "Pregnancy can give rise to false-positive VDRL.\nBiological false-positive (BFP) reactions are defined as positive reactions obtained in\nnon-specific treponemal tests (RPR, VDRL) with negative results in specific treponemal tests, in\nthe absence of past or present treponemal infections and not caused by technical faults.", "questionPages": [319], "solutionPages": [329], "questionFigures": [], "solutionFigures": []}, {"id": "ch20-q10", "chapterId": 20, "chapter": "Spirochetes", "number": 10, "text": "A 2-month-old infant presented with a runny nose and bullous lesions on the skin and legs.\nHer X-ray (given below) showed features suggestive of periostitis. Which of the following is\nthe initial investigation of choice?", "options": [{"id": "A", "text": "Venereal disease research laboratory (VDRL) test"}, {"id": "B", "text": "Treponema pallidum hemagglutination (TPHA) assay"}, {"id": "C", "text": "Fluorescent treponema antibody absorbed (FTA-ABS) test"}, {"id": "D", "text": "Culture"}], "correctIndex": 0, "correctLetter": "A", "solution": "The newborn baby has characteristic signs and symptoms of congenital syphilis. Periostitis is a\nhallmark of skeletal manifestation. VDRL or RPR is the initial investigation of choice in\ncongenital syphilis.\nThe earliest manifestations of congenital syphilis include rhinitis, or “snuffles”; mucocutaneous\nlesions, bone changes, including periostitis detectable by x-ray examination of long bones;\nhepatosplenomegaly, lymphadenopathy, anemia, jaundice, thrombocytopenia, and leukocytosis.\nAll neonates born to mothers who have reactive nontreponemal and treponemal test results\nshould be evaluated with a quantitative nontreponemal serologic test (RPR or VDRL) performed\n\n\n\non the neonate’s serum, because umbilical cord blood can become contaminated with maternal\nblood and yield a false-positive result.\nFTA-ABS or TPHA is used for confirmation of syphilis in a patient with reactive RPR or VDRL\ntest.\nT. pallidum cannot be detected by culture.", "questionPages": [319, 320], "solutionPages": [329, 330], "questionFigures": ["crop-question-ch20-q10-1"], "solutionFigures": []}, {"id": "ch20-q11", "chapterId": 20, "chapter": "Spirochetes", "number": 11, "text": "What is the causative agent of yaws ?", "options": [{"id": "A", "text": "T.pallidum"}, {"id": "B", "text": "T.pertenue"}, {"id": "C", "text": "T.carateum"}, {"id": "D", "text": "T.endemicum"}], "correctIndex": 1, "correctLetter": "B", "solution": "Causative agent of yaws is Treponema pertenue.\nIt is one of the endemic treponematoses that spreads by direct contact.\nThe image shows ulcerative skin lesions seen in yaws.", "questionPages": [320], "solutionPages": [330], "questionFigures": [], "solutionFigures": ["crop-solution-ch20-q11-1"]}, {"id": "ch20-q12", "chapterId": 20, "chapter": "Spirochetes", "number": 12, "text": "What is the causative organism and the corresponding vector for epidemic relapsing fever?", "options": [{"id": "A", "text": "Borrelia burgdorferi - louse"}, {"id": "B", "text": "Borrelia recurrentis - tick"}, {"id": "C", "text": "Borrelia recurrentis - louse"}, {"id": "D", "text": "Borrelia burgdorferi - tick"}], "correctIndex": 2, "correctLetter": "C", "solution": "Epidemic relapsing fever is caused by Borrelia recurrentis and is transmitted by louse.\n\n\n\nEndemic relapsing fever is caused by Borrelia duttoni, Borrelia hermsii, Borrelia parkeri, etc, and\nis transmitted by ticks.", "questionPages": [320], "solutionPages": [330, 331], "questionFigures": [], "solutionFigures": []}, {"id": "ch20-q13", "chapterId": 20, "chapter": "Spirochetes", "number": 13, "text": "During a louse outbreak among jail inmates, a few of them developed fevers that subsided\nafter 3-5 days. The fever relapsed after a week and subsided again. Many patients had tender\nsplenomegaly on examination. Which culture medium is used to isolate the organism\nimplicated here?", "options": [{"id": "A", "text": "Thayer-Martin medium"}, {"id": "B", "text": "Thiosulphate, citrate, bile salt agar"}, {"id": "C", "text": "Barbour-Stoenner-Kelly broth medium"}, {"id": "D", "text": "Mannitol, egg-yolk, phenol red, polymyxin agar"}], "correctIndex": 2, "correctLetter": "C", "solution": "The above clinical scenario is suggestive of louse-born relapsing fever (LBRF) caused by Borrelia\nrecurrentis. Barbour-Stoenner-Kelly broth medium is used to isolate all Borrelia species except for\nB.miyaotoi.\nTender splenomegaly and relapsing fever in the background of a louse outbreak point towards the\ndiagnosis of LBRF.\nIt was very common during wars and in the jails of former days but with improvements in hygiene\nand the discovery of insecticides, it has now become rare.", "questionPages": [320], "solutionPages": [331], "questionFigures": [], "solutionFigures": []}, {"id": "ch20-q14", "chapterId": 20, "chapter": "Spirochetes", "number": 14, "text": "Which one of the following micro-organisms uses antigenic variation as a major means of\nevading the host immune system?", "options": [{"id": "A", "text": "Treponema pallidum"}, {"id": "B", "text": "Borrelia recurrentis"}, {"id": "C", "text": "Leptospira"}, {"id": "D", "text": "Listeria"}], "correctIndex": 1, "correctLetter": "B", "solution": "Borrelia recurrentis uses antigenic variation as a major means of evading the host immune\nsystem. It causes relapsing fever.\nBorrelia readily undergoes antigenic variations in vivo and this is believed to be the reason for the\noccurrence of relapses in the disease. Antigenic variations occur because of DNA rearrangements\nin linear plasmids present in borrelia.", "questionPages": [320, 321], "solutionPages": [331], "questionFigures": [], "solutionFigures": []}, {"id": "ch20-q15", "chapterId": 20, "chapter": "Spirochetes", "number": 15, "text": "A 23 year old presented with fever, myalgia, and skin lesion as shown in the image. What is\nthe causative organism for the above condition?", "options": [{"id": "A", "text": "Orientia tsutsugamoshi"}, {"id": "B", "text": "Ehrlichia chaffeensis"}, {"id": "C", "text": "Borrelia burgdorferi"}, {"id": "D", "text": "Coxiella burnetti"}], "correctIndex": 2, "correctLetter": "C", "solution": "The image shows erythema migrans, seen in Lyme disease. It is caused by Borrelia Burgdoferi.\nThe lesion has a target center with partial central clearing and a bright red outer border. It\nusually begins as a red macule or papule at the site of the tick bite.\nThe tick implicated is the black-legged tick, Ixodes scapularis, shown in the image below.\n\n\n\nThe most severe manifestation of Lyme disease is Lyme neuroborreliosis (LNB), reported in\n10-15% of individuals with localized erythema migrans. The activation of the inflammatory\nresponse in LNB contributes to the pathogenesis of a broad spectrum of neurologic disorders.", "questionPages": [321], "solutionPages": [331, 332], "questionFigures": ["crop-question-ch20-q15-1"], "solutionFigures": ["crop-solution-ch20-q15-1"]}, {"id": "ch20-q16", "chapterId": 20, "chapter": "Spirochetes", "number": 16, "text": "Following a flood, there is an outbreak of fever. Water samples from various sources are\nbeing studied for pathogens. The bacteria shown in the given image was isolated as a\npotential cause of disease. Which of the following animals is the most important reservoir of\nthese organisms?", "options": [{"id": "A", "text": "Rat"}, {"id": "B", "text": "Cat"}, {"id": "C", "text": "Fish"}, {"id": "D", "text": "Dog"}], "correctIndex": 0, "correctLetter": "A", "solution": "The electron micrograph shows the spirochete, Leptospira interrogans, which causes the\nwater-borne disease, leptospirosis. Rats are the most important reservoir.\nTransmission of leptospires may follow direct contact with urine, blood, or tissue from an infected\nanimal or exposure to environmental contamination.", "questionPages": [321, 322], "solutionPages": [332], "questionFigures": ["crop-question-ch20-q16-1"], "solutionFigures": []}, {"id": "ch20-q17", "chapterId": 20, "chapter": "Spirochetes", "number": 17, "text": "A farmer who works in paddy fields presented with fever, intense myalgia, and hematochezia.\nLab investigations showed sharply elevated creatinine levels and high liver enzymes. What is\nthe causative organism?", "options": [{"id": "A", "text": "Leptospira"}, {"id": "B", "text": "Borrelia"}, {"id": "C", "text": "Legionella"}, {"id": "D", "tex
